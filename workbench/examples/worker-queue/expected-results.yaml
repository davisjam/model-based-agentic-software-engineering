# Expected results for the worker-queue example. Read by test/examples.test.ts, which drives the
# real application seams and compares.
#
# Fixture discipline per section 10: semantic outcomes only. For a behavioral trace that means the
# outcome, the coverage KIND, the final configuration, and label counts that carry the bound --
# never the exact step count (which moves if the engine's BFS tie-breaking changes) and never the
# number of configurations explored (which moves if a state is added anywhere).

example: worker-queue
system: system.mage.yaml
title: Worker Queue
summary: >
  Explore a leased job queue through linked lifecycle, custody and worker-pool models, and see where
  safety and bounded progress part company.

# Purposeful models for the EX-I2 check. Two machines and one graph model: a machine carries a
# `purpose` exactly as a graph model does, so a count that looked only at `system.models` would
# report this example as having one model and would be wrong.
models:
  - id: job-lifecycle
    kind: machine
  - id: job-lease
    kind: machine
  - id: worker-pool
    kind: graph

requirements:
  - id: processing-implies-custody
    statement: >
      The job is never in processing unless some worker holds its lease.
    expressed_as: lease-held-while-processing
    satisfied_when: holds
    status: satisfied
    note: >
      Established by exhaustive exploration of a finite transition system. That is the whole claim:
      every reachable configuration was enumerated and none violates the predicate. The modification
      below breaks it on demand, which is what distinguishes a property that holds from one that is
      never tested.

  - id: retry-policy-bounds-every-execution
    statement: >
      No reachable execution stays in the retry loop forever; a job that keeps failing reaches
      dead_letter.
    expressed_as: job-can-retry-forever
    satisfied_when: refuted
    status: satisfied
    note: >
      Stated carefully. The engine refuted the existence of a repeatable configuration across an
      exhaustively explored finite space, because retry_count strictly advances inside a declared
      finite domain. That is NOT temporal liveness verification and must not be described as such --
      MAGE declares no fairness assumptions and has no infinite-trace operators. The companion
      question `job-returns-to-queued` holds, and the pair is the honest answer: the job can come
      back, and it cannot come back forever.

queries:

  - id: completed-is-reachable
    label: A job can reach completed
    suggested: true
    models: [job-lifecycle, job-lease]
    expected:
      outcome: holds
      coverage: exhaustive
      evidence:
        shape: trace
        role: witness
        min_steps: 3
        final:
          job-lifecycle.state: completed
          job-lease.state: free
    note: >
      Nominally a single-model question, but the witness needs both: `claim` and `release` are
      declared events, so the lifecycle cannot step into claimed or out of processing unless the
      lease machine offers its half of the synchronization. The trace shows the lease returning to
      free as the job completes, in the same step.

  - id: dead-letter-is-reachable
    label: A job can reach dead_letter
    suggested: true
    models: [job-lifecycle, job-lease]
    expected:
      outcome: holds
      coverage: exhaustive
      evidence:
        shape: trace
        role: witness
        min_steps: 16
        labels_at_least:
          retry: 3
        final:
          job-lifecycle.state: dead_letter
          job-lifecycle.retry_count: 3
    note: >
      The bound, witnessed. Three retries and no more: the counter saturates its declared domain and
      `give-up` is the only transition `failed` still offers. `labels_at_least` pins the count of
      retry steps rather than the total step count, because the retry count is the semantic content
      and the total is an artifact of how the trace reaches the counter.

  - id: dead-letter-within-a-tiny-budget
    label: dead_letter is reachable within a two-configuration search budget
    suggested: false
    models: [job-lifecycle]
    expected:
      outcome: inconclusive
      coverage: bounded
      coverage_reason: state-limit
      no_evidence: true
    note: >
      The same question as the entry above, asked with a budget two configurations wide. V22 in its
      sharpest form: the search was truncated with work outstanding, so the outcome is
      `inconclusive` and the coverage is `bounded` with the reason named. It must never render as
      "no" -- dead_letter plainly IS reachable, as the unbudgeted query shows, and a result that
      said otherwise would be unsound rather than merely unhelpful.

      Shipped as a supplied query rather than left to a unit test because the distinction between
      "not found" and "not there" is one a student has to see the workbench make.

  - id: job-can-retry-forever
    label: A job can stay in the retry loop indefinitely
    suggested: true
    models: [job-lifecycle]
    expected:
      outcome: refuted
      coverage: exhaustive
      no_evidence: true
    note: >
      `repeatable-cycle` asks for a genuinely repeated CONFIGURATION. There is none, because every
      pass through the retry loop advances retry_count. Refuted under exhaustive coverage, which is
      an exhaustive statement about a finite space and nothing stronger.

  - id: job-returns-to-queued
    label: A job can return to queued after failing
    suggested: false
    models: [job-lifecycle, job-lease]
    expected:
      outcome: holds
      coverage: exhaustive
      evidence:
        shape: lasso
        role: witness
        cycle_min_steps: 4
        labels_at_least:
          retry: 1
    note: >
      The companion to the question above, and the reason the engine has two forms rather than one
      that guesses. Re-entry holds; repeatability does not. The evidence is a lasso whose cycle is
      the queued-to-queued segment, and retry_count is one higher at the end of it than at the
      start -- which is exactly why the same loop is not repeatable.

  - id: lease-held-while-processing
    label: The job is never in processing while no worker holds its lease
    suggested: true
    models: [job-lifecycle, job-lease]
    expected:
      outcome: holds
      coverage: exhaustive
      no_evidence: true
    note: >
      THE cross-model safety property. `processing` is a lifecycle state; `free` is a lease state;
      no single model can state the conjunction. Universal, so exhaustive satisfaction establishes it
      and a counterexample refutes it. Held non-vacuously: both conjuncts are individually
      reachable, and the modification below produces the counterexample on demand.

      It is carried JOINTLY -- by the `claim` synchronization and by the guard on
      `claimed -> processing` -- and by construction rather than by either declaration alone. No
      single deletion exhibits the violation, and all three attempts are measured:

      Delete the guard and all eight answers above stay put: `claim` is the only route into
      `claimed` and it steps the lease out of `free` in the same system transition, so the guard
      never meets a configuration to reject. Delete `sync: claim` and the engine refuses the system
      outright -- job-lifecycle becomes a declared participant of `claim` that never participates,
      which is V12 and a modeling error rather than a counterexample. Delete the
      `claimed -> processing` transition and `processing` goes unreachable, so this query still
      answers `holds` under exhaustive coverage while `completed-is-reachable` turns `refuted`:
      green for the want of a witness, with no disclosure, because V44 reserves vacuity for an
      unsatisfiable predicate and this predicate is satisfiable.

      Which is why the modification below ADDS a route that skips `claim` rather than editing
      anything, and why its repair guards the NEW transition. The repair's own note already says the
      right thing -- the guard, not the absence of the transition, is what carries the invariant --
      and that is the arm which earns the existing guard its place.

  - id: two-workers-own-one-job
    label: Two workers can simultaneously own the same job
    suggested: false
    models: [job-lease]
    expected:
      outcome: refuted
      coverage: exhaustive
      no_evidence: true
    note: >
      Refuted, and VACUOUSLY so -- which matters more than the outcome. One machine has one control
      state, so `held-by-0 and held-by-1` is unsatisfiable in the state vector and no transition was
      consulted to decide it. The sound reading is that the lease model makes dual ownership
      unrepresentable. That is stronger than "it does not happen here" and weaker than "two owners
      were searched for and not found", and a reader who takes it for the latter has been misled by
      a correct answer.

  - id: is-the-scheduler-fair
    label: The scheduler gives both workers a turn
    suggested: true
    models: [job-lifecycle, job-lease, worker-pool]
    expected:
      outcome: unlicensed
      coverage: not-applicable
      refusal_contains: "not about this model's vocabulary"
      no_evidence: true
    note: >
      Purposeful omission (section 7), executed. Fairness needs a scheduler and a dispatch step, and
      this system declares neither, so the engine refuses and names the missing vocabulary. Two
      things it is NOT: it is not a claim that the scheduler is unfair, and it is not derived from
      the `omits` lists -- no refusal path consults them.

      There is a further gap behind that. V24 checks `omits` against a model's real vocabulary only
      for GRAPH models: `checkMeaning` iterates `system.models` and never `system.machines`. Both
      machines here declare omissions that the shipped validator does not check, so
      test/examples.test.ts implements the missing check for these examples.

modifications:

  - id: begin-processing-without-the-lease
    label: Let processing begin before the lease is acquired
    rationale: >
      Section 6.7. An unguarded `queued -> processing` transition is the fault a real queue has when
      a worker short-circuits the claim. It bypasses the `claim` event, so the lease never leaves
      `free`. One step is enough to refute the invariant, and the counterexample names the step.
    transaction:
      operations:
        - op: add-transition
          machine: job-lifecycle
          from: queued
          to: processing
          label: steal
    changes:
      - query: lease-held-while-processing
        from: holds
        to: refuted
    counterexample:
      shape: trace
      role: counterexample
      min_steps: 1
      labels_at_least:
        steal: 1
      final:
        job-lifecycle.state: processing
        job-lease.state: free

  - id: repair-the-stolen-transition
    label: Require lease ownership before processing begins
    rationale: >
      The second half of section 6.7. The same transition with the guard the others carry, which is
      the repair an agent would propose as a hypothesis for a student to inspect. Re-running the
      safety query re-establishes the property, which also shows the guard -- not the absence of the
      transition -- is what carries the invariant.
    transaction:
      operations:
        - op: add-transition
          machine: job-lifecycle
          from: queued
          to: processing
          label: steal
          requires:
            job-lease.state:
              ne: free
    changes:
      - query: lease-held-while-processing
        from: holds
        to: holds

# ---------------------------------------------------------------------------
# Declarations that are DOCUMENTATION on purpose (test/semantic-live.test.ts).
#
# That gate deletes every guard, relation type and property in this example, re-runs every saved
# question and every requirement, and asks whether an answer moved. A declaration whose removal
# moves nothing is inert -- fine in itself, and a defect the moment prose calls it the thing that
# carries a result. A row here is a CLAIM the gate measures: labelled inert and measured
# live is reported too, so a layer that later starts deciding something cannot keep this label.
#
# `guard:job-lifecycle/claimed->processing` is deliberately NOT here. It is inert and the prose above
# calls it causal, which is the defect, and a row saying "documentation on purpose" would be the
# allowlisting the finding exists to prevent. It is quarantined in the gate's own pinned set until
# the prose is corrected.
# ---------------------------------------------------------------------------

declarations:

  - id: retry-guard-restates-the-declared-domain
    subject: guard:job-lifecycle/failed->queued
    inert: true
    held_by: stronger-declaration
    reason: >
      `retry_count < 3` restates the bound that `range: [0, 3]` already carries. The transition's
      effect is `retry_count + 1`, and a step whose effect would leave a variable's declared finite
      domain is SKIPPED rather than clamped, so the domain alone stops the fourth retry and the
      guard never decides a reachable step. Kept because it states the policy where a reader of the
      transition looks, and because the bound would otherwise be legible only from the variable
      declaration -- but the progress claim rests on the finite domain, which is exactly how the
      requirement note above words it.

  - id: lease-state-join-is-held-by-a-control
    subject: property:holds_lease_as
    inert: true
    held_by: parity-control
    reason: >
      The join from a worker entity to the lease state representing its custody. No saved question
      reads it: every behavioural query names `job-lease.state` directly. It is held instead by the
      cross-model join check in test/examples.test.ts, which asserts every non-free lease state is
      claimed by exactly one worker entity -- so the two models cannot disagree about who exists.
      A parity control rather than an answer, which is the only rung available when the IR cannot
      express the join itself.

  - id: permission-to-claim-is-not-scheduling
    subject: relation:worker-pool/may_claim
    inert: true
    held_by: the-reader
    reason: >
      The permitted-claim structure, and the one question that touches it -- `is-the-scheduler-fair`
      -- is answered `unlicensed` because this system declares no scheduler and no dispatch step.
      So no answer moves when the edges go, and that is the example's lesson rather than a gap: the
      pool says who MAY claim, and nothing here represents who does. An edge set that decided a
      verdict would make permission look like scheduling.
