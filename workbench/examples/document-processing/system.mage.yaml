# Document Processing -- MAGE default example 2 of 3.
#
# Central lesson: a model useful for reasoning about workflow is not necessarily useful for
# reasoning about performance. The lifecycle decides WHICH stages execute and HOW OFTEN; the
# performance model decides WHAT EACH EXECUTION COSTS. Neither answers the latency question alone.
#
# Two purposeful models over one identity namespace:
#
#   document-lifecycle   a state machine. What states can a document enter, and what must occur
#                        before publication? Carries the bounded retry counter.
#   pipeline-performance a graph. Which stage costs what, and which stages hold memory while they
#                        run? Carries every quantity and the declared accounting.
#
# They join on the `document` entity and on the state names: each stage entity declares the
# lifecycle state during which it executes (`executes_in_state`), and the remediation memory charge
# names that state in its `when:` clause. That join is the example's point.
#
# ## This file is the first model written against the accounting rulings (V35-V37)
#
# Two declarations do the work, and both are AUTHORED rather than inferred:
#
#   accounting.latency.basis: entities   -- an execution's latency is the sum over each OCCURRENCE
#                                           of an accounted entity along it. Latency on a
#                                           transition, a relation or a state is a V36 finding.
#   residency / when                     -- every memory quantity declares exactly one. Neither is
#                                           a V37 finding, because the quantity would then enter
#                                           neither summand of memory(c).
#
# A retry charges Remediate again because the trace VISITS that entity again. No quantity anywhere
# encodes a retry cost, and asking for one would be the double-counting the rulings refused.
#
# ## Known divergences, reported rather than worked around
#
# A machine carries no annotation at all -- `CanonMachine` has no `annotation` field -- so the
# rationale the requirements' section 8 asks for lives on the `document` entity the machine names.
# That is the honest workaround worker-queue already uses, not the intended home; the intended home
# is an annotation slot on the machine.
#
# `python3 validate.py` and the TypeScript engine used to disagree about `stages-of-this-document`,
# and this header's account of WHY was wrong. It said Python read `stage_of`'s
# `composition.path: forbidden` as gating `predecessors`. It never consulted `composition.path` for
# that form; it refused for SCOPE, having built the adjacency that answers the question and then
# declining to read it. The two tools agreed about the meaning of `predecessors` all along.
#
# Both answer `holds` now, with identical witnesses, and `test/parity.test.ts` compares the ANSWERS
# rather than only the findings -- which is what let the disagreement live under a green build.
# SEMANTICS.md §3.1 writes V7's composing set out as exhaustive, with a row per other form.
#
# One outcome difference survives, on `restricted-data-reaches-impermitted-subscriber` in
# message-bus: validate.py has no `where`-clause join evaluator and refuses that query for scope.
# The parity test derives that exemption from the query rather than listing ids, so it shrinks when
# the gap closes.
#
# The headers of message-bus and worker-queue report SCHEMA findings for `notes:` and the IR-shaped
# `provenance:`. Both keys now appear in mage-model.schema.json and `python3 validate.py` reports all
# three examples clean, so those two headers are stale. This one does not repeat the claim.
#
# ## The six execution-cost questions, and the two of them this model cannot be asked
#
# `Examples and Semantic Completion` §12.3 lists six. Four ship as saved queries above, and the
# other two are recorded here because a question nobody can ask is worth more written down than
# quietly dropped.
#
#   Q1 nominal successful latency          nominal-successful-latency                725 ms
#   Q2 the CHEAPEST successful execution   NOT EXPRESSIBLE -- a minimum, see below
#   Q3 maximum over any execution          max-latency-of-any-execution            2,750 ms
#   Q4 maximum among successful ones       max-latency-among-successful-executions 2,750 ms
#   Q5 all successful within 2 s           successful-executions-within-two-seconds refuted
#   Q6 which execution violates it         Q5's counterexample -- no separate query
#
# **Q2 asks for a minimum, and the query surface offers no aggregation selector at all.** The
# aggregation is derived from the dimension's scope -- execution-scoped metrics sum along an
# execution and MAXIMIZE over them -- and the §29 refinement's `max|min|named` selector was
# rejected rather than deferred, so `target` can say which executions to measure and nothing can
# say to take their least. Declaring an API cost would not help: it would make the metric's figure
# real and still leave it a maximum. The question is refused by the SHAPE of the surface, which is
# a different thing from the cache's missing hit frequency below -- that one is refused by the
# model's own declaration, and modeling the frequency would answer it.
#
# **Q3 and Q4 answer with the SAME figure, 2,750 ms, and §12.1's lesson predicts otherwise.** Both
# were measured; the equality is real and it is structural. Entity accounting charges a visit to an
# entity whose `executes_in_state` names the state the trace enters, and `publish` and `failed` are
# both free edges out of `validating`. So the execution that exhausts its retries and the execution
# that publishes on the last one have identical occurrence vectors, and the unselected maximum's
# witness happens to BE a publishing execution. The selection moves the WITNESS's final
# configuration and not the magnitude.
#
# The selection is not idle, though, and `test/example-pipeline-questions.test.ts` measures the
# spread that shows it: selecting on `parsing` gives 50 ms, on `remediating` 2,675 ms, on
# `validating`, `waiting` and `published` 2,750 ms. A reader who wants Q3 and Q4 to differ needs a
# failure path that CHARGES differently -- a component executing in a state only the failure path
# visits -- which is model content this example does not have.
#
# A CEILING is not a requirement, and the two are declared separately. Each ceiling is a
# `model:`-targeted quantity, which is what the `model:` exemption in SEMANTICS.md 5.3 exists for:
# a declared TOTAL that a requirement is compared against, charged by no basis. Three of them ship
# -- 750 ms on normal processing, 512 MB on peak memory, 2 s on an execution that publishes -- and
# a `kind: quantity` query decides each one: `within:` names the ceiling, the aggregation is derived
# from the dimension's scope, and the computed figure travels on `result.magnitude`.
# expected-results.yaml still carries the arithmetic by hand, as the oracle the product's answers
# are compared against.
#
# The OBLIGATIONS that cite those ceilings are a separate declaration, in the `requirements:` block
# at the foot of this file. All but one are there, each naming the saved query that decides it. The
# `normal-processing-latency` obligation keeps its fixture declaration on purpose, and the block's
# own comment says why -- the reason is what a second latency ceiling would teach a student, not a
# limit on what `expressed_as` can name.

mage: 1

system:
  id: document-processing
  name: Document Remediation Pipeline
  description: >
    A document-remediation pipeline with a bounded retry policy, modeled twice: as the lifecycle a
    document passes through, and as the latency and memory each stage costs when it runs.

relation-types:

  stage_of:
    description: The component performs one stage of this document's processing.
    absence: >
      The component performs no stage of this document's processing. Absence says nothing about
      whether the component exists or runs for some other reason -- a cache attached to a stage is
      not itself a stage.
    composition:
      # A stage of a stage is not a thing. The target of `stage_of` is the document, and a document
      # stages nothing, so a multi-hop question comes back unlicensed rather than false.
      path: forbidden
    properties:
      symmetric: false
      acyclic: true

  precedes:
    description: The design runs the source stage before the target stage.
    absence: >
      No ordering between the two stages is represented. It does NOT follow that they run
      concurrently: this model represents the pipeline's shape, not its scheduling.
    composition:
      # Pipeline order composes: if parse precedes remediate and remediate precedes validate, then
      # parse runs before validate. Reachability through `precedes` is a meaningful question.
      path: allowed
    properties:
      symmetric: false
      acyclic: true

  invokes:
    description: The source stage calls the target component while it runs.
    absence: No synchronous call is represented.
    composition:
      # A call chain is meaningful, so multi-hop is licensed.
      path: allowed
    properties:
      symmetric: false
      acyclic: true

  caches_for:
    description: The cache sits in front of the component and serves some of its requests.
    absence: No cache is represented in front of that component.
    composition:
      # A cache of a cache is not represented here, and nothing would be asserted by composing two
      # of these edges.
      path: forbidden
    properties:
      symmetric: false
      acyclic: true

# ---------------------------------------------------------------------------
# THE identity namespace. Ids are immutable (V2).
#
# `executes_in_state` is the join that makes entity accounting work: it names the lifecycle state
# during whose occupancy this component runs, so a trace that visits the state charges the
# component. The value is checked against the machine's declared states by
# test/examples.test.ts -- the IR cannot hold that join itself.
#
# Two components share one state. `remediation` and `model-gateway` both execute during
# `remediating`, because the lifecycle preserves no distinction between remediating and calling the
# gateway. That is the lesson rather than a defect: the behavioral model is coarser than the
# performance model needs, and shared identity still lets the two join.
# ---------------------------------------------------------------------------
entities:

  document:
    type: document
    label: Document
    notes:
      # The machine's rationale lives here. `CanonMachine` has no `annotation` field, so `notes:` on
      # a machine would load as nothing -- the same honest workaround worker-queue uses.
      - id: document-lifecycle-rationale
        kind: rationale
        text: >
          The document-lifecycle machine represents the states a document passes through and the
          bounded retry policy governing re-validation. It is the model that supplies EXECUTIONS:
          which stages run, in what order, and how many times. It deliberately represents no
          duration, no memory and no wall-clock time, so no question about cost has a reading here
          -- that is what the performance model is for.
      - id: document-performance-rationale
        kind: rationale
        text: >
          The pipeline-performance model represents what each stage costs and holds. It supplies
          COSTS and no executions: it has no notion of order of occurrence and cannot say how many
          times remediation runs. Asking it for the latency of a document is a category error; the
          number exists only over an execution the lifecycle supplies.
      - id: shared-identity
        kind: comment
        text: >
          Both models name this entity, and the performance model's components name this machine's
          states. The two are reductions of one pipeline rather than unrelated diagrams.
      - id: retry-charge-is-not-authored
        kind: comment
        text: >
          Nothing in this file encodes the cost of a retry. A retry charges Remediate and the
          gateway again because the behavioral trace visits those components again, which is the Q2
          ruling's whole mechanism: shared identity connects purposeful models, it does not
          accumulate their annotations.
    provenance:
      created_by: mage-example
      prompt: >
        Model a document-remediation pipeline twice -- as a bounded-retry lifecycle and as a
        quantitative performance model over the same components -- so that the maximum latency of a
        publishing document needs both, and so that an omitted cache hit rate makes an
        expected-latency question unanswerable.
      rationale: MAGE-provided example, document-processing, version 1.

  parser:
    type: service
    label: Parse
    properties:
      executes_in_state: parsing

  remediation:
    type: service
    label: Remediate
    properties:
      executes_in_state: remediating

  model-gateway:
    type: service
    label: Model Gateway
    properties:
      # The gateway runs inside remediation, so it shares that state. The lifecycle has no separate
      # state for a gateway call and does not need one.
      executes_in_state: remediating

  gateway-cache:
    type: cache
    label: Gateway cache
    # No `executes_in_state`: a cache is not a stage. Its memory is charged by residency, not by the
    # occupancy of a lifecycle state, and the suite checks that only latency-bearing components
    # declare a stage.
    notes:
      - id: cache-hit-frequency-is-omitted
        kind: assumption
        text: >
          This cache is represented, and the cost of a hit and the cost of a miss are both
          representable from the gateway's declared range. Its HIT FREQUENCY is not represented and
          is not meant to be: an expected latency is a weighted average, and the weights are the one
          thing this model declines to supply. The suggested question
          `expected-latency-with-the-cache` asks for exactly that average, and the engine refuses it
          by name.

  validator:
    type: service
    label: Validate
    properties:
      executes_in_state: validating

# ---------------------------------------------------------------------------
# The declared accounting model (Q2 ruling, V35/V36).
#
# One basis per path-aggregated metric, and the vocabulary is closed at one member for v0.1 so that
# adding transition or relation accounting later is a deliberate act. Under `entities`, an
# execution's latency is the sum of the latency assigned to each OCCURRENCE of an accounted entity
# along the execution; a `duration` on a transition, a relation or a state contributes to nothing
# and is a V36 finding rather than silently inert.
# ---------------------------------------------------------------------------
accounting:
  latency:
    basis: entities

# ---------------------------------------------------------------------------
# Quantities (requirements section 5.4), as annotations OVER the model and never part of it.
#
# Six annotations, two declarations, one exemption:
#
#   four `duration` on entities    charged per occurrence along a trace (basis: entities)
#   one `memory` with `when:`      charged exactly while that state is active
#   one `memory` with `residency:` charged in every configuration where the entity exists
#   three `model:` totals          the declared requirements, charged by no basis
#
# The gateway's 100-500 ms range is the only interval here, and it is where a maximum comes from:
# the maximum modeled latency takes its high end, every occurrence.
# ---------------------------------------------------------------------------
quantities:

  parse-latency:
    target: entity:parser
    dimension: duration
    value: 50 ms
    description: One parse of one document.

  remediate-latency:
    target: entity:remediation
    dimension: duration
    value: 100 ms
    description: One remediation pass, excluding the gateway call it makes.

  gateway-latency:
    target: entity:model-gateway
    dimension: duration
    range: [100 ms, 500 ms]
    description: One gateway call. The interval is modeled; its distribution is not.

  validate-latency:
    target: entity:validator
    dimension: duration
    value: 75 ms
    description: One conformance validation pass.

  remediation-memory:
    target: entity:remediation
    dimension: memory
    value: 256 MB
    # Charged exactly while the document is remediating. Residency is never inferred: "idle service
    # memory stays resident" and "idle service memory disappears" are both guesses MAGE refuses to
    # make, so the annotation names the behavioral thing whose activation licenses the charge.
    when:
      state: document-lifecycle.remediating
    description: Held by remediation while it runs, released when it finishes.

  cache-memory:
    target: entity:gateway-cache
    dimension: memory
    value: 128 MB
    residency: resident
    description: Held in every configuration. A cache that emptied between documents would not be one.

  # The two requirements of section 5.4, as declared model content.
  #
  # MAGE v0.1 has no `requirements:` construct, and a `model:` quantity is what the semantics offer
  # instead: a declared TOTAL that a requirement is compared against, exempt from every accounting
  # basis because nothing sums it per occurrence (SEMANTICS.md 5.3). A `kind: quantity` query with
  # `within:` naming one of these decides it against the computed total.
  latency-requirement:
    target: model:pipeline-performance
    dimension: duration
    value: 750 ms
    description: Required normal processing latency, as a declared ceiling.

  peak-memory-requirement:
    target: model:pipeline-performance
    dimension: memory
    value: 512 MB
    description: Required peak memory over reachable configurations, as a declared ceiling.

  # The second declared ceiling, and the one the cross-domain question is decided against.
  #
  # `latency-requirement` above governs NORMAL processing -- the retry-free execution, which is what
  # its 750 ms was chosen for. This one governs the executions that PUBLISH, retries and all, and it
  # is written in SECONDS while every charge is written in milliseconds: the comparison is 2,750 ms
  # against 2,000 ms by the `s` conversion factor, so a reader who assumes two ceilings of one
  # dimension must share a unit learns otherwise from the verdict.
  successful-latency-requirement:
    target: model:pipeline-performance
    dimension: duration
    value: 2 s
    description: >
      Required latency of an execution that reaches published, retries included, as a declared
      ceiling.

machines:

  document-lifecycle:
    label: Document Lifecycle
    entity: document
    purpose:
      question: What states can a document enter, and what must occur before publication?
      represents:
        - document lifecycle states
        - the bounded retry counter
        - that publication follows validation and nothing else
        - re-validation after a failed validation
      # NOTE: V24 checks `omits` only against a GRAPH model's vocabulary -- `checkMeaning` iterates
      # `system.models` and never `system.machines`. test/examples.test.ts implements the missing
      # check for these examples so this list cannot decay into decoration.
      omits:
        - how long any state lasts
        - how much memory any stage holds
        - retry backoff delay and wall-clock scheduling
        - the disposition of a document that exhausts its retries
        - concurrent documents and queue depth
    initial: uploaded
    states:
      uploaded:
      parsing:
      remediating:
      validating:
      waiting:
      published:
    variables:
      retry_count:
        type: integer
        # A finite domain is mandatory (V17), and it is what bounds the number of remediation passes
        # -- which is what makes a MAXIMUM latency exist at all. An unbounded retry policy has no
        # maximum modeled latency, and the model would have to refuse the question.
        range: [0, 3]
        initial: 0
    derived:
      # Recomputed, never stored, never part of state identity (V18).
      retries_exhausted: retry_count == 3
    transitions:

      # Index 0.
      - from: uploaded
        to: parsing
        label: parse

      # Index 1.
      - from: parsing
        to: remediating
        label: remediate

      # Index 2.
      - from: remediating
        to: validating
        label: validate

      # Index 3. The ONLY edge into published, which is what makes the safety question decidable.
      # The section 5.6-style modification in expected-results.yaml adds a second one and the answer
      # flips.
      - from: validating
        to: published
        label: publish

      # Index 4.
      - from: validating
        to: waiting
        label: failed

      # Index 5. The retry, and the only transition that advances the counter. Deleting it is the
      # second declared modification: with no retry the lifecycle supplies one remediation pass, and
      # the maximum latency becomes the retry-free latency.
      - from: waiting
        to: remediating
        label: retry
        requires:
          retry_count: { lt: 3 }
        effects:
          retry_count: retry_count + 1

models:

  pipeline-performance:
    type: graph
    label: Pipeline Performance
    purpose:
      question: Does document processing satisfy the modeled latency and memory requirements?
      represents:
        - pipeline stage identity
        - pipeline order
        - the gateway call remediation makes
        - the cache in front of the gateway
        - per-stage latency
        - memory held while remediating, and memory held always
        - the declared latency and peak-memory ceilings
        - the declared two-second ceiling on an execution that publishes
      # Checked against this model's real vocabulary (V24). The first entry is the flagship
      # purposeful omission: the hit and miss costs are both representable, and their FREQUENCIES
      # are deliberately absent, so an expected latency has no reading here.
      omits:
        - cache hit frequency
        - the distribution of the gateway latency within its declared range
        - upload and publication latency
        - CPU, disk and network as separate resources
        - how many documents run at once
    entities: [document, parser, remediation, model-gateway, gateway-cache, validator]
    notes:
      - id: pipeline-performance-rationale
        kind: rationale
        text: >
          This model represents cost and holds no executions. It names the same components the
          lifecycle's states correspond to, and it says what one occurrence of each costs. It cannot
          say how many occurrences there are, which is why the maximum-latency question needs the
          lifecycle: the retry bound lives there, and the bound is what makes a maximum exist.
      - id: entity-accounting-is-declared
        kind: comment
        text: >
          Every latency annotation sits on an ENTITY, under a declared `accounting.latency.basis:
          entities`. That is not a style preference. Summing across kinds would make the meaning of
          a model depend on whether the author happened to represent the same operation in two
          linked models, so a `duration` on a transition or a relation is a V36 finding here.
      - id: memory-is-a-configuration-property
        kind: comment
        text: >
          memory(c) = the sum of resident charges plus the sum of charges whose named state is
          active in c. Both summands are keyed on a declaration, so `remediation-memory` carries a
          `when:` and `cache-memory` carries `residency: resident`. The reading this produces:
          during remediation 384 MB, outside it 128 MB.
      - id: requirements-are-declared-totals
        kind: comment
        text: >
          `latency-requirement`, `peak-memory-requirement` and `successful-latency-requirement`
          target `model:`, which exempts them from every accounting basis -- nothing charges them
          per occurrence, because a requirement is compared against a computed total rather than
          summed into it. A ceiling is the NUMBER an obligation cites, never the obligation: the
          obligations are in this file's `requirements:` block, and each names the query that
          decides it.
      - id: a-selection-is-not-an-aggregation
        kind: comment
        text: >
          The two latency ceilings differ in WHICH executions they govern and not in how those
          executions are aggregated. `latency-requirement` is decided over every execution;
          `successful-latency-requirement` is decided over the executions a lifecycle predicate
          selects. A reader looking for where to say "take the minimum instead" will not find it,
          and that is deliberate: the aggregation follows the dimension's scope, so a question
          about the cheapest execution has no form here.
    provenance:
      created_by: mage-example
      prompt: >
        Attach section 5.4's latency and memory quantities to the pipeline components, declare the
        accounting basis and each memory charge's residency, and declare the two requirements as
        model-level totals.
      rationale: MAGE-provided example, document-processing, version 1.
    relations:

      - id: parser-stage-of-document
        from: parser
        to: document
        type: stage_of
      - id: remediation-stage-of-document
        from: remediation
        to: document
        type: stage_of
      - id: gateway-stage-of-document
        from: model-gateway
        to: document
        type: stage_of
      - id: validator-stage-of-document
        from: validator
        to: document
        type: stage_of

      - id: parse-precedes-remediate
        from: parser
        to: remediation
        type: precedes
      - id: remediate-precedes-validate
        from: remediation
        to: validator
        type: precedes

      - id: remediation-invokes-gateway
        from: remediation
        to: model-gateway
        type: invokes

      - id: cache-caches-for-gateway
        from: gateway-cache
        to: model-gateway
        type: caches_for

# ---------------------------------------------------------------------------
# Saved queries. Expected outcomes live in expected-results.yaml -- one source of truth, because the
# fixture also carries the models each question needs and the evidence it must produce.
# ---------------------------------------------------------------------------
queries:

  # Section 5.3's safety query. `refuted` under exhaustive coverage establishes it: no reachable
  # execution reaches published while avoiding validating, because index 3 is the only edge in.
  publish-without-validating:
    name: A document can be published without reaching validating
    kind: behavior
    quantifier: exists
    behavior:
      form: reach
      target:
        document-lifecycle.state: published
      avoid:
        document-lifecycle.state: validating

  # Section 5.3's behavioral query, asked in the only form that denotes it. `repeatable-cycle` asks
  # for a genuinely repeated CONFIGURATION; `refuted` under exhaustive coverage says no reachable
  # execution can retry forever, because retry_count strictly advances within a finite domain.
  #
  # That is an exhaustive statement about a finite transition system. It is not temporal liveness.
  retry-forever:
    name: Processing can continue retrying indefinitely
    kind: behavior
    quantifier: exists
    behavior:
      form: repeatable-cycle
      target:
        document-lifecycle.state: remediating

  # The honest companion. A document CAN return to remediating -- that is re-entry, and the evidence
  # is a lasso. It cannot do so forever.
  document-returns-to-remediating:
    name: A document can return to remediating after a failed validation
    kind: behavior
    quantifier: exists
    behavior:
      form: recurrence
      target:
        document-lifecycle.state: remediating

  # The retry-free execution. Its witness trace is the one whose latency the 750 ms ceiling is meant
  # to govern, and expected-results.yaml pins the per-stage occurrence counts along it.
  document-publishes:
    name: A document can reach published
    kind: behavior
    quantifier: exists
    behavior:
      form: reach
      target:
        document-lifecycle.state: published

  # THE cross-model execution, and the reason the lifecycle carries a bounded counter. Pinning
  # retry_count to its ceiling selects the publishing execution with the most remediation passes,
  # which is the execution the maximum-latency question is about. The lifecycle supplies the trace;
  # the performance model supplies what each visit costs; neither alone is sufficient.
  publishes-after-three-retries:
    name: A document can publish having used every permitted retry
    kind: behavior
    quantifier: exists
    behavior:
      form: reach
      target:
        all-of:
          - document-lifecycle.state: published
          - document-lifecycle.retry_count: 3

  # -------------------------------------------------------------------------------------------
  # The four questions a reader asks about execution COST, saved so the example answers them
  # itself rather than only through a suite.
  #
  # Each is a `kind: quantity` query, and none of them chooses an aggregation: the query surface
  # has no such key, because the aggregation is DERIVED from the dimension's scope. `duration` is
  # execution-scoped, so the reading is "sum along an execution, maximize over executions" -- and
  # a `target` therefore selects WHICH executions, never how they combine.
  #
  # That is where the cross-domain composition lives, and it is one key wide. `target` is the
  # behavioural half of `max-latency-among-successful-executions` below: a lifecycle predicate
  # fixes the DOMAIN, and the quantitative dialect still returns its own kind of answer.
  # -------------------------------------------------------------------------------------------

  # The nominal successful execution. `retry_count: 0` is what identifies it -- not a shorter
  # trace, a trace that published without ever failing validation.
  nominal-successful-latency:
    name: The retry-free publishing execution has a determinate modeled latency
    kind: quantity
    quantifier: exists
    quantity:
      metric: latency
      target:
        all-of:
          - document-lifecycle.state: published
          - document-lifecycle.retry_count: 0

  # The maximum over EVERY execution: no selection at all. Shipped beside the selected question
  # below because the pair is the lesson, and because the pair's measured answer is not the one
  # the lesson predicts -- see the header.
  max-latency-of-any-execution:
    name: Every execution has a bounded modeled latency, and the model determines its maximum
    kind: quantity
    quantifier: exists
    quantity:
      metric: latency

  # THE cross-domain composition. A behavioural predicate supplies the selection; the quantitative
  # model supplies the per-occurrence charges, the sum along each selected execution, and the
  # maximum over them. Neither model answers it, and no third kind of result was invented to join
  # them: the answer is a magnitude with its dimension, which is what the quantitative dialect
  # returns anyway.
  max-latency-among-successful-executions:
    name: The executions that publish have a determinate maximum modeled latency
    kind: quantity
    quantifier: exists
    quantity:
      metric: latency
      target:
        document-lifecycle.state: published

  # The same composition under a declared ceiling, which is the requirement's own sentence. `forall`
  # is forced: a ceiling claim is universal over the selected executions and one counterexample
  # refutes it. The counterexample it returns IS the answer to "which execution violates the
  # requirement" -- that question has no separate query, because the evidence already carries it.
  successful-executions-within-two-seconds:
    name: Every execution that publishes completes within the declared two seconds
    kind: quantity
    quantifier: forall
    quantity:
      metric: latency
      within: successful-latency-requirement
      target:
        document-lifecycle.state: published

  # The memory ceiling as the requirement's own sentence, and the sibling of the latency ceiling
  # above. `forall` is forced for the same reason: a ceiling claim is universal, and one
  # configuration over the ceiling refutes it.
  #
  # No `target:`, and that is the difference from the latency pair rather than an omission.
  # `peak_memory` is CONFIGURATION-scoped -- the maximum of memory(c) over the reachable
  # configurations -- so there is no reading of "the peak along these executions" for a selection to
  # narrow. A target here would be a question the dialect does not have.
  peak-memory-within-the-declared-ceiling:
    name: Peak memory over reachable configurations stays within the declared ceiling
    kind: quantity
    quantifier: forall
    quantity:
      metric: peak_memory
      within: peak-memory-requirement

  # Whether the 256 MB remediation charge is ever incurred. The charge names a state in its `when:`
  # clause; this asks the lifecycle whether that state is reachable. Cross-model by construction:
  # the quantity is the performance model's and the state is the lifecycle's.
  remediation-memory-is-charged:
    name: The 256 MB remediation charge is incurred on some reachable execution
    kind: behavior
    quantifier: exists
    behavior:
      form: reach
      target:
        document-lifecycle.state: remediating

  # Single-model and structural: which components perform a stage of this document's processing.
  # `stage_of` forbids composition, and `predecessors` is not a composing form, so asking who points
  # AT the document is one hop by construction.
  stages-of-this-document:
    name: The parser, remediation, model gateway and validator perform a stage of this document's processing
    kind: graph
    quantifier: exists
    graph:
      form: predecessors
      relation: stage_of
      to: document

  # Pipeline order, over the one relation type that licenses composition. The witness is a two-hop
  # path, which is how you can tell the answer is not the degenerate src == dst one.
  parse-runs-before-validate:
    name: Parsing runs before validation
    kind: graph
    quantifier: exists
    graph:
      form: path
      relation: precedes
      from: parser
      to: validator

  # THE flagship purposeful omission (section 5.6), made executable.
  #
  # An expected latency is a weighted average of the hit and miss costs, and this model declares no
  # weights. The engine refuses the question by naming the vocabulary that would carry them: the
  # relation type is `cache_hit_frequency`, so the sentence a user reads tells them what to model
  # rather than merely declining.
  #
  # Section 5.6 prescribes the sentence "Not answerable. The model represents hit and miss costs but
  # deliberately omits their frequencies." The engine produces the modelling half of it now: the
  # refusal rung consults every `purpose.omits` before reporting a bare absence, so this query comes
  # back with cause `missing-distinction` and the model's own words -- "deliberately omits 'cache hit
  # frequency'" -- rather than a bare report that a lookup missed.
  expected-latency-with-the-cache:
    name: The cache improves expected latency without violating the memory requirement
    kind: graph
    quantifier: exists
    graph:
      form: direct
      relation: cache_hit_frequency
      from: gateway-cache
      to: model-gateway

# Most of this example's obligations are authored here. One is NOT, and which one is a fact about
# THIS EXAMPLE's pedagogy rather than about the construct, so it is stated where a reader meets it.
#
# `normal-processing-latency` keeps its fixture declaration, deliberately. Saving a question over
# the 750 ms `latency-requirement` would make it expressible -- and it would also put TWO ceilings
# over one latency model in front of a student, 750 ms refuted beside 2 s refuted. That pair can be
# taught on purpose; adding it as a side effect of relocating a declaration teaches it by accident.
#
# `peak-memory` had no such cost and moved here on 261005. Its ceiling is a different dimension from
# the latency pair, so it crowds nothing, and the quantity-to-budget-to-requirement chain it
# completes is already what the memory half of this example is for. The hand-derived oracle it used
# to be decided by is untouched and still checked -- `decided_by` only ever POINTED at that oracle,
# so the route changed and the cross-check did not.
#
# `expressed_as` is a join to a SAVED query by id, and the engine refuses a requirement naming a
# query the system does not declare. Every requirement below names one.
#
# What a reader must NOT conclude (corrected 261005, `DECISIONS-RULED-ceiling-requirement-261005.md`
# §8): that a ceiling cannot be named. Naming a query IS how a ceiling is named — a `kind: quantity`
# query carries `within:`, which points at a `model:`-targeted quantity, and the obligation below
# names such a query. An earlier wording here said the composed question was one "no `queries:` entry
# saves" and that there was "nowhere in a requirement to name a ceiling instead of a query"; both
# described this file's `queries:` block as though it described MAGE. The ruling's probe added one
# `within:` query per row over the ceilings this file ALREADY declares and reproduced the oracle's own
# 2,750 ms and 384 MB, with no schema change, no IR change and no new key.
requirements:

  publication-requires-validation:
    statement: >
      No document reaches published without passing through validating.
    expressed_as: publish-without-validating
    satisfied_when: refuted

  # The one quantitative obligation that takes the saved-query route. The query states the ceiling
  # claim DIRECTLY — `within: successful-latency-requirement`, `forall` over the executions that
  # publish — so `holds` discharges it and the 2,000 ms figure exists once, in the model.
  successful-processing-within-two-seconds:
    statement: >
      Every execution that reaches published completes within 2 seconds, retries included.
    expressed_as: successful-executions-within-two-seconds
    satisfied_when: holds

  # The memory obligation, on the same route. `holds` discharges it because the question it names
  # states the ceiling claim directly: `within:` carries the comparison, so a refutation IS the
  # breach and `satisfied_when: refuted` would make a found breach discharge the obligation.
  peak-memory:
    statement: >
      Peak memory over reachable configurations is at most 512 MB.
    expressed_as: peak-memory-within-the-declared-ceiling
    satisfied_when: holds
