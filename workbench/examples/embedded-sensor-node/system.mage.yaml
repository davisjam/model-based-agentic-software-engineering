# Embedded Sensor Node -- the resource-budget example.
#
# Central lesson: a quantity is an engineering instrument, not arithmetic. A battery-powered sensor
# node has 256 KiB of SRAM and nine things that want some of it. The model says what each one takes,
# the budget says what there is, and the margin between them is the whole design problem. Double one
# queue and a pinned requirement fails -- which is the point: the number moves the verdict.
#
# ## Two purposeful models over one set of components
#
#   sensor-firmware   a graph. Which firmware component owns which buffer, what each allocation
#                     costs in SRAM, and the declared 256 KiB ceiling the total is decided against.
#   sensor-dataflow   a graph. What path a sample takes from the sensor to the radio. Carries no
#                     magnitude at all.
#
# Neither answers the other's question, and the pair is the point. "What is the largest allocation"
# has no reading in the dataflow model, which represents no sizes; "what path does a sample take"
# has none in the firmware model, which represents ownership rather than flow. Reading them together
# is what turns "72 KB is the largest allocation" into "the classifier's weights are the largest
# allocation, and the classifier sits between the sensor and the radio" -- the sentence an engineer
# acts on.
#
# The specification is explicit that the first view must not be overloaded with CPU, energy, flash
# and timing at once, so the SRAM view represents SRAM and nothing else. Every other resource is a
# declared omission on that model's purpose, where a reader can see it. A second MODEL is not an
# overloaded first view: it is the reduction stated twice, differently.
#
# ## The unit, and a labelling defect worth knowing about
#
# The budget is 256 KiB and this file writes `256 KB`. That is not a rounding. The memory dimension's
# unit table is `{ KB: 0.0009765625, MB: 1, GB: 1024 }` -- `0.0009765625` is exactly `1/1024`, so the
# token `KB` denotes a KIBIbyte and `256 KB` is exactly 262144 bytes, the budget the specification
# means. There is no `KiB` token, and a `256 KiB` literal refuses as an unnormalized magnitude (V28).
#
# So the table computes kibibytes and spells them the JEDEC way. Renaming the token reaches the
# published schema, the unit pins and every example that writes `MB`, which is not this example's
# change to make. It is recorded here because the next reader will otherwise assume the conversion
# is decimal and conclude the arithmetic below is wrong by 2.4%.
#
# ## Why every allocation is resident, and what that costs the example
#
# A memory quantity declares exactly one of `residency: resident` or `when: { state: ... }`; neither
# is a V37 finding, because the annotation would then enter neither summand of memory(c). This model
# has no state machine, so `when:` has nothing to name and every allocation is resident.
#
# That is the honest Phase 1 model and it is also a REDUCTION, stated on the purpose as an omission:
# it answers "what if everything is live at once", and it cannot answer "is everything live at
# once". The second question needs operating modes -- Sleeping, Sampling, Inferring, Transmitting --
# and resource lifetimes tied to them, and the peak over modeled behaviour then differs from the sum
# below. That is the earned transition to Behavior, and it is deliberately not in this file: the
# specification requires the resource-lifetime semantics to be designed and registered as a general
# Behavior-to-Quantity composition before the example may use it, and no example-specific "peak
# memory" function is permitted.
#
# ## The arithmetic, so a reader can check the fixture by hand
#
#   mcu-runtime           24 KB
#   sensor-driver          8 KB
#   radio-stack           36 KB
#   inference-engine      12 KB
#   telemetry-queue       32 KB
#   packet-buffer         12 KB
#   model-weights         72 KB
#   inference-workspace   28 KB
#   logging-buffer         8 KB
#                       ------
#   total                232 KB     budget 256 KB     margin 24 KB  (9.375%)
#
# Largest single allocation: model-weights, at 72 KB -- 31% of the budget on its own.
#
# Doubling telemetry-queue to 64 KB takes the total to 264 KB and the pinned requirement fails by
# 8 KB. Restoring a 20% margin needs the total at or under 204.8 KB, which several changes achieve
# and several near-misses do not; that search is the design activity, not a lookup.
#
# ## Why the total is not a saved query, and the budget decision is
#
# One saved quantity query ships here, and it is the one that makes a CLAIM: every reachable
# configuration keeps memory(c) at or under the declared ceiling, refutable by a counterexample.
#
# The total, the largest allocation and the remaining margin are read from the quantitative model
# instead. They answer "what is there" rather than "is this true" -- they carry no quantifier, reach
# no outcome and produce no evidence -- and the line between the two is the one a student most needs
# drawn. A saved query returning a figure and an outcome of `holds` would blur it: `holds` would mean
# "a number was obtained", beside a sibling where `holds` means "the budget is met".
#
# There is a second reason, specific to this example. In Phase 1 there is no state machine, so there
# is exactly one reachable configuration and the peak of memory(c) over it EQUALS the resident sum.
# Pinning the total as a `peak_memory` measurement would therefore teach that the total is the peak
# -- and the operating-modes expansion exists precisely to un-teach that. The coincidence is an
# artifact of the reduction, and the setup should not spoil its own climax.

mage: 1

system:
  id: embedded-sensor-node
  name: Embedded Sensor Node

domains:

  criticality:
    # An ORDERED enum, lowest first, because the example asks a question that COMPARES two
    # components' criticality across a relation. V20's discipline: a comparison is licensed only
    # when both operands range over one declared ordered domain, so the order is declared here
    # rather than assumed from the spelling.
    type: ordered-enum
    values: [diagnostic, optional, essential]

entities:

  mcu-runtime:
    type: firmware
    label: MCU runtime
    properties:
      criticality: { value: essential, domain: criticality }
    notes:
      - id: sram-budget-rationale
        kind: rationale
        text: >
          The 256 KiB ceiling is a physical fact about the part, not a policy. It is declared as a
          `model:`-targeted quantity because a budget is a NUMBER: a `model:` total is charged by no
          accounting basis and exists to be compared against. The OBLIGATION that cites it is a
          separate declaration in this file's `requirements:` block, which names the query that
          decides it rather than restating the figure.
      - id: one-resource-at-a-time
        kind: comment
        text: >
          Flash, CPU cycles, energy per sample and radio airtime are all real constraints on this
          part and none is represented. The first view of a resource problem should make one
          resource obvious rather than four illegible, and the model's purpose lists them as
          omissions so the reduction is visible instead of implied.
    provenance:
      created_by: mage-example
      prompt: >
        Model a battery-powered embedded sensor node's SRAM allocations against a 256 KiB physical
        budget, so that the total, the largest allocation and the remaining margin are all askable,
        a pinned requirement decides the budget, and doubling one queue breaks it.
      rationale: MAGE-provided example, embedded-sensor-node, version 1.

  sensor-driver:
    type: firmware
    label: Sensor driver
    properties:
      criticality: { value: essential, domain: criticality }

  radio-stack:
    type: firmware
    label: Radio stack
    properties:
      criticality: { value: essential, domain: criticality }

  inference-engine:
    type: firmware
    label: Inference engine
    properties:
      criticality: { value: optional, domain: criticality }

  telemetry-queue:
    type: buffer
    label: Telemetry queue
    properties:
      criticality: { value: essential, domain: criticality }

  packet-buffer:
    type: buffer
    label: Packet buffer
    properties:
      criticality: { value: essential, domain: criticality }

  model-weights:
    type: buffer
    label: Model weights
    properties:
      criticality: { value: optional, domain: criticality }

  inference-workspace:
    type: buffer
    label: Inference workspace
    properties:
      criticality: { value: optional, domain: criticality }

  logging-buffer:
    type: buffer
    label: Logging buffer
    properties:
      criticality: { value: diagnostic, domain: criticality }

relation-types:

  owns_buffer:
    description: The firmware component owns this buffer and its SRAM allocation is held for it.
    absence: >
      No component in this model owns the buffer. Absence does not mean the buffer is free -- an
      allocation with no owner is a finding about the model, not a saving.
    composition:
      # A buffer owns nothing, so a multi-hop ownership question has no reading. Unlicensed beats
      # false.
      path: forbidden
    properties:
      symmetric: false
      acyclic: true

  feeds:
    description: The source component hands its output to the target component.
    absence: >
      No data path between the two is represented. Absence is not isolation -- it says this model
      draws no flow there, not that none exists in the part.
    composition:
      # Flow composes: a sample that reaches the queue and a queue the radio drains means the sample
      # reaches the radio. Reachability through `feeds` is a question with an answer.
      path: allowed
    properties:
      symmetric: false
      acyclic: true

models:

  sensor-firmware:
    type: graph
    label: Sensor Firmware SRAM
    purpose:
      question: Does the modeled firmware fit in the 256 KiB SRAM budget, and with how much margin?
      represents:
        - firmware component and buffer identity
        - which component owns which buffer
        - each allocation's SRAM size in KiB
        - the declared 256 KiB SRAM ceiling
        - whether each allocation is held for the whole run
        - which components the design treats as essential, optional or diagnostic
      # Checked against this model's real vocabulary. The first two are the flagship purposeful
      # omissions: without operating modes the model can answer "what if everything is live at once"
      # and cannot answer "is everything live at once", and that gap is what motivates expanding it.
      omits:
        - operating modes, so no allocation's lifetime is represented
        - whether two allocations are ever live at the same moment
        - flash, CPU cycles, energy per sample and radio airtime
        - allocator fragmentation and alignment padding
        - stack depth under interrupt nesting
    entities:
      - mcu-runtime
      - sensor-driver
      - radio-stack
      - inference-engine
      - telemetry-queue
      - packet-buffer
      - model-weights
      - inference-workspace
      - logging-buffer
    relations:

      - id: radio-owns-telemetry-queue
        from: radio-stack
        to: telemetry-queue
        type: owns_buffer
      - id: radio-owns-packet-buffer
        from: radio-stack
        to: packet-buffer
        type: owns_buffer
      - id: inference-owns-weights
        from: inference-engine
        to: model-weights
        type: owns_buffer
      - id: inference-owns-workspace
        from: inference-engine
        to: inference-workspace
        type: owns_buffer
      - id: mcu-owns-logging-buffer
        from: mcu-runtime
        to: logging-buffer
        type: owns_buffer

    notes:
      - id: sensor-firmware-rationale
        kind: rationale
        text: >
          This model represents what each component holds and what there is to hold it in. It
          represents no order of occurrence and no operating behaviour, so it cannot say when an
          allocation is live -- only that the model declares it. The total it supports is therefore
          the worst case under the assumption that everything is resident, which is the assumption
          every allocation here states for itself.
      - id: residency-is-authored
        kind: comment
        text: >
          Every memory annotation declares `residency: resident`. That is a claim about this
          firmware, not a default: MAGE refuses to infer either "idle component memory stays
          resident" or "idle component memory disappears", so the annotation says which, and an
          annotation declaring neither charges nothing anywhere.

  sensor-dataflow:
    type: graph
    label: Sensor Data Path
    purpose:
      question: What path does a sample take from the sensor to the radio?
      represents:
        - the components a sample passes through
        - the order they pass it in
      # This model carries no magnitude, and the omission is the pair's whole argument: a question
      # about size has no reading here, and asking it gets an unlicensed answer rather than a zero.
      omits:
        - how much SRAM any component holds
        - which components the design treats as essential, so no criticality question reads here
        - how long any step takes
        - how often a sample is taken
        - what happens when the queue is full
        - the buffers themselves, which hold data rather than pass it
    entities: [sensor-driver, inference-engine, telemetry-queue, radio-stack]
    relations:

      - id: driver-feeds-inference
        from: sensor-driver
        to: inference-engine
        type: feeds
      - id: inference-feeds-queue
        from: inference-engine
        to: telemetry-queue
        type: feeds
      - id: queue-feeds-radio
        from: telemetry-queue
        to: radio-stack
        type: feeds

    notes:
      - id: sensor-dataflow-rationale
        kind: rationale
        text: >
          This model represents the order a sample moves in and nothing about cost. It is here so
          the resource model has a companion that cannot answer the resource question: the two name
          the same components, and only one of them can be asked what they hold.

quantities:

  mcu-runtime-sram:
    target: entity:mcu-runtime
    dimension: memory
    value: 24 KB
    residency: resident
    description: Stack, interrupt vectors and the scheduler's own state. Held for the whole run.

  sensor-driver-sram:
    target: entity:sensor-driver
    dimension: memory
    value: 8 KB
    residency: resident
    description: Driver state and one sample-conversion scratch block.

  radio-stack-sram:
    target: entity:radio-stack
    dimension: memory
    value: 36 KB
    residency: resident
    description: Link-layer state, session keys and retransmission bookkeeping.

  inference-engine-sram:
    target: entity:inference-engine
    dimension: memory
    value: 12 KB
    residency: resident
    description: Interpreter state and the operator dispatch table. Excludes weights and workspace.

  telemetry-queue-sram:
    target: entity:telemetry-queue
    dimension: memory
    value: 32 KB
    residency: resident
    # The allocation the example's Q5 doubles. 32 KB is 64 records of 512 B; doubling the depth
    # doubles the allocation and takes the total 8 KB over the ceiling.
    description: Queued telemetry records awaiting transmission, at the modeled queue depth.

  packet-buffer-sram:
    target: entity:packet-buffer
    dimension: memory
    value: 12 KB
    residency: resident
    description: One radio frame in each direction, plus the encryption scratch block.

  model-weights-sram:
    target: entity:model-weights
    dimension: memory
    value: 72 KB
    residency: resident
    description: Quantized weights for the on-device classifier. The largest single allocation.

  inference-workspace-sram:
    target: entity:inference-workspace
    dimension: memory
    value: 28 KB
    residency: resident
    description: Activation tensors for the widest layer of the classifier.

  logging-buffer-sram:
    target: entity:logging-buffer
    dimension: memory
    value: 8 KB
    residency: resident
    description: Ring buffer for diagnostic records retrieved on service visits.

  sram-budget:
    target: model:sensor-firmware
    dimension: memory
    value: 256 KB
    # A `model:`-targeted total: charged by no accounting basis, and the one thing a `within:` query
    # may name. 256 KB in this table's binary units is exactly the part's 256 KiB of SRAM.
    description: The part's physical SRAM. The ceiling every allocation above is decided against.

# ---------------------------------------------------------------------------
# Suggested questions are EXECUTABLE artifacts, not instructional strings. Each is a saved query
# re-run whenever the model changes; the natural-language label is the `name`.
#
# Expected outcomes live in expected-results.yaml, not in an `expect:` field here. One source of
# truth: the fixture file also carries the models each question needs and the evidence it must
# produce, and a second copy in this file would be free to drift from it.
# ---------------------------------------------------------------------------
queries:

  # The example's pinned requirement, and the one query here that makes a CLAIM. `forall` is forced
  # by the question's shape: a ceiling claim is universal over the reachable configurations and one
  # counterexample refutes it. With no state machine there is exactly one configuration, so the
  # decision is over the resident sum -- 232 KB against 256 KB.
  sram-fits-budget:
    name: The modeled firmware fits in the 256 KiB SRAM budget
    kind: quantity
    quantifier: forall
    quantity:
      metric: peak_memory
      within: sram-budget

  # The structural companion, and it is here to make a point rather than to pad the set: the
  # quantitative model says WHAT each allocation costs and the structural model says WHO holds it.
  # "Which buffers does the radio stack own" is answerable only by the second, and "what do they
  # cost" only by the first.
  radio-stack-owns-buffers:
    name: The radio stack owns buffers of its own
    kind: graph
    quantifier: exists
    graph:
      form: successors
      relation: owns_buffer
      from: radio-stack

  # THE cross-model question, and the one neither model answers alone. The EDGE is the dataflow
  # model's -- `feeds` is declared nowhere else -- and the CRITICALITY ordering is the firmware
  # model's, which represents it while the dataflow model omits it by name. Neither reduction can
  # state the question: one knows the path and not what matters, the other the reverse.
  #
  # The answer is a finding about this design rather than a formality. It holds, and the witness is
  # the inference engine feeding the telemetry queue: an OPTIONAL classifier sits upstream of an
  # ESSENTIAL transmit path, so a sample's route to the radio runs through a component the design
  # says it could do without.
  optional-component-feeds-an-essential-one:
    name: An optional component feeds an essential one
    kind: graph
    quantifier: exists
    graph:
      form: direct
      relation: feeds
      where:
        compare:
          - left: source.criticality
            op: lt
            right: target.criticality

  # Asked of the dataflow model, and answerable only there. `feeds` composes, so this is a genuine
  # multi-hop question: driver -> inference -> queue -> radio, with the path returned as the witness.
  sample-reaches-the-radio:
    name: A sample reaches the radio from the sensor driver
    kind: graph
    quantifier: exists
    graph:
      form: reachability
      relation: feeds
      from: sensor-driver
      to: radio-stack

# The obligation this example exists to state. `sram-fits-budget` asks the universal DIRECTLY — the
# allocations fit within the declared budget — so the obligation is discharged when it holds, and
# there is no breach query to refute. The other polarity ships in message-bus and transaction-
# workspace; neither is the default.
requirements:

  firmware-fits-physical-sram:
    statement: >
      The modeled firmware's SRAM allocations fit within the part's 256 KiB of physical SRAM.
    expressed_as: sram-fits-budget
    satisfied_when: holds
