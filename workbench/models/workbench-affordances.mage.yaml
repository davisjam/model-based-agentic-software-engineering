      - service.workspace-undo
      - import
      - load-example
      - export
      - inspect
      - validate
      - query
      - analyze
      - inspect-evidence
      - undo
      - redo
      - create-element
      - delete-element
      - create-relation
      - delete-relation
      - edit-property
      - create-model
      - delete-model
      - add-note
      - save-property
      - retract-property
      - inspect-provenance
      - create-hypothesis
