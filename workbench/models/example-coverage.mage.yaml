      - { from: example.document-processing, to: capability.graph-reachability, type: exercises }
      - { from: example.transaction-workspace, to: capability.safety, type: exercises }
      - { from: example.worker-queue, to: capability.safety, type: exercises }
      - { from: example.message-bus, to: capability.safety-as-existential-dual, type: exercises }
      - { from: example.transaction-workspace, to: capability.reachability, type: exercises }
      - { from: example.document-processing, to: capability.reachability, type: exercises }
      - { from: example.worker-queue, to: capability.reachability, type: exercises }
