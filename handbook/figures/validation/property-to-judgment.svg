<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" font-family="'Source Sans 3', Helvetica, sans-serif" role="img">
  <title>A chain from engineering model to judgment: the model represents a property, a metric assesses an aspect of it, a measurement applies the metric under stated conditions, and the measurement bears on evidence interpreted into a judgment</title>
  <!-- Umber Monograph palette: ink #1c1917, paper #fdfcf9, accent #9a3f12, panel #f6f4ef, subordinate #57534e -->
  <rect x="0" y="0" width="480" height="600" fill="#fdfcf9"/>

  <defs>
    <marker id="pj-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- nodes -->
  <rect x="75" y="20" width="150" height="32" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="41" text-anchor="middle" font-size="14" fill="#1c1917">Engineering model</text>

  <rect x="75" y="128" width="150" height="32" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="149" text-anchor="middle" font-size="14" fill="#1c1917">Property</text>

  <rect x="75" y="236" width="150" height="32" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="257" text-anchor="middle" font-size="14" fill="#1c1917">Metric</text>

  <rect x="75" y="344" width="150" height="32" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="365" text-anchor="middle" font-size="14" fill="#1c1917">Measurement</text>

  <rect x="75" y="452" width="150" height="32" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="473" text-anchor="middle" font-size="14" fill="#1c1917">Evidence</text>

  <rect x="75" y="560" width="150" height="32" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="581" text-anchor="middle" font-size="14" fill="#1c1917">Judgment</text>

  <!-- labeled edges: the labels teach the relationships -->
  <line x1="150" y1="52" x2="150" y2="124" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="170" y="94" text-anchor="start" font-size="12" font-style="italic" fill="#57534e">represents</text>

  <line x1="150" y1="160" x2="150" y2="232" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="170" y="202" text-anchor="start" font-size="12" font-style="italic" fill="#57534e">assessed by</text>

  <line x1="150" y1="268" x2="150" y2="340" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="170" y="310" text-anchor="start" font-size="12" font-style="italic" fill="#57534e">applied under stated conditions</text>

  <line x1="150" y1="376" x2="150" y2="448" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="170" y="418" text-anchor="start" font-size="12" font-style="italic" fill="#57534e">bears on</text>

  <line x1="150" y1="484" x2="150" y2="556" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="170" y="526" text-anchor="start" font-size="12" font-style="italic" fill="#57534e">interpreted with other evidence</text>
</svg>
