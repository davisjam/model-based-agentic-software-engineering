<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 476" font-family="'Source Sans 3', Helvetica, sans-serif" role="img">
  <title>A chain from engineering model to judgment: the model represents a property, a metric assesses an aspect of it, a measurement applies the metric under stated conditions, and the measurement bears on evidence interpreted into a judgment</title>
  <!-- Umber Monograph palette: ink #1c1917, paper #fdfcf9, accent #9a3f12, panel #f6f4ef, subordinate #57534e -->
  <!-- Sized for the WRAPPED print rendering (~2.05in wide): at that width one unit is ~0.49pt, so
       the 16-unit box text prints at ~7.9pt and the 13-unit edge labels at ~6.4pt — all text clears
       the figure-legibility floor (see scripts/lint.py) without shrinking to fit the wrap. -->
  <rect x="0" y="0" width="300" height="476" fill="#fdfcf9"/>

  <defs>
    <marker id="pj-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- nodes -->
  <rect x="55" y="8" width="190" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="30" text-anchor="middle" font-size="16" fill="#1c1917">Engineering model</text>

  <rect x="55" y="90" width="190" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="112" text-anchor="middle" font-size="16" fill="#1c1917">Property</text>

  <rect x="55" y="172" width="190" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="194" text-anchor="middle" font-size="16" fill="#1c1917">Metric</text>

  <rect x="55" y="254" width="190" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="276" text-anchor="middle" font-size="16" fill="#1c1917">Measurement</text>

  <rect x="55" y="336" width="190" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="358" text-anchor="middle" font-size="16" fill="#1c1917">Evidence</text>

  <rect x="55" y="418" width="190" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
  <text x="150" y="440" text-anchor="middle" font-size="16" fill="#1c1917">Judgment</text>

  <!-- labeled edges: the labels teach the relationships. The arrow rides left of center so each
       label sits beside it in the gap at full label size. -->
  <line x1="92" y1="42" x2="92" y2="86" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="104" y="70" text-anchor="start" font-size="13" font-style="italic" fill="#57534e">represents</text>

  <line x1="92" y1="124" x2="92" y2="168" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="104" y="152" text-anchor="start" font-size="13" font-style="italic" fill="#57534e">assessed by</text>

  <line x1="92" y1="206" x2="92" y2="250" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="104" y="226" text-anchor="start" font-size="13" font-style="italic" fill="#57534e">applied under</text>
  <text x="104" y="242" text-anchor="start" font-size="13" font-style="italic" fill="#57534e">stated conditions</text>

  <line x1="92" y1="288" x2="92" y2="332" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="104" y="316" text-anchor="start" font-size="13" font-style="italic" fill="#57534e">bears on</text>

  <line x1="92" y1="370" x2="92" y2="414" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pj-arrow)"/>
  <text x="104" y="390" text-anchor="start" font-size="13" font-style="italic" fill="#57534e">interpreted with</text>
  <text x="104" y="406" text-anchor="start" font-size="13" font-style="italic" fill="#57534e">other evidence</text>
</svg>
