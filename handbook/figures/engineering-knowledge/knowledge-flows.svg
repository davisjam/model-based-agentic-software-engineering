<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Source Sans 3', Helvetica, sans-serif" role="img">
  <title>Where engineering knowledge comes from and where it can go</title>
  <!-- Umber Monograph palette: ink #1c1917, paper #fdfcf9, accent #9a3f12, rule #e4e0d8, panel #f6f4ef -->
  <!-- Three tiers, one straight centre column. Every edge leaves its source's BOTTOM border, runs
       horizontally on a shared level (y=120 in, y=310 out), and drops into its target's TOP border,
       so the fan-in and fan-out are axis-aligned rather than diagonal. -->
  <defs>
    <!-- Native arrowhead: drawn along +x, refX at the tip, so orient="auto" pins the tip to the path
         endpoint and rotates the head to the final segment's direction. -->
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9a3f12"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="420" fill="#fdfcf9"/>

  <!-- Sources -->
  <rect id="src-work" x="20" y="20" width="200" height="64" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="120" y="46" text-anchor="middle" font-size="15" fill="#1c1917">Engineering work</text>
  <text x="120" y="66" text-anchor="middle" font-size="12" fill="#57534e" font-style="italic">models · experiments · prototypes</text>

  <rect id="src-world" x="260" y="20" width="200" height="64" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="360" y="46" text-anchor="middle" font-size="15" fill="#1c1917">Outside world</text>
  <text x="360" y="66" text-anchor="middle" font-size="12" fill="#57534e" font-style="italic">users · experts · regulation</text>

  <rect id="src-operation" x="500" y="20" width="200" height="64" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="600" y="46" text-anchor="middle" font-size="15" fill="#1c1917">Operation</text>
  <text x="600" y="66" text-anchor="middle" font-size="12" fill="#57534e" font-style="italic">incidents · telemetry · support</text>

  <!-- Fan-in: each source drops from its own bottom border, runs to y=120, drops into Observation's top -->
  <g stroke="#9a3f12" stroke-width="2" fill="none" marker-end="url(#flow-arrow)">
    <!-- edge: src-work -> observation -->
    <path d="M120,84 L120,120 L330,120 L330,152"/>
    <!-- edge: src-world -> observation -->
    <path d="M360,84 L360,152"/>
    <!-- edge: src-operation -> observation -->
    <path d="M600,84 L600,120 L390,120 L390,152"/>
  </g>

  <!-- Observation and interpretation -->
  <rect id="observation" x="270" y="152" width="180" height="44" rx="6" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.8"/>
  <text x="360" y="180" text-anchor="middle" font-size="15" fill="#1c1917">Observation</text>

  <!-- edge: observation -> interpretation -->
  <path d="M360,196 L360,236" stroke="#9a3f12" stroke-width="2" fill="none" marker-end="url(#flow-arrow)"/>

  <rect id="interpretation" x="270" y="236" width="180" height="44" rx="6" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.8"/>
  <text x="360" y="264" text-anchor="middle" font-size="15" fill="#1c1917">Interpretation</text>

  <!-- Fan-out: each edge leaves Interpretation's bottom border, runs to y=310, drops into its target's top -->
  <g stroke="#9a3f12" stroke-width="2" fill="none" marker-end="url(#flow-arrow)">
    <!-- edge: interpretation -> dst-people -->
    <path d="M330,280 L330,310 L120,310 L120,340"/>
    <!-- edge: interpretation -> dst-representations -->
    <path d="M360,280 L360,340"/>
    <!-- edge: interpretation -> dst-environment -->
    <path d="M390,280 L390,310 L600,310 L600,340"/>
  </g>

  <!-- Destinations -->
  <rect id="dst-people" x="20" y="340" width="200" height="64" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="120" y="366" text-anchor="middle" font-size="15" fill="#1c1917">People</text>
  <text x="120" y="386" text-anchor="middle" font-size="12" fill="#57534e" font-style="italic">tacit · shared through talk</text>

  <rect id="dst-representations" x="260" y="340" width="200" height="64" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="360" y="366" text-anchor="middle" font-size="15" fill="#1c1917">Representations</text>
  <text x="360" y="386" text-anchor="middle" font-size="12" fill="#57534e" font-style="italic">docs · models · records</text>

  <rect id="dst-environment" x="500" y="340" width="200" height="64" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="600" y="366" text-anchor="middle" font-size="15" fill="#1c1917">Environment</text>
  <text x="600" y="386" text-anchor="middle" font-size="12" fill="#57534e" font-style="italic">conventions · mechanisms · checks</text>
</svg>
