<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Source Sans 3', Helvetica, sans-serif" role="img">
  <title>An engineering model produces an expectation, action in the world produces an observation, and the observation either matches the expectation or violates it, in which case interpretation of the failure updates the engineering understanding</title>
  <!-- Umber Monograph palette: ink #1c1917, paper #fdfcf9, accent #9a3f12, rule #e4e0d8, panel #f6f4ef, subordinate #57534e -->
  <rect x="0" y="0" width="560" height="540" fill="#fdfcf9"/>

  <defs>
    <marker id="eo-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <rect x="150" y="16" width="176" height="42" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="238" y="43" text-anchor="middle" font-size="15" fill="#1c1917">Engineering model</text>

  <rect x="150" y="90" width="176" height="42" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="238" y="117" text-anchor="middle" font-size="15" fill="#1c1917">Expectation</text>

  <rect x="150" y="164" width="176" height="42" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="238" y="191" text-anchor="middle" font-size="15" fill="#1c1917">Action in the world</text>

  <rect x="150" y="238" width="176" height="42" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="238" y="265" text-anchor="middle" font-size="15" fill="#1c1917">Observation</text>

  <g stroke="#9a3f12" stroke-width="2" fill="none">
    <line x1="238" y1="58" x2="238" y2="82" marker-end="url(#eo-arrow)"/>
    <line x1="238" y1="132" x2="238" y2="156" marker-end="url(#eo-arrow)"/>
    <line x1="238" y1="206" x2="238" y2="230" marker-end="url(#eo-arrow)"/>
  </g>

  <!-- the branch -->
  <g stroke="#9a3f12" stroke-width="2" fill="none">
    <path d="M238,280 L238,304"/>
    <path d="M238,304 L446,304 L446,326" marker-end="url(#eo-arrow)"/>
    <path d="M238,304 L150,304 L150,326" marker-end="url(#eo-arrow)"/>
  </g>

  <rect x="368" y="330" width="156" height="42" rx="6" fill="#f6f4ef" stroke="#57534e" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="446" y="357" text-anchor="middle" font-size="14" fill="#57534e">Expectation holds</text>

  <rect x="62" y="330" width="176" height="42" rx="6" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.8"/>
  <text x="150" y="357" text-anchor="middle" font-size="15" fill="#1c1917">Failure</text>

  <rect x="62" y="404" width="176" height="42" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="150" y="431" text-anchor="middle" font-size="15" fill="#1c1917">Interpretation</text>

  <rect x="62" y="478" width="252" height="42" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="188" y="505" text-anchor="middle" font-size="15" fill="#1c1917">Updated engineering understanding</text>

  <g stroke="#9a3f12" stroke-width="2" fill="none">
    <line x1="150" y1="372" x2="150" y2="396" marker-end="url(#eo-arrow)"/>
    <line x1="150" y1="446" x2="150" y2="470" marker-end="url(#eo-arrow)"/>
  </g>
</svg>
