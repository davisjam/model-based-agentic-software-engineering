<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Source Sans 3', Helvetica, sans-serif" role="img">
  <title>Three imperfect defensive layers, each with a weakness. In the ordinary case a hazard is stopped at the first layer whose weakness it does not meet; when the weaknesses of all three layers align, the hazard passes through every layer and becomes a consequential failure</title>
  <!-- Umber Monograph palette: ink #1c1917, paper #fdfcf9, accent #9a3f12, rule #e4e0d8, panel #f6f4ef, subordinate #57534e -->
  <rect x="0" y="0" width="720" height="300" fill="#fdfcf9"/>

  <defs>
    <marker id="df-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
    <marker id="df-stop" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M5,0 L5,10" stroke="#57534e" stroke-width="2.5" fill="none"/>
    </marker>
  </defs>

  <!-- ORDINARY CASE -->
  <text x="18" y="30" font-size="12" font-weight="600" fill="#57534e">ORDINARY CASE</text>
  <text x="18" y="70" font-size="14" fill="#1c1917">Hazard</text>

  <g stroke="#9a3f12" stroke-width="2" fill="none">
    <line x1="74" y1="65" x2="152" y2="65" marker-end="url(#df-stop)"/>
  </g>

  <rect x="156" y="40" width="34" height="52" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.4"/>
  <rect x="156" y="70" width="34" height="9" fill="#fdfcf9" stroke="none"/>

  <rect x="306" y="40" width="34" height="52" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.4"/>
  <rect x="306" y="50" width="34" height="9" fill="#fdfcf9" stroke="none"/>

  <rect x="456" y="40" width="34" height="52" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.4"/>
  <rect x="456" y="76" width="34" height="9" fill="#fdfcf9" stroke="none"/>

  <text x="173" y="112" text-anchor="middle" font-size="11" fill="#57534e">Defense</text>
  <text x="323" y="112" text-anchor="middle" font-size="11" fill="#57534e">Defense</text>
  <text x="473" y="112" text-anchor="middle" font-size="11" fill="#57534e">Defense</text>
  <text x="530" y="70" font-size="12" font-style="italic" fill="#57534e">stopped at the first layer</text>

  <line x1="18" y1="146" x2="702" y2="146" stroke="#e4e0d8" stroke-width="1.5"/>

  <!-- ALIGNED WEAKNESSES -->
  <text x="18" y="186" font-size="12" font-weight="600" fill="#57534e">ALIGNED WEAKNESSES</text>
  <text x="18" y="238" font-size="14" fill="#1c1917">Hazard</text>

  <rect x="156" y="208" width="34" height="52" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.4"/>
  <rect x="156" y="229" width="34" height="9" fill="#fdfcf9" stroke="none"/>

  <rect x="306" y="208" width="34" height="52" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.4"/>
  <rect x="306" y="229" width="34" height="9" fill="#fdfcf9" stroke="none"/>

  <rect x="456" y="208" width="34" height="52" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.4"/>
  <rect x="456" y="229" width="34" height="9" fill="#fdfcf9" stroke="none"/>

  <g stroke="#9a3f12" stroke-width="2" fill="none">
    <line x1="74" y1="233" x2="576" y2="233" marker-end="url(#df-arrow)"/>
  </g>

  <text x="173" y="280" text-anchor="middle" font-size="11" fill="#57534e">weakness</text>
  <text x="323" y="280" text-anchor="middle" font-size="11" fill="#57534e">weakness</text>
  <text x="473" y="280" text-anchor="middle" font-size="11" fill="#57534e">weakness</text>
  <text x="592" y="238" font-size="14" fill="#9a3f12">Failure</text>

</svg>
