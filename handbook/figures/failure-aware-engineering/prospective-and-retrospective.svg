<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Source Sans 3', Helvetica, sans-serif" role="img">
  <title>Before delivery, engineering runs forward from requirements through specification, architecture and design, implementation, and validation to a system operating in the world. A failure turns the same activities around: each is re-examined by a retrospective question, and the answers update the engineering models that guide future work</title>
  <!-- Umber Monograph palette: ink #1c1917, paper #fdfcf9, accent #9a3f12, rule #e4e0d8, panel #f6f4ef, subordinate #57534e -->
  <rect x="0" y="0" width="720" height="440" fill="#fdfcf9"/>

  <defs>
    <marker id="pr-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <text x="18" y="26" font-size="12" font-weight="600" fill="#57534e">BEFORE DELIVERY</text>
  <text x="18" y="44" font-size="12" font-style="italic" fill="#57534e">Why should we believe this?</text>

  <text x="300" y="26" font-size="12" font-weight="600" fill="#57534e">AFTER FAILURE</text>
  <text x="300" y="44" font-size="12" font-style="italic" fill="#57534e">Why did we believe this?</text>

  <!-- prospective chain, left column -->
  <rect x="18" y="60" width="200" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.4"/>
  <text x="118" y="82" text-anchor="middle" font-size="14" fill="#1c1917">Requirements</text>

  <rect x="18" y="110" width="200" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.4"/>
  <text x="118" y="132" text-anchor="middle" font-size="14" fill="#1c1917">Specification</text>

  <rect x="18" y="160" width="200" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.4"/>
  <text x="118" y="182" text-anchor="middle" font-size="14" fill="#1c1917">Architecture and design</text>

  <rect x="18" y="210" width="200" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.4"/>
  <text x="118" y="232" text-anchor="middle" font-size="14" fill="#1c1917">Implementation</text>

  <rect x="18" y="260" width="200" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.4"/>
  <text x="118" y="282" text-anchor="middle" font-size="14" fill="#1c1917">Validation</text>

  <rect x="18" y="310" width="200" height="34" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.4"/>
  <text x="118" y="332" text-anchor="middle" font-size="14" fill="#1c1917">System in the world</text>

  <g stroke="#9a3f12" stroke-width="1.8" fill="none">
    <line x1="118" y1="94" x2="118" y2="106" marker-end="url(#pr-arrow)"/>
    <line x1="118" y1="144" x2="118" y2="156" marker-end="url(#pr-arrow)"/>
    <line x1="118" y1="194" x2="118" y2="206" marker-end="url(#pr-arrow)"/>
    <line x1="118" y1="244" x2="118" y2="256" marker-end="url(#pr-arrow)"/>
    <line x1="118" y1="294" x2="118" y2="306" marker-end="url(#pr-arrow)"/>
  </g>

  <!-- retrospective questions, right column, row-aligned with the activities -->
  <text x="300" y="82" font-size="13.5" fill="#1c1917">Did we promise the outcome that mattered?</text>
  <text x="300" y="132" font-size="13.5" fill="#1c1917">Did we model the machine and its environment?</text>
  <text x="300" y="182" font-size="13.5" fill="#1c1917">Why did this structure appear appropriate?</text>
  <text x="300" y="232" font-size="13.5" fill="#1c1917">Did realization depart from intent?</text>
  <text x="300" y="282" font-size="13.5" fill="#1c1917">What did the evidence actually establish?</text>
  <text x="300" y="332" font-size="13.5" fill="#1c1917">Did the observations represent the property?</text>

  <!-- the pivot: failure turns the column around -->
  <rect x="18" y="368" width="200" height="38" rx="5" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.8"/>
  <text x="118" y="392" text-anchor="middle" font-size="15" fill="#1c1917">Failure</text>
  <line x1="118" y1="344" x2="118" y2="364" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pr-arrow)"/>

  <path d="M218,387 L262,387 L262,60" stroke="#9a3f12" stroke-width="1.8" fill="none" marker-end="url(#pr-arrow)"/>

  <rect x="300" y="368" width="300" height="38" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.4"/>
  <text x="450" y="392" text-anchor="middle" font-size="14" fill="#1c1917">Updated models · future engineering</text>
  <line x1="450" y1="344" x2="450" y2="364" stroke="#9a3f12" stroke-width="1.8" marker-end="url(#pr-arrow)"/>
</svg>
