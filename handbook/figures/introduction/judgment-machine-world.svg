<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 378" font-family="'Source Sans 3', Helvetica, sans-serif" role="img">
  <title>Software engineering: the sustained concerns of process, teamwork, and engineering knowledge over six engineering judgments about a machine that participates in the world</title>
  <!-- Umber Monograph palette: ink #1c1917, paper #fdfcf9, accent #9a3f12, rule #e4e0d8, panel #f6f4ef, accent-tint #faf1e6 -->
  <!-- Designed at final size: rendered ~5.37in wide (88% of the 6.1in text block), so 1 unit ≈ 0.54pt;
       heading (19) ≈ 10.3pt, grid labels (17) ≈ 9.1pt, region titles + band labels (15) ≈ 8.1pt. -->
  <rect x="0" y="0" width="720" height="378" fill="#fdfcf9"/>

  <defs>
    <marker id="jmw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- the whole subject: a restrained centered heading, deliberately no enclosing rectangle -->
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="600" letter-spacing="3" fill="#1c1917">SOFTWARE ENGINEERING</text>

  <!-- the three sustained concerns: an unboxed full-width header band over one hairline —
       deliberately NOT boxes, so they cannot read as three more entries in the judgment grid -->
  <g font-size="15" font-weight="600" letter-spacing="1.5" fill="#1c1917" text-anchor="middle">
    <text x="131" y="76">PROCESS</text>
    <text x="360" y="76">TEAMWORK</text>
    <text x="589" y="76">ENGINEERING KNOWLEDGE</text>
  </g>
  <line x1="16" y1="90" x2="704" y2="90" stroke="#e4e0d8" stroke-width="1.5"/>

  <!-- engineering judgment: six judgments in a grid, deliberately unconnected -->
  <rect x="16" y="116" width="312" height="212" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="172" y="150" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1.5" fill="#1c1917">ENGINEERING JUDGMENT</text>
  <g font-size="17" fill="#1c1917" text-anchor="middle">
    <text x="94" y="200">Requirements</text>
    <text x="250" y="200">Specification</text>
    <text x="94" y="242">Architecture</text>
    <text x="250" y="242">Design</text>
    <text x="94" y="284">Validation</text>
    <text x="250" y="284">R&amp;D</text>
  </g>

  <!-- we make judgments about a machine -->
  <line x1="334" y1="222" x2="376" y2="222" stroke="#9a3f12" stroke-width="2" marker-start="url(#jmw-arrow)" marker-end="url(#jmw-arrow)"/>

  <rect x="382" y="116" width="142" height="212" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="453" y="227" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1.5" fill="#1c1917">THE MACHINE</text>

  <!-- the machine acts on the world; the world acts back -->
  <line x1="530" y1="198" x2="556" y2="198" stroke="#9a3f12" stroke-width="2" marker-end="url(#jmw-arrow)"/>
  <line x1="556" y1="246" x2="530" y2="246" stroke="#9a3f12" stroke-width="2" marker-end="url(#jmw-arrow)"/>

  <rect x="562" y="116" width="142" height="212" rx="6" fill="#faf1e6" stroke="#1c1917" stroke-width="1.5"/>
  <text x="633" y="227" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1.5" fill="#1c1917">THE WORLD</text>
</svg>
