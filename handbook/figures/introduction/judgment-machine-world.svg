<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" font-family="'Source Sans 3', Helvetica, sans-serif" role="img">
  <title>Engineering judgments concern a machine that participates in the world</title>
  <!-- Umber Monograph palette: ink #1c1917, paper #fdfcf9, accent #9a3f12, rule #e4e0d8, panel #f6f4ef, accent-tint #faf1e6 -->
  <!-- Designed at final size: rendered ~5.37in wide (88% of the 6.1in text block), so 1 unit ≈ 0.54pt;
       grid labels (17) ≈ 9.1pt, region titles (15) ≈ 8.1pt. -->
  <rect x="0" y="0" width="720" height="312" fill="#fdfcf9"/>

  <defs>
    <marker id="jmw-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- engineering judgment: six judgments in a grid, deliberately unconnected -->
  <rect x="16" y="50" width="312" height="212" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="172" y="84" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1.5" fill="#1c1917">ENGINEERING JUDGMENT</text>
  <g font-size="17" fill="#1c1917" text-anchor="middle">
    <text x="94" y="134">Requirements</text>
    <text x="250" y="134">Specification</text>
    <text x="94" y="176">Architecture</text>
    <text x="250" y="176">Design</text>
    <text x="94" y="218">Validation</text>
    <text x="250" y="218">R&amp;D</text>
  </g>

  <!-- we make judgments about a machine -->
  <line x1="334" y1="156" x2="376" y2="156" stroke="#9a3f12" stroke-width="2" marker-start="url(#jmw-arrow)" marker-end="url(#jmw-arrow)"/>

  <rect x="382" y="50" width="142" height="212" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="453" y="161" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1.5" fill="#1c1917">THE MACHINE</text>

  <!-- the machine acts on the world; the world acts back -->
  <line x1="530" y1="132" x2="556" y2="132" stroke="#9a3f12" stroke-width="2" marker-end="url(#jmw-arrow)"/>
  <line x1="556" y1="180" x2="530" y2="180" stroke="#9a3f12" stroke-width="2" marker-end="url(#jmw-arrow)"/>

  <rect x="562" y="50" width="142" height="212" rx="6" fill="#faf1e6" stroke="#1c1917" stroke-width="1.5"/>
  <text x="633" y="161" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1.5" fill="#1c1917">THE WORLD</text>
</svg>
