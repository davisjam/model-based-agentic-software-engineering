<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Source Sans 3', Helvetica, sans-serif" role="img">
  <title>Architectural decomposition</title>
  <!-- Umber Monograph palette: ink #1c1917, paper #fdfcf9, accent #9a3f12, rule #e4e0d8, panel #f6f4ef -->
  <rect x="0" y="0" width="720" height="300" fill="#fdfcf9"/>

  <!-- Stage 1: whole system -->
  <rect x="24" y="118" width="150" height="64" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="99" y="155" text-anchor="middle" font-size="16" fill="#1c1917">System</text>

  <!-- arrow 1 -->
  <line x1="182" y1="150" x2="236" y2="150" stroke="#9a3f12" stroke-width="2"/>
  <polygon points="236,150 226,145 226,155" fill="#9a3f12"/>

  <!-- Stage 2: three components -->
  <rect x="246" y="40" width="150" height="52" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="321" y="72" text-anchor="middle" font-size="15" fill="#1c1917">Component A</text>
  <rect x="246" y="124" width="150" height="52" rx="6" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.8"/>
  <text x="321" y="156" text-anchor="middle" font-size="15" fill="#1c1917">Component B</text>
  <rect x="246" y="208" width="150" height="52" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.5"/>
  <text x="321" y="240" text-anchor="middle" font-size="15" fill="#1c1917">Component C</text>

  <!-- arrow 2: B decomposes further -->
  <line x1="404" y1="150" x2="458" y2="150" stroke="#9a3f12" stroke-width="2"/>
  <polygon points="458,150 448,145 448,155" fill="#9a3f12"/>

  <!-- Stage 3: B's two subcomponents -->
  <rect x="468" y="108" width="150" height="40" rx="5" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.5"/>
  <text x="543" y="133" text-anchor="middle" font-size="14" fill="#1c1917">Subcomponent B1</text>
  <rect x="468" y="156" width="150" height="40" rx="5" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.5"/>
  <text x="543" y="181" text-anchor="middle" font-size="14" fill="#1c1917">Subcomponent B2</text>

  <!-- recursion note -->
  <text x="543" y="228" text-anchor="middle" font-size="12" fill="#57534e" font-style="italic">architecture recurs within a part</text>
</svg>
