# MkDocs configuration for the Handbook web edition.
#
# IMPORTANT: docs_dir points at generated/web — MkDocs reads the GENERATED Markdown, never the
# canonical manuscript. The semantic Divs of the source have already been transformed into Material
# admonitions and <figure> elements by the Pandoc web filters (scripts/build.py). Do not point this
# at chapters/.
#
# The nav (the "book → chapters" left rail) is GENERATED by scripts/build.py from book.yaml order
# into generated/mkdocs.yml, which INHERITs this file — chapter order is never hand-maintained here.
site_name: The Software Engineering Handbook
site_description: A Judgment and Decision-Making Approach — web edition.
repo_url: https://github.com/davisjam/model-based-agentic-software-engineering

docs_dir: ../generated/web
# site_dir is passed explicitly by build.py (-d dist/site); this default is for a bare `mkdocs build`.
site_dir: ../dist/site

# Pages are served flat at the site root (05-architecture.html, not 05-architecture/index.html) so the
# <figure> raw-HTML image paths (figures/…) resolve without a per-page depth adjustment. A raw <img>
# is not rewritten by MkDocs the way a Markdown image is, so a flat layout keeps every asset one hop
# from every page.
use_directory_urls: false
strict: true  # fail the build on a bad internal link or nav reference

theme:
  name: material
  # The shared MAGE-family shell (header partial + mage-family.css) — one theme package, consumed by
  # every property. Path-relative to THIS file, so it resolves the same locally and under CI's
  # `mkdocs build -f handbook/web/mkdocs.yml` (MkDocs resolves custom_dir against the config file).
  custom_dir: ../../web-theme/overrides
  # Book-glyph mark in the family header's brand strip (each property keeps its own mark).
  icon:
    logo: material/book-open-variant
  # Browser-tab favicon — the two-pan balance-scales rust badge (author-chosen v2 icon, hb-A;
  # tracked at handbook/assets/favicon.svg; build.py copies it into the generated docs_dir).
  favicon: favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
  # Named palette values are only the neutral seed; mage-family.css (projected from
  # book-models/design-tokens.json) overrides both schemes with the family tokens — near-black
  # header, warm paper, rust accent. The old solid-brown palette is gone.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: brown
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: brown
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false  # no webfont fetch; the family CSS sets the stack (system fallback), matching the teach site

extra_css:
  - assets/stylesheets/mage-family.css  # the shared family shell (served from the theme custom_dir)
  - css/handbook.css                    # per-property: admonition kinds, figures, home-page layout

plugins:
  - search

extra:
  # PDF edition beside the pages (CI-published, like the home's download button) — the shared nav
  # partial (web-theme/overrides/partials/nav.html) renders its "Read the PDF" rail link only when
  # this key is set.
  pdf_url: software-engineering-handbook.pdf
  # The standard header grid's right-side family nav (rendered by the shared header partial).
  family_links:
    - label: MAGE homepage
      url: https://davisjam.github.io/model-based-agentic-software-engineering/
    - label: Teach with MAGE
      url: https://davisjam.github.io/model-based-agentic-software-engineering/teach/

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
