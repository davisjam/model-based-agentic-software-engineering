# Global book metadata — the single source of truth for information that belongs to the whole book
# rather than to any one chapter. The PDF front matter and the web site configuration both derive
# from this file; do not repeat these facts in the Typst template or in mkdocs.yml.
title: The Software Engineering Handbook
subtitle: A Judgment and Decision-Making Approach
author: James C. Davis
edition: 1
year: 2026
# Copyright / imprint facts, mirroring the MAGE book's manifest. `copyright_years` is the © range;
# `first_published` is the date the edition first shipped. The imprint page also prints a "last
# modified" date, which the build injects at compile time (the last content commit), not from here.
copyright_years: 2026–present
first_published: 2026-09-12
language: en-US

outputs:
  pdf:
    enabled: true
  web:
    enabled: true

bibliography:
  file: bibliography/references.bib
  csl: bibliography/chicago-author-date.csl

# Front matter — unnumbered material that precedes the chapters (Preface, etc.). Each entry names a
# file under the book root and the projections (`views:`) it appears in. Front matter is rendered
# into the ELABORATED handbook edition only, so its entries carry `views: [handbook]`. The web
# projection walks `chapters:` alone and never reads this list, so front matter is excluded from web
# by construction; a future web projection that wanted a front-matter page would have to opt in by
# adding `web` to its `views:`. Front matter is not a chapter — it carries no `order:` and never
# enters the chapter numbering.
frontmatter:
  - file: frontmatter/preface.md
    views: [handbook]

# Chapter build order. Each entry is a file under chapters/. The order here is authoritative; the
# per-chapter `order:` metadata must agree with it (the linter checks this). Reordering the book is
# a change to this list, not a renumbering of prose — cross-references resolve by ID, never by number.
chapters:
  - chapters/00-software-engineering.md
  - chapters/01-process.md
  - chapters/02-teamwork.md
  - chapters/03-requirements.md
  - chapters/04-specification.md
  - chapters/05-architecture.md
  - chapters/06-design.md
  # Back matter — the Conclusion renders LAST and unnumbered; insert new chapters ABOVE this line.
  # Its `kind: conclusion` metadata (not its list position) exempts it from the chapter-ending
  # convention and drops the chapter heading treatment in the PDF (see scripts/lint.py + build.py).
  - chapters/99-conclusion.md
