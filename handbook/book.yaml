# Manuscript authority: each listed .md is a generated projection of its sibling
# .tex and .yaml. These stable paths remain for catalogue/web compatibility.
# Global book metadata — the single source of truth for information that belongs to the whole book
# rather than to any one chapter. The PDF front matter and the web site configuration both derive
# from this file; do not repeat these facts in the print template or in mkdocs.yml.
title: The Software Engineering Handbook
subtitle: A Judgment and Decision-Making Approach
author: James C. Davis
edition: 1
year: 2026
# Copyright / imprint facts, mirroring the MAGE book's manifest. `copyright_years` is the © range;
# `first_published` is the date the edition first shipped. The imprint page also prints a "last
# modified" date, which the build injects at compile time (the last content commit), not from here.
copyright_years: 2026–present
first_published: 2026-09-12
language: en-US

outputs:
  pdf:
    enabled: true
  web:
    enabled: true

# ARTIFACT SCOPE — the one declaration of which handbook build outputs ship and which never leave
# the author's machine. The vocabulary is SHARED with the MAGE book (tools/latex_reuse.py owns it,
# book/book-manifest.json carries the book's own list): a PUBLISHED artifact is built by the Pages
# workflow and rides the site artifact into the deployed site; a LOCAL-ONLY artifact is built for
# the author's own review — never built in CI, never uploaded, never served. Two manifests, ONE
# distinction; a second vocabulary would defeat the point of declaring scope at all.
#
# Every surface DERIVES from this list instead of restating it. scripts/latex_pdf.py skips a
# local-only artifact on a publication run, so the pre-push hook and the Pages workflow run the
# identical `make -C handbook book` and cannot disagree about scope. The workflow publishes only the
# globs declared `published` here. tests/test_handbook_chapter_pdfs.py fails if either surface drifts
# from this list.
#
# WHAT A LOCAL-ONLY SCOPE COSTS, stated here because this is where the next reader looks. Gates that
# only the local-only build runs stop being verified before transfer. For the chapter PDFs those are
# the per-chapter LuaLaTeX pass-convergence and diagnostics allow-list, and the per-chapter PDF
# structure check (tagged headings, sections, tables, and alt text on every figure) that this change
# introduced. They now run only in the author's pre-push on a handbook-scope push, so a `--no-verify`
# push, or a push from a checkout where the chapters were never built, can ship a regression in them
# unseen. The author accepted that on 261106: the artifact is unpublished, so the regression cannot
# reach a reader. Two things narrow it. The whole-edition render — which shares every chapter source,
# every figure and every shared LaTeX input with the chapters — still runs unconditionally in CI with
# its own structure gate. And the reuse key and stamp guard stay CI-verified, because the unit tier
# still runs in the workflow.
#
# THE READER-FACING CONSEQUENCE, which is where the handbook differs from the book. The book's 21
# section PDFs were orphans: published for months with nothing linking to them. The handbook's
# chapter PDFs were LINKED — a "Download this chapter (PDF)" row on each chapter page and a "(PDF)"
# link on each Contents row, 30 inbound links on the deployed site. Withdrawing the artifact
# therefore withdraws the affordance; scripts/build.py no longer emits either link. Publishing a link
# to an unpublished file is the one outcome worse than either choice, and no gate here would have
# caught it (the handbook's chapter links are raw HTML precisely so MkDocs' strict mode does not
# chase them, and the site link checker skips the whole CI-built se-handbook subtree).
#
# This is a NAMED EXCEPTION to the repo's standing rule that CI holds the unconditional superset of
# pre-push; both the rule and the exception are written in CLAUDE.md section "Where a new check runs
# — the placement rule".
build_artifacts:
  - id: handbook-pdf
    scope: published
    glob: handbook/dist/software-engineering-handbook.pdf
    builder: handbook/scripts/build.py pdf
    note: >-
      The print edition served at /book/se-handbook/ and linked from the handbook home's cover and
      download button. Always rendered, everywhere, and structure-checked on every run.
  - id: handbook-epub
    scope: published
    glob: handbook/dist/software-engineering-handbook.epub
    builder: handbook/scripts/build.py epub, folded into the pdf target
    note: >-
      The reflowable ePub3 edition, packed from the same chapter sources as the web edition.
  - id: handbook-web
    scope: published
    glob: handbook/dist/site
    builder: handbook/scripts/build.py web
    note: >-
      The MkDocs site — index plus one page per chapter. Published as a TREE COPY rather than a
      glob match, so it has no upload pattern of its own; declared here so this list is the whole
      answer to "what does the handbook ship?" rather than only the file-shaped part of it.
  - id: handbook-chapter-pdfs
    scope: local-only
    glob: handbook/dist/chapters/*.pdf
    builder: handbook/scripts/build.py pdf, via latex_pdf.build_pdf
    note: >-
      One standalone PDF per book unit — each handbook-view front-matter entry and each chapter. The
      author opens one chapter instead of the whole handbook. Change-aware reuse makes an unchanged
      chapter a fraction of a second, so refreshing all of them on a handbook-scope push costs almost
      nothing locally. CI built AND published these until 261106; the author withdrew them because the
      review need is local, so the artifact is local.

# Bibliography. The `file` is the REPO'S ONE citation backend (book/references.bib) reached from the
# handbook root -- there is no separate handbook bibliography (readings-ssot-260925). The CSL stays
# local: a style is not bibliographic data, and the Handbook's inline author-date register is
# deliberately different from the MAGE book's note register.
bibliography:
  file: ../book/references.bib
  csl: bibliography/chicago-author-date.csl

# Front matter — unnumbered material that precedes the chapters (Preface, etc.). Each entry names a
# file under the book root and the projections (`views:`) it appears in. An entry with only
# `handbook` in its `views:` renders into the PDF handbook edition alone; adding `web` opts it into
# the web projection as its own page. Front matter is not a chapter — it carries no `order:` and
# never enters the chapter numbering.
frontmatter:
  # The Preface explains the book's pedagogical approach (a short handbook about engineering judgment).
  # The Introduction, distinct from it, states the organizing premise: the chapters separate
  # engineering judgments conceptually, not procedurally. Order here is the printed order.
  - file: frontmatter/preface.md
    views: [handbook, web]
  - file: frontmatter/introduction.md
    views: [handbook, web]
  # Acknowledgments print last in the front matter, immediately before the chapters. Named thanks
  # only — the NSF funding line renders separately from NSF_ACK in scripts/build.py (PDF imprint,
  # web colophon, ePub rights line); repeating it here would double it in every edition.
  - file: frontmatter/acknowledgments.md
    views: [handbook, web]

# Chapter build order. Each entry is a file under chapters/. The order here is authoritative; the
# per-chapter `order:` metadata must agree with it (the linter checks this). Reordering the book is
# a change to this list, not a renumbering of prose — cross-references resolve by ID, never by number.
chapters:
  - chapters/00-software-engineering.md
  - chapters/01-process.md
  - chapters/02-teamwork.md
  - chapters/03-engineering-knowledge.md
  - chapters/04-requirements.md
  - chapters/05-specification.md
  - chapters/06-architecture.md
  - chapters/07-design.md
  - chapters/08-validation.md
  - chapters/09-research-and-development.md
  - chapters/10-failure-aware-engineering.md
  # Back matter — the Conclusion renders LAST and unnumbered; insert new chapters ABOVE this line.
  # Its `kind: conclusion` metadata (not its list position) exempts it from the chapter-ending
  # convention and drops the chapter heading treatment in the PDF (see scripts/lint.py + build.py).
  - chapters/99-conclusion.md
