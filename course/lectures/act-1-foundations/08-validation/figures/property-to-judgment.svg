<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 170" font-family="'Source Sans 3', Helvetica, sans-serif" role="img">
  <title>A horizontal chain: a model represents a property, a metric assesses it, a measurement applies the metric, and the measurement bears on evidence interpreted into a judgment</title>
  <rect x="0" y="0" width="1040" height="170" fill="#fdfcf9"/>

  <defs>
    <marker id="lpj-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- nodes -->
  <g font-size="12" fill="#1c1917">
    <rect x="11" y="75" width="118" height="40" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
    <text x="70" y="100" text-anchor="middle">MODEL</text>
    <rect x="187" y="75" width="118" height="40" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
    <text x="246" y="100" text-anchor="middle">PROPERTY</text>
    <rect x="363" y="75" width="118" height="40" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
    <text x="422" y="100" text-anchor="middle">METRIC</text>
    <rect x="539" y="75" width="118" height="40" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
    <text x="598" y="100" text-anchor="middle">MEASUREMENT</text>
    <rect x="715" y="75" width="118" height="40" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
    <text x="774" y="100" text-anchor="middle">EVIDENCE</text>
    <rect x="891" y="75" width="118" height="40" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="1.2"/>
    <text x="950" y="100" text-anchor="middle">JUDGMENT</text>
  </g>

  <!-- labeled edges -->
  <g stroke="#9a3f12" stroke-width="1.8">
    <line x1="129" y1="95" x2="183" y2="95" marker-end="url(#lpj-arrow)"/>
    <line x1="305" y1="95" x2="359" y2="95" marker-end="url(#lpj-arrow)"/>
    <line x1="481" y1="95" x2="535" y2="95" marker-end="url(#lpj-arrow)"/>
    <line x1="657" y1="95" x2="711" y2="95" marker-end="url(#lpj-arrow)"/>
    <line x1="833" y1="95" x2="887" y2="95" marker-end="url(#lpj-arrow)"/>
  </g>
  <g font-size="11" font-style="italic" fill="#57534e" text-anchor="middle">
    <text x="156" y="66">represents</text>
    <text x="332" y="66">assessed by</text>
    <text x="508" y="66">applied</text>
    <text x="684" y="66">bears on</text>
    <text x="860" y="66">interpreted</text>
  </g>
</svg>
