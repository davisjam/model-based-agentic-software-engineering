<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 950" width="1400" height="950" role="img" aria-labelledby="ttTitle ttDesc" font-family="'Source Sans 3', sans-serif">
<title id="ttTitle">Same territory, different questions</title>
<desc id="ttDesc">Five models of one course-registration system, shown together: a class diagram, a sequence diagram, a state machine, an activity diagram and a use-case diagram. The territory is held constant; each diagram answers a different engineering question and preserves different distinctions.</desc>
