<text x="700.0" y="46" text-anchor="middle" font-size="42" font-weight="700" letter-spacing="2.5" fill="#41586c">ONE TERRITORY: COURSE REGISTRATION</text>
<rect x="29.0" y="74" width="430" height="372" rx="12" fill="#fdfcf9" stroke="#2f5169" stroke-width="2.5"/>
<image xlink:href="1-what-exists-class.png" x="47.0" y="138.2" width="394.0" height="177.7"/>
<line x1="47.0" y1="380" x2="441.0" y2="380" stroke="#2f5169" stroke-width="1.5" opacity="0.45"/>
<text x="244.0" y="426" text-anchor="middle" font-size="44" font-weight="700" fill="#2f5169">What exists?</text>
<rect x="485.0" y="74" width="430" height="372" rx="12" fill="#fdfcf9" stroke="#2f5169" stroke-width="2.5"/>
