<text x="1156.0" y="426" text-anchor="middle" font-size="44" font-weight="700" fill="#2f5169">What states?</text>
<rect x="257.0" y="472" width="430" height="372" rx="12" fill="#fdfcf9" stroke="#2f5169" stroke-width="2.5"/>
