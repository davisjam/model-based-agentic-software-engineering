<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid), per the self-communicate drawing escape hatch: a stacked
     region diagram with two named horizontal boundaries and a boundary-motion arrow — a geometry a
     graph auto-layout would misdraw as a flow of nodes. Palette, stroke, and type follow the course
     figure vocabulary (act-2 figures/delegation-model.svg). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352"
     role="img" aria-labelledby="srTitle srDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="srTitle">Obligation, scaffolding, and degrees of freedom</title>
  <desc id="srDesc">A stacked diagram. The specified region groups two layers: the engineering
    obligation, holding consequential distinctions that must be preserved, and scaffolding, the
    additional structure this agent needs to interpret and realize the obligation reliably. The
    obligation boundary between them is set by the engineering problem and does not move with
    capability. The specification boundary below the scaffolding is set by the obligation and by this
    agent's capability. Below it sit the degrees of freedom: realization choices left to the agent.
    An upward arrow shows that greater agent capability can reduce required scaffolding.</desc>

  <!-- solid paper ground so the figure stays legible on the dark theme -->
  <rect x="0" y="0" width="760" height="352" fill="#fdfcf9"/>

  <!-- specified region: obligation + scaffolding -->
  <rect x="186" y="20" width="368" height="222" rx="12" fill="#faf7f0" stroke="#2f5169" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="370" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#2f5169">SPECIFIED REGION</text>

  <!-- engineering obligation -->
  <rect x="204" y="56" width="332" height="62" rx="10" fill="#eef2f6" stroke="#2f5169" stroke-width="2"/>
  <text x="370" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#2f5169">ENGINEERING OBLIGATION</text>
  <text x="370" y="102" text-anchor="middle" font-size="13" fill="#41586c">consequential distinctions that must be preserved</text>

  <!-- obligation boundary -->
  <line x1="204" y1="136" x2="536" y2="136" stroke="#2f5169" stroke-width="1.5"/>
  <text x="566" y="132" font-size="12.5" font-weight="700" fill="#2f5169">obligation boundary</text>
  <text x="566" y="148" font-size="12" fill="#41586c">set by the engineering problem;</text>
  <text x="566" y="163" font-size="12" fill="#41586c">does not move with capability</text>

  <!-- scaffolding -->
  <rect x="204" y="154" width="332" height="74" rx="10" fill="#eef2f6" stroke="#2f5169" stroke-width="2"/>
  <text x="370" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#2f5169">SCAFFOLDING</text>
  <text x="370" y="196" text-anchor="middle" font-size="13" fill="#41586c">additional structure this agent needs to</text>
  <text x="370" y="212" text-anchor="middle" font-size="13" fill="#41586c">interpret and realize the obligation reliably</text>

  <!-- specification boundary: the lower edge of the specified region -->
  <line x1="186" y1="242" x2="554" y2="242" stroke="#2f5169" stroke-width="2.5"/>
  <text x="566" y="238" font-size="12.5" font-weight="700" fill="#2f5169">specification boundary</text>
  <text x="566" y="254" font-size="12" fill="#41586c">set by the obligation and by</text>
  <text x="566" y="269" font-size="12" fill="#41586c">this agent's capability</text>

  <!-- degrees of freedom -->
  <rect x="204" y="264" width="332" height="64" rx="10" fill="#fdfcf9" stroke="#2f5169" stroke-width="1.5"/>
  <text x="370" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#2f5169">DEGREES OF FREEDOM</text>
  <text x="370" y="310" text-anchor="middle" font-size="13" fill="#41586c">realization choices left to the agent</text>

  <!-- capability moves only the specification boundary -->
  <path d="M 166 300 L 166 162 M 160 172 L 166 160 L 172 172" fill="none" stroke="#2f5169" stroke-width="2"/>
  <text x="154" y="214" text-anchor="end" font-size="12.5" fill="#41586c">greater agent capability</text>
  <text x="154" y="230" text-anchor="end" font-size="12.5" fill="#41586c">can reduce required</text>
  <text x="154" y="246" text-anchor="end" font-size="12.5" fill="#41586c">scaffolding</text>
</svg>
