<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid), per the self-communicate drawing escape hatch: a vertical
     work chain with a left authority rail whose three edges re-enter the chain at the points where
     the engineer rules rather than delegates, plus a legend keying four box kinds by fill. The
     authority re-entries and the kind legend are annotation geometry a graph auto-layout would drop.
     Palette, stroke, type and marker convention follow the course figure vocabulary
     (05-building-with-agents/figures/software-factory.svg,
     04-failure-aware-engineering/figures/governance-conversion.svg). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" width="1000" height="810"
     role="img" aria-labelledby="fwTitle fwDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="fwTitle">Work organization in an agentic software factory: the engineer sets priorities
    into a strategy document, delegates planning and execution down a chain of agents, and retains
    authority at the three points where the factory asks for a decision</title>
  <desc id="fwDesc">An engineer panel on the left carries three outbound authority edges, labelled
    prioritizes, decides and accepts, which enter the central chain at the strategy document, the
    independent plan review, and the accept outcome. The chain runs downward: the strategy document,
    the prioritized work queue, feeds a planning agent; the planning agent produces two artifacts
    side by side, an epic carrying the work order and phases and a design document carrying the
    obligations and models; both feed an independent plan review; the review feeds the orchestrator,
    which dispatches briefs to isolated worktrees; three implementation agents work in parallel;
    their commits flow into integration, where accepted commits land on main; integration feeds the
    Definition of Done, where evidence is assembled and independently reviewed; and the Definition of
    Done branches into accept or return for repair. A rework edge carries returned work from return
    for repair back into the implementation agent row. A legend keys four box kinds by fill:
    management for priorities and work orders, engineering for obligations and models, execution for
    plans, commits and evidence, agents for delegated work, and a fifth entry for the accept or
    repair outcome.</desc>

  <defs>
    <marker id="fw-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
    <marker id="fw-ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/>
    </marker>
    <marker id="fw-ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6b3a"/>
    </marker>
  </defs>

  <!-- solid paper ground so the figure stays legible on the dark theme -->
  <rect x="0" y="0" width="1000" height="810" fill="#fdfcf9"/>

  <text x="500" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#2f5169">AN AGENTIC SOFTWARE FACTORY</text>

  <!-- authority rail: the engineer -->
  <rect x="24" y="72" width="176" height="704" rx="24" fill="#faf7f0" stroke="#2f5169" stroke-width="2.6"/>
  <text x="112" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">ENGINEER</text>
  <text x="112" y="148" text-anchor="middle" font-size="13.5" fill="#41586c">Sets priorities</text>
  <text x="112" y="174" text-anchor="middle" font-size="13.5" fill="#41586c">Chooses models</text>
  <text x="112" y="192" text-anchor="middle" font-size="13.5" fill="#41586c">and controls</text>
  <text x="112" y="218" text-anchor="middle" font-size="13.5" fill="#41586c">Rules on open</text>
  <text x="112" y="236" text-anchor="middle" font-size="13.5" fill="#41586c">questions</text>
  <text x="112" y="262" text-anchor="middle" font-size="13.5" fill="#41586c">Judges evidence</text>
  <text x="112" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#2f5169">AUTHORITY IS</text>
  <text x="112" y="576" text-anchor="middle" font-size="14" font-weight="700" fill="#2f5169">NOT DELEGATED</text>

  <!-- three authority edges back into the chain -->
  <g stroke="#2f5169" stroke-width="2" marker-end="url(#fw-ah)">
    <line x1="200" y1="96" x2="296" y2="96"/>
    <line x1="200" y1="342" x2="296" y2="342"/>
    <line x1="200" y1="752" x2="296" y2="752"/>
  </g>
  <text x="249" y="86" text-anchor="middle" font-size="12" fill="#41586c">prioritizes</text>
  <text x="249" y="332" text-anchor="middle" font-size="12" fill="#41586c">decides</text>
  <text x="249" y="742" text-anchor="middle" font-size="12" fill="#41586c">accepts</text>

  <!-- strategy document (management) -->
  <rect x="300" y="72" width="380" height="48" rx="10" fill="#e3ebf3" stroke="#2f5169" stroke-width="2"/>
  <text x="490" y="93" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">Strategy document</text>
  <text x="490" y="111" text-anchor="middle" font-size="12" fill="#41586c">the prioritized work queue</text>
  <line x1="490" y1="120" x2="490" y2="150" stroke="#2f5169" stroke-width="2" marker-end="url(#fw-ah)"/>

  <!-- planning agent -->
  <rect x="300" y="154" width="380" height="48" rx="24" fill="#fdfcf9" stroke="#41586c" stroke-width="2"/>
  <text x="490" y="184" text-anchor="middle" font-size="15" fill="#1c1917">Planning agent</text>
  <g stroke="#2f5169" stroke-width="2" fill="none">
    <line x1="490" y1="202" x2="490" y2="216"/>
    <line x1="390" y1="216" x2="590" y2="216"/>
    <line x1="390" y1="216" x2="390" y2="232" marker-end="url(#fw-ah)"/>
    <line x1="590" y1="216" x2="590" y2="232" marker-end="url(#fw-ah)"/>
  </g>

  <!-- epic (management) + design document (engineering) -->
  <rect x="300" y="236" width="180" height="48" rx="10" fill="#e3ebf3" stroke="#2f5169" stroke-width="2"/>
  <text x="390" y="257" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">Epic</text>
  <text x="390" y="275" text-anchor="middle" font-size="11.5" fill="#41586c">work order and phases</text>
  <rect x="500" y="236" width="180" height="48" rx="10" fill="#f6efe1" stroke="#8a6630" stroke-width="2"/>
  <text x="590" y="257" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1917">Design document</text>
  <text x="590" y="275" text-anchor="middle" font-size="11.5" fill="#41586c">obligations and models</text>
  <g stroke="#2f5169" stroke-width="2" fill="none">
    <line x1="390" y1="284" x2="390" y2="302"/>
    <line x1="590" y1="284" x2="590" y2="302"/>
    <line x1="390" y1="302" x2="590" y2="302"/>
    <line x1="490" y1="302" x2="490" y2="314" marker-end="url(#fw-ah)"/>
  </g>

  <!-- independent plan review -->
  <rect x="300" y="318" width="380" height="48" rx="24" fill="#fdfcf9" stroke="#41586c" stroke-width="2"/>
  <text x="490" y="348" text-anchor="middle" font-size="15" fill="#1c1917">Independent plan review</text>
  <line x1="490" y1="366" x2="490" y2="396" stroke="#2f5169" stroke-width="2" marker-end="url(#fw-ah)"/>

  <!-- orchestrator -->
  <rect x="300" y="400" width="380" height="48" rx="24" fill="#fdfcf9" stroke="#41586c" stroke-width="2"/>
  <text x="490" y="421" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">Orchestrator</text>
  <text x="490" y="439" text-anchor="middle" font-size="12" fill="#41586c">dispatches briefs to isolated worktrees</text>
  <g stroke="#2f5169" stroke-width="2" fill="none">
    <line x1="490" y1="448" x2="490" y2="466"/>
    <line x1="357" y1="466" x2="623" y2="466"/>
    <line x1="357" y1="466" x2="357" y2="478" marker-end="url(#fw-ah)"/>
    <line x1="490" y1="466" x2="490" y2="478" marker-end="url(#fw-ah)"/>
    <line x1="623" y1="466" x2="623" y2="478" marker-end="url(#fw-ah)"/>
  </g>

  <!-- implementation agents -->
  <rect x="300" y="482" width="115" height="48" rx="24" fill="#fdfcf9" stroke="#41586c" stroke-width="2"/>
  <text x="357" y="512" text-anchor="middle" font-size="14" fill="#1c1917">Agent A</text>
  <rect x="432" y="482" width="115" height="48" rx="24" fill="#fdfcf9" stroke="#41586c" stroke-width="2"/>
  <text x="490" y="512" text-anchor="middle" font-size="14" fill="#1c1917">Agent B</text>
  <rect x="565" y="482" width="115" height="48" rx="24" fill="#fdfcf9" stroke="#41586c" stroke-width="2"/>
  <text x="623" y="512" text-anchor="middle" font-size="14" fill="#1c1917">Agent C</text>
  <g stroke="#2f5169" stroke-width="2" fill="none">
    <line x1="357" y1="530" x2="357" y2="546"/>
    <line x1="490" y1="530" x2="490" y2="546"/>
    <line x1="623" y1="530" x2="623" y2="546"/>
    <line x1="357" y1="546" x2="623" y2="546"/>
    <line x1="490" y1="546" x2="490" y2="560" marker-end="url(#fw-ah)"/>
  </g>

  <!-- integration (execution) -->
  <rect x="300" y="564" width="380" height="48" rx="10" fill="#eaf0ea" stroke="#4f6b50" stroke-width="2"/>
  <text x="490" y="585" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">Integration</text>
  <text x="490" y="603" text-anchor="middle" font-size="12" fill="#41586c">accepted commits land on main</text>
  <line x1="490" y1="612" x2="490" y2="642" stroke="#2f5169" stroke-width="2" marker-end="url(#fw-ah)"/>

  <!-- definition of done (execution) -->
  <rect x="300" y="646" width="380" height="48" rx="10" fill="#eaf0ea" stroke="#4f6b50" stroke-width="2"/>
  <text x="490" y="667" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">Definition of Done</text>
  <text x="490" y="685" text-anchor="middle" font-size="12" fill="#41586c">evidence assembled and independently reviewed</text>
  <g stroke="#2f5169" stroke-width="2" fill="none">
    <line x1="490" y1="694" x2="490" y2="712"/>
    <line x1="390" y1="712" x2="590" y2="712"/>
    <line x1="390" y1="712" x2="390" y2="724" marker-end="url(#fw-ah-g)"/>
    <line x1="590" y1="712" x2="590" y2="724" marker-end="url(#fw-ah-r)"/>
  </g>

  <!-- outcomes -->
  <rect x="300" y="728" width="180" height="48" rx="10" fill="#dfeadf" stroke="#2f6b3a" stroke-width="2"/>
  <text x="390" y="758" text-anchor="middle" font-size="15" font-weight="700" fill="#2f5137">Accept</text>
  <rect x="500" y="728" width="180" height="48" rx="10" fill="#f6ece9" stroke="#b23b3b" stroke-width="2"/>
  <text x="590" y="758" text-anchor="middle" font-size="14" font-weight="700" fill="#8a2f2f">Return for repair</text>

  <!-- rework edge: returned work re-enters implementation -->
  <path d="M680,752 L716,752 L716,506 L684,506" fill="none" stroke="#b23b3b" stroke-width="2" marker-end="url(#fw-ah-r)"/>
  <text x="720" y="640" font-size="11" fill="#8a2f2f">rework</text>

  <!-- legend: what the boxes are -->
  <rect x="760" y="72" width="216" height="258" rx="10" fill="#fdfcf9" stroke="#c9c2b4" stroke-width="1.5"/>
  <text x="776" y="98" font-size="13.5" font-weight="700" fill="#2f5169">WHAT THE BOXES ARE</text>
  <rect x="776" y="112" width="18" height="18" rx="4" fill="#e3ebf3" stroke="#2f5169" stroke-width="1.6"/>
  <text x="802" y="120" font-size="12.5" font-weight="700" fill="#1c1917">Management</text>
  <text x="802" y="137" font-size="11.5" fill="#41586c">Priorities, work orders</text>
  <rect x="776" y="156" width="18" height="18" rx="4" fill="#f6efe1" stroke="#8a6630" stroke-width="1.6"/>
  <text x="802" y="164" font-size="12.5" font-weight="700" fill="#1c1917">Engineering</text>
  <text x="802" y="181" font-size="11.5" fill="#41586c">Obligations and models</text>
  <rect x="776" y="200" width="18" height="18" rx="4" fill="#eaf0ea" stroke="#4f6b50" stroke-width="1.6"/>
  <text x="802" y="208" font-size="12.5" font-weight="700" fill="#1c1917">Execution</text>
  <text x="802" y="225" font-size="11.5" fill="#41586c">Plans, commits, evidence</text>
  <rect x="776" y="244" width="18" height="18" rx="9" fill="#fdfcf9" stroke="#41586c" stroke-width="1.6"/>
  <text x="802" y="252" font-size="12.5" font-weight="700" fill="#1c1917">Agents</text>
  <text x="802" y="269" font-size="11.5" fill="#41586c">Delegated work</text>
  <rect x="776" y="288" width="18" height="18" rx="4" fill="#dfeadf" stroke="#2f6b3a" stroke-width="1.6"/>
  <text x="802" y="296" font-size="12.5" font-weight="700" fill="#1c1917">Outcome</text>
  <text x="802" y="313" font-size="11.5" fill="#41586c">Accept or repair</text>
</svg>
