<?xml version="1.0" encoding="UTF-8"?>
<!-- DECK-LOCAL variant of book/assets/constraint-vs-sensor.svg for lecture 2-3 slide "Prevent or detect?".
     Diverges from the book figure on the NO branch only: the book's SENSOR node is relabeled
     EVIDENCE + EVALUATION ("observe what happened and decide whether it satisfies the obligation"),
     because a sensor alone is not the alternative to a constraint — the lecture's path is
     sensor -> validator -> gate, and this label states the mechanism without pre-teaching the
     four-role vocabulary that slide "Four roles in a control system" introduces.
     Do NOT fold this change back into the book figure; the book's caption reads "Otherwise install
     a sensor" and depends on the SENSOR label.
     Regenerate the sibling PNG with:
       rsvg-convert -w 3200 -h 1400 constraint-vs-sensor-deck.svg -o constraint-vs-sensor-deck.png
     Grammar (inherited from the book figure, v7): rust #9a3f12 = obligation; blue #2f5169 =
     mechanism; neutral #57534e = the decision. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420"
     role="group" aria-labelledby="caTitle caDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="caTitle">Constraint or evidence: a selection rule for the engineering obligation</title>
  <desc id="caDesc">An engineering obligation you must hold leads to one decision: can the unwanted state be
    excluded cleanly? If yes, use a constraint, which narrows what may happen — a typed enumeration, a
    permission, a narrow API. If no, use evidence and evaluation: observe what happened — a metric, a
    trace, a call scan, a log — and decide whether it satisfies the obligation. A constraint prevents
    the unwanted state; evidence and evaluation report and judge it after the fact.</desc>

  <defs>
    <marker id="caArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- edges drawn UNDER nodes; the branch labels YES/NO ride the diagonals, so heads keep their angles -->
  <!-- edge-grammar: keep-angles -->
  <!-- edge: obligation -> decision -->
  <line x1="480" y1="87" x2="480" y2="132" stroke="#1c1917" stroke-width="2" marker-end="url(#caArrow)"/>
  <g fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#caArrow)">
    <!-- edge: decision -> constraint -->
    <path d="M380,192 C320,222 290,232 262,254"/>
    <!-- edge: decision -> evidence+evaluation -->
    <path d="M580,192 C640,222 670,232 698,254"/>
  </g>

  <!-- top: the engineering obligation -->
  <rect id="obligation" x="320" y="24" width="320" height="66" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="480" y="55" text-anchor="middle" font-size="21" font-weight="700" fill="#9a3f12">ENGINEERING OBLIGATION</text>
  <text x="480" y="79" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">the property you must hold</text>

  <!-- the selection decision -->
  <rect id="decision" x="249.16" y="136" width="461.68" height="58" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="480" y="172" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">Can the unwanted state be excluded cleanly?</text>

  <!-- branch labels (paths drawn under nodes, above) -->
  <text x="300" y="226" text-anchor="middle" font-size="19.2" font-weight="700" fill="#2f5169">YES</text>
  <text x="662" y="226" text-anchor="middle" font-size="19.2" font-weight="700" fill="#2f5169">NO</text>

  <!-- ============ LEFT — CONSTRAINT ============ -->
  <rect id="constraint" x="82.94" y="256" width="354.12" height="128" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="260" y="296" text-anchor="middle" font-size="22" font-weight="700" fill="#2f5169">CONSTRAINT</text>
  <text x="260" y="326" text-anchor="middle" font-size="19.2" fill="#1c1917">narrows what may happen</text>
  <text x="260" y="360" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">typed enum · permission · narrow API</text>

  <!-- ============ RIGHT — EVIDENCE + EVALUATION ============ -->
  <rect id="evidence-evaluation" x="516.37" y="256" width="367.26" height="128" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="700" y="288" text-anchor="middle" font-size="22" font-weight="700" fill="#2f5169">EVIDENCE + EVALUATION</text>
  <text x="700" y="314" text-anchor="middle" font-size="19.2" fill="#1c1917">observe what happened and decide</text>
  <text x="700" y="338" text-anchor="middle" font-size="19.2" fill="#1c1917">whether it satisfies the obligation</text>
  <text x="700" y="368" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">metric · trace · call scan · log</text>
</svg>
