<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid), per the self-communicate drawing escape hatch: an execution
     history in two transaction lanes, where the MEANING is carried by the vertical offset between
     lanes (B's check falls between A's check and A's commit) and by a shared terminal outcome both
     lanes point into. A sequence auto-layout cannot express "staggered but interleaved" as geometry.
     Palette, stroke, and type follow the course figure vocabulary (./representations.svg,
     ../../01-compute-environments-and-deployment/figures/ci-cd-pipeline.svg). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 448" width="700" height="448"
     role="img" aria-labelledby="dbTitle dbDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="dbTitle">An execution history in which two transactions each check a room's availability
    before either commits, and both then insert a confirmed reservation for the same room</title>
  <desc id="dbDesc">Time runs down the figure through two lanes, transaction A on the left and
    transaction B on the right. First A checks availability and sees no conflict. Next, before A has
    written anything, B checks availability and also sees no conflict. A then inserts its reservation
    and commits. B then inserts its reservation and commits. Both lanes lead into one outcome banner:
    invalid shared state, with both reservations confirmed for the same room. A footer note reads that
    both transactions observe an available room before either reservation is committed, so without
    adequate enforcement both can commit conflicting reservations.</desc>

  <defs>
    <marker id="db-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="db-ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2f2f"/>
    </marker>
  </defs>

  <!-- solid paper ground so the figure stays legible on the dark theme -->
  <rect x="0" y="0" width="700" height="448" fill="#fdfcf9"/>

  <text x="350" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">ONE EXECUTION HISTORY, TWO CONFIRMED RESERVATIONS</text>

  <!-- time axis -->
  <line x1="34" y1="78" x2="34" y2="318" stroke="#57534e" stroke-width="2" marker-end="url(#db-ah)"/>
  <text x="26" y="198" text-anchor="middle" font-size="12.5" fill="#57534e" transform="rotate(-90 26 198)">time</text>

  <!-- lanes -->
  <text x="208" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#2f5169">TRANSACTION A</text>
  <text x="508" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#2f5169">TRANSACTION B</text>
  <rect x="66" y="72" width="284" height="248" rx="10" fill="#f6f4ef" stroke="#a8a29e" stroke-width="1.5"/>
  <rect x="366" y="72" width="284" height="248" rx="10" fill="#f6f4ef" stroke="#a8a29e" stroke-width="1.5"/>

  <!-- A: check -->
  <rect x="84" y="86" width="248" height="46" rx="8" fill="#eef2f6" stroke="#2f5169" stroke-width="2"/>
  <text x="208" y="106" text-anchor="middle" font-size="14.5" fill="#1c1917">Check availability</text>
  <text x="208" y="124" text-anchor="middle" font-size="12.5" fill="#41586c">sees no conflict</text>

  <!-- B: check -->
  <rect x="384" y="144" width="248" height="46" rx="8" fill="#eef2f6" stroke="#2f5169" stroke-width="2"/>
  <text x="508" y="164" text-anchor="middle" font-size="14.5" fill="#1c1917">Check availability</text>
  <text x="508" y="182" text-anchor="middle" font-size="12.5" fill="#41586c">sees no conflict</text>

  <!-- A: insert + commit -->
  <rect x="84" y="202" width="248" height="46" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="208" y="222" text-anchor="middle" font-size="14.5" fill="#1c1917">Insert reservation</text>
  <text x="208" y="240" text-anchor="middle" font-size="12.5" fill="#41586c">commit</text>

  <!-- B: insert + commit -->
  <rect x="384" y="260" width="248" height="46" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="508" y="280" text-anchor="middle" font-size="14.5" fill="#1c1917">Insert reservation</text>
  <text x="508" y="298" text-anchor="middle" font-size="12.5" fill="#41586c">commit</text>

  <!-- both lanes lead into one outcome -->
  <line x1="208" y1="320" x2="208" y2="344" stroke="#8a2f2f" stroke-width="2" marker-end="url(#db-ah-red)"/>
  <line x1="508" y1="320" x2="508" y2="344" stroke="#8a2f2f" stroke-width="2" marker-end="url(#db-ah-red)"/>
  <rect x="140" y="346" width="420" height="54" rx="10" fill="#f6ece9" stroke="#8a2f2f" stroke-width="2"/>
  <text x="350" y="370" text-anchor="middle" font-size="15.5" font-weight="700" fill="#8a2f2f">INVALID SHARED STATE</text>
  <text x="350" y="389" text-anchor="middle" font-size="12.5" fill="#8a2f2f">two confirmed reservations overlap in one room</text>

  <g font-size="13" fill="#41586c" text-anchor="middle">
    <text x="350" y="424">Both transactions observe an available room before either reservation is committed.</text>
    <text x="350" y="441">Without adequate enforcement, both can commit conflicting reservations.</text>
  </g>
</svg>
