<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid), per the self-communicate drawing escape hatch: a fork-and-rejoin
     whose two branches are asymmetric by design (the optional ORM branch carries a dashed box and an
     extra generated-SQL node before rejoining), so the optionality, the generation step, and the single
     shared engine all read off the one drawing. Edge-style and dashed-optional semantics a graph
     auto-layout would drop. Palette, stroke, and type follow the course figure vocabulary
     (./representations.svg, ../../01-compute-environments-and-deployment/figures/ci-cd-pipeline.svg). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 508" width="700" height="508"
     role="img" aria-labelledby="qlTitle qlDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="qlTitle">Two paths from an application to the same query engine: direct SQL, or an
    optional object-relational mapper that generates SQL</title>
  <desc id="qlDesc">An APPLICATION node forks into two branches. The left branch is direct SQL. The
    right branch is an ORM, drawn with a dashed outline and labeled an optional layer; it leads to a
    generated-SQL node. Both branches rejoin and feed one QUERY ENGINE node, annotated parse, plan,
    execute, which in turn reaches STORED DATA. A footer note reads: the ORM is optional, and the SQL
    it generates reaches the same engine, so both paths depend on the plan the engine chooses.</desc>

  <defs>
    <marker id="ql-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <!-- solid paper ground so the figure stays legible on the dark theme -->
  <rect x="0" y="0" width="700" height="508" fill="#fdfcf9"/>

  <text x="350" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">TWO PATHS, ONE QUERY ENGINE</text>

  <!-- application -->
  <rect x="220" y="50" width="260" height="46" rx="10" fill="#faf7f0" stroke="#2f5169" stroke-width="2"/>
  <text x="350" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">APPLICATION</text>

  <!-- fork -->
  <g stroke="#2f5169" stroke-width="2" fill="none">
    <path d="M350,96 L350,118 L170,118 L170,136" marker-end="url(#ql-ah)"/>
    <path d="M350,96 L350,118 L530,118 L530,136" marker-end="url(#ql-ah)"/>
  </g>

  <!-- left branch: direct SQL -->
  <rect x="80" y="138" width="180" height="58" rx="10" fill="#eef2f6" stroke="#2f5169" stroke-width="2"/>
  <text x="170" y="164" text-anchor="middle" font-size="15" fill="#1c1917">Direct SQL</text>
  <text x="170" y="183" text-anchor="middle" font-size="11.5" fill="#41586c">written by the engineer</text>

  <!-- right branch: ORM (dashed = optional) -->
  <rect x="440" y="138" width="180" height="58" rx="10" fill="#eef2f6" stroke="#2f5169" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="530" y="164" text-anchor="middle" font-size="15" fill="#1c1917">ORM</text>
  <text x="530" y="183" text-anchor="middle" font-size="11.5" fill="#9a3f12">optional layer</text>

  <!-- ORM generates SQL -->
  <line x1="530" y1="196" x2="530" y2="226" stroke="#2f5169" stroke-width="2" marker-end="url(#ql-ah)"/>
  <rect x="440" y="228" width="180" height="46" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="530" y="257" text-anchor="middle" font-size="15" fill="#1c1917">Generated SQL</text>

  <!-- rejoin -->
  <g stroke="#2f5169" stroke-width="2" fill="none">
    <path d="M170,196 L170,302 L350,302 L350,326" marker-end="url(#ql-ah)"/>
    <path d="M530,274 L530,302 L350,302"/>
  </g>

  <!-- query engine -->
  <rect x="220" y="328" width="260" height="66" rx="12" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="350" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">QUERY ENGINE</text>
  <text x="350" y="378" text-anchor="middle" font-size="13" fill="#41586c">parse, plan, execute</text>

  <line x1="350" y1="394" x2="350" y2="422" stroke="#2f5169" stroke-width="2" marker-end="url(#ql-ah)"/>

  <!-- stored data -->
  <rect x="220" y="424" width="260" height="46" rx="10" fill="#eef2f6" stroke="#2f5169" stroke-width="2"/>
  <text x="350" y="453" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">STORED DATA</text>

  <text x="350" y="494" text-anchor="middle" font-size="13" font-style="italic" fill="#9a3f12">The ORM is optional; the SQL it generates reaches the same engine.</text>
</svg>
