<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid), per the self-communicate drawing escape hatch: two side-by-side
     panels showing the SAME room-reservation data as a relational schema (two tables, foreign key)
     and as documents (reservations nested inside each room) — tabular cell geometry and a nesting
     inset that a graph auto-layout cannot draw. Palette, stroke, and type follow the course figure
     vocabulary (act-2 .../05-building-with-agents/figures/software-factory.svg,
     .../01-delegation/figures/delegation-model.svg). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 516" width="760" height="516"
     role="img" aria-labelledby="drTitle drDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="drTitle">The same reservation information in a relational representation, as rooms and
    reservations tables joined by a foreign key, and in a document representation, as one document
    per room with its reservations nested inside</title>
  <desc id="drDesc">Two panels hold the same information. The relational panel shows a rooms table
    (room_id, building, capacity) with rows STEW 202 and HAMP 112, and a reservations table (res_id,
    room_id, start, end) with three bookings; an arrow labeled "room_id references rooms" marks the
    foreign key. Its caption: each room fact is stored once; reading a room with its bookings joins
    the tables; a reservation change updates one row. The document panel shows one document per room:
    the STEW 202 document lists room_id, building, capacity, and a nested reservations list holding
    its two bookings; the HAMP 112 document likewise nests its one booking. Its caption: one read
    returns a room with its reservations; a query across rooms must visit every document; editing
    one reservation rewrites the whole document.</desc>

  <defs>
    <marker id="dr-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <!-- solid paper ground so the figure stays legible on the dark theme -->
  <rect x="0" y="0" width="760" height="516" fill="#fdfcf9"/>

  <text x="380" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">SAME INFORMATION, TWO REPRESENTATIONS</text>

  <!-- panel headers -->
  <text x="196" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">RELATIONAL</text>
  <text x="196" y="92" text-anchor="middle" font-size="13" fill="#41586c">separate tables, linked by a foreign key</text>
  <text x="564" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">DOCUMENT</text>
  <text x="564" y="92" text-anchor="middle" font-size="13" fill="#41586c">reservations nested inside each room</text>

  <!-- ===== left panel: relational ===== -->
  <text x="48" y="114" font-size="14" font-weight="700" fill="#2f5169">rooms</text>
  <rect x="48" y="120" width="296" height="26" fill="#e7edf3" stroke="none"/>
  <rect x="48" y="120" width="296" height="78" fill="none" stroke="#2f5169" stroke-width="2"/>
  <g stroke="#2f5169" stroke-width="1">
    <line x1="48" y1="146" x2="344" y2="146"/>
    <line x1="48" y1="172" x2="344" y2="172"/>
    <line x1="148" y1="120" x2="148" y2="198"/>
    <line x1="244" y1="120" x2="244" y2="198"/>
  </g>
  <g font-size="13" font-weight="700" fill="#1c1917" text-anchor="middle">
    <text x="98" y="138">room_id</text>
    <text x="196" y="138">building</text>
    <text x="294" y="138">capacity</text>
  </g>
  <g font-size="13" fill="#1c1917" text-anchor="middle">
    <text x="98" y="164" fill="#2f5169" font-weight="700">STEW 202</text>
    <text x="196" y="164">Stewart</text>
    <text x="294" y="164">40</text>
    <text x="98" y="190" fill="#2f5169" font-weight="700">HAMP 112</text>
    <text x="196" y="190">Hampton</text>
    <text x="294" y="190">18</text>
  </g>

  <!-- foreign-key link: reservations.room_id references rooms.room_id -->
  <path d="M153,244 L153,222 L98,222 L98,202" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#dr-ah)"/>
  <text x="165" y="227" font-size="12.5" fill="#41586c">room_id references rooms</text>

  <text x="48" y="240" font-size="14" font-weight="700" fill="#2f5169">reservations</text>
  <rect x="48" y="246" width="296" height="26" fill="#e7edf3" stroke="none"/>
  <rect x="48" y="246" width="296" height="104" fill="none" stroke="#2f5169" stroke-width="2"/>
  <g stroke="#2f5169" stroke-width="1">
    <line x1="48" y1="272" x2="344" y2="272"/>
    <line x1="48" y1="298" x2="344" y2="298"/>
    <line x1="48" y1="324" x2="344" y2="324"/>
    <line x1="110" y1="246" x2="110" y2="350"/>
    <line x1="196" y1="246" x2="196" y2="350"/>
    <line x1="270" y1="246" x2="270" y2="350"/>
  </g>
  <g font-size="13" font-weight="700" fill="#1c1917" text-anchor="middle">
    <text x="79" y="264">res_id</text>
    <text x="153" y="264">room_id</text>
    <text x="233" y="264">start</text>
    <text x="307" y="264">end</text>
  </g>
  <g font-size="13" fill="#1c1917" text-anchor="middle">
    <text x="79" y="290">7001</text>
    <text x="153" y="290" fill="#2f5169" font-weight="700">STEW 202</text>
    <text x="233" y="290">Mon 10:00</text>
    <text x="307" y="290">Mon 11:00</text>
    <text x="79" y="316">7002</text>
    <text x="153" y="316" fill="#2f5169" font-weight="700">STEW 202</text>
    <text x="233" y="316">Mon 13:00</text>
    <text x="307" y="316">Mon 14:00</text>
    <text x="79" y="342">7003</text>
    <text x="153" y="342" fill="#2f5169" font-weight="700">HAMP 112</text>
    <text x="233" y="342">Tue 09:00</text>
    <text x="307" y="342">Tue 10:30</text>
  </g>

  <!-- ===== right panel: documents ===== -->
  <rect x="416" y="108" width="296" height="172" rx="10" fill="#eef2f6" stroke="#2f5169" stroke-width="2"/>
  <g font-size="13" fill="#1c1917">
    <text x="432" y="132">room_id: <tspan font-weight="700" fill="#2f5169">"STEW 202"</tspan></text>
    <text x="432" y="152">building: "Stewart"</text>
    <text x="432" y="172">capacity: 40</text>
    <text x="432" y="192">reservations:</text>
  </g>
  <rect x="440" y="200" width="256" height="66" rx="6" fill="#faf7f0" stroke="#2f5169" stroke-width="1"/>
  <g font-size="13" fill="#1c1917">
    <text x="452" y="224">- start: Mon 10:00, end: Mon 11:00</text>
    <text x="452" y="248">- start: Mon 13:00, end: Mon 14:00</text>
  </g>

  <rect x="416" y="292" width="296" height="142" rx="10" fill="#eef2f6" stroke="#2f5169" stroke-width="2"/>
  <g font-size="13" fill="#1c1917">
    <text x="432" y="316">room_id: <tspan font-weight="700" fill="#2f5169">"HAMP 112"</tspan></text>
    <text x="432" y="336">building: "Hampton"</text>
    <text x="432" y="356">capacity: 18</text>
    <text x="432" y="376">reservations:</text>
  </g>
  <rect x="440" y="384" width="256" height="42" rx="6" fill="#faf7f0" stroke="#2f5169" stroke-width="1"/>
  <text x="452" y="408" font-size="13" fill="#1c1917">- start: Tue 09:00, end: Tue 10:30</text>

  <!-- panel captions -->
  <g font-size="13.5" fill="#41586c" text-anchor="middle">
    <text x="196" y="452">Each room fact is stored once.</text>
    <text x="196" y="472">Reading a room with its bookings joins the tables;</text>
    <text x="196" y="492">a reservation change updates one row.</text>
    <text x="564" y="452">One read returns a room with its reservations.</text>
    <text x="564" y="472">A query across rooms must visit every document;</text>
    <text x="564" y="492">editing one reservation rewrites the whole document.</text>
  </g>
</svg>
