# Teach with MAGE — course companion site (MkDocs Material).
# Builds the authoritative Markdown in ../course into a static site served at the /teach/ subpath of the
# repository's single GitHub Pages deployment (the catalogue + book occupy the root). Source is NOT
# duplicated: MkDocs reads course/ directly. Local preview:  python3 -m mkdocs serve -f site/mkdocs.yml
site_name: Teach with MAGE
site_description: A course companion for teaching software engineering with MAGE (Model-based Agentic Engineering).
# The Pages base path (no custom domain) + the /teach/ subpath. use_directory_urls keeps internal links
# relative, so they resolve both locally and under this hosted base.
site_url: https://davisjam.github.io/model-based-agentic-software-engineering/teach/
repo_url: https://github.com/davisjam/model-based-agentic-software-engineering
edit_uri: edit/main/course/
copyright: >
  Teaching materials © James C. Davis and Steve France, licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.

docs_dir: ../course
use_directory_urls: true
strict: true  # fail the build on a bad internal link or nav reference (link-integrity gate)

# README.md + LICENSE under course/ are repo-facing, not site pages.
exclude_docs: |
  README.md
  LICENSE

# The home page is reachable via the navbar title/logo; it does not need a second
# redundant entry at the top of the sidebar. Keep it built + served, just out of the nav.
# The two redirect stubs (former Assessment / Oral Exams URLs) are built + served so old
# inbound links resolve, but they meta-refresh to the new /assessment/ pages and stay out of nav.
not_in_nav: |
  /index.md
  /oral-exams.md
  /project/assessment.md

theme:
  name: material
  # Wizard-hat identity (restrained, monochrome; the header icon adapts to light/dark).
  icon:
    logo: material/wizard-hat
  favicon: assets/wizard-hat.svg
  features:
    - navigation.sections   # top-level views as sections, not a deep tree
    - navigation.top        # back-to-top
    - navigation.indexes    # a section's index.md is its landing page
    - content.action.edit   # "edit this page" → the source under course/
    - toc.follow
  palette:
    # Purdue scheme (black + Boilermaker Gold on warm cream), harmonized with the main MAGE landing.
    # The exact colors are set in course/stylesheets/purdue.css (extra_css below); the named `black`
    # primary is a neutral base the stylesheet overrides. Light/dark toggle for reader preference.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: brown
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: brown
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  font: false  # no webfont fetch; use the system stack (privacy + no external request)

extra_css:
  - stylesheets/purdue.css   # Purdue black + Boilermaker Gold palette (overrides Material's defaults)

extra_javascript:
  - js/header-title-link.js  # make the header "Teach with MAGE" title link home (logo already does)

plugins:
  # Search intentionally omitted: at this site's scale the sidebar already exposes the full IA and users
  # browse rather than search, so the header search box only consumed prime space. Re-add `- search` if the
  # companion grows large enough to need full-text retrieval.
  - awesome-pages   # nav follows the course/ tree + .pages titles; add a lecture, it appears (no config edit)

hooks:
  - hooks/materials.py   # render a "Materials" section (links to pptx / typst / pdf) from `materials:` front matter
  - hooks/readings.py    # render per-module "Readings" from `readings:` front matter + the auto-gen Reading Guide
  - hooks/modules.py     # resolve {module:Title} tokens (e.g. on the Calendar) to links, derived from module front matter

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences

extra:
  social: []
