<!-- Hand-authored Chapter 5 print composition: source geometry and readable type, not blind shrinking. Original title/description and native monochrome partner retained. -->
<!-- semantic-families: governance, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" role="img" aria-labelledby="pdtTitle pdtDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="pdtTitle">Process design organizes production around the fabricator; tolerance bounds the
    product</title>
<desc id="pdtDesc">One large frame labelled SOFTWARE FACTORY holds two engineering concerns of equal
    standing, each introduced by a heading over a coloured rule. Across the top, under the heading
    PROCESS DESIGN — how production proceeds, a dashed band labelled PRODUCTION PROCESS carries a
    left-to-right path from engineering intent, through context and work, through a box labelled
    Fabricator, and out to a realization. All four boxes are drawn at the same firm weight: the
    fabricator is one station among them, not the centre of the picture. A bracket spans the whole path
    from the first box to the last, and beneath it, set larger than any label on the path, an annotation
    names what the process design determines: context, tools, routing, authority, sequencing. Below the
    band, under the heading TOLERANCE — what variation in the product is acceptable, a wide bounded
    region drawn in the governance colour is labelled ACCEPTABLE REGION. Dots inside it mark distinct
    acceptable realizations the fabricator may choose among. A measurement arrow drops from the
    realization to the top of that region, annotated with the mechanisms that establish where a
    realization falls: tests, property-based testing, analysis, simulation, human judgment. From the
    region two arrows of equal weight lead out, one labelled within tolerance to admitted change and one
    labelled outside to revise or reject.</desc>
