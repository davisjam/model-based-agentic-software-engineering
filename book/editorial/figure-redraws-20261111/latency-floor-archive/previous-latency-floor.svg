<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: interlude-latency-floor). The three-level GenAI dependency chain for the
     representative workload and its irreducible latency floor: section summary, then document summary, then
     alt text, summing to the floor. viewBox 920 for the figure font band. -->
<!-- semantic-families: modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 145" width="920" height="145" role="group" aria-labelledby="lfTitle lfDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="lfTitle">The GenAI dependency chain and its irreducible latency floor</title>
  <desc id="lfDesc">Three dependent GenAI levels in series: a section summary at 1.777 seconds feeds a
    document summary at 1.777 seconds, which feeds alt text at 4.1049 seconds. Because each level must
    complete before the next begins, their times add to an irreducible floor of 7.6589 seconds. The vision
    value is measured; the text-summary value is estimated.</desc>
<!-- Print refinement: retain the source geometry semantics and text; reflow labels at 450 bp publication width. -->
<defs>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/></marker>
<marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/></marker>
</defs>
<rect x="0" y="0" width="920" height="145" rx="0" fill="#fdfcf9" stroke="#fdfcf9" stroke-width="0"/>
<rect x="20" y="18" width="192" height="74" rx="7" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="116.0" y="49.6" font-size="20" text-anchor="middle" fill="#1c1917">section summary</text>
<text x="116.0" y="73.6" font-size="20" text-anchor="middle" fill="#1c1917">1.777 s</text>
<rect x="255" y="18" width="205" height="74" rx="7" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="357.5" y="49.6" font-size="20" text-anchor="middle" fill="#1c1917">document summary</text>
<text x="357.5" y="73.6" font-size="20" text-anchor="middle" fill="#1c1917">1.777 s</text>
<rect x="502" y="18" width="215" height="74" rx="7" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="609.5" y="49.6" font-size="20" text-anchor="middle" fill="#1c1917">alt text</text>
<text x="609.5" y="73.6" font-size="20" text-anchor="middle" fill="#1c1917">4.1049 s (measured)</text>
<rect x="760" y="18" width="140" height="74" rx="7" fill="#f3efe7" stroke="#1c1917" stroke-width="2"/>
<text x="830.0" y="49.6" font-size="20" text-anchor="middle" fill="#1c1917">floor</text>
<text x="830.0" y="73.6" font-size="20" text-anchor="middle" fill="#1c1917" font-weight="700">7.6589 s</text>
<line x1="212" y1="55" x2="255" y2="55" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow-ink)"/>
<line x1="460" y1="55" x2="502" y2="55" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow-ink)"/>
<line x1="717" y1="55" x2="760" y2="55" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow-ink)" stroke-dasharray="4 4"/>
<text x="460" y="126" font-size="20" text-anchor="middle" fill="#57534e" font-style="italic">each level waits for the one before it, so the times add</text>
</svg>
