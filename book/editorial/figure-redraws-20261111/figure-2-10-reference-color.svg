<svg xmlns="http://www.w3.org/2000/svg" width="782" height="800" viewBox="0 0 782 800" role="img" aria-labelledby="title desc">
<title id="title">Figure 2.10: Job Execution with Retries</title>
<desc id="desc">Editable vector recreation of the author-supplied reference. A state model for a remediation job, including retries.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#282828"/></marker>
  <marker id="brown-arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#83472b"/></marker>
  <linearGradient id="header" x2="0" y2="1"><stop stop-color="#e9ebf3"/><stop offset="1" stop-color="#e1e6f1"/></linearGradient>
  <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#e2eef8"/><stop offset="1" stop-color="#cfe3f5"/></linearGradient>
  <linearGradient id="purple" x2="0" y2="1"><stop stop-color="#f1eaf4"/><stop offset="1" stop-color="#e5ddea"/></linearGradient>
  <linearGradient id="green" x2="0" y2="1"><stop stop-color="#edf9df"/><stop offset="1" stop-color="#e0f3d3"/></linearGradient>
  <linearGradient id="yellow" x2="0" y2="1"><stop stop-color="#fff9db"/><stop offset="1" stop-color="#fff0bf"/></linearGradient>
  <linearGradient id="red" x2="0" y2="1"><stop stop-color="#ffe8e5"/><stop offset="1" stop-color="#ffd6d1"/></linearGradient>
</defs>
<style>text { font-family: 'Times New Roman', Times, 'Liberation Serif', serif; fill:#111; font-size:19px; } .edge { fill:none; stroke:#282828; stroke-width:2.25; marker-end:url(#arrow); } .leader { fill:none; stroke:#333; stroke-width:1.25; } .bold { font-weight:bold; }</style>
<rect width="782" height="800" fill="white"/>
<rect x="0.75" y="14.5" width="779.5" height="784.5" rx="20" fill="white" stroke="#aeb1ba" stroke-width="1.2"/>
<path d="M21,15 H760 Q780,15 780,35 V69 H1 V35 Q1,15 21,15 Z" fill="url(#header)"/>
<text x="34" y="50" font-size="29" style="font-size:29px;font-weight:bold;">Figure 2.10   Job Execution with Retries</text><text x="34" y="95" font-size="21.5" style="font-size:21.5px;font-style:italic;">A state model for a remediation job, including retries.</text><circle cx="56" cy="249" r="9" fill="#292929" stroke="#111" stroke-width="1"/><path d="M65,249 H104" class="edge" style="marker-end:url(#arrow)"/><rect x="105" y="223" width="127" height="52" rx="14" fill="url(#blue)" stroke="#484c53" stroke-width="1.6"/><text x="168.5" y="254" font-size="20" style="font-size:20px;" text-anchor="middle">Pending</text><path d="M232,249 L299,248" class="edge" style="marker-end:url(#brown-arrow)"/><rect x="300" y="222" width="135" height="52" rx="14" fill="url(#blue)" stroke="#30556f" stroke-width="1.6"/><text x="367.5" y="253" font-size="20" style="font-size:20px;" text-anchor="middle">Running</text><path d="M435,248 L522,249" class="edge" style="marker-end:url(#arrow)"/><rect x="523" y="223" width="150" height="54" rx="14" fill="url(#green)" stroke="#3b6537" stroke-width="1.6"/><text x="598" y="255" font-size="20" style="font-size:20px;" text-anchor="middle">Succeeded</text><path d="M367.5,274 V337" class="edge" style="marker-end:url(#arrow)"/><path d="M295,379 C265,360 266,307 304,273" class="edge" style="marker-end:url(#arrow)"/><path d="M442,374 C482,354 466,303 433,273" class="edge" style="marker-end:url(#arrow)"/><rect x="295" y="339" width="147" height="64" rx="14" fill="url(#yellow)" stroke="#b7831b" stroke-width="1.6"/><text x="368.5" y="366" font-size="20" style="font-size:20px;font-weight:bold;" text-anchor="middle">Retrying</text><text xml:space="preserve" x="368.5" y="387" style="font-size:20px;" text-anchor="middle"><tspan>(attempt = </tspan><tspan font-style="italic">n</tspan><tspan>)</tspan></text><path d="M368.5,403 V450" class="edge" style="marker-end:url(#arrow)"/><rect x="295" y="452" width="147" height="53" rx="14" fill="url(#red)" stroke="#8b4240" stroke-width="1.6"/><text x="368.5" y="484" font-size="20" style="font-size:20px;" text-anchor="middle">Failed</text><text x="242" y="150" font-size="19" style="font-size:19px;">A worker executes the</text><text x="242" y="170" font-size="19" style="font-size:19px;">next computation for the job.</text><path d="M361,178 L366,216" class="leader"/><circle cx="366" cy="216" r="3.5" fill="#303030"/><circle cx="361" cy="178" r="2.3" fill="#303030"/><text x="630" y="143" font-size="19" style="font-size:19px;">Job completes</text><text x="630" y="163" font-size="19" style="font-size:19px;">with a corrected</text><text x="630" y="183" font-size="19" style="font-size:19px;">document.</text><path d="M619,164 Q602,183 595,216" class="leader"/><circle cx="595" cy="216" r="3.5" fill="#303030"/><text x="528" y="345" font-size="19" style="font-size:19px;">On a repairable failure,</text><text xml:space="preserve" x="528" y="365" style="font-size:19px;"><tspan>retry (up to a limit, e.g., </tspan><tspan font-style="italic">n</tspan><tspan> ≤ 3).</tspan></text><path d="M517,344 L463,363" class="leader"/><circle cx="463" cy="363" r="3.5" fill="#303030"/><text x="528" y="457" font-size="19" style="font-size:19px;">If retries are exhausted</text><text x="528" y="477" font-size="19" style="font-size:19px;">or the error is not repairable,</text><text x="528" y="497" font-size="19" style="font-size:19px;">the job fails.</text><path d="M517,457 L449,478" class="leader"/><circle cx="449" cy="478" r="3.5" fill="#303030"/><rect x="25" y="542" width="729" height="214" rx="16" fill="white" stroke="#cfd1d7" stroke-width="1.3"/><text x="48" y="570" font-size="22" style="font-size:22px;font-weight:bold;">State meaning</text><text x="484" y="570" font-size="22" style="font-size:22px;font-weight:bold;">Key properties (examples)</text><path d="M457,570 V738" stroke="#9da0a8" stroke-width="1.3"/><rect x="49" y="586" width="41" height="21" rx="5" fill="url(#blue)" stroke="#30556f" stroke-width="1.6"/><text xml:space="preserve" x="103" y="601" style="font-size:19px;"><tspan font-weight="bold">Pending</tspan><tspan> — accepted, not yet running</tspan></text><rect x="49" y="618" width="41" height="21" rx="5" fill="url(#blue)" stroke="#30556f" stroke-width="1.6"/><text xml:space="preserve" x="103" y="633" style="font-size:19px;"><tspan font-weight="bold">Running</tspan><tspan> — executing a computation</tspan></text><rect x="49" y="650" width="41" height="21" rx="5" fill="url(#yellow)" stroke="#b7831b" stroke-width="1.6"/><text xml:space="preserve" x="103" y="665" style="font-size:19px;"><tspan font-weight="bold">Retrying</tspan><tspan> — will re-execute after a failure</tspan></text><rect x="49" y="682" width="41" height="21" rx="5" fill="url(#green)" stroke="#3b6537" stroke-width="1.6"/><text xml:space="preserve" x="103" y="697" style="font-size:19px;"><tspan font-weight="bold">Succeeded</tspan><tspan> — completed successfully</tspan></text><rect x="49" y="714" width="41" height="21" rx="5" fill="url(#red)" stroke="#8b4240" stroke-width="1.6"/><text xml:space="preserve" x="103" y="729" style="font-size:19px;"><tspan font-weight="bold">Failed</tspan><tspan> — terminated with an error</tspan></text><text x="490" y="601" font-size="20" style="font-size:20px;">•</text><text xml:space="preserve" x="510" y="601" style="font-size:19px;"><tspan>At most </tspan><tspan font-style="italic">N</tspan><tspan> retry attempts</tspan></text><text xml:space="preserve" x="510" y="622" style="font-size:19px;"><tspan>(e.g., </tspan><tspan font-style="italic">N</tspan><tspan> = 3).</tspan></text><text x="490" y="653" font-size="20" style="font-size:20px;">•</text><text x="510" y="653" font-size="19" style="font-size:19px;">A job eventually reaches</text><text x="510" y="674" font-size="20" style="font-size:20px;">Succeeded or Failed.</text><text x="490" y="706" font-size="20" style="font-size:20px;">•</text><text x="510" y="706" font-size="19" style="font-size:19px;">Only one worker actively</text><text x="510" y="727" font-size="19" style="font-size:19px;">executes the job at a time.</text></svg>
