<svg xmlns="http://www.w3.org/2000/svg" width="782" height="750" viewBox="0 70 782 750" role="img" aria-labelledby="title desc">
<title id="title">Figure 2.9: Remediation Graph (Typed)</title>
<desc id="desc">Editable vector recreation of the author-supplied reference. A typed, structural view of DocAble’s remediation computations.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#282828" /></marker>
  <marker id="brown-arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#444444" /></marker>
  <linearGradient id="header" x2="0" y2="1"><stop stop-color="#e7e7e7" /><stop offset="1" stop-color="#efefef" /></linearGradient>
  <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#eeeeee" /><stop offset="1" stop-color="#d7d7d7" /></linearGradient>
  <linearGradient id="purple" x2="0" y2="1"><stop stop-color="#f4f4f4" /><stop offset="1" stop-color="#e6e6e6" /></linearGradient>
  <linearGradient id="green" x2="0" y2="1"><stop stop-color="#f1f1f1" /><stop offset="1" stop-color="#e1e1e1" /></linearGradient>
  <linearGradient id="yellow" x2="0" y2="1"><stop stop-color="#fafafa" /><stop offset="1" stop-color="#ececec" /></linearGradient>
  <linearGradient id="red" x2="0" y2="1"><stop stop-color="#eeeeee" /><stop offset="1" stop-color="#d8d8d8" /></linearGradient>
</defs>
<style>text {font-family:'Source Sans 3', 'Source Sans Pro', sans-serif;fill:#111;font-size:19px} .edge {fill:none;stroke:#222;stroke-width:1.2;marker-end:url(#arrow)} .leader {fill:none;stroke:#555;stroke-width:.8}</style>
<rect x="0" y="70" width="782" height="750" fill="white" /><text x="34" y="95" font-size="21.5" style="font-size:21.5px;font-style:italic;">A typed structural model of DocAble’s remediation computations.</text><rect x="289" y="126" width="191" height="58" rx="4" fill="#dddddd" stroke="#333" stroke-width="1.2" /><text x="384.5" y="150" font-size="20" style="font-size:20px;font-weight:bold;" text-anchor="middle">Classify</text><text x="384.5" y="172" font-size="20" style="font-size:20px;" text-anchor="middle">(format, needs)</text><path d="M386,184 V211 Q386,223 374,223 H286 Q274,223 274,236 V252" class="edge" stroke-dasharray="9 6" style="marker-end:url(#arrow)" /><path d="M386,184 V211 Q386,223 398,223 H490 Q502,223 502,236 V252" class="edge" stroke-dasharray="9 6" style="marker-end:url(#arrow)" /><path d="M266,256.0 Q274,252.0 282,256.0 L361.0,298 Q371.0,306 361.0,314 L282,356.0 Q274,360.0 266,356.0 L187.0,314 Q177.0,306 187.0,298 Z" fill="#f2f2f2" stroke="#333" stroke-width="1.2" /><path d="M494,256.0 Q502,252.0 510,256.0 L589.0,298 Q599.0,306 589.0,314 L510,356.0 Q502,360.0 494,356.0 L415.0,314 Q405.0,306 415.0,298 Z" fill="#f2f2f2" stroke="#333" stroke-width="1.2" /><text x="274" y="286" font-size="20" style="font-size:20px;font-weight:bold;" text-anchor="middle">Repair</text><text x="274" y="307" font-size="20" style="font-size:20px;font-weight:bold;" text-anchor="middle">structure</text><text x="274" y="326" font-size="19" style="font-size:18px;" text-anchor="middle">(typed patch)</text><text x="502" y="286" font-size="20" style="font-size:20px;font-weight:bold;" text-anchor="middle">Repair</text><text x="502" y="307" font-size="20" style="font-size:20px;font-weight:bold;" text-anchor="middle">metadata</text><text x="502" y="326" font-size="19" style="font-size:18px;" text-anchor="middle">(typed patch)</text><path d="M274,358 V372 Q274,384 286,384 H331 Q343,384 343,396 V412" class="edge" style="marker-end:url(#arrow)" /><path d="M502,358 V372 Q502,384 490,384 H446 Q434,384 434,396 V412" class="edge" style="marker-end:url(#arrow)" /><rect x="281" y="414" width="211" height="56" rx="4" fill="#dddddd" stroke="#333" stroke-width="1.2" /><text x="386.5" y="438" font-size="20" style="font-size:20px;font-weight:bold;" text-anchor="middle">Apply patches</text><text x="386.5" y="459" font-size="20" style="font-size:20px;" text-anchor="middle">(apply seam)</text><path d="M386.5,470 V507" class="edge" style="marker-end:url(#arrow)" /><rect x="281" y="509" width="211" height="61" rx="4" fill="#bfbfbf" stroke="#333" stroke-width="1.2" /><text x="386.5" y="535" font-size="20" style="font-size:20px;font-weight:bold;" text-anchor="middle">Validate</text><text x="386.5" y="557" font-size="20" style="font-size:20px;" text-anchor="middle">(direct edit)</text><text x="56" y="149" font-size="19" style="font-size:19px;font-weight:bold;">Computation:</text><text x="56" y="169" font-size="19" style="font-size:19px;">a registered</text><text x="56" y="189" font-size="19" style="font-size:19px;">remediation step</text><text x="56" y="209" font-size="19" style="font-size:19px;">(<tspan font-style="italic">e.g.,</tspan> classify, repair,</text><text x="56" y="229" font-size="19" style="font-size:19px;">validate).</text><path d="M204,173 L282,156" class="leader" /><text x="578" y="168" font-size="19" style="font-size:19px;font-weight:bold;">Control gate:</text><text x="578" y="188" font-size="19" style="font-size:19px;">classification</text><path d="M566,182 Q542,206 518,250" class="leader" /><text x="69" y="368" font-size="19" style="font-size:19px;font-weight:bold;">Data flow:</text><text x="69" y="389" font-size="19" style="font-size:19px;">produces</text><text x="69" y="409" font-size="19" style="font-size:19px;">information</text><text x="69" y="429" font-size="19" style="font-size:19px;">used by another</text><text x="69" y="449" font-size="19" style="font-size:19px;">computation.</text><path d="M184,398 L274,425" class="leader" /><text x="590" y="357" font-size="19" style="font-size:19px;font-weight:bold;">Mutation behavior:</text><text x="606" y="381" font-size="19" style="font-size:19px;">typed patch —</text><text x="606" y="401" font-size="19" style="font-size:19px;">produces a patch</text><text x="606" y="424" font-size="19" style="font-size:19px;">direct edit —</text><text x="606" y="444" font-size="19" style="font-size:19px;">mutates document</text><path d="M579,382 L498,426" class="leader" /><text x="590" y="480" font-size="19" style="font-size:19px;font-weight:bold;">Apply seam:</text><text x="590" y="501" font-size="19" style="font-size:19px;">where patches are</text><text x="590" y="521" font-size="19" style="font-size:19px;">applied to the</text><path d="M579,499 L498,460" class="leader" /><rect x="25" y="584" width="734" height="132" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.2" /><text x="46" y="608" font-size="19" style="font-size:19px;font-weight:bold;">Node (computation) type</text><text x="400" y="608" font-size="19" style="font-size:19px;font-weight:bold;">Dependency (edge) type</text><path d="M376,608 V683" stroke="#b9bbc4" stroke-width="1.2" /><rect x="47" y="623" width="42" height="23" rx="4" fill="#dddddd" stroke="#333" stroke-width="1.2" /><text x="101" y="639" font-size="17.5" style="font-size:17.5px;">= Direct edit (mutates document)</text><path d="M64.775,655.1125 Q68,653.5 71.225,655.1125 L86.275,665.775 Q91.5,669 86.275,672.225 L71.225,682.8875 Q68,684.5 64.775,682.8875 L49.725,672.225 Q44.5,669 49.725,665.775 Z" fill="#f2f2f2" stroke="#333" stroke-width="1.2" /><text x="101" y="674" font-size="17.5" style="font-size:17.5px;">= Typed patch (produces a patch)</text><path d="M401,633 H445" class="edge" style="marker-end:url(#arrow)" /><text x="449" y="639" font-size="17.5" style="font-size:17.5px;">= Data flow (payload)</text><path d="M401,668 H445" class="edge" stroke-dasharray="9 6" style="marker-end:url(#arrow)" /><text x="449" y="674" font-size="17.5" style="font-size:17.5px;">= Control gate</text><rect x="12" y="726" width="758" height="85" rx="4" fill="#f7f7f7" stroke="#333" stroke-width="1.2" /><text xml:space="preserve" x="390" y="752.0" style="font-size:22px;" text-anchor="middle"><tspan font-weight="bold">125</tspan><tspan> registered computations; </tspan><tspan font-weight="bold">57</tspan><tspan> typed composition relations.</tspan></text><text text-anchor="middle" x="390" y="779.0" font-size="20" style="font-size:20px;font-style:italic;">The model preserves computation identity, mutation behavior, apply seams, and</text><text text-anchor="middle" x="390" y="801.0" font-size="20" style="font-size:20px;font-style:italic;">declared dependencies—not the code implementing each computation.</text><text x="578" y="208" style="font-size:19px;">determines which</text><text x="578" y="228" style="font-size:19px;">repairs run.</text><text x="590" y="381" style="font-size:19px;">•</text><text x="590" y="424" style="font-size:19px;">•</text><text x="590" y="541" style="font-size:19px;">document.</text><text x="449" y="692" style="font-size:17.5px;">(executes if condition holds)</text></svg>