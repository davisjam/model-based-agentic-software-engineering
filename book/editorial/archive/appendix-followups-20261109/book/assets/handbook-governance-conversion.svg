<svg xmlns="http://www.w3.org/2000/svg" width="234" height="244" viewBox="0 0 234 244" role="img" aria-labelledby="title desc" font-family="&quot;Source Sans 3&quot;, sans-serif">
<title id="title">Turn a recurring failure into inherited structure</title>
<desc id="desc">A compact sequence shows governance conversion: observe a recurring failure, classify it and choose an intervention, record the intended control in a durable work order, implement the mechanism, check its behavior and correspondence, and let later work inherit the constraint, sensor, or gate. The sequence describes an engineering method, not a count of recorded conversions.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="#1c1917"/></marker></defs>
<circle cx="22" cy="20" r="9" fill="#f1f4f6" stroke="#2f5169" stroke-width="0.65"/>
<text x="22" y="23.5" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">1</text>
<text x="45" y="19" text-anchor="start" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">Observed recurring failure</text>
<text x="45" y="34" text-anchor="start" font-size="10.5" font-weight="400" font-style="normal" fill="#57534e">Preserve the evidence</text>
<path d="M22,29 L22,51" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<circle cx="22" cy="60" r="9" fill="#f1f4f6" stroke="#2f5169" stroke-width="0.65"/>
<text x="22" y="63.5" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">2</text>
<text x="45" y="59" text-anchor="start" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">Classify and choose intervention</text>
<text x="45" y="74" text-anchor="start" font-size="10.5" font-weight="400" font-style="normal" fill="#57534e">Engineering judgment</text>
<path d="M22,69 L22,91" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<circle cx="22" cy="100" r="9" fill="#f1f4f6" stroke="#2f5169" stroke-width="0.65"/>
<text x="22" y="103.5" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">3</text>
<text x="45" y="99" text-anchor="start" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">Record the intended control</text>
<text x="45" y="114" text-anchor="start" font-size="10.5" font-weight="400" font-style="normal" fill="#57534e">A durable work order</text>
<path d="M22,109 L22,131" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<circle cx="22" cy="140" r="9" fill="#f1f4f6" stroke="#2f5169" stroke-width="0.65"/>
<text x="22" y="143.5" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">4</text>
<text x="45" y="139" text-anchor="start" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">Implement the mechanism</text>
<text x="45" y="154" text-anchor="start" font-size="10.5" font-weight="400" font-style="normal" fill="#57534e">Agentic implementation</text>
<path d="M22,149 L22,171" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<circle cx="22" cy="180" r="9" fill="#f1f4f6" stroke="#2f5169" stroke-width="0.65"/>
<text x="22" y="183.5" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">5</text>
<text x="45" y="179" text-anchor="start" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">Check behavior and correspondence</text>
<text x="45" y="194" text-anchor="start" font-size="10.5" font-weight="400" font-style="normal" fill="#57534e">Tests and model checks</text>
<path d="M22,189 L22,211" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<circle cx="22" cy="220" r="9" fill="#f1f4f6" stroke="#2f5169" stroke-width="0.65"/>
<text x="22" y="223.5" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">6</text>
<text x="45" y="219" text-anchor="start" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">Later work inherits the control</text>
<text x="45" y="234" text-anchor="start" font-size="10.5" font-weight="400" font-style="normal" fill="#57534e">Constraint · sensor · gate</text>
</svg>
