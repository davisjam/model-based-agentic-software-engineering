<svg xmlns="http://www.w3.org/2000/svg" width="390" height="224" viewBox="0 0 390 224" role="img" aria-labelledby="title desc" font-family="&quot;Source Sans 3&quot;, sans-serif">
<title id="title">Two models derive an authorization plan</title>
<desc id="desc">The service-flow model supplies caller-to-callee communication and its authentication obligation. The deployment model supplies the environment, runtime identity, and deployed resource names. Joining these models derives IAM grants from caller identities to callee resources. Deployment applies the grants. A separate correspondence check reconciles declared and observed service names; it does not establish that every IAM binding is present.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="#1c1917"/></marker></defs>
<rect x="4" y="4" width="171" height="66" rx="3" fill="#f1f4f6" stroke="#2f5169" stroke-width="0.65"/>
<rect x="215" y="4" width="171" height="66" rx="3" fill="#f1f4f6" stroke="#2f5169" stroke-width="0.65"/>
<text x="89.5" y="23" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">SERVICE-FLOW MODEL</text>
<text x="89.5" y="43" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Caller invokes callee</text>
<text x="89.5" y="59" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Authentication obligation</text>
<text x="300.5" y="23" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">DEPLOYMENT MODEL</text>
<text x="300.5" y="43" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Environment · runtime identity</text>
<text x="300.5" y="59" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Deployed resource names</text>
<path d="M89.5,70 L89.5,89 L300.5,89 L300.5,70" fill="none" stroke="#1c1917" stroke-width="0.65"/>
<path d="M195,89 L195,109" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<text x="209" y="101" text-anchor="start" font-size="10" font-weight="400" font-style="italic" fill="#57534e">join</text>
<rect x="55" y="109" width="280" height="47" rx="3" fill="white" stroke="#1c1917" stroke-width="0.65"/>
<text x="195" y="128" text-anchor="middle" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">DERIVED IAM GRANTS</text>
<text x="195" y="145" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Caller identity to callee resource</text>
<path d="M195,156 L195,176" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<rect x="15" y="176" width="360" height="44" rx="3" fill="white" stroke="#086438" stroke-width="0.65"/>
<text x="195" y="194" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">DEPLOYMENT + CORRESPONDENCE</text>
<text x="195" y="211" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Apply grants · reconcile deployed names</text>
</svg>
