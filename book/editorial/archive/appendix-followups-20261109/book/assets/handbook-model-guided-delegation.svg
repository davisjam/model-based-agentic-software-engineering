<svg xmlns="http://www.w3.org/2000/svg" width="395" height="264" viewBox="0 0 395 264" role="img" aria-labelledby="title desc" font-family="&quot;Source Sans 3&quot;, sans-serif">
<title id="title">Model-guided delegation preserves the assignment and its evidence</title>
<desc id="desc">A structured work order and maintained engineering models feed a selection step that assembles a brief containing selected knowledge and obligations. The agent implements and commits. Completion evidence combines durable landed changes and independent checks. Review uses this evidence to update the work order status; an agent report alone does not establish completion.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="#1c1917"/></marker></defs>
<rect x="30" y="4" width="170" height="59" rx="3" fill="white" stroke="#1c1917" stroke-width="0.65"/>
<rect x="220" y="4" width="170" height="59" rx="3" fill="#f1f4f6" stroke="#2f5169" stroke-width="0.65"/>
<text x="115" y="23" text-anchor="middle" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">WORK ORDER</text>
<text x="115" y="41" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Role · target paths</text>
<text x="115" y="56" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Verification · acceptance</text>
<text x="305" y="23" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">ENGINEERING MODELS</text>
<text x="305" y="41" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Components · constraints</text>
<text x="305" y="56" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Procedures</text>
<path d="M115,63 L115,82 L305,82 L305,63" fill="none" stroke="#1c1917" stroke-width="0.65"/>
<path d="M210,82 L210,102" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<text x="221" y="95" text-anchor="start" font-size="10" font-weight="400" font-style="italic" fill="#57534e">select</text>
<rect x="90" y="102" width="240" height="39" rx="3" fill="white" stroke="#1c1917" stroke-width="0.65"/>
<text x="210" y="119" text-anchor="middle" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">ASSEMBLED BRIEF</text>
<text x="210" y="134" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Selected knowledge · obligations</text>
<path d="M210,141 L210,161" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<rect x="90" y="161" width="240" height="34" rx="3" fill="white" stroke="#1c1917" stroke-width="0.65"/>
<text x="210" y="176" text-anchor="middle" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">AGENT</text>
<text x="210" y="189" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Implement · commit</text>
<path d="M210,195 L210,215" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<rect x="90" y="215" width="240" height="44" rx="3" fill="white" stroke="#086438" stroke-width="0.65"/>
<text x="210" y="232" text-anchor="middle" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">COMPLETION EVIDENCE</text>
<text x="210" y="249" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Landed changes · independent checks</text>
<path d="M90,237 L9,237 L9,34 L30,34" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<text x="50" y="169" text-anchor="middle" font-size="10" font-weight="400" font-style="italic" fill="#57534e">Review and</text>
<text x="50" y="182" text-anchor="middle" font-size="10" font-weight="400" font-style="italic" fill="#57534e">update status</text>
</svg>
