<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292.5 258" width="292.5" height="258" role="img" aria-labelledby="mbTitle mbDesc" font-family="&quot;Source Sans 3&quot;, sans-serif"><ns0:title xmlns:ns0="http://www.w3.org/2000/svg" id="mbTitle">DocAble's heterogeneous representations as peers around shared system identities</ns0:title>
  <ns0:desc xmlns:ns0="http://www.w3.org/2000/svg" id="mbDesc">A radial arrangement. At the center sit shared system identities. Seven DocAble
    representations — service registry, deployment topology, state machines, entitlement policy,
    computation graph, provenance records, and measurements — are peers around the center, each joined
    to it. No representation sits above another. Traceability, derivation, and query surfaces surround
    them in a footer band, not inside the identity hub. The unity is semantic, not a hierarchy.</ns0:desc>

