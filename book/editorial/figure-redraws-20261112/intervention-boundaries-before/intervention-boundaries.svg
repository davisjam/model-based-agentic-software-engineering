<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: intervention-boundaries). Fig 3.1-1. Four boundaries at which engineering
     work can be intervened on — reasoning input, action, work unit, artifact / runtime — ordered by
     increasing SEMANTIC GRAIN, NOT by increasing strength of enforcement (deliberately no blue->rust
     hardness ramp).
     v7 (part3-v7-260814): the GUIDANCE zone (reasoning input) is now VISUALLY SEPARATED from the
     ENFORCEMENT-binding boundaries — a distinct zone box set apart by a gap, so reasoning input reads as
     guidance, not enforcement. No continuous enforcement line runs over reasoning input; its note reads
     "enforced only through a consuming mechanism". The "semantic grain ->" axis spans the four
     boxes. Palette: agent #2f5169 + tint #e7edf3 (reasoning input / guidance zone), governance #9a3f12 +
     tint #faf1e6 (action / work unit / artifact-runtime / enforcement zone), neutral #57534e (grain axis,
     notes), ink #1c1917 names, paper #fdfcf9. Fonts in the 12-26 band at the 1000px reference. -->
<!-- semantic-families: agent, governance, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 384" width="1000" height="384"
     role="group" aria-labelledby="ibTitle ibDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="ibTitle">Four intervention boundaries: a guidance zone set apart from where enforcement can occur</title>
  <desc id="ibDesc">Four boundaries sit in a row, ordered left to right by increasing semantic grain, not by
    increasing strength of enforcement. The leftmost, reasoning input, sits alone in a separate GUIDANCE zone,
    drawn agent-blue: prompts, briefs, engineering models, and examples shape reasoning input, and are enforced
    only through a consuming mechanism. The other three — action, work unit, and artifact or runtime — sit
    together in a zone labeled ENFORCEMENT CAN OCCUR HERE, drawn governance-rust: at the action boundary through
    permissions, hooks, and tools; at the work-unit boundary through a task, a pull request, a build, a
    deployment candidate; at the artifact or runtime boundary through types, API seams, admission, and
    runtime policy. Place a mechanism at the earliest boundary where the obligation is legible and the
    consequence can be affected.</desc>

  <defs>
    <marker id="ib-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="384" fill="#fdfcf9"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">Where obligations can be enforced</text>
  <text x="500" y="68" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">Guidance shapes reasoning input; mechanisms can constrain actions</text>
  <text x="500" y="91" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">or determine what work and artifacts are accepted.</text>

  <!-- ===== GUIDANCE zone (reasoning input, set apart) ===== -->
  <rect x="28" y="116" width="252" height="196" rx="12" fill="#e7edf3" stroke="#2f5169" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="154" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#2f5169" letter-spacing="1">GUIDANCE</text>

  <!-- ===== ENFORCEMENT zone (action / work unit / artifact-runtime) ===== -->
  <rect x="292" y="116" width="668" height="196" rx="12" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="626" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12" letter-spacing="1">ENFORCEMENT CAN OCCUR HERE</text>

  <!-- boundary pills -->
  <rect x="56"  y="152" width="196" height="58" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="154" y="187" text-anchor="middle" font-size="20" font-weight="600" fill="#1c1917">reasoning input</text>

  <rect x="308" y="152" width="190" height="58" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="403" y="187" text-anchor="middle" font-size="20" font-weight="600" fill="#1c1917">action</text>

  <rect x="518" y="152" width="190" height="58" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="613" y="187" text-anchor="middle" font-size="20" font-weight="600" fill="#1c1917">work unit</text>

  <rect x="728" y="152" width="204" height="58" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="830" y="187" text-anchor="middle" font-size="20" font-weight="600" fill="#1c1917">artifact / runtime</text>

  <!-- the mechanisms that act at each boundary -->
  <text x="154" y="232" text-anchor="middle" font-size="20" fill="#2f5169">prompts · briefs</text>
  <text x="154" y="254" text-anchor="middle" font-size="20" fill="#2f5169">models · examples</text>

  <text x="403" y="232" text-anchor="middle" font-size="20" fill="#9a3f12">permissions · hooks</text>
  <text x="403" y="256" text-anchor="middle" font-size="20" fill="#9a3f12">tools</text>

  <text x="613" y="232" text-anchor="middle" font-size="20" fill="#9a3f12">task · PR · build</text>
  <text x="613" y="250" text-anchor="middle" font-size="20" fill="#9a3f12">deployment candidate</text>

  <text x="830" y="232" text-anchor="middle" font-size="20" fill="#9a3f12">types · API seams</text>
  <text x="830" y="250" text-anchor="middle" font-size="20" fill="#9a3f12">admission</text>
  <text x="830" y="274" text-anchor="middle" font-size="20" fill="#9a3f12">runtime policy</text>

  <!-- reasoning input is enforced only through a consumer -->
  <text x="154" y="280" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">enforced only through</text>
  <text x="154" y="302" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">a consuming mechanism</text>

  <!-- the grain axis: neutral, plain — spans the four boxes; grain increases, strength does not -->
  <text x="500" y="332" text-anchor="middle" font-size="20" font-weight="600" fill="#57534e">semantic grain →</text>
  <line x1="56" y1="342" x2="946" y2="342" stroke="#57534e" stroke-width="1.6" marker-end="url(#ib-axis)"/>
  <text x="56" y="362" font-size="20" font-style="italic" fill="#57534e">one attempted side effect</text>
  <text x="946" y="362" text-anchor="end" font-size="20" font-style="italic" fill="#57534e">the resulting system / state</text>
</svg>
