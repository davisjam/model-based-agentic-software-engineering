<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 446 275" width="1003.5" height="618.75" role="img" aria-labelledby="asTitle asDesc" font-family="'Source Sans 3', sans-serif">
<title id="asTitle">Selecting context for the work</title>
<desc id="asDesc">The work sequence runs from initial agent context to agent planning, refined agent context, and implementation. At dispatch, an initial selection from engineering knowledge uses anticipated files and components to supply a coarse slice. After planning, the refined scope drives a second selection from the same engineering knowledge; this selection may add or remove knowledge. Engineering knowledge contains models, rules, procedures and examples. Standing instructions, consisting of mission, compact method and compact policy, remain available throughout planning and implementation. There is no lifecycle feedback loop and no implication that retrieved guidance enforces obligations.</desc>
