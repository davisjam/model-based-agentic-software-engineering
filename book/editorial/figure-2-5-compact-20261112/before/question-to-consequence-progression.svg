<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 326" width="315" height="326" role="img" aria-labelledby="qapTitle qapDesc" font-family="&quot;Source Sans 3&quot;, sans-serif"><title id="qapTitle">From engineering question to engineering consequence</title>
  <desc id="qapDesc">A vertical progression. An engineering question leads to choosing a representation, whose
    representative forms include a closed state or action space, a finite transition system, or temporal
    behavior. The representation determines which analysis is appropriate — constraint solving, state
    exploration, model checking, simulation, and static analysis are examples, none prescribed by the
    representation alone. The path interprets the resulting evidence, then branches: the evidence can inform
    architecture and design — comparing alternatives, revising boundaries, changing dependencies, allocating
    resources — or it can expose a property whose obligation deserves enforcement, which hands off to Alignment
    in Chapter 3, or both.</desc>
