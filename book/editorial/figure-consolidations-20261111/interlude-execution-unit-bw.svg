<path d="M282,105 L291,105" fill="none" stroke="#222" stroke-width=".8"/>
<rect x="174" y="125" width="108" height="45" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="194" y="139" text-anchor="middle" style="font-size:11.2px;font-weight:bold;">Worker</text>
<text x="249" y="139" text-anchor="middle" style="font-size:10.4px;">Pages 11–20</text>
<rect x="179" y="145" width="53" height="22" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="205.5" y="159.4" text-anchor="middle" style="font-size:10.4px;">Structure</text>
<rect x="237" y="145" width="40" height="22" rx="3" fill="#d1d1d1" stroke="#444" stroke-width=".65"/>
<text x="257.0" y="159.4" text-anchor="middle" style="font-size:10.4px;">Media</text>
<path d="M163,156 L174,156" fill="none" stroke="#222" stroke-width=".8" marker-end="url(#arrow)"/>
<path d="M282,156 L291,156" fill="none" stroke="#222" stroke-width=".8"/>
<rect x="174" y="176" width="108" height="45" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="194" y="190" text-anchor="middle" style="font-size:11.2px;font-weight:bold;">Worker</text>
<text x="249" y="190" text-anchor="middle" style="font-size:10.4px;">Pages 21–30</text>
<rect x="179" y="196" width="53" height="22" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="205.5" y="210.4" text-anchor="middle" style="font-size:10.4px;">Structure</text>
<rect x="237" y="196" width="40" height="22" rx="3" fill="#d1d1d1" stroke="#444" stroke-width=".65"/>
<text x="257.0" y="210.4" text-anchor="middle" style="font-size:10.4px;">Media</text>
<path d="M163,207 L174,207" fill="none" stroke="#222" stroke-width=".8" marker-end="url(#arrow)"/>
<path d="M282,207 L291,207" fill="none" stroke="#222" stroke-width=".8"/>
<path d="M291,105 L291,222 L223,222 L223,234" fill="none" stroke="#222" stroke-width=".8" marker-end="url(#arrow)"/>
<rect x="192" y="235" width="62" height="24" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="223.0" y="250.39999999999998" text-anchor="middle" style="font-size:10.4px;">Merge</text>
<path d="M223,259 L223,270" fill="none" stroke="#222" stroke-width=".8" marker-end="url(#arrow)"/>
<rect x="192" y="271" width="62" height="24" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="223.0" y="286.4" text-anchor="middle" style="font-size:10.4px;">Output</text>
<rect x="338" y="47" width="68" height="26" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="372.0" y="63.400000000000006" text-anchor="middle" style="font-size:10.4px;">Document</text>
<path d="M372,73 L372,97" fill="none" stroke="#222" stroke-width=".8" marker-end="url(#arrow)"/>
<rect x="319" y="98" width="106" height="113" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="372" y="116" text-anchor="middle" style="font-size:11.2px;font-weight:bold;">Worker</text>
<text x="372" y="130" text-anchor="middle" style="font-size:10.4px;">(skeletonized)</text>
<rect x="326" y="140" width="92" height="25" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="372.0" y="155.9" text-anchor="middle" style="font-size:10.4px;">Structure</text>
<rect x="326" y="177" width="92" height="25" rx="3" fill="#d1d1d1" stroke="#444" stroke-width=".65"/>
<text x="372.0" y="192.9" text-anchor="middle" style="font-size:10.4px;">Media references</text>
<rect x="307" y="242" width="66" height="43" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="340.0" y="260.9" text-anchor="middle" style="font-size:10.4px;">GenAI</text>
<text x="340.0" y="272.9" text-anchor="middle" style="font-size:10.4px;">service</text>
<rect x="383" y="242" width="53" height="43" rx="3" fill="#d1d1d1" stroke="#444" stroke-width=".65"/>
<text x="409.5" y="260.9" text-anchor="middle" style="font-size:10.4px;">External</text>
<text x="409.5" y="272.9" text-anchor="middle" style="font-size:10.4px;">media</text>
<path d="M340,211 L340,242" fill="none" stroke="#222" stroke-width=".8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M416,211 L416,242" fill="none" stroke="#222" stroke-width=".8" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<path d="M397,242 L397,211" fill="none" stroke="#222" stroke-width=".8" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<text x="8" y="320" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="18" y="320" text-anchor="start" style="font-size:10.2px;">One worker retains the</text>
<text x="18" y="332" text-anchor="start" style="font-size:10.2px;">complete document.</text>
<text x="8" y="349" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="18" y="349" text-anchor="start" style="font-size:10.2px;">Structure and all media</text>
<text x="18" y="361" text-anchor="start" style="font-size:10.2px;">are resident.</text>
<text x="8" y="378" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="18" y="378" text-anchor="start" style="font-size:10.2px;">Memory scales with the</text>
<text x="18" y="390" text-anchor="start" style="font-size:10.2px;">document payload.</text>
<text x="158" y="316" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="168" y="316" text-anchor="start" style="font-size:10.2px;">The document is</text>
<text x="168" y="328" text-anchor="start" style="font-size:10.2px;">partitioned into page</text>
<text x="168" y="340" text-anchor="start" style="font-size:10.2px;">chunks.</text>
<text x="158" y="357" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="168" y="357" text-anchor="start" style="font-size:10.2px;">Each worker retains</text>
<text x="168" y="369" text-anchor="start" style="font-size:10.2px;">the chunk’s structure</text>
<text x="168" y="381" text-anchor="start" style="font-size:10.2px;">and media.</text>
<text x="158" y="398" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="168" y="398" text-anchor="start" style="font-size:10.2px;">A smaller working set</text>
<text x="168" y="410" text-anchor="start" style="font-size:10.2px;">per worker reduces</text>
<text x="168" y="422" text-anchor="start" style="font-size:10.2px;">memory.</text>
<text x="308" y="320" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="318" y="320" text-anchor="start" style="font-size:10.2px;">The worker retains</text>
<text x="318" y="332" text-anchor="start" style="font-size:10.2px;">structure and media</text>
<text x="318" y="344" text-anchor="start" style="font-size:10.2px;">references.</text>
<text x="308" y="361" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="318" y="361" text-anchor="start" style="font-size:10.2px;">Media is not resident,</text>
<text x="318" y="373" text-anchor="start" style="font-size:10.2px;">but streamed on demand.</text>
<text x="308" y="390" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="318" y="390" text-anchor="start" style="font-size:10.2px;">Media is processed by a</text>
<text x="318" y="402" text-anchor="start" style="font-size:10.2px;">GenAI service.</text></svg>
