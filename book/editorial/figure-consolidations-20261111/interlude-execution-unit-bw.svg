<text x="72.0" y="146.9" text-anchor="middle" style="font-size:10.4px;">Structure</text>
<rect x="26" y="169" width="92" height="42" rx="3" fill="#d1d1d1" stroke="#444" stroke-width=".65"/>
<text x="72.0" y="187.4" text-anchor="middle" style="font-size:10.4px;">Media</text>
<text x="72.0" y="199.4" text-anchor="middle" style="font-size:10.4px;">(all resident)</text>
<path d="M72,225 L72,250" fill="none" stroke="#222" stroke-width=".8" marker-end="url(#arrow)"/>
<rect x="38" y="251" width="68" height="26" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="72.0" y="267.4" text-anchor="middle" style="font-size:10.4px;">Output</text>
<rect x="190" y="47" width="66" height="20" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="223" y="61.400000000000006" text-anchor="middle" style="font-size:10.4px;">Document</text>
<path d="M223,67 L223,70 L163,70 L163,207" fill="none" stroke="#222" stroke-width=".8"/>
<rect x="174" y="74" width="108" height="45" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="194" y="88" text-anchor="middle" style="font-size:11.2px;font-weight:bold;">Worker</text>
