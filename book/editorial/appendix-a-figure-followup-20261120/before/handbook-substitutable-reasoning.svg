<svg xmlns="http://www.w3.org/2000/svg" width="1332" height="702" viewBox="0 0 444 234" role="img" aria-labelledby="title desc"><title id="title">Substitutable reasoning with stable domain obligations</title><desc id="desc">Task and workflow models guide two alternative engines: a pass-graph executor or a planning agent. Capability and selection knowledge informs model choice within an engine. Both engines produce typed proposals governed by an operation model and applied to the current artifact through a controlled application boundary. Separate evaluation and an acceptance model guide acceptance. Restricting mutation authority requires more than a typed request interface.</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.7" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="black"/></marker></defs><rect width="444" height="234" fill="white"/>
