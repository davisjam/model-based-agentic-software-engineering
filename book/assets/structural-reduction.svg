<?xml version="1.0" encoding="UTF-8"?>
<!-- Figure 2.2 concept (part2-content-revision-260814; folds to book/assets/).
     A structural model earns its usefulness by leaving most of the system out. The full TERRITORY (gray)
     is a crowd of runtime and implementation concerns — UI, queue, workers, retries, remediation + format
     libraries, storage, deployment. The purposeful reduction (arrow) suppresses all of it except the one
     architectural seam that answers the question, yielding a clean three-layer MODEL (blue). The question
     the reduction preserves — "Where may document mutation occur?" — is printed beneath the model, because
     a reduction is only justified by the question it keeps answerable. Grammar: gray #57534e = the full
     territory/implementation; blue #2f5169 = the reduced model. Hand-authored (a reduction, not a flow). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400"
     role="img" aria-labelledby="srTitle srDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="srTitle">Structural reduction: the full territory reduced to the seam that answers one question</title>
  <desc id="srDesc">On the left, the full territory: UI, queue, workers, retries, remediation and format
    libraries, storage, and deployment — a crowd of runtime and implementation detail. A purposeful
    reduction arrow points right to a clean three-layer model: remediation logic, structured document
    model, format implementation. The reduction preserves one question — where may document mutation
    occur — and suppresses everything unrelated to it.</desc>

  <defs>
    <marker id="sr-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <!-- LEFT: full territory (gray) — deliberately noisy but UNIFORM; no item is visually privileged -->
  <text x="235" y="34" text-anchor="middle" font-size="19.2" font-weight="700" letter-spacing="1.2" fill="#57534e">TERRITORY</text>
  <rect id="territory" x="40" y="48" width="390" height="284" rx="12" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>
  <g font-size="19.2" fill="#57534e" text-anchor="middle">
    <text x="118" y="88">UI</text>
    <text x="235" y="88">queue</text>
    <text x="352" y="88">workers</text>
    <text x="118" y="120">retries</text>
    <text x="235" y="120">scaling</text>
    <text x="352" y="120">cache</text>
    <text x="118" y="152">storage</text>
    <text x="235" y="152">deployment</text>
    <text x="352" y="152">logging</text>
    <text x="118" y="184">metrics</text>
    <text x="235" y="184">auth</text>
    <text x="352" y="184">config</text>
    <text x="118" y="216">remediation</text>
    <text x="235" y="216">format libs</text>
    <text x="352" y="216">billing</text>
  </g>
  <text x="235" y="278" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">most of the system is not relevant</text>
  <text x="235" y="300" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">to this question</text>

  <!-- reduction arrow: territory reduces to the surviving seam. Tail seats on the territory's right border,
       head on the seam box's left border (was floating in the whitespace between the two groups). -->
  <!-- edge: territory -> seam -->
  <line x1="430" y1="168" x2="598" y2="168" stroke="#2f5169" stroke-width="2.6" marker-end="url(#sr-b)"/>
  <text x="484" y="178" text-anchor="middle" font-size="19.2" font-weight="700" fill="#2f5169">purposeful</text>
  <text x="484" y="212" text-anchor="middle" font-size="19.2" font-weight="700" fill="#2f5169">reduction</text>

  <!-- RIGHT: reduced model (blue) -->
  <text x="745" y="34" text-anchor="middle" font-size="19.2" font-weight="700" letter-spacing="1.2" fill="#2f5169">MODEL</text>
  <rect id="rem-logic" x="600" y="60" width="290" height="52" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="745" y="92" text-anchor="middle" font-size="19.2" font-weight="700" fill="#2f5169">remediation logic</text>
  <!-- edge: rem-logic -> seam -->
  <line x1="745" y1="112" x2="745" y2="140" stroke="#2f5169" stroke-width="2.2" marker-end="url(#sr-b)"/>
  <!-- the ONE thing the reduction preserves: the seam. Highlighted; the other two layers are ordinary blue. -->
  <rect id="seam" x="600" y="142" width="290" height="52" rx="10" fill="#d3e0ea" stroke="#2f5169" stroke-width="3.4"/>
  <text x="745" y="168" text-anchor="middle" font-size="19.2" font-weight="700" fill="#2f5169">structured document model</text>
  <text x="745" y="186" text-anchor="middle" font-size="19.2" font-style="italic" fill="#2f5169">the surviving seam</text>
  <!-- edge: seam -> format-impl -->
  <line x1="745" y1="194" x2="745" y2="222" stroke="#2f5169" stroke-width="2.2" marker-end="url(#sr-b)"/>
  <rect id="format-impl" x="600" y="224" width="290" height="52" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="745" y="256" text-anchor="middle" font-size="19.2" font-weight="700" fill="#2f5169">format implementation</text>
  <text x="745" y="302" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">Question preserved:</text>
  <text x="745" y="322" text-anchor="middle" font-size="19.2" font-style="italic" fill="#1c1917">&#8220;Where may document mutation occur?&#8221;</text>

  <!-- footer: protect the point -->
  <text x="480" y="372" text-anchor="middle" font-size="19.2" font-style="italic" fill="#1c1917">The question determines what survives the reduction.</text>
</svg>
