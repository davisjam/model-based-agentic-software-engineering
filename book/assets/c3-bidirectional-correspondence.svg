<?xml version="1.0" encoding="UTF-8"?>
<!-- RB Engineering-Moves figure — c3-bidirectional-correspondence.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480"
     role="img" aria-labelledby="c3Title c3Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="c3Title">C.3 Keep representation and reality in correspondence, checked in both directions</title>
  <desc id="c3Desc">A model and the running system it describes, joined by two checks that run in opposite directions.
    One check reads a modeled claim and asks whether reality still satisfies it — this catches wrong modeled facts.
    The other check starts from reality and asks whether anything important has appeared outside the model — this
    catches unmodeled reality. Both must run: correspondence is a two-way invariant, not a one-time claim.</desc>

  <defs>
    <marker id="c3-ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- Heads seat on the box corners at ~56 deg; a perpendicular re-aim pulls the bottom arc up through the
       "catches unmodeled reality" caption, so this figure keeps its head angles (seating still enforced). -->
  <!-- edge-grammar: keep-angles -->

  <!-- MODEL (modeling pole) -->
  <rect id="model" x="120" y="150" width="230" height="90" rx="12" fill="#e3f0e7" stroke="#155c38" stroke-width="2.5"/>
  <text x="235" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#155c38">MODEL</text>
  <text x="235" y="218" text-anchor="middle" font-size="20" font-style="italic" fill="#1f7a4d">what we claim is true</text>

  <!-- REALITY (agent/system pole) -->
  <rect id="reality" x="650" y="150" width="230" height="90" rx="12" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="765" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#2f5169">REALITY</text>
  <text x="765" y="218" text-anchor="middle" font-size="20" font-style="italic" fill="#2f5169">the running system</text>

  <!-- top arc: MODEL claim -> REALITY (bows high, clears the label band) -->
  <!-- edge: model -> reality -->
  <path d="M350,150 C445,76 555,76 652,150" fill="none" stroke="#9a3f12" stroke-width="2.5" marker-end="url(#c3-ah-r)"/>
  <text x="500" y="64" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">claim</text>
  <text x="500" y="134" text-anchor="middle" font-size="20" fill="#1c1917">Does reality still satisfy the model?</text>
  <text x="500" y="153" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">catches a wrong modeled fact</text>

  <!-- bottom arc: REALITY -> MODEL (coverage) -->
  <!-- edge: reality -> model -->
  <path d="M650,240 C548,328 452,328 348,240" fill="none" stroke="#9a3f12" stroke-width="2.5" marker-end="url(#c3-ah-r)"/>
  <text x="500" y="260" text-anchor="middle" font-size="20" fill="#1c1917">Did something important appear outside the model?</text>
  <text x="500" y="279" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">catches unmodeled reality</text>
  <text x="500" y="350" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">coverage</text>

  <!-- footer -->
  <text x="500" y="410" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">Treat correspondence as an invariant, and check it in both directions.</text>
  <text x="500" y="438" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">One direction catches wrong modeled facts; the other catches reality the model never admitted.</text>
</svg>
