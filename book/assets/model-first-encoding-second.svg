<?xml version="1.0" encoding="UTF-8"?>
<!-- Figure 2.3 concept (part2-content-revision-260814; folds to book/assets/).
     The behavioral model is the reduced legal-transition relation, NOT the syntax used to encode it and NOT
     the implementation beneath. A vertical ladder from the engineering question down through four layers:
     the QUESTION (can durable state name an unpublished artifact?), the MODEL (blue) — the legal chain
     STAGED->UPLOADED->DB_UPDATED plus the forbidden bypass STAGED-X->DB_UPDATED — then the ENCODING (gray,
     the legal-transition relation as written) and the IMPLEMENTATION (gray, the code that realizes it).
     Grammar: blue #2f5169 = the model (what may happen, in what order); gray #57534e = encoding + impl;
     rust #9a3f12 = the one forbidden edge the model makes explicit. Hand-authored (a layer ladder). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560"
     role="img" aria-labelledby="mfTitle mfDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mfTitle">Model first, encoding second: the model is the legal-transition relation, not its syntax</title>
  <desc id="mfDesc">A vertical ladder of four layers. The engineering question: can durable state name an
    artifact recovery has not yet published? The model: a legal chain from STAGED to UPLOADED to DB_UPDATED,
    with a forbidden bypass edge from STAGED directly to DB_UPDATED. The encoding: an explicit
    legal-transition relation. The implementation: upload, persistence, retry, logging, error handling. The
    model is the reduced relation, distinct from the syntax and code that encode it.</desc>

  <defs>
    <marker id="mf-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
    <marker id="mf-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
    <marker id="mf-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- layer 1: engineering question (ink) -->
  <!-- transparent anchor: the engineering question is the source node of the ladder -->
  <rect id="question" x="110" y="16" width="460" height="48" fill="none" stroke="none"/>
  <text x="340" y="30" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.2" fill="#1c1917">ENGINEERING QUESTION</text>
  <text x="340" y="52" text-anchor="middle" font-size="15.5" font-style="italic" fill="#1c1917">Can durable state name an artifact recovery has not yet published?</text>
  <!-- edge: question -> model -->
  <line x1="340" y1="64" x2="340" y2="88" stroke="#2f5169" stroke-width="2.2" marker-end="url(#mf-b)"/>

  <!-- layer 2: MODEL (blue) -->
  <rect id="model" x="70" y="90" width="540" height="150" rx="12" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="94" y="116" font-size="14" font-weight="700" letter-spacing="1.2" fill="#2f5169">MODEL</text>
  <!-- legal chain -->
  <g font-size="15" font-weight="700" fill="#2f5169" text-anchor="middle">
    <rect id="staged" x="92" y="132" width="120" height="40" rx="9" fill="#dae4ec" stroke="#2f5169" stroke-width="2"/>
    <text x="152" y="157">STAGED</text>
    <rect id="uploaded" x="280" y="132" width="120" height="40" rx="9" fill="#dae4ec" stroke="#2f5169" stroke-width="2"/>
    <text x="340" y="157">UPLOADED</text>
    <rect id="db-updated" x="468" y="132" width="120" height="40" rx="9" fill="#dae4ec" stroke="#2f5169" stroke-width="2"/>
    <text x="528" y="157">DB_UPDATED</text>
  </g>
  <!-- edge: staged -> uploaded -->
  <line x1="212" y1="152" x2="278" y2="152" stroke="#2f5169" stroke-width="2.2" marker-end="url(#mf-b)"/>
  <!-- edge: uploaded -> db-updated -->
  <line x1="400" y1="152" x2="466" y2="152" stroke="#2f5169" stroke-width="2.2" marker-end="url(#mf-b)"/>
  <!-- forbidden bypass STAGED -> DB_UPDATED (rust, struck-but-spanning) -->
  <!-- edge: staged .. db-updated -->
  <path d="M152,172 C152,214 528,214 528,174" fill="none" stroke="#9a3f12" stroke-width="2.4" stroke-dasharray="9 6" marker-end="url(#mf-r)"/>
  <g stroke="#9a3f12" stroke-width="3.2" stroke-linecap="round">
    <line x1="329" y1="200" x2="351" y2="222"/>
    <line x1="351" y1="200" x2="329" y2="222"/>
  </g>
  <text x="340" y="234" text-anchor="middle" font-size="12.5" font-style="italic" fill="#9a3f12">may not skip publication</text>
  <!-- edge: model -> encoding -->
  <line x1="340" y1="240" x2="340" y2="268" stroke="#57534e" stroke-width="2.2" marker-end="url(#mf-k)"/>

  <!-- layer 3: ONE EXECUTABLE REPRESENTATION (gray) -->
  <rect id="encoding" x="150" y="270" width="380" height="52" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="340" y="294" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="0.8" fill="#57534e">ONE EXECUTABLE REPRESENTATION</text>
  <text x="340" y="313" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">explicit legal-transition relation</text>
  <!-- edge: encoding -> implementation -->
  <line x1="340" y1="322" x2="340" y2="350" stroke="#57534e" stroke-width="2.2" marker-end="url(#mf-k)"/>

  <!-- layer 4: IMPLEMENTATION (gray) -->
  <rect id="implementation" x="110" y="352" width="460" height="66" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="340" y="376" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.2" fill="#57534e">IMPLEMENTATION</text>
  <text x="340" y="399" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">upload + persistence + retry + logging + error handling + &#8230;</text>

  <!-- footer: protect the point -->
  <text x="340" y="470" text-anchor="middle" font-size="15.5" font-style="italic" fill="#1c1917">The behavioral model is the reduced legal-transition relation &#8212;</text>
  <text x="340" y="492" text-anchor="middle" font-size="15.5" font-style="italic" fill="#1c1917">not the syntax used to encode it. Its value: making one temporal obligation explicit.</text>
</svg>
