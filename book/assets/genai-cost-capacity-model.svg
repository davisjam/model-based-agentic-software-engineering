<?xml version="1.0" encoding="UTF-8"?>
<!-- 2.6 Measurement primary model (part2-content-revision-260814; folds to book/assets/).
     DocAble's GenAI cost-and-capacity model: the quantities that matter and how they relate. Generation
     work splits into usage and concurrency; usage relates to cost, concurrency to capacity; cost and
     capacity meet at a budget. The model is the engineering interpretation over raw telemetry — it says
     which quantities matter and how they relate, BEFORE any authority (observe / adapt / gate) is assigned.
     Grammar: blue #2f5169 = the modeled quantities and their relations (the measurement model). Hand-
     authored (a quantity-relation lattice, not a flowchart). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470"
     role="img" aria-labelledby="gcTitle gcDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="gcTitle">DocAble's GenAI cost-and-capacity measurement model</title>
  <desc id="gcDesc">Generation work is decomposed into two related quantities: usage and concurrency. Usage
    relates to cost; concurrency relates to capacity. Cost and capacity together relate to a budget. The
    model is the engineering interpretation placed over raw telemetry — which quantities matter and how they
    relate — before any authority is assigned to them.</desc>

  <defs>
    <marker id="gc-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <text x="320" y="30" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.2" fill="#2f5169">GENERATION-WORK QUANTITIES</text>

  <!-- generation work (blue, top) -->
  <rect x="210" y="46" width="220" height="52" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="320" y="78" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">generation work</text>

  <!-- split to usage / concurrency -->
  <g fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#gc-b)">
    <path d="M280,98 C220,124 175,130 150,152"/>
    <path d="M360,98 C420,124 465,130 490,152"/>
  </g>

  <rect x="80" y="154" width="140" height="48" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="150" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">usage</text>

  <rect x="420" y="154" width="140" height="48" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="490" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">concurrency</text>

  <!-- usage -> cost ; concurrency -> capacity -->
  <line x1="150" y1="202" x2="150" y2="248" stroke="#2f5169" stroke-width="2.2" marker-end="url(#gc-b)"/>
  <line x1="490" y1="202" x2="490" y2="248" stroke="#2f5169" stroke-width="2.2" marker-end="url(#gc-b)"/>

  <rect x="80" y="250" width="140" height="48" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="150" y="279" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">cost</text>

  <rect x="420" y="250" width="140" height="48" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="490" y="279" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">capacity</text>

  <!-- cost & capacity -> budget -->
  <g fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#gc-b)">
    <path d="M150,298 C150,340 230,350 280,362"/>
    <path d="M490,298 C490,340 410,350 360,362"/>
  </g>

  <rect x="230" y="364" width="180" height="50" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="320" y="395" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">budget</text>

  <!-- footer: protect the modeling-not-authority point -->
  <text x="320" y="442" text-anchor="middle" font-size="15" font-style="italic" fill="#1c1917">Which quantities matter, and how they relate &#8212;</text>
  <text x="320" y="462" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">the interpretation over telemetry, before authority is assigned.</text>
</svg>
