<?xml version="1.0" encoding="UTF-8"?>
<!-- 2.6 Measurement primary model (part2-v8-260814 re-author; folds to book/assets/).
     REVISION per v8 editor guidance (2.6-1): the model has TWO distinct envelopes, drawn as SEPARATE
     chains so capacity->budget never reads as one relation. generation work splits into two independent
     quantity chains: usage -> cost -> budget (the cost budget) and concurrency -> capacity -> capacity
     envelope. Each chain terminates in its own envelope; the two are not joined. Grammar: blue #2f5169 =
     the modeled quantities and their relations (the measurement model). Hand-authored (two quantity
     chains, not one lattice meeting at a shared budget). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 390" width="660" height="390"
     role="img" aria-labelledby="gcTitle gcDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="gcTitle">DocAble's GenAI cost-and-capacity measurement model: two separate envelopes</title>
  <desc id="gcDesc">Generation work splits into two independent quantity chains. One chain: usage relates
    to cost, which is compared against a cost budget. A separate chain: concurrency relates to capacity,
    which is compared against a capacity envelope. The two chains are drawn apart because they are distinct
    envelopes, not one shared budget.</desc>

  <defs>
    <marker id="gc-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <text x="330" y="30" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.2" fill="#2f5169">TWO ENVELOPES, NOT ONE</text>

  <!-- generation work (source, left, spans both chains) -->
  <rect x="24" y="128" width="132" height="86" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="90" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">generation</text>
  <text x="90" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">work</text>

  <!-- split to the two chains -->
  <path d="M156,150 C176,120 178,110 190,100" fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#gc-b)"/>
  <path d="M156,192 C176,222 178,232 190,242" fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#gc-b)"/>

  <!-- ===== TOP CHAIN: usage -> cost -> budget ===== -->
  <g font-size="16" font-weight="700" fill="#2f5169" text-anchor="middle">
    <rect x="190" y="76" width="110" height="50" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
    <text x="245" y="107">usage</text>
    <rect x="340" y="76" width="100" height="50" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
    <text x="390" y="107">cost</text>
    <rect x="480" y="76" width="150" height="50" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
    <text x="555" y="99" font-size="15">cost</text>
    <text x="555" y="118" font-size="15">budget</text>
  </g>
  <line x1="300" y1="101" x2="338" y2="101" stroke="#2f5169" stroke-width="2.2" marker-end="url(#gc-b)"/>
  <line x1="440" y1="101" x2="478" y2="101" stroke="#2f5169" stroke-width="2.2" marker-end="url(#gc-b)"/>

  <!-- ===== BOTTOM CHAIN: concurrency -> capacity -> capacity envelope ===== -->
  <g font-size="16" font-weight="700" fill="#2f5169" text-anchor="middle">
    <rect x="190" y="242" width="110" height="50" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
    <text x="245" y="266" font-size="14">concurrency</text>
    <rect x="340" y="242" width="100" height="50" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
    <text x="390" y="273">capacity</text>
    <rect x="480" y="242" width="150" height="50" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
    <text x="555" y="265" font-size="15">capacity</text>
    <text x="555" y="284" font-size="15">envelope</text>
  </g>
  <line x1="300" y1="267" x2="338" y2="267" stroke="#2f5169" stroke-width="2.2" marker-end="url(#gc-b)"/>
  <line x1="440" y1="267" x2="478" y2="267" stroke="#2f5169" stroke-width="2.2" marker-end="url(#gc-b)"/>

  <!-- footer: protect the two-envelopes point -->
  <text x="330" y="346" text-anchor="middle" font-size="15" font-style="italic" fill="#1c1917">Two chains, two envelopes &#8212; usage feeds a cost budget,</text>
  <text x="330" y="366" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">concurrency feeds a capacity envelope; they are not one relation.</text>
</svg>
