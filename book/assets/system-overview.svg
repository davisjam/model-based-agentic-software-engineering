<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" role="group" aria-labelledby="sysov-title sysov-desc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="sysov-title">What got built — one upload crosses six responsibilities to a stamped result</title>
  <desc id="sysov-desc">A left-to-right pipeline. A user uploads a document at the left. It flows through six responsibilities in order: a front door that authenticates the user, meters the quota, and enqueues the job; a dispatcher that splits the document into work units so a large deck finishes in about a minute; a remediation core that, for each fix, either applies a deterministic rule or asks a bounded model; a check engine that maps each remaining finding to a clause of the accessibility standard; a fidelity validator that catches a file that came out more accessible but less true; and a provenance layer that stamps every insertion. The corrected file, with evidence, returns at the right. The one amber stage uses a bounded model call; every other stage is deterministic code that owns the boundaries.</desc>
  <defs>
    <marker id="sysov-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="380" fill="#ffffff"/>

  <!-- input -->
  <text x="50" y="176" text-anchor="middle" font-size="22.4" font-weight="700" fill="#3730a3">Upload</text>
  <text x="50" y="200" text-anchor="middle" font-size="22.4" fill="#4338ca">a doc</text>
  <line x1="90" y1="180" x2="98" y2="180" stroke="#475569" stroke-width="2.4" marker-end="url(#sysov-arrow)"/>

  <!-- six responsibility stages: title + one subordinate line; box colour carries the model-vs-deterministic distinction -->
  <rect id="front-door" x="100" y="120" width="160" height="120" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="180" y="172" text-anchor="middle" font-size="22.4" font-weight="700" fill="#0f172a">Front door</text>
  <text x="180" y="200" text-anchor="middle" font-size="22.4" fill="#334155">auth · quota</text>
  <line x1="260" y1="180" x2="266" y2="180" stroke="#475569" stroke-width="2.4" marker-end="url(#sysov-arrow)"/>

  <rect id="dispatcher" x="268" y="120" width="160" height="120" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="348" y="172" text-anchor="middle" font-size="22.4" font-weight="700" fill="#0f172a">Dispatcher</text>
  <text x="348" y="200" text-anchor="middle" font-size="22.4" fill="#334155">split units</text>
  <line x1="428" y1="180" x2="434" y2="180" stroke="#475569" stroke-width="2.4" marker-end="url(#sysov-arrow)"/>

  <rect id="remediation-core" x="436" y="120" width="160" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.4"/>
  <text x="516" y="172" text-anchor="middle" font-size="22.4" font-weight="700" fill="#7c2d12">Remediation</text>
  <text x="516" y="200" text-anchor="middle" font-size="22.4" fill="#78350f">rule / model</text>
  <line x1="596" y1="180" x2="602" y2="180" stroke="#475569" stroke-width="2.4" marker-end="url(#sysov-arrow)"/>

  <rect id="check-engine" x="604" y="120" width="160" height="120" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="684" y="172" text-anchor="middle" font-size="22.4" font-weight="700" fill="#0f172a">Check engine</text>
  <text x="684" y="200" text-anchor="middle" font-size="22.4" fill="#334155">to standard</text>
  <line x1="764" y1="180" x2="770" y2="180" stroke="#475569" stroke-width="2.4" marker-end="url(#sysov-arrow)"/>

  <rect id="fidelity-validator" x="772" y="120" width="160" height="120" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="852" y="172" text-anchor="middle" font-size="22.4" font-weight="700" fill="#0f172a">Fidelity</text>
  <text x="852" y="200" text-anchor="middle" font-size="22.4" fill="#334155">content kept</text>
  <line x1="932" y1="180" x2="938" y2="180" stroke="#475569" stroke-width="2.4" marker-end="url(#sysov-arrow)"/>

  <rect id="provenance-layer" x="940" y="120" width="160" height="120" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="1020" y="172" text-anchor="middle" font-size="22.4" font-weight="700" fill="#0f172a">Provenance</text>
  <text x="1020" y="200" text-anchor="middle" font-size="22.4" fill="#334155">stamp inserts</text>

  <!-- output -->
  <line x1="1020" y1="240" x2="1020" y2="286" stroke="#475569" stroke-width="2.4" marker-end="url(#sysov-arrow)"/>
  <rect id="result" x="820" y="288" width="288" height="66" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="964" y="328" text-anchor="middle" font-size="22.4" font-weight="700" fill="#065f46">Corrected file + evidence</text>

  <!-- legend -->
  <rect x="20" y="296" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="50" y="311" font-size="22.4" fill="#334155">amber — bounded model call</text>
  <rect x="20" y="326" width="22" height="16" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="341" font-size="22.4" fill="#334155">rest — deterministic code</text>
</svg>
