<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" role="group" aria-labelledby="sysov-title sysov-desc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="sysov-title">What got built — one upload crosses six responsibilities to a stamped result</title>
  <desc id="sysov-desc">A left-to-right pipeline. A user uploads a document at the left. It flows through six responsibilities in order: a front door that authenticates the user, meters the quota, and enqueues the job; a dispatcher that splits the document into chunks so a large deck finishes in about a minute; a remediation core, a typed command-line engine that walks the document through a structured model of its format and, for each fix, either applies a deterministic rule or asks a frontier model; a check engine that maps each remaining finding to a specific clause of the accessibility standard; a fidelity validator that catches a file that came out more accessible and less true; and a provenance layer that stamps every insertion. The corrected file, with evidence that the job was done, returns at the right. Frontier models do only the steps that require understanding a slide; deterministic code does everything else and owns the boundaries between the stages.</desc>
  <defs>
    <marker id="sysov-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="400" fill="#ffffff"/>

  <!-- upload -->
  <g>
    <rect id="upload" x="18" y="150" width="120" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="78" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#3730a3">Upload</text>
    <text x="78" y="214" text-anchor="middle" font-size="13" fill="#4338ca">a PPTX, DOCX,</text>
    <text x="78" y="230" text-anchor="middle" font-size="13" fill="#4338ca">XLSX, or PDF</text>
  </g>
  <!-- edge: upload -> front-door -->
  <line x1="138" y1="200" x2="176" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#sysov-arrow)"/>

  <!-- six responsibility boxes -->
  <!-- box template: width 138, gap to arrow -->
  <g font-size="14">
    <!-- 1 Front door -->
    <rect id="front-door" x="178" y="120" width="140" height="160" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="248" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">1 · Front door</text>
    <text x="248" y="178" text-anchor="middle" fill="#334155">authenticate,</text>
    <text x="248" y="196" text-anchor="middle" fill="#334155">meter quota,</text>
    <text x="248" y="214" text-anchor="middle" fill="#334155">enqueue the job</text>
    <text x="248" y="256" text-anchor="middle" font-size="12" fill="#64748b">deterministic</text>

    <!-- 2 Dispatcher -->
    <rect id="dispatcher" x="338" y="120" width="140" height="160" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="408" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">2 · Dispatcher</text>
    <text x="408" y="178" text-anchor="middle" fill="#334155">split into</text>
    <text x="408" y="196" text-anchor="middle" fill="#334155">chunks — slides,</text>
    <text x="408" y="214" text-anchor="middle" fill="#334155">pages, sheets</text>
    <text x="408" y="256" text-anchor="middle" font-size="12" fill="#64748b">deterministic</text>

    <!-- 3 Remediation core -->
    <rect id="remediation-core" x="498" y="120" width="140" height="160" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="568" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">3 · Remediation</text>
    <text x="568" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">core</text>
    <text x="568" y="192" text-anchor="middle" fill="#78350f">rule OR a</text>
    <text x="568" y="210" text-anchor="middle" fill="#78350f">bounded model</text>
    <text x="568" y="228" text-anchor="middle" fill="#78350f">call, per fix</text>
    <text x="568" y="256" text-anchor="middle" font-size="12" fill="#92400e">model + code</text>

    <!-- 4 Check engine -->
    <rect id="check-engine" x="658" y="120" width="140" height="160" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="728" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">4 · Check engine</text>
    <text x="728" y="178" text-anchor="middle" fill="#334155">map each finding</text>
    <text x="728" y="196" text-anchor="middle" fill="#334155">to a standard</text>
    <text x="728" y="214" text-anchor="middle" fill="#334155">clause</text>
    <text x="728" y="256" text-anchor="middle" font-size="12" fill="#64748b">deterministic</text>

    <!-- 5 Fidelity validator -->
    <rect id="fidelity-validator" x="818" y="120" width="140" height="160" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="888" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">5 · Fidelity</text>
    <text x="888" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">validator</text>
    <text x="888" y="192" text-anchor="middle" fill="#334155">catch more</text>
    <text x="888" y="210" text-anchor="middle" fill="#334155">accessible,</text>
    <text x="888" y="228" text-anchor="middle" fill="#334155">less true</text>
    <text x="888" y="256" text-anchor="middle" font-size="12" fill="#64748b">deterministic</text>

    <!-- 6 Provenance layer -->
    <rect id="provenance-layer" x="978" y="120" width="124" height="160" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="1040" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">6 · Provenance</text>
    <text x="1040" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">layer</text>
    <text x="1040" y="192" text-anchor="middle" fill="#334155">stamp every</text>
    <text x="1040" y="210" text-anchor="middle" fill="#334155">insertion for</text>
    <text x="1040" y="228" text-anchor="middle" fill="#334155">audit</text>
    <text x="1040" y="256" text-anchor="middle" font-size="12" fill="#64748b">deterministic</text>
  </g>

  <!-- inter-stage arrows -->
  <g stroke="#475569" stroke-width="2">
    <!-- edge: front-door -> dispatcher -->
    <line x1="318" y1="200" x2="336" y2="200" marker-end="url(#sysov-arrow)"/>
    <!-- edge: dispatcher -> remediation-core -->
    <line x1="478" y1="200" x2="496" y2="200" marker-end="url(#sysov-arrow)"/>
    <!-- edge: remediation-core -> check-engine -->
    <line x1="638" y1="200" x2="656" y2="200" marker-end="url(#sysov-arrow)"/>
    <!-- edge: check-engine -> fidelity-validator -->
    <line x1="798" y1="200" x2="816" y2="200" marker-end="url(#sysov-arrow)"/>
    <!-- edge: fidelity-validator -> provenance-layer -->
    <line x1="958" y1="200" x2="976" y2="200" marker-end="url(#sysov-arrow)"/>
  </g>

  <!-- output arrow down + result -->
  <!-- edge: provenance-layer -> result -->
  <line x1="1040" y1="280" x2="1040" y2="318" stroke="#475569" stroke-width="2" marker-end="url(#sysov-arrow)"/>
  <g>
    <rect id="result" x="820" y="320" width="290" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="965" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Corrected file + evidence</text>
    <text x="965" y="368" text-anchor="middle" font-size="13" fill="#047857">standards findings · fidelity · provenance</text>
  </g>

  <!-- legend -->
  <g font-size="13">
    <rect x="20" y="330" width="20" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="48" y="342" fill="#334155">frontier model does the understanding</text>
    <rect x="20" y="356" width="20" height="14" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="48" y="368" fill="#334155">deterministic code owns the boundaries</text>
  </g>
</svg>
