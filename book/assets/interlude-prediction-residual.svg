<polygon points="368,201 421,225 368,249 315,225" fill="#f3f3f3" stroke="black" stroke-width=".6"/>
<text x="368" y="222.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Residual</text>
<text x="368" y="234.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">acceptable?</text>
<path d="M421,225 L440,225 L440,43 L424,43" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<text x="429" y="217.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">No</text>
<rect x="312.0" y="265.0" width="112" height="24" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="368" y="280.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Keep the change</text>
<path d="M368,249 L368,265" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<text x="382" y="260.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Yes</text>
