<svg xmlns="http://www.w3.org/2000/svg" width="888" height="580" viewBox="0 0 444 290" role="img" aria-labelledby="title desc">
<title id="title">Modeling through prediction and measurement</title>
<desc id="desc">Three panels: an engineering loop, an illustrative latency residual, and revision until the residual is acceptable.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 Z" fill="black"/></marker></defs>
<rect width="444" height="290" fill="white"/>
<rect x="0" y="0" width="132" height="23" rx="3" fill="#e8e8e8"/>
<text x="66.0" y="14.8" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="700" font-style="normal">(a) The engineering loop</text>
<rect x="139" y="0" width="163" height="23" rx="3" fill="#e8e8e8"/>
<text x="220.5" y="14.8" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="700" font-style="normal">(b) One prediction error</text>
<rect x="309" y="0" width="135" height="23" rx="3" fill="#e8e8e8"/>
<text x="376.5" y="14.8" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="700" font-style="normal">(c) Revise and repeat</text>
<path d="M135.5,0 L135.5,288" fill="none" stroke="black" stroke-width=".65"/>
<path d="M305.5,0 L305.5,288" fill="none" stroke="black" stroke-width=".65"/>
<rect x="3.0" y="31.0" width="94" height="24" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="50" y="46.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Problem</text>
<rect x="3.0" y="68.0" width="94" height="24" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="50" y="83.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Model</text>
<rect x="3.0" y="105.0" width="94" height="24" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="50" y="120.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Analyze</text>
<rect x="1.0" y="142.0" width="98" height="24" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="50" y="157.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Prediction / design</text>
<rect x="3.0" y="179.0" width="94" height="24" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="50" y="194.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Implementation</text>
<rect x="3.0" y="216.0" width="94" height="24" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="50" y="231.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Measurement</text>
<rect x="1.0" y="253.0" width="98" height="24" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="50" y="268.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Explain residual</text>
<path d="M50,55 L50,68" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M50,92 L50,105" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M50,129 L50,142" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M50,166 L50,179" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M50,203 L50,216" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M50,240 L50,253" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M99,265 L130,265 L130,80 L97,80" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<text x="115" y="173.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="italic">refine</text>
<text x="115" y="185.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="italic">model</text>
<rect x="145.0" y="64.0" width="146" height="28" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="218" y="81.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Model predicts 11.5 s</text>
<rect x="145.0" y="110.0" width="146" height="28" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="218" y="127.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Observed 17.8 s</text>
<rect x="145.0" y="156.0" width="146" height="28" rx="3" fill="rgb(235,235,235)" stroke="black" stroke-width=".6"/>
<text x="218" y="173.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="700" font-style="normal">Residual: +6.3 s</text>
<path d="M218,92 L218,110" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M218,138 L218,156" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M218,184 L218,210" fill="none" stroke="black" stroke-width=".65"/>
<path d="M165,210 L272,210" fill="none" stroke="black" stroke-width=".65"/>
<rect x="139.0" y="231.0" width="52" height="38" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="165" y="247.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Wrong</text>
<text x="165" y="259.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">parameter</text>
<path d="M165,210 L165,231" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<rect x="195.0" y="231.0" width="46" height="38" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="218" y="247.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Wrong</text>
<text x="218" y="259.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">relation</text>
<path d="M218,210 L218,231" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<rect x="243.5" y="231.0" width="57" height="38" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="272" y="247.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Missing</text>
<text x="272" y="259.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">mechanism</text>
<path d="M272,210 L272,231" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<rect x="312.0" y="30.0" width="112" height="26" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="368" y="46.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Update the model</text>
<rect x="312.0" y="69.0" width="112" height="34" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="368" y="83.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Reanalyze</text>
<text x="368" y="95.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">(e.g., new prediction)</text>
<rect x="312.0" y="118.0" width="112" height="26" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="368" y="134.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Implement change</text>
<rect x="312.0" y="159.0" width="112" height="26" rx="3" fill="rgb(255,255,255)" stroke="black" stroke-width=".6"/>
<text x="368" y="175.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="400" font-style="normal">Measure again</text>
<path d="M368,56 L368,69" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M368,103 L368,118" fill="none" stroke="black" stroke-width=".65" marker-end="url(#arrow)"/>
