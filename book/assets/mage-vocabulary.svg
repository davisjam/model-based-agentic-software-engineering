<?xml version="1.0" encoding="UTF-8"?>
<!-- HAND-AUTHORED one-off glossary section-map (geometry-per-concept redraw 260810; NEW figure, ratify-optional). Not machine-projected; edit this SVG directly. -->
<!-- NOUN-SPINE geometry — the grammar of the book. One vertical chain of nouns, each edge a verb; every other glossary figure instantiates a slice of this spine. Orientation reference chrome, not a role-coloured figure. -->
<!-- semantic-families: neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Noun spine: the MAGE vocabulary as one chain — Reality to Engineering Capital, every link a verb">
  <defs>
    <marker id="vh-spine" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="900" fill="#fdfcf9"/>
  <text x="60" y="44" font-size="17" fill="#57534e">Glossary · the grammar of the book</text>
  <text x="840" y="44" text-anchor="end" font-size="18" font-weight="bold" fill="#1c1917">The MAGE vocabulary</text>
  <text x="450" y="72" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">Every later figure instantiates a slice of this spine.</text>

  <!-- Reality -->
  <rect x="330" y="96" width="240" height="52" rx="8" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="450" y="122" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c1917">Reality</text>
  <text x="450" y="141" text-anchor="middle" font-size="14.4" font-style="italic" fill="#57534e">the system as it truly is</text>
  <line x1="450" y1="148" x2="450" y2="188" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-spine)"/>
  <text x="462" y="173" font-size="14.4" fill="#78716c">captured as</text>

  <!-- Representation -->
  <rect x="330" y="188" width="240" height="52" rx="8" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="450" y="214" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c1917">Representation</text>
  <text x="450" y="233" text-anchor="middle" font-size="14.4" font-style="italic" fill="#57534e">any account of it</text>
  <line x1="450" y1="240" x2="450" y2="280" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-spine)"/>
  <text x="462" y="265" font-size="14.4" fill="#78716c">structured into</text>

  <!-- Model -->
  <rect x="330" y="280" width="240" height="46" rx="8" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="450" y="309" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c1917">Model</text>
  <line x1="450" y1="326" x2="450" y2="366" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-spine)"/>
  <text x="462" y="351" font-size="14.4" fill="#78716c">carries</text>

  <!-- Invariant -->
  <rect x="330" y="366" width="240" height="46" rx="8" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="450" y="395" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c1917">Invariant</text>
  <line x1="450" y1="412" x2="450" y2="452" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-spine)"/>
  <text x="462" y="437" font-size="14.4" fill="#78716c">enforced by</text>

  <!-- Governance Mechanism -->
  <rect x="330" y="452" width="240" height="46" rx="8" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="450" y="481" text-anchor="middle" font-size="19.03" font-weight="bold" fill="#1c1917">Governance Mechanism</text>
  <line x1="450" y1="498" x2="450" y2="538" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-spine)"/>
  <text x="462" y="523" font-size="14.4" fill="#78716c">plays one of</text>

  <!-- four role chips -->
  <rect x="176" y="538" width="130" height="36" rx="18" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="241" y="562" text-anchor="middle" font-size="15" fill="#1c1917">Constraint</text>
  <rect x="316" y="538" width="110" height="36" rx="18" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="371" y="562" text-anchor="middle" font-size="15" fill="#1c1917">Sensor</text>
  <rect x="436" y="538" width="120" height="36" rx="18" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="496" y="562" text-anchor="middle" font-size="15" fill="#1c1917">Validator</text>
  <rect x="566" y="538" width="100" height="36" rx="18" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="616" y="562" text-anchor="middle" font-size="15" fill="#1c1917">Gate</text>

  <line x1="450" y1="574" x2="450" y2="614" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-spine)"/>
  <text x="462" y="599" font-size="14.4" fill="#78716c">govern</text>

  <!-- Governed Environment -->
  <rect x="330" y="614" width="240" height="46" rx="8" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="450" y="643" text-anchor="middle" font-size="19.4" font-weight="bold" fill="#1c1917">Governed Environment</text>
  <line x1="450" y1="660" x2="450" y2="700" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-spine)"/>
  <text x="462" y="685" font-size="14.4" fill="#78716c">compounds into</text>

  <!-- Engineering Capital -->
  <rect x="330" y="700" width="240" height="52" rx="8" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="450" y="732" text-anchor="middle" font-size="20" font-weight="bold" fill="#fdfcf9">Engineering Capital</text>

  <!-- footer -->
  <line x1="60" y1="800" x2="840" y2="800" stroke="#cfcabf" stroke-width="1.5"/>
  <text x="60" y="828" font-size="15" fill="#57534e">Read it as one sentence: reality is <tspan font-style="italic">captured as</tspan> a representation, <tspan font-style="italic">structured into</tspan> a model that <tspan font-style="italic">carries</tspan> an invariant,</text>
  <text x="60" y="850" font-size="15" fill="#57534e"><tspan font-style="italic">enforced by</tspan> a mechanism that <tspan font-style="italic">plays one of</tspan> four roles to <tspan font-style="italic">govern</tspan> an environment that <tspan font-style="italic">compounds into</tspan> engineering capital.</text>

  <!-- R13 zoom cue: SOURCE corner-brackets on the two spine nodes expanded elsewhere (Model -> 0.3-2, Governance Mechanism -> 0.3-4). The spine is the master this whole family instantiates, so it carries NO frame-echo (FORK-D). -->
  <g fill="none" stroke="#57534e" stroke-width="2.5">
    <!-- Model node -->
    <path d="M340,276 L326,276 L326,290"/>
    <path d="M560,330 L574,330 L574,316"/>
    <!-- Governance Mechanism node -->
    <path d="M340,448 L326,448 L326,462"/>
    <path d="M560,502 L574,502 L574,488"/>
  </g>
</svg>
