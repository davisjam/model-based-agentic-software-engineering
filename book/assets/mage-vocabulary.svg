<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored glossary grammar figure (label: mage-vocabulary). FRONT-MATTER COPY-EDIT PASS (260814
     draft; folds over book/assets/mage-vocabulary.svg). Copy-edit, not redesign — brought into the book
     grammar (Georgia glossary chrome; gray=territory, blue=model, rust=governance/obligation, teal=Governed
     Environment, green=Engineering Capital) and sharpened per the figure-copy-edit map:
     (1) FORK MADE UNMISTAKABLE. The MODEL PATH (Representation -> Model -> Richer semantic surface) and the
         DIRECT PATH (raw action / artifact) are two separate columns whose arrows LAND SIDE BY SIDE on the
         top edge of the one Governance Mechanism — a visible join, not a mandatory serial chain.
     (2) EXPAND, NOT ENABLE. The model path reaches governance labelled "available to"; the direct path
         reaches it labelled "acted on directly". Models are not a prerequisite.
     (3) CAPITAL VIA CONVERSION, SPARE. Engineering Capital is reached through a single small Governance
         Conversion node on recurring lessons — not a magical "compounds into" edge. -->
<!-- semantic-families: neutral, modeling, synthesis -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 830" width="980" height="830"
     role="img" aria-labelledby="mvTitle mvDesc"
     font-family="Georgia, 'Times New Roman', serif">
  <title id="mvTitle">The grammar of MAGE</title>
  <desc id="mvDesc">A fork-and-join grammar. On the right, the model path: a representation may be
    structured into a model that makes properties explicit, yielding a richer semantic surface. On the
    left, the direct path: a raw action or artifact. Both paths arrive at one governance mechanism —
    constraint, sensor, validator, gate — the model path available to it, the direct path acted on
    directly. Models are not a prerequisite. The mechanism governs an environment whose recurring lessons,
    through governance conversion, accumulate as engineering capital.</desc>

  <defs>
    <marker id="mv-neutral" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#57534e"/></marker>
    <marker id="mv-blue" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#2f5169"/></marker>
    <marker id="mv-rust" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#9a3f12"/></marker>
    <marker id="mv-teal" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c6b5f"/></marker>
    <marker id="mv-green" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#155c38"/></marker>
  </defs>

  <rect x="0" y="0" width="980" height="830" fill="#fdfcf9"/>
  <text x="60" y="42" font-size="15" fill="#78716c">Glossary · the grammar of the book</text>
  <text x="920" y="42" text-anchor="end" font-size="19" font-weight="700" fill="#1c1917">The MAGE vocabulary</text>
  <text x="490" y="74" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">Models are not a prerequisite for governance — they expand the semantic surface it can act on.</text>

  <!-- ================= MODEL PATH (right column) ================= -->
  <rect id="representation" x="580" y="110" width="240" height="50" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="700" y="141" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">Representation</text>
  <!-- edge: representation -> model -->
  <path d="M700,160 L700,198" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#mv-neutral)"/>
  <text x="712" y="184" text-anchor="start" font-size="13" fill="#78716c">may be structured into a</text>

  <rect id="model" x="580" y="200" width="240" height="50" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="700" y="231" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">Model</text>
  <!-- edge: model -> richer-surface -->
  <path d="M700,250 L700,288" fill="none" stroke="#2f5169" stroke-width="2.4" marker-end="url(#mv-blue)"/>
  <text x="712" y="274" text-anchor="start" font-size="13" fill="#78716c">makes properties explicit</text>

  <rect id="richer-surface" x="580" y="290" width="240" height="58" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="700" y="315" text-anchor="middle" font-size="15" font-weight="700" fill="#2f5169">Richer semantic</text>
  <text x="700" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#2f5169">surface</text>

  <!-- ================= DIRECT PATH (left column) ================= -->
  <rect id="raw-action" x="90" y="290" width="260" height="58" rx="9" fill="#fdfcf9" stroke="#57534e" stroke-width="2.4"/>
  <text x="220" y="315" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">Raw action / artifact</text>
  <text x="220" y="336" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">a test, a diff, a sandbox run</text>

  <!-- ================= THE JOIN — two inputs land side by side on the mechanism ================= -->
  <!-- edge: richer-surface -> gov-mechanism (control aligned above the endpoint => head drops in
       perpendicular; mid-section kept low so the "available to" label stays clear) -->
  <path d="M700,348 C700,384 566,398 566,406" fill="none" stroke="#2f5169" stroke-width="2.8" marker-end="url(#mv-blue)"/>
  <text x="618" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#2f5169">available to</text>
  <!-- edge: raw-action -> gov-mechanism (control aligned above the endpoint => perpendicular head;
       mid-section kept low so the "acted on directly" label stays clear) -->
  <path d="M220,348 C220,384 414,398 414,406" fill="none" stroke="#57534e" stroke-width="2.8" marker-end="url(#mv-neutral)"/>
  <text x="300" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#57534e">acted on directly</text>

  <rect id="gov-mechanism" x="320" y="406" width="340" height="64" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.8"/>
  <text x="490" y="435" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f12">Governance Mechanism</text>
  <text x="490" y="457" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">Constraint · Sensor · Validator · Gate</text>
  <!-- edge: gov-mechanism -> governed-env -->
  <path d="M490,470 L490,508" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#mv-neutral)"/>
  <text x="502" y="494" text-anchor="start" font-size="13" fill="#78716c">governs</text>

  <!-- ================= GOVERNED ENVIRONMENT (teal) ================= -->
  <rect id="governed-env" x="320" y="510" width="340" height="52" rx="9" fill="#e6f1ee" stroke="#1c6b5f" stroke-width="2.8"/>
  <text x="490" y="542" text-anchor="middle" font-size="17" font-weight="700" fill="#185c52">Governed Environment</text>
  <!-- edge: governed-env -> gov-conversion -->
  <path d="M490,562 L490,600" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#mv-neutral)"/>
  <text x="502" y="586" text-anchor="start" font-size="13" fill="#78716c">recurring lessons</text>

  <!-- ================= CAPITAL VIA CONVERSION (spare tail) ================= -->
  <rect id="gov-conversion" x="360" y="602" width="260" height="46" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="490" y="631" text-anchor="middle" font-size="15" font-weight="700" fill="#44403c">Governance Conversion</text>
  <!-- edge: gov-conversion -> eng-capital -->
  <path d="M490,648 L490,686" fill="none" stroke="#155c38" stroke-width="2.4" marker-end="url(#mv-green)"/>
  <text x="502" y="672" text-anchor="start" font-size="13" fill="#155c38">accumulates as</text>

  <rect id="eng-capital" x="360" y="688" width="260" height="52" rx="10" fill="#e3f0e7" stroke="#155c38" stroke-width="3.2"/>
  <text x="490" y="720" text-anchor="middle" font-size="18" font-weight="800" fill="#155c38">Engineering Capital</text>

  <!-- ================= footer ================= -->
  <line x1="60" y1="766" x2="920" y2="766" stroke="#cfcabf" stroke-width="1.5"/>
  <text x="60" y="792" font-size="14" fill="#57534e">A representation may be structured into a model that makes properties explicit — a richer semantic surface available to</text>
  <text x="60" y="814" font-size="14" fill="#57534e">governance. But a raw action or artifact can be governed directly; both paths join at the mechanism.</text>
</svg>
