<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: mage-method). REDRAW 260810 (author directive). The MAGE method as a
     FORK between two attractors — Engineering Capital (green) and Engineering Churn (churn-red) — with the
     two theses drawn as GATES (diamonds). Commodity intelligence meets the reasoning-horizon problem; the
     descent then passes two gates. GATE 1, the Modeling Thesis: yes -> structured / executable models; no
     (intent remains implicit) -> the single shared Engineering Churn box. GATE 2, the Alignment Thesis:
     yes -> Governed Engineering Environment -> Engineering Capital; no (models stay inert) -> the SAME
     Engineering Churn box. Both no-paths land in ONE Churn box, so the reader sees a fork between
     capital-formation and churn immediately. The Modeling -> models step is a SINGLE arrow; "better
     context" and "stronger semantics" ride beside it as annotations (consequences, not a branch). The
     models -> Alignment edge carries a SHORT label, "creates authority surfaces" (the prose that it sheds —
     "represented intent becomes authority" — moves to the caption). A left-margin GOVERNANCE CONVERSION hub
     turns a governed-work failure into durable structure and forks it back: "enrich model" onto the
     Modeling gate, "enrich control" onto the Alignment gate; a single muted dotted arc wraps the OUTSIDE
     left margin as the "the descent repeats" return, kept clear of the two enrich forks.
     Palette: Umber Monograph tokens (fleet #2f5169 the commodity-intelligence source, churn-red #b23b3b
     the reasoning-horizon problem + the two failure edges + the Churn attractor, thesis-green #15803d the
     Modeling gate, governed green #1f7a4d/#155c38 the models + environment + the Capital attractor, accent
     #9a3f12 the Alignment gate + the "creates authority surfaces" arrow + the conversion hub, muted #57534e
     connectors, light-muted #78716c/#a8a29e the outer repeat arc). -->
<!-- semantic-families: agent, failure, governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 856" width="880" height="856"
     role="group" aria-labelledby="mmTitle mmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mmTitle">The MAGE method at a glance — a fork between engineering capital and engineering churn, with the two theses as gates</title>
  <desc id="mmDesc">A single descent that forks between two attractors. Commodity intelligence — broad,
    cheap, probabilistic — meets a reasoning-horizon problem: the system will not fit the context window.
    The descent then passes two gates. The first gate is the Modeling Thesis, make knowledge and intent
    explicit. Pass it and a single arrow leads to structured and executable models — what is, what ought to
    be, and the invariants over them — with better context for reasoning and stronger semantics for
    engineering riding beside that arrow as consequences. Fail it and intent remains implicit, so the path
    turns to Engineering Churn. A short heavy arrow, creates authority surfaces, carries the models into
    the second gate, the Alignment Thesis, make obligations binding through constraints, sensors,
    validators, and gates. Pass it and the descent continues into the Governed Engineering Environment,
    where effort compounds as Engineering Capital and, with it, trustworthy autonomy. Fail it and the
    models stay inert, so the path turns to the same Engineering Churn box — repeated rediscovery,
    inspection, and correction, with no capital forming. Both failure paths land in one shared Churn box:
    the method is a fork between capital-formation and churn, and the two gates decide which. A left-margin
    Governance Conversion hub turns a governed-work failure into durable structure and forks it back —
    enrich model onto the Modeling gate, enrich control onto the Alignment gate — and a muted outer arc
    marks the descent repeating.</desc>

  <defs>
    <marker id="mm-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="mm-ah-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
    <marker id="mm-ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="mm-ah-churn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/>
    </marker>
    <marker id="mm-ah-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="856" fill="#fdfcf9"/>

  <!-- ============================ THE MAIN DESCENT (center spine, x=300) ============================ -->

  <!-- A. Commodity intelligence — the source (fleet blue) -->
  <rect x="175" y="22" width="250" height="62" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="300" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#2f5169">Commodity intelligence</text>
  <text x="300" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#57534e">broad · cheap · probabilistic</text>
  <path d="M300,84 L300,106" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm-ah)"/>

  <!-- B. Reasoning-horizon problem — the driving problem (churn red) -->
  <rect x="168" y="108" width="264" height="56" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="2.2"/>
  <text x="300" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#b23b3b">Reasoning-horizon problem</text>
  <text x="300" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#b23b3b">the system won't fit the window</text>
  <path d="M300,164 L300,186" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm-ah)"/>

  <!-- ==== GATE 1 — Modeling Thesis (green diamond; widened half-width 122->142 so the subtitle fits the diamond's inscribed area, lines pulled toward the wide center) ==== -->
  <polygon points="300,188 442,250 300,312 158,250" fill="#eef7ee" stroke="#15803d" stroke-width="2.6"/>
  <text x="300" y="230" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#15803d">GATE 1</text>
  <text x="300" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">Modeling Thesis</text>
  <text x="300" y="268" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">make knowledge + intent explicit</text>

  <!-- GATE 1 yes: single arrow down to the models (annotations ride beside it — NOT a branch) -->
  <path d="M300,312 L300,388" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm-ah)"/>
  <text x="315" y="336" text-anchor="start" font-size="12" font-weight="700" fill="#15803d">yes</text>
  <text x="222" y="360" text-anchor="end" font-size="11" font-style="italic" fill="#57534e">better context</text>
  <text x="222" y="374" text-anchor="end" font-size="11" font-style="italic" fill="#57534e">for reasoning</text>
  <text x="378" y="360" text-anchor="start" font-size="11" font-style="italic" fill="#57534e">stronger semantics</text>
  <text x="378" y="374" text-anchor="start" font-size="11" font-style="italic" fill="#57534e">for engineering</text>

  <!-- D. Structured / executable models (governed green) -->
  <rect x="150" y="390" width="300" height="64" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="300" y="418" text-anchor="middle" font-size="17" font-weight="700" fill="#1f7a4d">Structured / executable models</text>
  <text x="300" y="440" text-anchor="middle" font-size="12" font-weight="600" fill="#57534e">what is · what ought to be · invariants</text>

  <!-- THE LOAD-BEARING EDGE: short, heavy, labelled — models -> Alignment gate -->
  <path d="M300,454 L300,526" fill="none" stroke="#9a3f12" stroke-width="5" marker-end="url(#mm-ah-rust)"/>
  <text x="316" y="494" text-anchor="start" font-size="14.5" font-weight="700" fill="#9a3f12">creates authority surfaces</text>

  <!-- ==== GATE 2 — Alignment Thesis (rust diamond; widened half-width 122->142 so the long role subtitle fits the inscribed area, lines pulled toward the wide center) ==== -->
  <polygon points="300,528 442,590 300,652 158,590" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="300" y="570" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9a3f12">GATE 2</text>
  <text x="300" y="590" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f12">Alignment Thesis</text>
  <text x="300" y="606" text-anchor="middle" font-size="10" font-weight="600" fill="#57534e">constraints · sensors · validators · gates</text>

  <!-- GATE 2 yes: down to the governed environment -->
  <path d="M300,652 L300,674" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm-ah)"/>
  <text x="315" y="670" text-anchor="start" font-size="12" font-weight="700" fill="#9a3f12">yes</text>

  <!-- F. Governed Engineering Environment (governed green) -->
  <rect x="120" y="676" width="360" height="52" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.8"/>
  <text x="300" y="708" text-anchor="middle" font-size="16" font-weight="700" fill="#1f7a4d">The Governed Engineering Environment</text>
  <path d="M300,728 L300,752" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm-ah)"/>

  <!-- G. ENGINEERING CAPITAL — the good attractor (emphasized green) -->
  <rect x="175" y="754" width="250" height="76" rx="9" fill="#e3f0e7" stroke="#155c38" stroke-width="3.6"/>
  <text x="300" y="787" text-anchor="middle" font-size="19" font-weight="800" fill="#155c38">Engineering Capital</text>
  <text x="300" y="809" text-anchor="middle" font-size="11.5" font-style="italic" fill="#155c38">effort compounds → trustworthy autonomy</text>

  <!-- ============================ THE SHARED FAILURE ATTRACTOR (right, x≈695) ============================ -->

  <!-- ENGINEERING CHURN — the failure attractor (emphasized churn-red); BOTH no-paths land here -->
  <rect x="560" y="744" width="270" height="94" rx="9" fill="#fbeaea" stroke="#b23b3b" stroke-width="3.6"/>
  <text x="695" y="777" text-anchor="middle" font-size="19" font-weight="800" fill="#b23b3b">Engineering Churn</text>
  <text x="695" y="799" text-anchor="middle" font-size="12" font-style="italic" fill="#b23b3b">no capital forms</text>
  <text x="695" y="820" text-anchor="middle" font-size="11" fill="#b23b3b">repeated rediscovery · inspection · correction</text>

  <!-- GATE 1 no: intent remains implicit -> churn (right vertex, out and down, into churn TOP) -->
  <path d="M442,250 L695,250 L695,744" fill="none" stroke="#b23b3b" stroke-width="2.4" marker-end="url(#mm-ah-churn)"/>
  <text x="456" y="242" text-anchor="start" font-size="12" font-weight="700" fill="#b23b3b">no</text>
  <text x="686" y="242" text-anchor="end" font-size="11.5" font-weight="600" fill="#b23b3b">intent remains implicit</text>

  <!-- GATE 2 no: models stay inert -> the SAME churn box (right vertex, out and down, into churn LEFT edge) -->
  <path d="M442,590 L528,590 L528,780 L560,780" fill="none" stroke="#b23b3b" stroke-width="2.4" marker-end="url(#mm-ah-churn)"/>
  <text x="456" y="586" text-anchor="start" font-size="12" font-weight="700" fill="#b23b3b">no</text>
  <text x="524" y="566" text-anchor="end" font-size="11.5" font-weight="600" fill="#b23b3b">models stay inert</text>

  <!-- ============================ GOVERNANCE-CONVERSION LOOP (left margin) ============================
       ONE job: convert a governed-work failure into durable structure, enriching EITHER side. The two
       enrich forks land on the two gates; a muted dotted arc wraps the OUTSIDE as the "descent repeats"
       return, kept in its own outer lane so the plumbing stays clean. -->

  <!-- the conversion hub -->
  <rect x="24" y="470" width="126" height="88" rx="10" fill="#f6f4ef" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="87" y="500" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#9a3f12">GOVERNANCE</text>
  <text x="87" y="516" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#9a3f12">CONVERSION</text>
  <text x="87" y="536" text-anchor="middle" font-size="10.5" font-style="italic" fill="#57534e">turn failure into</text>
  <text x="87" y="550" text-anchor="middle" font-size="10.5" font-style="italic" fill="#57534e">durable structure</text>

  <!-- input: governed work fails -> into the hub -->
  <path d="M120,694 C74,660 82,596 87,560" fill="none" stroke="#b23b3b" stroke-width="2.2"
        stroke-dasharray="5 4" marker-end="url(#mm-ah-churn)"/>
  <text x="128" y="642" text-anchor="start" font-size="11" font-weight="600" fill="#57534e">governed work</text>
  <text x="128" y="657" text-anchor="start" font-size="11.5" font-weight="700" fill="#b23b3b">→ failure</text>

  <!-- fork A: enrich model -> onto the Modeling gate (outer green arc up the left) -->
  <path d="M60,470 C10,412 14,300 158,250" fill="none" stroke="#15803d" stroke-width="2.2" marker-end="url(#mm-ah-green)"/>
  <text x="44" y="356" text-anchor="start" font-size="11.5" font-weight="700" fill="#15803d">enrich model</text>

  <!-- fork B: enrich control -> onto the Alignment gate (short rust arc, landing on the gate's top-left edge) -->
  <path d="M150,543 C164,555 170,570 178,581" fill="none" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#mm-ah-rust)"/>
  <text x="158" y="536" text-anchor="start" font-size="11.5" font-weight="700" fill="#9a3f12">enrich control</text>

  <!-- iterates: single muted dotted arc wrapping the far-left OUTSIDE margin (its own lane, clear of the
       conversion hub — reaches the x=14 lane below the hub, runs straight up, curves in at the top) -->
  <path d="M175,792 C100,800 14,700 14,560 C14,400 14,250 14,180 C14,150 70,136 164,136" fill="none" stroke="#a8a29e"
        stroke-width="1.8" stroke-dasharray="2 6" marker-end="url(#mm-ah-mute)"/>
  <text x="22" y="122" text-anchor="start" font-size="11" font-style="italic" fill="#78716c">↻ iterates</text>
</svg>
