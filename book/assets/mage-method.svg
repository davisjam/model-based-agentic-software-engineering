<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: mage-method). R41b/260812 VISUAL-GRAMMAR REWORK (corrected thesis:
     "Modeling is useful before Alignment, but Alignment does NOT depend on it"). The geometry, not just
     the words, now carries the claim:
     (1) CLEAN BACKBONE. A single centre spine reads top-to-bottom: Scale -> Finite reasoning horizon ->
     New engineering imbalance -> Modeling Thesis -> Alignment Thesis -> Governed Engineering Environment
     -> Engineering Capital. Everything else is an annotation, a side-input, a feedback loop, or a
     failure rail — no competing first-class rectangles in the middle.
     (2) TWO-HEADED TOP. Scale is the enduring source of the reasoning problem (a finite reasoning
     horizon: relevant state exceeds the active window). Commodity intelligence is a SEPARATE head that
     changes the economics. Two legible causal inputs meet at the New Engineering Imbalance — the vertical
     Scale/Horizon path "makes reasoning/judgment scarce at scale," the commodity head "makes
     implementation abundant."
     (3) ALIGNMENT REACHED TWO WAYS, COMPARABLY. Alignment takes two inputs of COMPARABLE stroke weight:
     Modeling EXTENDS it (Modeling -> Richer semantic surfaces -> Alignment, "expands what can be
     governed") and a DIRECT / local path enters it from the left (tests, sandboxes, permissions, reviews)
     without any explicit model, at narrower semantic reach. Modeling extends Alignment; it does not parent
     it. Modeling's own terminal payoff — "extends reasoning reach" — is a green annotation, not a node.
     (4) GOVERNANCE CONVERSION is a neutral (charcoal) FEEDBACK hub: a governed-work failure feeds it, and
     it ADAPTS representations back onto Modeling and ADAPTS controls back onto Alignment (adapt, not
     enrich — governance can strengthen, reconcile, OR retire).
     (5) CHURN is a FAILURE RAIL, not a state: two dashed red branches leave at their sources ("if
     representation remains weak", "if authority remains weak") and are paid back as rediscovery / human
     reconstruction and repeated inspection / human adjudication.
     (6) SYNTHESIS + CAPITAL. The GEE is the SYNTHESIS (dark teal — neither the Modeling green nor the
     Alignment rust). Engineering Capital (green, positive outcome) accrues only "when future value exceeds
     carrying cost," and can itself depreciate. A muted dotted rail marks the descent reopening as capital
     enables greater scope.
     Palette: Umber Monograph tokens — fleet #2f5169 (commodity intelligence), churn-red #b23b3b (reasoning
     horizon + the two failure branches + the Churn attractor), modeling green #1f7a4d/#155c38 (Modeling +
     Richer semantic surfaces + Engineering Capital), accent/rust #9a3f12 (Alignment Thesis), synthesis
     teal #1c6b5f (the Governed Engineering Environment), neutral #57534e / mute #78716c (imbalance frame,
     connectors, side-path, governance-conversion hub, annotations). -->
<!-- semantic-families: agent, failure, governance, modeling, synthesis, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1240" width="1120" height="1240"
     role="group" aria-labelledby="mmTitle mmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mmTitle">The MAGE method — scale creates the reasoning problem, commodity intelligence changes its economics, and two theses turn engineering effort into capital rather than churn; Modeling extends Alignment but Alignment does not depend on it</title>
  <desc id="mmDesc">A single centre spine reads top to bottom: Scale, a Finite reasoning horizon, a New
    engineering imbalance, the Modeling Thesis, the Alignment Thesis, the Governed Engineering Environment,
    and Engineering Capital. Two heads meet at the top. Scale is the enduring source of a finite reasoning
    horizon — relevant state exceeds the active window, so reasoning state must be reconstructed; that
    vertical path makes reasoning and judgment scarce at scale. Commodity intelligence is a separate head
    that makes implementation abundant relative to engineering judgment. The two converge on the New
    Engineering Imbalance. The Modeling Thesis addresses that imbalance by making knowledge and intent
    explicit at useful scales. Modeling extends reasoning reach — a terminal benefit shown as an annotation,
    not a node — and its one structural product is Richer semantic surfaces, which expand what can be
    governed and feed the Alignment Thesis. Crucially, Alignment does not depend on Modeling. A direct,
    local path of comparable weight enters Alignment from the left — tests, sandboxes, permissions, reviews
    — without explicit models, at narrower semantic reach, with human reconstruction filling larger
    properties. Modeling extends Alignment; it does not parent it. Passing through Alignment, the spine
    enters the Governed Engineering Environment, the synthesis of both theses, and effort compounds as
    Engineering Capital only when future value exceeds its carrying cost; capital can also depreciate.
    Churn is a failure rail, not a state: if representation remains weak it is paid back as rediscovery and
    human reconstruction; if authority remains weak it is paid back as repeated inspection and human
    adjudication; both flow to the shared Engineering Churn attractor. A neutral Governance Conversion hub
    turns a governed-work failure into durable structure — adapting representations back onto Modeling and
    adapting controls back onto Alignment — and a muted dotted rail marks the descent reopening as capital
    enables greater scope.</desc>

  <defs>
    <marker id="mm2-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="mm2-ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
    <marker id="mm2-ah-churn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/>
    </marker>
    <marker id="mm2-ah-fleet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
    <marker id="mm2-ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c6b5f"/>
    </marker>
    <marker id="mm2-ah-adapt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78716c"/>
    </marker>
    <marker id="mm2-ah-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="1240" fill="#fdfcf9"/>

  <!-- ======================= THE BACKBONE (centre spine, x=560) ======================= -->

  <!-- Scale -->
  <rect x="430" y="36" width="260" height="56" rx="8" fill="#f6f4ef" stroke="#1c1917" stroke-width="2.4"/>
  <text x="560" y="64" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Scale</text>
  <text x="560" y="82" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">large systems exceed any one reasoner</text>
  <path d="M560,92 L560,116" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm2-ah)"/>

  <!-- Finite reasoning horizon (the enduring reasoning problem) -->
  <rect x="410" y="118" width="300" height="80" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="2.4"/>
  <text x="560" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#b23b3b">Finite reasoning horizon</text>
  <text x="560" y="168" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b23b3b">relevant state exceeds the active window;</text>
  <text x="560" y="185" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b23b3b">reasoning state must be reconstructed</text>
  <path d="M560,198 L560,234" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm2-ah)"/>
  <!-- the vertical path's contribution to the imbalance (parallels the commodity head's label) -->
  <text x="574" y="214" text-anchor="start" font-size="10.5" font-weight="600" fill="#57534e">makes reasoning /</text>
  <text x="574" y="228" text-anchor="start" font-size="10.5" font-weight="600" fill="#57534e">judgment scarce at scale</text>

  <!-- New engineering imbalance (neutral frame — the problem the theses address) -->
  <rect x="410" y="236" width="300" height="104" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="560" y="264" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">New engineering imbalance</text>
  <text x="560" y="290" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">implementation abundant while</text>
  <text x="560" y="307" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">judgment · representation ·</text>
  <text x="560" y="324" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">evidence · authority stay scarce</text>
  <path d="M560,340 L560,376" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm2-ah)"/>

  <!-- Modeling Thesis -->
  <rect x="410" y="378" width="300" height="84" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="560" y="406" text-anchor="middle" font-size="17" font-weight="700" fill="#1f7a4d">Modeling Thesis</text>
  <text x="560" y="428" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">make knowledge + intent explicit</text>
  <text x="560" y="444" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">at useful scales</text>
  <!-- terminal reasoning payoff — a green annotation, NOT a node -->
  <text x="560" y="480" text-anchor="middle" font-size="12" font-style="italic" font-weight="600" fill="#1f7a4d">+ extends reasoning reach</text>

  <!-- Alignment Thesis -->
  <rect x="400" y="614" width="320" height="92" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="560" y="644" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f12">Alignment Thesis</text>
  <text x="560" y="666" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">give obligations authority</text>
  <text x="560" y="684" text-anchor="middle" font-size="10.5" font-weight="600" fill="#57534e">constraints · sensors · validators · gates</text>
  <path d="M560,706 L560,740" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm2-ah)"/>

  <!-- The Governed Engineering Environment (the SYNTHESIS — dark teal, neither green nor rust) -->
  <rect x="370" y="742" width="380" height="64" rx="8" fill="#e6f1ee" stroke="#1c6b5f" stroke-width="2.8"/>
  <text x="560" y="770" text-anchor="middle" font-size="15" font-weight="700" fill="#185c52">The Governed Engineering Environment</text>
  <text x="560" y="791" text-anchor="middle" font-size="11" font-style="italic" fill="#185c52">where both theses meet and effort compounds</text>
  <path d="M560,806 L560,840" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm2-ah)"/>
  <text x="574" y="820" text-anchor="start" font-size="11" font-weight="600" fill="#57534e">when future value exceeds carrying cost</text>

  <!-- Engineering Capital (the positive outcome — green) -->
  <rect x="442" y="842" width="236" height="86" rx="9" fill="#e3f0e7" stroke="#155c38" stroke-width="3.6"/>
  <text x="560" y="876" text-anchor="middle" font-size="19" font-weight="800" fill="#155c38">Engineering Capital</text>
  <text x="560" y="900" text-anchor="middle" font-size="11.5" font-style="italic" fill="#155c38">effort compounds over time</text>
  <text x="560" y="917" text-anchor="middle" font-size="10.5" font-style="italic" fill="#57534e">can depreciate · maintain or retire</text>

  <!-- ======================= HEAD 2: commodity intelligence (side input) ======================= -->
  <rect x="60" y="262" width="260" height="86" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="190" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">Commodity intelligence</text>
  <text x="190" y="312" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">implementation abundant</text>
  <text x="190" y="328" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">relative to engineering judgment</text>
  <path d="M320,312 L406,312" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#mm2-ah-fleet)"/>
  <text x="352" y="302" text-anchor="middle" font-size="11" font-weight="600" fill="#2f5169">makes implementation abundant</text>

  <!-- ======================= MODELING -> RICHER SEMANTIC SURFACES -> ALIGNMENT ======================= -->
  <!-- Modeling's structural product (green-bordered — a modeling consequence) -->
  <rect x="730" y="500" width="230" height="74" rx="8" fill="#eef7ee" stroke="#1f7a4d" stroke-width="2"/>
  <text x="845" y="527" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a4d">Richer semantic surfaces</text>
  <text x="845" y="545" text-anchor="middle" font-size="10.5" font-style="italic" fill="#57534e">more system-level obligations</text>
  <text x="845" y="560" text-anchor="middle" font-size="10.5" font-style="italic" fill="#57534e">become legible to authority</text>
  <!-- Modeling -> Richer semantic surfaces -->
  <path d="M710,430 C778,430 845,456 845,498" fill="none" stroke="#1f7a4d" stroke-width="2.2" marker-end="url(#mm2-ah-green)"/>
  <!-- Richer semantic surfaces -> Alignment (input ONE of two — comparable weight; lands on the TOP edge) -->
  <path d="M800,574 C792,592 722,606 650,614" fill="none" stroke="#1f7a4d" stroke-width="2.8" marker-end="url(#mm2-ah-green)"/>
  <text x="596" y="596" text-anchor="start" font-size="11.5" font-weight="700" fill="#1f7a4d">expands what can be governed</text>

  <!-- ======================= DIRECT / LOCAL ALIGNMENT (side input — comparable weight) ======================= -->
  <rect x="60" y="618" width="260" height="74" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="2.2"/>
  <text x="190" y="642" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1917">Direct / local Alignment</text>
  <text x="190" y="662" text-anchor="middle" font-size="10.5" font-style="italic" fill="#57534e">tests · sandboxes · permissions · reviews</text>
  <text x="190" y="680" text-anchor="middle" font-size="10.5" font-style="italic" fill="#57534e">works without explicit system models</text>
  <!-- Direct -> Alignment (input TWO of two — comparable weight, normal strength) -->
  <path d="M320,652 L396,652" fill="none" stroke="#57534e" stroke-width="2.8" marker-end="url(#mm2-ah)"/>
  <!-- the promoted "without explicit models" note (why M still matters though Alignment is independent) -->
  <text x="190" y="712" text-anchor="middle" font-size="10.5" fill="#57534e">Without explicit models: local authority still works,</text>
  <text x="190" y="727" text-anchor="middle" font-size="10.5" fill="#57534e">but larger properties often need human reconstruction.</text>

  <!-- ======================= GOVERNANCE CONVERSION (neutral feedback hub) ======================= -->
  <rect x="60" y="498" width="190" height="116" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>
  <text x="155" y="528" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#44403c">GOVERNANCE</text>
  <text x="155" y="546" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#44403c">CONVERSION</text>
  <text x="155" y="568" text-anchor="middle" font-size="10" font-style="italic" fill="#57534e">turn recurring lessons</text>
  <text x="155" y="582" text-anchor="middle" font-size="10" font-style="italic" fill="#57534e">into durable structure</text>

  <!-- adapt representations -> Modeling -->
  <path d="M150,498 C150,442 300,420 406,420" fill="none" stroke="#78716c" stroke-width="2.2" marker-end="url(#mm2-ah-adapt)"/>
  <text x="188" y="468" text-anchor="start" font-size="11" font-weight="600" fill="#78716c">adapt representations</text>
  <!-- adapt controls -> Alignment -->
  <path d="M250,590 C302,596 366,628 396,648" fill="none" stroke="#78716c" stroke-width="2.2" marker-end="url(#mm2-ah-adapt)"/>
  <text x="256" y="584" text-anchor="start" font-size="11" font-weight="600" fill="#78716c">adapt controls</text>
  <!-- incoming: a governed-work failure feeds the hub (routed below the Direct note; label ON the arrow) -->
  <path d="M370,778 C240,806 96,808 52,772 C40,752 40,660 46,624 C50,608 54,602 60,600" fill="none" stroke="#b23b3b" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#mm2-ah-churn)"/>
  <text x="180" y="820" text-anchor="middle" font-size="11" font-weight="700" fill="#b23b3b">failure / repeated judgment</text>

  <!-- ======================= THE CHURN FAILURE RAIL (right) ======================= -->
  <rect x="800" y="962" width="280" height="98" rx="9" fill="#fbeaea" stroke="#b23b3b" stroke-width="3.6"/>
  <text x="940" y="996" text-anchor="middle" font-size="19" font-weight="800" fill="#b23b3b">Engineering Churn</text>
  <text x="940" y="1020" text-anchor="middle" font-size="11" font-style="italic" fill="#b23b3b">the recurring cost of non-durable</text>
  <text x="940" y="1038" text-anchor="middle" font-size="11" font-style="italic" fill="#b23b3b">knowledge + judgment</text>

  <!-- branch 1: weak representation (leaves the Modeling side) -->
  <path d="M710,404 L975,404 L975,960" fill="none" stroke="#b23b3b" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#mm2-ah-churn)"/>
  <text x="720" y="368" text-anchor="start" font-size="11" font-weight="700" fill="#b23b3b">weak representation →</text>
  <text x="720" y="383" text-anchor="start" font-size="10.5" font-weight="600" fill="#b23b3b">rediscovery / human reconstruction</text>
  <text x="720" y="399" text-anchor="start" font-size="10.5" font-weight="700" fill="#b23b3b">if representation remains weak</text>

  <!-- branch 2: weak authority (leaves the Alignment side) -->
  <path d="M720,662 L930,662 L930,960" fill="none" stroke="#b23b3b" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#mm2-ah-churn)"/>
  <text x="726" y="618" text-anchor="start" font-size="10.5" font-weight="700" fill="#b23b3b">if authority remains weak →</text>
  <text x="726" y="634" text-anchor="start" font-size="10.5" font-weight="600" fill="#b23b3b">weak authority: repeated inspection /</text>
  <text x="726" y="649" text-anchor="start" font-size="10.5" font-weight="600" fill="#b23b3b">human adjudication</text>

  <!-- ======================= THE ITERATION RAIL (muted — the descent reopens) ======================= -->
  <path d="M442,884 C160,900 26,852 26,700 L26,150 C26,96 150,72 436,66"
        fill="none" stroke="#a8a29e" stroke-width="1.8" stroke-dasharray="2 6" marker-end="url(#mm2-ah-mute)"/>
  <text x="40" y="392" text-anchor="start" font-size="11" font-style="italic" fill="#78716c">↻ capital enables greater scope,</text>
  <text x="40" y="408" text-anchor="start" font-size="11" font-style="italic" fill="#78716c">which reopens the reasoning problem</text>
</svg>
