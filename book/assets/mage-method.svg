<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: mage-method). R41b THEORY REBUILD (preface-3 corrected theory). The old
     figure descended commodity-intelligence -> reasoning-horizon -> Modeling -> Alignment as ONE causal
     chain with the theses as yes/no decision diamonds. That is now wrong on two counts, both fixed here:
     (1) TWO-HEADED TOP. Scale is the enduring source of the reasoning problem (finite reasoning horizon);
     commodity intelligence is a SEPARATE head that changes the economics. The two converge on the New
     Engineering Imbalance (implementation abundant; judgment/representation/evidence/authority scarce),
     which the Modeling Thesis then addresses. Scale creates the problem; commodity intelligence changes
     its economics — they are not one descent.
     (2) ALIGNMENT DOES NOT DEPEND ON MODELING. The theses are BOXES, not gates. Modeling forks to two
     consequences — larger questions become tractable (a reasoning benefit, terminal) and richer authority
     surfaces (the bridge that feeds Alignment via the heavy rust "creates authority surfaces" edge). A
     SEPARATE side-path enters Alignment from the left — local controls / raw artifacts (tests, sandboxes,
     reviews) act directly, WITHOUT explicit models, at narrower semantic reach with human judgment filling
     the gaps. So Alignment has two ways to be reached: through Modeling (richer, from above-right) or
     directly (from the side). Modeling is the principled scaling move, not a prerequisite.
     Churn is NOT an instantaneous fail-gate state; it is the recurring COST of leaving knowledge and
     judgment non-durable. Two labelled recurring-cost flows reach the shared Engineering Churn attractor:
     weak representation -> rediscovery / human reconstruction, and weak authority -> repeated inspection /
     human adjudication. A left-middle Governance Conversion hub turns a governed-work failure into durable
     structure and forks it back — enrich representations onto Modeling, enrich controls onto Alignment; a
     muted dotted outer arc marks the descent repeating.
     Palette: Umber Monograph tokens — fleet #2f5169 (commodity intelligence, agent family), churn-red
     #b23b3b (finite reasoning horizon + the two failure flows + the Churn attractor, failure family),
     modeling green #1f7a4d/#155c38 (Modeling Thesis + reasoning-benefit + GEE + Capital, modeling family),
     accent/rust #9a3f12 (Alignment Thesis + richer-authority bridge + conversion hub, governance family),
     neutral #57534e (imbalance frame + connectors + side-path). -->
<!-- semantic-families: agent, failure, governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1180" width="1040" height="1180"
     role="group" aria-labelledby="mmTitle mmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mmTitle">The MAGE method — scale creates the reasoning problem, commodity intelligence changes its economics, and the two theses turn engineering effort into capital rather than churn</title>
  <desc id="mmDesc">Two heads meet at the top. Scale is the enduring source of a finite reasoning horizon:
    large systems exceed what any one reasoner can hold active, so reasoning must be reconstructed.
    Commodity intelligence is a separate head that changes the economics: implementation becomes abundant
    relative to engineering judgment. The two converge on the New Engineering Imbalance — implementation
    abundant while judgment, representation, evidence, and authority stay scarce. The Modeling Thesis
    addresses that imbalance by making knowledge and intent explicit at useful scales. Modeling forks to
    two consequences: larger questions become tractable to reason over, a reasoning benefit; and richer
    authority surfaces, which a heavy edge carries into the Alignment Thesis, where represented intent
    becomes authority. Crucially, Alignment does not depend on Modeling. A separate side-path enters
    Alignment directly from local controls and raw artifacts — tests, sandboxes, reviews — without explicit
    models, at narrower semantic reach, with human judgment filling the gaps. Passing through Alignment, the
    descent enters the Governed Engineering Environment and effort compounds as Engineering Capital.
    Churn is not a single failure state but the recurring cost of non-durable knowledge and judgment: weak
    representation is paid back as rediscovery and human reconstruction; weak authority is paid back as
    repeated inspection and human adjudication. Both flow to the shared Engineering Churn attractor. A
    left-middle Governance Conversion hub turns a governed-work failure into durable structure and forks it
    back — enrich representations onto Modeling, enrich controls onto Alignment — and a muted outer arc marks
    the descent repeating.</desc>

  <defs>
    <marker id="mm2-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="mm2-ah-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
    <marker id="mm2-ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
    <marker id="mm2-ah-churn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/>
    </marker>
    <marker id="mm2-ah-fleet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
    <marker id="mm2-ah-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1180" fill="#fdfcf9"/>

  <!-- ============================ TWO-HEADED TOP ============================ -->

  <!-- HEAD 1: Scale -> finite reasoning horizon (the enduring reasoning problem) -->
  <rect x="380" y="34" width="240" height="56" rx="8" fill="#f6f4ef" stroke="#1c1917" stroke-width="2.4"/>
  <text x="500" y="64" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Scale</text>
  <text x="500" y="82" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">large systems exceed any one reasoner</text>
  <path d="M500,90 L500,114" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm2-ah)"/>

  <rect x="352" y="116" width="296" height="76" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="2.4"/>
  <text x="500" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#b23b3b">Finite reasoning horizon</text>
  <text x="500" y="168" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b23b3b">the system won't fit the window;</text>
  <text x="500" y="184" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b23b3b">reasoning must be reconstructed</text>
  <path d="M500,192 L500,220" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm2-ah)"/>

  <!-- HEAD 2: Commodity intelligence -> the imbalance (changes the economics) -->
  <rect x="36" y="226" width="264" height="86" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="168" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">Commodity intelligence</text>
  <text x="168" y="278" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">implementation abundant</text>
  <text x="168" y="294" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">relative to engineering judgment</text>
  <path d="M300,269 L346,269" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#mm2-ah-fleet)"/>

  <!-- THE CONVERGENCE: New Engineering Imbalance (neutral frame — the problem the theses address) -->
  <rect x="352" y="222" width="296" height="98" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="500" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">New engineering imbalance</text>
  <text x="500" y="274" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">implementation abundant;</text>
  <text x="500" y="290" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">judgment · representation ·</text>
  <text x="500" y="306" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">evidence · authority scarce</text>
  <path d="M500,320 L500,356" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm2-ah)"/>

  <!-- ============================ MODELING THESIS + ITS FORK ============================ -->
  <rect x="352" y="358" width="296" height="78" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="500" y="388" text-anchor="middle" font-size="17" font-weight="700" fill="#1f7a4d">Modeling Thesis</text>
  <text x="500" y="410" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">make knowledge + intent explicit</text>
  <text x="500" y="426" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">at useful scales</text>

  <!-- fork: stub down, a bus, two down-stubs to the two consequences -->
  <path d="M500,436 L500,452" fill="none" stroke="#57534e" stroke-width="2"/>
  <path d="M460,452 L780,452" fill="none" stroke="#57534e" stroke-width="2"/>
  <path d="M460,452 L460,476" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm2-ah)"/>
  <path d="M780,452 L780,476" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm2-ah)"/>

  <!-- LEFT consequence: larger questions tractable (a reasoning benefit — terminal, no onward arrow) -->
  <rect x="330" y="478" width="260" height="64" rx="8" fill="#eef7ee" stroke="#1f7a4d" stroke-width="2"/>
  <text x="460" y="506" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1917">Larger questions become</text>
  <text x="460" y="528" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1917">tractable to reason over</text>

  <!-- RIGHT consequence: richer authority surfaces (the bridge to Alignment) -->
  <rect x="660" y="478" width="240" height="64" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.2"/>
  <text x="780" y="506" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3f12">Richer authority surfaces</text>
  <text x="780" y="528" text-anchor="middle" font-size="11" font-style="italic" fill="#57534e">more can be stated + checked</text>

  <!-- THE LOAD-BEARING EDGE: richer surfaces -> Alignment (heavy rust) -->
  <path d="M780,542 C780,574 640,600 574,602" fill="none" stroke="#9a3f12" stroke-width="5" marker-end="url(#mm2-ah-rust)"/>
  <text x="566" y="596" text-anchor="end" font-size="12.5" font-weight="700" fill="#9a3f12">creates authority surfaces</text>

  <!-- ============================ ALIGNMENT THESIS (reached two ways) ============================ -->
  <rect x="330" y="600" width="340" height="78" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="500" y="630" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f12">Alignment Thesis</text>
  <text x="500" y="652" text-anchor="middle" font-size="11.5" font-weight="600" fill="#57534e">give obligations authority</text>
  <text x="500" y="669" text-anchor="middle" font-size="10.5" font-weight="600" fill="#57534e">constraints · sensors · validators · gates</text>
  <path d="M500,678 L500,712" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm2-ah)"/>

  <!-- ==== THE SIDE-PATH: Alignment WITHOUT Modeling (enters from the lower-left) ==== -->
  <rect x="40" y="620" width="260" height="56" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="170" y="644" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1917">Local controls / raw artifacts</text>
  <text x="170" y="664" text-anchor="middle" font-size="10.5" font-style="italic" fill="#57534e">tests · sandboxes · reviews · permissions</text>
  <!-- the direct edge into Alignment's lower-left side (no model in between) -->
  <path d="M300,660 L328,662" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#mm2-ah)"/>
  <text x="170" y="694" text-anchor="middle" font-size="10.5" font-style="italic" fill="#57534e">without explicit models — narrower</text>
  <text x="170" y="710" text-anchor="middle" font-size="10.5" font-style="italic" fill="#57534e">semantic reach; humans fill the gaps</text>

  <!-- ============================ GOVERNED ENVIRONMENT -> CAPITAL ============================ -->
  <rect x="310" y="712" width="380" height="60" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.8"/>
  <text x="500" y="748" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f7a4d">The Governed Engineering Environment</text>
  <path d="M500,772 L500,810" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#mm2-ah)"/>

  <rect x="380" y="812" width="240" height="82" rx="9" fill="#e3f0e7" stroke="#155c38" stroke-width="3.6"/>
  <text x="500" y="848" text-anchor="middle" font-size="19" font-weight="800" fill="#155c38">Engineering Capital</text>
  <text x="500" y="872" text-anchor="middle" font-size="11.5" font-style="italic" fill="#155c38">effort compounds over time</text>

  <!-- ============================ THE SHARED CHURN ATTRACTOR (bottom-right) ============================ -->
  <rect x="720" y="904" width="290" height="94" rx="9" fill="#fbeaea" stroke="#b23b3b" stroke-width="3.6"/>
  <text x="865" y="938" text-anchor="middle" font-size="19" font-weight="800" fill="#b23b3b">Engineering Churn</text>
  <text x="865" y="962" text-anchor="middle" font-size="11" font-style="italic" fill="#b23b3b">the recurring cost of non-durable</text>
  <text x="865" y="980" text-anchor="middle" font-size="11" font-style="italic" fill="#b23b3b">knowledge + judgment</text>

  <!-- recurring-cost flow 1: weak representation (Modeling side) -> churn -->
  <path d="M648,410 L978,410 L978,902" fill="none" stroke="#b23b3b" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#mm2-ah-churn)"/>
  <text x="726" y="758" text-anchor="start" font-size="11" font-weight="700" fill="#b23b3b">weak representation →</text>
  <text x="726" y="776" text-anchor="start" font-size="11" font-weight="600" fill="#b23b3b">rediscovery / human reconstruction</text>

  <!-- recurring-cost flow 2: weak authority (Alignment side) -> churn -->
  <path d="M670,645 L952,645 L952,902" fill="none" stroke="#b23b3b" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#mm2-ah-churn)"/>
  <text x="726" y="824" text-anchor="start" font-size="11" font-weight="700" fill="#b23b3b">weak authority →</text>
  <text x="726" y="842" text-anchor="start" font-size="11" font-weight="600" fill="#b23b3b">repeated inspection / human adjudication</text>

  <!-- ============================ GOVERNANCE-CONVERSION (left-middle, short forks) ============================ -->
  <rect x="30" y="460" width="142" height="116" rx="10" fill="#f6f4ef" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="101" y="492" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#9a3f12">GOVERNANCE</text>
  <text x="101" y="510" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#9a3f12">CONVERSION</text>
  <text x="101" y="532" text-anchor="middle" font-size="10.5" font-style="italic" fill="#57534e">turn failure into</text>
  <text x="101" y="548" text-anchor="middle" font-size="10.5" font-style="italic" fill="#57534e">durable structure</text>

  <!-- input: a governed-work failure feeds the hub (runs below the annotation, then up the far-left margin) -->
  <path d="M310,732 C170,740 40,740 22,690 C14,650 30,600 60,578" fill="none" stroke="#b23b3b" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#mm2-ah-churn)"/>
  <text x="86" y="752" text-anchor="start" font-size="10.5" font-weight="600" fill="#57534e">governed work</text>
  <text x="86" y="768" text-anchor="start" font-size="11" font-weight="700" fill="#b23b3b">→ failure</text>

  <!-- fork A: enrich representations -> onto Modeling (short arc up-right) -->
  <path d="M101,460 C120,410 240,398 350,397" fill="none" stroke="#1f7a4d" stroke-width="2.2" marker-end="url(#mm2-ah-green)"/>
  <text x="180" y="466" text-anchor="start" font-size="11" font-weight="700" fill="#1f7a4d">enrich representations</text>

  <!-- fork B: enrich controls -> onto Alignment (short arc down-right into the left edge) -->
  <path d="M172,560 C230,585 290,605 328,618" fill="none" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#mm2-ah-rust)"/>
  <text x="168" y="606" text-anchor="start" font-size="11" font-weight="700" fill="#9a3f12">enrich controls</text>

  <!-- iterates: muted dotted outer arc — the descent repeats -->
  <path d="M400,894 C120,928 14,850 14,690 C14,450 14,240 14,150 C14,110 120,90 372,88"
        fill="none" stroke="#a8a29e" stroke-width="1.8" stroke-dasharray="2 6" marker-end="url(#mm2-ah-mute)"/>
  <text x="28" y="252" text-anchor="start" font-size="11" font-style="italic" fill="#78716c">↻ iterates</text>
</svg>
