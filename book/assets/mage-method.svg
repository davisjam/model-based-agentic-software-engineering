<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: mage-method). R48/260814 CANONICAL-GRAMMAR SIMPLIFY. This is the book's
     overview figure and it ESTABLISHES the visual grammar the later figures reuse. Deliberate choices:
     (1) ONE CENTRE SPINE, top-to-bottom, the main argument: Scale -> Finite reasoning horizon ->
         New engineering imbalance -> Modeling Principle -> Alignment Principle -> Governed Engineering
         Environment -> Engineering Capital. Everything else is a side-input, a subordinate loop, or a
         dashed failure rail — no competing first-class rectangles in the middle.
     (2) Scale creates the ENDURING reasoning problem (the finite horizon). Commodity intelligence enters
         LATERALLY at the New Engineering Imbalance and changes its ECONOMICS — it does NOT cause the
         horizon. Two short edge labels carry that causal distinction ("makes judgment scarce at scale"
         on the vertical path; "makes implementation abundant" on the lateral commodity input).
     (3) Modeling reaches Alignment along ONE spine edge whose PROMINENT label is the relationship, not a
         box: "expands the semantic surface governance can act on". (The old "Richer semantic surfaces"
         box is demoted to this edge label; the old "Direct / local Alignment" box is removed — that
         proposition lives in the Claim-4 prose, not the figure.)
     (4) GOVERNANCE CONVERSION is ONE subordinate feedback LOOP: recurring failures and judgment in the
         governed environment feed back and adapt the models + controls, which strengthens the
         environment and lets effort accumulate as capital. One labelled loop, not crossing arrows.
     (5) CHURN is the counterfactual attractor reached by AT MOST TWO dashed failure paths — weak
         representation -> reconstruction, weak authority -> repeated adjudication. No taxonomy.
     (6) A light dotted long-range rail marks capital reopening the reasoning problem as scope grows.
     Typography: THREE levels only — node title (17px bold), node explanation (~12px regular), edge
     label (~12px, comfortably readable). Arrowheads: ONE shape, ONE size (8u); colour reinforces the
     line, arrowheads only indicate direction. Palette matches the book: neutral #57534e/#1c1917,
     model-blue #2f5169, modeling-green #1f7a4d/#155c38, obligation-rust #9a3f12, synthesis-teal
     #1c6b5f, failure-red #b23b3b. Source Sans 3 (preface/how-to family). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1020" width="1000" height="1020"
     role="img" aria-labelledby="mmTitle mmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mmTitle">The MAGE method — scale creates the enduring reasoning problem; commodity intelligence changes its economics; Modeling and Alignment turn engineering effort into capital rather than churn.</title>
  <desc id="mmDesc">A single centre spine reads top to bottom: Scale, a Finite reasoning horizon, a New
    engineering imbalance, the Modeling Principle, the Alignment Principle, the Governed Engineering
    Environment, and Engineering Capital. Scale is the enduring source of a finite reasoning horizon —
    relevant state exceeds the active window, so reasoning state must be reconstructed — which makes
    reasoning and judgment scarce at scale. Commodity intelligence enters laterally at the New
    Engineering Imbalance, making implementation abundant while judgment, representation, evidence, and
    authority stay scarce; it changes the economics of the imbalance but does not cause the reasoning
    horizon. The Modeling Principle answers the imbalance by making consequential knowledge and intent
    explicit at useful scales, which expands the semantic surface that governance can act on and reaches
    the Alignment Principle, where obligations are given authority through constraints, sensors, validators,
    and gates. Passing through Alignment the spine enters the Governed Engineering Environment — the
    synthesis of both principles — and effort compounds as Engineering Capital when future value exceeds its
    carrying cost. A single subordinate governance-conversion loop feeds recurring failures and judgment
    back to adapt the models and controls, strengthening the environment. Two dashed failure paths lead
    to Engineering Churn: weak representation is repaid as reconstruction, weak authority as repeated
    adjudication. A light dotted long-range rail marks capital reopening the reasoning problem as scope
    grows.</desc>

  <defs>
    <!-- ONE arrowhead shape, ONE size (8u, userSpaceOnUse); fill only reinforces the line colour. -->
    <marker id="mm-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="mm-ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
    <marker id="mm-ah-loop" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78716c"/>
    </marker>
    <marker id="mm-ah-churn" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/>
    </marker>
    <marker id="mm-ah-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1020" fill="#fdfcf9"/>

  <!-- =============== LONG-RANGE RAIL (drawn first, sits beneath everything) =============== -->
  <!-- edge: capital .. finite -->
  <path d="M384,828 C150,852 20,806 20,660 L20,150 C20,110 170,150 346,150"
        fill="none" stroke="#a8a29e" stroke-width="1.6" stroke-dasharray="2 6" marker-end="url(#mm-ah-mute)"/>
  <text x="30" y="470" font-size="13" font-style="italic" fill="#78716c">&#8635; greater scope reopens</text>
  <text x="30" y="486" font-size="13" font-style="italic" fill="#78716c">the reasoning problem</text>

  <!-- =============== THE CENTRE SPINE (main argument; x=500) =============== -->

  <!-- Scale -->
  <rect id="scale" x="350" y="40" width="300" height="54" rx="8" fill="#f6f4ef" stroke="#1c1917" stroke-width="2.4"/>
  <text x="500" y="66" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">Scale</text>
  <text x="500" y="84" text-anchor="middle" font-size="13" fill="#57534e">large systems exceed any one reasoner</text>
  <!-- edge: scale -> finite -->
  <path d="M500,94 L500,120" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#mm-ah)"/>

  <!-- Finite reasoning horizon (the enduring problem) -->
  <rect id="finite" x="350" y="122" width="300" height="76" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="500" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">Finite reasoning horizon</text>
  <text x="500" y="172" text-anchor="middle" font-size="13" fill="#57534e">relevant state exceeds the active window;</text>
  <text x="500" y="189" text-anchor="middle" font-size="13" fill="#57534e">reasoning state must be reconstructed</text>
  <!-- edge: finite -> imbalance -->
  <path d="M500,198 L500,230" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#mm-ah)"/>
  <text x="512" y="219" font-size="13" fill="#57534e">makes judgment scarce at scale</text>

  <!-- New engineering imbalance (neutral problem frame; commodity enters here laterally) -->
  <rect id="imbalance" x="350" y="232" width="300" height="100" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="500" y="260" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">New engineering imbalance</text>
  <text x="500" y="284" text-anchor="middle" font-size="13" fill="#57534e">implementation abundant while</text>
  <text x="500" y="301" text-anchor="middle" font-size="13" fill="#57534e">judgment &#183; representation &#183;</text>
  <text x="500" y="318" text-anchor="middle" font-size="13" fill="#57534e">evidence &#183; authority stay scarce</text>
  <!-- edge: imbalance -> modeling -->
  <path d="M500,332 L500,372" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#mm-ah)"/>

  <!-- Modeling Principle -->
  <rect id="modeling" x="350" y="374" width="300" height="80" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="500" y="402" text-anchor="middle" font-size="17" font-weight="700" fill="#1f7a4d">Modeling Principle</text>
  <text x="500" y="425" text-anchor="middle" font-size="13" fill="#57534e">make consequential knowledge + intent</text>
  <text x="500" y="442" text-anchor="middle" font-size="13" fill="#57534e">explicit at useful scales</text>

  <!-- Modeling -> Alignment: ONE spine edge; its PROMINENT label is the relationship -->
  <!-- edge: modeling -> alignment -->
  <path d="M500,454 L500,556" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#mm-ah)"/>
  <!-- the relationship label's background doubles as the node the governance-conversion loop plugs into -->
  <rect id="semantic-surface" x="342" y="486" width="316" height="38" fill="#fdfcf9"/>
  <text x="500" y="502" text-anchor="middle" font-size="13" font-weight="600" fill="#1f7a4d">expands the semantic surface</text>
  <text x="500" y="519" text-anchor="middle" font-size="13" font-weight="600" fill="#1f7a4d">governance can act on</text>

  <!-- Alignment Principle -->
  <rect id="alignment" x="350" y="558" width="300" height="84" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="500" y="586" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f12">Alignment Principle</text>
  <text x="500" y="609" text-anchor="middle" font-size="13" fill="#57534e">give obligations authority</text>
  <text x="500" y="627" text-anchor="middle" font-size="13" fill="#57534e">constraints &#183; sensors &#183; validators &#183; gates</text>
  <!-- edge: alignment -> gee -->
  <path d="M500,642 L500,674" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#mm-ah)"/>

  <!-- Governed Engineering Environment (synthesis — teal) -->
  <rect id="gee" x="330" y="676" width="340" height="60" rx="8" fill="#e6f1ee" stroke="#1c6b5f" stroke-width="2.8"/>
  <text x="500" y="702" text-anchor="middle" font-size="17" font-weight="700" fill="#185c52">Governed Engineering Environment</text>
  <text x="500" y="723" text-anchor="middle" font-size="13" font-style="italic" fill="#185c52">where both principles meet and effort compounds</text>
  <!-- edge: gee -> capital -->
  <path d="M500,736 L500,788" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#mm-ah)"/>
  <text x="512" y="762" font-size="13" fill="#57534e">when future value exceeds carrying cost</text>

  <!-- Engineering Capital (positive outcome — green) -->
  <rect id="capital" x="384" y="790" width="232" height="80" rx="9" fill="#e3f0e7" stroke="#155c38" stroke-width="3.4"/>
  <text x="500" y="822" text-anchor="middle" font-size="17" font-weight="700" fill="#155c38">Engineering Capital</text>
  <text x="500" y="845" text-anchor="middle" font-size="13" font-style="italic" fill="#155c38">effort compounds over time</text>
  <text x="500" y="862" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">can depreciate &#183; maintain or retire</text>

  <!-- =============== LATERAL INPUT: commodity intelligence =============== -->
  <!-- Enters the imbalance from the side and changes its ECONOMICS; it does NOT cause the reasoning
       horizon (that is Scale). The short label carries the economics half of the causal distinction;
       the imbalance box already carries "implementation abundant". -->
  <rect id="commodity" x="40" y="242" width="220" height="84" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="150" y="270" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2f5169">Commodity intelligence</text>
  <text x="150" y="292" text-anchor="middle" font-size="13" fill="#57534e">implementation cheap and</text>
  <text x="150" y="309" text-anchor="middle" font-size="13" fill="#57534e">abundant relative to judgment</text>
  <!-- edge: commodity -> imbalance -->
  <path d="M260,284 L348,284" fill="none" stroke="#2f5169" stroke-width="2.1" marker-end="url(#mm-ah-blue)"/>
  <text x="303" y="273" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5169">changes the</text>
  <text x="303" y="287" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5169">economics</text>

  <!-- =============== GOVERNANCE CONVERSION: ONE subordinate feedback loop =============== -->
  <!-- edge: gee -> semantic-surface -->
  <path d="M330,706 C180,732 82,704 82,612 L82,506 C82,478 200,500 346,506"
        fill="none" stroke="#78716c" stroke-width="2" marker-end="url(#mm-ah-loop)"/>
  <text x="92" y="600" font-size="13" font-weight="700" fill="#57534e">Governance conversion</text>
  <text x="92" y="618" font-size="13" fill="#78716c">recurring failures + judgment</text>
  <text x="92" y="634" font-size="13" fill="#78716c">adapt the models + controls</text>

  <!-- =============== CHURN: the failure attractor, reached by two dashed paths =============== -->
  <rect id="churn" x="700" y="846" width="280" height="96" rx="9" fill="#fbeaea" stroke="#b23b3b" stroke-width="3.4"/>
  <text x="840" y="886" text-anchor="middle" font-size="17" font-weight="700" fill="#b23b3b">Engineering Churn</text>
  <text x="840" y="910" text-anchor="middle" font-size="13" font-style="italic" fill="#b23b3b">effort re-paid, never settling</text>
  <text x="840" y="927" text-anchor="middle" font-size="13" font-style="italic" fill="#b23b3b">into durable structure</text>

  <!-- weak representation -> reconstruction (leaves the Modeling side) -->
  <!-- edge: modeling .. churn -->
  <path d="M650,414 L840,414 L840,844" fill="none" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mm-ah-churn)"/>
  <text x="658" y="405" font-size="13" font-weight="600" fill="#b23b3b">weak representation &#8594; reconstruction</text>

  <!-- weak authority -> repeated adjudication (leaves the Alignment side) -->
  <!-- edge: alignment .. churn -->
  <path d="M650,600 L840,600 L840,844" fill="none" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mm-ah-churn)"/>
  <text x="658" y="591" font-size="13" font-weight="600" fill="#b23b3b">weak authority &#8594; repeated adjudication</text>
</svg>
