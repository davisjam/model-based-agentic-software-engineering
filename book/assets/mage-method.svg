<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: mage-method). R48/260814 CANONICAL-GRAMMAR SIMPLIFY. This is the book's
     overview figure and it ESTABLISHES the visual grammar the later figures reuse. Deliberate choices:
     (1) ONE CENTRE SPINE, top-to-bottom, the main argument: Scale x Finite reasoning ->
         New engineering imbalance -> Modeling Principle -> Alignment Principle -> Governed Engineering
         Environment -> Engineering Capital. Everything else is a side-input, a subordinate loop, or a
         dashed failure rail — no competing first-class rectangles in the middle.
     (2) Scale creates the ENDURING reasoning problem (the finite horizon). Commodity intelligence enters
         LATERALLY at the New Engineering Imbalance and changes its ECONOMICS — it does NOT cause the
         horizon. Two short edge labels carry that causal distinction ("makes judgment scarce at scale"
         on the vertical path; "makes implementation abundant" on the lateral commodity input).
     (3) Modeling reaches Alignment along ONE spine edge whose PROMINENT label is the relationship, not a
         box: "expands the semantic surface governance can act on". (The old "Richer semantic surfaces"
         box is demoted to this edge label; the old "Direct / local Alignment" box is removed — that
         proposition lives in the Claim-4 prose, not the figure.)
     (4) GOVERNANCE CONVERSION is ONE subordinate feedback LOOP: recurring failures and judgment in the
         governed environment feed back and adapt the models + controls, which strengthens the
         environment and lets effort accumulate as capital. One labelled loop, not crossing arrows.
     (5) CHURN is the counterfactual attractor reached by AT MOST TWO dashed failure paths — weak
         representation -> reconstruction, weak authority -> repeated adjudication. No taxonomy.
     (6) A light dotted long-range rail marks capital reopening the reasoning problem as scope grows.
     Typography: legibility-floor pass (260820) — every boxed label sits at the 20u print floor (spine node
     titles 22u for hierarchy), long subordinate phrases WRAP to two lines rather than shrink, and boxes
     grew into the surrounding whitespace with their edge endpoints moved to the new borders. Arrowheads:
     ONE shape, ONE size (8u); colour reinforces the line, arrowheads only indicate direction. Palette
     matches the book: neutral #57534e/#1c1917, model-blue #2f5169, modeling-green #1f7a4d/#155c38,
     obligation-rust #9a3f12, synthesis-teal #1c6b5f, failure-red #b23b3b. Source Sans 3 (preface/how-to family). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1020" width="1000" height="1020"
     role="img" aria-labelledby="mmTitle mmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mmTitle">The MAGE method — scale creates the enduring reasoning problem; commodity intelligence changes its economics; Modeling and Alignment turn engineering effort into capital rather than churn.</title>
  <desc id="mmDesc">A single centre spine reads top to bottom: Scale and Finite reasoning combined in one
    node, a New engineering imbalance, the Modeling Principle, the Alignment Principle, the Governed
    Engineering Environment, and Engineering Capital. Scale is the enduring source of a finite reasoning
    horizon: large systems exceed any one reasoner, so relevant state must be abstracted or reconstructed,
    which makes judgment scarce at scale. Commodity intelligence enters laterally at the New
    Engineering Imbalance, making implementation abundant while judgment, representation, evidence, and
    authority stay scarce; it changes the economics of the imbalance but does not cause the reasoning
    horizon. The Modeling Principle answers the imbalance by making consequential knowledge and intent
    explicit at useful scales, which expands the semantic surface that governance can act on and reaches
    the Alignment Principle, where obligations are given authority through constraints, sensors, validators,
    and gates. Passing through Alignment the spine enters the Governed Engineering Environment — the
    synthesis of both principles — and effort compounds as Engineering Capital when future value exceeds its
    carrying cost. A single subordinate governance-conversion loop feeds recurring failures and judgment
    back to adapt the models and controls, strengthening the environment. Two dashed failure paths lead
    to Engineering Churn: weak representation is repaid as reconstruction, weak authority as repeated
    adjudication. A light dotted long-range rail marks capital reopening the reasoning problem as scope
    grows.</desc>

  <defs>
    <!-- ONE arrowhead shape, ONE size (8u, userSpaceOnUse); fill only reinforces the line colour. -->
    <marker id="mm-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="mm-ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
    <marker id="mm-ah-loop" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78716c"/>
    </marker>
    <marker id="mm-ah-churn" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/>
    </marker>
    <marker id="mm-ah-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1020" fill="#fdfcf9"/>

  <!-- edge-grammar: keep-angles -->
  <!-- KEEP-ANGLES (this grammar-establishing overview's non-orthogonal edges are all deliberate):
       (1) Two feedback rails are intentional curves — the light dotted long-range rail (capital .. finite,
           "greater scope reopens the reasoning problem") and the Governance-conversion loop
           (gee -> semantic-surface). Bending them to right angles would clutter the figure they anchor.
       (2) The two dashed CHURN failure rails (modeling .. churn, alignment .. churn) deliberately SIDE-EXIT
           the spine. Churn is a LATERAL failure attractor in the bottom-right corner, not a spine child;
           leaving the box on its right side IS the grammar ("you left the success spine and fell off to the
           side"), the rail's label rides the horizontal run, and both rails converge on the single drop into
           Churn's top. A bottom flow-exit detour is impossible cleanly: the spine (Alignment, GEE, Capital,
           the semantic-surface label) fully occupies the space below Modeling/Alignment, so a bottom route
           would have to snake around the whole spine and would break the two rails' shared convergence. The
           straight-vertical spine edges stay orthogonal by hand; opting the figure out only skips edges that
           are already correct or deliberately not. -->

  <!-- =============== LONG-RANGE RAIL (drawn first, sits beneath everything) =============== -->
  <!-- edge: capital .. scale-finite -->
  <path d="M402,1002 C150,975 20,895 20,675 L20,150 C20,108 190,114 346,114"
        fill="none" stroke="#a8a29e" stroke-width="1.6" stroke-dasharray="2 6" marker-end="url(#mm-ah-mute)"/>
  <text x="30" y="462" font-size="20" font-style="italic" fill="#78716c">&#8635; greater scope reopens</text>
  <text x="30" y="486" font-size="20" font-style="italic" fill="#78716c">the reasoning problem</text>

  <!-- =============== THE CENTRE SPINE (main argument; x=500) =============== -->

  <!-- Scale x Finite reasoning (the top two boxes merged: Scale is the enduring source of the finite
       reasoning horizon, so they now read as ONE node — the problem the method answers) -->
  <rect id="scale-finite" x="350" y="46" width="300" height="150" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="500" y="80" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Scale &#215; finite reasoning</text>
  <text x="500" y="112" text-anchor="middle" font-size="20" fill="#57534e">large systems exceed</text>
  <text x="500" y="136" text-anchor="middle" font-size="20" fill="#57534e">any one reasoner;</text>
  <text x="500" y="162" text-anchor="middle" font-size="20" fill="#57534e">relevant state must be abstracted</text>
  <text x="500" y="186" text-anchor="middle" font-size="20" fill="#57534e">or reconstructed</text>
  <!-- edge: scale-finite -> imbalance -->
  <path d="M500,196 L500,242" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#mm-ah)"/>
  <text x="512" y="224" font-size="20" fill="#57534e">makes judgment scarce at scale</text>

  <!-- New engineering imbalance (neutral problem frame; commodity enters here laterally) -->
  <rect id="imbalance" x="350" y="244" width="300" height="126" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="500" y="278" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">New engineering imbalance</text>
  <text x="500" y="308" text-anchor="middle" font-size="20" fill="#57534e">implementation abundant while</text>
  <text x="500" y="332" text-anchor="middle" font-size="20" fill="#57534e">judgment &#183; representation &#183;</text>
  <text x="500" y="356" text-anchor="middle" font-size="20" fill="#57534e">evidence &#183; authority stay scarce</text>
  <!-- edge: imbalance -> modeling -->
  <path d="M500,370 L500,398" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#mm-ah)"/>

  <!-- Modeling Principle -->
  <rect id="modeling" x="350" y="400" width="300" height="100" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="500" y="434" text-anchor="middle" font-size="22" font-weight="700" fill="#1f7a4d">Modeling Principle</text>
  <text x="500" y="464" text-anchor="middle" font-size="20" fill="#57534e">make consequential knowledge</text>
  <text x="500" y="488" text-anchor="middle" font-size="20" fill="#57534e">+ intent explicit at useful scales</text>

  <!-- Modeling -> Alignment: ONE spine edge; its PROMINENT label is the relationship -->
  <!-- edge: modeling -> alignment -->
  <path d="M500,500 L500,600" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#mm-ah)"/>
  <!-- the relationship label's background doubles as the node the governance-conversion loop plugs into -->
  <rect id="semantic-surface" x="342" y="512" width="316" height="56" fill="#fdfcf9"/>
  <text x="500" y="536" text-anchor="middle" font-size="20" font-weight="600" fill="#1f7a4d">makes more of the</text>
  <text x="500" y="560" text-anchor="middle" font-size="20" font-weight="600" fill="#1f7a4d">system governable</text>

  <!-- Alignment Principle -->
  <rect id="alignment" x="350" y="602" width="300" height="126" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="500" y="636" text-anchor="middle" font-size="22" font-weight="700" fill="#9a3f12">Alignment Principle</text>
  <text x="500" y="666" text-anchor="middle" font-size="20" fill="#57534e">give obligations authority</text>
  <text x="500" y="690" text-anchor="middle" font-size="20" fill="#57534e">constraints &#183; sensors &#183;</text>
  <text x="500" y="714" text-anchor="middle" font-size="20" fill="#57534e">validators &#183; gates</text>
  <!-- edge: alignment -> gee -->
  <path d="M500,728 L500,756" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#mm-ah)"/>

  <!-- Governed Engineering Environment (synthesis — teal) -->
  <rect id="gee" x="320" y="758" width="360" height="96" rx="8" fill="#e6f1ee" stroke="#1c6b5f" stroke-width="2.8"/>
  <text x="500" y="790" text-anchor="middle" font-size="20" font-weight="700" fill="#185c52">Governed Engineering Environment</text>
  <text x="500" y="818" text-anchor="middle" font-size="20" font-style="italic" fill="#185c52">where Modeling and Alignment</text>
  <text x="500" y="840" text-anchor="middle" font-size="20" font-style="italic" fill="#185c52">work together</text>
  <!-- edge: gee -> capital -->
  <path d="M500,854 L500,898" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#mm-ah)"/>
  <text x="488" y="880" text-anchor="end" font-size="20" fill="#57534e">when future value exceeds upkeep</text>

  <!-- Engineering Capital (positive outcome — green) -->
  <rect id="capital" x="350" y="900" width="300" height="104" rx="9" fill="#e3f0e7" stroke="#155c38" stroke-width="3.4"/>
  <text x="500" y="934" text-anchor="middle" font-size="22" font-weight="700" fill="#155c38">Engineering Capital</text>
  <text x="500" y="964" text-anchor="middle" font-size="20" font-style="italic" fill="#155c38">effort compounds over time</text>
  <text x="500" y="988" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">can depreciate &#183; maintain or retire</text>

  <!-- =============== LATERAL INPUT: commodity intelligence =============== -->
  <!-- Enters the imbalance from the side and changes its ECONOMICS; it does NOT cause the reasoning
       horizon (that is Scale). The short label carries the economics half of the causal distinction;
       the imbalance box already carries "implementation abundant". -->
  <rect id="commodity" x="40" y="244" width="230" height="126" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="155" y="278" text-anchor="middle" font-size="20" font-weight="700" fill="#2f5169">Commodity intelligence</text>
  <text x="155" y="308" text-anchor="middle" font-size="20" fill="#57534e">implementation cheap</text>
  <text x="155" y="332" text-anchor="middle" font-size="20" fill="#57534e">and abundant relative</text>
  <text x="155" y="356" text-anchor="middle" font-size="20" fill="#57534e">to judgment</text>
  <!-- edge: commodity -> imbalance -->
  <path d="M270,306 L348,306" fill="none" stroke="#2f5169" stroke-width="2.1" marker-end="url(#mm-ah-blue)"/>
  <text x="300" y="282" text-anchor="middle" font-size="20" font-weight="600" fill="#2f5169">changes the</text>
  <text x="300" y="302" text-anchor="middle" font-size="20" font-weight="600" fill="#2f5169">economics</text>

  <!-- =============== GOVERNANCE CONVERSION: ONE subordinate feedback loop =============== -->
  <!-- edge: gee -> semantic-surface -->
  <path d="M320,795 C168,822 82,792 82,660 L82,545 C82,512 210,530 340,533"
        fill="none" stroke="#78716c" stroke-width="2" marker-end="url(#mm-ah-loop)"/>
  <text x="92" y="588" font-size="20" font-weight="700" fill="#57534e">Governance conversion</text>
  <text x="92" y="612" font-size="20" fill="#78716c">recurring failures + judgment</text>
  <text x="92" y="636" font-size="20" fill="#78716c">adapt the models + controls</text>

  <!-- =============== CHURN: the failure attractor, reached by two dashed paths =============== -->
  <rect id="churn" x="700" y="858" width="280" height="104" rx="9" fill="#fbeaea" stroke="#b23b3b" stroke-width="3.4"/>
  <text x="840" y="892" text-anchor="middle" font-size="22" font-weight="700" fill="#b23b3b">Engineering Churn</text>
  <text x="840" y="922" text-anchor="middle" font-size="20" font-style="italic" fill="#b23b3b">the same work</text>
  <text x="840" y="946" text-anchor="middle" font-size="20" font-style="italic" fill="#b23b3b">gets paid for again</text>

  <!-- weak representation -> reconstruction (leaves the Modeling side) -->
  <!-- edge: modeling .. churn -->
  <path d="M650,438 L840,438 L840,856" fill="none" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mm-ah-churn)"/>
  <text x="658" y="410" font-size="20" font-weight="600" fill="#b23b3b">weak representation &#8594;</text>
  <text x="658" y="432" font-size="20" font-weight="600" fill="#b23b3b">reconstruction</text>

  <!-- weak authority -> repeated adjudication (leaves the Alignment side) -->
  <!-- edge: alignment .. churn -->
  <path d="M650,634 L840,634 L840,856" fill="none" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mm-ah-churn)"/>
  <text x="658" y="606" font-size="20" font-weight="600" fill="#b23b3b">weak authority &#8594;</text>
  <text x="658" y="628" font-size="20" font-weight="600" fill="#b23b3b">repeated adjudication</text>
</svg>
