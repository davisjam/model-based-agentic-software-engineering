<rect x="11" y="180" width="126" height="23" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="74" y="195" font-size="10" text-anchor="middle" font-style="italic">Accept / exempt</text>
<path d="M221,127 L221,140" fill="none" stroke="#1c1917" stroke-width="0.7" marker-end="url(#arrow)"/>
<rect x="154" y="142" width="134" height="23" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<text x="221" y="157" font-size="9.5" text-anchor="middle" font-weight="700">LATENT CONCEPT</text>
<path d="M221,166 L221,178" fill="none" stroke="#1c1917" stroke-width="0.7" marker-end="url(#arrow)"/>
<rect x="158" y="180" width="126" height="23" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="221" y="195" font-size="10" text-anchor="middle" font-weight="700">NAME THE MODEL</text>
