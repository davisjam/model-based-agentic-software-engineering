<rect x="137" y="303" width="168" height="33" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="221" y="316" font-size="9.5" text-anchor="middle" font-weight="700">NARROWER ENFORCEMENT</text>
<text x="221" y="329" font-size="9" text-anchor="middle" font-style="italic">(types; lints; drift guard)</text>
<path d="M221,337 L221,346" fill="none" stroke="#1c1917" stroke-width="0.7" marker-end="url(#arrow)"/>
<rect x="123" y="348" width="196" height="23" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<text x="221" y="363" font-size="10" text-anchor="middle" font-weight="700">STRONGER MODEL SUBSTRATE</text>
<path d="M320,359 C442,359 442,270 442,190 C442,80 442,16 301,16" fill="none" stroke="#1c1917" stroke-width=".9" marker-end="url(#arrow)"/>
<text x="378" y="10" font-size="9" text-anchor="middle" font-style="italic">next pass</text>
<text x="372" y="267" font-size="9" text-anchor="middle" font-weight="700">KEY</text>
<rect x="325" y="278" width="15" height="10" rx="2" fill="white" stroke="#1c1917" stroke-width="0.55"/>
