<svg xmlns="http://www.w3.org/2000/svg" width="592" height="498.667" viewBox="0 0 444 374" role="img" aria-labelledby="title desc" font-family="'Source Sans 3', sans-serif">
<title id="title">Discovering latent models</title>
<desc id="desc">Weak signals in an existing codebase are partitioned into legitimate shape, latent concept, or mechanical debt. A latent concept is named, explicitly represented, adopted by consumers, and supported by narrower enforcement. The stronger model substrate feeds the next pass over the existing codebase.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1c1917"/></marker></defs>
<g fill="#1c1917" font-family="'Source Sans 3', sans-serif" font-size="9">
