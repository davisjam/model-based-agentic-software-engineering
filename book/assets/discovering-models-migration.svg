<text x="221" y="20" font-size="10" text-anchor="middle" font-weight="700">EXISTING CODEBASE</text>
<rect x="116" y="42" width="210" height="40" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="221" y="55" font-size="10" text-anchor="middle" font-weight="700">Weak signals:</text>
<text x="221" y="67" font-size="9" text-anchor="middle">primitive density · repeated shapes</text>
<text x="221" y="78" font-size="9" text-anchor="middle">component / boundary view</text>
<path d="M221,29 L221,40" fill="none" stroke="#1c1917" stroke-width="0.7" marker-end="url(#arrow)"/>
<rect x="143" y="95" width="156" height="23" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="221" y="110" font-size="10" text-anchor="middle" font-weight="700">PARTITION FINDINGS</text>
<path d="M221,83 L221,93" fill="none" stroke="#1c1917" stroke-width="0.7" marker-end="url(#arrow)"/>
<text x="57" y="99" font-size="9" text-anchor="middle" font-style="italic">Weak signals locate</text>
<text x="57" y="110" font-size="9" text-anchor="middle" font-style="italic">potential work.</text>
<path d="M221,119 L221,127" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<path d="M74,127 L368,127" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<path d="M74,127 L74,140" fill="none" stroke="#1c1917" stroke-width="0.7" marker-end="url(#arrow)"/>
<rect x="7" y="142" width="134" height="23" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="74" y="157" font-size="9.5" text-anchor="middle" font-weight="700">LEGITIMATE SHAPE</text>
