<svg xmlns="http://www.w3.org/2000/svg" width="592" height="346" viewBox="0 0 444 259" role="img" aria-labelledby="title desc" font-family="Source Sans 3, sans-serif">
<title id="title">Model agreement, obligation satisfaction, and admission</title>
<desc id="desc">The governed engineering environment contains an engineering model, its no-direct-database-access obligation, and an acceptance decision. Correspondence compares the proposed implementation with the model. Conformance compares the same implementation with the obligation. The implementation sits outside the environment and is submitted for acceptance under its controls and evidence requirements.</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#1c1917"/></marker></defs>
