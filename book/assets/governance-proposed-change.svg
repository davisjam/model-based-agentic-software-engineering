<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 378 354" width="378" height="354" role="img" aria-labelledby="title desc" font-family="'Source Sans 3', sans-serif">
<title id="title">Governance around a proposed reporting change</title>
<desc id="desc">A proposed change is restricted by a module boundary. Instrumented tests record attempted interactions. A merge gate combines the build results, recorded interactions, and architectural policy to accept the change or return it for repair.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z"/></marker></defs>
<rect x="93" y="2" width="192" height="32" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="189" y="15" text-anchor="middle" font-size="10" font-weight="700">PROPOSED REPORTING CHANGE</text>
<text x="189" y="28" text-anchor="middle" font-size="9" font-style="italic">candidate for merge</text>
<rect x="2" y="62" width="151" height="110" rx="3" fill="#f0f0f0" stroke="#1c1917" stroke-width=".65"/>
<rect x="225" y="62" width="151" height="110" rx="3" fill="#f0f0f0" stroke="#1c1917" stroke-width=".65"/>
<text x="77.5" y="76" text-anchor="middle" font-size="10" font-weight="700">CONSTRAINT</text>
<text x="77.5" y="89" text-anchor="middle" font-size="9" font-style="italic">What can happen?</text>
<text x="300.5" y="76" text-anchor="middle" font-size="10" font-weight="700">SENSOR</text>
<text x="300.5" y="89" text-anchor="middle" font-size="9" font-style="italic">What evidence do we have?</text>
<text x="77.5" y="107" text-anchor="middle" font-size="9">Module boundary exposes</text>
<text x="77.5" y="118" text-anchor="middle" font-size="9">billing API client; excludes</text>
<text x="77.5" y="129" text-anchor="middle" font-size="9">private DB connector.</text>
<text x="77.5" y="145" text-anchor="middle" font-size="9">Scope: checked imports.</text>
<text x="77.5" y="157" text-anchor="middle" font-size="9">Generic networking remains possible.</text>
<text x="300.5" y="107" text-anchor="middle" font-size="9">Instrumented tests record</text>
<text x="300.5" y="118" text-anchor="middle" font-size="9">caller · destination · outcome</text>
<text x="300.5" y="134" text-anchor="middle" font-size="9">May reveal a direct DB attempt</text>
<text x="300.5" y="145" text-anchor="middle" font-size="9">through generic networking.</text>
<text x="300.5" y="156" text-anchor="middle" font-size="9">Recording does not block</text>
<text x="300.5" y="167" text-anchor="middle" font-size="9">connections.</text>
<rect x="2" y="223" width="137" height="64" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="70.5" y="238" text-anchor="middle" font-size="9.5" font-weight="700">ARCHITECTURAL MODEL</text>
<text x="70.5" y="256" text-anchor="middle" font-size="9">Reporting uses billing API.</text>
<text x="70.5" y="269" text-anchor="middle" font-size="9">No direct access to</text>
<text x="70.5" y="280" text-anchor="middle" font-size="9">billing database.</text>
<rect x="153" y="204" width="223" height="96" rx="3" fill="#f0f0f0" stroke="#1c1917" stroke-width=".65"/>
<text x="264.5" y="219" text-anchor="middle" font-size="10" font-weight="700">GATE</text>
<text x="264.5" y="233" text-anchor="middle" font-size="9" font-style="italic">May this proceed?</text>
<text x="264.5" y="252" text-anchor="middle" font-size="9">Check build results and recorded interactions</text>
<text x="264.5" y="263" text-anchor="middle" font-size="9">against the architectural model.</text>
<text x="264.5" y="282" text-anchor="middle" font-size="9">Refuse merge on required failure</text>
<text x="264.5" y="293" text-anchor="middle" font-size="9">or missing evidence.</text>
<rect x="143" y="326" width="112" height="24" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="199" y="342" text-anchor="middle" font-size="9.5" font-weight="700">ACCEPTED CHANGE</text>
<rect x="271" y="326" width="105" height="24" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="323.5" y="342" text-anchor="middle" font-size="9" font-weight="700">RETURNED FOR REPAIR</text>
<path d="M189 34 L189 204" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M153 34 L153 46 L77.5 46 L77.5 62" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M225 34 L225 46 L300.5 46 L300.5 62" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M77.5 172 L77.5 184 L166 184 L166 204" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M300.5 172 L300.5 204" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M139 255 L153 255" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<text x="119" y="180" text-anchor="middle" font-size="9">build-check result</text>
<text x="334" y="182" text-anchor="middle" font-size="9">recorded</text>
<text x="334" y="193" text-anchor="middle" font-size="9">interactions</text>
<path d="M199 300 L199 326" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M323.5 300 L323.5 326" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<text x="191" y="315" text-anchor="end" font-size="9">checks pass</text>
<text x="315" y="312" text-anchor="end" font-size="9">required failure or</text>
<text x="315" y="323" text-anchor="end" font-size="9">missing evidence</text>
</svg>
