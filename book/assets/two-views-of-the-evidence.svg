<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: two-views-of-the-evidence). Part-V opener figure (verso): the two sources
     of evidence as a converging two-column diagram. Left column, the ORIGINATING CASE (DocAble) —
     high process depth, longitudinal history, incidents + responses, within-case recurrence — answers
     HOW DID IT EMERGE?. Right column, INDUSTRIAL RECONSTRUCTIONS (independent systems) — greater
     variation, selected mechanisms, different constraints, alternative realizations — answers HOW FAR
     DOES IT TRAVEL?. Both converge on ANALYTIC GENERALIZATION (constructs + mechanisms worth explaining),
     which motivates PART VI · A THEORY OF MAGE. Deliberately modest: no "proof", "validation", or
     "generalizability" on the figure (only "analytic generalization" as the named methodological move),
     and a closing caveat line states plainly that neither view supplies causal or population-level
     estimates. Palette: Umber Monograph tokens — the originating case reads modeling-green (#1f7a4d
     stroke / #e3f0e7 fill, the "knowledge/representation" family), the industrial reconstructions read
     agent-blue (#2f5169 stroke / #e7edf3 fill, the "fleet of independent instances" family), and the
     convergence + Part VI pointer read governance-rust (#9a3f12 / #faf1e6) for the pivot and ink
     (#1c1917) for the destination box. Ink titles, muted (#57534e) captions/connectors, rule (#e4e0d8)
     unused here. Fonts in the 14-26 band at the 1000px reference. -->
<!-- semantic-families: modeling, agent, governance, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820"
     role="group" aria-labelledby="tveTitle tveDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="tveTitle">Two views of the evidence</title>
  <desc id="tveDesc">A two-column diagram converging to one point. The evidence splits into an
    originating case, DocAble, offering high process depth, longitudinal history, incidents and
    responses, and within-case recurrence, which together answer how the phenomenon emerged; and
    industrial reconstructions, independent systems, offering greater variation, selected mechanisms,
    different constraints, and alternative realizations, which together answer how far it travels.
    The two columns converge on analytic generalization, the constructs and mechanisms worth
    explaining, which motivates the theoretical account developed in Part VI, A Theory of MAGE.
    Neither view supplies causal or population-level estimates.</desc>

  <defs>
    <marker id="tve-arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
             orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f7a4d"/>
    </marker>
    <marker id="tve-arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
             orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
    <marker id="tve-arrow-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
             orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="820" fill="#fdfcf9"/>

  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">Two views of the evidence</text>
  <text x="500" y="70" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">Depth versus breadth — together they motivate the theory in Part VI.</text>

  <!-- THE EVIDENCE — a bare text node given a transparent rect anchor so the lint can read its geometry -->
  <rect id="evidence" x="428" y="90" width="144" height="24" fill="none" stroke="none"/>
  <text x="500" y="106" text-anchor="middle" font-size="15.01" font-weight="700" letter-spacing="2" fill="#1c1917">THE EVIDENCE</text>

  <!-- ===== EDGES (drawn under nodes) ===== -->
  <!-- split from the apex to the two column headers (undirected fork; each branch runs apex-centre to node centre) -->
  <!-- edge: evidence -> originating-case -->
  <line x1="444" y1="114" x2="444" y2="160" stroke="#57534e" stroke-width="2" fill="none"/>
  <!-- edge: evidence -> industrial -->
  <line x1="556" y1="114" x2="556" y2="160" stroke="#57534e" stroke-width="2" fill="none"/>

  <!-- connectors from headers to bullet lists (decorative; source/target is a text region, left unannotated) -->
  <line x1="260" y1="224" x2="260" y2="252" stroke="#57534e" stroke-width="1.6"/>
  <line x1="740" y1="224" x2="740" y2="252" stroke="#57534e" stroke-width="1.6"/>

  <!-- arrows from the bullet lists down to the two questions (source is the bullet region, not a node, so unannotated;
       head seats on the question box) -->
  <line x1="260" y1="362" x2="260" y2="411" stroke="#1f7a4d" stroke-width="2.2" marker-end="url(#tve-arrow-green)"/>
  <line x1="740" y1="362" x2="740" y2="411" stroke="#2f5169" stroke-width="2.2" marker-end="url(#tve-arrow-blue)"/>

  <!-- convergence: a two-branch MERGE, one path per branch; both run box-centre to analytic-gen rim and overlap the trunk -->
  <!-- edge: how-emerge -> analytic-gen -->
  <path d="M380,468 L380,554" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#tve-arrow-rust)"/>
  <!-- edge: how-travel -> analytic-gen -->
  <path d="M620,468 L620,554" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#tve-arrow-rust)"/>

  <!-- analytic-gen down to Part VI. The caption "constructs + mechanisms worth explaining" is an on-edge label
       sitting between the two boxes, so the source cannot run up into analytic-gen without crossing it: left
       straight + unannotated, head seated on the Part VI rim. -->
  <line x1="500" y1="650" x2="500" y2="690" stroke="#1c1917" stroke-width="2.2" marker-end="url(#tve-arrow-rust)"/>

  <!-- ===== NODES ===== -->
  <!-- left column header — ORIGINATING CASE (modeling-green) -->
  <rect id="originating-case" x="60" y="160" width="400" height="64" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="260" y="192" text-anchor="middle" font-size="19" font-weight="700" fill="#155c38">ORIGINATING CASE</text>
  <text x="260" y="214" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">DocAble</text>

  <!-- right column header — INDUSTRIAL RECONSTRUCTIONS (agent-blue) -->
  <rect id="industrial" x="540" y="160" width="400" height="64" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="740" y="192" text-anchor="middle" font-size="19" font-weight="700" fill="#2f5169">INDUSTRIAL RECONSTRUCTIONS</text>
  <text x="740" y="214" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">independent systems</text>

  <!-- question boxes -->
  <rect id="how-emerge" x="60" y="414" width="400" height="54" rx="8" fill="#fdfcf9" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="260" y="447" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">HOW DID IT EMERGE?</text>

  <rect id="how-travel" x="540" y="414" width="400" height="54" rx="8" fill="#fdfcf9" stroke="#2f5169" stroke-width="2.2"/>
  <text x="740" y="447" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">HOW FAR DOES IT TRAVEL?</text>

  <!-- ANALYTIC GENERALIZATION -->
  <rect id="analytic-gen" x="300" y="556" width="400" height="60" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.8"/>
  <text x="500" y="592" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3f12">ANALYTIC GENERALIZATION</text>

  <!-- PART VI destination -->
  <rect id="part-vi" x="260" y="692" width="480" height="64" rx="10" fill="#f3efe7" stroke="#1c1917" stroke-width="2.6"/>
  <text x="500" y="716" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="2" fill="#57534e">PART VI</text>
  <text x="500" y="740" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">A THEORY OF MAGE</text>

  <!-- ===== descriptive text on top of the edges ===== -->
  <!-- left bullets -->
  <g font-size="18" fill="#57534e" text-anchor="middle">
    <text x="260" y="268">high process depth</text>
    <text x="260" y="295">longitudinal history</text>
    <text x="260" y="322">incidents + responses</text>
    <text x="260" y="349">within-case recurrence</text>
  </g>

  <!-- right bullets -->
  <g font-size="18" fill="#57534e" text-anchor="middle">
    <text x="740" y="268">greater variation</text>
    <text x="740" y="295">selected mechanisms</text>
    <text x="740" y="322">different constraints</text>
    <text x="740" y="349">alternative realizations</text>
  </g>

  <text x="500" y="638" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">constructs + mechanisms worth explaining</text>

  <text x="500" y="792" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">Neither view supplies causal or population-level estimates.</text>
</svg>
