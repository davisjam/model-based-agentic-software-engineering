<svg xmlns="http://www.w3.org/2000/svg" width="430" height="218" viewBox="0 0 430 218" role="img" aria-labelledby="title desc" font-family="&quot;Source Sans 3&quot;, sans-serif">
<title id="title">Refuse a duplicate assignment on positive completed-phase evidence</title>
<desc id="desc">A work order names its project and phase. Composition resolves that identity against reconciled phase state. A positive DONE match without a valid explicit override refuses the brief; otherwise composition continues subject to its other checks. Missing or unresolved state does not establish completion. Reopening changes the phase to queued; an explicit override permits one dispatch and attempts a best-effort audit write. Dispatch repeats the completed-phase check.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="#1c1917"/></marker><marker id="arrowstart" markerWidth="6" markerHeight="6" refX="0.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M6,0 L0,3 L6,6 Z" fill="#1c1917"/></marker></defs>
<rect x="4" y="4" width="165" height="44" rx="3" fill="white" stroke="#1c1917" stroke-width="0.65"/>
<text x="86.5" y="22" text-anchor="middle" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">WORK ORDER</text>
<text x="86.5" y="39" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Project · phase</text>
<rect x="211" y="4" width="215" height="44" rx="3" fill="#f1f4f6" stroke="#2f5169" stroke-width="0.65"/>
<text x="318.5" y="20" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">RECONCILED PHASE STATE</text>
<text x="318.5" y="37" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Landing + phase identity</text>
<path d="M86.5,48 L86.5,63 L215,63 L215,82" fill="none" stroke="#1c1917" stroke-width="0.65"/>
<path d="M318.5,48 L318.5,63 L215,63 L215,82" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<rect x="75" y="82" width="280" height="42" rx="3" fill="white" stroke="#1c1917" stroke-width="0.65"/>
<text x="215" y="99" text-anchor="middle" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">COMPLETED-PHASE CHECK</text>
<text x="215" y="116" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Sidecar DONE; no valid explicit override</text>
<path d="M215,124 L215,139 L86.5,139 L86.5,158" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<path d="M215,139 L343.5,139 L343.5,158" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<text x="99" y="151" text-anchor="start" font-size="10" font-weight="400" font-style="italic" fill="#57534e">yes</text>
<text x="331" y="151" text-anchor="end" font-size="10" font-weight="400" font-style="italic" fill="#57534e">otherwise</text>
<rect x="4" y="158" width="165" height="40" rx="3" fill="white" stroke="#1c1917" stroke-width="0.65"/>
<text x="86.5" y="175" text-anchor="middle" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">REFUSE BRIEF</text>
<text x="86.5" y="191" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Show completion evidence</text>
<rect x="261" y="158" width="165" height="40" rx="3" fill="white" stroke="#086438" stroke-width="0.65"/>
<text x="343.5" y="175" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">CONTINUE COMPOSITION</text>
<text x="343.5" y="191" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Other checks still apply</text>
<text x="215" y="214" text-anchor="middle" font-size="10" font-weight="400" font-style="italic" fill="#57534e">Reopen to queued, or override one dispatch; audit write is best-effort.</text>
</svg>
