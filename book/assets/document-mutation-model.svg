<?xml version="1.0" encoding="UTF-8"?>
<!-- 2.2 Structural primary model (part2-content-revision-260814; folds to book/assets/).
     DocAble's document-mutation model: remediation logic operates THROUGH a structured document model
     (the sanctioned seam) which is realized THROUGH a format-specific implementation, down to the concrete
     formats. The model marks WHERE mutation is supposed to occur; it does not, by itself, prevent crossing
     the seam (Part III gives the declared relationship authority). Grammar: blue #2f5169 = the model + the
     seam it names; gray #57534e = the format-specific implementation and concrete formats (territory the
     model reduces). Hand-authored (a labeled vertical seam, not a flowchart). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 438" width="640" height="438"
     role="img" aria-labelledby="dmTitle dmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="dmTitle">DocAble's document-mutation model: mutation reaches formats through a sanctioned seam</title>
  <desc id="dmDesc">Remediation logic operates through a structured document model, the sanctioned seam.
    That model is realized through a format-specific implementation, which reaches the concrete formats
    DOCX, PPTX, XLSX, and PDF. The structured document model marks where mutation is supposed to occur; it
    does not by itself prevent code from bypassing the seam.</desc>

  <defs>
    <marker id="dm-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
    <marker id="dm-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
  </defs>

  <text x="320" y="28" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.2" fill="#2f5169">DOCUMENT-MUTATION MODEL</text>

  <!-- remediation logic (blue) -->
  <rect id="remediation" x="185" y="44" width="270" height="52" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="320" y="76" text-anchor="middle" font-size="16.64" font-weight="700" fill="#2f5169">remediation logic</text>
  <!-- edge: remediation -> model -->
  <line x1="320" y1="96" x2="320" y2="132" stroke="#2f5169" stroke-width="2.2" marker-end="url(#dm-b)"/>
  <text x="332" y="119" font-size="14" font-style="italic" fill="#57534e">operates through</text>

  <!-- structured document model = the seam (blue, emphasized) -->
  <rect id="model" x="160" y="134" width="320" height="62" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="3"/>
  <text x="320" y="162" text-anchor="middle" font-size="16.64" font-weight="700" fill="#2f5169">structured document model</text>
  <text x="320" y="183" text-anchor="middle" font-size="14" font-style="italic" fill="#2f5169">the sanctioned seam</text>
  <!-- edge: model -> impl -->
  <line x1="320" y1="196" x2="320" y2="232" stroke="#2f5169" stroke-width="2.2" marker-end="url(#dm-b)"/>
  <text x="332" y="219" font-size="14" font-style="italic" fill="#57534e">realized through</text>

  <!-- format-specific implementation (gray) -->
  <rect id="impl" x="180" y="234" width="280" height="52" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="320" y="266" text-anchor="middle" font-size="17" fill="#1c1917">format-specific implementation</text>
  <!-- impl fans to each concrete format: one path per branch, all sharing the trunk origin (320,286) so it
       still reads as one drop that splits, while every edge terminates on its own named format node. -->
  <g fill="none" stroke="#57534e" stroke-width="2">
    <!-- edge: impl -> docx -->
    <path d="M200,286 L200,318" marker-end="url(#dm-k)"/>
    <!-- edge: impl -> pptx -->
    <path d="M280,286 L280,318" marker-end="url(#dm-k)"/>
    <!-- edge: impl -> xlsx -->
    <path d="M390,286 L390,318" marker-end="url(#dm-k)"/>
    <!-- edge: impl -> pdf -->
    <path d="M320,286 C383,296.9 500,287 500,317" marker-end="url(#dm-k)"/>
  </g>

  <!-- formats row (gray) -->
  <g fill="#f6f4ef" stroke="#57534e" stroke-width="2">
    <rect id="docx" x="120" y="320" width="100" height="44" rx="9"/>
    <rect id="pptx" x="230" y="320" width="100" height="44" rx="9"/>
    <rect id="xlsx" x="340" y="320" width="100" height="44" rx="9"/>
    <rect id="pdf" x="450" y="320" width="100" height="44" rx="9"/>
  </g>
  <text x="170" y="348" text-anchor="middle" font-size="16" fill="#1c1917">DOCX</text>
  <text x="280" y="348" text-anchor="middle" font-size="16" fill="#1c1917">PPTX</text>
  <text x="390" y="348" text-anchor="middle" font-size="16" fill="#1c1917">XLSX</text>
  <text x="500" y="348" text-anchor="middle" font-size="16" fill="#1c1917">PDF</text>

  <!-- footer: protect the point (model, not yet constraint). Enforcement microtext removed — the caption carries it. -->
  <text x="320" y="410" text-anchor="middle" font-size="15.5" font-style="italic" fill="#1c1917">The model marks where mutation is supposed to occur.</text>
</svg>
