<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247.5 235" width="247.5" height="235" role="img" aria-labelledby="dmTitle dmDesc" font-family="&quot;Source Sans 3&quot;, sans-serif"><ns0:title xmlns:ns0="http://www.w3.org/2000/svg" id="dmTitle">DocAble's document-mutation model: mutation reaches formats through a sanctioned seam</ns0:title>
  <ns0:desc xmlns:ns0="http://www.w3.org/2000/svg" id="dmDesc">Remediation logic operates through a structured document model, the sanctioned seam.
    That model is implemented by a format-specific implementation, which reaches the concrete formats
    DOCX, PPTX, XLSX, and PDF. The structured document model marks where mutation is supposed to occur; it
    does not by itself prevent code from bypassing the seam.</ns0:desc>

  <defs><marker id="a2f5169" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#2f5169"/></marker><marker id="a57534e" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#57534e"/></marker><marker id="a086438" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#086438"/></marker><marker id="a1c1917" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#1c1917"/></marker></defs>
