<rect x="174" y="180" width="108" height="62" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="228" y="194" text-anchor="middle" style="font-size:11.2px;font-weight:bold;">Worker</text>
<text x="228" y="207" text-anchor="middle" style="font-size:10.4px;">Pages 11–20</text>
