<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: interlude-execution-unit). Two stacked panels showing the first change to
     DocAble's execution unit: (a) whole-document execution in one long-running worker; (b) page-chunked
     execution across smaller workers. viewBox width 920 so labels normalize into the figure font band. -->
<!-- semantic-families: neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="920" height="370" role="group" aria-labelledby="euTitle euDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="euTitle">The first change reduced the unit of residency</title>
  <desc id="euDesc">Two panels. (a) Whole-document execution: a document enters one long-running Kubernetes
    worker that holds the full document state and its media resident in memory, sources GenAI requests from
    that memory, and emits the output. (b) Page-chunked execution: the document is split into page-range
    partitions, each handled by a smaller worker holding only its range; the results are recombined into the
    output. Chunking lowers per-worker memory without changing how document media is represented.</desc>
<!-- Print refinement: retain the source geometry semantics and text; reflow labels at 450 bp publication width. -->
<defs>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/></marker>
<marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/></marker>
</defs>
<rect x="0" y="0" width="920" height="370" rx="0" fill="#fdfcf9" stroke="#fdfcf9" stroke-width="0"/>
<text x="24" y="28" font-size="23" text-anchor="start" fill="#57534e" font-weight="700">(a) Whole-document execution</text>
<rect x="24" y="66" width="145" height="54" rx="7" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
<text x="96.5" y="99.6" font-size="20" text-anchor="middle" fill="#1c1917">document</text>
<line x1="169" y1="93" x2="207" y2="93" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow-ink)"/>
<rect x="207" y="44" width="467" height="128" rx="7" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
<text x="440.5" y="71" font-size="22" text-anchor="middle" fill="#1c1917" font-weight="700">long-running Kubernetes worker</text>
<text x="228" y="101" font-size="20" text-anchor="start" fill="#1c1917">• full document state resident in memory</text>
<text x="228" y="128" font-size="20" text-anchor="start" fill="#1c1917">• media resident from that state</text>
<text x="228" y="155" font-size="20" text-anchor="start" fill="#1c1917">• GenAI request sourced from worker memory</text>
<line x1="674" y1="108" x2="712" y2="108" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow-ink)"/>
<rect x="712" y="81" width="170" height="54" rx="7" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
<text x="797.0" y="114.6" font-size="20" text-anchor="middle" fill="#1c1917">output</text>
<text x="24" y="214" font-size="23" text-anchor="start" fill="#57534e" font-weight="700">(b) Page-chunked execution</text>
<rect x="24" y="265" width="140" height="54" rx="7" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
<text x="94.0" y="298.6" font-size="20" text-anchor="middle" fill="#1c1917">document</text>
<line x1="164" y1="292" x2="202" y2="292" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow-ink)"/>
<rect x="202" y="235" width="246" height="35" rx="7" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="325.0" y="259.1" font-size="20" text-anchor="middle" fill="#1c1917">pages 1–10 → worker</text>
<rect x="202" y="274" width="246" height="35" rx="7" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="325.0" y="298.1" font-size="20" text-anchor="middle" fill="#1c1917">pages 11–20 → worker</text>
<rect x="202" y="313" width="246" height="35" rx="7" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="325.0" y="337.1" font-size="20" text-anchor="middle" fill="#1c1917">pages 21–30 → worker</text>
<line x1="448" y1="292" x2="488" y2="292" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow-ink)"/>
<rect x="488" y="265" width="124" height="54" rx="7" fill="#f3efe7" stroke="#57534e" stroke-width="2"/>
<text x="550.0" y="298.6" font-size="20" text-anchor="middle" fill="#1c1917">merge</text>
<line x1="612" y1="292" x2="652" y2="292" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow-ink)"/>
<rect x="652" y="265" width="140" height="54" rx="7" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
<text x="722.0" y="298.6" font-size="20" text-anchor="middle" fill="#1c1917">output</text>
<text x="490" y="347" font-size="20" text-anchor="start" fill="#57534e" font-style="italic">each worker holds less document state</text>
</svg>
