<path d="M282,211 L291,211" fill="none" stroke="#222" stroke-width=".8"/>
<rect x="174" y="254" width="108" height="62" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="228" y="268" text-anchor="middle" style="font-size:11.2px;font-weight:bold;">Worker</text>
<text x="228" y="281" text-anchor="middle" style="font-size:10.4px;">Pages 21–30</text>
<rect x="179" y="288" width="53" height="22" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="205.5" y="302.4" text-anchor="middle" style="font-size:10.4px;">Structure</text>
