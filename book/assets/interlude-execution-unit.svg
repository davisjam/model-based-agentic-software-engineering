<text x="222" y="18" text-anchor="middle" style="font-size:11.2px;font-weight:bold;">(b) Page-chunked</text>
<text x="222" y="32" text-anchor="middle" style="font-size:11.2px;font-weight:bold;">execution</text>
<rect x="301" y="1" width="142" height="534" rx="4" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<rect x="302" y="2" width="140" height="42" rx="2" fill="#f5f5f5" stroke="none" stroke-width=".65"/>
<rect x="302" y="408" width="140" height="126" rx="2" fill="#f7f7f7" stroke="none" stroke-width=".65"/>
<text x="372" y="18" text-anchor="middle" style="font-size:11.2px;font-weight:bold;">(c) Skeletonized</text>
<text x="372" y="32" text-anchor="middle" style="font-size:11.2px;font-weight:bold;">execution</text>
