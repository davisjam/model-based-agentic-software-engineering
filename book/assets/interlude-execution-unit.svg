<svg xmlns="http://www.w3.org/2000/svg" width="444" height="218" viewBox="0 0 444 218" role="img" aria-labelledby="title desc">
<title id="title">Three approaches to document residency</title>
<desc id="desc">Whole-document workers retain structure and all media. Page workers retain a portion of both. Skeletonized workers retain structure and references while media resides outside their memory.</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="black"/></marker></defs>
<text x="74" y="16.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="11.2" font-weight="700" font-style="normal">(a) Whole document</text>
<text x="222" y="16.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="11.2" font-weight="700" font-style="normal">(b) Page chunks</text>
<text x="370" y="16.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="11.2" font-weight="700" font-style="normal">(c) Skeletonization</text>
