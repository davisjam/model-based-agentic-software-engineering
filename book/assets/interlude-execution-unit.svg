<rect x="192" y="379" width="62" height="24" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="223.0" y="394.4" text-anchor="middle" style="font-size:10.4px;">Output</text>
<rect x="338" y="69" width="68" height="26" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="372.0" y="85.4" text-anchor="middle" style="font-size:10.4px;">Document</text>
<path d="M372,95 L372,139" fill="none" stroke="#222" stroke-width=".8" marker-end="url(#arrow)"/>
<rect x="319" y="140" width="106" height="113" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="372" y="158" text-anchor="middle" style="font-size:11.2px;font-weight:bold;">Worker</text>
<text x="372" y="172" text-anchor="middle" style="font-size:10.4px;">(skeletonized)</text>
<rect x="326" y="182" width="92" height="25" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="372.0" y="197.9" text-anchor="middle" style="font-size:10.4px;">Structure</text>
<rect x="326" y="219" width="92" height="25" rx="3" fill="#d1d1d1" stroke="#444" stroke-width=".65"/>
<text x="372.0" y="234.9" text-anchor="middle" style="font-size:10.4px;">Media references</text>
<rect x="307" y="321" width="66" height="43" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="340.0" y="339.9" text-anchor="middle" style="font-size:10.4px;">GenAI</text>
<text x="340.0" y="351.9" text-anchor="middle" style="font-size:10.4px;">service</text>
<rect x="383" y="321" width="53" height="43" rx="3" fill="#d1d1d1" stroke="#444" stroke-width=".65"/>
<text x="409.5" y="339.9" text-anchor="middle" style="font-size:10.4px;">External</text>
<text x="409.5" y="351.9" text-anchor="middle" style="font-size:10.4px;">media</text>
<path d="M340,253 L340,321" fill="none" stroke="#222" stroke-width=".8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M416,253 L416,321" fill="none" stroke="#222" stroke-width=".8" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<path d="M397,321 L397,253" fill="none" stroke="#222" stroke-width=".8" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<text x="8" y="424" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="18" y="424" text-anchor="start" style="font-size:10.2px;">One worker retains the</text>
<text x="18" y="436" text-anchor="start" style="font-size:10.2px;">complete document.</text>
<text x="8" y="453" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="18" y="453" text-anchor="start" style="font-size:10.2px;">Structure and all media</text>
<text x="18" y="465" text-anchor="start" style="font-size:10.2px;">are resident.</text>
<text x="8" y="482" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="18" y="482" text-anchor="start" style="font-size:10.2px;">Memory scales with the</text>
<text x="18" y="494" text-anchor="start" style="font-size:10.2px;">document payload.</text>
<text x="158" y="420" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="168" y="420" text-anchor="start" style="font-size:10.2px;">The document is</text>
<text x="168" y="432" text-anchor="start" style="font-size:10.2px;">partitioned into page</text>
<text x="168" y="444" text-anchor="start" style="font-size:10.2px;">chunks.</text>
<text x="158" y="461" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="168" y="461" text-anchor="start" style="font-size:10.2px;">Each worker retains</text>
<text x="168" y="473" text-anchor="start" style="font-size:10.2px;">the chunk’s structure</text>
<text x="168" y="485" text-anchor="start" style="font-size:10.2px;">and media.</text>
<text x="158" y="502" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="168" y="502" text-anchor="start" style="font-size:10.2px;">A smaller working set</text>
<text x="168" y="514" text-anchor="start" style="font-size:10.2px;">per worker reduces</text>
<text x="168" y="526" text-anchor="start" style="font-size:10.2px;">memory.</text>
<text x="308" y="424" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="318" y="424" text-anchor="start" style="font-size:10.2px;">The worker retains</text>
<text x="318" y="436" text-anchor="start" style="font-size:10.2px;">structure and media</text>
<text x="318" y="448" text-anchor="start" style="font-size:10.2px;">references.</text>
<text x="308" y="465" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="318" y="465" text-anchor="start" style="font-size:10.2px;">Media is not resident,</text>
<text x="318" y="477" text-anchor="start" style="font-size:10.2px;">but streamed on demand.</text>
<text x="308" y="494" text-anchor="start" style="font-size:10.4px;">•</text>
<text x="318" y="494" text-anchor="start" style="font-size:10.2px;">Media is processed by a</text>
<text x="318" y="506" text-anchor="start" style="font-size:10.2px;">GenAI service.</text></svg>
