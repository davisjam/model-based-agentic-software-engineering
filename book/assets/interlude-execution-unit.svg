<text x="72.0" y="200.9" text-anchor="middle" style="font-size:10.4px;">Structure</text>
<rect x="26" y="223" width="92" height="42" rx="3" fill="#d1d1d1" stroke="#444" stroke-width=".65"/>
<text x="72.0" y="241.4" text-anchor="middle" style="font-size:10.4px;">Media</text>
<text x="72.0" y="253.4" text-anchor="middle" style="font-size:10.4px;">(all resident)</text>
<path d="M72,279 L72,349" fill="none" stroke="#222" stroke-width=".8" marker-end="url(#arrow)"/>
<rect x="38" y="350" width="68" height="26" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="72.0" y="366.4" text-anchor="middle" style="font-size:10.4px;">Output</text>
<rect x="190" y="65" width="66" height="26" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="223.0" y="81.4" text-anchor="middle" style="font-size:10.4px;">Document</text>
<path d="M223,91 L223,104 L163,104 L163,297" fill="none" stroke="#222" stroke-width=".8"/>
<rect x="174" y="118" width="108" height="62" rx="3" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<text x="228" y="132" text-anchor="middle" style="font-size:11.2px;font-weight:bold;">Worker</text>
<text x="228" y="145" text-anchor="middle" style="font-size:10.4px;">Pages 1–10</text>
