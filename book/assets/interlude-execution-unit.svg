<svg xmlns="http://www.w3.org/2000/svg" width="1332" height="1644" viewBox="0 0 444 548" role="img" aria-labelledby="title desc"><title id="title">Evolution of DocAble’s document working set</title><desc id="desc">Three equal panels: whole-document execution, page-chunked execution, and skeletonized execution. Chunking partitions execution; skeletonization separates resident structure from externally stored media. Media access and the GenAI connection are distinct.</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.6" refY="2.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="#222"/></marker></defs><rect width="444" height="548" fill="white"/><style>text{font-family:'Source Sans 3','Arial',sans-serif;fill:#171717;}path,rect{stroke-linejoin:round;}</style>
<rect x="1" y="1" width="142" height="546" rx="4" fill="#ffffff" stroke="#444" stroke-width=".65"/>
<rect x="2" y="2" width="140" height="42" rx="2" fill="#f5f5f5" stroke="none" stroke-width=".65"/>
<rect x="2" y="420" width="140" height="126" rx="2" fill="#f7f7f7" stroke="none" stroke-width=".65"/>
<text x="72" y="18" text-anchor="middle" style="font-size:11.2px;font-weight:bold;">(a) Whole-document</text>
<text x="72" y="32" text-anchor="middle" style="font-size:11.2px;font-weight:bold;">execution</text>
<rect x="151" y="1" width="142" height="546" rx="4" fill="#ffffff" stroke="#444" stroke-width=".65"/>
