<?xml version="1.0" encoding="UTF-8"?>
<!-- Fig 2.1-X (folds to book/assets/question-to-authority-progression.svg). "From engineering question to
     authority." A vertical spine: the engineering question, then the representation move (blue = modelling),
     which forks by the representation chosen; the branches RE-CONVERGE on a single choice — pick an analysis
     appropriate to the property (the specific techniques are examples in secondary text, NOT prescribed by the
     representation) — then interpret the evidence, then decide what deserves authority (green = outcome), which
     hands off to Alignment (Part 3).
       engineering question -> choose the representation (blue)
            closed state / action space | finite transition system | temporal behavior
       -> choose an analysis appropriate to the property (examples: constraint solving, state exploration,
          model checking, simulation, static analysis, ...)
       -> interpret the evidence -> decide what deserves authority (green) -> Alignment (Part 3)
     Grayscale-survivable: every node labelled; the spine carries the meaning; hue only reinforces
     representation (blue) vs analysis/evidence (gray) vs authority (green). Boxes first, labels last. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 652" width="1000" height="652"
     role="img" aria-labelledby="qapTitle qapDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="qapTitle">From engineering question to authority</title>
  <desc id="qapDesc">A vertical progression. An engineering question leads to choosing a representation. The
    representation may be a closed state or action space, a finite transition system, or temporal behavior.
    The branches re-converge on a single step: choose an analysis appropriate to the property — with
    constraint solving, state exploration, model checking, simulation, and static analysis as examples, none
    prescribed by the representation alone. The path then interprets the evidence and decides what deserves
    authority, which hands off to Alignment in Part 3. The general competence is turning a consequential
    question into a representation and evidence that machines can help carry, not any one tool.</desc>

  <defs>
    <marker id="qap-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- ===== boxes (drawn first) ===== -->
  <rect x="0" y="0" width="1000" height="652" fill="#fdfcf9"/>

  <!-- question (gray) -->
  <rect id="question" x="340" y="26" width="320" height="52" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>

  <!-- choose the representation (blue) -->
  <rect id="choose-representation" x="330" y="110" width="340" height="52" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.8"/>

  <!-- representation boxes (blue) -->
  <rect id="rep-closed" x="45" y="210" width="280" height="66" rx="9" fill="#eef2f6" stroke="#2f5169" stroke-width="2.2"/>
  <rect id="rep-finite" x="360" y="210" width="280" height="66" rx="9" fill="#eef2f6" stroke="#2f5169" stroke-width="2.2"/>
  <rect id="rep-temporal" x="675" y="210" width="280" height="66" rx="9" fill="#eef2f6" stroke="#2f5169" stroke-width="2.2"/>

  <!-- choose an analysis (gray) — the representations re-converge here; techniques are examples, not prescribed -->
  <rect id="analysis" x="170" y="326" width="660" height="84" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>

  <!-- interpret the evidence (gray) -->
  <rect id="interpret" x="330" y="452" width="340" height="52" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>

  <!-- decide authority (green) -->
  <rect id="authority" x="310" y="544" width="380" height="58" rx="12" fill="#e3f0e7" stroke="#155c38" stroke-width="3"/>

  <!-- ===== arrows ===== -->
  <!-- edge: question -> choose-representation -->
  <line x1="500" y1="78" x2="500" y2="108" stroke="#1c1917" stroke-width="2" marker-end="url(#qap-k)"/>

  <!-- edge: choose-representation -> rep-closed -->
  <path d="M346,162 L346,186 L309,186 L309,208" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#qap-k)"/>
  <!-- edge: choose-representation -> rep-finite -->
  <path d="M500,162 L500,208" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#qap-k)"/>
  <!-- edge: choose-representation -> rep-temporal -->
  <path d="M654,162 L654,186 L691,186 L691,208" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#qap-k)"/>

  <!-- edge: rep-closed -> analysis -->
  <path d="M185,276 L185,303 L380,303 L380,324" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#qap-k)"/>
  <!-- edge: rep-finite -> analysis -->
  <line x1="500" y1="276" x2="500" y2="324" stroke="#1c1917" stroke-width="2" marker-end="url(#qap-k)"/>
  <!-- edge: rep-temporal -> analysis -->
  <path d="M815,276 L815,303 L620,303 L620,324" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#qap-k)"/>

  <!-- edge: analysis -> interpret -->
  <line x1="500" y1="410" x2="500" y2="450" stroke="#1c1917" stroke-width="2" marker-end="url(#qap-k)"/>

  <!-- edge: interpret -> authority -->
  <line x1="500" y1="504" x2="500" y2="542" stroke="#1c1917" stroke-width="2" marker-end="url(#qap-k)"/>

  <!-- ===== labels (drawn last, on top) ===== -->
  <text x="500" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">engineering question</text>
  <text x="500" y="142" text-anchor="middle" font-size="20" font-weight="700" fill="#2f5169">choose the representation</text>

  <text x="185" y="240" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">closed state /</text>
  <text x="185" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">action space</text>
  <text x="500" y="240" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">finite transition</text>
  <text x="500" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">system</text>
  <text x="815" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">temporal behavior</text>

  <text x="500" y="362" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">choose an analysis appropriate to the property</text>
  <text x="500" y="391" text-anchor="middle" font-size="14" fill="#57534e">constraint solving · state exploration · model checking · simulation · static analysis · …</text>

  <text x="500" y="484" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">interpret the evidence</text>
  <text x="500" y="579" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">decide what deserves authority</text>
  <text x="500" y="632" text-anchor="middle" font-size="16" font-style="italic" fill="#155c38">→ Alignment (Part 3)</text>
</svg>
