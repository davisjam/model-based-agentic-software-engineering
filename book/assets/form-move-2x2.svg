<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600"
     role="img" aria-labelledby="fmTitle fmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="fmTitle">Two independent axes: form (soft or hard) crossed with move (constraint or sensor)</title>
  <desc id="fmDesc">A two-by-two matrix. The columns are the move: a constraint, which prevents the
    mistake, and a sensor, which detects it. The rows are the form: soft, which only aims a reasoner,
    and hard, which holds a line deterministically. The four cells each carry one worked example. Soft
    constraint: a structured model that aims. Hard constraint: an enum the compiler enforces. Soft
    sensor: a convention that reminds. Hard sensor: a lint that blocks. Form and move are independent —
    a mechanism picks one value on each axis — so any move can be built soft or hard.</desc>

  
  <text x="450" y="46" text-anchor="middle" font-size="23.4" font-weight="700" fill="#1c1917">Form and move are two independent axes</text>

  
  <text x="405" y="128" text-anchor="middle" font-size="23" font-weight="700" fill="#2f5169">Constraint</text>
  <text x="405" y="152" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">prevents the mistake</text>
  <text x="700" y="128" text-anchor="middle" font-size="23" font-weight="700" fill="#2f5169">Sensor</text>
  <text x="700" y="152" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">catches it after</text>

  
  <text x="552" y="98" text-anchor="middle" font-size="16.2" font-weight="700" fill="#1c1917">move →</text>

  
  
  <text x="128" y="278" text-anchor="middle" font-size="23" font-weight="700" fill="#2f5169">Soft</text>
  <text x="128" y="302" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">aims a reasoner</text>
  
  <text x="128" y="478" text-anchor="middle" font-size="23" font-weight="700" fill="#2f5169">Hard</text>
  <text x="128" y="502" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">holds a line</text>
  
  <text x="128" y="192" text-anchor="middle" font-size="16.2" font-weight="700" fill="#1c1917">↓ form</text>

  
  
  <g fill="#f6f4ef" stroke="#2f5169" stroke-width="2">
    <rect x="258" y="180" width="294" height="196" rx="8"/>
    <rect x="558" y="180" width="294" height="196" rx="8"/>
  </g>
  
  <g fill="#e7edf3" stroke="#2f5169" stroke-width="2">
    <rect x="258" y="392" width="294" height="196" rx="8"/>
    <rect x="558" y="392" width="294" height="196" rx="8"/>
  </g>

  
  <text x="405" y="222" text-anchor="middle" font-size="16.2" font-weight="700" fill="#57534e">soft constraint</text>
  <text x="405" y="292" text-anchor="middle" font-size="21" fill="#1c1917">a structured model</text>
  <text x="405" y="320" text-anchor="middle" font-size="21" fill="#1c1917">that aims</text>

  
  <text x="705" y="222" text-anchor="middle" font-size="16.2" font-weight="700" fill="#57534e">soft sensor</text>
  <text x="705" y="292" text-anchor="middle" font-size="21" fill="#1c1917">a convention</text>
  <text x="705" y="320" text-anchor="middle" font-size="21" fill="#1c1917">that reminds</text>

  
  <text x="405" y="434" text-anchor="middle" font-size="16.2" font-weight="700" fill="#57534e">hard constraint</text>
  <text x="405" y="504" text-anchor="middle" font-size="21" fill="#1c1917">an enum the</text>
  <text x="405" y="532" text-anchor="middle" font-size="21" fill="#1c1917">compiler enforces</text>

  
  <text x="705" y="434" text-anchor="middle" font-size="16.2" font-weight="700" fill="#57534e">hard sensor</text>
  <text x="705" y="518" text-anchor="middle" font-size="21" fill="#1c1917">a lint that blocks</text>
</svg>
