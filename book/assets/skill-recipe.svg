<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: skill-recipe). R45d CONSOLIDATED architecture figure for 4.5 "Packaging
     the Method as Skills": the single skill skeleton, plus a legend row folding in the three-skills
     complement view (harden / run / explain) so ONE figure carries the architecture. Replaces the former
     competing pair (three-skills.svg + skill-recipe.svg); three-skills.svg is orphaned. Palette: Umber
     Monograph tokens (accent #9a3f12 base model, fleet #2f5169 orthogonal models, governed #1f7a4d the
     working skill). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560"
     role="group" aria-labelledby="srTitle srDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="srTitle">The skill skeleton, and the three skills that instantiate it</title>
  <desc id="srDesc">A fundamental model of the domain sits at the left. Several orthogonal facets layer on top
    of it, each cutting the domain along an independent concern. All of them feed a SKILL.md governing
    principle that ties the facets together and tells the agent when to reach for which — and that, over its
    facets, is a working skill. The three shipped skills are three instances of this one skeleton:
    self-governance engineers the environment, self-operate runs its lifecycles, and self-communicate
    governs technical communication.</desc>

  <defs>
    <marker id="sr-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- ===== the base model (cylinder) ===== -->
  <g>
    <path d="M 40,145 v 90 a 125,13 0 0 0 250,0 v -90" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <ellipse cx="165" cy="145" rx="125" ry="13" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <text x="165" y="192" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">fundamental model</text>
    <text x="165" y="220" text-anchor="middle" font-size="18.88" fill="#57534e">of the domain</text>
  </g>

  <!-- base -> the orthogonal models (fan out) -->
  <g stroke="#1c1917" stroke-width="2" fill="none">
    <path d="M294,160 C360,130 390,110 444,88" marker-end="url(#sr-ah)"/>
    <line x1="294" y1="192" x2="444" y2="192" marker-end="url(#sr-ah)"/>
    <path d="M294,224 C360,254 390,274 444,296" marker-end="url(#sr-ah)"/>
  </g>

  <!-- ===== the orthogonal models ===== -->
  <g>
    <rect id="facet-top" x="450" y="30" width="250" height="58" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="575" y="67" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">orthogonal facet</text>

    <rect id="facet-mid" x="450" y="163" width="250" height="58" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="575" y="200" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">orthogonal facet</text>

    <rect id="facet-bot" x="450" y="296" width="250" height="58" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="575" y="333" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">orthogonal facet</text>
  </g>

  <!-- orthogonal models -> SKILL.md (fan in); src ends seated on each facet's right border -->
  <g stroke="#1c1917" stroke-width="2" fill="none">
    <!-- edge: facet-top -> skill-md -->
    <path d="M700,72 C770,100 824,146 854,146" marker-end="url(#sr-ah)"/>
    <!-- edge: facet-mid -> skill-md -->
    <line x1="700" y1="192" x2="854" y2="192" marker-end="url(#sr-ah)"/>
    <!-- edge: facet-bot -> skill-md -->
    <path d="M700,312 C770,284 824,238 854,238" marker-end="url(#sr-ah)"/>
  </g>

  <!-- ===== SKILL.md: the principles ===== -->
  <rect id="skill-md" x="860" y="126" width="250" height="132" rx="10" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
  <text x="985" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">SKILL.md</text>
  <text x="985" y="196" text-anchor="middle" font-size="18.88" fill="#57534e">the governing principle</text>
  <text x="985" y="220" text-anchor="middle" font-size="18.88" fill="#57534e">that ties them together</text>

  <!-- SKILL.md over its models -> a working skill -->
  <!-- edge: skill-md -> working-skill -->
  <line x1="985" y1="256" x2="985" y2="324" stroke="#1c1917" stroke-width="2" marker-end="url(#sr-ah)"/>

  <rect id="working-skill" x="870" y="330" width="230" height="60" rx="30" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="985" y="368" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">a working skill</text>

  <!-- ===== divider ===== -->
  <line x1="40" y1="430" x2="1110" y2="430" stroke="#e4e0d8" stroke-width="2"/>
  <text x="40" y="462" font-size="18.88" font-style="italic" fill="#57534e">Three instances of one skeleton:</text>

  <!-- ===== the three shipped skills as instances ===== -->
  <g>
    <rect x="40" y="482" width="330" height="58" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
    <text x="205" y="509" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">self-governance</text>
    <text x="205" y="530" text-anchor="middle" font-size="16" fill="#57534e">engineer the environment</text>

    <rect x="410" y="482" width="330" height="58" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="575" y="509" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">self-operate</text>
    <text x="575" y="530" text-anchor="middle" font-size="16" fill="#57534e">operate the lifecycles</text>

    <rect x="780" y="482" width="330" height="58" rx="8" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
    <text x="945" y="509" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">self-communicate</text>
    <text x="945" y="530" text-anchor="middle" font-size="16" fill="#57534e">govern technical communication</text>
  </g>
</svg>
