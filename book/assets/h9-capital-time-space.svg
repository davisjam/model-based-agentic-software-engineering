<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h9-capital-time-space.svg. Fold to book/assets/. -->
<!-- GRAPH INVARIANT (verified by book-models/lint_figure_dangling_edge.py):
     * Every edge carries an "edge: SRC -> DST" comment (".." for dotted).
     * NODES carry id="..." (lifecycle circles + the Engineering-Models / concern boxes).
     * CONNECT GRAMMAR: edges are drawn UNDERNEATH the nodes, and every endpoint runs to the
       node CENTER; the node's opaque fill paints over the line end, so each edge PLUGS into its
       node with no floating gap at any angle. In a busy figure a line must not float offset from
       its node. (Simple figures may opt into a looser rim-touch grammar with an
       "edge-grammar: float-ok" marker comment; this figure uses the strict connect-inside default.) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 940" width="980" height="940"
     role="img" aria-labelledby="h9Title h9Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h9Title">Engineering capital across time and space</title>
  <desc id="h9Desc">A conceptual snapshot of three products shaped by successive engineering episodes. Each
    product is a softly bounded gray field holding a partial constellation of lifecycle surfaces around a central
    engineering-models node. Every relationship runs to the center of a named node so it plugs in cleanly: solid
    gray lines are established internal relationships, dotted gray lines are emerging or possible ones, and
    unconnected nodes are local. Three cross-product concerns connect to named nodes: an assurance obligation to
    Product 1 Assurance, Product 2 Engineering Models, and Product 3 Evidence; a code-quality mechanism to the
    Engineering Models of Products 1 and 2; and a security posture, dotted, to the Engineering Models of all three.
    No arrowheads, axes, or scale.</desc>

  <rect x="0" y="0" width="980" height="940" fill="#fdfcf9"/>

  <!-- ===== BACKGROUND LAYER: soft gray "galaxy" fields + product labels (behind everything) ===== -->
  <ellipse cx="490" cy="208" rx="280" ry="168" fill="#f3efe7"/>
  <ellipse cx="238" cy="652" rx="208" ry="196" fill="#f3efe7"/>
  <ellipse cx="744" cy="652" rx="254" ry="168" fill="#f3efe7"/>
  <g text-anchor="middle" font-size="35" font-weight="700" letter-spacing="0.04em" fill="#57534e" opacity="0.8">
    <text x="490" y="48">PRODUCT 1</text><text x="238" y="452">PRODUCT 2</text><text x="744" y="452">PRODUCT 3</text>
  </g>

  <!-- ===== EDGE LAYER: drawn UNDER the nodes; every endpoint is a node center (connect grammar) ===== -->
  <!-- solid gray internal relationships -->
  <g stroke="#57534e" fill="none" stroke-width="1.6">
    <!-- edge: p1-discovery -> p1-eng -->
    <line x1="490" y1="114" x2="490" y2="208"/>
    <!-- edge: p1-assurance -> p1-eng -->
    <line x1="356" y1="176" x2="490" y2="208"/>
    <!-- edge: p1-eng -> p1-maintenance -->
    <line x1="490" y1="208" x2="634" y2="198"/>
    <!-- edge: p1-eng -> p1-operations -->
    <line x1="490" y1="208" x2="498" y2="304"/>
    <!-- edge: p1-maintenance -> p1-operations -->
    <path d="M634,198 C672,244 588,296 498,304"/>
    <!-- edge: p2-eng -> p2-maintenance -->
    <line x1="238" y1="652" x2="382" y2="646"/>
    <!-- edge: p2-eng -> p2-operations -->
    <line x1="238" y1="652" x2="238" y2="752"/>
    <!-- edge: p2-maintenance -> p2-operations -->
    <path d="M382,646 C404,712 322,744 238,752"/>
    <!-- edge: p2-incident -> p2-operations -->
    <line x1="188" y1="764" x2="238" y2="752"/>
    <!-- edge: p3-assurance -> p3-evidence -->
    <line x1="612" y1="600" x2="694" y2="672"/>
    <!-- edge: p3-evidence -> p3-eng -->
    <line x1="694" y1="672" x2="796" y2="652"/>
  </g>
  <!-- dotted gray emerging / possible relationships -->
  <g stroke="#57534e" fill="none" stroke-width="1.6" stroke-dasharray="2 4">
    <!-- edge: p1-assurance .. p1-discovery -->
    <path d="M356,176 C408,148 452,126 490,114"/>
    <!-- edge: p2-discovery .. p2-eng -->
    <line x1="238" y1="548" x2="238" y2="652"/>
    <!-- edge: p3-discovery .. p3-eng -->
    <line x1="768" y1="582" x2="796" y2="652"/>
  </g>
  <!-- solid rust cross-product concerns -->
  <g stroke="#9a3f12" fill="none" stroke-width="1.9">
    <!-- edge: code-quality -> p1-eng -->
    <path d="M150,375 C300,340 380,250 490,208"/>
    <!-- edge: code-quality -> p2-eng -->
    <path d="M150,375 C170,480 210,600 238,652"/>
    <!-- edge: assurance-obligation -> p1-assurance -->
    <path d="M500,447 C450,340 392,232 356,176"/>
    <!-- edge: assurance-obligation -> p2-eng -->
    <path d="M500,447 C420,540 300,620 238,652"/>
    <!-- edge: assurance-obligation -> p3-evidence -->
    <path d="M500,447 C580,540 640,620 694,672"/>
  </g>
  <!-- dotted rust security posture (swoops are intentional here) -->
  <g stroke="#9a3f12" fill="none" stroke-width="1.7" stroke-dasharray="2 5">
    <!-- edge: security-posture .. p1-eng -->
    <path d="M500,823 C440,650 300,470 490,208"/>
    <!-- edge: security-posture .. p2-eng -->
    <path d="M500,823 C400,782 300,704 238,652"/>
    <!-- edge: security-posture .. p3-eng -->
    <path d="M500,823 C620,790 722,702 796,652"/>
  </g>

  <!-- ===== NODE LAYER: drawn ON TOP so opaque fills cap the edge ends ===== -->
  <!-- lifecycle circles -->
  <g fill="#fdfcf9" stroke="#57534e" stroke-width="1.6">
    <circle id="p1-discovery"   cx="490" cy="114" r="7"/>
    <circle id="p1-assurance"   cx="356" cy="176" r="7"/>
    <circle id="p1-maintenance" cx="634" cy="198" r="7"/>
    <circle id="p1-operations"  cx="498" cy="304" r="7"/>
    <circle id="p2-discovery"   cx="238" cy="548" r="7"/>
    <circle id="p2-maintenance" cx="382" cy="646" r="7"/>
    <circle id="p2-operations"  cx="238" cy="752" r="7"/>
    <circle id="p2-incident"    cx="188" cy="764" r="7"/>
    <circle id="p2-assurance"   cx="140" cy="596" r="7"/>
    <circle id="p3-assurance"   cx="612" cy="600" r="7"/>
    <circle id="p3-evidence"    cx="694" cy="672" r="7"/>
    <circle id="p3-discovery"   cx="768" cy="582" r="7"/>
    <circle id="p3-operations"  cx="828" cy="716" r="7"/>
  </g>
  <!-- engineering-models boxes -->
  <rect id="p1-eng" x="408" y="190" width="164" height="36" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="1.2"/>
  <text x="490" y="213" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c1917">ENGINEERING MODELS</text>
  <rect id="p2-eng" x="156" y="634" width="164" height="36" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="1.2"/>
  <text x="238" y="657" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c1917">ENGINEERING MODELS</text>
  <rect id="p3-eng" x="714" y="634" width="164" height="36" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="1.2"/>
  <text x="796" y="657" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c1917">ENGINEERING MODELS</text>
  <!-- lifecycle labels -->
  <g font-size="21" fill="#1c1917" text-anchor="middle">
    <text x="490" y="94">Discovery</text><text x="300" y="170">Assurance</text><text x="710" y="192">Maintenance</text><text x="498" y="332">Operations</text>
    <text x="238" y="528">Discovery</text><text x="462" y="640">Maintenance</text><text x="254" y="780">Operations</text><text x="148" y="792">Incident</text><text x="140" y="576">Assurance</text>
    <text x="560" y="596">Assurance</text><text x="694" y="700">Evidence</text><text x="768" y="562">Discovery</text><text x="828" y="744">Operations</text>
  </g>

  <!-- cross-product concern boxes (also nodes; drawn on top so their fill caps the concern edges) -->
  <rect id="code-quality" x="76" y="352" width="148" height="46" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="150" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3f12">CODE-QUALITY</text>
  <text x="150" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3f12">MECHANISMS</text>
  <text x="150" y="418" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">shared by P1 and P2</text>

  <rect id="assurance-obligation" x="392" y="422" width="216" height="50" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="500" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">ASSURANCE OBLIGATION</text>
  <text x="500" y="463" text-anchor="middle" font-size="14" font-style="italic" fill="#9a3f12">e.g., DO-178C or IEC 61508</text>

  <rect id="security-posture" x="402" y="806" width="196" height="34" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.7" stroke-dasharray="3 3"/>
  <text x="500" y="828" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">SECURITY POSTURE</text>
  <text x="500" y="856" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">shared concern; connections not yet established</text>

  <!-- legend (single row) -->
  <g font-size="16" fill="#57534e">
    <line x1="70" y1="904" x2="116" y2="904" stroke="#57534e" stroke-width="1.7"/>
    <text x="124" y="910">established</text>
    <line x1="270" y1="904" x2="316" y2="904" stroke="#57534e" stroke-width="1.5" stroke-dasharray="2 4"/>
    <text x="324" y="910">emerging / possible</text>
    <rect x="560" y="895" width="20" height="15" rx="2" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.8"/>
    <text x="590" y="910" fill="#9a3f12">cross-product concern</text>
  </g>
</svg>
