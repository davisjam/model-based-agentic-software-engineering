<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h9-capital-time-space.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620"
     role="img" aria-labelledby="h9Title h9Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h9Title">Engineering capital across time and space</title>
  <desc id="h9Desc">A conceptual illustration, not a quantitative model. The horizontal TIME axis runs through
    successive example engineering episodes across a product's lifecycle — decision, realization, maintenance,
    operations, assurance, later change. An orange trace along that axis represents engineering capital as a latent
    construct that accumulates irregularly, receiving contributions at selected episodes (a decision yields
    rationale; realization yields a model or mechanism; assurance yields evidence); its changing thickness is a
    qualitative cue, not a measured amount. The vertical SPACE axis marks the scope over which capital is useful:
    component, product, other product, other organization. Solid branches show reach within the originating
    product; dashed branches show the more conjectural extension to other products and organizations.</desc>

  <defs>
    <marker id="h9-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
  </defs>

  <rect x="0" y="0" width="940" height="620" fill="#fdfcf9"/>
  <text x="884" y="52" text-anchor="end" font-size="13" font-weight="700" letter-spacing="0.14em" fill="#a8a29e">CONCEPTUAL</text>

  <!-- axes -->
  <line x1="220" y1="560" x2="900" y2="560" stroke="#57534e" stroke-width="2.4" marker-end="url(#h9-ah)"/>
  <line x1="220" y1="560" x2="220" y2="70"  stroke="#57534e" stroke-width="2.4" marker-end="url(#h9-ah)"/>

  <!-- SPACE axis: scope categories -->
  <g text-anchor="end" font-size="14" fill="#1c1917">
    <text x="206" y="497">component</text>
    <text x="206" y="407">product</text>
    <text x="206" y="297">other product</text>
    <text x="206" y="187">other organization</text>
  </g>
  <g stroke="#57534e" stroke-width="1.4">
    <line x1="215" y1="492" x2="225" y2="492"/>
    <line x1="215" y1="402" x2="225" y2="402"/>
    <line x1="215" y1="292" x2="225" y2="292"/>
    <line x1="215" y1="182" x2="225" y2="182"/>
  </g>
  <text x="46" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#57534e" transform="rotate(-90 46 300)">SPACE · scope over which engineering capital is useful</text>

  <!-- capital trace: a latent construct accumulating irregularly along time (thickness is a qualitative cue) -->
  <path d="M220,546 L220,540 L300,532 L400,516 L500,522 L600,506 L700,512 L820,502 L880,504 L880,546 Z"
        fill="#ecd6c6" stroke="#9a3f12" stroke-width="0.9"/>
  <text x="878" y="538" text-anchor="end" font-size="12" font-style="italic" fill="#9a3f12">engineering capital available to later work</text>

  <!-- contributions at selected episodes -->
  <g fill="#9a3f12" stroke="none">
    <circle cx="300" cy="532" r="4"/>
    <circle cx="500" cy="522" r="4"/>
    <circle cx="700" cy="512" r="4"/>
  </g>
  <g stroke="#9a3f12" stroke-width="1">
    <line x1="300" y1="528" x2="300" y2="514"/>
    <line x1="500" y1="518" x2="500" y2="504"/>
    <line x1="700" y1="508" x2="700" y2="494"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#9a3f12">
    <text x="300" y="508">decision → rationale</text>
    <text x="500" y="498">realization → model / mechanism</text>
    <text x="700" y="488">assurance → evidence</text>
  </g>

  <!-- spatial reach: solid within the product, dashed beyond it (conjectural) -->
  <line x1="400" y1="516" x2="400" y2="404" stroke="#9a3f12" stroke-width="2"/>
  <circle cx="400" cy="404" r="3.5" fill="#9a3f12"/>
  <line x1="600" y1="506" x2="600" y2="294" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 4"/>
  <circle cx="600" cy="294" r="3.5" fill="#9a3f12"/>
  <line x1="820" y1="502" x2="820" y2="184" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 4"/>
  <circle cx="820" cy="184" r="3.5" fill="#9a3f12"/>

  <!-- TIME axis: example episodes -->
  <g text-anchor="middle" font-size="12" fill="#1c1917">
    <text x="300" y="580">decision</text>
    <text x="400" y="580">realization</text>
    <text x="500" y="580">maintenance</text>
    <text x="600" y="580">operations</text>
    <text x="700" y="580">assurance</text>
    <text x="818" y="580">later change</text>
  </g>
  <text x="560" y="600" text-anchor="middle" font-size="12" font-style="italic" fill="#78716c">(example episodes — order is illustrative, not a required sequence)</text>
  <text x="560" y="617" text-anchor="middle" font-size="13" font-weight="700" fill="#57534e">TIME · successive engineering episodes across the product lifecycle</text>
</svg>
