<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h9-capital-time-space.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 940" width="980" height="940"
     role="img" aria-labelledby="h9Title h9Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h9Title">Engineering capital across time and space</title>
  <desc id="h9Desc">A conceptual snapshot of three products shaped by successive engineering episodes. Each
    product is a softly bounded gray field holding a partial constellation of lifecycle surfaces around a central
    engineering-models node. The three products are heterogeneous. Every relationship terminates on a named node:
    solid gray lines are established internal relationships; dotted gray lines are emerging or possible ones;
    unconnected nodes are local. Three cross-product concerns connect to named nodes: an assurance obligation to
    Product 1's Assurance, Product 2's Engineering Models, and Product 3's Evidence; a code-quality mechanism to
    the Engineering Models of Products 1 and 2; a security posture, dotted, to the Engineering Models of all three.
    No arrowheads, axes, scale, or size encoding.</desc>

  <rect x="0" y="0" width="980" height="940" fill="#fdfcf9"/>

  <!-- soft gray "galaxy" fields (solid light-gray token; sizes vary slightly on purpose) -->
  <ellipse cx="490" cy="208" rx="280" ry="168" fill="#f3efe7"/>
  <ellipse cx="238" cy="652" rx="208" ry="196" fill="#f3efe7"/>
  <ellipse cx="744" cy="652" rx="254" ry="168" fill="#f3efe7"/>
  <g text-anchor="middle" font-size="25" font-weight="700" letter-spacing="0.06em" fill="#57534e" opacity="0.82">
    <text x="490" y="52">PRODUCT 1</text><text x="150" y="470">PRODUCT 2</text><text x="852" y="470">PRODUCT 3</text>
  </g>

  <!-- ================= PRODUCT 1 — richly connected ================= -->
  <g stroke="#57534e" fill="none">
    <line x1="490" y1="120" x2="490" y2="190" stroke-width="1.6"/>
    <line x1="362" y1="180" x2="408" y2="206" stroke-width="1.6"/>
    <line x1="572" y1="206" x2="628" y2="198" stroke-width="1.6"/>
    <line x1="490" y1="226" x2="498" y2="298" stroke-width="1.6"/>
    <path d="M638,214 C652,266 576,296 514,304" stroke-width="1.6"/>
    <path d="M472,124 C426,142 396,160 372,170" stroke-width="1.4" stroke-dasharray="2 4"/>
  </g>
  <rect x="408" y="190" width="164" height="36" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="1.2"/>
  <text x="490" y="213" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c1917">ENGINEERING MODELS</text>
  <g fill="#fdfcf9" stroke="#57534e" stroke-width="1.6"><circle cx="490" cy="114" r="7"/><circle cx="356" cy="176" r="7"/><circle cx="634" cy="198" r="7"/><circle cx="498" cy="304" r="7"/></g>
  <g font-size="18" fill="#1c1917"><text x="490" y="98" text-anchor="middle">Discovery</text><text x="308" y="172" text-anchor="middle">Assurance</text><text x="694" y="194" text-anchor="middle">Maintenance</text><text x="498" y="328" text-anchor="middle">Operations</text></g>

  <!-- ================= PRODUCT 2 — continuing change & operation; local assurance ================= -->
  <g stroke="#57534e" fill="none">
    <line x1="320" y1="650" x2="376" y2="648" stroke-width="1.6"/>
    <line x1="238" y1="670" x2="238" y2="746" stroke-width="1.6"/>
    <path d="M382,660 C394,694 336,732 268,748" stroke-width="1.6"/>
    <line x1="196" y1="760" x2="230" y2="752" stroke-width="1.6"/>
    <line x1="238" y1="590" x2="238" y2="634" stroke-width="1.4" stroke-dasharray="2 4"/>
  </g>
  <rect x="156" y="634" width="164" height="36" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="1.2"/>
  <text x="238" y="657" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c1917">ENGINEERING MODELS</text>
  <g fill="#fdfcf9" stroke="#57534e" stroke-width="1.6"><circle cx="238" cy="548" r="7"/><circle cx="382" cy="646" r="7"/><circle cx="238" cy="752" r="7"/><circle cx="188" cy="764" r="7"/><circle cx="140" cy="596" r="7"/></g>
  <g font-size="18" fill="#1c1917"><text x="238" y="532" text-anchor="middle">Discovery</text><text x="446" y="642" text-anchor="middle">Maintenance</text><text x="238" y="778" text-anchor="middle">Operations</text><text x="150" y="784" text-anchor="middle">Incident</text><text x="140" y="580" text-anchor="middle">Assurance</text></g>

  <!-- ================= PRODUCT 3 — assurance-oriented; assurance reaches models through evidence ================= -->
  <g stroke="#57534e" fill="none">
    <line x1="618" y1="606" x2="688" y2="666" stroke-width="1.6"/>
    <line x1="702" y1="670" x2="714" y2="660" stroke-width="1.6"/>
    <line x1="768" y1="588" x2="768" y2="634" stroke-width="1.4" stroke-dasharray="2 4"/>
  </g>
  <rect x="714" y="634" width="164" height="36" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="1.2"/>
  <text x="796" y="657" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c1917">ENGINEERING MODELS</text>
  <g fill="#fdfcf9" stroke="#57534e" stroke-width="1.6"><circle cx="612" cy="600" r="7"/><circle cx="694" cy="672" r="7"/><circle cx="768" cy="582" r="7"/><circle cx="828" cy="716" r="7"/></g>
  <g font-size="18" fill="#1c1917"><text x="564" y="596" text-anchor="middle">Assurance</text><text x="694" y="696" text-anchor="middle">Evidence</text><text x="768" y="566" text-anchor="middle">Discovery</text><text x="828" y="740" text-anchor="middle">Operations</text></g>

  <!-- ================= CROSS-PRODUCT CONCERNS — every edge lands on a named node ================= -->
  <!-- CODE-QUALITY MECHANISMS (left corridor): established, to P1 Engineering Models + P2 Engineering Models -->
  <g stroke="#9a3f12" fill="none" stroke-width="1.9">
    <path d="M224,388 C312,344 372,256 408,210"/>
    <path d="M150,424 C170,510 224,608 238,634"/>
  </g>
  <rect x="76" y="378" width="148" height="46" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="150" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3f12">CODE-QUALITY</text>
  <text x="150" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3f12">MECHANISMS</text>
  <text x="150" y="444" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">shared by P1 and P2</text>

  <!-- ASSURANCE OBLIGATION (center corridor): P1 Assurance, P2 Engineering Models, P3 Evidence -->
  <g stroke="#9a3f12" fill="none" stroke-width="1.9">
    <path d="M480,422 C438,330 388,222 360,182"/>
    <path d="M460,472 C398,548 336,624 320,650"/>
    <path d="M560,472 C616,560 664,644 690,668"/>
  </g>
  <rect x="392" y="422" width="216" height="50" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="500" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">ASSURANCE OBLIGATION</text>
  <text x="500" y="463" text-anchor="middle" font-size="14" font-style="italic" fill="#9a3f12">e.g., DO-178C or IEC 61508</text>

  <!-- SECURITY POSTURE (lower-center corridor): dotted, to the Engineering Models of all three -->
  <g stroke="#9a3f12" fill="none" stroke-width="1.7" stroke-dasharray="2 5">
    <path d="M494,806 C316,640 306,392 476,228"/>
    <path d="M450,816 C352,770 288,706 240,670"/>
    <path d="M550,816 C662,772 736,706 780,670"/>
  </g>
  <rect x="402" y="806" width="196" height="34" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.7" stroke-dasharray="3 3"/>
  <text x="500" y="828" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">SECURITY POSTURE</text>
  <text x="500" y="856" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">shared concern; connections not yet established</text>

  <!-- legend -->
  <g font-size="15" fill="#57534e">
    <line x1="40" y1="902" x2="82" y2="902" stroke="#57534e" stroke-width="1.6"/>
    <text x="90" y="907">established</text>
    <line x1="228" y1="902" x2="270" y2="902" stroke="#57534e" stroke-width="1.4" stroke-dasharray="2 4"/>
    <text x="278" y="907">emerging / possible</text>
    <rect x="486" y="894" width="18" height="13" rx="2" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.7"/>
    <text x="512" y="907" fill="#9a3f12">cross-product concern</text>
  </g>
</svg>
