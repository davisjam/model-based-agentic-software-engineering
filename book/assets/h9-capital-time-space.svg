<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h9-capital-time-space.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 920" width="980" height="920"
     role="img" aria-labelledby="h9Title h9Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h9Title">Engineering capital across time and space</title>
  <desc id="h9Desc">A conceptual snapshot of three products shaped by successive engineering episodes. Each
    product is a softly bounded gray field holding a partial constellation of lifecycle surfaces — discovery,
    assurance, maintenance, operations — around a central engineering-models node. The three products are
    heterogeneous: one richly connected, one oriented toward continuing change and operation with a local
    unconnected assurance node, one assurance-oriented with assurance reaching engineering models through
    evidence. Solid gray lines are established relationships; dotted gray lines are emerging or possible ones;
    unconnected nodes are local. Three cross-product concerns span the fields in orange: an assurance obligation
    connects all three products through different local structures; a code-quality mechanism is shared by two;
    a common security posture is dotted toward the three engineering-models nodes because its connections are not
    yet established. No arrowheads, axes, scale, or size encoding — the partial topology represents accumulated
    engineering capital.</desc>

  <rect x="0" y="0" width="980" height="920" fill="#fdfcf9"/>

  <!-- soft gray "galaxy" fields (solid light-gray token; sizes vary slightly on purpose) -->
  <ellipse cx="490" cy="212" rx="276" ry="178" fill="#f3efe7"/>
  <ellipse cx="248" cy="650" rx="214" ry="198" fill="#f3efe7"/>
  <ellipse cx="736" cy="652" rx="252" ry="172" fill="#f3efe7"/>
  <g text-anchor="middle" font-size="20" font-weight="700" letter-spacing="0.08em" fill="#57534e" opacity="0.82">
    <text x="490" y="60">PRODUCT 1</text><text x="150" y="486">PRODUCT 2</text><text x="844" y="486">PRODUCT 3</text>
  </g>

  <!-- ================= PRODUCT 1 — richly connected ================= -->
  <g stroke="#57534e" fill="none">
    <line x1="490" y1="120" x2="490" y2="194" stroke-width="1.6"/>
    <line x1="364" y1="182" x2="408" y2="208" stroke-width="1.6"/>
    <line x1="572" y1="208" x2="626" y2="198" stroke-width="1.6"/>
    <line x1="490" y1="230" x2="496" y2="300" stroke-width="1.6"/>
    <path d="M636,214 C650,268 574,300 512,308" stroke-width="1.6"/>
    <path d="M472,124 C424,144 392,164 370,174" stroke-width="1.4" stroke-dasharray="2 4"/>
  </g>
  <rect x="408" y="194" width="164" height="36" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="1.2"/>
  <text x="490" y="217" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c1917">ENGINEERING MODELS</text>
  <g fill="#fdfcf9" stroke="#57534e" stroke-width="1.6"><circle cx="490" cy="114" r="6.5"/><circle cx="358" cy="178" r="6.5"/><circle cx="632" cy="198" r="6.5"/><circle cx="497" cy="306" r="6.5"/></g>
  <g font-size="16" fill="#1c1917"><text x="490" y="100" text-anchor="middle">Discovery</text><text x="318" y="174" text-anchor="middle">Assurance</text><text x="682" y="194" text-anchor="middle">Maintenance</text><text x="497" y="328" text-anchor="middle">Operations</text></g>

  <!-- ================= PRODUCT 2 — continuing change & operation; local assurance ================= -->
  <g stroke="#57534e" fill="none">
    <line x1="330" y1="646" x2="384" y2="644" stroke-width="1.6"/>
    <line x1="248" y1="668" x2="248" y2="742" stroke-width="1.6"/>
    <path d="M388,656 C400,690 342,728 276,744" stroke-width="1.6"/>
    <line x1="240" y1="748" x2="198" y2="756" stroke-width="1.6"/>
    <line x1="248" y1="590" x2="248" y2="632" stroke-width="1.4" stroke-dasharray="2 4"/>
  </g>
  <rect x="166" y="632" width="164" height="36" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="1.2"/>
  <text x="248" y="655" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c1917">ENGINEERING MODELS</text>
  <g fill="#fdfcf9" stroke="#57534e" stroke-width="1.6"><circle cx="248" cy="548" r="6.5"/><circle cx="390" cy="643" r="6.5"/><circle cx="248" cy="748" r="6.5"/><circle cx="190" cy="760" r="6.5"/><circle cx="150" cy="596" r="6.5"/></g>
  <g font-size="16" fill="#1c1917"><text x="248" y="534" text-anchor="middle">Discovery</text><text x="434" y="639" text-anchor="middle">Maintenance</text><text x="248" y="772" text-anchor="middle">Operations</text><text x="150" y="778" text-anchor="middle">incident</text><text x="150" y="582" text-anchor="middle">Assurance</text></g>

  <!-- ================= PRODUCT 3 — assurance-oriented; assurance reaches models through evidence ================= -->
  <g stroke="#57534e" fill="none">
    <line x1="620" y1="606" x2="686" y2="668" stroke-width="1.6"/>
    <line x1="702" y1="672" x2="712" y2="662" stroke-width="1.6"/>
    <line x1="766" y1="588" x2="766" y2="634" stroke-width="1.4" stroke-dasharray="2 4"/>
  </g>
  <rect x="714" y="634" width="164" height="36" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="1.2"/>
  <text x="796" y="657" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1c1917">ENGINEERING MODELS</text>
  <g fill="#fdfcf9" stroke="#57534e" stroke-width="1.6"><circle cx="612" cy="600" r="6.5"/><circle cx="694" cy="672" r="6.5"/><circle cx="766" cy="582" r="6.5"/><circle cx="826" cy="716" r="6.5"/></g>
  <g font-size="16" fill="#1c1917"><text x="570" y="596" text-anchor="middle">Assurance</text><text x="694" y="694" text-anchor="middle">evidence</text><text x="766" y="568" text-anchor="middle">Discovery</text><text x="826" y="738" text-anchor="middle">Operations</text></g>

  <!-- ================= CROSS-PRODUCT CONCERNS (orange = scope; solid/dotted = status) ================= -->
  <!-- CODE-QUALITY MECHANISMS — established, shared by P1 and P2 (both Engineering Models) -->
  <g stroke="#9a3f12" fill="none" stroke-width="1.9">
    <path d="M300,392 C360,344 400,268 436,232"/>
    <path d="M250,432 C250,520 248,586 248,630"/>
  </g>
  <rect x="176" y="392" width="148" height="46" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="250" y="412" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a3f12">CODE-QUALITY</text>
  <text x="250" y="429" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a3f12">MECHANISMS</text>
  <text x="250" y="456" text-anchor="middle" font-size="12.5" font-style="italic" fill="#57534e">shared by P1 and P2</text>

  <!-- ASSURANCE OBLIGATION — established across all three, through different local structures -->
  <g stroke="#9a3f12" fill="none" stroke-width="1.9">
    <path d="M486,430 C440,340 400,236 372,190"/>
    <path d="M470,478 C400,558 320,618 262,640"/>
    <path d="M596,478 C650,566 680,634 700,662"/>
  </g>
  <rect x="452" y="430" width="216" height="50" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="560" y="452" text-anchor="middle" font-size="14.5" font-weight="700" fill="#9a3f12">ASSURANCE OBLIGATION</text>
  <text x="560" y="471" text-anchor="middle" font-size="12.5" font-style="italic" fill="#9a3f12">e.g., DO-178C or IEC 61508</text>

  <!-- SECURITY POSTURE — dotted three-way fan to the Engineering Models nodes (connections not yet established) -->
  <g stroke="#9a3f12" fill="none" stroke-width="1.7" stroke-dasharray="2 5">
    <path d="M470,806 C400,640 396,400 486,232"/>
    <path d="M452,812 C360,760 300,700 258,672"/>
    <path d="M556,812 C660,764 720,700 758,672"/>
  </g>
  <rect x="404" y="806" width="192" height="34" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.7" stroke-dasharray="3 3"/>
  <text x="500" y="828" text-anchor="middle" font-size="14.5" font-weight="700" fill="#9a3f12">SECURITY POSTURE</text>
  <text x="500" y="856" text-anchor="middle" font-size="12.5" font-style="italic" fill="#57534e">shared concern; connections not yet established</text>

  <!-- legend: color = scope, line style = status -->
  <g font-size="13" fill="#57534e">
    <line x1="40" y1="886" x2="82" y2="886" stroke="#57534e" stroke-width="1.6"/>
    <text x="90" y="891">established</text>
    <line x1="230" y1="886" x2="272" y2="886" stroke="#57534e" stroke-width="1.4" stroke-dasharray="2 4"/>
    <text x="280" y="891">emerging / possible</text>
    <rect x="516" y="879" width="18" height="12" rx="2" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.7"/>
    <text x="542" y="891" fill="#9a3f12">cross-product concern</text>
  </g>
</svg>
