<?xml version="1.0" encoding="UTF-8"?>
<!-- graph-example figure — modeling-history.svg. Fold to book/assets/. -->
<!-- semantic-families: modeling, governance, neutral, failure -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1180" width="1000" height="1180"
     role="img" aria-labelledby="mhTitle mhDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mhTitle">The modeling history</title>
  <desc id="mhDesc">A top-to-bottom modeling history. DocAble began with a stable decomposition of remediation computations, so their node projection was meaningful, while their composition stayed implicit — carried by repeated traversal, shared-state reads, direct mutation, and special cases. As that composition accumulated global cost, modeling the relations exposed two previously implicit dimensions, shown as parallel columns: dependency semantics (DATA_FLOW, CONTROL_GATE, CROSS_SERVICE) and effect boundedness (TypedPatchProducer, DirectEditor, ReadOnly). Typed declarations then made the relationships projectable, a projected graph held by a blocking parity check, with residual freedom remaining. The progression runs from a partial model to a richer one, not from no model to model.</desc>
  <defs>
    <marker id="mh-ah-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
  </defs>
  <!-- edge: mh_s1 -> mh_s2 -->
  <line x1="500" y1="164" x2="500" y2="220" stroke="#57534e" stroke-width="2.5" marker-end="url(#mh-ah-gray)"/>
  <!-- edge: mh_s2 -> mh_s3 -->
  <line x1="500" y1="294" x2="500" y2="350" stroke="#57534e" stroke-width="2.5" marker-end="url(#mh-ah-gray)"/>
  <!-- edge: mh_s3 -> mh_dl -->
  <path d="M350,424 L350,483" fill="none" stroke="#57534e" stroke-width="2.5" marker-end="url(#mh-ah-gray)"/>
  <!-- edge: mh_s3 -> mh_dr -->
  <path d="M650,424 L650,483" fill="none" stroke="#57534e" stroke-width="2.5" marker-end="url(#mh-ah-gray)"/>
  <!-- edge: mh_dl -> mh_s5 -->
  <path d="M350,645 L350,698" fill="none" stroke="#57534e" stroke-width="2.5" marker-end="url(#mh-ah-gray)"/>
  <!-- edge: mh_dr -> mh_s5 -->
  <path d="M650,645 L650,698" fill="none" stroke="#57534e" stroke-width="2.5" marker-end="url(#mh-ah-gray)"/>
  <!-- edge: mh_s5 -> mh_s6 -->
  <line x1="500" y1="774" x2="500" y2="830" stroke="#57534e" stroke-width="2.5" marker-end="url(#mh-ah-gray)"/>
  <!-- edge: mh_s6 -> mh_s7 -->
  <line x1="500" y1="904" x2="500" y2="960" stroke="#57534e" stroke-width="2.5" marker-end="url(#mh-ah-gray)"/>
  <rect id="mh_s1" x="230" y="90" width="540" height="74" rx="12" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <rect id="mh_s2" x="230" y="220" width="540" height="74" rx="12" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <rect id="mh_s3" x="230" y="350" width="540" height="74" rx="12" fill="#fbeaea" stroke="#b23b3b" stroke-width="2"/>
  <rect id="mh_dl" x="150" y="485" width="320" height="160" rx="12" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <rect id="mh_dr" x="530" y="485" width="320" height="160" rx="12" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <rect id="mh_s5" x="230" y="700" width="540" height="74" rx="12" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <rect id="mh_s6" x="230" y="830" width="540" height="74" rx="12" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <rect id="mh_s7" x="230" y="960" width="540" height="74" rx="12" fill="#f6f4ef" stroke="#57534e" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="500" y="58" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">The modeling history</text>
  <text x="500" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Stable computations</text>
  <text x="500" y="147" text-anchor="middle" font-size="13" font-weight="400" font-style="italic" fill="#57534e">pass decomposition — the nodes already project</text>
  <text x="500" y="252" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Composition stays implicit</text>
  <text x="500" y="277" text-anchor="middle" font-size="13" font-weight="400" font-style="italic" fill="#57534e">repeated traversal · shared-state reads · direct mutation · special cases</text>
  <text x="500" y="382" text-anchor="middle" font-size="18" font-weight="700" fill="#b23b3b">Composition becomes consequential</text>
  <text x="500" y="407" text-anchor="middle" font-size="13" font-weight="400" font-style="italic" fill="#57534e">locally reasonable choices accumulate global cost</text>
  <text x="500" y="447" text-anchor="middle" font-size="15" font-weight="700" fill="#57534e">model the relations</text>
  <text x="500" y="476" text-anchor="middle" font-size="13" font-weight="400" font-style="italic" fill="#57534e">two previously implicit dimensions</text>
  <text x="310" y="517" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">Dependency semantics</text>
  <text x="310" y="552" text-anchor="middle" font-size="14" font-weight="400" fill="#1c1917">DATA_FLOW</text>
  <text x="310" y="582" text-anchor="middle" font-size="14" font-weight="400" fill="#1c1917">CONTROL_GATE</text>
  <text x="310" y="612" text-anchor="middle" font-size="14" font-weight="400" fill="#1c1917">CROSS_SERVICE</text>
  <text x="690" y="517" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">Effect boundedness</text>
  <text x="690" y="552" text-anchor="middle" font-size="14" font-weight="400" fill="#1c1917">TypedPatchProducer</text>
  <text x="690" y="582" text-anchor="middle" font-size="14" font-weight="400" fill="#1c1917">DirectEditor</text>
  <text x="690" y="612" text-anchor="middle" font-size="14" font-weight="400" fill="#1c1917">ReadOnly</text>
  <text x="500" y="732" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Typed declarations</text>
  <text x="500" y="757" text-anchor="middle" font-size="13" font-weight="400" font-style="italic" fill="#57534e">each pass declares its IO facets and its effect kind</text>
  <text x="500" y="862" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Projected graph + blocking parity</text>
  <text x="500" y="887" text-anchor="middle" font-size="13" font-weight="400" font-style="italic" fill="#9a3f12">edges projected from the declarations; disagreement fails the build</text>
  <text x="500" y="992" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Residual freedom remains</text>
  <text x="500" y="1017" text-anchor="middle" font-size="13" font-weight="400" font-style="italic" fill="#57534e">not every choice is determinized</text>
  <text x="500" y="1120" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">From a partial model to a richer one — not from no model to model.</text>
</svg>
