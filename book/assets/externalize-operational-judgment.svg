<?xml version="1.0" encoding="UTF-8"?>
<!-- RB Part-IV figure — externalize-operational-judgment.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540"
     role="img" aria-labelledby="eoTitle eoDesc"
     font-family="'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="eoTitle">Externalizing operational judgment — type a runbook's steps by the work they contain.</title>
  <desc id="eoDesc">A neutral recurring-procedure box flows down through an externalize-steps step, then fans into
    three columns distinguished by outline style. The left column, a solid rust deterministic outcome, becomes
    a tool or executable step. The middle column, a dashed blue bounded judgment, becomes a prepared brief. The
    right column, a dotted dark irreducible judgment, becomes a human decision. The three forms converge into a
    dark sanctioned-next-action box. Outline style — solid, dashed, dotted — encodes the three kinds of work so
    the distinction survives in grayscale.</desc>

  <defs>
    <marker id="eo-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
  </defs>

  <rect x="360" y="34" width="280" height="54" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="1.5"/>
  <text x="500" y="67" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">RECURRING PROCEDURE</text>
  <line x1="500" y1="88" x2="500" y2="124" stroke="#57534e" stroke-width="2" marker-end="url(#eo-ah)"/>

  <rect x="390" y="126" width="220" height="52" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="500" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">EXTERNALIZE STEPS</text>

  <path d="M500 178 C 420 202 300 204 250 220" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#eo-ah)"/>
  <line x1="500" y1="178" x2="500" y2="220" stroke="#57534e" stroke-width="2" marker-end="url(#eo-ah)"/>
  <path d="M500 178 C 580 202 700 204 750 220" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#eo-ah)"/>

  <!-- deterministic = solid rust -->
  <rect x="120" y="222" width="260" height="64" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="250" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">DETERMINISTIC</text>
  <text x="250" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">OUTCOME</text>
  <!-- bounded = dashed blue -->
  <rect x="370" y="222" width="260" height="64" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="500" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#2f5169">BOUNDED</text>
  <text x="500" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#2f5169">JUDGMENT</text>
  <!-- irreducible = dotted dark -->
  <rect x="620" y="222" width="260" height="64" rx="10" fill="#f6f4ef" stroke="#1c1917" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="750" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">IRREDUCIBLE</text>
  <text x="750" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">JUDGMENT</text>

  <line x1="250" y1="286" x2="250" y2="326" stroke="#57534e" stroke-width="2" marker-end="url(#eo-ah)"/>
  <line x1="500" y1="286" x2="500" y2="326" stroke="#57534e" stroke-width="2" marker-end="url(#eo-ah)"/>
  <line x1="750" y1="286" x2="750" y2="326" stroke="#57534e" stroke-width="2" marker-end="url(#eo-ah)"/>

  <!-- forms -->
  <rect x="150" y="328" width="200" height="60" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="250" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3f12">TOOL</text>
  <text x="250" y="376" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">/ executable</text>
  <rect x="400" y="328" width="200" height="60" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="500" y="363" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">PREPARED BRIEF</text>
  <rect x="650" y="328" width="200" height="60" rx="10" fill="#f6f4ef" stroke="#1c1917" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="750" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">HUMAN</text>
  <text x="750" y="376" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">decision</text>

  <!-- merge -->
  <path d="M250 388 C 250 414 430 418 486 430" fill="none" stroke="#57534e" stroke-width="2"/>
  <path d="M750 388 C 750 414 570 418 514 430" fill="none" stroke="#57534e" stroke-width="2"/>
  <line x1="500" y1="388" x2="500" y2="430" stroke="#57534e" stroke-width="2"/>
  <line x1="500" y1="430" x2="500" y2="466" stroke="#57534e" stroke-width="2" marker-end="url(#eo-ah)"/>

  <rect x="370" y="468" width="260" height="56" rx="12" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="500" y="497" text-anchor="middle" font-size="16" font-weight="700" fill="#fdfcf9">SANCTIONED NEXT</text>
  <text x="500" y="515" text-anchor="middle" font-size="13" font-weight="700" fill="#fdfcf9">ACTION</text>
</svg>
