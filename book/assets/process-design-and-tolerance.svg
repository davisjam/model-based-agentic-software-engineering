<?xml version="1.0" encoding="UTF-8"?>
<!-- §5.1 Figure 5.1-1 — process-design-and-tolerance.svg. Hand-SVG: a flow band and a bounded
     acceptable region in one frame is a bespoke composition, not a graph d2 can lay out.
     The two ENGINEERED things are drawn COEQUAL: the production process the engineer designs around
     the fabricator, and the acceptable region it bounds the output by. The region keeps the larger
     physical area because it needs geometric space, so the process half earns matching presence
     through a filled band, near-black boxes at heavier stroke, larger type and a span bracket rather
     than through area — and the region's rust fill steps back so colour alone stops winning first
     glance. Rust stays the tolerance family's colour; the process half asserts in ink, not hue.
     The fabricator is one ordinary station on the path, because the chapter's claim is that it is
     one component of the factory and not its centre.
     GEOMETRY IS SHARED WITH Figure 6.1-2 (probability-in-the-software-factory.svg): frame, band,
     the four path boxes, the span bracket at y=286, the acceptable region, the dots and the two
     outcome boxes all sit at identical coordinates so a reader flipping between the two pages sees
     the same factory with the theory appearing on it. Do not move anything here without moving it
     there. -->
<!-- semantic-families: governance, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 772" width="1000" height="772"
     role="img" aria-labelledby="pdtTitle pdtDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="pdtTitle">Process design organizes production around the fabricator; tolerance bounds the
    product</title>
  <desc id="pdtDesc">One large frame labelled SOFTWARE FACTORY holds two engineering concerns of equal
    standing, each introduced by a heading over a coloured rule. Across the top, under the heading
    PROCESS DESIGN — how production proceeds, a dashed band labelled PRODUCTION PROCESS carries a
    left-to-right path from engineering intent, through context and work, through a box labelled
    Fabricator, and out to a realization. All four boxes are drawn at the same firm weight: the
    fabricator is one station among them, not the centre of the picture. A bracket spans the whole path
    from the first box to the last, and beneath it, set larger than any label on the path, an annotation
    names what the process design determines: context, tools, routing, authority, sequencing. Below the
    band, under the heading TOLERANCE — what variation in the product is acceptable, a wide bounded
    region drawn in the governance colour is labelled ACCEPTABLE REGION. Dots inside it mark distinct
    acceptable realizations the fabricator may choose among. A measurement arrow drops from the
    realization to the top of that region, annotated with the mechanisms that establish where a
    realization falls: tests, property-based testing, analysis, simulation, human judgment. From the
    region two arrows of equal weight lead out, one labelled within tolerance to admitted change and one
    labelled outside to revise or reject.</desc>

  <defs>
    <marker id="pdtArrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10"
            refX="12" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#292524"/>
    </marker>
    <marker id="pdtArrowRust" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10"
            refX="12" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- page ground + the factory frame: the whole system is the object being engineered, so the
       boundary is drawn firmly enough to read as one thing, but quietly enough to stay a container -->
  <rect x="0" y="0" width="1000" height="772" fill="#fdfcf9"/>
  <rect x="26" y="62" width="948" height="682" rx="12" fill="#fdfcf9" stroke="#cfc9bf" stroke-width="2"/>

  <!-- the production process: the path by which work reaches, passes through, and leaves the fabricator.
       This band, not the fabricator inside it, is what process design designs. -->
  <rect x="48" y="152" width="904" height="248" rx="10" fill="#f4f0e8" stroke="#a8a29e" stroke-width="2"
        stroke-dasharray="7 5"/>

  <!-- the acceptable region: a bounded region for properties of the realization, not a stage -->
  <rect id="n-region" x="372" y="456" width="580" height="176" rx="14" fill="#9a3f12" fill-opacity="0.07"
        stroke="#9a3f12" stroke-width="3"/>

  <!-- edges are drawn first so each node's opaque fill caps its tail; heads seat outside the target rim -->
  <!-- edge: n-intent -> n-work -->
  <line x1="244" y1="228" x2="302" y2="228" stroke="#292524" stroke-width="2.5" marker-end="url(#pdtArrow)"/>
  <!-- edge: n-work -> n-fabricator -->
  <line x1="469" y1="228" x2="526" y2="228" stroke="#292524" stroke-width="2.5" marker-end="url(#pdtArrow)"/>
  <!-- edge: n-fabricator -> n-realization -->
  <line x1="693" y1="228" x2="751" y2="228" stroke="#292524" stroke-width="2.5" marker-end="url(#pdtArrow)"/>
  <!-- edge: n-realization -> n-region — measurement, the join between the two problems -->
  <line x1="880" y1="260" x2="880" y2="456" stroke="#9a3f12" stroke-width="2.5"
        marker-end="url(#pdtArrowRust)"/>
  <!-- edge: n-region -> n-admitted -->
  <line x1="805" y1="632" x2="805" y2="672" stroke="#292524" stroke-width="2" marker-end="url(#pdtArrow)"/>
  <!-- edge: n-region -> n-revise — equal weight: rejection is a result the factory produces -->
  <line x1="515" y1="632" x2="515" y2="672" stroke="#292524" stroke-width="2" marker-end="url(#pdtArrow)"/>

  <!-- the production path: four stations of equal weight. No fill, no colour and no larger type on the
       fabricator — it is one machine on the path, not the subject. -->
  <rect id="n-intent" x="77" y="196" width="172" height="64" rx="8" fill="#fdfcf9" stroke="#292524"
        stroke-width="2.5"/>
  <rect id="n-work" x="302" y="196" width="172" height="64" rx="8" fill="#fdfcf9" stroke="#292524"
        stroke-width="2.5"/>
  <rect id="n-fabricator" x="526" y="196" width="172" height="64" rx="8" fill="#fdfcf9" stroke="#292524"
        stroke-width="2.5"/>
  <rect id="n-realization" x="751" y="196" width="172" height="64" rx="8" fill="#fdfcf9" stroke="#292524"
        stroke-width="2.5"/>

  <!-- the span bracket: ONE bracket across the whole path, because process design governs the whole of
       it. Figure 6.1-2 keeps this line and its endpoints and only adds interior ticks, so the two
       figures differ by a partition rather than by a redrawing. -->
  <g stroke="#292524" stroke-width="2" fill="none" stroke-linecap="square">
    <line x1="163" y1="286" x2="837" y2="286"/>
    <line x1="163" y1="286" x2="163" y2="272"/>
    <line x1="837" y1="286" x2="837" y2="272"/>
  </g>

  <!-- the two consequences of measurement, drawn at equal weight -->
  <rect id="n-admitted" x="700" y="672" width="210" height="56" rx="8" fill="#fdfcf9" stroke="#292524"
        stroke-width="2"/>
  <rect id="n-revise" x="420" y="672" width="190" height="56" rx="8" fill="#fdfcf9" stroke="#292524"
        stroke-width="2"/>

  <!-- realizations the factory would accept: the fabricator's remaining freedom -->
  <g fill="#1c1917">
    <circle cx="482" cy="542" r="6"/>
    <circle cx="562" cy="530" r="6"/>
    <circle cx="642" cy="548" r="6"/>
    <circle cx="722" cy="532" r="6"/>
    <circle cx="802" cy="546" r="6"/>
  </g>

  <!-- the two headings sit over a rule in their own family colour: charcoal for the process half,
       governance rust for the tolerance half. Same size, same weight, same left margin — the
       composition states that neither is the subordinate of the other. -->
  <rect x="52" y="114" width="180" height="4" fill="#292524"/>
  <rect x="52" y="500" width="180" height="4" fill="#9a3f12"/>

  <!-- text last: every label is painted over the fills it sits on -->
  <text x="500" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#44403c"
        letter-spacing="1.5">SOFTWARE FACTORY</text>

  <text x="52" y="104" font-size="27" font-weight="700" fill="#1c1917" letter-spacing="1.2">PROCESS DESIGN</text>
  <text x="52" y="140" font-size="20" fill="#44403c">how production proceeds</text>

  <!-- the band names the designed object, so the reader does not read the band as a box called
       "process design" -->
  <text x="70" y="180" font-size="19" font-weight="700" fill="#44403c" letter-spacing="1.2">PRODUCTION PROCESS</text>

  <text x="163" y="220" text-anchor="middle" font-size="22" fill="#1c1917">Engineering</text>
  <text x="163" y="246" text-anchor="middle" font-size="22" fill="#1c1917">intent</text>
  <text x="388" y="236" text-anchor="middle" font-size="22" fill="#1c1917">Context / work</text>
  <text x="612" y="236" text-anchor="middle" font-size="22" fill="#1c1917">Fabricator</text>
  <text x="837" y="236" text-anchor="middle" font-size="22" fill="#1c1917">Realization</text>

  <!-- what process design actually determines: set above every label on the path, because this
       annotation carries more of the argument than the fabricator box does -->
  <text x="500" y="322" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917"
        letter-spacing="0.5">context · tools · routing · authority · sequencing</text>
  <text x="500" y="352" text-anchor="middle" font-size="18" fill="#44403c">what process design determines</text>

  <text x="856" y="418" text-anchor="end" font-size="20" font-weight="700" fill="#9a3f12">measurement</text>
  <text x="856" y="442" text-anchor="end" font-size="18" fill="#9a3f12">tests · PBT · analysis · simulation · human judgment</text>

  <text x="52" y="490" font-size="27" font-weight="700" fill="#1c1917" letter-spacing="1.2">TOLERANCE</text>
  <text x="52" y="526" font-size="20" fill="#44403c">what variation in the product</text>
  <text x="52" y="550" font-size="20" fill="#44403c">is acceptable</text>

  <text x="662" y="490" text-anchor="middle" font-size="22" font-weight="700" fill="#9a3f12"
        letter-spacing="1">ACCEPTABLE REGION</text>
  <text x="662" y="610" text-anchor="middle" font-size="18" fill="#44403c">the fabricator may choose among these</text>

  <text x="818" y="662" font-size="19" fill="#44403c">within tolerance</text>
  <text x="502" y="662" text-anchor="end" font-size="19" fill="#44403c">outside</text>
  <text x="805" y="707" text-anchor="middle" font-size="22" fill="#1c1917">Admitted change</text>
  <text x="515" y="707" text-anchor="middle" font-size="22" fill="#1c1917">Revise / reject</text>
</svg>
