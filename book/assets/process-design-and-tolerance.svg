<svg xmlns="http://www.w3.org/2000/svg" width="592" height="458.667" viewBox="0 0 444 344" role="img" aria-labelledby="title desc" font-family="'Source Sans 3', sans-serif">
<title id="title">Two problems of factory engineering</title>
<desc id="desc">Process design organizes engineering intent, context and work, the fabricator, and realization. Measurement evaluates possible realizations against tolerance. The acceptable region contains permitted variation; an inside point leads to admitted change and an outside point to revision or rejection. Its structure matches the probability-in-the-factory figure.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1c1917"/></marker></defs>
<g fill="#1c1917" font-family="'Source Sans 3', sans-serif" font-size="9">
<text x="222" y="15" font-size="11" text-anchor="middle" font-weight="700">SOFTWARE FACTORY</text>
<path d="M2,11 L150,11" fill="none" stroke="#1c1917" stroke-width="0.65"/>
<path d="M294,11 L442,11" fill="none" stroke="#1c1917" stroke-width="0.65"/>
<text x="8" y="39" font-size="10" text-anchor="start" font-weight="700">PROCESS DESIGN:</text>
<text x="91" y="39" font-size="10" text-anchor="start">how production proceeds</text>
<rect x="2" y="59" width="440" height="97" rx="4" fill="white" stroke="#1c1917" stroke-width=".65" stroke-dasharray="3 3"/>
<rect x="9" y="51" width="126" height="14" fill="white"/>
<text x="13" y="62" font-size="10" text-anchor="start" font-weight="700">PRODUCTION PROCESS</text>
<rect x="12" y="74" width="84" height="30" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="54" y="87" font-size="10" text-anchor="middle">Engineering</text>
<text x="54" y="98" font-size="10" text-anchor="middle">intent</text>
<rect x="124" y="74" width="84" height="30" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="166" y="93" font-size="10" text-anchor="middle">Context / work</text>
<rect x="236" y="74" width="84" height="30" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="278" y="93" font-size="10" text-anchor="middle">Fabricator</text>
<rect x="348" y="74" width="84" height="30" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="390" y="93" font-size="10" text-anchor="middle">Realization</text>
<path d="M97,89 L122,89" fill="none" stroke="#1c1917" stroke-width="0.85" marker-end="url(#arrow)"/>
<path d="M209,89 L234,89" fill="none" stroke="#1c1917" stroke-width="0.85" marker-end="url(#arrow)"/>
<path d="M321,89 L346,89" fill="none" stroke="#1c1917" stroke-width="0.85" marker-end="url(#arrow)"/>
<path d="M54,105 L54,113" fill="none" stroke="#1c1917" stroke-width="0.6"/>
<path d="M390,105 L390,113" fill="none" stroke="#1c1917" stroke-width="0.6"/>
<path d="M54,113 L390,113" fill="none" stroke="#1c1917" stroke-width="0.6"/>
<text x="222" y="132" text-anchor="middle" font-size="9" font-weight="700">Context; tools; routing; authority; sequencing</text>
<text x="222" y="147" text-anchor="middle" font-size="9">what process design determines</text>
<path d="M390,105 L390,218" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="314" y="182" font-size="9" text-anchor="middle" font-weight="700">Measurement:</text>
<text x="314" y="194" font-size="9" text-anchor="middle">tests, PBT, analysis,</text>
<text x="314" y="205" font-size="9" text-anchor="middle">simulation, human judgment</text>
<rect x="127" y="220" width="303" height="67" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="278.5" y="234" font-size="10" text-anchor="middle" font-weight="700">POSSIBLE REALIZATIONS</text>
<rect x="151" y="244" width="180" height="34" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<text x="241" y="256" font-size="10" text-anchor="middle" font-weight="700">Acceptable region</text>
<circle cx="185" cy="268" r="1.8" fill="#1c1917"/>
<circle cx="226" cy="271" r="1.8" fill="#1c1917"/>
<circle cx="267" cy="267" r="1.8" fill="#1c1917"/>
<circle cx="309" cy="270" r="1.8" fill="#1c1917"/>
<circle cx="377" cy="264" r="1.8" fill="#1c1917"/>
<text x="10" y="241" font-size="10" text-anchor="start" font-weight="700">TOLERANCE</text>
<path d="M10,248 L106,248" fill="none" stroke="#1c1917" stroke-width="0.65"/>
<text x="10" y="263" font-size="9" text-anchor="start">acceptable product</text>
<text x="10" y="274" font-size="9" text-anchor="start">variation</text>
<path d="M185,279 L185,293" fill="none" stroke="#1c1917" stroke-width="0.8"/>
<text x="185" y="306" font-size="9" text-anchor="middle">within tolerance</text>
<path d="M185,310 L185,318" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<path d="M377,269 L377,293" fill="none" stroke="#1c1917" stroke-width="0.8"/>
<text x="377" y="306" font-size="9" text-anchor="middle">outside tolerance</text>
<path d="M377,310 L377,318" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="128" y="320" width="114" height="23" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="185" y="335" font-size="10" text-anchor="middle">Admitted change</text>
<rect x="320" y="320" width="114" height="23" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="377" y="335" font-size="10" text-anchor="middle">Revise / reject</text>
</g>
</svg>
