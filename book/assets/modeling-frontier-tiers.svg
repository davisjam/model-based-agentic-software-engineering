<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: modeling-frontier-tiers). REPLACES the 12-column modeling-ceiling matrix in
     the mainline (the full 12xN audit matrix moves to Appendix F). The matrix read as a scoreboard — a
     12/12 MAGE row beside everyone else's blanks. This figure states the actual comparative finding as
     THREE TIERS and marks where the PUBLIC EVIDENCE sits, not where organizational capability sits.
     RE-AXIS (260923, author's ruling): the vertical axis is NOT "richer representation" — a giant knowledge
     graph can be an extraordinarily rich representation while giving an engineer no independent control
     over realization. The axis measures INCREASING ABILITY FOR A REPRESENTATION TO PARTICIPATE IN
     ENGINEERING CONTROL, and the tiers are re-cut to that progression: engineering knowledge available to
     reasoning -> machine-checkable models of the governed system -> checked correspondence and enforceable
     obligations. Three stacked bands, bottom to top: Tier 1 (green, where the software-first corpus
     concentrates); Tier 2 (a warm neutral turn, where Siemens clearly reaches); Tier 3 (rust, where the
     originating case checks selected model-implementation relations and gives them consequences). The
     dashed rule between Tier 1 and Tier 2 is the OBSERVED FRONTIER — where the public software-first
     corpus falls quiet — and it carries its label in the open band below the rule, not across it. The
     right margin carries three evidence markers, not org-capability ratings; a source silent at a tier is
     not an organization that lacks it.
     Palette: Umber Monograph tokens (governed green #1f7a4d/#155c38 + tints #e3f0e7/#eef7f0 the knowledge
     tier, neutral #f3efe7 the model tier turn, accent #9a3f12 + tint #faf1e6 the correspondence tier, ink
     #1c1917 names, muted #57534e detail + captions, rule #e4e0d8, page #fdfcf9). Fonts 20-26 band at 1000px. -->
<!-- semantic-families: modeling, governance, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620"
     role="group" aria-labelledby="mctTitle mctDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mctTitle">The observed modeling frontier: where the public evidence concentrates</title>
  <desc id="mctDesc">Three stacked tiers, drawn bottom to top. The vertical axis measures how far a
    representation can participate in engineering control, not how rich the representation is. Tier 1,
    Engineering knowledge available to reasoning, is green and holds topology, ownership, policy,
    infrastructure, lineage, context, and skills; the seven public software-first sources concentrate here.
    Tier 2, Machine-checkable models of the governed system, is a warm neutral and holds behavior, process,
    scenarios, invariants, and traceability; Siemens reaches this tier from a model-first engineering
    tradition. Tier 3, Checked correspondence and enforceable obligations, is rust: mechanical checks over
    selected model-implementation relations, given consequences at admission; the originating case
    experiments here, and the public software-first reconstructions do not reach it. A dashed rule between
    Tier 1 and Tier 2 marks the observed software-first frontier, above which the public corpus falls
    quiet. The right margin marks where the public evidence sits, tier by tier, not where any
    organization's capability sits. A source silent at a tier is not evidence the organization lacks the
    capability.</desc>

  <rect x="0" y="0" width="1000" height="620" fill="#fdfcf9"/>
  <text x="500" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">The observed modeling frontier</text>
  <text x="500" y="70" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">Where the public evidence concentrates — not a rating of organizational capability.</text>

  <!-- Tier 3 (top) — Checked correspondence + enforceable obligations (rust) -->
  <rect x="70" y="100" width="620" height="108" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.8"/>
  <text x="94" y="132" font-size="20" font-weight="700" letter-spacing="1" fill="#9a3f12">TIER 3</text>
  <text x="94" y="160" font-size="20" font-weight="700" fill="#1c1917">Checked correspondence + enforceable obligations</text>
  <text x="94" y="186" font-size="20" fill="#57534e">selected model–implementation relations, enforced</text>
  <rect x="706" y="100" width="244" height="108" rx="10" fill="#fdfcf9" stroke="#9a3f12" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="828" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">Originating case</text>
  <text x="828" y="162" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">experiments here —</text>
  <text x="828" y="181" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">no public reconstruction</text>
  <text x="828" y="200" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">reaches it</text>

  <!-- Tier 2 (middle) — Machine-checkable models of the governed system (neutral turn) -->
  <rect x="70" y="222" width="620" height="108" rx="10" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="94" y="254" font-size="20" font-weight="700" letter-spacing="1" fill="#57534e">TIER 2</text>
  <text x="94" y="282" font-size="20" font-weight="700" fill="#1c1917">Machine-checkable models of the governed system</text>
  <text x="94" y="308" font-size="20" fill="#57534e">behavior · process · scenarios · invariants</text>
  <rect x="706" y="222" width="244" height="108" rx="10" fill="#fdfcf9" stroke="#57534e" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="828" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Siemens</text>
  <text x="828" y="294" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">reaches this tier from a</text>
  <text x="828" y="314" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">model-first tradition</text>

  <!-- the observed frontier: the software-first corpus falls quiet above Tier 1 -->
  <line x1="70" y1="344" x2="950" y2="344" stroke="#9a3f12" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text x="500" y="372" text-anchor="middle" font-size="20" font-style="italic" font-weight="700" fill="#9a3f12">the observed software-first frontier — the corpus falls quiet above the knowledge tier</text>

  <!-- Tier 1 (bottom) — Engineering knowledge available to reasoning (green) -->
  <rect x="70" y="386" width="620" height="108" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.8"/>
  <text x="94" y="418" font-size="20" font-weight="700" letter-spacing="1" fill="#155c38">TIER 1</text>
  <text x="94" y="446" font-size="20" font-weight="700" fill="#1c1917">Engineering knowledge available to reasoning</text>
  <text x="94" y="472" font-size="20" fill="#57534e">topology · ownership · policy · context · skills</text>
  <rect x="706" y="386" width="244" height="108" rx="10" fill="#eef7f0" stroke="#1f7a4d" stroke-width="1.8"/>
  <text x="828" y="424" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">Software-first sources</text>
  <text x="828" y="448" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">concentrate here —</text>
  <text x="828" y="468" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">the knowledge tier</text>

  <!-- the vertical axis: what the tiers measure -->
  <text x="40" y="297" text-anchor="middle" font-size="20" fill="#1f7a4d" transform="rotate(-90 40 297)">participation in engineering control ▲</text>

  <text x="500" y="528" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">Siemens reaches machine-checkable system models from a model-first tradition;</text>
  <text x="500" y="550" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">the originating case checks selected relations and gives them consequences.</text>
  <text x="500" y="576" text-anchor="middle" font-size="20" fill="#57534e">Tiers mark where the PUBLIC EVIDENCE sits.</text>
  <text x="500" y="598" text-anchor="middle" font-size="20" fill="#57534e">A source silent at a tier is not an organization that lacks the capability.</text>
</svg>
