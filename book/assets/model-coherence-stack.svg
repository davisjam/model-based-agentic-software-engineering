<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): the model-coherence flagship stack as a left-to-right pipeline of
     six parts. Two capability lanes by colour: authoritative knowledge (fleet blue — DATA, CONSUME, EMIT)
     and equal-to-reality (governed green — PARITY, DERIVE); the SEAL part (accent umber) is the product-
     side canonical seam. Mermaid can draw the flow but not carry the two-capability colour legend and the
     per-part action row in register. Palette: Umber Monograph tokens only (fleet #2f5169/#e7edf3, governed
     #1f7a4d/#e3f0e7, accent #9a3f12/#faf1e6, ink #1c1917, muted #57534e, rule #e4e0d8). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360"
     role="group" aria-labelledby="mcTitle mcDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mcTitle">The model-coherence stack: reason through the map, keep it equal to the territory</title>
  <desc id="mcDesc">Six parts run left to right in two capability lanes. Authoritative knowledge (fleet
    blue): DATA models the system as executable typed data; CONSUME reads the model live and never copies a
    snapshot; EMIT generates real artifacts back from the model. Equal to reality (governed green): PARITY
    fails the build when a model and reality disagree in either direction; DERIVE anchors every model-to-code
    edge on a resolvable symbol a lint re-checks, so a derived edge cannot drift. The final part, SEAL
    (accent umber), routes all mutation of a shipped format through one typed model held sole by a ban-lint —
    model coherence applied to the product. Read together: the map is executable, read live, held equal to
    the territory, and generated back into it.</desc>

  <defs>
    <marker id="mcArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- header -->
  <text x="44" y="36" font-size="19.2" font-weight="700" fill="#1c1917">The model-coherence stack — reason through the map, keep it equal to the territory</text>

  <!-- capability legend (stacked rows: three keys crammed on one 1200u row over-ran each other) -->
  <rect x="44" y="48" width="15" height="15" rx="3" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
  <text x="66" y="60" font-size="19.2" fill="#57534e">authoritative knowledge — the model is the source of truth</text>
  <rect x="44" y="76" width="15" height="15" rx="3" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>
  <text x="66" y="88" font-size="19.2" fill="#57534e">equal to reality — the map cannot silently drift</text>
  <rect x="44" y="104" width="15" height="15" rx="3" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.5"/>
  <text x="66" y="116" font-size="19.2" fill="#57534e">product seam — one typed door</text>

  <!-- ============ stage boxes ============ -->
  <!-- 1 DATA -->
  <rect x="44" y="150" width="168" height="78" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="128" y="186" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">DATA</text>
  <text x="128" y="210" text-anchor="middle" font-size="19.2" font-weight="600" fill="#2f5169">executable data</text>
  <!-- 2 CONSUME -->
  <rect x="228" y="150" width="168" height="78" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="312" y="186" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">CONSUME</text>
  <text x="312" y="210" text-anchor="middle" font-size="19.2" font-weight="600" fill="#2f5169">live-query</text>
  <!-- 3 PARITY -->
  <rect x="412" y="150" width="168" height="78" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="496" y="186" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">PARITY</text>
  <text x="496" y="210" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1f7a4d">parity gate</text>
  <!-- 4 DERIVE -->
  <rect x="596" y="150" width="168" height="78" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="680" y="186" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">DERIVE</text>
  <text x="680" y="210" text-anchor="middle" font-size="19.2" font-weight="600" fill="#1f7a4d">derived edges</text>
  <!-- 5 EMIT -->
  <rect x="780" y="150" width="168" height="78" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="864" y="186" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">EMIT</text>
  <text x="864" y="210" text-anchor="middle" font-size="19.2" font-weight="600" fill="#2f5169">codegen</text>
  <!-- 6 SEAL -->
  <rect x="964" y="150" width="168" height="78" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="1048" y="186" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">SEAL</text>
  <text x="1048" y="210" text-anchor="middle" font-size="19.2" font-weight="600" fill="#9a3f12">one-door seam</text>

  <!-- ============ per-part action row (free-floating) ============ -->
  <g font-size="19.2" font-style="italic" fill="#57534e" text-anchor="middle">
    <text x="128" y="252">structure as data</text>
    <text x="312" y="252">read, never copy</text>
    <text x="496" y="252">map equals territory</text>
    <text x="680" y="252">derive the join</text>
    <text x="864" y="252">model makes the code</text>
    <text x="1048" y="252">one mutation door</text>
  </g>

  <!-- ============ arrows ============ -->
  <g fill="none" stroke="#1c1917" stroke-width="2.2" marker-end="url(#mcArrow)">
    <path d="M14,189 L42,189"/>
    <path d="M212,189 L226,189"/>
    <path d="M396,189 L410,189"/>
    <path d="M580,189 L594,189"/>
    <path d="M764,189 L778,189"/>
    <path d="M948,189 L962,189"/>
  </g>

  <!-- synthesis caption -->
  <text x="600" y="308" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">The map is executable, read live, and held equal to the territory —</text>
  <text x="600" y="328" text-anchor="middle" font-size="19.2" font-weight="700" fill="#1c1917">so a context-bounded agent can trust what it queries.</text>
</svg>
