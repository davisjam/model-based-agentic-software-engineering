<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247.5 242" width="247.5" height="242" role="img" aria-labelledby="atTitle atDesc" font-family="&quot;Source Sans 3&quot;, sans-serif"><ns0:title xmlns:ns0="http://www.w3.org/2000/svg" id="atTitle">DocAble's attribution provenance model: a run of operations, each with recorded fields</ns0:title>
  <ns0:desc xmlns:ns0="http://www.w3.org/2000/svg" id="atDesc">A run contains operations. Each operation records its target, mutation, responsible
    pass, and retained evidence. This structured record carries the provenance model. A small secondary line shows the uses
    derived from it: audit, debugging, and changelog. The model is primary; the derived uses are secondary.</ns0:desc>

  <defs><marker id="a2f5169" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#2f5169"/></marker><marker id="a57534e" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#57534e"/></marker><marker id="a086438" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#086438"/></marker><marker id="a1c1917" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#1c1917"/></marker></defs>
<text x="123.75" y="12.0" text-anchor="middle" font-size="9" fill="#1c1917" font-weight="700">THE PROVENANCE MODEL</text>
<rect x="89" y="24" width="69.5" height="27" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="0.8"/>
<text x="123.75" y="41.0" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">RUN</text>
<path d="M123.75,51 L123.75,76" fill="none" stroke="#2f5169" stroke-width=".8" marker-end="url(#a2f5169)"/>
<text x="129" y="65.0" text-anchor="start" font-size="9" fill="#1c1917" font-style="italic">one run, many</text>
<text x="129" y="75.8" text-anchor="start" font-size="9" fill="#1c1917" font-style="italic">operations</text>
<rect x="8" y="77" width="231.5" height="73" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="1.25"/>
<text x="123.75" y="92.0" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">OPERATION*</text>
<text x="123.75" y="105.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">each records</text>
<rect x="16" y="116" width="41" height="25" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="0.8"/>
<text x="36.5" y="132.0" text-anchor="middle" font-size="9" fill="#1c1917" font-weight="700">target</text>
<rect x="63" y="116" width="51" height="25" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="0.8"/>
<text x="88.5" y="132.0" text-anchor="middle" font-size="9" fill="#1c1917" font-weight="700">mutation</text>
<rect x="120" y="116" width="56" height="25" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="0.8"/>
<text x="148.0" y="132.0" text-anchor="middle" font-size="9" fill="#1c1917" font-weight="700">pass</text>
<rect x="182" y="116" width="49" height="25" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="0.8"/>
<text x="206.5" y="132.0" text-anchor="middle" font-size="9" fill="#1c1917" font-weight="700">evidence</text>
<path d="M123.75,150 L123.75,174" fill="none" stroke="#57534e" stroke-width=".8" marker-end="url(#a57534e)"/>
<text x="130" y="165.0" text-anchor="start" font-size="9" fill="#1c1917" font-style="italic">derived views</text>
<rect x="43" y="175" width="161.5" height="25" rx="4" fill="#f6f4ef" stroke="#57534e" stroke-width="0.8"/>
<text x="123.75" y="191.0" text-anchor="middle" font-size="10" fill="#1c1917">audit · debugging · changelog</text>
<text x="123.75" y="214.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">The structured record carries the provenance model;</text>
<text x="123.75" y="224.8" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">audit, debugging, and changelog are derived from it,</text>
<text x="123.75" y="235.6" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">not maintained apart.</text>
</svg>
