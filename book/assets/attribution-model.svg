<?xml version="1.0" encoding="UTF-8"?>
<!-- 2.7 Provenance primary model (part2-v8-260814 re-author; folds to book/assets/).
     REVISION per v8 editor guidance (2.7-1): make the provenance MODEL primary. A run contains
     operations; each operation records target, mutation, pass, and evidence. That structured record is
     the figure's subject. A small, secondary outgoing line notes the derived uses (audit, debugging,
     changelog) — drawn small and gray so it reads as a consequence, not a co-equal half. Grammar: blue
     #2f5169 = the structured provenance model (run, operation, its fields); gray #57534e = the derived
     uses. Hand-authored (a model with a small derived-uses tail). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400"
     role="img" aria-labelledby="atTitle atDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="atTitle">DocAble's attribution provenance model: a run of operations, each with recorded fields</title>
  <desc id="atDesc">A run contains operations. Each operation records its target, mutation, responsible
    pass, and retained evidence. This structured record is the model. A small secondary line shows the uses
    derived from it: audit, debugging, and changelog. The model is primary; the derived uses are secondary.</desc>

  <defs>
    <marker id="at-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
    <marker id="at-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.2" fill="#2f5169">THE PROVENANCE MODEL</text>

  <!-- RUN (blue, prominent) -->
  <rect x="270" y="42" width="160" height="50" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.8"/>
  <text x="350" y="74" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">RUN</text>
  <line x1="350" y1="92" x2="350" y2="122" stroke="#2f5169" stroke-width="2.4" marker-end="url(#at-b)"/>
  <text x="362" y="112" font-size="13" font-style="italic" fill="#57534e">one run, many operations</text>

  <!-- OPERATION* with its recorded fields (the heart of the model) -->
  <rect x="150" y="124" width="400" height="118" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="350" y="153" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">OPERATION*</text>
  <text x="350" y="173" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">each records</text>
  <g fill="#fbfdff" stroke="#2f5169" stroke-width="1.8">
    <rect x="170" y="184" width="86" height="42" rx="8"/>
    <rect x="266" y="184" width="98" height="42" rx="8"/>
    <rect x="374" y="184" width="70" height="42" rx="8"/>
    <rect x="454" y="184" width="76" height="42" rx="8"/>
  </g>
  <g font-size="14.5" font-weight="700" fill="#2f5169" text-anchor="middle">
    <text x="213" y="210">target</text>
    <text x="315" y="210">mutation</text>
    <text x="409" y="210">pass</text>
    <text x="492" y="210">evidence</text>
  </g>

  <!-- secondary derived-uses tail (small, gray) -->
  <line x1="350" y1="242" x2="350" y2="278" stroke="#57534e" stroke-width="1.8" marker-end="url(#at-k)"/>
  <text x="362" y="266" font-size="12.5" font-style="italic" fill="#57534e">derived uses (secondary)</text>
  <rect x="215" y="280" width="270" height="42" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="1.8"/>
  <text x="350" y="306" text-anchor="middle" font-size="14.5" fill="#1c1917">audit &#183; debugging &#183; changelog</text>

  <!-- footer: protect the point -->
  <text x="350" y="356" text-anchor="middle" font-size="15" font-style="italic" fill="#1c1917">The structured record is the model; audit, debugging, and changelog</text>
  <text x="350" y="376" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">are derived from it, not maintained apart.</text>
</svg>
