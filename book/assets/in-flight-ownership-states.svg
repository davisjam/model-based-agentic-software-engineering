<?xml version="1.0" encoding="UTF-8"?>
<!-- 2.4 Ownership primary model (part2-content-revision-260814; folds to book/assets/).
     The in-flight ownership state model: a claim opens a PRIMARY ownership record carrying owner, epoch, and
     lifetime; a lease hands off to release on merge; and if the lifetime expires or the record goes stale,
     ownership falls to a reclaimable state where another actor may take it. The model names WHO owns the
     work, for HOW LONG, and what happens when the window lapses. Grammar: blue #2f5169 = the owned states
     (owner/epoch/lifetime, release); gray #57534e = the reclaim path — ownership lapses back to territory
     for another actor to claim. Hand-authored (an ownership state model, not a flowchart). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400"
     role="img" aria-labelledby="ioTitle ioDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="ioTitle">In-flight ownership: owner/epoch/lifetime, released on merge or reclaimed on expiry</title>
  <desc id="ioDesc">A claim opens a primary ownership record carrying owner, epoch, and lifetime. A lease
    transitions it to release when work merges. If the lifetime expires or the record becomes stale,
    ownership falls to a reclaimable state where another actor may take it. The model makes explicit who
    owns the work, for how long, and what happens when the window lapses.</desc>

  <defs>
    <marker id="io-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
    <marker id="io-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
  </defs>

  <text x="380" y="34" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.2" fill="#2f5169">IN-FLIGHT OWNERSHIP</text>

  <!-- claim in -->
  <text x="150" y="74" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">claim</text>
  <line x1="150" y1="82" x2="150" y2="112" stroke="#2f5169" stroke-width="2.2" marker-end="url(#io-b)"/>
  <!-- merge in -->
  <text x="600" y="74" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">merge</text>
  <line x1="600" y1="82" x2="600" y2="112" stroke="#2f5169" stroke-width="2.2" marker-end="url(#io-b)"/>

  <!-- PRIMARY owner record (blue) -->
  <rect x="45" y="114" width="210" height="112" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="150" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">owner</text>
  <text x="150" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">epoch</text>
  <text x="150" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">lifetime</text>
  <text x="150" y="214" text-anchor="middle" font-size="12.5" font-style="italic" fill="#57534e">PRIMARY record</text>

  <!-- lease -> release (blue) -->
  <line x1="255" y1="150" x2="493" y2="150" stroke="#2f5169" stroke-width="2.4" marker-end="url(#io-b)"/>
  <text x="374" y="140" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">lease</text>

  <!-- release (blue) -->
  <rect x="495" y="114" width="210" height="72" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="600" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">release</text>

  <!-- expires/stale -> reclaimable (gray) -->
  <line x1="150" y1="226" x2="150" y2="284" stroke="#57534e" stroke-width="2.4" stroke-dasharray="8 5" marker-end="url(#io-k)"/>
  <text x="162" y="262" font-size="14" font-style="italic" fill="#57534e">expires / becomes stale</text>

  <!-- reclaimable (gray) -->
  <rect x="45" y="286" width="210" height="66" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>
  <text x="150" y="316" text-anchor="middle" font-size="18" font-weight="700" fill="#57534e">reclaimable</text>
  <text x="150" y="338" text-anchor="middle" font-size="12.5" font-style="italic" fill="#57534e">another actor may claim</text>

  <!-- footer: protect the point -->
  <text x="440" y="316" text-anchor="middle" font-size="15.5" font-style="italic" fill="#1c1917">The model names who owns the work</text>
  <text x="440" y="338" text-anchor="middle" font-size="15.5" font-style="italic" fill="#1c1917">and for how long &#8212; expiry is a state, not an accident.</text>
</svg>
