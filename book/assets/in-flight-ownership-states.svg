<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 225" width="270" height="225" role="img" aria-labelledby="ioTitle ioDesc" font-family="&quot;Source Sans 3&quot;, sans-serif"><ns0:title xmlns:ns0="http://www.w3.org/2000/svg" id="ioTitle">In-flight ownership: CLAIMED releases on completion or becomes reclaimable on expiry</ns0:title>
  <ns0:desc xmlns:ns0="http://www.w3.org/2000/svg" id="ioDesc">A claim opens the CLAIMED state, carrying owner, epoch, and expires_at. Two
    transitions leave it. Completion releases the claim to a RELEASED outcome. Expiry moves it to RECLAIMABLE,
    a lapsed state from which another actor may claim it again. The model distinguishes a live claim from a
    stale one and states when the window has lapsed, without representing the storage machinery that
    implements the lease.</ns0:desc>

  <defs><marker id="a2f5169" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#2f5169"/></marker><marker id="a57534e" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#57534e"/></marker><marker id="a086438" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#086438"/></marker><marker id="a1c1917" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#1c1917"/></marker></defs>
<text x="135" y="12.0" text-anchor="middle" font-size="9" fill="#1c1917" font-weight="700">IN-FLIGHT OWNERSHIP</text>
<text x="126" y="26.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">claim</text>
<path d="M126,29 L126,40" fill="none" stroke="#2f5169" stroke-width=".8" marker-end="url(#a2f5169)"/>
<rect x="50" y="41" width="152" height="41" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="1.25"/>
<text x="126" y="58.0" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">CLAIMED</text>
<text x="126" y="73.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">owner · epoch · expires_at</text>
<path d="M94,82 L94,103 L64,103 L64,127" fill="none" stroke="#086438" stroke-width=".8" marker-end="url(#a086438)"/>
<text x="64" y="98.0" text-anchor="middle" font-size="9" fill="#086438" font-weight="700">completion</text>
<path d="M161,82 L161,103 L196,103 L196,127" fill="none" stroke="#57534e" stroke-width=".8" stroke-dasharray="3 2" marker-end="url(#a57534e)"/>
<text x="196" y="98.0" text-anchor="middle" font-size="9" fill="#57534e" font-weight="700">expiry</text>
<rect x="8" y="128" width="112" height="37" rx="4" fill="#e4efe8" stroke="#086438" stroke-width="0.8"/>
<text x="64" y="143.0" text-anchor="middle" font-size="10" fill="#086438" font-weight="700">RELEASED</text>
<text x="64" y="157.0" text-anchor="middle" font-size="9" fill="#086438" font-style="italic">claim ends cleanly</text>
<rect x="140" y="128" width="112" height="37" rx="4" fill="#f6f4ef" stroke="#57534e" stroke-width="0.8"/>
<text x="196" y="143.0" text-anchor="middle" font-size="10" fill="#57534e" font-weight="700">RECLAIMABLE</text>
<text x="196" y="157.0" text-anchor="middle" font-size="9" fill="#57534e" font-style="italic">lease lapsed / stale</text>
<path d="M252,146 L263,146 L263,61 L202,61" fill="none" stroke="#57534e" stroke-width=".8" stroke-dasharray="3 2" marker-end="url(#a57534e)"/>
<text x="233" y="84.0" text-anchor="middle" font-size="9" fill="#57534e" font-style="italic">another actor</text>
<text x="233" y="94.8" text-anchor="middle" font-size="9" fill="#57534e" font-style="italic">may claim</text>
<text x="135" y="185.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">Completion releases the claim; expiry makes it reclaimable.</text>
<text x="135" y="195.8" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">A live claim is distinguishable from a stale one —</text>
<text x="135" y="206.6" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">expiry is a state, not an accident.</text>
</svg>
