  <text x="205" y="441" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1917">governance</text>
  <rect x="260" y="398" width="102" height="54" rx="6" fill="#fdfcf9" stroke="#9a3f12" stroke-width="1.8"/>
