<!-- REDRAW DRAFT (figures-redraw) of the Open Frontiers / Research-Agenda map, per
     open-frontiers-figure-DESIGN-260807.md §1. ONE claim: the open work of MAGE partitions into FOUR KINDS
     (Frontiers · Measurement · Dynamics · Generalization), and every piece is welded by a dropper edge to
     the hypothesis (H1-H8) that makes it falsifiable. The map INDEXES, it does not re-illustrate: each item
     stays a titled box (title only; homes ride in the caption + desc), and ONLY the governance-census node
     expands into its named parts — three established metric chips (Coverage, Under-governance,
     Governance-debt) plus one DASHED conjectured chip (propagation-latency, the future 4th metric that ties
     the census to H8). STATUS is carried on the border: open = solid 1.8u, established = solid 2.6u,
     conjectured = dashed. COLOUR follows the house semantic language, carried on the stroke so the map reads
     in grayscale (every node also carries its title): green #1f7a4d modeling/knowledge, rust #9a3f12
     governance/policy, blue #2f5169 agent/autonomy. Two inter-item edges only, each itself a book claim:
     A2 -> A1 "richer models move it" (green, 6.1 causal loop) and the census's propagation-latency chip ⇢
     A6 "future metric" (dashed, the one place the four regions touch). The H1-H8 anchor rail across the foot
     is eight compact badges (id + one-word name), NOT a re-draw of the Eight-Hypotheses table. Palette: Umber
     Monograph tokens (ink #1c1917, paper #fdfcf9, muted #57534e, gray #78716c, rule #e4e0d8, tints
     #faf1e6/#e3f0e7/#e7edf3, dropper #c7c2b9). Fonts in the 16-28 band at the 1000px reference. Homes named
     in the caption + desc (the consolidate-don't-duplicate contract). None is settled here. -->
<!-- semantic-families: agent, governance, modeling, neutral -->
<!-- edge-grammar: keep-angles -->
<!-- KEEP curves (Pass B2): region-to-region hypothesis-mapping — many long droppers spanning the map;
     elbowing them all would tangle the index. Dense/high-crossing figure. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720"
     role="group" aria-labelledby="ofTitle ofDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="ofTitle">Where the frontier goes next: the open work of MAGE partitions into four kinds, each anchored to the hypothesis that makes it falsifiable</title>
  <desc id="ofDesc">A research-program map. The open work of MAGE sorts into four kinds, drawn as four
    regions, and every item is a titled box joined by a thin dropper edge down to the eight hypotheses that
    make it testable. FRONTIERS holds four items: Determinization frontier — how far judgment compiles into
    machinery — open, rust, anchored to H3 mechanized-assurance and H4 representation-leverage, home section
    6.5; Modeling moves the frontier — richer models expand what alignment can determinize — open, green,
    anchored to H4, home 6.1; Assurance frontier, the MAGE-II conjecture — conjectured, dashed, rust,
    anchored to H3, home 6.2; Development completeness and supply chain — open, green, anchored to H7
    conversion-conditions, home 6.2. MEASUREMENT holds one item: the Governance census — established, rust,
    the one node that expands into three metric chips, Coverage, Under-governance, and Governance-debt, plus
    one dashed conjectured chip, propagation-latency, the proposed fourth metric — anchored to H3, H6
    oversight-amortization, and H8 learning-propagation, home 6.5. DYNAMICS holds one item: Learning
    propagation and organizational scaling — open, blue, anchored to H1 failure-class-exposure, H7, and H8,
    homes 6.1 and 6.5. GENERALIZATION holds one item: Generalization beyond software, MBAE — conjectured,
    dashed, green, anchored to H4, home 6.5. Two inter-item edges carry book claims: Modeling moves the
    frontier points to the Determinization frontier, labelled richer models move it; and the census's
    propagation-latency chip points to Learning propagation, labelled future metric. The anchor rail across
    the foot names the eight hypotheses: H1 exposure, H2 moderation, H3 assurance, H4 leverage, H5
    deficiency, H6 amortization, H7 conversion, H8 propagation. Border style encodes status: solid for open
    and established, dashed for a conjecture the book states but does not prove. None is settled here.</desc>

  <defs>
    <marker id="of-drop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/>
    </marker>
    <marker id="of-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
    <marker id="of-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#fdfcf9"/>
  <text x="500" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">Where the frontier goes next</text>
  <text x="500" y="64" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">The open work of MAGE sorts into four kinds — each welded to the hypothesis that makes it falsifiable.</text>

  <!-- legend: status border key (left) + colour key (right) -->
  <g font-size="16" fill="#57534e">
    <rect x="40" y="80" width="26" height="16" rx="3" fill="#fdfcf9" stroke="#57534e" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="72" y="93">conjectured</text>
    <rect x="182" y="80" width="26" height="16" rx="3" fill="#fdfcf9" stroke="#57534e" stroke-width="1.8"/>
    <text x="214" y="93">open</text>
    <rect x="266" y="80" width="26" height="16" rx="3" fill="#fdfcf9" stroke="#57534e" stroke-width="2.6"/>
    <text x="298" y="93">established</text>
    <circle cx="566" cy="88" r="7" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
    <text x="580" y="93">modeling</text>
    <circle cx="690" cy="88" r="7" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <text x="704" y="93">governance</text>
    <circle cx="836" cy="88" r="7" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="850" y="93">autonomy</text>
  </g>

