<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: interlude-graph-two-partitions). Two EXECUTION POLICIES over one remediation
     graph. (a) Page-oriented execution: the same seven-node DAG (three local -> document -> three down)
     with page-affinity boxes drawn around nodes from DIFFERENT causal levels, so one page slice contains
     work that is not all ready at once. (b) Frontier execution: three sequential READY-SET snapshots — the
     ready set {local,local,local} dispatches as one wave; on completion its outputs satisfy dependencies
     and expose {document}; that completes and exposes {down,down,down}. The arrows between snapshots carry
     the executor step (complete -> materialize outputs -> derive next ready set), so "frontier" reads as a
     changing ready set, not a static topological band. Same graph; only the partition changes. -->
<!-- semantic-families: modeling, governance -->
<!-- edge-grammar: keep-angles -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380"
     role="group" aria-labelledby="tpTitle tpDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="tpTitle">Page-oriented execution and frontier execution over the same remediation graph</title>
  <desc id="tpDesc">Two panels. (a) Page-oriented execution draws the seven-node remediation graph — three
    local semantic-work nodes feeding a document-level node feeding three downstream nodes — with three page
    boxes, each grouping a local node and a downstream node from different dependency levels, so a page slice
    contains work that is not all ready at the same time. (b) Frontier execution shows three sequential ready
    sets: first the three local nodes dispatch together as one wave; when they complete, their outputs
    satisfy dependencies and expose the document node; when it completes it exposes the three downstream
    nodes. Arrows between the snapshots read: complete, materialize outputs, derive the next ready set.</desc>

  <defs>
    <marker id="tp-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="tp-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="380" fill="#fdfcf9"/>
  <line x1="460" y1="44" x2="460" y2="360" stroke="#e7e2d6" stroke-width="1.5"/>

  <!-- ===== Panel (a): page-oriented execution ===== -->
  <text x="30" y="30" font-size="18" font-weight="700" fill="#57534e">(a) Page-oriented execution</text>

  <!-- page-affinity boxes: each spans a local (frontier 1) and a down (frontier 3) node — different levels -->
  <rect x="44" y="52" width="96" height="256" rx="10" fill="#faf1e6" opacity="0.7"/>
  <rect x="162" y="52" width="96" height="256" rx="10" fill="#f0e7d8" opacity="0.7"/>
  <rect x="280" y="52" width="96" height="256" rx="10" fill="#faf1e6" opacity="0.7"/>

  <!-- edges -->
  <g stroke="#57534e" stroke-width="1.8">
    <line x1="92" y1="104" x2="210" y2="160" marker-end="url(#tp-ah)"/>
    <line x1="210" y1="104" x2="210" y2="160" marker-end="url(#tp-ah)"/>
    <line x1="328" y1="104" x2="210" y2="160" marker-end="url(#tp-ah)"/>
    <line x1="210" y1="204" x2="92" y2="260" marker-end="url(#tp-ah)"/>
    <line x1="210" y1="204" x2="210" y2="260" marker-end="url(#tp-ah)"/>
    <line x1="210" y1="204" x2="328" y2="260" marker-end="url(#tp-ah)"/>
  </g>

  <!-- nodes -->
  <g font-size="14" fill="#1c1917" text-anchor="middle">
    <rect x="60" y="64" width="64" height="40" rx="6" fill="#fff" stroke="#1c1917" stroke-width="1.8"/><text x="92" y="89">local</text>
    <rect x="178" y="64" width="64" height="40" rx="6" fill="#fff" stroke="#1c1917" stroke-width="1.8"/><text x="210" y="89">local</text>
    <rect x="296" y="64" width="64" height="40" rx="6" fill="#fff" stroke="#1c1917" stroke-width="1.8"/><text x="328" y="89">local</text>
    <rect x="170" y="160" width="80" height="44" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/><text x="210" y="186">document</text>
    <rect x="60" y="260" width="64" height="40" rx="6" fill="#fff" stroke="#1c1917" stroke-width="1.8"/><text x="92" y="285">down</text>
    <rect x="178" y="260" width="64" height="40" rx="6" fill="#fff" stroke="#1c1917" stroke-width="1.8"/><text x="210" y="285">down</text>
    <rect x="296" y="260" width="64" height="40" rx="6" fill="#fff" stroke="#1c1917" stroke-width="1.8"/><text x="328" y="285">down</text>
  </g>
  <g font-size="12.5" font-weight="700" fill="#9a3f12" text-anchor="middle">
    <text x="92" y="326">Page 1</text>
    <text x="210" y="326">Page 2</text>
    <text x="328" y="326">Page 3</text>
  </g>
  <text x="210" y="350" text-anchor="middle" font-size="14" font-style="italic" fill="#9a3f12">one page slice spans several dependency levels</text>

  <!-- ===== Panel (b): frontier execution — three sequential ready sets ===== -->
  <text x="500" y="30" font-size="18" font-weight="700" fill="#57534e">(b) Frontier execution</text>

  <!-- snapshot 1: ready = {local, local, local} -->
  <rect x="535" y="52" width="210" height="64" rx="10" fill="#e3f0e7" opacity="0.55" stroke="#1f7a4d" stroke-width="1.6"/>
  <text x="545" y="71" font-size="12.5" font-weight="700" fill="#1f7a4d">ready set</text>
  <g font-size="13" fill="#1c1917" text-anchor="middle">
    <rect x="543" y="80" width="52" height="28" rx="5" fill="#fff" stroke="#1c1917" stroke-width="1.6"/><text x="569" y="99">local</text>
    <rect x="601" y="80" width="52" height="28" rx="5" fill="#fff" stroke="#1c1917" stroke-width="1.6"/><text x="627" y="99">local</text>
    <rect x="659" y="80" width="52" height="28" rx="5" fill="#fff" stroke="#1c1917" stroke-width="1.6"/><text x="685" y="99">local</text>
  </g>

  <line x1="640" y1="118" x2="640" y2="152" stroke="#9a3f12" stroke-width="2" marker-end="url(#tp-rust)"/>
  <g font-size="12" font-style="italic" fill="#57534e">
    <text x="752" y="130">complete → outputs</text>
    <text x="752" y="147">→ next ready set</text>
  </g>

  <!-- snapshot 2: ready = {document} -->
  <rect x="535" y="156" width="210" height="64" rx="10" fill="#e3f0e7" opacity="0.55" stroke="#1f7a4d" stroke-width="1.6"/>
  <text x="545" y="175" font-size="12.5" font-weight="700" fill="#1f7a4d">ready set</text>
  <g font-size="13" fill="#1c1917" text-anchor="middle">
    <rect x="600" y="184" width="80" height="28" rx="5" fill="#e7edf3" stroke="#2f5169" stroke-width="1.8"/><text x="640" y="203">document</text>
  </g>

  <line x1="640" y1="222" x2="640" y2="256" stroke="#9a3f12" stroke-width="2" marker-end="url(#tp-rust)"/>
  <g font-size="12" font-style="italic" fill="#57534e">
    <text x="752" y="234">complete → outputs</text>
    <text x="752" y="251">→ next ready set</text>
  </g>

  <!-- snapshot 3: ready = {down, down, down} -->
  <rect x="535" y="260" width="210" height="64" rx="10" fill="#e3f0e7" opacity="0.55" stroke="#1f7a4d" stroke-width="1.6"/>
  <text x="545" y="279" font-size="12.5" font-weight="700" fill="#1f7a4d">ready set</text>
  <g font-size="13" fill="#1c1917" text-anchor="middle">
    <rect x="543" y="288" width="52" height="28" rx="5" fill="#fff" stroke="#1c1917" stroke-width="1.6"/><text x="569" y="307">down</text>
    <rect x="601" y="288" width="52" height="28" rx="5" fill="#fff" stroke="#1c1917" stroke-width="1.6"/><text x="627" y="307">down</text>
    <rect x="659" y="288" width="52" height="28" rx="5" fill="#fff" stroke="#1c1917" stroke-width="1.6"/><text x="685" y="307">down</text>
  </g>

  <text x="640" y="350" text-anchor="middle" font-size="14" font-style="italic" fill="#1f7a4d">dispatch the currently ready nodes, wave by wave</text>
</svg>
