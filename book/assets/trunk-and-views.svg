<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): a trunk-and-branches figure. One shared trunk of
     drift-proof machinery feeds five Kruchten views (Logical, Process, Development,
     Physical, Scenarios), each fanning up from the same spine. Mermaid's flowchart
     would draw a tree but not the "one trunk holds every branch true" reading — the
     branches share a base that keeps them all executable, which is the chapter's whole
     claim. Palette matches the book accent (#2f5169). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"
     role="group" aria-labelledby="tvTitle tvDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="tvTitle">One shared substrate, five Kruchten views branching from it</title>
  <desc id="tvDesc">A shared trunk sits at the base: the executable source-of-truth, the drift
    and parity gates, the agent-first harness, and the read-and-generate surfaces — the machinery
    that makes every view executable and holds each one true against the code. Five branches fan
    up from that trunk, each a Kruchten view: the Logical view (what the system is), the Process
    view (what runs at once), the Development view (how the source is organized), the Physical view
    (where the parts live), and the Scenarios view (what the system does for someone, the +1 that
    validates the other four). The reading: no single view is the whole picture, and the one trunk
    keeps all five from drifting away from the code.</desc>

  <defs>
    <marker id="tvUp" markerWidth="9" markerHeight="9" refX="9" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <!-- +x convention: apex at max-x; orient="auto" rotates it onto the line -->
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f5169"/>
    </marker>
  </defs>

  <!-- ================= THE FIVE VIEW BRANCHES (top) ================= -->
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">Five views — no one of them the whole picture</text>

  <!-- branch boxes; the +1 (Scenarios) is accent-filled to mark it as the validator -->
  <g>
    <rect id="logical" x="40"  y="70" width="164" height="74" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
    <text x="122" y="102" text-anchor="middle" font-size="24" font-weight="700" fill="#2f5169">Logical</text>
    <text x="122" y="128" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">what it is</text>

    <rect id="process" x="223" y="70" width="164" height="74" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
    <text x="305" y="102" text-anchor="middle" font-size="24" font-weight="700" fill="#2f5169">Process</text>
    <text x="305" y="128" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">runs at once</text>

    <rect id="development" x="406" y="70" width="188" height="74" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
    <text x="500" y="102" text-anchor="middle" font-size="24" font-weight="700" fill="#2f5169">Development</text>
    <text x="500" y="128" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">how it’s packaged</text>

    <rect id="physical" x="613" y="70" width="164" height="74" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
    <text x="695" y="102" text-anchor="middle" font-size="24" font-weight="700" fill="#2f5169">Physical</text>
    <text x="695" y="128" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">where it runs</text>

    <rect id="scenarios" x="796" y="70" width="164" height="74" rx="8" fill="#2f5169" stroke="#2f5169" stroke-width="2.5"/>
    <text x="878" y="98"  text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Scenarios</text>
    <text x="878" y="122" text-anchor="middle" font-size="18" fill="#e7edf3">the +1 —</text>
    <text x="878" y="140" text-anchor="middle" font-size="18" fill="#e7edf3">validates the four</text>
  </g>

  <!-- branch stems fanning up from the trunk bar (y=300) to each box base (y=144) -->
  <g stroke="#2f5169" stroke-width="2.5" fill="none">
    <!-- edge: trunk -> logical -->
    <path d="M122,300 L122,146" marker-end="url(#tvUp)"/>
    <!-- edge: trunk -> process -->
    <path d="M305,300 L305,146" marker-end="url(#tvUp)"/>
    <!-- edge: trunk -> development -->
    <path d="M500,300 L500,146" marker-end="url(#tvUp)"/>
    <!-- edge: trunk -> physical -->
    <path d="M695,300 L695,146" marker-end="url(#tvUp)"/>
    <!-- edge: trunk -> scenarios -->
    <path d="M878,300 L878,146" marker-end="url(#tvUp)"/>
  </g>

  <!-- ================= THE SHARED TRUNK (bottom) ================= -->
  <!-- the trunk bar every branch grows from -->
  <rect id="trunk" x="40" y="300" width="920" height="8" rx="4" fill="#2f5169"/>
  <text x="500" y="342" text-anchor="middle" font-size="26" font-weight="700" fill="#2f5169">Shared substrate — machinery that keeps the views connected</text>

  <!-- the four trunk components -->
  <g>
    <rect x="40"  y="356" width="214" height="82" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <text x="147" y="388" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Executable</text>
    <text x="147" y="412" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">source-of-truth</text>

    <rect x="275" y="356" width="214" height="82" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <text x="382" y="388" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Drift + parity</text>
    <text x="382" y="412" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">gates</text>

    <rect x="510" y="356" width="214" height="82" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <text x="617" y="388" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Agent-first</text>
    <text x="617" y="412" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">harness</text>

    <rect x="746" y="356" width="214" height="82" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <text x="853" y="388" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Read + generate</text>
    <text x="853" y="412" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">surfaces</text>
  </g>
</svg>
