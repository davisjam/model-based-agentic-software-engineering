<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 212" width="270" height="212" role="img" aria-labelledby="sfTitle sfDesc" font-family="&quot;Source Sans 3&quot;, sans-serif"><ns0:title xmlns:ns0="http://www.w3.org/2000/svg" id="sfTitle">DocAble's service-flow model: which services may communicate</ns0:title>
  <ns0:desc xmlns:ns0="http://www.w3.org/2000/svg" id="sfDesc">A declared directed graph. The Internet reaches the web service. Web reaches worker,
    document editor, and other. Worker reaches generation, render, and OCR. Each edge is a declared,
    permitted relationship; an absent edge means the model does not declare that relationship.</ns0:desc>

