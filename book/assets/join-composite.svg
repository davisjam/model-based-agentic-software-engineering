<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (ported from the chapter's mermaid fence, label: join-composite).
     REVISION (Part-3 §XII / FIG-3.6-1): ENLARGED vertically (this is the Part's flagship figure)
     and SIMPLIFIED — the parenthetical model IDs (M13/M6/M5/M7) are dropped from the panel titles
     (they move to the caption legend, stated once); the Scheduler is collapsed to ONE box that
     emits the plan; and the three cross-panel JOIN edges are drawn as the heaviest strokes, since
     the join is the figure's subject. The fan-out / serialize distinction is carried by SHAPE
     (rounded pill vs square block) and label, never by colour alone. Palette: Umber Monograph
     tokens (fleet #2f5169 machinery, accent #9a3f12 criticality, governed #1f7a4d the plan). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720"
     role="group" aria-labelledby="jcTitle jcDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="jcTitle">The four-model join: journey to selector to coverage to scheduler</title>
  <desc id="jcDesc">Four panels compose on one shared key. The Journey panel names a goal with
    criticality MAJOR, which calls an endpoint. A thick join edge carries that endpoint into the
    Selector panel, whose “major?” test derives the test tier: a major endpoint runs local plus
    staging, a minor one staging only, and a coverage-floor lint fails if a major endpoint has no
    local test. A second thick join edge carries the same endpoint down into the Coverage panel,
    whose “covered?” check joins on that node to ask whether it is tested at all. A third thick join
    edge carries the resulting test set into the Scheduler, drawn as one box that reads a per-host
    profile and emits the plan: a rounded pill for fan-out in parallel when only a cost gate applies,
    a square block for serialize when a cost gate and a scarce host combine. Shape, not colour,
    marks the two plan modes.</desc>

  <defs>
    <marker id="jc-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <!-- heavier arrowhead for the JOIN edges (the figure's subject) -->
    <marker id="jc-join" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="jc-join-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <!-- ===== Journey ===== -->
  <rect x="20" y="60" width="280" height="330" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="36" y="94" font-size="22" font-weight="700" fill="#1c1917">Journey</text>

  <rect x="40" y="112" width="230" height="104" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="155" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Journey: goal</text>
  <text x="155" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">criticality: MAJOR</text>

  <line x1="155" y1="216" x2="155" y2="264" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>
  <text x="178" y="246" font-size="18" font-style="italic" fill="#57534e">calls</text>

  <polygon points="82,272 250,272 238,330 70,330" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="155" y="306" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">endpoint</text>

  <!-- ===== Selector ===== -->
  <rect x="310" y="60" width="400" height="470" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="326" y="94" font-size="22" font-weight="700" fill="#1c1917">Selector</text>

  <!-- JOIN edge 1: endpoint -> selector (criticality derives the tier) -->
  <path d="M252,300 C330,262 380,214 428,178" fill="none" stroke="#1c1917" stroke-width="4" marker-end="url(#jc-join)"/>

  <polygon points="510,116 596,176 510,236 424,176" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="510" y="184" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">major?</text>

  <path d="M486,222 C466,246 452,258 442,272" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>
  <text x="454" y="250" text-anchor="end" font-size="18" font-style="italic" fill="#57534e">yes</text>
  <path d="M534,222 C566,248 588,258 616,272" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>
  <text x="600" y="250" font-size="18" font-style="italic" fill="#57534e">no</text>

  <rect id="local-staging" x="345" y="276" width="200" height="64" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="445" y="314" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">local + staging</text>

  <rect id="staging-only" x="560" y="276" width="140" height="64" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="630" y="314" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">staging only</text>

  <line x1="445" y1="340" x2="455" y2="392" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>

  <polygon points="355,432 382,398 578,398 605,432 578,466 382,466"
           fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="480" y="439" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Coverage-floor lint</text>

  <!-- ===== Coverage ===== -->
  <rect x="20" y="420" width="280" height="240" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="36" y="454" font-size="22" font-weight="700" fill="#1c1917">Coverage</text>

  <g>
    <path d="M 60,494 v 70 a 95,10 0 0 0 190,0 v -70" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <ellipse cx="155" cy="494" rx="95" ry="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="155" y="540" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">covered?</text>
  </g>

  <!-- JOIN edge 2: endpoint -> coverage (same node, checked for any test at all) -->
  <line x1="200" y1="332" x2="200" y2="482" stroke="#57534e" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#jc-join-mut)"/>
  <text x="214" y="408" font-size="18" font-style="italic" fill="#57534e">node join</text>

  <!-- covered? feeds the floor lint -->
  <path d="M252,516 C300,498 322,468 352,438" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>

  <!-- ===== Scheduler (ONE box emits the plan) ===== -->
  <rect x="730" y="60" width="430" height="470" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="746" y="94" font-size="22" font-weight="700" fill="#1c1917">Scheduler</text>

  <rect id="plan-host" x="800" y="150" width="290" height="88" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="945" y="188" text-anchor="middle" font-size="23" font-weight="700" fill="#1c1917">plan_for(host)</text>
  <text x="945" y="216" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">reads the per-host profile</text>

  <!-- JOIN edge 3: the resulting test set -> scheduler (both tiers feed the plan; seat on plan's left border) -->
  <!-- edge: local-staging -> plan-host -->
  <path d="M545,300 C640,250 766,184 796,184" fill="none" stroke="#1c1917" stroke-width="4" marker-end="url(#jc-join)"/>
  <!-- edge: staging-only -> plan-host -->
  <path d="M700,300 C744,268 766,204 796,204" fill="none" stroke="#1c1917" stroke-width="4" marker-end="url(#jc-join)"/>

  <!-- the plan's two modes: SHAPE encodes parallel (rounded) vs serialize (square) -->
  <!-- edge: plan-host -> fan-out -->
  <path d="M810,238 C800,290 850,322 850,352" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>
  <text x="880" y="330" font-size="18" font-style="italic" fill="#57534e">cost gate only</text>
  <rect id="fan-out" x="770" y="356" width="320" height="60" rx="30" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="930" y="393" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">fan out — parallel</text>

  <!-- edge: plan-host -> serialize -->
  <path d="M830,238 C790,340 812,432 812,462" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#jc-ah)"/>
  <text x="880" y="448" font-size="18" font-style="italic" fill="#57534e">cost gate + a scarce host</text>
  <rect id="serialize" x="770" y="466" width="320" height="60" rx="6" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="930" y="503" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">serialize — fan / join</text>
</svg>
