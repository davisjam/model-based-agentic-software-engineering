<?xml version="1.0" encoding="UTF-8"?>
<!-- R56-A figure round — context-delivery-stack.svg, shared vocabulary per R56-FIGURE-MANIFEST. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620"
     role="img" aria-labelledby="cdTitle cdDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="cdTitle">The Context-Delivery stack: standing policy and a retrieved task slice compose into
    actor context that reaches the action; point-of-action reinforcement is a dashed enhancement</title>
  <desc id="cdDesc">Engineering knowledge — models, rules, decisions — feeds two solid load-bearing lanes.
    STANDING POLICY supplies compact policy that is always seen. TASK SLICE retrieves task-relevant context as
    needed. Both converge into ACTOR CONTEXT, which the actor carries into the ACTION. One enhancement attaches
    as a dashed, open-arrowed reinforcement: POINT-OF-ACTION reminders reassert obligations where useful.
    Context is a reasoning aid, not authority: critical decidable properties graduate out of briefing entirely
    and into deterministic controls.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0.5,0.5 L9.5,5 L0.5,9.5" fill="none" stroke="#57534e" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- ENGINEERING KNOWLEDGE -->
  <rect id="eng-knowledge" x="240" y="24" width="340" height="56" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="410" y="49" text-anchor="middle" font-size="17" font-weight="700" fill="#155c38">ENGINEERING KNOWLEDGE</text>
  <text x="410" y="70" text-anchor="middle" font-size="14" fill="#57534e">models &#183; rules &#183; decisions</text>

  <!-- fork to two lanes -->
  <g stroke="#2f5169" stroke-width="2.4" fill="none" marker-end="url(#ah)">
    <!-- edge: eng-knowledge -> standing-policy -->
    <path d="M305,80 L305,140"/>
    <!-- edge: eng-knowledge -> task-slice -->
    <path d="M515,80 L515,140"/>
  </g>

  <!-- STANDING POLICY -->
  <rect id="standing-policy" x="150" y="142" width="220" height="74" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="260" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">STANDING POLICY</text>
  <text x="260" y="194" text-anchor="middle" font-size="14" fill="#57534e">always seen</text>

  <!-- TASK SLICE -->
  <rect id="task-slice" x="450" y="142" width="220" height="74" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="560" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">TASK SLICE</text>
  <text x="560" y="194" text-anchor="middle" font-size="14" fill="#57534e">retrieved as needed</text>

  <!-- converge to ACTOR CONTEXT -->
  <g stroke="#2f5169" stroke-width="2.4" fill="none" marker-end="url(#ah)">
    <!-- edge: standing-policy -> actor-context -->
    <path d="M335,216 L335,270"/>
    <!-- edge: task-slice -> actor-context -->
    <path d="M485,216 L485,270"/>
  </g>

  <!-- ACTOR CONTEXT -->
  <rect id="actor-context" x="300" y="272" width="220" height="62" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="410" y="309" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">ACTOR CONTEXT</text>

  <!-- edge: actor-context -> action -->
  <line x1="410" y1="334" x2="410" y2="378" stroke="#2f5169" stroke-width="2.4" marker-end="url(#ah)"/>

  <!-- ACTION -->
  <rect id="action" x="315" y="380" width="190" height="62" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="410" y="417" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">ACTION</text>

  <!-- POINT-OF-ACTION (dashed enhancement) -> ACTION -->
  <rect id="point-of-action" x="560" y="372" width="210" height="80" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="665" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">POINT-OF-ACTION</text>
  <text x="665" y="420" text-anchor="middle" font-size="14" fill="#57534e">reminder /</text>
  <text x="665" y="438" text-anchor="middle" font-size="14" fill="#57534e">deterministic gate</text>
  <!-- edge: point-of-action .. action -->
  <path d="M560,411 L507,411" stroke="#57534e" stroke-width="1.6" stroke-dasharray="7 5" fill="none" marker-end="url(#aho)"/>

  <!-- legend (top-left, clear of the centered top box) -->
  <rect x="30" y="26" width="196" height="76" rx="8" fill="#fdfcf9" stroke="#e4e0d8" stroke-width="1.5"/>
  <line x1="48" y1="52" x2="92" y2="52" stroke="#2f5169" stroke-width="2.4" marker-end="url(#ah)"/>
  <text x="102" y="57" font-size="14" fill="#57534e">load-bearing (required)</text>
  <line x1="48" y1="82" x2="92" y2="82" stroke="#57534e" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#aho)"/>
  <text x="102" y="87" font-size="14" fill="#57534e">enhancement (not required)</text>

  <!-- caption -->
  <text x="410" y="502" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">Solid path: the load-bearing composition. Dashed attachment: a useful enhancement, not required.</text>
  <text x="410" y="530" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">Context is a reasoning aid; critical decidable properties graduate into deterministic controls.</text>
</svg>
