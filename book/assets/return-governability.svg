<?xml version="1.0" encoding="UTF-8"?>
<!-- Chapter 6 print composition: authored geometry and readable type. Original title/description and native monochrome partner retained. Width declared by stable figure label. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 623" width="800" height="623" role="img" aria-labelledby="figure-title figure-description" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="figure-title">Value of explicit engineering versus feasible governability: a 2x2 of engineering investment</title>
<desc id="figure-description">A two-by-two chart. The vertical axis is the value of making an obligation explicit, from low at the
    bottom to high at the top. The horizontal axis is feasible governability — representation, evidence, evaluation —
    from low on the left to high on the right. Upper left, high value and low feasible governability: invest in explicit
    judgment; the obligation matters but the environment cannot yet decide it reliably, so make the judgment more
    explicit and repeatable. Upper right, high value and high feasible governability: invest in enforcement; the obligation
    can be evaluated reliably enough to carry consequences, so build the machinery that enforces it. Lower left,
    low value and low feasible governability: leave judgment informal; it neither warrants explicit engineering nor
    admits economical governance. Lower right, low value and high feasible governability: mechanize selectively;
    governability alone does not justify machinery.</desc>
<defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c1917"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57534e"/></marker><marker id="rust-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a3f12"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f5169"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f7a4d"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b23b3b"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c6bb0"/></marker></defs>
<text x="400" y="24" text-anchor="middle" font-size="21" fill="#57534e" font-weight="700">VALUE OF EXPLICIT ENGINEERING</text>
<text x="400" y="49" text-anchor="middle" font-size="20" fill="#57534e" font-weight="700">HIGH</text>
<rect x="32" y="65" width="354" height="218" rx="7" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
<text x="209" y="95" text-anchor="middle" font-size="21" fill="#1f7a4d" font-weight="700">Invest in explicit judgment</text>
<text x="48" y="128" text-anchor="start" font-size="20" fill="#1c1917">The obligation matters, but cannot</text>
<text x="48" y="152" text-anchor="start" font-size="20" fill="#1c1917">yet be decided reliably. Make</text>
<text x="48" y="176" text-anchor="start" font-size="20" fill="#1c1917">judgment explicit and repeatable</text>
<text x="48" y="200" text-anchor="start" font-size="20" fill="#1c1917">through models, knowledge,</text>
<text x="48" y="224" text-anchor="start" font-size="20" fill="#1c1917">examples, procedures, evidence,</text>
<text x="48" y="248" text-anchor="start" font-size="20" fill="#1c1917">and structured evaluation.</text>
<rect x="414" y="65" width="354" height="218" rx="7" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="591" y="95" text-anchor="middle" font-size="21" fill="#9a3f12" font-weight="700">Invest in enforcement</text>
<text x="430" y="128" text-anchor="start" font-size="20" fill="#1c1917">The obligation matters and can be</text>
<text x="430" y="152" text-anchor="start" font-size="20" fill="#1c1917">evaluated reliably enough to carry</text>
<text x="430" y="176" text-anchor="start" font-size="20" fill="#1c1917">consequences. Build the needed</text>
<text x="430" y="200" text-anchor="start" font-size="20" fill="#1c1917">representations, constraints,</text>
<text x="430" y="224" text-anchor="start" font-size="20" fill="#1c1917">validators, gates, proofs, or other</text>
<text x="430" y="248" text-anchor="start" font-size="20" fill="#1c1917">enforcement machinery.</text>
<rect x="32" y="363" width="354" height="218" rx="7" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
<text x="209" y="393" text-anchor="middle" font-size="21" fill="#57534e" font-weight="700">Leave judgment informal</text>
<text x="48" y="426" text-anchor="start" font-size="20" fill="#1c1917">The obligation neither warrants</text>
<text x="48" y="450" text-anchor="start" font-size="20" fill="#1c1917">substantial explicit engineering nor</text>
<text x="48" y="474" text-anchor="start" font-size="20" fill="#1c1917">admits economical governance.</text>
<text x="48" y="498" text-anchor="start" font-size="20" fill="#1c1917">Use ordinary situated judgment</text>
<text x="48" y="522" text-anchor="start" font-size="20" fill="#1c1917">rather than durable structure.</text>
<rect x="414" y="363" width="354" height="218" rx="7" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="591" y="393" text-anchor="middle" font-size="21" fill="#2f5169" font-weight="700">Mechanize selectively</text>
<text x="430" y="426" text-anchor="start" font-size="20" fill="#1c1917">Governability alone does not</text>
<text x="430" y="450" text-anchor="start" font-size="20" fill="#1c1917">justify machinery. Use lightweight</text>
<text x="430" y="474" text-anchor="start" font-size="20" fill="#1c1917">Modeling or Alignment where the</text>
<text x="430" y="498" text-anchor="start" font-size="20" fill="#1c1917">benefit exceeds construction</text>
<text x="430" y="522" text-anchor="start" font-size="20" fill="#1c1917">and carrying cost.</text>
<text x="400" y="314" text-anchor="middle" font-size="21" fill="#57534e" font-weight="700">FEASIBLE GOVERNABILITY</text>
<text x="400" y="341" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">representation · evidence · evaluation</text>
<text x="32" y="327" text-anchor="start" font-size="20" fill="#57534e" font-weight="700">LOW</text>
<text x="768" y="327" text-anchor="end" font-size="20" fill="#57534e" font-weight="700">HIGH</text>
<text x="400" y="608" text-anchor="middle" font-size="20" fill="#57534e" font-weight="700">LOW</text>
</svg>
