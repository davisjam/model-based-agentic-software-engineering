<?xml version="1.0" encoding="UTF-8"?>
<!-- Part VI Figure 6.3-1 — return-governability.svg. A 2x2 that separates two independent questions.
     Y = VALUE OF EXPLICIT ENGINEERING (low->high): how worthwhile it is to invest in making the
     obligation explicit. X = FEASIBLE GOVERNABILITY (low->high; representation, evidence, evaluation):
     how feasible it is to give the obligation authority. Each quadrant carries the same grammar — an
     italic coordinate in its OUTER corner (so direction never needs reconstructing), a bold coloured
     prescription, then two sentences. Both left quadrants stay judgmental; the difference is whether it
     is worth investing to make that judgment explicit and well-supported. Lower-right is the load-bearing
     one: governable does not imply worth mechanizing. Palette: green #1f7a4d (explicit judgment), rust
     #9a3f12 (authority), muted #57534e (informal), blue #2f5169 (selective), coords #78716c, ink #1c1917. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 880" width="1080" height="880"
     role="img" aria-labelledby="rgTitle rgDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="rgTitle">Value of explicit engineering versus feasible governability: a 2x2 of engineering investment</title>
  <desc id="rgDesc">A two-by-two chart. The vertical axis is the value of making an obligation explicit, from low at the
    bottom to high at the top. The horizontal axis is feasible governability — representation, evidence, evaluation —
    from low on the left to high on the right. Upper left, high value and low feasible governability: invest in explicit
    judgment; the obligation matters but the environment cannot yet decide it reliably, so make the judgment more
    explicit and repeatable. Upper right, high value and high feasible governability: invest in authority; the obligation
    can be evaluated reliably enough to carry consequences, so build the machinery that gives it authority. Lower left,
    low value and low feasible governability: leave judgment informal; it neither warrants explicit engineering nor
    admits economical governance. Lower right, low value and high feasible governability: mechanize selectively;
    governability alone does not justify machinery.</desc>

  <!-- axis labels -->
  <text x="540" y="34" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="0.4" fill="#57534e">VALUE OF EXPLICIT ENGINEERING</text>
  <text x="540" y="60" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78716c">HIGH</text>
  <text x="540" y="862" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78716c">LOW</text>

  <text x="540" y="450" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="0.4" fill="#57534e">FEASIBLE GOVERNABILITY</text>
  <text x="540" y="471" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">representation · evidence · evaluation</text>
  <text x="26" y="461" text-anchor="start" font-size="13.5" font-weight="700" fill="#78716c">LOW</text>
  <text x="1054" y="461" text-anchor="end" font-size="13.5" font-weight="700" fill="#78716c">HIGH</text>

  <!-- ===================== UPPER-LEFT — high value, low feasible governability ===================== -->
  <rect x="60" y="74" width="460" height="350" rx="12" fill="#eef7f0" stroke="#1f7a4d" stroke-width="1.6"/>
  <text x="86" y="106" text-anchor="start" font-size="13.5" font-style="italic" fill="#78716c">High value · Low feasible governability</text>
  <text x="86" y="150" text-anchor="start" font-size="21" font-weight="700" fill="#1f7a4d">Invest in explicit judgment</text>
  <g font-size="15" fill="#1c1917">
    <text x="86" y="186">The obligation matters, but the environment</text>
    <text x="86" y="208">cannot yet decide it reliably. Make the judgment</text>
    <text x="86" y="230">more explicit and repeatable through models,</text>
    <text x="86" y="252">knowledge, examples, procedures, evidence, and</text>
    <text x="86" y="274">structured evaluation.</text>
  </g>

  <!-- ===================== UPPER-RIGHT — high value, high feasible governability ===================== -->
  <rect x="560" y="74" width="460" height="350" rx="12" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.6"/>
  <text x="994" y="106" text-anchor="end" font-size="13.5" font-style="italic" fill="#78716c">High value · High feasible governability</text>
  <text x="586" y="150" text-anchor="start" font-size="21" font-weight="700" fill="#9a3f12">Invest in authority</text>
  <g font-size="15" fill="#1c1917">
    <text x="586" y="186">The obligation matters and can be evaluated</text>
    <text x="586" y="208">reliably enough to carry consequences. Build the</text>
    <text x="586" y="230">representations, constraints, validators, gates,</text>
    <text x="586" y="252">proofs, or other machinery needed to give it</text>
    <text x="586" y="274">authority.</text>
  </g>

  <!-- ===================== LOWER-LEFT — low value, low feasible governability ===================== -->
  <rect x="60" y="486" width="460" height="350" rx="12" fill="#f6f4ef" stroke="#57534e" stroke-width="1.6"/>
  <text x="86" y="528" text-anchor="start" font-size="21" font-weight="700" fill="#57534e">Leave judgment informal</text>
  <g font-size="15" fill="#1c1917">
    <text x="86" y="564">The obligation neither warrants substantial</text>
    <text x="86" y="586">explicit engineering nor admits economical</text>
    <text x="86" y="608">governance. Handle it through ordinary situated</text>
    <text x="86" y="630">judgment rather than building durable structure</text>
    <text x="86" y="652">around it.</text>
  </g>
  <text x="86" y="812" text-anchor="start" font-size="13.5" font-style="italic" fill="#78716c">Low value · Low feasible governability</text>

  <!-- ===================== LOWER-RIGHT — low value, high feasible governability ===================== -->
  <rect x="560" y="486" width="460" height="350" rx="12" fill="#e7edf3" stroke="#2f5169" stroke-width="1.6"/>
  <text x="586" y="528" text-anchor="start" font-size="21" font-weight="700" fill="#2f5169">Mechanize selectively</text>
  <g font-size="15" fill="#1c1917">
    <text x="586" y="564">The obligation is governable, but governability</text>
    <text x="586" y="586">alone does not justify machinery. Use lightweight</text>
    <text x="586" y="608">Modeling or Alignment only where the benefit</text>
    <text x="586" y="630">exceeds its construction and carrying cost.</text>
  </g>
  <text x="994" y="812" text-anchor="end" font-size="13.5" font-style="italic" fill="#78716c">Low value · High feasible governability</text>
</svg>
