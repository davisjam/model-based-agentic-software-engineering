<svg xmlns="http://www.w3.org/2000/svg" width="888" height="514" viewBox="0 0 444 257" role="img" aria-labelledby="title desc" font-family="Source Sans 3, sans-serif">
<title id="title">Choosing where to invest in explicit engineering</title>
<desc id="desc">Columns run from limited to high mechanizability. Rows run from low to high value of making an obligation explicit. Low value suggests leaving judgment informal or mechanizing selectively. High value suggests investing in explicit judgment or in enforcement.</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#1c1917"/></marker></defs>
<g fill="#1c1917" font-family="Source Sans 3, sans-serif">
<rect x="101" y="3" width="340" height="62" rx="2" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<rect x="3" y="65" width="438" height="186" rx="2" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<rect x="3" y="65" width="98" height="186" rx="2" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<path d="M67,65 L67,251" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<path d="M101,65 L101,251" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<path d="M101,42 L441,42" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<path d="M271,42 L271,251" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<path d="M67,151 L441,151" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<text x="271" y="17" font-size="12" text-anchor="middle" font-weight="700">Mechanizability →</text>
<text x="271" y="29" font-size="9" text-anchor="middle" font-style="italic">From judgment-intensive to reliably mechanized</text>
<text x="271" y="40" font-size="9" text-anchor="middle" font-style="italic">(e.g., constraints, validators, or automated checks)</text>
<text x="186" y="57" font-size="11" text-anchor="middle" font-weight="700">Limited</text>
<text x="356" y="57" font-size="11" text-anchor="middle" font-weight="700">High</text>
<text x="34" y="91" font-size="10" text-anchor="middle" font-weight="700">Value of</text>
<text x="34" y="102" font-size="10" text-anchor="middle" font-weight="700">making</text>
<text x="34" y="113" font-size="10" text-anchor="middle" font-weight="700">it explicit</text>
<path d="M34,123 L34,143" fill="none" stroke="#1c1917" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="34" y="162" font-size="9" text-anchor="middle" font-style="italic">Higher value</text>
<text x="34" y="173" font-size="9" text-anchor="middle" font-style="italic">justifies more</text>
<text x="34" y="184" font-size="9" text-anchor="middle" font-style="italic">engineering</text>
<text x="34" y="195" font-size="9" text-anchor="middle" font-style="italic">machinery.</text>
<text x="84" y="112" font-size="10" text-anchor="middle" font-weight="700">Low</text>
<text x="84" y="204" font-size="10" text-anchor="middle" font-weight="700">High</text>
<text x="109" y="84" font-size="10" text-anchor="start" font-weight="700">Leave judgment informal</text>
<text x="109" y="106" font-size="9" text-anchor="start">Example: a one-off internal</text>
<text x="109" y="117" font-size="9" text-anchor="start">naming choice.</text>
<text x="279" y="84" font-size="10" text-anchor="start" font-weight="700">Mechanize selectively</text>
<text x="279" y="106" font-size="9" text-anchor="start">Example: prototype formatting—</text>
<text x="279" y="117" font-size="9" text-anchor="start">automate when it is cheap</text>
<text x="279" y="128" font-size="9" text-anchor="start">enough to maintain.</text>
<text x="109" y="177" font-size="10" text-anchor="start" font-weight="700">Invest in explicit judgment</text>
<text x="109" y="199" font-size="9" text-anchor="start">Example: historic building</text>
<text x="109" y="210" font-size="9" text-anchor="start">compatibility—use standards,</text>
<text x="109" y="221" font-size="9" text-anchor="start">precedent, and documented review.</text>
<text x="279" y="177" font-size="10" text-anchor="start" font-weight="700">Invest in enforcement</text>
<text x="279" y="199" font-size="9" text-anchor="start">Example: service dependency—</text>
<text x="279" y="210" font-size="9" text-anchor="start">use a model, validator, and</text>
<text x="279" y="221" font-size="9" text-anchor="start">admission gate to block violations.</text>
</g>
</svg>
