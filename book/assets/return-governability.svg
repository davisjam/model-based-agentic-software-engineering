<svg xmlns="http://www.w3.org/2000/svg" width="888" height="408" viewBox="0 0 444 204" role="img" aria-labelledby="title desc" font-family="Source Sans 3, sans-serif">
<title id="title">Choosing where to invest in explicit engineering</title>
<desc id="desc">Columns run from low to high mechanizability. Rows run from low to high value of making an obligation explicit. Low value suggests leaving judgment informal or mechanizing selectively. High value suggests investing in explicit judgment or in enforcement.</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#1c1917"/></marker></defs>
<g fill="#1c1917" font-family="Source Sans 3, sans-serif">
<rect x="97" y="1" width="345" height="58" rx="2" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<rect x="2" y="59" width="440" height="143" rx="2" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<rect x="2" y="59" width="95" height="143" rx="2" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<path d="M65,59 L65,202" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<path d="M97,59 L97,202" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<path d="M97,41 L442,41" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<path d="M269,41 L269,202" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<path d="M65,131 L442,131" fill="none" stroke="#1c1917" stroke-width="0.7"/>
<text x="259" y="14.0" font-size="14" text-anchor="middle" font-weight="700">Mechanizability</text>
<path d="M310,10 L327,10" fill="none" stroke="#1c1917" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="269" y="26.0" font-size="10.5" text-anchor="middle" font-style="italic">From judgment-intensive to reliably mechanized</text>
<text x="269" y="38.0" font-size="10.5" text-anchor="middle" font-style="italic">(e.g., constraints, validators, or automated checks)</text>
<text x="183" y="54.0" font-size="13" text-anchor="middle" font-weight="700">Low</text>
<text x="356" y="54.0" font-size="13" text-anchor="middle" font-weight="700">High</text>
<text x="33" y="78.0" font-size="12" text-anchor="middle" font-weight="700">Value of</text>
<text x="33" y="91.5" font-size="12" text-anchor="middle" font-weight="700">making</text>
<text x="33" y="105.0" font-size="12" text-anchor="middle" font-weight="700">it explicit</text>
<path d="M33,113 L33,130" fill="none" stroke="#1c1917" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="33" y="149.0" font-size="10" text-anchor="middle" font-style="italic">Higher value</text>
<text x="33" y="160.5" font-size="10" text-anchor="middle" font-style="italic">justifies more</text>
<text x="33" y="172.0" font-size="10" text-anchor="middle" font-style="italic">engineering</text>
<text x="33" y="183.5" font-size="10" text-anchor="middle" font-style="italic">machinery.</text>
<text x="81" y="99.0" font-size="12" text-anchor="middle" font-weight="700">Low</text>
<text x="81" y="167.0" font-size="12" text-anchor="middle" font-weight="700">High</text>
<text x="102" y="76.0" font-size="12" text-anchor="start" font-weight="700">Leave judgment informal</text>
<text x="102" y="92.0" font-size="11" text-anchor="start" font-style="italic">Example: A one-off internal</text>
<text x="102" y="104.5" font-size="11" text-anchor="start" font-style="italic">naming choice.</text>
<text x="275" y="76.0" font-size="12" text-anchor="start" font-weight="700">Mechanize selectively</text>
<text x="275" y="92.0" font-size="11" text-anchor="start" font-style="italic">Example: Prototype formatting—</text>
<text x="275" y="104.5" font-size="11" text-anchor="start" font-style="italic">automate when it is cheap</text>
<text x="275" y="117.0" font-size="11" text-anchor="start" font-style="italic">enough to maintain.</text>
<text x="102" y="148.0" font-size="12" text-anchor="start" font-weight="700">Invest in explicit judgment</text>
<text x="102" y="164.0" font-size="11" text-anchor="start" font-style="italic">Example: Historic building design—</text>
<text x="102" y="176.5" font-size="11" text-anchor="start" font-style="italic">document its fit with standards</text>
<text x="102" y="189.0" font-size="11" text-anchor="start" font-style="italic">and precedent.</text>
<text x="275" y="148.0" font-size="12" text-anchor="start" font-weight="700">Invest in enforcement</text>
<text x="275" y="164.0" font-size="11" text-anchor="start" font-style="italic">Example: Service dependency—</text>
<text x="275" y="176.5" font-size="11" text-anchor="start" font-style="italic">block changes that violate</text>
<text x="275" y="189.0" font-size="11" text-anchor="start" font-style="italic">the modeled dependency rule.</text>
</g>
</svg>
