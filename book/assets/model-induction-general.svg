  <text x="576.0" y="516" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57534e">the agreed name</text>
  <rect id="kw-lexicon" x="462" y="560" width="228" height="66" rx="10" fill="#e7f0ea" stroke="#155c38" stroke-width="2.4" stroke-dasharray="5 3"/>
  <text x="576.0" y="588" text-anchor="middle" font-size="14.5" font-weight="700" fill="#155c38">lexicon · ontology · schema</text>
  <text x="576.0" y="608" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57534e">future reading joins through it</text>
  <!-- edge: kw-docs -> kw-terms -->
  <line x1="576" y1="165" x2="576" y2="190" stroke="#57534e" stroke-width="2.3" marker-end="url(#g-k)"/>
