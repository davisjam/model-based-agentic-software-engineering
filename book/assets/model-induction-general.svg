  <text x="576.0" y="332" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57534e">synonyms · concept groups</text>
  <rect id="kw-latent" x="462" y="376" width="228" height="66" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.0" stroke-dasharray="5 3"/>
