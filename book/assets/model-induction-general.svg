  <text x="820.0" y="240" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57534e">interfaces · parameter bundles</text>
  <rect id="cad-pattern" x="706" y="284" width="228" height="66" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.0" stroke-dasharray="5 3"/>
  <text x="820.0" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1917">candidate pattern / component</text>
  <text x="820.0" y="332" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57534e">a reusable form</text>
  <rect id="cad-latent" x="706" y="376" width="228" height="66" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.0" stroke-dasharray="5 3"/>
