  <text x="576.0" y="424" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57534e">a domain distinction</text>
  <rect id="kw-term" x="462" y="468" width="228" height="66" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4" stroke-dasharray="5 3"/>
