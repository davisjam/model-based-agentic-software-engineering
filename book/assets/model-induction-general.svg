  <line x1="332" y1="533" x2="332" y2="558" stroke="#155c38" stroke-width="2.3" marker-end="url(#g-g)"/>
  <!-- ===== COL: KNOWLEDGE WORK ===== -->
  <rect id="kw-docs" x="462" y="100" width="228" height="66" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.0" stroke-dasharray="5 3"/>
  <text x="576.0" y="128" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c1917">documents · records</text>
  <text x="576.0" y="148" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57534e">conversations · notes</text>
  <rect id="kw-terms" x="462" y="192" width="228" height="66" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.0" stroke-dasharray="5 3"/>
