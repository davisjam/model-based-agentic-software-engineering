  <text x="576.0" y="240" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57534e">phrases · entity patterns</text>
  <rect id="kw-clusters" x="462" y="284" width="228" height="66" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.0" stroke-dasharray="5 3"/>
