  <text x="480" y="682" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1c1917">Model induction converts repeated form into reusable engineering vocabulary.</text>
  <text x="480" y="705" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">The agent finds repetition, compares, and proposes structure; the engineer decides which distinctions matter and names the concept.</text>
</svg>
