  <rect id="cad-drawings" x="706" y="100" width="228" height="66" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.0" stroke-dasharray="5 3"/>
  <text x="820.0" y="128" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c1917">drawings · assemblies</text>
  <text x="820.0" y="148" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57534e">geometry</text>
