<?xml version="1.0" encoding="UTF-8"?>
<!-- Figure 2.6 concept (part2-v8-260814 re-author; folds to book/assets/).
     REVISION per v8 editor guidance (2.6-3): harmonize EXACTLY with revised Part III. Title/footer "One
     Measurement, Different Authority Decisions". Part-II side is the MODEL ("what quantity and bound
     matter?"); Part-III side is the AUTHORITY DECISION over the SAME model — observe, adapt, degrade,
     gate. The DocAble armed/dormant configuration detail is REMOVED (not a general model concept).
     Grammar: blue #2f5169 = the shared measurement model; gray #57534e = observe/adapt (report/steer);
     rust #9a3f12 = degrade/gate (the consequential decisions). Hand-authored (two design-move panels
     sharing one model). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380"
     role="img" aria-labelledby="paTitle paDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="paTitle">One measurement, different authority decisions</title>
  <desc id="paDesc">Part II, the model, names a quantity and a reference bound and compares them, answering
    what quantity and bound matter. Part III, the authority decision, takes the same model and chooses its
    force: observe, adapt, degrade, or gate. Observe and adapt are shown in gray; degrade and gate, the
    consequential decisions, in rust. Modeling and authority are separate moves over one shared model.</desc>

  <defs>
    <marker id="pa-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
    <marker id="pa-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">One Measurement, Different Authority Decisions</text>

  <!-- divider -->
  <line x1="475" y1="66" x2="475" y2="300" stroke="#d9d3c8" stroke-width="1.6"/>

  <!-- ===== LEFT: PART II MODEL ===== -->
  <text x="235" y="82" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.2" fill="#2f5169">PART II &#183; MODEL</text>
  <g font-size="16" font-weight="700" fill="#2f5169" text-anchor="middle">
    <rect x="40" y="102" width="130" height="46" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
    <text x="105" y="131">quantity</text>
    <rect x="40" y="182" width="130" height="46" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
    <text x="105" y="211">bound</text>
    <rect x="270" y="142" width="150" height="46" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
    <text x="345" y="171">comparison</text>
  </g>
  <path d="M170,125 C220,143 230,152 268,158" fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#pa-b)"/>
  <path d="M170,205 C220,187 230,178 268,172" fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#pa-b)"/>
  <text x="235" y="262" text-anchor="middle" font-size="14.5" font-style="italic" fill="#1c1917">&#8220;What quantity and bound matter?&#8221;</text>

  <!-- ===== RIGHT: PART III AUTHORITY DECISION ===== -->
  <text x="715" y="82" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.2" fill="#1c1917">PART III &#183; AUTHORITY DECISION</text>
  <rect x="620" y="100" width="190" height="46" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="715" y="129" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2f5169">same model</text>
  <!-- fan to four authority decisions -->
  <g fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#pa-k)">
    <path d="M650,146 C600,168 570,172 554,190"/>
    <path d="M690,146 C670,168 662,172 664,190"/>
    <path d="M740,146 C760,168 768,172 776,190"/>
    <path d="M780,146 C830,168 860,172 886,190"/>
  </g>
  <g font-size="14.5" font-weight="700" text-anchor="middle">
    <rect x="505" y="192" width="98" height="44" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="554" y="220" fill="#57534e">observe</text>
    <rect x="615" y="192" width="98" height="44" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="664" y="220" fill="#57534e">adapt</text>
    <rect x="725" y="192" width="98" height="44" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.2"/>
    <text x="774" y="220" fill="#9a3f12">degrade</text>
    <rect x="835" y="192" width="98" height="44" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.2"/>
    <text x="884" y="220" fill="#9a3f12">gate</text>
  </g>
  <text x="715" y="270" text-anchor="middle" font-size="14.5" font-style="italic" fill="#1c1917">&#8220;What consequence is justified?&#8221;</text>

  <!-- footer: protect the point -->
  <text x="480" y="348" text-anchor="middle" font-size="15.5" font-style="italic" fill="#1c1917">The model defines the quantity and bound; Alignment decides whether to observe, adapt, degrade, or gate.</text>
</svg>
