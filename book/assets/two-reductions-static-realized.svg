<?xml version="1.0" encoding="UTF-8"?>
<!-- graph-example figure — two-reductions-static-realized.svg. Fold to book/assets/. -->
<!-- semantic-families: modeling, governance, agent, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540"
     role="img" aria-labelledby="trTitle trDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="trTitle">Computation structure versus realized history</title>
  <desc id="trDesc">Two reductions of the same remediation system, side by side. Left: the static computation graph — named passes joined by a typed data edge and a typed control gate, modeling what computations may compose. Right: one session's edit record — a run that emits a sequence of typed PdfEdit operations, recording what mutations did occur. A dashed link between them marks that they are not joined today; a shared computation identity would join them, and the join is added when a question needs it.</desc>
  <defs>
    <marker id="tr-ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#1f7a4d"/></marker>
    <marker id="tr-ah-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/></marker>
    <marker id="tr-ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/></marker>
  </defs>
  <rect x="40" y="96" width="415" height="418" rx="14" fill="none" stroke="#e4e0d8" stroke-width="1.5"/>
  <rect x="525" y="96" width="435" height="418" rx="14" fill="none" stroke="#e4e0d8" stroke-width="1.5"/>
  <!-- edge: bg_a -> bg_b -->
  <line x1="225" y1="225" x2="225" y2="300" stroke="#1f7a4d" stroke-width="3" marker-end="url(#tr-ah-green)"/>
  <!-- edge: bg_c -> bg_b -->
  <line x1="225" y1="410" x2="225" y2="350" stroke="#9a3f12" stroke-width="2.5" stroke-dasharray="9 5" marker-end="url(#tr-ah-rust)"/>
  <!-- edge: rg_sess -> rg_e1 -->
  <line x1="735" y1="223" x2="735" y2="262" stroke="#2f5169" stroke-width="3" marker-end="url(#tr-ah-blue)"/>
  <!-- edge: rg_e1 -> rg_e2 -->
  <line x1="735" y1="308" x2="735" y2="338" stroke="#2f5169" stroke-width="3" marker-end="url(#tr-ah-blue)"/>
  <!-- edge: rg_e2 -> rg_e3 -->
  <line x1="735" y1="384" x2="735" y2="414" stroke="#2f5169" stroke-width="3" marker-end="url(#tr-ah-blue)"/>
  <rect id="tr-jl" x="452" y="290" width="12" height="12" fill="none" stroke="none"/>
  <rect id="tr-jr" x="520" y="290" width="12" height="12" fill="none" stroke="none"/>
  <!-- edge: tr-jl .. tr-jr -->
  <line x1="458" y1="296" x2="526" y2="296" stroke="#57534e" stroke-width="2" stroke-dasharray="3 5"/>
  <rect id="bg_a" x="130" y="175" width="190" height="50" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <rect id="bg_b" x="130" y="300" width="190" height="50" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <rect id="bg_c" x="130" y="410" width="190" height="50" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <rect id="rg_sess" x="565" y="175" width="340" height="48" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <rect id="rg_e1" x="585" y="262" width="300" height="46" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <rect id="rg_e2" x="585" y="338" width="300" height="46" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <rect id="rg_e3" x="585" y="414" width="300" height="46" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="247" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Computation graph</text>
  <text x="247" y="152" text-anchor="middle" font-size="13" font-weight="400" font-style="italic" fill="#57534e">what computations may compose</text>
  <text x="742" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Edit record</text>
  <text x="742" y="152" text-anchor="middle" font-size="13" font-weight="400" font-style="italic" fill="#57534e">what mutations one run did emit</text>
  <text x="225" y="205" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">Analyze pass</text>
  <text x="225" y="330" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">Remediate pass</text>
  <text x="225" y="440" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">Route gate</text>
  <text x="245" y="258" text-anchor="start" font-size="13" font-weight="700" fill="#1f7a4d">DATA_FLOW</text>
  <text x="245" y="388" text-anchor="start" font-size="13" font-weight="700" fill="#9a3f12">CONTROL_GATE</text>
  <text x="735" y="205" text-anchor="middle" font-size="17" font-weight="600" fill="#1c1917">Session run</text>
  <text x="735" y="290" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">PdfEdit · SetAltText</text>
  <text x="735" y="366" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">PdfEdit · TagFigure</text>
  <text x="735" y="442" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">PdfEdit · SetReadingOrder</text>
  <text x="492" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#57534e">not joined today</text>
  <text x="247" y="498" text-anchor="middle" font-size="15" font-weight="600" fill="#155c38">static structure</text>
  <text x="742" y="498" text-anchor="middle" font-size="15" font-weight="600" fill="#2f5169">realized history</text>
</svg>
