<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 337.5 242" width="337.5" height="242" role="img" aria-labelledby="trTitle trDesc" font-family="&quot;Source Sans 3&quot;, sans-serif"><title xmlns="http://www.w3.org/2000/svg" id="trTitle">Computation structure versus recorded history</title>
  <desc xmlns="http://www.w3.org/2000/svg" id="trDesc">Two reductions of the same remediation system, side by side. Left: the static computation graph — named passes joined by a typed data edge and a typed control gate, modeling what computations may compose. Right: one session's edit record — a run that emits a sequence of typed PdfEdit operations, recording what mutations did occur. A dashed link between them marks that they are not joined today; a shared computation identity would join them, and the join is added when a question needs it.</desc>
