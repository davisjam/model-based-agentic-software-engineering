<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: alignment-kernel). Incrementally extending the alignment kernel, drawn as
     CONCENTRIC shells to communicate ACCUMULATION: the kernel (innermost, filled green) holds the modeled
     properties that must already be protected while active alignment changes the system; each outer shell
     is a LATER model entering governance — the same class of model, not a different one — so the governed
     surface grows outward over time. A time arrow runs from the kernel outward through the shells; the
     rust annotation carries the governing relation: each new active alignment operates within the
     constraints already established. viewBox 920 for the figure font band. -->
<!-- semantic-families: modeling, governance, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430"
     role="group" aria-labelledby="akTitle akDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="akTitle">Incrementally extending the alignment kernel</title>
  <desc id="akDesc">Three concentric rounded rectangles. The innermost, filled green, is the alignment
    kernel — the properties modeled and aligned first, which later transformations must not damage. The
    middle shell is the next model, aligned within the kernel's constraints. The outer shell shows later
    models extending the governed surface. A time arrow runs from the kernel outward through the shells:
    the layers are models becoming governing constraints over time. A bottom annotation reads: each new
    active alignment operates within the constraints already established.</desc>

  <defs>
    <marker id="ak-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="430" fill="#fdfcf9"/>

  <!-- outer shell: later models -->
  <rect x="150" y="56" width="520" height="330" rx="18" fill="#fdfcf9" stroke="#1f7a4d" stroke-width="1.6"/>
  <text x="410" y="88" text-anchor="middle" font-size="12.5" fill="#44403c">later models extend the governed surface</text>

  <!-- middle shell: the next model -->
  <rect x="210" y="112" width="400" height="218" rx="14" fill="#fff" stroke="#1f7a4d" stroke-width="1.9"/>
  <text x="410" y="142" text-anchor="middle" font-size="12.5" fill="#44403c">the next model, aligned within the kernel's constraints</text>

  <!-- the kernel -->
  <rect x="270" y="170" width="280" height="102" rx="12" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="410" y="214" text-anchor="middle" font-size="15.5" font-weight="700" fill="#155c38">alignment kernel</text>
  <text x="410" y="236" text-anchor="middle" font-size="12.5" fill="#44403c">modeled and aligned first</text>

  <!-- time: models become governing constraints outward, shell by shell -->
  <line x1="550" y1="221" x2="775" y2="221" stroke="#57534e" stroke-width="1.8" marker-end="url(#ak-ah)"/>
  <text x="760" y="205" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">time</text>
  <text x="765" y="248" text-anchor="middle" font-size="12.5" font-style="italic" fill="#57534e">models become</text>
  <text x="765" y="265" text-anchor="middle" font-size="12.5" font-style="italic" fill="#57534e">governing constraints</text>

  <text x="410" y="414" text-anchor="middle" font-size="13" font-style="italic" fill="#9a3f12">each new active alignment operates within the constraints already established</text>
</svg>
