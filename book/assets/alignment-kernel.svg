<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: alignment-kernel). Incrementally extending the alignment kernel. Left: the
     four-step procedure — identify the kernel, actively align, extend, repeat. Right: a flat concentric
     diagram — the kernel M1 at the centre, with M2, M3, M4 as successive nested layers; each outer layer
     enters governance later and is admitted under the constraints of the layers inside it, so the governed
     surface grows over time. All layers are the same class of model (green family, lightening outward);
     annotations italic. viewBox 940 for the figure font band. -->
<!-- semantic-families: modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 592" width="940" height="592"
     role="group" aria-labelledby="akTitle akDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="akTitle">Incrementally extending the alignment kernel</title>
  <desc id="akDesc">Left, a numbered four-step procedure: 1 identify the kernel — model the properties that
    must stay protected while the system changes; 2 actively align — use the models to change the system
    until it satisfies the kernel; 3 extend — add the next models, subject to the constraints already
    established; 4 repeat — each new model narrows what later change is allowed to do. Right, a flat
    concentric diagram: the kernel M1 sits at the centre, with M2, M3, and M4 as successively larger nested
    rings. An annotation notes that the governed surface grows over time; another that each new model is
    admitted under the constraints of the models inside it; and a third that active alignment operates
    within the protected region.</desc>

  <defs>
    <marker id="ak-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="ak-step" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="592" fill="#fdfcf9"/>

  <!-- ===== Left: the four steps ===== -->
  <g>
    <circle cx="60" cy="84" r="16" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
    <text x="60" y="91" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">1</text>
    <text x="92" y="78" font-size="20" font-weight="700" fill="#1c1917">Identify the kernel</text>
    <text x="92" y="102" font-size="19" fill="#1c1917">model the properties that must stay</text>
    <text x="92" y="124" font-size="19" fill="#1c1917">protected while the system changes</text>
    <line x1="60" y1="106" x2="60" y2="182" stroke="#a8a29e" stroke-width="1.6" marker-end="url(#ak-step)"/>

    <circle cx="60" cy="204" r="16" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
    <text x="60" y="211" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">2</text>
    <text x="92" y="198" font-size="20" font-weight="700" fill="#1c1917">Actively align</text>
    <text x="92" y="222" font-size="19" fill="#1c1917">use the models to change the system</text>
    <text x="92" y="244" font-size="19" fill="#1c1917">until it satisfies the kernel and all prior models</text>
    <line x1="60" y1="226" x2="60" y2="302" stroke="#a8a29e" stroke-width="1.6" marker-end="url(#ak-step)"/>

    <circle cx="60" cy="324" r="16" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
    <text x="60" y="331" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">3</text>
    <text x="92" y="318" font-size="20" font-weight="700" fill="#1c1917">Extend</text>
    <text x="92" y="342" font-size="19" fill="#1c1917">add the next models, subject to the</text>
    <text x="92" y="364" font-size="19" fill="#1c1917">constraints already established</text>
    <line x1="60" y1="346" x2="60" y2="422" stroke="#a8a29e" stroke-width="1.6" marker-end="url(#ak-step)"/>

    <circle cx="60" cy="444" r="16" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
    <text x="60" y="451" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">4</text>
    <text x="92" y="438" font-size="20" font-weight="700" fill="#1c1917">Repeat</text>
    <text x="92" y="462" font-size="19" fill="#1c1917">each new model narrows what later</text>
    <text x="92" y="484" font-size="19" fill="#1c1917">change is allowed to do</text>
  </g>

  <!-- ===== Right: the concentric kernel ===== -->
  <circle cx="710" cy="268" r="185" fill="#f7faf8" stroke="#1f7a4d" stroke-width="1.6"/>
  <circle cx="710" cy="268" r="142" fill="#eef5f0" stroke="#1f7a4d" stroke-width="1.6"/>
  <circle cx="710" cy="268" r="99" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.8"/>
  <circle cx="710" cy="268" r="56" fill="#d5e9dd" stroke="#155c38" stroke-width="2.4"/>

  <text x="710" y="262" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">kernel</text>
  <text x="710" y="288" text-anchor="middle" font-size="20" font-style="italic" fill="#1c1917">M<tspan font-size="15" dy="5">1</tspan></text>
  <text x="756" y="216" text-anchor="middle" font-size="20" font-style="italic" fill="#155c38">M<tspan font-size="15" dy="5">2</tspan></text>
  <text x="790" y="170" text-anchor="middle" font-size="20" font-style="italic" fill="#155c38">M<tspan font-size="15" dy="5">3</tspan></text>
  <text x="818" y="134" text-anchor="middle" font-size="20" font-style="italic" fill="#155c38">M<tspan font-size="15" dy="5">4</tspan></text>

  <!-- annotations -->
  <text x="524" y="46" font-size="19" font-style="italic" fill="#57534e">the governed surface grows over time</text>
  <polyline points="840,52 878,52 878,187" fill="none" stroke="#57534e" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#ak-mut)"/>
  <text x="638" y="112" text-anchor="middle" font-size="20" fill="#1c1917">&#8230;</text>
  <text x="710" y="504" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">each new model is admitted under the</text>
  <text x="710" y="528" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">constraints of the models inside it</text>
  <text x="700" y="570" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">active alignment operates within the protected region</text>
</svg>
