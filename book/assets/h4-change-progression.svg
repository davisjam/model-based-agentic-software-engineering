<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h4-change-progression.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 600" width="580" height="600"
     role="img" aria-labelledby="h4bTitle h4bDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h4bTitle">From local change to durable structure</title>
  <desc id="h4bDesc">A local change becomes a ticket or issue, is realized, and produces acceptance evidence. A
    judgment then asks whether the change exposed a recurring lesson. If not, it settles into history. If it did,
    governance conversion promotes it into durable structure — a model, test, constraint, validator, or design
    change — that later work inherits.</desc>

  <defs>
    <marker id="h4b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
  </defs>

  <rect x="0" y="0" width="580" height="600" fill="#fdfcf9"/>

  <g font-size="15" text-anchor="middle" fill="#1c1917">
    <rect x="190" y="30"  width="200" height="42" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="290" y="57">local change</text>
    <rect x="190" y="112" width="200" height="42" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="290" y="139">ticket / issue</text>
    <rect x="190" y="194" width="200" height="42" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="290" y="221">realization</text>
    <rect x="190" y="276" width="200" height="42" rx="8" fill="#eef2f5" stroke="#2f5169" stroke-width="2"/>
    <text x="290" y="303" fill="#2f5169">acceptance evidence</text>
  </g>

  <g stroke="#57534e" stroke-width="2.2" marker-end="url(#h4b-ah)">
    <line x1="290" y1="72"  x2="290" y2="110"/>
    <line x1="290" y1="154" x2="290" y2="192"/>
    <line x1="290" y1="236" x2="290" y2="274"/>
    <line x1="290" y1="318" x2="290" y2="356"/>
  </g>

  <text x="290" y="378" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">recurring lesson?</text>

  <!-- split: no -> history, yes -> durable structure -->
  <path d="M290,388 L120,388 L120,430" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#h4b-ah)"/>
  <path d="M290,388 L430,388 L430,430" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#h4b-ah)"/>
  <text x="150" y="408" text-anchor="middle" font-size="13" fill="#57534e">no</text>
  <text x="410" y="408" text-anchor="middle" font-size="13" fill="#9a3f12">yes</text>

  <rect x="40" y="432" width="160" height="44" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="120" y="460" text-anchor="middle" font-size="15" fill="#1c1917">history</text>

  <rect x="300" y="432" width="260" height="94" rx="10" fill="#f7efe8" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="430" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3f12">DURABLE STRUCTURE</text>
  <text x="430" y="480" text-anchor="middle" font-size="13" fill="#9a3f12">model · test · constraint</text>
  <text x="430" y="500" text-anchor="middle" font-size="13" fill="#9a3f12">validator · design</text>

  <text x="290" y="566" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">governance conversion promotes the recurring lesson so future work inherits it</text>
</svg>
