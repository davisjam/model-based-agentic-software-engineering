<svg xmlns="http://www.w3.org/2000/svg" width="444" height="276" viewBox="0 0 444 276" role="img" aria-labelledby="title desc">
<title id="title">Analyzing dependency graphs to redesign execution</title>
<desc id="desc">Three side-by-side panels distinguish diagnosis, decomposition, and dependency redesign. The original critical path is 12 seconds, compared with 6 seconds on the other branch. Three concurrent 3-second parts reduce the critical path to 7 seconds before overhead. Two image-description operations become independent when each consumes its image and shared rendered context.</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="black"/></marker></defs>
<text x="73" y="10.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="700" font-style="normal">(a) Identify the</text>
<text x="73" y="22.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="700" font-style="normal">critical path</text>
<text x="73" y="38.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="9" font-weight="400" font-style="italic">Diagnosis</text>
<text x="219" y="10.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="700" font-style="normal">(b) Decompose</text>
<text x="219" y="22.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="700" font-style="normal">an operation</text>
<text x="219" y="38.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="9" font-weight="400" font-style="italic">Preserve external dependencies</text>
<text x="369" y="10.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="700" font-style="normal">(c) Remove an</text>
<text x="369" y="22.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="10" font-weight="700" font-style="normal">unnecessary dependency</text>
<text x="369" y="38.3" text-anchor="middle" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="9" font-weight="400" font-style="italic">Change the information structure</text>
