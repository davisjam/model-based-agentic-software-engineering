<?xml version="1.0" encoding="UTF-8"?>
<!-- Fig 1.2-2 REDRAW (part1-copyedit-260815; folds over book/assets/one-docable-job.svg).
     "One DocAble job" as TERRITORY, not model. The path a document travels: upload -> job -> split into
     chunks -> workers claim work -> specialized services -> repaired pieces -> merge -> validate ->
     {remediated document, evidence}. Deliberately the WHOLE territory palette (gray #57534e / cream
     #f6f4ef / ink #1c1917), NOT the blue model palette: Parts II and III redraw selected pieces of THIS
     path as different models. Short arrow labels only ("split for parallel work", "call specialized
     services") — no full sentences. Hand-authored (a pipeline with two fan-out rows, not a flowchart). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700"
     role="img" aria-labelledby="ojTitle ojDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="ojTitle">One DocAble job, as territory rather than model</title>
  <desc id="ojDesc">A submitted document becomes a job. The job splits into chunks so several workers
    process it concurrently. Workers claim work and call specialized services — generation, render, OCR,
    and document/format machinery — when remediation needs those capabilities. Repaired pieces are merged
    and reassembled, the result is validated, and the system returns both the remediated document and the
    evidence describing consequential changes. This is territory, not a model of DocAble's architecture.</desc>

  <defs>
    <marker id="oj-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
  </defs>

  <!-- two-line header -->
  <text x="380" y="24" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="1.5" fill="#1c1917">ONE DOCABLE JOB</text>
  <text x="380" y="44" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">territory, not model</text>

  <!-- upload -->
  <rect id="upload" x="280" y="58" width="200" height="46" rx="23" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="380" y="86" text-anchor="middle" font-size="16" fill="#1c1917">user uploads document</text>
  <!-- edge: upload -> job -->
  <line x1="380" y1="104" x2="380" y2="126" stroke="#57534e" stroke-width="2" marker-end="url(#oj-k)"/>

  <!-- job -->
  <rect id="job" x="315" y="128" width="130" height="46" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>
  <text x="380" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">job</text>
  <!-- edge: job -> chunk -->
  <line x1="380" y1="174" x2="380" y2="196" stroke="#57534e" stroke-width="2" marker-end="url(#oj-k)"/>
  <text x="392" y="190" font-size="13.5" font-style="italic" fill="#57534e">split for parallel work</text>

  <!-- chunks row -->
  <g fill="#f6f4ef" stroke="#57534e" stroke-width="2">
    <rect x="200" y="198" width="120" height="42" rx="9"/>
    <rect id="chunk" x="320" y="198" width="120" height="42" rx="9"/>
    <rect x="440" y="198" width="120" height="42" rx="9"/>
  </g>
  <text x="260" y="224" text-anchor="middle" font-size="15" fill="#1c1917">chunk</text>
  <text x="380" y="224" text-anchor="middle" font-size="15" fill="#1c1917">chunk</text>
  <text x="500" y="224" text-anchor="middle" font-size="15" fill="#1c1917">chunk</text>
  <!-- edge: chunk -> workers -->
  <line x1="380" y1="240" x2="380" y2="264" stroke="#57534e" stroke-width="2" marker-end="url(#oj-k)"/>

  <!-- workers claim -->
  <rect id="workers" x="290" y="266" width="180" height="44" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="380" y="293" text-anchor="middle" font-size="16" fill="#1c1917">workers claim work</text>
  <!-- edge: workers -> ocr -->
  <line x1="380" y1="310" x2="380" y2="334" stroke="#57534e" stroke-width="2" marker-end="url(#oj-k)"/>
  <text x="392" y="328" font-size="13.5" font-style="italic" fill="#57534e">call specialized services</text>

  <!-- services row (4) -->
  <g fill="#f6f4ef" stroke="#57534e" stroke-width="2">
    <rect x="40" y="336" width="160" height="48" rx="9"/>
    <rect x="212" y="336" width="130" height="48" rx="9"/>
    <rect id="ocr" x="354" y="336" width="110" height="48" rx="9"/>
    <rect x="476" y="336" width="244" height="48" rx="9"/>
  </g>
  <text x="120" y="365" text-anchor="middle" font-size="15" fill="#1c1917">generation</text>
  <text x="277" y="365" text-anchor="middle" font-size="15" fill="#1c1917">render</text>
  <text x="409" y="365" text-anchor="middle" font-size="15" fill="#1c1917">OCR</text>
  <text x="598" y="365" text-anchor="middle" font-size="15" fill="#1c1917">document / format machinery</text>
  <!-- edge: ocr -> repaired -->
  <line x1="380" y1="384" x2="380" y2="408" stroke="#57534e" stroke-width="2" marker-end="url(#oj-k)"/>

  <!-- repaired pieces -->
  <rect id="repaired" x="295" y="410" width="170" height="44" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="380" y="437" text-anchor="middle" font-size="16" fill="#1c1917">repaired pieces</text>
  <!-- edge: repaired -> merge -->
  <line x1="380" y1="454" x2="380" y2="478" stroke="#57534e" stroke-width="2" marker-end="url(#oj-k)"/>

  <!-- merge -->
  <rect id="merge" x="290" y="480" width="180" height="44" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="380" y="507" text-anchor="middle" font-size="16" fill="#1c1917">merge / reassemble</text>
  <!-- edge: merge -> validate -->
  <line x1="380" y1="524" x2="380" y2="548" stroke="#57534e" stroke-width="2" marker-end="url(#oj-k)"/>

  <!-- validate -->
  <rect id="validate" x="315" y="550" width="130" height="44" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>
  <text x="380" y="577" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">validate</text>

  <!-- outputs (2) — fork: one path per branch, each seated on its own node -->
  <g fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#oj-k)">
    <!-- edge: validate -> remediated -->
    <path d="M340,594 C300,616 225,610 225,640"/>
    <!-- edge: validate -> evidence -->
    <path d="M420,594 C460,616 535,610 535,640"/>
  </g>
  <rect id="remediated" x="90" y="642" width="270" height="46" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="225" y="670" text-anchor="middle" font-size="15.5" fill="#1c1917">remediated document</text>
  <rect id="evidence" x="400" y="642" width="270" height="46" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="535" y="670" text-anchor="middle" font-size="15.5" fill="#1c1917">evidence</text>
</svg>
