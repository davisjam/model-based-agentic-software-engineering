<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: build-stages-timeline). A retrospective vertical timeline of the
     seven build stages, each carrying its dates, the pressure that forced it, and the major
     engineering consequence that followed. Replaces the former two-page seven-stage table (Table
     5.2-2): the table's product/machinery inventory is dropped in favour of a temporal scaffold —
     stage → pressure → consequence. Stage 7 names the whole July–September period (deployment,
     iteration, and optimization); the serverless re-platforming is one episode inside it, not a
     peer of PowerPoint or SaaS. Dates on every stage keep the sequence from reading as a plan.
     Palette: Umber Monograph tokens (accent #9a3f12 the stage nodes/names, ink #1c1917 body,
     muted #57534e secondary, rule #e4e0d8 dividers/spine). Font Source Sans 3. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 856"
     role="img" aria-labelledby="bsTitle bsDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="bsTitle">The seven build stages as a dated timeline of pressure and consequence</title>
  <desc id="bsDesc">A retrospective vertical timeline of seven build stages, each row naming the
    stage, its dates, the pressure that forced it, and the major engineering consequence that
    followed. Feasibility, March: vision-language capability became usable, so the build began.
    PowerPoint, March to April: colleagues supplied their own decks, producing the first real
    remediation pipeline. Format expansion, April: Word, Excel, and PDF broke one-size-fits-all
    assumptions, so the architecture differentiated. SaaS, April: real users on real documents
    forced authentication, quota, cost, security, and exposed fidelity limits. Standards, April to
    May: the need for a defensible accessibility claim forced standards-grounded validation.
    Hardening, May to June: time became available for structural work, producing models, tests,
    gates, and provenance. Deployment, iteration, and optimization, July to September: operating
    the production system exposed performance, cost, reliability, and architectural limits,
    forcing repeated measurement, redesign, optimization, and re-platforming. The stages are
    labels drawn afterward, not a preplanned roadmap.</desc>

  <!-- column headers -->
  <text x="128" y="66" font-size="20" font-weight="700" letter-spacing="0.06em" fill="#57534e">STAGE</text>
  <text x="372" y="66" font-size="20" font-weight="700" letter-spacing="0.06em" fill="#57534e">THE PRESSURE</text>
  <text x="672" y="66" font-size="20" font-weight="700" letter-spacing="0.06em" fill="#57534e">THE CONSEQUENCE</text>
  <line x1="60" y1="80" x2="980" y2="80" stroke="#1c1917" stroke-width="1.5"/>

  <!-- vertical spine through the stage nodes -->
  <line x1="76" y1="134" x2="76" y2="774" stroke="#e4e0d8" stroke-width="2"/>

  <!-- ============ rows: y-centres 134,240,346,452,558,664,774 ============ -->

  <!-- 1 · Feasibility · March -->
  <circle cx="76" cy="134" r="7" fill="#9a3f12"/>
  <text x="76" y="138.5" text-anchor="middle" font-size="20" font-weight="700" fill="#fbf9f4">1</text>
  <text x="100" y="119" font-size="20" font-weight="700" fill="#9a3f12">Feasibility</text>
  <text x="100" y="140" font-size="20" font-weight="600" fill="#9a3f12">March</text>
  <text x="100" y="160" font-size="20" fill="#57534e">a probe in a meeting</text>
  <text x="360" y="130" font-size="20" fill="#1c1917">Vision-language capability</text>
  <text x="360" y="149" font-size="20" fill="#1c1917">became usable</text>
  <text x="628" y="139" font-size="20" fill="#9a3f12">&#8594;</text>
  <text x="662" y="139" font-size="20" fill="#1c1917">the build began</text>

  <!-- 2 · PowerPoint · March–April -->
  <circle cx="76" cy="240" r="7" fill="#9a3f12"/>
  <text x="76" y="244.5" text-anchor="middle" font-size="20" font-weight="700" fill="#fbf9f4">2</text>
  <text x="100" y="225" font-size="20" font-weight="700" fill="#9a3f12">PowerPoint</text>
  <text x="100" y="246" font-size="20" font-weight="600" fill="#9a3f12">March&#8211;April</text>
  <text x="100" y="266" font-size="20" fill="#57534e">the first format</text>
  <text x="360" y="236" font-size="20" fill="#1c1917">Colleagues supplied</text>
  <text x="360" y="255" font-size="20" fill="#1c1917">their own decks</text>
  <text x="628" y="245" font-size="20" fill="#9a3f12">&#8594;</text>
  <text x="662" y="238" font-size="20" fill="#1c1917">the first real</text>
  <text x="662" y="257" font-size="20" fill="#1c1917">remediation pipeline</text>

  <!-- 3 · Format expansion · April -->
  <circle cx="76" cy="346" r="7" fill="#9a3f12"/>
  <text x="76" y="350.5" text-anchor="middle" font-size="20" font-weight="700" fill="#fbf9f4">3</text>
  <text x="100" y="331" font-size="20" font-weight="700" fill="#9a3f12">Format expansion</text>
  <text x="100" y="352" font-size="20" font-weight="600" fill="#9a3f12">April</text>
  <text x="100" y="372" font-size="20" fill="#57534e">Word &#183; Excel &#183; PDF</text>
  <text x="360" y="342" font-size="20" fill="#1c1917">New formats broke the</text>
  <text x="360" y="361" font-size="20" fill="#1c1917">one-size-fits-all assumptions</text>
  <text x="628" y="351" font-size="20" fill="#9a3f12">&#8594;</text>
  <text x="662" y="351" font-size="20" fill="#1c1917">the architecture differentiated</text>

  <!-- 4 · SaaS · April -->
  <circle cx="76" cy="452" r="7" fill="#9a3f12"/>
  <text x="76" y="456.5" text-anchor="middle" font-size="20" font-weight="700" fill="#fbf9f4">4</text>
  <text x="100" y="437" font-size="20" font-weight="700" fill="#9a3f12">SaaS</text>
  <text x="100" y="458" font-size="20" font-weight="600" fill="#9a3f12">April</text>
  <text x="100" y="478" font-size="20" fill="#57534e">a deployed service</text>
  <text x="360" y="448" font-size="20" fill="#1c1917">Real users on</text>
  <text x="360" y="467" font-size="20" fill="#1c1917">real documents</text>
  <text x="628" y="457" font-size="20" fill="#9a3f12">&#8594;</text>
  <text x="662" y="450" font-size="20" fill="#1c1917">auth, quota, cost, security &#8212;</text>
  <text x="662" y="469" font-size="20" fill="#1c1917">and the first fidelity limits</text>

  <!-- 5 · Standards · April–May -->
  <circle cx="76" cy="558" r="7" fill="#9a3f12"/>
  <text x="76" y="562.5" text-anchor="middle" font-size="20" font-weight="700" fill="#fbf9f4">5</text>
  <text x="100" y="543" font-size="20" font-weight="700" fill="#9a3f12">Standards</text>
  <text x="100" y="564" font-size="20" font-weight="600" fill="#9a3f12">April&#8211;May</text>
  <text x="100" y="584" font-size="20" fill="#57534e">a defensible claim</text>
  <text x="360" y="554" font-size="20" fill="#1c1917">The need for a defensible</text>
  <text x="360" y="573" font-size="20" fill="#1c1917">accessibility claim</text>
  <text x="628" y="563" font-size="20" fill="#9a3f12">&#8594;</text>
  <text x="662" y="563" font-size="20" fill="#1c1917">standards-grounded validation</text>

  <!-- 6 · Hardening · May–June -->
  <circle cx="76" cy="664" r="7" fill="#9a3f12"/>
  <text x="76" y="668.5" text-anchor="middle" font-size="20" font-weight="700" fill="#fbf9f4">6</text>
  <text x="100" y="649" font-size="20" font-weight="700" fill="#9a3f12">Hardening</text>
  <text x="100" y="670" font-size="20" font-weight="600" fill="#9a3f12">May&#8211;June</text>
  <text x="100" y="690" font-size="20" fill="#57534e">structural work</text>
  <text x="360" y="660" font-size="20" fill="#1c1917">Time became available</text>
  <text x="360" y="679" font-size="20" fill="#1c1917">for structural work</text>
  <text x="628" y="669" font-size="20" fill="#9a3f12">&#8594;</text>
  <text x="662" y="669" font-size="20" fill="#1c1917">models, tests, gates, provenance</text>

  <!-- 7 · Deployment, iteration, and optimization · July–September -->
  <circle cx="76" cy="774" r="7" fill="#9a3f12"/>
  <text x="76" y="778.5" text-anchor="middle" font-size="20" font-weight="700" fill="#fbf9f4">7</text>
  <text x="100" y="748" font-size="20" font-weight="700" fill="#9a3f12">Deployment, iteration,</text>
  <text x="100" y="769" font-size="20" font-weight="700" fill="#9a3f12">and optimization</text>
  <text x="100" y="790" font-size="20" font-weight="600" fill="#9a3f12">July&#8211;September</text>
  <text x="100" y="810" font-size="20" fill="#57534e">operating what shipped</text>
  <text x="360" y="755" font-size="20" fill="#1c1917">Production operation exposed</text>
  <text x="360" y="774" font-size="20" fill="#1c1917">limits on performance, cost,</text>
  <text x="360" y="793" font-size="20" fill="#1c1917">reliability, and architecture</text>
  <text x="628" y="774" font-size="20" fill="#9a3f12">&#8594;</text>
  <text x="662" y="765" font-size="20" fill="#1c1917">repeated measurement, redesign,</text>
  <text x="662" y="784" font-size="20" fill="#1c1917">optimization, and re-platforming</text>

  <!-- footer note -->
  <text x="60" y="842" font-size="20" font-style="italic" fill="#57534e">Stages are labels drawn afterward, not a plan followed at the time.</text>
</svg>
