<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: build-stages-timeline). A retrospective vertical timeline of the
     seven build stages, each carrying the pressure that forced it and the major engineering
     consequence that followed. Replaces the former two-page seven-stage table (Table 5.2-2): the
     table's product/machinery inventory is dropped in favour of a temporal scaffold — stage →
     pressure → consequence. Palette: Umber Monograph tokens (accent #9a3f12 the stage nodes/names,
     ink #1c1917 body, muted #57534e secondary, rule #e4e0d8 dividers/spine). Font Source Sans 3. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770"
     role="img" aria-labelledby="bsTitle bsDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="bsTitle">The seven build stages as a timeline of pressure and consequence</title>
  <desc id="bsDesc">A retrospective vertical timeline of seven build stages, each row naming the
    stage, the pressure that forced it, and the major engineering consequence that followed.
    Feasibility: vision-language capability became usable, so the build began. PowerPoint: colleagues
    supplied their own decks, producing the first real remediation pipeline. Format expansion: Word,
    Excel, and PDF broke one-size-fits-all assumptions, so the architecture differentiated. SaaS: real
    users on real documents forced authentication, quota, cost, security, and exposed fidelity limits.
    Standards: the need for a defensible accessibility claim forced standards-grounded validation.
    Hardening: time became available for structural work, producing models, tests, gates, and
    provenance. Serverless: idle cost exposed the wrong deployment shape, forcing a re-platforming.
    The stages are labels drawn afterward, not a preplanned roadmap.</desc>

  <!-- column headers -->
  <text x="128" y="66" font-size="18" font-weight="700" letter-spacing="0.06em" fill="#57534e">STAGE</text>
  <text x="372" y="66" font-size="18" font-weight="700" letter-spacing="0.06em" fill="#57534e">THE PRESSURE</text>
  <text x="672" y="66" font-size="18" font-weight="700" letter-spacing="0.06em" fill="#57534e">THE CONSEQUENCE</text>
  <line x1="60" y1="80" x2="980" y2="80" stroke="#1c1917" stroke-width="1.5"/>

  <!-- vertical spine through the stage nodes -->
  <line x1="76" y1="128" x2="76" y2="700" stroke="#e4e0d8" stroke-width="2"/>

  <!-- ============ rows: y-centres 128,224,320,416,512,608,700 (step 96) ============ -->

  <!-- 1 · Feasibility -->
  <circle cx="76" cy="128" r="7" fill="#9a3f12"/>
  <text x="76" y="132.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fbf9f4">1</text>
  <text x="100" y="123" font-size="18" font-weight="700" fill="#9a3f12">Feasibility</text>
  <text x="100" y="143" font-size="18" fill="#57534e">a probe in a meeting</text>
  <text x="360" y="124" font-size="18" fill="#1c1917">Vision-language capability</text>
  <text x="360" y="143" font-size="18" fill="#1c1917">became usable</text>
  <text x="628" y="133" font-size="20" fill="#9a3f12">&#8594;</text>
  <text x="662" y="133" font-size="18" fill="#1c1917">the build began</text>

  <!-- 2 · PowerPoint -->
  <circle cx="76" cy="224" r="7" fill="#9a3f12"/>
  <text x="76" y="228.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fbf9f4">2</text>
  <text x="100" y="219" font-size="18" font-weight="700" fill="#9a3f12">PowerPoint</text>
  <text x="100" y="239" font-size="18" fill="#57534e">the first format</text>
  <text x="360" y="220" font-size="18" fill="#1c1917">Colleagues supplied</text>
  <text x="360" y="239" font-size="18" fill="#1c1917">their own decks</text>
  <text x="628" y="229" font-size="20" fill="#9a3f12">&#8594;</text>
  <text x="662" y="222" font-size="18" fill="#1c1917">the first real</text>
  <text x="662" y="241" font-size="18" fill="#1c1917">remediation pipeline</text>

  <!-- 3 · Format expansion -->
  <circle cx="76" cy="320" r="7" fill="#9a3f12"/>
  <text x="76" y="324.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fbf9f4">3</text>
  <text x="100" y="315" font-size="18" font-weight="700" fill="#9a3f12">Format expansion</text>
  <text x="100" y="335" font-size="18" fill="#57534e">Word · Excel · PDF</text>
  <text x="360" y="316" font-size="18" fill="#1c1917">New formats broke the</text>
  <text x="360" y="335" font-size="18" fill="#1c1917">one-size-fits-all assumptions</text>
  <text x="628" y="325" font-size="20" fill="#9a3f12">&#8594;</text>
  <text x="662" y="325" font-size="18" fill="#1c1917">the architecture differentiated</text>

  <!-- 4 · SaaS -->
  <circle cx="76" cy="416" r="7" fill="#9a3f12"/>
  <text x="76" y="420.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fbf9f4">4</text>
  <text x="100" y="411" font-size="18" font-weight="700" fill="#9a3f12">SaaS</text>
  <text x="100" y="431" font-size="18" fill="#57534e">a deployed service</text>
  <text x="360" y="412" font-size="18" fill="#1c1917">Real users on</text>
  <text x="360" y="431" font-size="18" fill="#1c1917">real documents</text>
  <text x="628" y="421" font-size="20" fill="#9a3f12">&#8594;</text>
  <text x="662" y="414" font-size="18" fill="#1c1917">auth, quota, cost, security —</text>
  <text x="662" y="433" font-size="18" fill="#1c1917">and the first fidelity limits</text>

  <!-- 5 · Standards -->
  <circle cx="76" cy="512" r="7" fill="#9a3f12"/>
  <text x="76" y="516.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fbf9f4">5</text>
  <text x="100" y="507" font-size="18" font-weight="700" fill="#9a3f12">Standards</text>
  <text x="100" y="527" font-size="18" fill="#57534e">a defensible claim</text>
  <text x="360" y="508" font-size="18" fill="#1c1917">The need for a defensible</text>
  <text x="360" y="527" font-size="18" fill="#1c1917">accessibility claim</text>
  <text x="628" y="517" font-size="20" fill="#9a3f12">&#8594;</text>
  <text x="662" y="517" font-size="18" fill="#1c1917">standards-grounded validation</text>

  <!-- 6 · Hardening -->
  <circle cx="76" cy="608" r="7" fill="#9a3f12"/>
  <text x="76" y="612.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fbf9f4">6</text>
  <text x="100" y="603" font-size="18" font-weight="700" fill="#9a3f12">Hardening</text>
  <text x="100" y="623" font-size="18" fill="#57534e">structural work</text>
  <text x="360" y="604" font-size="18" fill="#1c1917">Time became available</text>
  <text x="360" y="623" font-size="18" fill="#1c1917">for structural work</text>
  <text x="628" y="613" font-size="20" fill="#9a3f12">&#8594;</text>
  <text x="662" y="613" font-size="18" fill="#1c1917">models, tests, gates, provenance</text>

  <!-- 7 · Serverless -->
  <circle cx="76" cy="700" r="7" fill="#9a3f12"/>
  <text x="76" y="704.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fbf9f4">7</text>
  <text x="100" y="695" font-size="18" font-weight="700" fill="#9a3f12">Serverless</text>
  <text x="100" y="715" font-size="18" fill="#57534e">re-platforming</text>
  <text x="360" y="696" font-size="18" fill="#1c1917">Idle cost exposed the</text>
  <text x="360" y="715" font-size="18" fill="#1c1917">wrong deployment shape</text>
  <text x="628" y="705" font-size="20" fill="#9a3f12">&#8594;</text>
  <text x="662" y="705" font-size="18" fill="#1c1917">a re-platforming</text>

  <!-- footer note -->
  <text x="60" y="752" font-size="18" font-style="italic" fill="#57534e">Stages are labels drawn afterward, not a plan followed at the time.</text>
</svg>
