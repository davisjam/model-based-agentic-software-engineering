<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: comparative hero). "Independent reconstructions of the theory." A table of the
     industrial reconstructions grouped by KIND: each row is a kind of engineering emphasis (not one company),
     entering the design space through a distinctive problem and landing on a region of the same theory, named
     in MAGE vocabulary in the last column. Six kinds are single-org; the seventh — a durable environment
     around a replaceable reasoner — has two members, Uber and GitLab, reached from opposite motives
     (economics / trust), so they share one lane. Badge colour keys to the house semantic language — rust for
     governance/alignment, green for modeling/knowledge/environment. A closing synprinciple row reads MAGE ->
     unified vocabulary -> engineering theory -> the whole landscape. The framing stays restrained: kinds
     RECONSTRUCT regions of one theory; nothing here PROVES it. Palette: Umber Monograph tokens (ink #1c1917,
     muted #57534e, governed green #1f7a4d/#155c38, accent #9a3f12, tints #e3f0e7/#eef7f0/#faf1e6, rule
     #e4e0d8, page #fdfcf9). Fonts in the 16-28 band at the 1000px reference. NOTE: the file keeps its legacy
     six-company-map.svg name (referenced from the comparative page); the CONTENT is the seven-kind map. -->
<!-- semantic-families: governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 812" width="1000" height="812"
     role="group" aria-labelledby="scmTitle scmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="scmTitle">Independent reconstructions of the theory: seven kinds of industrial reconstruction map regions of one theory of MAGE</title>
  <desc id="scmDesc">A table shows seven kinds of industrial reconstruction, each entering the design space
    through a different problem yet landing on a region of the same theory, named in MAGE vocabulary in the
    last column. Cloudflare starts from policy-first governance, invests in policy bound into mechanisms, and
    lands on the Alignment Principle. Spotify starts from fleet-first autonomy, invests in fleet-scale
    verification, and lands on the Governed Engineering Environment. Shopify starts from a shared
    agent-ready environment, invests in organizational knowledge, and lands on the Engineered Environment.
    Docker starts from authority boundaries and evaluation loops, invests in runtime authority, and lands on
    Governance Conversion. Siemens starts from model-first engineering, invests in models as the development
    surface, and lands on the Modeling Principle. Zenseact starts from autonomous knowledge work, invests in
    context and delegation, and lands on the Reasoning Horizon. Uber and GitLab share the seventh kind — a
    durable environment around a replaceable reasoner, reached from economics and from trust — investing in the
    environment around a swappable model and landing on the Governed Engineering Environment. A closing
    synprinciple row reads: MAGE assembles a unified vocabulary into an engineering theory that spans the whole
    landscape. Badge colours key each landing to the house semantic language: rust for governance and
    alignment, green for modeling, knowledge, and environment. No two kinds began with the same problem, yet
    they converge.</desc>

  <defs>
    <linearGradient id="scmSynth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3f0e7"/>
      <stop offset="1" stop-color="#faf1e6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="812" fill="#fdfcf9"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">Independent reconstructions of the theory</text>
  <text x="500" y="70" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">Different entry points, common destination — each durable investment lands on a region of one theory.</text>

  <!-- legend: badge colour keys to the house semantic language -->
  <g font-size="20" fill="#57534e">
    <rect x="212" y="90" width="18" height="18" rx="3" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
    <text x="238" y="105">Modeling · knowledge · environment</text>
    <rect x="590" y="90" width="18" height="18" rx="3" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <text x="616" y="105">Governance · alignment</text>
  </g>

  <!-- header row -->
  <text x="48"  y="150" font-size="20" font-weight="700" letter-spacing="1" fill="#57534e">KIND</text>
  <text x="210" y="150" font-size="20" font-weight="700" letter-spacing="1" fill="#57534e">DISTINCTIVE STARTING POINT</text>
  <text x="486" y="150" font-size="20" font-weight="700" letter-spacing="1" fill="#57534e">DURABLE INVESTMENT</text>
  <text x="839" y="150" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="1" fill="#57534e">LANDS ON THE THEORY</text>

  <!-- row rules -->
  <g stroke="#e4e0d8" stroke-width="1.5">
    <line x1="40" y1="164" x2="960" y2="164"/>
    <line x1="40" y1="236" x2="960" y2="236"/>
    <line x1="40" y1="308" x2="960" y2="308"/>
    <line x1="40" y1="380" x2="960" y2="380"/>
    <line x1="40" y1="452" x2="960" y2="452"/>
    <line x1="40" y1="524" x2="960" y2="524"/>
    <line x1="40" y1="596" x2="960" y2="596"/>
  </g>

  <!-- Cloudflare -> Alignment Principle (rust) -->
  <text x="48"  y="206" font-size="20" font-weight="700" fill="#1c1917">Cloudflare</text>
  <text x="210" y="206" font-size="20" fill="#57534e">Policy-first governance</text>
  <text x="486" y="206" font-size="20" font-weight="700" fill="#1c1917">Policy → mechanisms</text>
  <rect x="726" y="179" width="226" height="42" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="839" y="206" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">Alignment Principle</text>

  <!-- Spotify -> Governed Engineering Environment (green, emphasized) -->
  <text x="48"  y="278" font-size="20" font-weight="700" fill="#1c1917">Spotify</text>
  <text x="210" y="278" font-size="20" fill="#57534e">Fleet-first autonomy</text>
  <text x="486" y="278" font-size="20" font-weight="700" fill="#1c1917">Fleet-scale verification</text>
  <rect x="716.55" y="251" width="244.89" height="42" rx="8" fill="#e3f0e7" stroke="#155c38" stroke-width="2.6"/>
  <text x="839" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">Governed Engineering</text>
  <text x="839" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">Environment</text>

  <!-- Shopify -> Engineered Environment (green) -->
  <text x="48"  y="350" font-size="20" font-weight="700" fill="#1c1917">Shopify</text>
  <text x="210" y="350" font-size="20" fill="#57534e">Shared agent-ready env.</text>
  <text x="486" y="350" font-size="20" font-weight="700" fill="#1c1917">Organizational knowledge</text>
  <rect x="726" y="323" width="226" height="42" rx="8" fill="#eef7f0" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="839" y="342" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a4d">Engineering</text>
  <text x="839" y="360" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a4d">Environment</text>

  <!-- Docker -> Governance Conversion (rust) -->
  <text x="48"  y="422" font-size="20" font-weight="700" fill="#1c1917">Docker</text>
  <text x="210" y="422" font-size="20" fill="#57534e">Authority + eval loops</text>
  <text x="486" y="422" font-size="20" font-weight="700" fill="#1c1917">Runtime authority</text>
  <rect x="726" y="395" width="226" height="42" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="839" y="414" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">Governance</text>
  <text x="839" y="432" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">Conversion</text>

  <!-- Siemens -> Modeling Principle (green) -->
  <text x="48"  y="494" font-size="20" font-weight="700" fill="#1c1917">Siemens</text>
  <text x="210" y="494" font-size="20" fill="#57534e">Model-first engineering</text>
  <text x="486" y="494" font-size="20" font-weight="700" fill="#1c1917">Models as the surface</text>
  <rect x="726" y="467" width="226" height="42" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="839" y="494" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a4d">Modeling Principle</text>

  <!-- Zenseact -> Reasoning Horizon (green) -->
  <text x="48"  y="566" font-size="20" font-weight="700" fill="#1c1917">Zenseact</text>
  <text x="210" y="566" font-size="20" fill="#57534e">Autonomous knowledge work</text>
  <text x="486" y="566" font-size="20" font-weight="700" fill="#1c1917">Context + delegation</text>
  <rect x="726" y="539" width="226" height="42" rx="8" fill="#eef7f0" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="839" y="566" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a4d">Reasoning Horizon</text>

  <!-- Uber + GitLab -> Governed Engineering Environment (green): the seventh kind, two members -->
  <text x="48"  y="638" font-size="20" font-weight="700" fill="#1c1917">Uber + GitLab</text>
  <text x="210" y="638" font-size="20" fill="#57534e">Factory economics / trust</text>
  <text x="486" y="638" font-size="20" font-weight="700" fill="#1c1917">Durable environment</text>
  <rect x="716.55" y="611" width="244.89" height="42" rx="8" fill="#e3f0e7" stroke="#155c38" stroke-width="2.6"/>
  <text x="839" y="630" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">Governed Engineering</text>
  <text x="839" y="648" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">Environment</text>

  <!-- synprinciple row: MAGE assembles the pieces -->
  <line x1="40" y1="668" x2="960" y2="668" stroke="#57534e" stroke-width="2"/>
  <rect x="40" y="672" width="920" height="60" rx="9" fill="url(#scmSynth)" stroke="#e4e0d8" stroke-width="1.2"/>
  <text x="64"  y="709" font-size="20" font-weight="700" fill="#1c1917">MAGE</text>
  <text x="210" y="709" font-size="20" fill="#57534e">unified vocabulary</text>
  <text x="486" y="709" font-size="20" font-weight="700" fill="#1c1917">engineering theory</text>
  <text x="839" y="709" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">comparative design space</text>

  <text x="500" y="772" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">No two kinds began with the same problem — yet they converge.</text>
</svg>
