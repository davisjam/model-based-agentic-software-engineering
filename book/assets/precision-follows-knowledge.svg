<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): the precision-follows-knowledge continuum — a single
     horizontal row of five stages from an uncertain need to an aligned, authoritative
     mechanism, with a dashed return arrow showing that exploration can revise the need
     itself. Deliberately minimal and monochrome: this is a conceptual continuum, not a
     role-coloured constraint/sensor/validator/gate diagram, so every node shares one ink
     (near-black stroke/header text, muted-gray descriptor text) rather than per-role color.
     Mermaid draws a left-to-right chain but not the two-line node labels plus the short
     back-curve with its own caption, so a bespoke layout is used, following the same
     viewBox scale, font stack, and title/desc accessibility skeleton as the squash-zero-
     promote figure elsewhere in the book. Ink: near-black #1c1917, muted gray #57534e,
     panel #faf1e6. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 300" width="1300" height="300"
     role="group" aria-labelledby="pfkTitle pfkDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="pfkTitle">Precision follows knowledge: the continuum from an uncertain need to an authoritative mechanism</title>
  <desc id="pfkDesc">Five stages in a horizontal row, connected left to right by arrows. An
    uncertain need — a customer signal or a hypothesis — leads to explore, where prototypes
    are built, observed, and measured. What explore learns becomes a stabilizing claim: a
    requirement or a quality target. A stabilizing claim is represented as a model — a
    representation or a property — and a model is aligned by a validator or a gate. A dashed
    return arrow curves from explore back to uncertain need, labeled "problem can change":
    exploration can reveal that the original need itself was framed wrong, not only that the
    proposed answer was wrong. Precision is earned as knowledge stabilizes, not assumed at
    the start — only obligations stable enough to govern acquire authoritative mechanisms;
    nothing earlier on the continuum is asked to carry that authority before it has earned
    it.</desc>

  <defs>
    <marker id="pfkArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- node 1: uncertain need -->
  <rect x="55" y="70" width="210" height="90" rx="10" fill="#faf1e6" stroke="#1c1917" stroke-width="2.5"/>
  <text x="160" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Uncertain need</text>
  <text x="160" y="136" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">customer signal &#183; hypothesis</text>

  <!-- node 2: explore -->
  <rect x="300" y="70" width="210" height="90" rx="10" fill="#faf1e6" stroke="#1c1917" stroke-width="2.5"/>
  <text x="405" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">explore</text>
  <text x="405" y="136" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">prototype &#183; observe &#183; measure</text>

  <!-- node 3: stabilizing claim -->
  <rect x="545" y="70" width="210" height="90" rx="10" fill="#faf1e6" stroke="#1c1917" stroke-width="2.5"/>
  <text x="650" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">stabilizing claim</text>
  <text x="650" y="136" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">requirement &#183; quality target</text>

  <!-- node 4: model -->
  <rect x="790" y="70" width="210" height="90" rx="10" fill="#faf1e6" stroke="#1c1917" stroke-width="2.5"/>
  <text x="895" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">model</text>
  <text x="895" y="136" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">representation &#183; property</text>

  <!-- node 5: align -->
  <rect x="1035" y="70" width="210" height="90" rx="10" fill="#faf1e6" stroke="#1c1917" stroke-width="2.5"/>
  <text x="1140" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">align</text>
  <text x="1140" y="136" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">validator &#183; gate</text>

  <!-- forward connectors, straight, along the spine -->
  <g fill="none" stroke="#1c1917" stroke-width="2.5" marker-end="url(#pfkArrow)">
    <path d="M265,115 L298,115"/>
    <path d="M510,115 L543,115"/>
    <path d="M755,115 L788,115"/>
    <path d="M1000,115 L1033,115"/>
  </g>

  <!-- return connector: explore back to uncertain need, thin and dashed — the problem itself can change -->
  <g fill="none" stroke="#1c1917" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#pfkArrow)">
    <path d="M298,163 C298,222 266,222 266,163"/>
  </g>
  <text x="282" y="248" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">problem can change</text>
</svg>
