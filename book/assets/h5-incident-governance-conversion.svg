<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h5-incident-governance-conversion.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600"
     role="img" aria-labelledby="h5bTitle h5bDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h5bTitle">From incident to inherited lesson</title>
  <desc id="h5bDesc">Telemetry and history reconstruct an incident as a timeline or RCA. A structural judgment then
    decides whether the failure was a local event or a recurring gap. A local event is repaired and settles into
    history. A recurring gap enters governance conversion, which promotes the lesson into a model update, a mechanism
    or gate, or an architectural or runbook change; those durable outcomes are what future work inherits.</desc>

  <defs>
    <marker id="h5b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
    <marker id="h5b-ah-u" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/></marker>
  </defs>

  <rect x="0" y="0" width="720" height="600" fill="#fdfcf9"/>

  <rect x="280" y="24" width="160" height="44" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="360" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">INCIDENT</text>

  <line x1="360" y1="68" x2="360" y2="108" stroke="#57534e" stroke-width="2.2" marker-end="url(#h5b-ah)"/>
  <text x="470" y="94" text-anchor="middle" font-size="12.5" font-style="italic" fill="#57534e">telemetry · history</text>

  <rect x="260" y="110" width="200" height="44" rx="8" fill="#eef2f5" stroke="#2f5169" stroke-width="2"/>
  <text x="360" y="138" text-anchor="middle" font-size="15" fill="#2f5169">timeline / RCA</text>

  <line x1="360" y1="154" x2="360" y2="192" stroke="#57534e" stroke-width="2.2" marker-end="url(#h5b-ah)"/>
  <text x="360" y="214" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">structural judgment</text>

  <!-- split: local event (left, repair) vs recurring gap (right, conversion) -->
  <path d="M360,224 L180,224 L180,262" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#h5b-ah)"/>
  <path d="M360,224 L530,224 L530,262" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#h5b-ah-u)"/>
  <text x="262" y="244" text-anchor="middle" font-size="12.5" fill="#57534e">local event</text>
  <text x="452" y="244" text-anchor="middle" font-size="12.5" fill="#9a3f12">recurring gap</text>

  <!-- left branch: repair settles into history -->
  <rect x="110" y="264" width="140" height="44" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="180" y="292" text-anchor="middle" font-size="15" fill="#1c1917">repair</text>

  <line x1="180" y1="308" x2="180" y2="348" stroke="#57534e" stroke-width="2.2" marker-end="url(#h5b-ah)"/>

  <rect x="110" y="350" width="140" height="44" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="180" y="378" text-anchor="middle" font-size="15" fill="#1c1917">history</text>

  <!-- right branch: governance conversion fans to three durable outcomes -->
  <rect x="380" y="264" width="300" height="48" rx="9" fill="#f7efe8" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="530" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3f12">GOVERNANCE CONVERSION</text>

  <g stroke="#57534e" stroke-width="2" fill="none">
    <path d="M530,312 L420,312 L420,348" marker-end="url(#h5b-ah)"/>
    <path d="M530,312 L545,312 L545,348" marker-end="url(#h5b-ah)"/>
    <path d="M530,312 L655,312 L655,348" marker-end="url(#h5b-ah)"/>
  </g>

  <g font-size="13.5" text-anchor="middle" fill="#1c1917">
    <rect x="355" y="350" width="130" height="52" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/><text x="420" y="381">model update</text>
    <rect x="487" y="350" width="116" height="52" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/><text x="545" y="374">mechanism</text><text x="545" y="392">or gate</text>
    <rect x="598" y="350" width="118" height="52" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/><text x="657" y="374">architecture</text><text x="657" y="392">/ runbook</text>
  </g>

  <!-- three outcomes converge into the inherited lesson -->
  <g stroke="#9a3f12" stroke-width="2" fill="none">
    <path d="M420,402 L420,428 L545,428"/>
    <path d="M657,402 L657,428 L545,428"/>
    <path d="M545,402 L545,428"/>
  </g>
  <line x1="545" y1="428" x2="545" y2="452" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#h5b-ah-u)"/>
  <rect x="405" y="454" width="280" height="46" rx="9" fill="#f7efe8" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="545" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3f12">future work inherits the lesson</text>

  <text x="360" y="556" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">not every incident deserves a new control — only a recurring or consequential obligation</text>
</svg>
