<?xml version="1.0" encoding="UTF-8"?>
<!-- Part IV §4.2 — recovering-model-from-brownfield.svg (hand-authored; folds to book/assets/).
     The SOFTWARE-path slice of the model-induction move (the software column of the relocated
     three-domain figure, redesigned for Part 4). A single vertical chain: realized code -> repeated
     low-level forms -> candidate regularities -> contextual comparison -> candidate representation ->
     compare against instances -> explicit model / typed vocabulary -> future work reasons through
     the model. The intellectual point the geometry must carry: MECHANICAL DISCOVERY (nodes 1-3, gray)
     only surfaces evidence; the ENGINEERING JUDGMENT that proposes, compares, and revises a
     representation (nodes 4-6, rust) is separate — repetition alone does not determine the model. The
     right-gutter brackets group the chain into its three phases and name them, and the color turns
     when discovery hands off to judgment. Grammar: gray #57534e = neutral machine-found evidence
     (the agent surfaces repetition); rust #9a3f12 = the engineer's proposal and test (the judgment
     loop, with the candidate-representation step as its pivot); blue #2f5169 = the named model /
     vocabulary (the payoff); green #155c38 = the downstream economics (future work reasons through
     it). Hand-authored: a single vertical induction chain with phase-bracket gutter is not a Mermaid
     graph shape. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 954" width="680" height="954"
     role="img" aria-labelledby="rmbTitle rmbDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="rmbTitle">Inducing a model from brownfield structure: a vertical chain from realized code up to a named model, where weak mechanical discovery surfaces evidence and engineering judgment proposes, compares, and revises the representation</title>
  <desc id="rmbDesc">A single vertical chain of eight stages, read top to bottom. The first three stages are
    the mechanical-discovery phase (drawn neutral gray): realized code — repos, diffs, existing
    implementation; then repeated low-level forms — raw strings, tuples, repeated loops, ad hoc
    structures; then candidate regularities surfaced by weak detectors, retrieval, and clustering. The
    chain then crosses into the engineering-judgment phase (drawn in rust): contextual comparison, which
    asks which repetitions carry the same engineering meaning; then a candidate representation — what
    entities, relations, states, or distinctions explain the consequential regularity; then compare
    against instances — what does the representation preserve, and where does it break. Judgment produces
    the reusable-surface phase: an explicit model or typed vocabulary — JobId, MutationSpec, PdfModel,
    relations — and then future work that reasons through the model, so tools search and check it and
    agents reuse it rather than re-derive it. A bracket in the right gutter groups and labels the three
    phases. The point the figure makes: detectors surface repetition, but repetition alone does not
    determine the model — engineering judgment proposes and tests a representation that preserves the
    relationships needed for later reasoning.</desc>

  <defs>
    <marker id="rmb-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
    <marker id="rmb-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/>
    </marker>
    <marker id="rmb-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
    <marker id="rmb-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#155c38"/>
    </marker>
  </defs>

  <!-- ===== heading ===== -->
  <text x="356" y="42" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">Brownfield model induction</text>

  <!-- ===== NODES (the vertical chain) ===== -->
  <!-- 1. realized code (discovery) -->
  <rect id="n1" x="40" y="70" width="400" height="70" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.0"/>
  <text x="240" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">realized code</text>
  <text x="240" y="122" text-anchor="middle" font-size="13.6" font-style="italic" fill="#57534e">repos · diffs · existing implementation</text>

  <!-- 2. repeated low-level forms (discovery) -->
  <rect id="n2" x="40" y="166" width="400" height="88" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.0"/>
  <text x="240" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">repeated low-level forms</text>
  <text x="240" y="218" text-anchor="middle" font-size="13.6" font-style="italic" fill="#57534e">raw strings · tuples ·</text>
  <text x="240" y="236" text-anchor="middle" font-size="13.6" font-style="italic" fill="#57534e">repeated loops · ad hoc structures</text>

  <!-- 3. candidate regularities (discovery) -->
  <rect id="n3" x="40" y="280" width="400" height="70" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.0"/>
  <text x="240" y="310" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">candidate regularities</text>
  <text x="240" y="332" text-anchor="middle" font-size="13.6" font-style="italic" fill="#57534e">weak detectors · retrieval · clustering</text>

  <!-- 4. contextual comparison (JUDGMENT) -->
  <rect id="n4" x="40" y="376" width="400" height="88" rx="10" fill="#f6ece4" stroke="#9a3f12" stroke-width="2.0"/>
  <text x="240" y="406" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">contextual comparison</text>
  <text x="240" y="428" text-anchor="middle" font-size="13.6" font-style="italic" fill="#57534e">which repetitions carry the</text>
  <text x="240" y="446" text-anchor="middle" font-size="13.6" font-style="italic" fill="#57534e">same engineering meaning?</text>

  <!-- 5. candidate representation (JUDGMENT — the pivot: the proposal) -->
  <rect id="n5" x="40" y="490" width="400" height="88" rx="10" fill="#f6ece4" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="240" y="520" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f12">candidate representation</text>
  <text x="240" y="542" text-anchor="middle" font-size="13.6" font-style="italic" fill="#57534e">what entities, relations, states, or distinctions</text>
  <text x="240" y="560" text-anchor="middle" font-size="13.6" font-style="italic" fill="#57534e">explain the consequential regularity?</text>

  <!-- 6. compare against instances (JUDGMENT) -->
  <rect id="n6" x="40" y="604" width="400" height="88" rx="10" fill="#f6ece4" stroke="#9a3f12" stroke-width="2.0"/>
  <text x="240" y="634" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">compare against instances</text>
  <text x="240" y="656" text-anchor="middle" font-size="13.6" font-style="italic" fill="#57534e">what does the representation preserve?</text>
  <text x="240" y="674" text-anchor="middle" font-size="13.6" font-style="italic" fill="#57534e">where does it break?</text>

  <!-- 7. explicit model / typed vocabulary (reusable surface) -->
  <rect id="n7" x="40" y="718" width="400" height="70" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="240" y="748" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">explicit model / typed vocabulary</text>
  <text x="240" y="770" text-anchor="middle" font-size="13.6" font-style="italic" fill="#57534e">JobId · MutationSpec · PdfModel · relations</text>

  <!-- 8. future work reasons through the model (reusable surface) -->
  <rect id="n8" x="40" y="814" width="400" height="112" rx="10" fill="#e7f0ea" stroke="#155c38" stroke-width="2.4"/>
  <text x="240" y="844" text-anchor="middle" font-size="17" font-weight="700" fill="#155c38">future work reasons</text>
  <text x="240" y="866" text-anchor="middle" font-size="17" font-weight="700" fill="#155c38">through the model</text>
  <text x="240" y="888" text-anchor="middle" font-size="13.6" font-style="italic" fill="#57534e">tools search and check it ·</text>
  <text x="240" y="906" text-anchor="middle" font-size="13.6" font-style="italic" fill="#57534e">agents reuse rather than re-derive</text>

  <!-- ===== EDGES (directed; drawn on top so heads seat on the target border) ===== -->
  <!-- edge: n1 -> n2 -->
  <line x1="240" y1="140" x2="240" y2="164" stroke="#57534e" stroke-width="2.3" marker-end="url(#rmb-k)"/>
  <!-- edge: n2 -> n3 -->
  <line x1="240" y1="254" x2="240" y2="278" stroke="#57534e" stroke-width="2.3" marker-end="url(#rmb-k)"/>
  <!-- edge: n3 -> n4  (discovery crosses into judgment; colour turns) -->
  <line x1="240" y1="350" x2="240" y2="374" stroke="#9a3f12" stroke-width="2.6" marker-end="url(#rmb-r)"/>
  <!-- edge: n4 -> n5  (propose a representation) -->
  <line x1="240" y1="464" x2="240" y2="488" stroke="#9a3f12" stroke-width="2.3" marker-end="url(#rmb-r)"/>
  <!-- edge: n5 -> n6  (test it against instances) -->
  <line x1="240" y1="578" x2="240" y2="602" stroke="#9a3f12" stroke-width="2.3" marker-end="url(#rmb-r)"/>
  <!-- edge: n6 -> n7  (judgment produces the model) -->
  <line x1="240" y1="692" x2="240" y2="716" stroke="#2f5169" stroke-width="2.6" marker-end="url(#rmb-b)"/>
  <!-- edge: n7 -> n8  (the model enables downstream reuse) -->
  <line x1="240" y1="788" x2="240" y2="812" stroke="#155c38" stroke-width="2.3" marker-end="url(#rmb-g)"/>

  <!-- ===== PHASE BRACKETS (right gutter; grouping only — no arrowheads, not edges) ===== -->
  <!-- discovery: nodes 1-3 -->
  <path d="M472,70 L480,70 L480,350 L472,350" fill="none" stroke="#57534e" stroke-width="2.0"/>
  <text x="494" y="201" font-size="15" font-weight="700" fill="#57534e">mechanical</text>
  <text x="494" y="219" font-size="15" font-weight="700" fill="#57534e">discovery</text>
  <text x="494" y="238" font-size="13.6" font-style="italic" fill="#57534e">weak machinery</text>
  <text x="494" y="254" font-size="13.6" font-style="italic" fill="#57534e">surfaces evidence</text>
  <!-- judgment: nodes 4-6 -->
  <path d="M472,376 L480,376 L480,692 L472,692" fill="none" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="494" y="521" font-size="15" font-weight="700" fill="#9a3f12">engineering</text>
  <text x="494" y="539" font-size="15" font-weight="700" fill="#9a3f12">judgment</text>
  <text x="494" y="558" font-size="13.6" font-style="italic" fill="#9a3f12">propose · compare · revise</text>
  <!-- reusable surface: nodes 7-8 -->
  <path d="M472,718 L480,718 L480,926 L472,926" fill="none" stroke="#2f5169" stroke-width="2.4"/>
  <text x="494" y="809" font-size="15" font-weight="700" fill="#2f5169">reusable</text>
  <text x="494" y="827" font-size="15" font-weight="700" fill="#2f5169">surface</text>
  <text x="494" y="846" font-size="13.6" font-style="italic" fill="#57534e">later work reasons</text>
  <text x="494" y="862" font-size="13.6" font-style="italic" fill="#57534e">through the model</text>
</svg>
