<?xml version="1.0" encoding="UTF-8"?>
<!-- Fig 1.3-1 NEW (part1-copyedit-260815; folds to book/assets/agentic-substrate.svg).
     "The agentic substrate." Two supplying columns converge on the agent, which in turn acts on the
     engineered environment.
       FOUNDATION MODEL (blue = model palette) — semantic reasoning, probabilistic output, bounded
                        working state, cheap repeated reasoning.
       AGENTIC HARNESS  (gray = neutral machinery) — tool-mediated action, interposition, lifecycle
                        visibility, parallel execution.
     Both feed AGENT (blue), which acts on the ENGINEERED ENVIRONMENT (green = the engineered lever).
     Grayscale-survivable: every attribute labelled; the two-column convergence and the top-to-bottom
     order carry the meaning; hue only reinforces which family a column belongs to. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600"
     role="img" aria-labelledby="asTitle asDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="asTitle">The agentic substrate</title>
  <desc id="asDesc">Two columns supply the agent. The foundation model contributes semantic reasoning,
    probabilistic output, a bounded working state, and cheap repeated reasoning. The agentic harness
    contributes tool-mediated action, interposition, lifecycle visibility, and parallel execution. Both
    converge on the agent, a tool-using reasoner, which in turn acts on the engineered environment —
    the models, obligations, evidence, and controls the engineer builds.</desc>

  <defs>
    <marker id="as-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#fdfcf9"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">The agentic substrate</text>

  <!-- ===== LEFT column: foundation model (blue) ===== -->
  <rect x="60" y="72" width="400" height="242" rx="12" fill="#eef2f6" stroke="#2f5169" stroke-width="2.6"/>
  <text x="260" y="102" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.5" fill="#2f5169">FOUNDATION MODEL</text>

  <g fill="#fbfaf7" stroke="#57534e" stroke-width="1.6">
    <rect x="78" y="116" width="364" height="42" rx="8"/>
    <rect x="78" y="164" width="364" height="42" rx="8"/>
    <rect x="78" y="212" width="364" height="42" rx="8"/>
    <rect x="78" y="260" width="364" height="42" rx="8"/>
  </g>
  <text x="260" y="143" text-anchor="middle" font-size="16" fill="#1c1917">semantic reasoning</text>
  <text x="260" y="191" text-anchor="middle" font-size="16" fill="#1c1917">probabilistic output</text>
  <text x="260" y="239" text-anchor="middle" font-size="16" fill="#1c1917">bounded working state</text>
  <text x="260" y="287" text-anchor="middle" font-size="16" fill="#1c1917">cheap repeated reasoning</text>

  <!-- ===== RIGHT column: agentic harness (gray) ===== -->
  <rect x="540" y="72" width="400" height="242" rx="12" fill="#f3f1ee" stroke="#57534e" stroke-width="2.6"/>
  <text x="740" y="102" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.5" fill="#57534e">AGENTIC HARNESS</text>

  <g fill="#fbfaf7" stroke="#57534e" stroke-width="1.6">
    <rect x="558" y="116" width="364" height="42" rx="8"/>
    <rect x="558" y="164" width="364" height="42" rx="8"/>
    <rect x="558" y="212" width="364" height="42" rx="8"/>
    <rect x="558" y="260" width="364" height="42" rx="8"/>
  </g>
  <text x="740" y="143" text-anchor="middle" font-size="16" fill="#1c1917">tool-mediated action</text>
  <text x="740" y="191" text-anchor="middle" font-size="16" fill="#1c1917">interposition</text>
  <text x="740" y="239" text-anchor="middle" font-size="16" fill="#1c1917">lifecycle visibility</text>
  <text x="740" y="287" text-anchor="middle" font-size="16" fill="#1c1917">parallel execution</text>

  <!-- convergence to agent -->
  <path d="M260,314 C260,360 400,352 452,388" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#as-k)"/>
  <path d="M740,314 C740,360 600,352 548,388" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#as-k)"/>

  <!-- AGENT node (blue) -->
  <rect x="400" y="390" width="200" height="64" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="3"/>
  <text x="500" y="418" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Agent</text>
  <text x="500" y="440" text-anchor="middle" font-size="14.5" fill="#57534e">a tool-using reasoner</text>

  <line x1="500" y1="454" x2="500" y2="488" stroke="#57534e" stroke-width="2.4" marker-end="url(#as-k)"/>

  <!-- ENGINEERED ENVIRONMENT node (green) -->
  <rect x="320" y="490" width="360" height="72" rx="12" fill="#e3f0e7" stroke="#155c38" stroke-width="3.2"/>
  <text x="500" y="521" text-anchor="middle" font-size="19" font-weight="700" fill="#155c38">Engineered Environment</text>
  <text x="500" y="545" text-anchor="middle" font-size="14.5" fill="#57534e">models &#183; obligations &#183; evidence &#183; controls</text>
</svg>
