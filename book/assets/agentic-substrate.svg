<svg xmlns="http://www.w3.org/2000/svg" width="990" height="306" viewBox="-2 -2 440 136" role="img" aria-labelledby="title desc" font-family="Source Sans 3, sans-serif"><title id="title">Commodity intelligence in a governed engineering environment</title><desc id="desc">Training supplies the foundation model. The model sends outputs to the harness and receives context. The harness acts on the governed engineering environment and receives evidence. Engineers maintain the environment, which supplies project knowledge and controls which actions are permitted.</desc>
