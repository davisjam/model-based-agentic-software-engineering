<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -2 450 264" width="1012.5" height="594" role="img" aria-labelledby="asTitle asDesc" font-family="'Source Sans 3', sans-serif">
<title id="asTitle">Commodity intelligence in a governed engineering environment</title>
<desc id="asDesc">Model development transforms training data through training into a foundation model. In the acting system, the foundation model exchanges outputs and context with an agentic harness; the harness exchanges actions and results with the governed engineering environment. Four model properties lead to engineering implications: broad reasoning enables delegated implementation; probabilistic output requires assurance; finite working state motivates external representations and retrieval; inexpensive inference enables repeated automated work. The harness supplies tools and integrations, context management, interposition and checks, and parallel or staged execution. The environment includes both the existing system and engineering structure: models, obligations, instructions, procedures, tools, permissions, evidence and controls. The engineer develops and maintains the environment to supply guidance and governance, and may also improve the model through training or fine-tuning.</desc>
