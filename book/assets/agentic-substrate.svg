<text x="55.5" y="106" text-anchor="middle" font-size="10" font-weight="normal" font-style="italic">reasoning</text>
<text x="206" y="72" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal">Agentic harness</text>
