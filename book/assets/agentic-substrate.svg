<text x="373.5" y="78" text-anchor="middle" font-size="11" font-weight="bold" font-style="normal">environment (GEE)</text>
<text x="373.5" y="96" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal">Existing system</text>
<text x="373.5" y="109" text-anchor="middle" font-size="10" font-weight="normal" font-style="normal">Project knowledge</text>
