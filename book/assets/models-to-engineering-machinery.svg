<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 332" width="448" height="332" role="img" aria-labelledby="title desc" font-family="'Source Sans 3', sans-serif">
<title id="title">From engineering models to engineering machinery</title>
<desc id="desc">An engineering model supports three parallel uses: analyze the model, construct a realization, and construct evaluation machinery. The construction branches include types and configuration, transition rules, code or structures, tests and expected results, runtime monitors, data validators, and verification requirements. Model analysis produces evidence about the model. An implementation and tests, monitors, or validators feed implementation evaluation, which produces distinct implementation evidence. A separate semantic-commitment strip applies to all three uses: less explicit meaning requires more interpretation; more explicit meaning creates more opportunities for mechanization. The uses are choices, not stages or a maturity ranking.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c1917" /></marker></defs>
