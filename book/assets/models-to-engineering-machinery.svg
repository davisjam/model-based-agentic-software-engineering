<text x="162" y="94" text-anchor="start" font-size="10" fill="#1c1917">• Types and configuration</text>
<text x="162" y="106" text-anchor="start" font-size="10" fill="#1c1917">• Transition rules</text>
<text x="162" y="118" text-anchor="start" font-size="10" fill="#1c1917">• Code or structures</text>
<rect x="306" y="62" width="138" height="90" rx="3" fill="#f0f0f0" stroke="#1c1917" stroke-width=".65" />
<text x="375.0" y="76" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">Construct evaluation</text>
<text x="375.0" y="88" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">machinery</text><text x="314" y="106" text-anchor="start" font-size="10" fill="#1c1917">• Tests and expected results</text>
<text x="314" y="118" text-anchor="start" font-size="10" fill="#1c1917">• Runtime monitors</text>
<text x="314" y="130" text-anchor="start" font-size="10" fill="#1c1917">• Data validators</text>
<text x="314" y="142" text-anchor="start" font-size="10" fill="#1c1917">• Verification requirements</text><path d="M 224 38 L 224 50 L 72 50 L 72 62" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)" />
<path d="M 224 38 L 224 62" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)" />
<path d="M 224 50 L 375 50 L 375 62" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)" />
<rect x="2" y="170" width="140" height="28" rx="3" fill="white" stroke="#1c1917" stroke-width=".65" />
