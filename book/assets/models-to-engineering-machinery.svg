<path d="M 224 198 L 224 224" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)" />
<path d="M 375 198 L 375 210 L 224 210 L 224 224" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)" />
