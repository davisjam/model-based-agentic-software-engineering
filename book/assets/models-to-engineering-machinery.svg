<text x="224" y="280" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">Semantic commitment</text>
<text x="224" y="292" text-anchor="middle" font-size="10" fill="#1c1917" font-style="italic">Applies to all three uses</text>
<text x="91" y="309" text-anchor="middle" font-size="10" fill="#1c1917">Less explicit meaning</text>
<text x="91" y="322" text-anchor="middle" font-size="10" fill="#1c1917">More interpretation</text>
<text x="357" y="309" text-anchor="middle" font-size="10" fill="#1c1917">More explicit meaning</text>
<text x="357" y="322" text-anchor="middle" font-size="10" fill="#1c1917">More mechanization possible</text>
