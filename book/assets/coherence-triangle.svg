<?xml version="1.0" encoding="UTF-8"?>
<!-- 2.8 checked-predicates figure (part2-v8-260814 re-author; folds to book/assets/coherence-triangle.svg).
     REVISION per v8 editor guidance (2.8-6): DELETE the triangle. Draw a linear pipeline instead:
     STRUCTURED MODEL supports predicates over INVARIANTS, evaluated by a CHECKER, with a side arrow
     "recurring failure to a new / refined invariant". The example invariant is the stronger lease predicate
     (status == "leased") == (lease_owner is not None), i.e. leased iff owner exists. Scoped as ONE
     executable-model pattern, not the definition of executability. Grammar: blue #2f5169/#e7edf3 = the
     structured model; rust #9a3f12/#faf1e6 = the invariants; green #155c38/#e3f0e7 = the checker.
     Hand-authored (a linear model -> predicates -> checker pipeline). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380"
     role="img" aria-labelledby="ctTitle ctDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="ctTitle">Checked predicates over a structured model: model, invariants, checker</title>
  <desc id="ctDesc">A linear pipeline. A structured model of records, edges, and states supports predicates
    over its domain. Those predicates are invariants, each with a stable id and a declared domain, for
    example the lease invariant leased if and only if an owner exists. A checker — a model check, a drift
    lint, or a validator — evaluates them. A side arrow shows that a recurring failure yields a new or
    refined invariant. This is one executable-model pattern, not the definition of executability.</desc>

  <defs>
    <marker id="ct-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
    <marker id="ct-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- STRUCTURED MODEL (blue) -->
  <rect id="model" x="30" y="96" width="270" height="130" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="165" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">STRUCTURED MODEL</text>
  <text x="165" y="167" text-anchor="middle" font-size="16" fill="#57534e">records &#183; edges &#183; states</text>
  <text x="165" y="196" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">a job: free / leased / done</text>

  <!-- INVARIANTS (rust) -->
  <rect id="invariants" x="365" y="96" width="270" height="130" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="500" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">INVARIANTS</text>
  <text x="500" y="165" text-anchor="middle" font-size="15" fill="#57534e">stable ids + declared domains</text>
  <rect x="388" y="180" width="224" height="34" rx="6" fill="#fbfdff" stroke="#9a3f12" stroke-width="1.2"/>
  <text x="500" y="203" text-anchor="middle" font-size="15" fill="#9a3f12">leased &#8660; owner exists</text>

  <!-- CHECKER (green) -->
  <rect id="checker" x="700" y="96" width="270" height="130" rx="10" fill="#e3f0e7" stroke="#155c38" stroke-width="2.6"/>
  <text x="835" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">CHECKER</text>
  <text x="835" y="167" text-anchor="middle" font-size="15" fill="#57534e">model check &#183; drift lint</text>
  <text x="835" y="190" text-anchor="middle" font-size="15" fill="#57534e">&#183; validator</text>

  <!-- edges -->
  <!-- edge-grammar: keep-angles -->
  <!-- Opts out of orthogonalization: checker <-> invariants is a two-way pair drawn as arcs that bow apart; straightening both collapses them onto one line. -->
  <!-- edge: model -> invariants -->
  <line x1="300" y1="161" x2="363" y2="161" stroke="#57534e" stroke-width="2.2" marker-end="url(#ct-k)"/>
  <text x="332" y="130" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">supports</text>
  <text x="332" y="146" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">predicates over</text>
  <!-- edge: invariants -> checker -->
  <line x1="635" y1="161" x2="698" y2="161" stroke="#57534e" stroke-width="2.2" marker-end="url(#ct-k)"/>
  <text x="667" y="138" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">evaluated by</text>

  <!-- side arrow: recurring failure -> new/refined invariant -->
  <!-- edge: checker .. invariants -->
  <path d="M835,226 C835,286 620,296 500,296 C500,296 500,270 500,230" fill="none" stroke="#9a3f12" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#ct-r)"/>
  <text x="668" y="320" text-anchor="middle" font-size="15" font-style="italic" fill="#9a3f12">recurring failure &#8594; new / refined invariant</text>

  <!-- footer: protect the point -->
  <text x="500" y="358" text-anchor="middle" font-size="15" font-style="italic" fill="#1c1917">One executable-model pattern &#8212; the model supplies the domain, invariants state properties, a checker evaluates them; not the definition of executability.</text>
</svg>
