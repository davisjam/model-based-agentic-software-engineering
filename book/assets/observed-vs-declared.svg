<?xml version="1.0" encoding="UTF-8"?>
<!-- Figure 2.5 concept (part2-content-revision-260814; folds to book/assets/).
     Observed structure and declared structure answer different questions. The IMPLEMENTATION panel (gray)
     shows what the code actually does: A calls B, and A calls C. The MODEL panel (blue) shows what the
     intended system declares: A -> B is a declared edge; between A and C there is NO edge — the rust X marks
     the relation the decision model forbids. The implementation asks "Does A call C?" (observed fact); the
     model asks "May A call C?" (declared permission). Grammar: gray #57534e = observed implementation edges;
     blue #2f5169 = declared model edges; rust #9a3f12 = the absent/forbidden edge. Hand-authored. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400"
     role="img" aria-labelledby="ovTitle ovDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="ovTitle">Observed structure versus declared structure answer different questions</title>
  <desc id="ovDesc">Two panels. On the left, the implementation, in gray: A calls B and A calls C, observed
    facts, asking does A call C. On the right, the model, in blue: A to B is a declared edge, and between A
    and C there is no edge, marked with a rust X, asking may A call C. Agreement between observed and
    declared establishes correspondence, not correctness.</desc>

  <defs>
    <marker id="ov-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
    <marker id="ov-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <!-- divider -->
  <line x1="450" y1="60" x2="450" y2="300" stroke="#d9d3c8" stroke-width="1.6"/>

  <!-- ===== LEFT: IMPLEMENTATION (gray, observed) ===== -->
  <text x="225" y="42" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.2" fill="#57534e">OBSERVED SYSTEM</text>
  <!-- nodes -->
  <g font-size="18" font-weight="700" text-anchor="middle">
    <circle cx="150" cy="110" r="26" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>
    <text x="150" y="117" fill="#57534e">A</text>
    <circle cx="320" cy="110" r="26" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>
    <text x="320" y="117" fill="#57534e">B</text>
    <circle cx="320" cy="220" r="26" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>
    <text x="320" y="227" fill="#57534e">C</text>
  </g>
  <line x1="178" y1="110" x2="290" y2="110" stroke="#57534e" stroke-width="2.4" marker-end="url(#ov-k)"/>
  <line x1="171" y1="130" x2="299" y2="205" stroke="#57534e" stroke-width="2.4" marker-end="url(#ov-k)"/>
  <text x="225" y="286" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1c1917">&#8220;Does A call C?&#8221;</text>

  <!-- ===== RIGHT: MODEL (blue, declared) ===== -->
  <text x="675" y="42" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.2" fill="#2f5169">DECLARED POLICY</text>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <circle cx="600" cy="110" r="26" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
    <text x="600" y="117" fill="#2f5169">A</text>
    <circle cx="770" cy="110" r="26" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
    <text x="770" y="117" fill="#2f5169">B</text>
    <circle cx="770" cy="220" r="26" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
    <text x="770" y="227" fill="#2f5169">C</text>
  </g>
  <line x1="628" y1="110" x2="740" y2="110" stroke="#2f5169" stroke-width="2.4" marker-end="url(#ov-b)"/>
  <text x="684" y="98" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">declared</text>
  <!-- no edge A..C: rust dashed + X -->
  <line x1="621" y1="130" x2="749" y2="205" stroke="#9a3f12" stroke-width="2.2" stroke-dasharray="7 6" opacity="0.85"/>
  <g stroke="#9a3f12" stroke-width="3.4" stroke-linecap="round">
    <line x1="674" y1="157" x2="696" y2="179"/>
    <line x1="696" y1="157" x2="674" y2="179"/>
  </g>
  <text x="628" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3f12">no edge</text>
  <text x="675" y="286" text-anchor="middle" font-size="15.5" font-weight="700" fill="#9a3f12">&#8220;May A call C?&#8221;</text>

  <!-- footer: protect the point -->
  <text x="450" y="346" text-anchor="middle" font-size="15.5" font-style="italic" fill="#1c1917">Observation reveals what is; the decision model declares what belongs.</text>
  <text x="450" y="368" text-anchor="middle" font-size="15.5" font-style="italic" fill="#1c1917">Agreement between them establishes correspondence, not correctness.</text>
</svg>
