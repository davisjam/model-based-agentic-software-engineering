<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 298" width="270" height="298" role="img" aria-labelledby="entDomT entDomD" font-family="&quot;Source Sans 3&quot;, sans-serif"><ns0:title xmlns:ns0="http://www.w3.org/2000/svg" id="entDomT">The upload-entitlement domain: users, groups, finite and unlimited entitlement, and the admission decision</ns0:title>
  <ns0:desc xmlns:ns0="http://www.w3.org/2000/svg" id="entDomD">A user belongs to one or more groups. A group is either a finite-credit group, carrying remaining credits, or an unlimited group, carrying no credit limit. Both kinds feed the upload decision, which must preserve both facts and ends in admit or reject.</ns0:desc>
  <defs><marker id="a2f5169" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#2f5169"/></marker><marker id="a57534e" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#57534e"/></marker><marker id="a086438" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#086438"/></marker><marker id="a1c1917" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#1c1917"/></marker></defs>
