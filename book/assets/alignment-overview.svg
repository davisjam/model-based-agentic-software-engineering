<path d="M225 278 L225 294" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M350 166 L400 166 L400 321 L350 321" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M40 166 L40 321 L100 321" fill="none" stroke="#1c1917" stroke-width=".65" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="4" y="253" width="72" height="28" fill="#ffffff"/>
<text x="40" y="264" text-anchor="middle" font-size="9" font-style="italic" fill="#1c1917">Constraint /</text><text x="40" y="275" text-anchor="middle" font-size="9" font-style="italic" fill="#1c1917">check result</text>
<path d="M225 348 V356" fill="none" stroke="#1c1917" stroke-width=".65"/>
<path d="M225 356 L158 356 L158 372" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M225 356 L300 356 L300 372" fill="none" stroke="#1c1917" stroke-width=".65" marker-end="url(#arrow)"/>
</svg>
