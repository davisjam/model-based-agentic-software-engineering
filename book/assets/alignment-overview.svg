<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 354" width="450" height="354" role="img" aria-labelledby="title desc" font-family="'Source Sans 3', sans-serif">
<title id="title">Alignment from models to enforcement</title>
<desc id="desc">Engineering models supply selected obligations. One branch restricts agentic work through constraints; another supplies evaluation rules derived from modeled obligations. Sensors obtain evidence from the work. Gates use evidence, evaluation rules, and optional constraint-check results to admit work or refuse it for revision. Constraints can also enforce directly without a gate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c1917"/></marker></defs>
<rect x="138.0" y="2.0" width="174" height="32" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="225" y="16.5" text-anchor="middle" font-size="11" fill="#1c1917" font-weight="700">Engineering Models</text>
<text x="225" y="29.5" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">Architecture · Behavior · Policy</text>
<rect x="143.0" y="46.0" width="164" height="32" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="225" y="60.5" text-anchor="middle" font-size="11" fill="#1c1917" font-weight="700">Selected Obligations</text>
<text x="225" y="73.5" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">Properties · Bounds · Rules</text>
<rect x="7.0" y="94.0" width="154" height="44" rx="3" fill="#ebebeb" stroke="#1c1917" stroke-width=".65"/>
<text x="84" y="109.0" text-anchor="middle" font-size="11" fill="#1c1917" font-weight="700">Constraints</text>
<text x="84" y="122.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">Restrict actions or states</text>
<text x="84" y="133.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">(types, permissions, interfaces)</text>
<rect x="284.0" y="94.0" width="158" height="44" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="363" y="109.0" text-anchor="middle" font-size="11" fill="#1c1917" font-weight="700">Evaluation Rules</text>
<text x="363" y="122.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">Predicates derived from</text>
<text x="363" y="133.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">modeled obligations</text>
<rect x="128.0" y="148.0" width="194" height="40" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="225" y="161.0" text-anchor="middle" font-size="11" fill="#1c1917" font-weight="700">Agentic Work</text>
<text x="225" y="174.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">Proposed actions · Implementation</text>
<text x="225" y="185.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">Runtime behavior</text>
<rect x="138.0" y="200.0" width="174" height="42" rx="3" fill="#ebebeb" stroke="#1c1917" stroke-width=".65"/>
<text x="225" y="214.0" text-anchor="middle" font-size="11" fill="#1c1917" font-weight="700">Sensors</text>
<text x="225" y="227.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">Obtain evidence from the work</text>
<text x="225" y="238.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">(SAST, DAST, instrumentation)</text>
<rect x="134.0" y="253.0" width="182" height="56" rx="3" fill="#ebebeb" stroke="#1c1917" stroke-width=".65"/>
<text x="225" y="268.5" text-anchor="middle" font-size="11" fill="#1c1917" font-weight="700">Gates</text>
<text x="225" y="281.5" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">Use evaluation results to control</text>
<text x="225" y="292.5" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">whether work may proceed</text>
<text x="225" y="303.5" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">(merge, deployment, authorization)</text>
<rect x="136.0" y="329.0" width="72" height="22" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".65"/>
<text x="172" y="344.0" text-anchor="middle" font-size="11" fill="#1c1917" font-weight="700">Admit</text>
