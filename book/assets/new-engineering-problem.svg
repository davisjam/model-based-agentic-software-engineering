<?xml version="1.0" encoding="UTF-8"?>
<!-- R42 REVISION (off-main scratch; folds over book/assets/new-engineering-problem.svg, label
     new-engineering-problem). Hand-authored SVG (not Mermaid). Fig 1.1-1.
     THESIS CHANGE per editor part1-3.md: "engineering leverage moves into the environment" — NOT
     "the environment determines quality". The figure no longer claims the environment ALONE sets
     quality; agent capability, tools, the implementation, requirements, and reality still matter.
     Two stacked pipelines:
       CLASSICAL — Engineer -> Implementation -> Product quality; the engineer's substantial direct
                   effort acts through the implementation.
       AGENTIC   — Engineer -> Engineered Environment -> Agents -> Implementation -> Product quality;
                   the Engineered Environment is the PRIMARY ENGINEERED LEVER.
     Node relabels vs landed asset: Code -> Implementation, Quality -> Product quality, Environment ->
     Engineered Environment. The "environment now determines quality" callout is REMOVED and replaced
     by the leverage framing. Strip item list = editor's: models · policies · evidence · validators ·
     infrastructure (dropped "skills", added "evidence"); GEE parenthetical retained (book vocabulary).
     Semantic colour: green = environment/modeling, blue = engineer + agents, gray = neutral
     implementation, rust = the leverage callout emphasis. Palette: fleet #2f5169, governed green
     #155c38/#1f7a4d, muted #57534e, accent #9a3f12, rule #e4e0d8, page #fdfcf9. Fonts 15-26. -->
<!-- semantic-families: agent, governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600"
     role="group" aria-labelledby="nepTitle nepDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="nepTitle">A new engineering problem: engineering leverage moves into the environment</title>
  <desc id="nepDesc">Two pipelines are stacked for contrast. The top pipeline, classical software
    engineering, has three stages: Engineer, then Implementation, then Product quality — the engineer's
    substantial direct effort acts through the implementation. The bottom pipeline, agentic software
    engineering, has five stages: Engineer, then Engineered Environment, then Agents, then
    Implementation, then Product quality. Agents perform the implementation inside an engineering
    environment the engineer builds, and that environment is the primary engineered lever. A strip
    beneath the pipeline unpacks the environment: models, policies, evidence, validators, and
    infrastructure. As implementation becomes abundant, more of the engineer's leverage moves into the
    environment that represents intent, constrains work, and evaluates what the fleet produces. The
    environment is where the engineer increasingly obtains leverage; it does not alone determine quality.</desc>

  <defs>
    <marker id="nep-neutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="nep-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
    <marker id="nep-env" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#fdfcf9"/>
  <text x="500" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">A new engineering problem</text>
  <text x="500" y="66" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">When agents perform the implementation, engineering leverage moves into the environment.</text>

  <!-- ===== CLASSICAL pipeline (top) ===== -->
  <text x="30" y="104" font-size="16" font-weight="700" letter-spacing="1.5" fill="#57534e">CLASSICAL SE</text>
  <text x="30" y="124" font-size="16" font-style="italic" fill="#57534e">the engineer writes most implementation directly</text>

  <!-- edge: eng-c -> impl-c -->
  <path d="M300,173 L348,173" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#nep-neutral)"/>
  <!-- edge: impl-c -> pq-c -->
  <path d="M560,173 L608,173" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#nep-neutral)"/>

  <rect id="eng-c" x="150" y="146" width="150" height="54" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="225" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Engineer</text>
  <rect id="impl-c" x="350" y="146" width="210" height="54" rx="9" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="455" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Implementation</text>
  <rect id="pq-c" x="610" y="146" width="180" height="54" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="700" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Product quality</text>

  <!-- classical lever annotation: the engineer's direct effort acts through the implementation -->
  <!-- transparent anchor spanning the arrow tail + the label so the annotation arrow plugs into a named node -->
  <rect id="classical-effort" x="310" y="228" width="290" height="26" fill="none" stroke="none"/>
  <!-- edge: classical-effort -> impl-c -->
  <line x1="455" y1="228" x2="455" y2="202" stroke="#57534e" stroke-width="1.8" marker-end="url(#nep-neutral)"/>
  <text x="455" y="248" text-anchor="middle" font-size="16" fill="#57534e">substantial direct engineering effort</text>

  <!-- divider between the two regimes -->
  <line x1="30" y1="272" x2="970" y2="272" stroke="#e4e0d8" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- ===== AGENTIC pipeline (bottom) ===== -->
  <text x="30" y="304" font-size="16" font-weight="700" letter-spacing="1.5" fill="#155c38">AGENTIC SE</text>
  <text x="30" y="324" font-size="16" font-style="italic" fill="#57534e">agents perform the implementation, inside an engineered environment</text>

  <!-- edge: eng-a -> env -->
  <path d="M146,371 L166,371" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#nep-neutral)"/>
  <!-- edge: env -> agents -->
  <path d="M350,371 L370,371" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#nep-neutral)"/>
  <!-- edge: agents -> impl-a -->
  <path d="M492,371 L512,371" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#nep-neutral)"/>
  <!-- edge: impl-a -> pq-a -->
  <path d="M690,371 L710,371" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#nep-neutral)"/>

  <rect id="eng-a" x="20" y="344" width="126" height="54" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="83" y="378" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">Engineer</text>

  <rect id="env" x="168" y="340" width="182" height="62" rx="9" fill="#e3f0e7" stroke="#155c38" stroke-width="3.2"/>
  <text x="259" y="367" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">Engineered</text>
  <text x="259" y="388" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">Environment</text>

  <rect id="agents" x="372" y="344" width="120" height="54" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="432" y="378" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">Agents</text>

  <rect id="impl-a" x="514" y="344" width="176" height="54" rx="9" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="602" y="378" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Implementation</text>

  <rect id="pq-a" x="712" y="344" width="150" height="54" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="787" y="378" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">Product quality</text>

  <!-- agentic lever annotation: the environment is the primary engineered lever -->
  <!-- transparent anchor spanning the arrow tail + the label so the annotation arrow plugs into a named node -->
  <rect id="primary-lever" x="159" y="430" width="200" height="26" fill="none" stroke="none"/>
  <!-- edge: primary-lever -> env -->
  <line x1="259" y1="430" x2="259" y2="404" stroke="#9a3f12" stroke-width="2" marker-end="url(#nep-accent)"/>
  <text x="259" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3f12">primary engineered lever</text>

  <!-- leverage framing callout (NOT "determines quality") -->
  <text x="620" y="446" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f12">Engineering leverage moves into the environment.</text>
  <text x="620" y="468" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">the instructions, representations, constraints, and evidence that shape autonomous work</text>

  <!-- ===== the environment, unpacked ===== -->
  <rect x="150" y="500" width="700" height="70" rx="12" fill="#eef7f0" stroke="#1f7a4d" stroke-width="2"/>
  <text x="500" y="530" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">Inside the Engineered Environment (the governed engineering environment)</text>
  <text x="500" y="554" text-anchor="middle" font-size="16" fill="#57534e">models · policies · evidence · validators · infrastructure</text>
</svg>
