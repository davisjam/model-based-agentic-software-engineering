<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h6-assurance-decidable-semantic.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 580" width="620" height="580"
     role="img" aria-labelledby="h6Title h6Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h6Title">The determinization frontier in assurance</title>
  <desc id="h6Desc">An obligation is interpreted into a claim. The claim splits at the determinization frontier: a
    decidable part is settled by a checker, proof, validator, or test, while a residual semantic judgment is
    settled by human review or expert decision. Both paths produce evidence, which supports the assurance claim.
    The frontier marks which assurance judgments can responsibly become repeatable and which cannot.</desc>

  <defs>
    <marker id="h6-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
    <marker id="h6-ah-u" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/></marker>
  </defs>

  <rect x="0" y="0" width="620" height="580" fill="#fdfcf9"/>

  <rect x="230" y="30" width="160" height="44" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="310" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">OBLIGATION</text>

  <line x1="310" y1="74" x2="310" y2="110" stroke="#57534e" stroke-width="2.2" marker-end="url(#h6-ah)"/>
  <rect x="220" y="112" width="180" height="42" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="310" y="139" text-anchor="middle" font-size="15" fill="#1c1917">interpretation</text>

  <line x1="310" y1="154" x2="310" y2="190" stroke="#57534e" stroke-width="2.2" marker-end="url(#h6-ah)"/>
  <rect x="245" y="192" width="130" height="42" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="310" y="219" text-anchor="middle" font-size="15" fill="#1c1917">claim</text>

  <!-- split at the frontier -->
  <path d="M310,234 L150,234 L150,278" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#h6-ah-u)"/>
  <path d="M310,234 L470,234 L470,278" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#h6-ah)"/>
  <text x="150" y="258" text-anchor="middle" font-size="13" font-style="italic" fill="#9a3f12">decidable?</text>
  <text x="470" y="258" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">semantic judgment</text>

  <rect x="50" y="280" width="200" height="60" rx="9" fill="#f7efe8" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="150" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3f12">checker · proof</text>
  <text x="150" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3f12">validator · test</text>

  <rect x="370" y="280" width="200" height="60" rx="8" fill="#eef2f5" stroke="#2f5169" stroke-width="2.5"/>
  <text x="470" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#2f5169">human review</text>
  <text x="470" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#2f5169">expert decision</text>

  <!-- converge to evidence -->
  <path d="M150,340 L150,384 L310,384" fill="none" stroke="#57534e" stroke-width="2"/>
  <path d="M470,340 L470,384 L310,384" fill="none" stroke="#57534e" stroke-width="2"/>
  <line x1="310" y1="384" x2="310" y2="410" stroke="#57534e" stroke-width="2.2" marker-end="url(#h6-ah)"/>

  <rect x="240" y="412" width="140" height="44" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="310" y="440" text-anchor="middle" font-size="15" fill="#1c1917">evidence</text>

  <line x1="310" y1="456" x2="310" y2="492" stroke="#57534e" stroke-width="2.2" marker-end="url(#h6-ah)"/>
  <rect x="215" y="494" width="190" height="46" rx="9" fill="#faf6ef" stroke="#57534e" stroke-width="2.5"/>
  <text x="310" y="522" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">assurance claim</text>
</svg>
