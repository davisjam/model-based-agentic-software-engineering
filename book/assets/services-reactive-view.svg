<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 576" width="880" height="576" role="group" aria-labelledby="srv-title srv-desc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="srv-title">The reactive service topology, and why it made serverless natural</title>
  <desc id="srv-desc">Two stacked panels compare the same event-driven flow under two deployment targets. The top panel, the reactive seam, reads left to right: the web front door accepts an upload and enqueues chunks onto a work queue; a queue hands each chunk to a stateless worker that remediates it and publishes a completion; a fan-in step collects the completions and assembles the finished document. Every arrow is an event, not a poll. A note reads: services are reactive and stateless; Redis carries communication, the database carries truth. The bottom panel shows the same flow realized two ways. On the left, the retired Kubernetes poll plane: workers reach into size-stratified Redis queues to claim work, and a custom autoscaler watches queue depth to add or remove worker pods. On the right, the serverless push plane: a managed task queue pushes each chunk to a worker that scales from zero, and a managed topic fans in completions, with no custom autoscaler at all. The takeaway, stated across the bottom: because the services were already reactive and stateless, moving from poll to push was a change of deployment target, not a rewrite. The reactive seam was the enabler.</desc>

  <rect x="0" y="0" width="880" height="576" fill="#ffffff"/>

  <defs>
    <marker id="srv-arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- ===================== TOP PANEL: the reactive seam ===================== -->
  <text x="30" y="40" font-size="21.12" font-weight="bold" fill="#2f5169">The reactive seam</text>

  <!-- web front door -->
  <rect id="web" x="24" y="70" width="178" height="90" rx="3" fill="#e7edf3" stroke="#2f5169" stroke-width="1.8"/>
  <text x="113" y="105" text-anchor="middle" font-size="21.12" font-weight="bold" fill="#2f5169">Web</text>
  <text x="113" y="132" text-anchor="middle" font-size="19" fill="#2f5169">front door;</text>
  <text x="113" y="151" text-anchor="middle" font-size="19" fill="#2f5169">splits into chunks</text>

  <!-- enqueue arrow -->
  <!-- edge: web -> queue -->
  <line x1="202" y1="115" x2="269" y2="115" stroke="#1c1917" stroke-width="1.6" marker-end="url(#srv-arrow)"/>
  <text x="236" y="103" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">enqueue</text>

  <!-- queue -->
  <rect id="queue" x="271" y="70" width="132" height="90" rx="3" fill="#f2effb" stroke="#7c6bb0" stroke-width="1.8"/>
  <text x="337" y="112" text-anchor="middle" font-size="21.12" font-weight="bold" fill="#7c6bb0">Queue</text>
  <text x="337" y="139" text-anchor="middle" font-size="19" fill="#7c6bb0">chunk = task</text>

  <!-- push arrow -->
  <!-- edge: queue -> worker -->
  <line x1="403" y1="115" x2="470" y2="115" stroke="#1c1917" stroke-width="1.6" marker-end="url(#srv-arrow)"/>
  <text x="437" y="103" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">hands off</text>

  <!-- worker -->
  <rect id="worker" x="472" y="70" width="200" height="90" rx="3" fill="#e7edf3" stroke="#2f5169" stroke-width="1.8"/>
  <text x="572" y="105" text-anchor="middle" font-size="21.12" font-weight="bold" fill="#2f5169">Worker</text>
  <text x="572" y="132" text-anchor="middle" font-size="19" fill="#2f5169">stateless;</text>
  <text x="572" y="151" text-anchor="middle" font-size="19" fill="#2f5169">remediates a chunk</text>

  <!-- publish arrow to fan-in -->
  <!-- edge: worker -> fanin -->
  <line x1="672" y1="115" x2="740" y2="115" stroke="#1c1917" stroke-width="1.6" marker-end="url(#srv-arrow)"/>
  <text x="707" y="103" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">publishes</text>

  <!-- fan-in -->
  <rect id="fanin" x="742" y="70" width="114" height="90" rx="3" fill="#f2effb" stroke="#7c6bb0" stroke-width="1.8"/>
  <text x="799" y="106" text-anchor="middle" font-size="24" font-weight="bold" fill="#7c6bb0">Fan-in</text>
  <text x="799" y="133" text-anchor="middle" font-size="19" fill="#7c6bb0">assembles</text>
  <text x="799" y="151" text-anchor="middle" font-size="19" fill="#7c6bb0">the file</text>

  <!-- reactive note -->
  <text x="30" y="188" font-size="19" font-style="italic" fill="#57534e">Every arrow is an event, never a poll. Services stay reactive and stateless —</text>
  <text x="30" y="210" font-size="19" font-style="italic" fill="#57534e">Redis carries communication, the database carries truth.</text>

  <!-- divider -->
  <line x1="24" y1="222" x2="856" y2="222" stroke="#e4e0d8" stroke-width="1.4"/>

  <!-- ===================== BOTTOM PANEL: two realizations ===================== -->
  <text x="30" y="262" font-size="21.12" font-weight="bold" fill="#2f5169">Same flow, two deployment targets</text>

  <!-- LEFT: poll plane (retired) -->
  <rect x="24" y="284" width="390" height="196" rx="4" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.6"/>
  <text x="219" y="314" text-anchor="middle" font-size="22" font-weight="bold" fill="#9a3f12">Kubernetes poll plane (retired)</text>

  <rect x="48" y="332" width="156" height="70" rx="3" fill="#ffffff" stroke="#9a3f12" stroke-width="1.4"/>
  <text x="126" y="360" text-anchor="middle" font-size="20" font-weight="bold" fill="#9a3f12">Worker pool</text>
  <text x="126" y="384" text-anchor="middle" font-size="19" fill="#9a3f12">pulls work</text>

  <rect x="234" y="332" width="156" height="70" rx="3" fill="#ffffff" stroke="#9a3f12" stroke-width="1.4"/>
  <text x="312" y="356" text-anchor="middle" font-size="24" font-weight="bold" fill="#9a3f12">Custom</text>
  <text x="312" y="378" text-anchor="middle" font-size="24" font-weight="bold" fill="#9a3f12">autoscaler</text>

  <text x="48" y="432" font-size="19" fill="#9a3f12">Workers PULL from size-stratified Redis</text>
  <text x="48" y="453" font-size="19" fill="#9a3f12">queues; a bespoke loop watches depth</text>
  <text x="48" y="474" font-size="19" fill="#9a3f12">and adds or removes pods.</text>

  <!-- RIGHT: push plane (serverless) -->
  <rect x="466" y="284" width="390" height="196" rx="4" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.6"/>
  <text x="661" y="314" text-anchor="middle" font-size="22" font-weight="bold" fill="#155c38">Serverless push plane</text>

  <rect x="490" y="332" width="156" height="70" rx="3" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.4"/>
  <text x="568" y="356" text-anchor="middle" font-size="24" font-weight="bold" fill="#155c38">Managed</text>
  <text x="568" y="378" text-anchor="middle" font-size="24" font-weight="bold" fill="#155c38">task queue</text>

  <rect x="676" y="332" width="156" height="70" rx="3" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.4"/>
  <text x="754" y="356" text-anchor="middle" font-size="24" font-weight="bold" fill="#155c38">Worker,</text>
  <text x="754" y="380" text-anchor="middle" font-size="19" font-weight="bold" fill="#155c38">scale-from-0</text>

  <text x="490" y="432" font-size="19" fill="#155c38">The platform PUSHES each chunk to a</text>
  <text x="490" y="453" font-size="19" fill="#155c38">worker that scales from zero; native</text>
  <text x="490" y="474" font-size="19" fill="#155c38">autoscale — no custom scaler at all.</text>

  <!-- takeaway strip -->
  <text x="30" y="514" font-size="19" font-weight="bold" fill="#2f5169">The move was a change of deployment target, not a rewrite.</text>
  <text x="30" y="540" font-size="19" font-style="italic" fill="#57534e">Because the services were already reactive and stateless, poll-to-push</text>
  <text x="30" y="562" font-size="19" font-style="italic" fill="#57534e">was natural. The reactive seam was the enabler.</text>
</svg>
