<?xml version="1.0" encoding="UTF-8"?>
<!-- Cross-Part capstone (end of Part II; part2-content-revision-260814; folds to book/assets/).
     "Modeling creates surfaces for Alignment." A vertical descent: TERRITORY -(abstraction/subtraction)->
     MODEL -(makes explicit)-> ENGINEERING PROPERTY -(creates a surface for)-> ALIGNMENT, which fans to the
     three Alignment moves (constraint, sensor, validator->gate) and lands on CONSEQUENCE. The point the
     figure protects: a model does not govern by existing; Alignment gives selected properties consequence.
     Grammar: gray #57534e = territory; blue #2f5169 = model + property (the modeling half); rust #9a3f12 =
     alignment obligation (the moves); green #155c38 = consequence (the outcome that now has teeth).
     Hand-authored (a vertical descent with a fan, not a flowchart). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700"
     role="img" aria-labelledby="msTitle msDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="msTitle">Modeling creates surfaces for Alignment</title>
  <desc id="msDesc">A vertical descent. Territory is reduced by abstraction into a model. The model makes an
    engineering property explicit. That property creates a surface for Alignment. Alignment fans into three
    moves: a constraint, a sensor, and a validator whose finding feeds a gate. Each move lands on
    consequence. Modeling makes a property explicit; Alignment gives selected properties consequence.</desc>

  <defs>
    <marker id="ms-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c1917"/>
    </marker>
    <marker id="ms-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/>
    </marker>
    <marker id="ms-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#155c38"/>
    </marker>
  </defs>

  <!-- TERRITORY (gray) -->
  <rect x="250" y="24" width="220" height="54" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>
  <text x="360" y="57" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">TERRITORY</text>
  <line x1="360" y1="78" x2="360" y2="126" stroke="#1c1917" stroke-width="2" marker-end="url(#ms-k)"/>
  <text x="372" y="106" font-size="14.5" font-style="italic" fill="#57534e">abstraction / subtraction</text>

  <!-- MODEL (blue) -->
  <rect x="250" y="128" width="220" height="54" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="360" y="161" text-anchor="middle" font-size="20" font-weight="700" fill="#2f5169">MODEL</text>
  <line x1="360" y1="182" x2="360" y2="230" stroke="#1c1917" stroke-width="2" marker-end="url(#ms-k)"/>
  <text x="372" y="210" font-size="14.5" font-style="italic" fill="#57534e">makes explicit</text>

  <!-- ENGINEERING PROPERTY (blue) -->
  <rect x="200" y="232" width="320" height="54" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="360" y="265" text-anchor="middle" font-size="19" font-weight="700" fill="#2f5169">ENGINEERING PROPERTY</text>
  <line x1="360" y1="286" x2="360" y2="334" stroke="#1c1917" stroke-width="2" marker-end="url(#ms-k)"/>
  <text x="372" y="314" font-size="14.5" font-style="italic" fill="#57534e">creates a surface for</text>

  <!-- ALIGNMENT (rust) -->
  <rect x="250" y="336" width="220" height="54" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="360" y="369" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">ALIGNMENT</text>

  <!-- fan to three moves -->
  <g fill="none" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#ms-r)">
    <path d="M300,390 C230,414 175,418 145,440"/>
    <path d="M360,390 L360,440"/>
    <path d="M420,390 C490,414 545,418 575,440"/>
  </g>

  <rect x="70" y="442" width="150" height="50" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.2"/>
  <text x="145" y="473" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f12">constraint</text>

  <rect x="285" y="442" width="150" height="50" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.2"/>
  <text x="360" y="473" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f12">sensor</text>

  <rect x="500" y="442" width="150" height="50" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.2"/>
  <text x="575" y="473" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f12">validator</text>

  <!-- validator -> gate -->
  <line x1="575" y1="492" x2="575" y2="524" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#ms-r)"/>
  <rect x="500" y="526" width="150" height="46" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.2"/>
  <text x="575" y="555" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f12">gate</text>

  <!-- converge on CONSEQUENCE (green) -->
  <g fill="none" stroke="#155c38" stroke-width="2.2" marker-end="url(#ms-g)">
    <path d="M145,492 C180,556 250,576 300,594"/>
    <path d="M360,492 L360,594"/>
    <path d="M575,572 C540,584 470,588 420,594"/>
  </g>

  <rect x="240" y="596" width="240" height="54" rx="10" fill="#e3f0e7" stroke="#155c38" stroke-width="2.6"/>
  <text x="360" y="629" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">CONSEQUENCE</text>

  <!-- footer: protect the thesis -->
  <text x="360" y="680" text-anchor="middle" font-size="16" font-style="italic" fill="#1c1917">Modeling makes an engineering property explicit. Alignment gives selected properties consequence.</text>
</svg>
