<?xml version="1.0" encoding="UTF-8"?>
<!-- Cross-Part capstone (end of Part II; part2-v8-260814 re-author; folds to book/assets/).
     REVISION per v8 editor guidance (2.8-8): show BOTH paths, rhyming with the front-matter grammar
     figure. A DIRECT path — territory/action acted on directly, a local observable obligation — and a
     MODEL-MEDIATED path — territory -> abstraction -> model -> explicit property, a richer semantic
     obligation. The two land SIDE BY SIDE on one ALIGNMENT (constraint / sensor / validator / gate), which
     leads to CONSEQUENCE. Model-mediated is NOT the only path. Grammar: gray #57534e = territory/action;
     blue #2f5169 = the model chain and its explicit property; rust #9a3f12 = Alignment; green #155c38 =
     consequence. Hand-authored (a fork-and-join, two inputs onto one mechanism). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" width="720" height="680"
     role="img" aria-labelledby="mcTitle mcDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mcTitle">Modeling makes properties available to Alignment — but is not the only path</title>
  <desc id="mcDesc">Two paths join at one Alignment. The direct path: a territory or action is acted on
    directly, a local observable obligation. The model-mediated path: territory is reduced by abstraction to
    a model, which makes an explicit property available, a richer semantic obligation. Both land side by
    side on one Alignment — constraint, sensor, validator, gate — which leads to consequence. Governance can
    act directly; models add reach but are not required.</desc>

  <defs>
    <marker id="mc-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c1917"/>
    </marker>
    <marker id="mc-kk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
    <marker id="mc-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
    <marker id="mc-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#155c38"/>
    </marker>
  </defs>

  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">Two paths to Alignment</text>

  <!-- ===== LEFT: DIRECT PATH ===== -->
  <text x="185" y="72" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#57534e">DIRECT PATH</text>
  <rect id="territory-action" x="55" y="250" width="260" height="66" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>
  <text x="185" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">TERRITORY / ACTION</text>
  <text x="185" y="304" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">a test, a diff, a sandbox run</text>
  <!-- direct arrow onto Alignment (left landing); last control point above the endpoint so the head arrives perpendicular into ALIGNMENT's top -->
  <!-- edge: territory-action -> alignment -->
  <path d="M185,316 C185,372 300,376 300,406" fill="none" stroke="#57534e" stroke-width="2.6" marker-end="url(#mc-kk)"/>
  <text x="196" y="360" text-anchor="start" font-size="14" font-weight="700" fill="#57534e">acted on directly</text>
  <text x="196" y="377" text-anchor="start" font-size="14" font-style="italic" fill="#57534e">local observable obligation</text>

  <!-- ===== RIGHT: MODEL-MEDIATED PATH ===== -->
  <text x="535" y="72" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#2f5169">MODEL-MEDIATED PATH</text>
  <!-- TERRITORY -->
  <rect id="territory" x="405" y="86" width="260" height="48" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="535" y="116" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1c1917">TERRITORY</text>
  <!-- edge: territory -> model -->
  <line x1="535" y1="134" x2="535" y2="168" stroke="#1c1917" stroke-width="2" marker-end="url(#mc-k)"/>
  <text x="547" y="156" font-size="14" font-style="italic" fill="#57534e">abstraction</text>
  <!-- MODEL -->
  <rect id="model" x="405" y="170" width="260" height="48" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="535" y="200" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2f5169">MODEL</text>
  <!-- edge: model -> explicit-property -->
  <line x1="535" y1="218" x2="535" y2="252" stroke="#1c1917" stroke-width="2" marker-end="url(#mc-k)"/>
  <text x="547" y="240" font-size="14" font-style="italic" fill="#57534e">makes explicit</text>
  <!-- EXPLICIT PROPERTY -->
  <rect id="explicit-property" x="405" y="254" width="260" height="54" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="535" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">EXPLICIT PROPERTY</text>
  <!-- model arrow onto Alignment (right landing); last control point above the endpoint so the head arrives perpendicular into ALIGNMENT's top -->
  <!-- edge: explicit-property -> alignment -->
  <path d="M535,308 C535,364 420,376 420,406" fill="none" stroke="#2f5169" stroke-width="2.6" marker-end="url(#mc-b)"/>
  <text x="524" y="360" text-anchor="end" font-size="14" font-weight="700" fill="#2f5169">available to</text>
  <text x="524" y="377" text-anchor="end" font-size="14" font-style="italic" fill="#2f5169">richer semantic obligation</text>

  <!-- ===== THE JOIN: ALIGNMENT ===== -->
  <rect id="alignment" x="225" y="410" width="270" height="66" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.8"/>
  <text x="360" y="440" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">ALIGNMENT</text>
  <text x="360" y="462" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">constraint &#183; sensor &#183; validator &#183; gate</text>
  <!-- edge: alignment -> consequence -->
  <line x1="360" y1="476" x2="360" y2="524" stroke="#155c38" stroke-width="2.4" marker-end="url(#mc-g)"/>
  <text x="372" y="504" font-size="14" font-style="italic" fill="#155c38">gives consequence</text>

  <!-- ===== CONSEQUENCE ===== -->
  <rect id="consequence" x="255" y="526" width="210" height="54" rx="10" fill="#e3f0e7" stroke="#155c38" stroke-width="2.6"/>
  <text x="360" y="559" text-anchor="middle" font-size="19" font-weight="700" fill="#155c38">CONSEQUENCE</text>

  <!-- footer: protect the point -->
  <text x="360" y="626" text-anchor="middle" font-size="15" font-style="italic" fill="#1c1917">Alignment mechanisms can act directly on observable actions; explicit models make</text>
  <text x="360" y="648" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">richer system properties available too &#8212; model-mediated is not the only path.</text>
</svg>
