<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h8-product-gee.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780"
     role="img" aria-labelledby="h8Title h8Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h8Title">From local MAGE adoption to the product GEE</title>
  <desc id="h8Desc">Five lifecycle surfaces — Product Discovery, Engineering and Realization, Product Management
    and Maintenance, Operations and Incidents, and Assurance and Compliance — name the engineering surfaces whose
    representations meet at a band of connective tissue: shared identity, relations, provenance, temporal scope, and
    obligations. That connective tissue lets the heterogeneous models compose into connected product engineering
    knowledge without collapsing into one universal model. That knowledge is reasoned over by autonomous reasoning
    where semantic judgment remains necessary and carried by Alignment where obligations can be made authoritative;
    together they form the governed engineering environment that produces the product. Experience from the product
    feeds back through governance conversion, changing the models and mechanisms future work inherits.</desc>

  <defs>
    <marker id="h8-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
    <marker id="h8-ah-u" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="780" fill="#fdfcf9"/>
  <text x="500" y="34" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="0.1em" fill="#57534e">THE PRODUCT GEE</text>

  <!-- three upper surface names (inventories omitted — the reader has them from the sections) -->
  <g text-anchor="middle">
    <text x="200" y="92" font-size="15" font-weight="700" fill="#1c1917">PRODUCT DISCOVERY</text>
    <line x1="90" y1="100" x2="310" y2="100" stroke="#57534e" stroke-width="1.4"/>

    <text x="500" y="92" font-size="15" font-weight="700" fill="#1c1917">ENGINEERING &amp; REALIZATION</text>
    <line x1="368" y1="100" x2="632" y2="100" stroke="#57534e" stroke-width="1.4"/>

    <text x="800" y="92" font-size="15" font-weight="700" fill="#1c1917">PRODUCT MGMT / MAINTENANCE</text>
    <line x1="678" y1="100" x2="922" y2="100" stroke="#57534e" stroke-width="1.4"/>
  </g>

  <!-- converge into connective band -->
  <g stroke="#57534e" stroke-width="1.8" fill="none">
    <path d="M200,100 L200,120 L500,120"/>
    <path d="M500,100 L500,140"/>
    <path d="M800,100 L800,120 L500,120"/>
  </g>

  <!-- connective tissue -->
  <rect x="300" y="140" width="400" height="120" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2" stroke-dasharray="6 4"/>
  <g text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">
    <text x="500" y="168" font-weight="700" font-style="normal" fill="#1c1917">CONNECTIVE TISSUE</text>
    <text x="500" y="192">shared identity</text>
    <text x="500" y="212">relations · provenance</text>
    <text x="500" y="232">temporal scope</text>
    <text x="500" y="252">obligations</text>
  </g>

  <!-- split to the two lower surfaces -->
  <g stroke="#57534e" stroke-width="1.8" fill="none">
    <path d="M370,260 C300,292 250,296 250,320" marker-end="url(#h8-ah)"/>
    <path d="M630,260 C700,292 750,296 750,320" marker-end="url(#h8-ah)"/>
  </g>

  <g text-anchor="middle">
    <text x="250" y="322" font-size="15" font-weight="700" fill="#1c1917">OPERATIONS &amp; INCIDENTS</text>
    <line x1="140" y1="330" x2="360" y2="330" stroke="#57534e" stroke-width="1.4"/>

    <text x="750" y="322" font-size="15" font-weight="700" fill="#1c1917">ASSURANCE &amp; COMPLIANCE</text>
    <line x1="640" y1="330" x2="860" y2="330" stroke="#57534e" stroke-width="1.4"/>
  </g>

  <!-- converge into connected knowledge -->
  <g stroke="#57534e" stroke-width="1.8" fill="none">
    <path d="M250,330 L250,360 L500,360"/>
    <path d="M750,330 L750,360 L500,360"/>
  </g>
  <line x1="500" y1="360" x2="500" y2="382" stroke="#57534e" stroke-width="1.8" marker-end="url(#h8-ah)"/>

  <rect x="320" y="384" width="360" height="56" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.5"/>
  <text x="500" y="408" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">CONNECTED PRODUCT</text>
  <text x="500" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">ENGINEERING KNOWLEDGE</text>

  <!-- split into reasoning (agent-blue) and Alignment (governance-umber) -->
  <g stroke="#57534e" stroke-width="1.8" fill="none">
    <path d="M410,440 C360,472 300,476 300,498" marker-end="url(#h8-ah)"/>
    <path d="M590,440 C640,472 700,476 700,498" marker-end="url(#h8-ah)"/>
  </g>

  <g text-anchor="middle">
    <text x="300" y="498" font-size="14" font-weight="700" fill="#2f5169">AUTONOMOUS REASONING</text>
    <line x1="180" y1="506" x2="420" y2="506" stroke="#2f5169" stroke-width="1.4"/>
    <g font-size="13" fill="#2f5169"><text x="300" y="530">semantic reconstruction</text><text x="300" y="548">synthesis</text><text x="300" y="566">novel judgment</text><text x="300" y="584">underdetermined realization</text></g>

    <text x="700" y="498" font-size="14" font-weight="700" fill="#9a3f12">ALIGNMENT</text>
    <line x1="600" y1="506" x2="800" y2="506" stroke="#9a3f12" stroke-width="1.4"/>
    <g font-size="13" fill="#9a3f12"><text x="700" y="530">constraints</text><text x="700" y="548">validators · checkers</text><text x="700" y="566">permissions</text><text x="700" y="584">gates</text></g>
  </g>

  <!-- converge into GEE -->
  <g stroke="#57534e" stroke-width="1.8" fill="none">
    <path d="M300,600 L300,624 L500,624"/>
    <path d="M700,600 L700,624 L500,624"/>
  </g>
  <line x1="500" y1="624" x2="500" y2="646" stroke="#9a3f12" stroke-width="2.4" marker-end="url(#h8-ah-u)"/>

  <rect x="330" y="648" width="340" height="56" rx="9" fill="#f7efe8" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="500" y="672" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">GOVERNED ENGINEERING</text>
  <text x="500" y="692" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">ENVIRONMENT</text>

  <line x1="500" y1="704" x2="500" y2="726" stroke="#57534e" stroke-width="2.2" marker-end="url(#h8-ah)"/>
  <rect x="440" y="728" width="120" height="40" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="500" y="753" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">PRODUCT</text>

  <!-- governance-conversion feedback loop back to the top-left surface (routed down the left margin) -->
  <path d="M440,748 C160,748 30,720 30,140 C30,112 38,96 66,94" fill="none" stroke="#9a3f12" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#h8-ah-u)"/>
  <text x="18" y="430" text-anchor="middle" font-size="12.5" font-style="italic" fill="#9a3f12" transform="rotate(-90 18 430)">governance conversion — evidence · failures · experience</text>
</svg>
