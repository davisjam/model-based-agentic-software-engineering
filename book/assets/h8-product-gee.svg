<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h8-product-gee.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000"
     role="img" aria-labelledby="h8Title h8Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h8Title">From local MAGE adoption to the product GEE</title>
  <desc id="h8Desc">Five lifecycle surfaces — Product Discovery, Engineering and Realization, Product Management
    and Maintenance, Operations and Incidents, and Assurance and Compliance — each develop their own
    representations. Shared identity, relations, provenance, temporal scope, and obligations let those
    heterogeneous models compose into connected product engineering knowledge without collapsing into one
    universal model. That knowledge is reasoned over by autonomous reasoning where semantic judgment remains
    necessary and carried by Alignment where obligations can be made authoritative; together they form the
    governed engineering environment that produces the product. Experience from the product feeds back through
    governance conversion, changing the models and mechanisms future work inherits.</desc>

  <defs>
    <marker id="h8-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
    <marker id="h8-ah-u" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1000" fill="#fdfcf9"/>
  <text x="500" y="36" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="0.1em" fill="#57534e">THE PRODUCT GEE</text>

  <!-- three upper surface columns -->
  <g text-anchor="middle">
    <text x="165" y="72" font-size="14" font-weight="700" fill="#1c1917">PRODUCT DISCOVERY</text>
    <line x1="70" y1="80" x2="260" y2="80" stroke="#57534e" stroke-width="1.4"/>
    <g font-size="13" fill="#1c1917"><text x="165" y="104">needs</text><text x="165" y="122">hypotheses</text><text x="165" y="140">evidence</text><text x="165" y="158">decisions</text><text x="165" y="176">requirements</text></g>

    <text x="500" y="72" font-size="14" font-weight="700" fill="#1c1917">ENGINEERING &amp; REALIZATION</text>
    <line x1="380" y1="80" x2="620" y2="80" stroke="#57534e" stroke-width="1.4"/>
    <g font-size="13" fill="#1c1917"><text x="500" y="104">architecture</text><text x="500" y="122">behavior</text><text x="500" y="140">contracts</text><text x="500" y="158">state</text><text x="500" y="176">dependencies</text></g>

    <text x="835" y="72" font-size="14" font-weight="700" fill="#1c1917">PRODUCT MGMT / MAINTENANCE</text>
    <line x1="720" y1="80" x2="950" y2="80" stroke="#57534e" stroke-width="1.4"/>
    <g font-size="13" fill="#1c1917"><text x="835" y="104">tickets</text><text x="835" y="122">issues</text><text x="835" y="140">rationale</text><text x="835" y="158">acceptance</text><text x="835" y="176">history</text></g>
  </g>

  <!-- converge into connective band -->
  <g stroke="#57534e" stroke-width="1.8" fill="none">
    <path d="M165,190 L165,214 L500,214"/>
    <path d="M500,190 L500,236"/>
    <path d="M835,190 L835,214 L500,214"/>
  </g>
  <line x1="500" y1="214" x2="500" y2="240" stroke="#57534e" stroke-width="1.8"/>

  <!-- connective tissue -->
  <rect x="300" y="240" width="400" height="128" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2" stroke-dasharray="6 4"/>
  <g text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">
    <text x="500" y="266" font-weight="700" font-style="normal" fill="#1c1917">CONNECTIVE TISSUE</text>
    <text x="500" y="290">shared identity</text>
    <text x="500" y="310">relations · provenance</text>
    <text x="500" y="330">temporal scope</text>
    <text x="500" y="350">obligations</text>
  </g>

  <!-- split to the two lower surfaces -->
  <g stroke="#57534e" stroke-width="1.8" fill="none">
    <path d="M370,368 C300,400 245,404 245,430" marker-end="url(#h8-ah)"/>
    <path d="M630,368 C700,400 755,404 755,430" marker-end="url(#h8-ah)"/>
  </g>

  <g text-anchor="middle">
    <text x="245" y="430" font-size="14" font-weight="700" fill="#1c1917">OPERATIONS &amp; INCIDENTS</text>
    <line x1="130" y1="438" x2="360" y2="438" stroke="#57534e" stroke-width="1.4"/>
    <g font-size="13" fill="#1c1917"><text x="245" y="462">topology</text><text x="245" y="480">telemetry</text><text x="245" y="498">SLOs</text><text x="245" y="516">runbooks</text><text x="245" y="534">incidents · RCAs</text></g>

    <text x="755" y="430" font-size="14" font-weight="700" fill="#1c1917">ASSURANCE &amp; COMPLIANCE</text>
    <line x1="640" y1="438" x2="870" y2="438" stroke="#57534e" stroke-width="1.4"/>
    <g font-size="13" fill="#1c1917"><text x="755" y="462">requirements</text><text x="755" y="480">policies</text><text x="755" y="498">threats / hazards</text><text x="755" y="516">traceability</text><text x="755" y="534">claims · evidence</text></g>
  </g>

  <!-- converge into connected knowledge -->
  <g stroke="#57534e" stroke-width="1.8" fill="none">
    <path d="M245,548 L245,578 L500,578"/>
    <path d="M755,548 L755,578 L500,578"/>
  </g>
  <line x1="500" y1="578" x2="500" y2="600" stroke="#57534e" stroke-width="1.8" marker-end="url(#h8-ah)"/>

  <rect x="320" y="602" width="360" height="56" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.5"/>
  <text x="500" y="626" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">CONNECTED PRODUCT</text>
  <text x="500" y="646" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">ENGINEERING KNOWLEDGE</text>

  <!-- split into reasoning (agent-blue) and Alignment (governance-umber) -->
  <g stroke="#57534e" stroke-width="1.8" fill="none">
    <path d="M410,658 C360,690 300,694 300,716" marker-end="url(#h8-ah)"/>
    <path d="M590,658 C640,690 700,694 700,716" marker-end="url(#h8-ah)"/>
  </g>

  <g text-anchor="middle">
    <text x="300" y="716" font-size="14" font-weight="700" fill="#2f5169">AUTONOMOUS REASONING</text>
    <line x1="180" y1="724" x2="420" y2="724" stroke="#2f5169" stroke-width="1.4"/>
    <g font-size="13" fill="#2f5169"><text x="300" y="748">semantic reconstruction</text><text x="300" y="766">synthesis</text><text x="300" y="784">novel judgment</text><text x="300" y="802">residual DoF · realization</text></g>

    <text x="700" y="716" font-size="14" font-weight="700" fill="#9a3f12">ALIGNMENT</text>
    <line x1="600" y1="724" x2="800" y2="724" stroke="#9a3f12" stroke-width="1.4"/>
    <g font-size="13" fill="#9a3f12"><text x="700" y="748">constraints</text><text x="700" y="766">validators · checkers</text><text x="700" y="784">permissions</text><text x="700" y="802">gates</text></g>
  </g>

  <!-- converge into GEE -->
  <g stroke="#57534e" stroke-width="1.8" fill="none">
    <path d="M300,814 L300,838 L500,838"/>
    <path d="M700,814 L700,838 L500,838"/>
  </g>
  <line x1="500" y1="838" x2="500" y2="858" stroke="#9a3f12" stroke-width="2.4" marker-end="url(#h8-ah-u)"/>

  <rect x="330" y="860" width="340" height="56" rx="9" fill="#f7efe8" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="500" y="884" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">GOVERNED ENGINEERING</text>
  <text x="500" y="904" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">ENVIRONMENT</text>

  <line x1="500" y1="916" x2="500" y2="940" stroke="#57534e" stroke-width="2.2" marker-end="url(#h8-ah)"/>
  <rect x="440" y="942" width="120" height="40" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="500" y="967" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">PRODUCT</text>

  <!-- governance-conversion feedback loop back to the top-left surface (routed down the left margin) -->
  <path d="M440,962 C140,962 26,930 26,150 C26,108 34,92 62,90" fill="none" stroke="#9a3f12" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#h8-ah-u)"/>
  <text x="16" y="540" text-anchor="middle" font-size="12.5" font-style="italic" fill="#9a3f12" transform="rotate(-90 16 540)">governance conversion — evidence · failures · experience</text>
</svg>
