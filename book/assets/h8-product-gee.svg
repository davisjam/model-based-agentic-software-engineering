<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h8-product-gee.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" width="1000" height="810"
     role="img" aria-labelledby="h8Title h8Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h8Title">From local MAGE adoption to the product GEE</title>
  <desc id="h8Desc">Five lifecycle surfaces — Product Discovery, Engineering and Realization, Product Management
    and Maintenance, Operations and Incident Response, and Assurance and Compliance — are related through a band of
    connective tissue: shared identity, relations, provenance, temporal scope, and obligations. That connective
    tissue lets the heterogeneous models compose into connected engineering knowledge without collapsing into one
    universal model. Autonomous reasoning works over that knowledge where semantic judgment remains necessary, and
    Alignment carries obligations where they can be made authoritative; together they constitute the governed
    engineering environment that produces the product. Experience from the product feeds back through governance
    conversion to the connective tissue, changing the models and mechanisms future work inherits. Plain lines mark
    relationships among representations; arrows mark flow.</desc>

  <defs>
    <marker id="h8-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
    <marker id="h8-ah-u" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="810" fill="#fdfcf9"/>
  <text x="500" y="38" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="0.12em" fill="#57534e">THE PRODUCT GEE</text>

  <!-- three upper surface names -->
  <g text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">
    <text x="185" y="94">PRODUCT DISCOVERY</text>
    <text x="500" y="94">ENGINEERING &amp; REALIZATION</text>
    <text x="812" y="94">PRODUCT MANAGEMENT &amp; MAINTENANCE</text>
  </g>
  <g stroke="#57534e" stroke-width="1.4">
    <line x1="90"  y1="104" x2="300" y2="104"/>
    <line x1="360" y1="104" x2="640" y2="104"/>
    <line x1="648" y1="104" x2="976" y2="104"/>
  </g>

  <!-- symmetric bus: three equal stems -> one centered line into connective tissue (relationships, plain) -->
  <g stroke="#57534e" stroke-width="1.8" fill="none">
    <line x1="185" y1="104" x2="185" y2="126"/>
    <line x1="500" y1="104" x2="500" y2="126"/>
    <line x1="812" y1="104" x2="812" y2="126"/>
    <line x1="185" y1="126" x2="812" y2="126"/>
    <line x1="500" y1="126" x2="500" y2="150"/>
  </g>

  <!-- connective tissue (solid outline; contents roman) -->
  <rect id="connective-tissue" x="300" y="150" width="400" height="132" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="500" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">CONNECTIVE TISSUE</text>
  <g text-anchor="middle" font-size="15" fill="#57534e">
    <text x="500" y="206">shared identity</text>
    <text x="500" y="228">relations · provenance</text>
    <text x="500" y="250">temporal scope</text>
    <text x="500" y="272">obligations</text>
  </g>

  <!-- connective tissue related to the two lower surfaces (relationships, plain lines) -->
  <g stroke="#57534e" stroke-width="1.8" fill="none">
    <path d="M360,282 C300,314 250,320 250,344"/>
    <path d="M640,282 C700,314 750,320 750,344"/>
  </g>

  <!-- transparent anchors: the two lower surface names are bare-text nodes; each carries an id so its flow
       edge into connected knowledge can plug in (fill:none stroke:none => zero visual change). -->
  <g fill="none" stroke="none">
    <rect id="operations" x="110" y="334" width="280" height="28"/>
    <rect id="assurance"  x="612" y="334" width="276" height="28"/>
  </g>
  <g text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">
    <text x="250" y="348">OPERATIONS &amp; INCIDENT RESPONSE</text>
    <text x="750" y="348">ASSURANCE &amp; COMPLIANCE</text>
  </g>
  <g stroke="#57534e" stroke-width="1.4">
    <line x1="110" y1="358" x2="390" y2="358"/>
    <line x1="612" y1="358" x2="888" y2="358"/>
  </g>

  <!-- lower surfaces -> shared bus -> connected knowledge (flow); one path per branch so each terminates
       on the box, sharing the trunk down the centre and arriving vertically into its top -->
  <g stroke="#57534e" stroke-width="1.8" fill="none" marker-end="url(#h8-ah)">
    <!-- edge: operations -> connected-knowledge -->
    <path d="M353,362 L353,412"/>
    <!-- edge: assurance -> connected-knowledge -->
    <path d="M648,362 L648,412"/>
  </g>

  <rect id="connected-knowledge" x="316" y="414" width="368" height="52" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.5"/>
  <text x="500" y="446" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">CONNECTED ENGINEERING KNOWLEDGE</text>

  <!-- knowledge related to reasoning and Alignment (two uses, plain lines) -->
  <g stroke="#57534e" stroke-width="1.8" fill="none">
    <path d="M410,466 C360,498 300,504 300,528"/>
    <path d="M590,466 C640,498 700,504 700,528"/>
  </g>

  <!-- transparent anchors: AUTONOMOUS REASONING and ALIGNMENT are bare-text column headings; each anchor
       spans the heading + its list so the flow edge into the GEE plugs into a named node. -->
  <g fill="none" stroke="none">
    <rect id="autonomous-reasoning" x="175" y="520" width="250" height="132"/>
    <rect id="alignment"            x="612" y="520" width="176" height="132"/>
  </g>

  <text x="300" y="532" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">AUTONOMOUS REASONING</text>
  <line x1="175" y1="542" x2="425" y2="542" stroke="#2f5169" stroke-width="1.4"/>
  <g text-anchor="middle" font-size="15" fill="#2f5169">
    <text x="300" y="566">semantic reconstruction</text>
    <text x="300" y="588">synthesis</text>
    <text x="300" y="610">novel judgment</text>
    <text x="300" y="632">underdetermined realization</text>
  </g>

  <text x="700" y="532" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3f12">ALIGNMENT</text>
  <line x1="612" y1="542" x2="788" y2="542" stroke="#9a3f12" stroke-width="1.4"/>
  <g text-anchor="middle" font-size="15" fill="#9a3f12">
    <text x="700" y="566">constraints</text>
    <text x="700" y="588">validators · checkers</text>
    <text x="700" y="610">permissions</text>
    <text x="700" y="632">gates</text>
  </g>

  <!-- reasoning AND Alignment each constitute the GEE: two separate arrows (flow); last control point pulled
       back above the endpoint so each head arrives perpendicular into the GEE's top border -->
  <!-- edge: autonomous-reasoning -> gee -->
  <path d="M377.5,652 L377.5,692" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#h8-ah)"/>
  <!-- edge: alignment -> gee -->
  <path d="M641,652 L641,692" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#h8-ah)"/>

  <rect id="gee" x="330" y="694" width="340" height="56" rx="9" fill="#f7efe8" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="500" y="718" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3f12">GOVERNED ENGINEERING</text>
  <text x="500" y="738" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3f12">ENVIRONMENT</text>

  <!-- GEE produces the product (flow) -->
  <!-- edge: gee -> product -->
  <line x1="500" y1="750" x2="500" y2="772" stroke="#57534e" stroke-width="2.2" marker-end="url(#h8-ah)"/>
  <rect id="product" x="440" y="774" width="120" height="30" rx="7" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="500" y="795" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">PRODUCT</text>

  <!-- governance-conversion feedback: product experience back to the connective tissue (routed down the left margin) -->
  <!-- edge-grammar: keep-angles -->
  <!-- KEEP-CURVE (side-exit escape): product .. connective-tissue is the governance-conversion FEEDBACK edge.
       It deliberately leaves PRODUCT and sweeps up the left margin to return into the CONNECTIVE TISSUE,
       carrying the rotated "experience · failures · evidence · governance conversion" label along its length.
       This swoop reads as the feedback path itself; an orthogonal detour up the margin would read mechanical
       and lose the loop. The figure's other declared edges are clean straight verticals, so opting out costs
       no real coverage. -->
  <!-- edge: product .. connective-tissue -->
  <path d="M440,789 C150,789 34,760 34,215 C34,190 44,214 298,214" fill="none" stroke="#9a3f12" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#h8-ah-u)"/>
  <text x="20" y="470" text-anchor="middle" font-size="14" font-style="italic" fill="#9a3f12" transform="rotate(-90 20 470)">experience · failures · evidence · governance conversion</text>
</svg>
