<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: support-ratio-curve). Support-apparatus LoC divided by
     production LoC at four dated windows: 0.85 (prototype) -> 2.48 (mechanization) ->
     3.68 (hardening) -> 3.06 (now). A line chart with a parity reference at 1.0. The
     curve crosses from below parity to a ~3.68x peak, then eases as production growth
     resumes. Palette: Umber Monograph tokens (accent #9a3f12 the support line, muted
     #57534e the parity reference, rule #e4e0d8 gridlines, ink #1c1917 text). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470"
     role="img" aria-labelledby="srTitle srDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="srTitle">The support-ratio curve across four windows</title>
  <desc id="srDesc">A line chart of the support ratio — support-apparatus lines of code
    divided by production lines of code — at four dated windows of the build. It starts
    below parity at 0.85 in the prototype, rises past production to 2.48 at mechanization,
    peaks at 3.68 during hardening, then eases to 3.06 now as feature work resumes on the
    built environment. A dashed reference line marks parity at 1.0; the support line sits
    above it for every window after the prototype. The shape is a revealed preference:
    governance investment led and kept pace with the fleet, crossing sub-parity to roughly
    three times the size of the product while production itself grew about forty-seven-fold.</desc>

  <!-- y gridlines + tick labels (ratio 1..4); baseline at ratio 0 -->
  <line x1="130" y1="307.5" x2="920" y2="307.5" stroke="#e4e0d8" stroke-width="1"/>
  <line x1="130" y1="235"   x2="920" y2="235"   stroke="#e4e0d8" stroke-width="1"/>
  <line x1="130" y1="162.5" x2="920" y2="162.5" stroke="#e4e0d8" stroke-width="1"/>
  <text x="118" y="311.5" text-anchor="end" font-size="18" fill="#57534e">1×</text>
  <text x="118" y="239"   text-anchor="end" font-size="18" fill="#57534e">2×</text>
  <text x="118" y="166.5" text-anchor="end" font-size="18" fill="#57534e">3×</text>

  <!-- x axis baseline (ratio 0) -->
  <line x1="130" y1="380" x2="920" y2="380" stroke="#1c1917" stroke-width="1.5"/>

  <!-- parity reference at ratio 1.0 -->
  <line x1="130" y1="307.5" x2="920" y2="307.5" stroke="#57534e" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="912" y="299" text-anchor="end" font-size="18" font-style="italic" fill="#57534e">parity — support = product</text>

  <!-- the support-ratio line: 0.85 -> 2.48 -> 3.68 -> 3.06 -->
  <polyline points="160,318.4 400,200.2 640,113.2 880,158.15"
            fill="none" stroke="#9a3f12" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="160" cy="318.4"  r="5" fill="#9a3f12"/>
  <circle cx="400" cy="200.2"  r="5" fill="#9a3f12"/>
  <circle cx="640" cy="113.2"  r="5" fill="#9a3f12"/>
  <circle cx="880" cy="158.15" r="5" fill="#9a3f12"/>

  <!-- value labels above each point (free-floating) -->
  <text x="160" y="302" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">0.85×</text>
  <text x="400" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">2.48×</text>
  <text x="640" y="97"  text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">3.68×</text>
  <text x="880" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">3.06×</text>

  <!-- x window labels + dates -->
  <text x="160" y="406" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1917">prototype</text>
  <text x="160" y="426" text-anchor="middle" font-size="18" fill="#57534e">Apr 9</text>
  <text x="400" y="406" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1917">mechanization</text>
  <text x="400" y="426" text-anchor="middle" font-size="18" fill="#57534e">May 31</text>
  <text x="640" y="406" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1917">hardening</text>
  <text x="640" y="426" text-anchor="middle" font-size="18" fill="#57534e">Jun 30</text>
  <text x="880" y="406" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1917">now</text>
  <text x="880" y="426" text-anchor="middle" font-size="18" fill="#57534e">Aug 3</text>

  <!-- axis caption -->
  <text x="130" y="452" text-anchor="start" font-size="18" font-style="italic" fill="#57534e">support-apparatus LoC ÷ production LoC · coverage gap 0 at every window</text>
</svg>
