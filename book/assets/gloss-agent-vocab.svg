<?xml version="1.0" encoding="UTF-8"?>
<!-- HAND-AUTHORED one-off glossary section-map (geometry-per-concept redraw 260810). Not machine-projected; edit this SVG directly. -->
<!-- LAYERED-STACK geometry for the agent vocabulary. Four stacked layers on the left; a causal failure tail on the right. Orientation reference chrome, not a role-coloured figure. -->
<!-- semantic-families: neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Layered stack: how coding agents work, and the causal tail of how they fail">
  <defs>
    <marker id="vh-av" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#fdfcf9"/>
  <text x="95" y="40" font-size="17" fill="#57534e">Glossary · concept map</text>
  <text x="905" y="40" text-anchor="end" font-size="18" font-weight="bold" fill="#1c1917">How coding agents work (and fail)</text>

  <!-- column headers -->
  <text x="330" y="78" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">the stack</text>
  <text x="800" y="78" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">how it comes apart</text>

  <!-- ===== LEFT: the four-layer stack ===== -->
  <!-- Application -->
  <rect x="80" y="92" width="500" height="64" rx="6" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="100" y="122" font-size="20" font-weight="bold" fill="#1c1917">Application</text>
  <text x="100" y="144" font-size="16" fill="#57534e">your codebase</text>

  <!-- runs on -->
  <line x1="330" y1="156" x2="330" y2="176" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-av)"/>
  <text x="342" y="171" font-size="16" fill="#78716c">runs on</text>

  <!-- Agent Harness (taller; holds three chips) -->
  <rect x="80" y="176" width="500" height="112" rx="6" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="100" y="206" font-size="20" font-weight="bold" fill="#1c1917">Agent Harness</text>
  <text x="100" y="227" font-size="16" fill="#57534e">Claude Code, OpenCode, and their kin</text>
  <text x="100" y="258" font-size="16" fill="#78716c">hosts</text>
  <rect x="150" y="246" width="112" height="30" rx="15" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="206" y="266" text-anchor="middle" font-size="16" fill="#1c1917">Skills</text>
  <rect x="272" y="246" width="112" height="30" rx="15" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="328" y="266" text-anchor="middle" font-size="16" fill="#1c1917">Tools</text>
  <rect x="394" y="246" width="112" height="30" rx="15" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="450" y="266" text-anchor="middle" font-size="16" fill="#1c1917">Hooks</text>

  <!-- wraps -->
  <line x1="330" y1="288" x2="330" y2="308" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-av)"/>
  <text x="342" y="303" font-size="16" fill="#78716c">wraps</text>

  <!-- Foundation Model -->
  <rect x="80" y="308" width="500" height="64" rx="6" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="100" y="338" font-size="20" font-weight="bold" fill="#1c1917">Foundation Model</text>
  <text x="100" y="360" font-size="16" fill="#57534e">the trained model at the bottom of the stack</text>

  <!-- bounded by -->
  <line x1="330" y1="372" x2="330" y2="392" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-av)"/>
  <text x="342" y="387" font-size="16" fill="#78716c">bounded by</text>

  <!-- Context Window -->
  <rect x="80" y="392" width="500" height="64" rx="6" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="100" y="422" font-size="20" font-weight="bold" fill="#1c1917">Context Window</text>
  <text x="100" y="444" font-size="16" fill="#57534e">the bounded memory it holds at once</text>

  <!-- ===== RIGHT: causal failure tail ===== -->
  <!-- work too large -->
  <rect x="690" y="110" width="220" height="46" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="800" y="139" text-anchor="middle" font-size="18" fill="#1c1917">work too large</text>

  <!-- overruns -->
  <line x1="800" y1="156" x2="800" y2="238" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-av)"/>
  <text x="812" y="201" font-size="16" fill="#78716c">overruns</text>

  <!-- Reasoning Horizon -->
  <rect x="690" y="238" width="220" height="46" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="800" y="267" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1917">Reasoning Horizon</text>

  <!-- drives -->
  <line x1="800" y1="284" x2="800" y2="366" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-av)"/>
  <text x="812" y="329" font-size="16" fill="#78716c">drives</text>

  <!-- Churn -->
  <rect x="690" y="366" width="220" height="46" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="800" y="395" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1917">Churn</text>

  <!-- bridge: the Context Window instantiates the horizon limit today -->
  <line x1="580" y1="424" x2="690" y2="270" stroke="#cfcabf" stroke-width="3" stroke-dasharray="4 4" marker-end="url(#vh-av)"/>
  <text x="612" y="360" font-size="16" fill="#78716c">instantiates</text>

  <!-- the two glossary terms that annotate the stack but aren't layers: Skill/Tool defined via chips above; Fleet noted below -->
  <text x="95" y="484" font-size="16" fill="#57534e">A <tspan font-weight="bold">Fleet</tspan> is many such stacks working one codebase — the agentic-era workforce this book governs.</text>

  <!-- R13 zoom cue: FRAME-echo corner-brackets — a family-membership signal (0.3-1 has no agent source-node; this figure zooms sideways into the agent substrate, FORK-D). Same L mark at frame scale. -->
  <g fill="none" stroke="#57534e" stroke-width="2.5">
    <path d="M26,12 L12,12 L12,26"/>
    <path d="M974,488 L988,488 L988,474"/>
  </g>
</svg>
