<?xml version="1.0" encoding="UTF-8"?>
<!-- HAND-AUTHORED one-off glossary section-map. frontmatter-figures-260814 COPY-EDIT of R41b: the four-layer
     agent stack and the softened causal tail are UNCHANGED in geometry. Label-only edits per the front-matter
     figure pass: (1) the foundation-model annotation reads "trained model"; (2) the bottom stack layer is
     retitled "Bounded working state" (the context window is named as its present instance, not the
     definition) — this promotes the general term while KEEPING context-window ≠ reasoning-horizon, since the
     reasoning-horizon node stays distinct on the right; (3) the Fleet footnote is tightened to "multiple
     agents working on a shared engineering system." The Reasoning-Horizon gloss is left bare on purpose: the
     one-line gloss will not fit the box at print size, so the glossary text carries it. Orientation
     reference chrome, not a role-coloured figure. -->
<!-- semantic-families: neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Layered stack of how coding agents work, and a softened causal tail of how they come apart: a large engineering task requires a reasoning horizon that may exceed the bounded working state the agent can maintain, of which the context window is one present limit, contributing to churn">
  <defs>
    <marker id="vh-av2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#fdfcf9"/>
  <text x="95" y="40" font-size="17" fill="#57534e">Glossary · concept map</text>
  <text x="905" y="40" text-anchor="end" font-size="18" font-weight="bold" fill="#1c1917">How coding agents work (and fail)</text>

  <!-- column headers -->
  <text x="330" y="78" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">the stack</text>
  <text x="825" y="78" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">how it comes apart</text>

  <!-- ===== LEFT: the four-layer stack ===== -->
  <!-- Application -->
  <rect id="application" x="80" y="92" width="500" height="64" rx="6" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="100" y="122" font-size="20" font-weight="bold" fill="#1c1917">Application</text>
  <text x="100" y="144" font-size="16" fill="#57534e">your codebase</text>

  <!-- runs on -->
  <!-- edge: application -> harness -->
  <line x1="330" y1="156" x2="330" y2="176" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-av2)"/>
  <text x="342" y="171" font-size="16" fill="#78716c">runs on</text>

  <!-- Agent Harness (taller; holds three chips) -->
  <rect id="harness" x="80" y="176" width="500" height="112" rx="6" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="100" y="206" font-size="20" font-weight="bold" fill="#1c1917">Agent Harness</text>
  <text x="100" y="227" font-size="16" fill="#57534e">Claude Code, OpenCode, and their kin</text>
  <text x="100" y="258" font-size="16" fill="#78716c">hosts</text>
  <rect x="150" y="246" width="112" height="30" rx="15" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="206" y="266" text-anchor="middle" font-size="16" fill="#1c1917">Skills</text>
  <rect x="272" y="246" width="112" height="30" rx="15" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="328" y="266" text-anchor="middle" font-size="16" fill="#1c1917">Tools</text>
  <rect x="394" y="246" width="112" height="30" rx="15" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="450" y="266" text-anchor="middle" font-size="16" fill="#1c1917">Hooks</text>

  <!-- wraps -->
  <!-- edge: harness -> foundation -->
  <line x1="330" y1="288" x2="330" y2="308" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-av2)"/>
  <text x="342" y="303" font-size="16" fill="#78716c">wraps</text>

  <!-- Foundation Model -->
  <rect id="foundation" x="80" y="308" width="500" height="64" rx="6" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="100" y="338" font-size="20" font-weight="bold" fill="#1c1917">Foundation Model</text>
  <text x="100" y="360" font-size="16" fill="#57534e">the trained model</text>

  <!-- bounded by -->
  <!-- edge: foundation -> bounded-state -->
  <line x1="330" y1="372" x2="330" y2="392" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-av2)"/>
  <text x="342" y="387" font-size="16" fill="#78716c">bounded by</text>

  <!-- Bounded working state (the context window is its present instance) -->
  <rect id="bounded-state" x="80" y="392" width="500" height="64" rx="6" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="100" y="422" font-size="20" font-weight="bold" fill="#1c1917">Bounded working state</text>
  <text x="100" y="444" font-size="16" fill="#57534e">what the model holds at once — the context window today</text>

  <!-- ===== RIGHT: softened causal tail ===== -->
  <!-- large engineering task -->
  <rect id="task" x="690" y="92" width="260" height="46" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="820" y="121" text-anchor="middle" font-size="18" fill="#1c1917">Large engineering task</text>

  <!-- requires -->
  <!-- edge: task -> horizon -->
  <line x1="820" y1="138" x2="820" y2="178" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-av2)"/>
  <text x="832" y="162" font-size="16" fill="#78716c">requires</text>

  <!-- Reasoning Horizon -->
  <rect id="horizon" x="690" y="178" width="260" height="46" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="820" y="207" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1917">Reasoning Horizon</text>

  <!-- may exceed -->
  <!-- edge: horizon -> avail-state -->
  <line x1="820" y1="224" x2="820" y2="264" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-av2)"/>
  <text x="832" y="248" font-size="16" fill="#78716c">may exceed</text>

  <!-- Available working state (context window is one present limit) -->
  <rect id="avail-state" x="690" y="264" width="260" height="58" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="820" y="290" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1917">Available working state</text>
  <text x="820" y="311" text-anchor="middle" font-size="12.4" font-style="italic" fill="#57534e">context window is one present limit</text>

  <!-- contributes to -->
  <!-- edge: avail-state -> churn -->
  <line x1="820" y1="322" x2="820" y2="362" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-av2)"/>
  <text x="832" y="346" font-size="16" fill="#78716c">contributes to</text>

  <!-- Churn -->
  <rect id="churn" x="690" y="362" width="260" height="46" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="820" y="391" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1917">Churn</text>

  <!-- bridge: the bottom stack layer IS one instance of the working-state limit today. Orthogonal
       L-connector through the empty middle gap, no label (the working-state node carries the meaning).
       A <path> (not <polyline>) so the edge is lint-legible; endpoints seat on bounded-state's right
       border and avail-state's left border. -->
  <!-- edge: bounded-state .. avail-state -->
  <path d="M580,424 L636,424 L636,293 L688,293" fill="none" stroke="#cfcabf" stroke-width="3" stroke-dasharray="4 4" marker-end="url(#vh-av2)"/>

  <!-- the glossary term that annotates the stack but isn't a layer -->
  <text x="95" y="484" font-size="16" fill="#57534e"><tspan font-weight="bold">Fleet:</tspan> multiple agents working on a shared engineering system.</text>

  <!-- R13 zoom cue: FRAME-echo corner-brackets — a family-membership signal (this figure zooms sideways into the agent substrate). -->
  <g fill="none" stroke="#57534e" stroke-width="2.5">
    <path d="M26,12 L12,12 L12,26"/>
    <path d="M974,488 L988,488 L988,474"/>
  </g>
</svg>
