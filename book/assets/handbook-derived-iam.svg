<text x="71.5" y="32" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">MODEL</text>
<text x="71.5" y="45" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Verified mirror</text>
<rect x="174" y="4" width="132" height="47" rx="3" fill="#f1f4f6" stroke="#2f5169" stroke-width="0.65"/>
<text x="240" y="21" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">RUNTIME IDENTITY</text>
<text x="240" y="38" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Accounts · resources</text>
<path d="M71.5,51 L71.5,88" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)" stroke-dasharray="3 2" marker-start="url(#arrowstart)"/>
<text x="83" y="73" text-anchor="start" font-size="10" font-weight="400" font-style="italic" fill="#57534e">parity check</text>
<rect x="4" y="88" width="135" height="50" rx="3" fill="white" stroke="#1c1917" stroke-width="0.65"/>
<text x="71.5" y="103" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">DEPLOYMENT</text>
<text x="71.5" y="116" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">DEPENDENCY MAP</text>
