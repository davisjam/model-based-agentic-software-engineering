<svg xmlns="http://www.w3.org/2000/svg" width="430" height="212" viewBox="0 0 430 212" role="img" aria-labelledby="title desc" font-family="&quot;Source Sans 3&quot;, sans-serif">
<title id="title">The implemented grant derivation and its separate correspondence checks</title>
<desc id="desc">The service-flow model is a verified mirror compared with the deployment dependency map by a parity check. The deployment dependency map and runtime identity feed the IAM grant plan; deployment applies those grants for Cloud IAM enforcement. In a separate lane, a name-set check compares declared deployment names with the observed fleet. That comparison is not verification of IAM bindings.</desc>
