<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1044" viewBox="0 0 440 348" role="img" aria-labelledby="title desc"><title id="title">Model-driven deployment with explicit authority boundaries</title><desc id="desc">Flexible engineering judgment selects intended calls. A typed call contract is checked by parity against the current authoritative dependency map. That map and environment-specific deployment identities feed deterministic grant derivation, a concrete grant plan, application, and per-grant results. Installed IAM bindings govern invocation at a separate runtime boundary. Service-name correspondence is not an IAM check. Moving model authority requires a separate consumer migration.</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.7" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="black"/></marker></defs><rect width="440" height="348" fill="white"/>
<rect x="315" y="218" width="123" height="124" rx="0" fill="white" stroke="black" stroke-width="1.6"/>
<text x="376.5" y="232" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="bold" fill="black">Cloud IAM boundary</text>
<path d="M70,40 L70,65" fill="none" stroke="black" stroke-width="0.8" marker-end="url(#arrow)"/>
<path d="M140,88 L180,88" fill="none" stroke="black" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="160" y="81" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">parity</text>
<path d="M240,110 L240,142" fill="none" stroke="black" stroke-width="0.8" marker-end="url(#arrow)"/>
<path d="M382.5,110 L382.5,126 L270,126 L270,142" fill="none" stroke="black" stroke-width="0.8" marker-end="url(#arrow)"/>
<path d="M240,182 L240,202" fill="none" stroke="black" stroke-width="0.8" marker-end="url(#arrow)"/>
<path d="M240,238 L240,261" fill="none" stroke="black" stroke-width="0.8" marker-end="url(#arrow)"/>
<path d="M180,280 L145,280" fill="none" stroke="black" stroke-width="0.8" marker-end="url(#arrow)"/>
<path d="M300,280 L307,280 L307,261 L325,261" fill="none" stroke="black" stroke-width="0.8" marker-end="url(#arrow)"/>
<path d="M380,278 L380,294" fill="none" stroke="black" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="0" y="0" width="140" height="40" rx="8" fill="#eaeaea" stroke="black" stroke-width="0.8"/>
<text x="70.0" y="17.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Engineer / agent</text>
<text x="70.0" y="29.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">selects intended calls</text>
<rect x="0" y="65" width="140" height="45" rx="0" fill="white" stroke="black" stroke-width="0.8"/>
<text x="70.0" y="84.9" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Typed call contract</text>
<text x="70.0" y="96.9" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">verified mirror</text>
<rect x="180" y="65" width="120" height="45" rx="0" fill="white" stroke="black" stroke-width="0.8"/>
<text x="240.0" y="84.9" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Dependency map</text>
<text x="240.0" y="96.9" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">current authority</text>
<rect x="325" y="65" width="115" height="45" rx="0" fill="white" stroke="black" stroke-width="0.8"/>
<text x="382.5" y="84.9" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Deployment identities</text>
<text x="382.5" y="96.9" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">and service names</text>
<rect x="180" y="142" width="120" height="40" rx="8" fill="white" stroke="black" stroke-width="0.8"/>
<text x="240.0" y="165.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Derive concrete grants</text>
<rect x="180" y="202" width="120" height="36" rx="0" fill="white" stroke="black" stroke-width="0.8"/>
<text x="240.0" y="223.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Grant plan</text>
<rect x="180" y="261" width="120" height="38" rx="8" fill="white" stroke="black" stroke-width="0.8"/>
<text x="240.0" y="283.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Apply grants</text>
<rect x="0" y="259" width="145" height="43" rx="0" fill="white" stroke="black" stroke-width="0.8"/>
<text x="72.5" y="277.9" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Per-grant results</text>
<text x="72.5" y="289.9" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">granted / failed / dry-run</text>
<rect x="325" y="244" width="110" height="34" rx="0" fill="white" stroke="black" stroke-width="0.8"/>
<text x="380.0" y="264.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Installed bindings</text>
<polygon points="380,294.0 432.0,312 380,330.0 328.0,312" fill="white" stroke="black" stroke-width=".8"/>
<text x="380" y="315.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Allow call?</text>
<text x="380" y="338" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">allow / refuse</text>
<text x="70" y="133" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Later: migrate consumers,</text>
<text x="70" y="145" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">then transfer authority.</text>
<text x="70" y="196" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Service-name parity</text>
<text x="70" y="208" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">does not verify IAM.</text>
<text x="72.5" y="321" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Failed application:</text>
<text x="72.5" y="333" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">report and fix forward.</text></svg>
