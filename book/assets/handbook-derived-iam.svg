<rect x="174" y="88" width="132" height="50" rx="3" fill="white" stroke="#1c1917" stroke-width="0.65"/>
<text x="240" y="107" text-anchor="middle" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">IAM GRANT PLAN</text>
<text x="240" y="125" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Principal · service</text>
<path d="M139,113 L174,113" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<rect x="338" y="88" width="88" height="50" rx="3" fill="white" stroke="#086438" stroke-width="0.65"/>
