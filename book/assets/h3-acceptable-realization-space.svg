<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h3-acceptable-realization-space.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 660" width="540" height="660"
     role="img" aria-labelledby="h3bTitle h3bDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h3bTitle">The acceptable realization space</title>
  <desc id="h3bDesc">Change intent flows into the governing models — architecture, behavior, contracts — which fix
    what must be true of the change. Those obligations bound an acceptable realization space containing the
    remaining degrees of freedom. Within that space the agent realizes an implementation; independent evidence
    then decides admission. The obligations that constrain the change are separated from the freedom it leaves.</desc>

  <defs>
    <marker id="h3b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
  </defs>

  <rect x="0" y="0" width="540" height="660" fill="#fdfcf9"/>

  <rect x="170" y="30" width="200" height="46" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="270" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">CHANGE INTENT</text>

  <line x1="270" y1="76" x2="270" y2="112" stroke="#57534e" stroke-width="2.2" marker-end="url(#h3b-ah)"/>

  <rect x="130" y="114" width="280" height="58" rx="9" fill="#e3f0e7" stroke="#155c38" stroke-width="2.5"/>
  <text x="270" y="137" text-anchor="middle" font-size="15" font-weight="700" fill="#155c38">GOVERNING MODELS</text>
  <text x="270" y="158" text-anchor="middle" font-size="13" fill="#155c38">architecture · behavior · contracts</text>

  <line x1="270" y1="172" x2="270" y2="210" stroke="#57534e" stroke-width="2.2" marker-end="url(#h3b-ah)"/>
  <text x="270" y="198" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">what must be true</text>

  <rect x="120" y="214" width="300" height="98" rx="12" fill="#faf6ef" stroke="#9a3f12" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="270" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">ACCEPTABLE REALIZATION SPACE</text>
  <text x="270" y="286" text-anchor="middle" font-size="14" font-style="italic" fill="#9a3f12">the remaining degrees of freedom</text>

  <line x1="270" y1="312" x2="270" y2="350" stroke="#57534e" stroke-width="2.2" marker-end="url(#h3b-ah)"/>
  <text x="270" y="338" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">agent realizes</text>

  <rect x="170" y="352" width="200" height="46" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="270" y="380" text-anchor="middle" font-size="15" fill="#1c1917">implementation</text>

  <line x1="270" y1="398" x2="270" y2="434" stroke="#57534e" stroke-width="2.2" marker-end="url(#h3b-ah)"/>

  <rect x="150" y="436" width="240" height="46" rx="8" fill="#eef2f5" stroke="#2f5169" stroke-width="2"/>
  <text x="270" y="464" text-anchor="middle" font-size="15" fill="#2f5169">independent evidence</text>

  <line x1="270" y1="482" x2="270" y2="518" stroke="#57534e" stroke-width="2.2" marker-end="url(#h3b-ah)"/>

  <rect x="190" y="520" width="160" height="46" rx="9" fill="#f7efe8" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="270" y="548" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">admission</text>

  <text x="270" y="620" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">for a given realization problem, obligations bound the choices engineering leaves open</text>
</svg>
