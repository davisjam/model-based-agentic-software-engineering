<?xml version="1.0" encoding="UTF-8"?>
<!-- RB Part-IV figure — externalizing-judgment.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680"
     role="img" aria-labelledby="ejTitle ejDesc"
     font-family="'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="ejTitle">Externalizing judgment — type the kinds of work inside a recurring procedure.</title>
  <desc id="ejDesc">A neutral recurring-procedure box flows down into a green model-the-steps box, which fans
    into three columns distinguished by outline style. The left column, a solid rust deterministic outcome,
    becomes an executable tool. The middle column, a dashed blue bounded judgment, becomes a prepared context
    plus procedure. The right column, a dotted dark irreducible judgment, remains a human decision. The three
    forms converge, and a lifecycle event invokes the appropriate form at the right time, producing a dark
    sanctioned-action box. Outline style — solid, dashed, dotted — encodes the three kinds of work so the
    distinction survives in grayscale.</desc>

  <defs>
    <marker id="ej-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
  </defs>

  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">III &#183; Externalizing Judgment</text>

  <rect id="recurring-procedure" x="360" y="66" width="280" height="54" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="1.5"/>
  <text x="500" y="99" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">RECURRING PROCEDURE</text>
  <!-- edge: recurring-procedure -> model-steps -->
  <line x1="500" y1="120" x2="500" y2="158" stroke="#57534e" stroke-width="2" marker-end="url(#ej-ah)"/>

  <rect id="model-steps" x="390" y="160" width="220" height="52" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="500" y="192" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">MODEL THE STEPS</text>

  <!-- fan to three kinds -->
  <!-- edge: model-steps -> deterministic -->
  <path d="M406,212 L406,233 L364,233 L364,254" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#ej-ah)"/>
  <!-- edge: model-steps -> bounded -->
  <line x1="500" y1="212" x2="500" y2="254" stroke="#57534e" stroke-width="2" marker-end="url(#ej-ah)"/>
  <!-- edge: model-steps -> irreducible -->
  <path d="M594,212 L594,233 L636,233 L636,254" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#ej-ah)"/>

  <!-- deterministic = solid rust -->
  <rect id="deterministic" x="120" y="256" width="260" height="64" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="250" y="284" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">EXECUTE</text>
  <text x="250" y="304" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">DETERMINED</text>
  <!-- bounded = dashed blue -->
  <rect id="bounded" x="370" y="256" width="260" height="64" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="500" y="284" text-anchor="middle" font-size="20" font-weight="700" fill="#2f5169">DELEGATE</text>
  <text x="500" y="304" text-anchor="middle" font-size="20" font-weight="700" fill="#2f5169">BOUNDED</text>
  <!-- irreducible = dotted dark -->
  <rect id="irreducible" x="620" y="256" width="260" height="64" rx="10" fill="#f6f4ef" stroke="#1c1917" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="750" y="284" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">ESCALATE</text>
  <text x="750" y="304" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">IRREDUCIBLE</text>

  <!-- edge: deterministic -> tool -->
  <line x1="250" y1="320" x2="250" y2="360" stroke="#57534e" stroke-width="2" marker-end="url(#ej-ah)"/>
  <!-- edge: bounded -> prepared-context -->
  <line x1="500" y1="320" x2="500" y2="360" stroke="#57534e" stroke-width="2" marker-end="url(#ej-ah)"/>
  <!-- edge: irreducible -> human -->
  <line x1="750" y1="320" x2="750" y2="360" stroke="#57534e" stroke-width="2" marker-end="url(#ej-ah)"/>

  <!-- forms -->
  <rect id="tool" x="140" y="362" width="220" height="64" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="250" y="390" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">TOOL</text>
  <text x="250" y="410" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">executable</text>
  <rect id="prepared-context" x="390" y="362" width="220" height="64" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="500" y="388" text-anchor="middle" font-size="20" font-weight="700" fill="#2f5169">PREPARED CONTEXT</text>
  <text x="500" y="408" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">+ procedure</text>
  <rect id="human" x="640" y="362" width="220" height="64" rx="10" fill="#f6f4ef" stroke="#1c1917" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="750" y="388" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">HUMAN</text>
  <text x="750" y="408" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">decision</text>

  <!-- merge: three forms converge into the sanctioned action (one path per branch) -->
  <!-- edge: tool -> sanctioned-action -->
  <path d="M344,426 L344,473 L396,473 L396,520" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#ej-ah)"/>
  <!-- edge: human -> sanctioned-action -->
  <path d="M656,426 L656,473 L604,473 L604,520" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#ej-ah)"/>
  <!-- edge: prepared-context -> sanctioned-action -->
  <line x1="500" y1="426" x2="500" y2="520" stroke="#57534e" stroke-width="2" marker-end="url(#ej-ah)"/>
  <text x="640" y="492" text-anchor="start" font-size="20" font-style="italic" fill="#57534e">lifecycle event invokes the right form</text>

  <rect id="sanctioned-action" x="380" y="522" width="240" height="58" rx="12" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="500" y="557" text-anchor="middle" font-size="20" font-weight="700" fill="#fdfcf9">SANCTIONED ACTION</text>

  <text x="500" y="636" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">Type the judgment inside a procedure — don't flatten it into prose or automation.</text>
</svg>
