<?xml version="1.0" encoding="UTF-8"?>
<!-- RB Part-IV figure — event-reaction-fire.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520"
     role="img" aria-labelledby="erTitle erDesc"
     font-family="'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="erTitle">Bind reactions to lifecycle events — the firing is deterministic while the payload still contains judgment.</title>
  <desc id="erDesc">A neutral lifecycle box flows down through an observable event into a solid rust
    deterministic-fire node: the reaction fires on the event with no actor needing to notice. From the fire the
    flow fans into three branches distinguished by outline style. The left branch, a solid rust execute step,
    carries a known action. The middle branch, a dashed blue delegate step, carries bounded judgment. The right
    branch, a dotted dark escalate step, carries human judgment. The three converge into a dark next-lifecycle-state
    box, and a dashed rust loop returns to the lifecycle so the next transition binds again. Outline style — solid,
    dashed, dotted — encodes the three kinds of payload so the distinction survives in grayscale. The point: the
    firing can be deterministic while the payload still contains judgment.</desc>

  <defs>
    <marker id="er-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
    <marker id="er-ah-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/></marker>
  </defs>

  <!-- ===== EDGES (drawn UNDER the nodes; each node fill caps its ends) ===== -->
  <g fill="none" stroke="#57534e" stroke-width="2">
    <!-- edge: lifecycle -> fire -->
    <path d="M500,86 L500,122" marker-end="url(#er-ah)"/>
    <!-- fan to three branches (one path per branch) -->
    <!-- edge: fire -> execute -->
    <path d="M360,153 L215,153 L215,224" marker-end="url(#er-ah)"/>
    <!-- edge: fire -> delegate -->
    <path d="M500,182 L500,224" marker-end="url(#er-ah)"/>
    <!-- edge: fire -> escalate -->
    <path d="M640,153 L785,153 L785,224" marker-end="url(#er-ah)"/>
    <!-- converge to next lifecycle state (one path per branch, sharing the trunk into the box) -->
    <!-- edge: execute -> next -->
    <path d="M215,296 L215,421 L358,421" marker-end="url(#er-ah)"/>
    <!-- edge: delegate -> next -->
    <path d="M500,296 L500,388" marker-end="url(#er-ah)"/>
    <!-- edge: escalate -> next -->
    <path d="M785,296 L785,421 L642,421" marker-end="url(#er-ah)"/>
  </g>

  <!-- dashed rust loop: the lifecycle advances and the next transition binds again -->
  <!-- edge: next .. lifecycle -->
  <path d="M500,421 L935,421 L935,60 L622,60" fill="none" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#er-ah-rust)"/>

  <!-- ===== NODES (on top) ===== -->
  <!-- lifecycle (neutral) -->
  <rect id="lifecycle" x="380" y="34" width="240" height="52" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="1.5"/>
  <text x="500" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">LIFECYCLE</text>

  <!-- deterministic fire (governance rust, SOLID + emphasis = the firing is deterministic) -->
  <rect id="fire" x="360" y="124" width="280" height="58" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="500" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f12">DETERMINISTIC FIRE</text>
  <text x="500" y="170" text-anchor="middle" font-size="12" font-style="italic" fill="#57534e">the reaction fires on the event</text>

  <!-- EXECUTE = solid rust (known action) -->
  <rect id="execute" x="90" y="226" width="250" height="70" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="215" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3f12">EXECUTE</text>
  <text x="215" y="280" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">known action</text>
  <!-- DELEGATE = dashed blue (bounded judgment) -->
  <rect id="delegate" x="375" y="226" width="250" height="70" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="500" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">DELEGATE</text>
  <text x="500" y="280" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">bounded judgment</text>
  <!-- ESCALATE = dotted dark (human judgment) -->
  <rect id="escalate" x="660" y="226" width="250" height="70" rx="10" fill="#f6f4ef" stroke="#1c1917" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="785" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">ESCALATE</text>
  <text x="785" y="280" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">human judgment</text>

  <!-- next lifecycle state (dark terminal) -->
  <rect id="next" x="360" y="390" width="280" height="62" rx="12" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="500" y="418" text-anchor="middle" font-size="16" font-weight="700" fill="#fdfcf9">NEXT LIFECYCLE</text>
  <text x="500" y="438" text-anchor="middle" font-size="16" font-weight="700" fill="#fdfcf9">STATE</text>

  <!-- ===== edge / annotation labels (on top) ===== -->
  <text x="512" y="108" text-anchor="start" font-size="13" font-style="italic" fill="#57534e">observable event</text>
  <text x="652" y="157" text-anchor="start" font-size="12" font-style="italic" fill="#57534e">no actor need notice</text>
  <text x="787" y="413" text-anchor="middle" font-size="12" font-style="italic" fill="#9a3f12">advances &#8594; the next transition binds again</text>

  <!-- thesis tagline (two lines) -->
  <text x="500" y="484" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">The firing is deterministic; the payload still contains judgment.</text>
  <text x="500" y="504" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">Automate the arrival of the decision procedure &#8212; not the decision.</text>
</svg>
