<!-- Compact color geometry for Chapter 3. Original caption, title, and description retained; monochrome review partner remains unchanged. Print width is declared by stable figure label in book/data/figure-print-layout.json. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 385" width="1000" height="385" role="img" aria-labelledby="figure-title figure-description" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="figure-title">Three views of one system of controls: catalogue, interaction graph, and coverage of
    obligations against mechanisms — the same three controls seen through three relations</title>
<desc id="figure-description">Three panels over the same three controls, carried by stable identities: [A] squash rule,
    [B] brief guard, [C] lint gate. Left panel, the catalogue, lists the three controls that exist. Middle
    panel, the interaction graph, relates [A] and [B] through a shared resource, the commit set, where they
    collide; [C] stands alone. Right panel, the coverage view, relates controls to the obligations that
    justify them: scope-bounded traces to [A] and brief-followed to [B], while the cost-ceiling obligation
    has no control — a coverage gap — and [C] traces to no obligation — an orphan. The same control identities appear in every view; each view selects and adds the
    relations its engineering question needs.</desc>
