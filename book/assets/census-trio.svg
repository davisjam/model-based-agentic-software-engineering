<svg xmlns="http://www.w3.org/2000/svg" width="592" height="288" viewBox="0 0 444 216" role="img" aria-labelledby="title desc" font-family="Source Sans 3, sans-serif">
<title id="title">Three views of the control machinery</title>
<desc id="desc">Control machinery supplies the catalogue, interaction graph, and coverage view. Independently identified obligations also feed coverage. The squash rule and diff-size guard share the commit set. Atomic delivery traces to the squash rule, bounded change scope to the diff-size guard. A cost ceiling lacks coverage, and a legacy export check lacks a recorded justification.</desc>
