<?xml version="1.0" encoding="UTF-8"?>

<!-- Figure 3.5-2 "Three Views of One System of Controls" (v7 draft; folds to book/assets/census-trio.svg;
     label kept stable: census-trio).
     v7 THEORY-CARRYING edit (3.5-2):
       - PRESERVE the SAME control identities [A]/[B]/[C] across all three views (catalogue, interactions,
         coverage), so a reader tracks one estate through three relations.
       - DELETE the incorrect claim "the graph and the coverage view add no data — they re-view the
         catalogue." Interaction edges and obligation relations ARE additional data; each view selects and
         adds the relations its engineering question needs. The footer now reads "same control identities,
         different relations."
       - enlarge/simplify: fewer per-panel captions, larger nodes.
     v8 LEGIBILITY edit: every boxed label raised to the 8pt print floor (25.6u at this viewBox); the
       interaction [A]/[B]/[C] and coverage control-node labels WRAP to two lines in grown boxes; the two
       commit-set spokes rerouted diagonally to the shared-node corners so they clear the enlarged
       'collision' label; coverage obligation boxes widened so the wider identities fit.
     Model theory: stable identities persist; the catalogue answers "what exists," the interaction graph
     "what collides" (relating controls through a shared resource), the coverage view "what obligation
     justifies each control" (relating controls to obligations — surfacing a GAP and an ORPHAN). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620"
     role="img" aria-labelledby="ctTitle ctDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="ctTitle">Three views of one system of controls: catalogue, interaction graph, and coverage of
    obligations against mechanisms — the same three controls seen through three relations</title>
  <desc id="ctDesc">Three panels over the same three controls, carried by stable identities: [A] squash rule,
    [B] brief guard, [C] lint gate. Left panel, the catalogue, lists the three controls that exist. Middle
    panel, the interaction graph, relates [A] and [B] through a shared resource, the commit set, where they
    collide; [C] stands alone. Right panel, the coverage view, relates controls to the obligations that
    justify them: scope-bounded traces to [A] and brief-followed to [B], while the cost-ceiling obligation
    has no control — a coverage gap — and [C] traces to no obligation — an orphan. The same control identities appear in every view; each view selects and adds the
    relations its engineering question needs.</desc>

  <defs>
    <marker id="ct-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/>
    </marker>
  </defs>

  <line x1="427" y1="30" x2="427" y2="500" stroke="#e4e0d8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="853" y1="30" x2="853" y2="500" stroke="#e4e0d8" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ============ Panel 1: CATALOGUE ============ -->
  <text x="213" y="56" text-anchor="middle" font-size="25.6" font-weight="700" fill="#1c1917">Catalogue</text>
  <text x="213" y="86" text-anchor="middle" font-size="25.6" font-style="italic" fill="#57534e">what exists</text>

  <g fill="#e7edf3" stroke="#2f5169" stroke-width="2">
    <rect x="113" y="150" width="200" height="56" rx="7"/>
    <rect x="113" y="238" width="200" height="56" rx="7"/>
    <rect x="113" y="326" width="200" height="56" rx="7"/>
  </g>
  <g font-size="25.6" fill="#1c1917" text-anchor="middle">
    <text x="213" y="186"><tspan font-weight="800" fill="#2f5169">[A]</tspan> squash rule</text>
    <text x="213" y="274"><tspan font-weight="800" fill="#2f5169">[B]</tspan> brief guard</text>
    <text x="213" y="362"><tspan font-weight="800" fill="#2f5169">[C]</tspan> lint gate</text>
  </g>

  <!-- ============ Panel 2: INTERACTION GRAPH ============ -->
  <text x="640" y="56" text-anchor="middle" font-size="25.6" font-weight="700" fill="#1c1917">Interaction graph</text>
  <text x="640" y="86" text-anchor="middle" font-size="25.6" font-style="italic" fill="#57534e">what collides</text>

  <!-- spokes drawn FIRST (under the nodes), routed to the shared-node corners so they clear the enlarged
       'collision' label between the boxes and the commit-set node -->
  <g stroke="#1c1917" stroke-width="1.8" fill="none">
    <!-- edge: squash-rule -> commit-set (diagonal to top-left corner region) -->
    <line x1="551" y1="208" x2="585" y2="262"/>
    <!-- edge: brief-guard -> commit-set (diagonal to top-right corner region) -->
    <line x1="729" y1="208" x2="695" y2="262"/>
  </g>

  <!-- [A] and [B] act on a shared resource; the collision hangs off it -->
  <g fill="#e7edf3" stroke="#2f5169" stroke-width="2">
    <rect id="squash-rule" x="475" y="150" width="152" height="58" rx="7"/>
    <rect id="brief-guard" x="653" y="150" width="152" height="58" rx="7"/>
  </g>
  <g font-size="25.6" fill="#1c1917" text-anchor="middle">
    <text x="551" y="174"><tspan font-weight="800" fill="#2f5169">[A]</tspan></text>
    <text x="551" y="200">squash rule</text>
    <text x="729" y="174"><tspan font-weight="800" fill="#2f5169">[B]</tspan></text>
    <text x="729" y="200">brief guard</text>
  </g>

  <!-- collision marked on the shared relation between [A] and [B] -->
  <!-- edge: squash-rule .. brief-guard -->
  <line x1="627" y1="179" x2="653" y2="179" stroke="#b23b3b" stroke-width="2.4" stroke-dasharray="7 6"
        marker-start="url(#ct-ah)" marker-end="url(#ct-ah)"/>
  <text x="640" y="242" text-anchor="middle" font-size="25.6" font-weight="700" fill="#b23b3b">collision</text>

  <!-- shared resource node -->
  <rect id="commit-set" x="560" y="262" width="160" height="48" rx="7" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
  <text x="640" y="294" text-anchor="middle" font-size="25.6" font-weight="700" fill="#1c1917">commit set</text>

  <!-- [C] stands alone -->
  <rect x="564" y="336" width="152" height="58" rx="7" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <g font-size="25.6" fill="#1c1917" text-anchor="middle">
    <text x="640" y="360"><tspan font-weight="800" fill="#2f5169">[C]</tspan></text>
    <text x="640" y="386">lint gate</text>
  </g>

  <!-- ============ Panel 3: COVERAGE (obligation ↔ control) ============ -->
  <text x="1066" y="56" text-anchor="middle" font-size="25.6" font-weight="700" fill="#1c1917">Coverage</text>
  <text x="1066" y="86" text-anchor="middle" font-size="25.6" font-style="italic" fill="#57534e">what obligation justifies each control</text>

  <text x="976" y="126" text-anchor="middle" font-size="25.6" font-weight="700" fill="#57534e">obligation</text>
  <text x="1194" y="126" text-anchor="middle" font-size="25.6" font-weight="700" fill="#57534e">control</text>

  <!-- matched edges (blue), drawn UNDER the nodes, from obligation right border to control left border -->
  <g stroke="#2f5169" stroke-width="2.2">
    <!-- edge: scope-bounded -> ctl-squash -->
    <line x1="1074" y1="169" x2="1118" y2="169"/>
    <!-- edge: brief-followed -> ctl-brief -->
    <line x1="1074" y1="241" x2="1118" y2="241"/>
  </g>

  <!-- obligation nodes (left) -->
  <g fill="#eef2f6" stroke="#2f5169" stroke-width="1.8">
    <rect id="scope-bounded" x="878" y="140" width="196" height="58" rx="6"/>
    <rect id="brief-followed" x="878" y="212" width="196" height="58" rx="6"/>
  </g>
  <rect x="878" y="284" width="196" height="58" rx="6" fill="#ffffff" stroke="#b23b3b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <g text-anchor="middle" fill="#1c1917" font-size="25.6">
    <text x="976" y="178">scope-bounded</text>
    <text x="976" y="250">brief-followed</text>
    <text x="976" y="322" font-weight="700" fill="#8a2f2f">cost-ceiling</text>
  </g>

  <!-- control nodes (right), carrying the same identities -->
  <g fill="#e7edf3" stroke="#2f5169" stroke-width="1.8">
    <rect id="ctl-squash" x="1118" y="140" width="152" height="58" rx="6"/>
    <rect id="ctl-brief" x="1118" y="212" width="152" height="58" rx="6"/>
  </g>
  <rect x="1118" y="284" width="152" height="58" rx="6" fill="#ffffff" stroke="#b23b3b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <g text-anchor="middle" font-size="25.6" fill="#1c1917">
    <text x="1194" y="164"><tspan font-weight="800" fill="#2f5169">[A]</tspan></text>
    <text x="1194" y="190">squash rule</text>
    <text x="1194" y="236"><tspan font-weight="800" fill="#2f5169">[B]</tspan></text>
    <text x="1194" y="262">brief guard</text>
    <text x="1194" y="308"><tspan font-weight="800" fill="#8a2f2f">[C]</tspan></text>
    <text x="1194" y="334">lint gate</text>
  </g>

  <!-- GAP + ORPHAN flags -->
  <g text-anchor="middle" font-weight="700" fill="#b23b3b" font-size="25.6">
    <text x="976" y="366">COVERAGE GAP</text>
    <text x="1180" y="366">ORPHAN</text>
  </g>

  <!-- ============ footer ============ -->
  <text x="640" y="552" text-anchor="middle" font-size="25.6" font-weight="700" fill="#1c1917">One system of controls, three questions</text>
  <text x="640" y="582" text-anchor="middle" font-size="25.6" font-style="italic" fill="#57534e">same control identities, different relations</text>
</svg>
