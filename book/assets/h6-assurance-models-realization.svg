<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h6-assurance-models-realization.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" width="640" height="660"
     role="img" aria-labelledby="h6Title h6Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h6Title">Assurance across models and realization</title>
  <desc id="h6Desc">An obligation becomes an assurance claim. Establishing the claim can require evidence about
    modeled properties — architecture, behavior, data flow, access policy, invariants — about the realization —
    implementation, tests, static analysis, runtime evidence, memory safety — or about the correspondence between
    them, which traceability and Alignment supply. The combined evidence and argument establishes the claim.</desc>

  <defs>
    <marker id="h6-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
  </defs>

  <rect x="0" y="0" width="640" height="660" fill="#fdfcf9"/>

  <g text-anchor="middle">
    <rect x="240" y="24" width="160" height="42" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="320" y="51" font-size="14" font-weight="700" fill="#1c1917">OBLIGATION</text>

    <rect x="210" y="110" width="220" height="44" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="320" y="138" font-size="14" font-weight="700" fill="#1c1917">ASSURANCE CLAIM</text>
  </g>

  <line x1="320" y1="66" x2="320" y2="108" stroke="#57534e" stroke-width="2.2" marker-end="url(#h6-ah)"/>

  <!-- split to the two evidence bodies -->
  <path d="M320,154 L320,180 L165,180 L165,206" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#h6-ah)"/>
  <path d="M320,154 L320,180 L475,180 L475,206" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#h6-ah)"/>

  <!-- model evidence -->
  <rect x="50" y="208" width="230" height="168" rx="9" fill="#eef2f5" stroke="#2f5169" stroke-width="2.2"/>
  <text x="165" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#2f5169">MODEL EVIDENCE</text>
  <g text-anchor="middle" font-size="13" fill="#2f5169">
    <text x="165" y="262">architecture</text>
    <text x="165" y="284">behavior</text>
    <text x="165" y="306">data flow</text>
    <text x="165" y="328">access policy</text>
    <text x="165" y="350">invariants</text>
  </g>

  <!-- realization evidence -->
  <rect x="360" y="208" width="230" height="168" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="475" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1917">REALIZATION EVIDENCE</text>
  <g text-anchor="middle" font-size="13" fill="#1c1917">
    <text x="475" y="262">implementation</text>
    <text x="475" y="284">tests</text>
    <text x="475" y="306">static analysis</text>
    <text x="475" y="328">runtime evidence</text>
    <text x="475" y="350">memory safety</text>
  </g>

  <!-- merge to traceability & alignment -->
  <path d="M165,376 L165,404 L320,404" fill="none" stroke="#57534e" stroke-width="2"/>
  <path d="M475,376 L475,404 L320,404" fill="none" stroke="#57534e" stroke-width="2"/>
  <text x="320" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3f12">TRACEABILITY &amp; ALIGNMENT</text>
  <text x="320" y="450" text-anchor="middle" font-size="13" fill="#9a3f12">models ↔ code</text>

  <line x1="320" y1="462" x2="320" y2="496" stroke="#57534e" stroke-width="2.2" marker-end="url(#h6-ah)"/>

  <g text-anchor="middle">
    <rect x="210" y="498" width="220" height="56" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="320" y="522" font-size="14" font-weight="700" fill="#1c1917">EVIDENCE /</text>
    <text x="320" y="542" font-size="14" font-weight="700" fill="#1c1917">ARGUMENT</text>
  </g>

  <line x1="320" y1="554" x2="320" y2="588" stroke="#57534e" stroke-width="2.2" marker-end="url(#h6-ah)"/>

  <g text-anchor="middle">
    <rect x="206" y="590" width="228" height="44" rx="9" fill="#f7efe8" stroke="#9a3f12" stroke-width="2.5"/>
    <text x="320" y="618" font-size="14" font-weight="700" fill="#9a3f12">CLAIM ESTABLISHED</text>
  </g>
</svg>
