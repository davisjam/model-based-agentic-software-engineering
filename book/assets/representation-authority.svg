<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid), label: representation-authority. Fig 4.2-2. Two INDEPENDENT
     tracks, not one ladder:
       TOP track  — REPRESENTATION strengthening: informal -> structured -> executable (consumed).
       BOTTOM track — CONSEQUENCE / authority: guidance -> correspondence -> under enforcement.
     The claim is that the tracks are INDEPENDENT: a representation can move right (more structured,
     more consumable) without every claim becoming a gate; authority attaches to SELECTED obligations
     along the separate lower track. One dashed vertical connector on the right, from Executable to
     Under enforcement, marks that selective attachment and carries a short plain label to its left —
     no red, no italic annotation, so the figure keeps a single visual vocabulary and the C6/C7 gates
     have no crossing strokes or overflow to trip on.
     Palette: governed green #1f7a4d / #e3f0e7 (representation), accent #2f5169 / #e7edf3 (authority),
     muted #57534e, ink #1c1917. Grayscale-survivable: two labelled lanes and left-to-right order
     carry the reading, not colour alone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470"
     role="img" aria-labelledby="raTitle raDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="raTitle">Strengthening representation and authority are two independent tracks, not one ladder</title>
  <desc id="raDesc">Two horizontal tracks stacked one above the other. The upper track is
    representation strengthening, left to right: an informal model (prose, wiki, diagram), then a
    structured model (a typed shape a tool can parse), then an executable model (one a tool actually
    consumes). The lower track is consequence, left to right: guidance that is read if useful, then
    correspondence where the join is checked and drift is surfaced, then selected obligations placed
    under enforcement. The two tracks are independent: a representation can strengthen along the upper
    track without every claim becoming a gate. A single dashed connector runs down from the
    executable-representation stage to the under-enforcement stage, labelled selected obligations
    acquire authority, marking that authority attaches to selected obligations separately, when
    enforcement is warranted.</desc>

  <defs>
    <marker id="ra-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">Two tracks, not one ladder</text>

  <!-- ===================== TOP LANE — REPRESENTATION ===================== -->
  <rect x="96" y="96" width="768" height="104" rx="12" fill="#eef7ee" stroke="#1f7a4d" stroke-width="1.2"/>
  <text x="112" y="88" font-size="19.2" font-weight="700" fill="#1f7a4d">REPRESENTATION &#8594; stronger, more consumable</text>

  <!-- ===================== BOTTOM LANE — CONSEQUENCE ===================== -->
  <rect x="96" y="284" width="768" height="104" rx="12" fill="#e7edf3" stroke="#2f5169" stroke-width="1.2"/>
  <text x="112" y="276" font-size="19.2" font-weight="700" fill="#2f5169">CONSEQUENCE &#8594; how represented claims are used</text>

  <!-- rep arrows -->
  <g fill="none" stroke="#1c1917" stroke-width="2.4" marker-end="url(#ra-ah)">
    <!-- edge: informal -> structured -->
    <path d="M328,149 L382,149"/>
    <!-- edge: structured -> executable -->
    <path d="M594,149 L648,149"/>
  </g>

  <!-- auth arrows -->
  <g fill="none" stroke="#1c1917" stroke-width="2.4" marker-end="url(#ra-ah)">
    <!-- edge: guidance -> correspondence -->
    <path d="M328,337 L382,337"/>
    <!-- edge: correspondence -> under-enforcement -->
    <path d="M594,337 L648,337"/>
  </g>

  <!-- ===================== SELECTIVE ATTACHMENT — one dashed vertical + plain label, no crossing ===================== -->
  <!-- edge: executable .. under-enforcement -->
  <path d="M755,186 L755,298" fill="none" stroke="#1c1917" stroke-width="2.4"
        stroke-dasharray="7 5" marker-end="url(#ra-ah)"/>
  <text x="735" y="236" text-anchor="end" font-size="16" fill="#57534e">selected obligations</text>
  <text x="735" y="258" text-anchor="end" font-size="16" fill="#57534e">acquire authority</text>

  <!-- rep chip 1: informal -->
  <rect id="informal" x="118" y="112" width="210" height="74" rx="9" fill="#eef7f0" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="223" y="146" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Informal</text>
  <text x="223" y="170" text-anchor="middle" font-size="19.2" fill="#57534e">prose &#183; wiki &#183; diagram</text>

  <!-- rep chip 2: structured -->
  <rect id="structured" x="347.45" y="112" width="283.1" height="74" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="489" y="146" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Structured</text>
  <text x="489" y="170" text-anchor="middle" font-size="19.2" fill="#57534e">typed shape a tool can parse</text>

  <!-- rep chip 3: executable -->
  <rect id="executable" x="650" y="112" width="210" height="74" rx="9" fill="#cfe6d6" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="755" y="146" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">Executable</text>
  <text x="755" y="170" text-anchor="middle" font-size="19.2" fill="#57534e">consumed by a tool</text>

  <!-- auth chip 1: guidance -->
  <rect id="guidance" x="118" y="300" width="210" height="74" rx="9" fill="#f6f4ef" stroke="#2f5169" stroke-width="2.2"/>
  <text x="223" y="334" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Guidance</text>
  <text x="223" y="358" text-anchor="middle" font-size="19.2" fill="#57534e">read if useful</text>

  <!-- auth chip 2: correspondence -->
  <rect id="correspondence" x="352.17" y="300" width="273.66" height="74" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="489" y="334" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Correspondence</text>
  <text x="489" y="358" text-anchor="middle" font-size="19.2" fill="#57534e">join checked &#183; drift surfaced</text>

  <!-- auth chip 3: under enforcement -->
  <rect id="under-enforcement" x="624" y="300" width="262" height="74" rx="9" fill="#dbe6ef" stroke="#2f5169" stroke-width="2.6"/>
  <text x="755" y="334" text-anchor="middle" font-size="20" font-weight="700" fill="#2f5169">Under enforcement</text>
  <text x="755" y="358" text-anchor="middle" font-size="19.2" fill="#57534e">selected obligations gated</text>

  <!-- reading line -->
  <text x="480" y="430" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">Independent tracks: representation can strengthen without acquiring authority;</text>
  <text x="480" y="450" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">authority attaches only to selected obligations.</text>
</svg>
