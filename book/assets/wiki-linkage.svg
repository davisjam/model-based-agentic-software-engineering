<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid), label: wiki-linkage — the wiki-vs-model side-by-side.
     Two panels, one shape. LEFT — the drifted wiki you
     already have: a page joined to code and tests, but weakly typed with the back-links
     missing and an orphan region floating unlinked. RIGHT — the typed model you build:
     the same round-trip join, complete and held by a drift gate. A gutter arrow reads the
     left maturing into the right (Audit -> Synchronize -> Govern -> Extend).
     Palette: Umber Monograph tokens (accent #9a3f12 the wiki page, fleet #2f5169 code+tests,
     governed #1f7a4d the model node, muted #57534e connectors + gloss). Grayscale-survivable:
     shape + dashing carry the weak-vs-typed contrast, not colour alone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540"
     role="group" aria-labelledby="wlTitle wlDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="wlTitle">The wiki is the model you already have</title>
  <desc id="wlDesc">Two panels drawn to the same shape. On the left, a drifted wiki: a wiki
    page joins down to the code and tests that realize it, but the back-links from code and
    tests up to the page are missing, and one code region is an orphan with no page at all —
    a weakly typed, incomplete join. On the right, the model you build: a typed model node
    with a complete round-trip join to the same code and tests, held in place by a drift gate.
    A gutter arrow shows the left maturing into the right through the staged migration.</desc>

  <defs>
    <marker id="wl-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="wl-ah-weak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <!-- ===================== LEFT PANEL — the drifted wiki ===================== -->
  <text x="239" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">The model you already have</text>
  <rect x="24" y="68" width="430" height="448" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>

  <!-- wiki page -->
  <rect x="144" y="98" width="190" height="66" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="239" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">Wiki page</text>
  <text x="239" y="150" text-anchor="middle" font-size="15.15" fill="#57534e">a claim about the system</text>

  <!-- code + tests -->
  <rect x="54" y="330" width="168" height="58" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="138" y="366" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">Code</text>

  <rect x="256" y="330" width="168" height="58" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="340" y="366" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">Tests</text>

  <!-- orphan: code with no page -->
  <rect x="256" y="428" width="168" height="56" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="340" y="452" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">Orphan region</text>
  <text x="340" y="472" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">no page at all</text>

  <!-- page -> code: solid (the link that usually exists) -->
  <path d="M205,166 C170,230 150,270 140,324" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#wl-ah)"/>
  <text x="120" y="250" text-anchor="end" font-size="16" font-style="italic" fill="#57534e">explains</text>

  <!-- code -> page: dashed, the missing back-link -->
  <path d="M175,326 C205,268 230,220 262,168" fill="none" stroke="#57534e" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#wl-ah-weak)"/>
  <text x="250" y="244" text-anchor="start" font-size="16" font-style="italic" fill="#57534e">back-link</text>
  <text x="250" y="262" text-anchor="start" font-size="16" font-style="italic" fill="#57534e">missing</text>

  <!-- page -> tests: dashed, partial -->
  <path d="M300,166 C330,240 340,280 340,324" fill="none" stroke="#57534e" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#wl-ah-weak)"/>

  <text x="239" y="504" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">weakly typed · join incomplete</text>

  <!-- ===================== GUTTER — matures into ===================== -->
  <path d="M460,292 L544,292" fill="none" stroke="#1c1917" stroke-width="2.5" marker-end="url(#wl-ah)"/>
  <text x="502" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">matures</text>

  <!-- ===================== RIGHT PANEL — the model you build ===================== -->
  <text x="761" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">The model you build</text>
  <rect x="550" y="68" width="430" height="448" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>

  <!-- model node -->
  <rect x="666" y="98" width="190" height="66" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="761" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a4d">Model node</text>
  <text x="761" y="150" text-anchor="middle" font-size="15.3" fill="#57534e">invariant · state machine</text>

  <!-- code + tests -->
  <rect x="580" y="330" width="168" height="58" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="664" y="366" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">Code</text>

  <rect x="782" y="330" width="168" height="58" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="866" y="366" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">Tests</text>

  <!-- model <-> code: complete round-trip join (both ends) -->
  <path d="M712,166 C676,232 660,272 655,324" fill="none" stroke="#1c1917" stroke-width="2"
        marker-start="url(#wl-ah)" marker-end="url(#wl-ah)"/>
  <text x="636" y="252" text-anchor="end" font-size="16" font-style="italic" fill="#57534e">round-trip</text>

  <!-- model <-> tests: complete round-trip join (both ends) -->
  <path d="M810,166 C846,232 862,272 866,324" fill="none" stroke="#1c1917" stroke-width="2"
        marker-start="url(#wl-ah)" marker-end="url(#wl-ah)"/>
  <text x="886" y="252" text-anchor="start" font-size="16" font-style="italic" fill="#57534e">round-trip</text>

  <!-- drift gate straddling the joins (hexagon) -->
  <polygon points="700,432 727,405 835,405 862,432 835,459 727,459"
           fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="781" y="438" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">Drift gate</text>

  <text x="761" y="504" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">typed · gate-enforced</text>
</svg>
