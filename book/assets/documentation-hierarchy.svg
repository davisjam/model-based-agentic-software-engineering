<?xml version="1.0" encoding="UTF-8"?>
<!-- DRAFT (part2-revision figure WO) — FIG-2.2-1 recast. Hand-authored SVG (not Mermaid).
     RECAST per part2.md §9 (line 439): the old figure put ONE typed model "at the apex,"
     which overstated centralization — the book argues for a zoo of linked models, each at a
     different altitude and concern. This version replaces the single apex box with a MODEL
     LAYER: a band of several linked models (a stratum, not a point) that binds the same three
     islands. Left panel unchanged (three islands, no glue — the semantic-gap-adjacent style).
     Palette: Umber Monograph — accent #2f5169, green #1f7a4d, red #b23b3b, ink #1c1917. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560"
     role="img" aria-labelledby="dhTitle dhDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="dhTitle">A structured model layer binds docs, code, and tests</title>
  <desc id="dhDesc">A two-panel contrast. Left panel, typical agentic methods: three
    boxes — docs, code, and tests — stand as separate islands with no glue between them.
    Nothing binds them, so they drift apart and there are no guardrails; a red marker notes
    the missing binding. Right panel, the MAGE move: a structured model layer — a band of
    several linked models, each at its own concern and altitude, not one universal master —
    sits above the same three and binds them with checked edges. The layer is the set of
    descriptions the machine checks the others against, so a drift check fails the build when
    docs, code, or tests disagree with it. The lesson: bind the islands with a layer of linked
    models, and the three that used to drift become one checkable whole.</desc>

  <defs>
    <marker id="dhArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9"
            orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <!-- edge-grammar: keep-angles -->
  <!-- The three binding edges are near-vertical straight drops that each carry a green drift-check badge
       riding on the edge midpoint. A perpendicular auto re-aim would bow the edge off its badge, so the
       straight seated diagonal is kept and the angle check is opted out (seating still enforced). -->

  <!-- panel divider -->
  <line x1="480" y1="70" x2="480" y2="530" stroke="#e4e0d8" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ================= LEFT PANEL — typical agentic methods ================= -->
  <text x="240" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#1c1917">Typical agentic methods</text>
  <text x="240" y="70" text-anchor="middle" font-size="20" font-style="italic" fill="#b23b3b">three islands, no glue</text>

  <!-- three unconnected islands -->
  <g stroke="#1c1917" stroke-width="2" fill="#f6f4ef">
    <rect x="70"  y="150" width="150" height="66" rx="8"/>
    <rect x="260" y="150" width="150" height="66" rx="8"/>
    <rect x="165" y="290" width="150" height="66" rx="8"/>
  </g>
  <g font-size="22" fill="#1c1917" text-anchor="middle">
    <text x="145" y="190">docs</text>
    <text x="335" y="190">code</text>
    <text x="240" y="330">tests</text>
  </g>

  <!-- broken tethers between the islands: dashed stubs that do not connect -->
  <g stroke="#b23b3b" stroke-width="2.5" stroke-dasharray="5 7" stroke-linecap="round">
    <line x1="222" y1="183" x2="258" y2="183"/>
    <line x1="205" y1="220" x2="250" y2="286"/>
    <line x1="332" y1="220" x2="285" y2="286"/>
  </g>

  <!-- drift indicator -->
  <text x="240" y="418" text-anchor="middle" font-size="21" font-style="italic" fill="#b23b3b">nothing binds them → they drift</text>
  <text x="240" y="446" text-anchor="middle" font-size="21" font-style="italic" fill="#b23b3b">no guardrails</text>

  <!-- ================= RIGHT PANEL — the MAGE move ================= -->
  <text x="720" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#1c1917">Structured model layer</text>
  <text x="720" y="68" text-anchor="middle" font-size="19.2" font-style="italic" fill="#1f7a4d">a structured model layer binds the islands</text>
  <text x="720" y="90" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">linked models, each its own concern — not one master</text>

  <!-- the model LAYER: a band of several linked models (a stratum, not one apex point) -->
  <rect id="model-layer" x="545" y="100" width="350" height="98" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="3"/>
  <text x="720" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#2f5169">structured model layer</text>
  <!-- three linked model chips inside the band -->
  <g fill="#ffffff" stroke="#2f5169" stroke-width="1.6">
    <rect x="560" y="142" width="96" height="34" rx="5"/>
    <rect x="672" y="142" width="96" height="34" rx="5"/>
    <rect x="784" y="142" width="96" height="34" rx="5"/>
  </g>
  <g font-size="19.2" fill="#1c1917" text-anchor="middle">
    <text x="608" y="164">intent</text>
    <text x="720" y="164">structure</text>
    <text x="832" y="164">behavior</text>
  </g>
  <!-- links: the models are a connected layer, not isolated boxes -->
  <g stroke="#2f5169" stroke-width="1.6">
    <line x1="656" y1="159" x2="672" y2="159"/>
    <line x1="768" y1="159" x2="784" y2="159"/>
  </g>

  <!-- the three bound below -->
  <g stroke="#2f5169" stroke-width="2" fill="#ffffff">
    <rect id="docs" x="565" y="330" width="130" height="60" rx="8"/>
    <rect id="code" x="745" y="330" width="130" height="60" rx="8"/>
    <rect id="tests" x="655" y="440" width="130" height="60" rx="8"/>
  </g>
  <g font-size="21" fill="#1c1917" text-anchor="middle">
    <text x="630" y="367">docs</text>
    <text x="810" y="367">code</text>
    <text x="720" y="477">tests</text>
  </g>

  <!-- binding edges from the LAYER (varied origins along the band, not one point) to each island -->
  <g stroke="#2f5169" stroke-width="2.5" fill="none">
    <!-- edge: model-layer -> docs -->
    <line x1="612" y1="198" x2="630" y2="326" marker-end="url(#dhArrow)"/>
    <!-- edge: model-layer -> code -->
    <line x1="828" y1="198" x2="810" y2="326" marker-end="url(#dhArrow)"/>
    <!-- edge: model-layer -> tests -->
    <line x1="720" y1="198" x2="720" y2="436" marker-end="url(#dhArrow)"/>
  </g>

  <!-- green check on each binding: the drift check that keeps them in sync -->
  <g>
    <circle cx="614" cy="264" r="15" fill="#1f7a4d"/>
    <path d="M607,264 L612,270 L622,258" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="826" cy="264" r="15" fill="#1f7a4d"/>
    <path d="M819,264 L824,270 L834,258" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="737" cy="312" r="15" fill="#1f7a4d"/>
    <path d="M730,312 L735,318 L745,306" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="720" y="533" text-anchor="middle" font-size="19.2" font-style="italic" fill="#1f7a4d">checked: the layer must match the territory</text>
</svg>
