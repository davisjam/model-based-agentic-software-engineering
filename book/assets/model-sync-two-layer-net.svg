<?xml version="1.0" encoding="UTF-8"?>
<!-- 2.8 coverage figure (part2-v8-260814 re-author; folds to book/assets/model-sync-two-layer-net.svg).
     REVISION per v8 editor guidance (2.8-5): SIMPLIFIED drastically. Two surfaces only. The MODELED
     SURFACE splits by decidability — decidable claims get a mechanical check; semantic claims need
     judgment. The UNMODELED SURFACE has no model-based coverage. One small optional arrow notes that a
     recurring miss should refine the representation or control. The governance-conversion apparatus
     (missing-model metric, failures->controls loop, "net" metaphor, multiple escapes) is REMOVED — it
     belongs to Part III. Grammar: green #155c38/#e3f0e7 = decidable -> mechanical check; blue
     #2f5169/#e7edf3 = semantic -> judgment; rust #9a3f12/#faf1e6 = unmodeled, no coverage. Hand-authored
     (two stacked surfaces). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"
     role="img" aria-labelledby="msTitle msDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="msTitle">Coverage of model correspondence: modeled surface and unmodeled surface</title>
  <desc id="msDesc">Two surfaces. The modeled surface splits into decidable claims, which get a mechanical
    check, and semantic claims, which need judgment. The unmodeled surface has no model-based coverage. A
    small arrow notes that a recurring miss should refine the representation or a control.</desc>

  <defs>
    <marker id="cv-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Coverage of model correspondence</text>

  <!-- ===== MODELED SURFACE ===== -->
  <rect id="modeled" x="120" y="66" width="660" height="170" rx="12" fill="#faf9f6" stroke="#57534e" stroke-width="2.4"/>
  <text x="150" y="96" font-size="18" font-weight="700" letter-spacing="1" fill="#1c1917">MODELED SURFACE</text>

  <!-- decidable -> mechanical check (green) -->
  <rect x="145" y="112" width="610" height="46" rx="9" fill="#e3f0e7" stroke="#155c38" stroke-width="2.2"/>
  <text x="170" y="141" font-size="18" font-weight="700" fill="#155c38">decidable claims</text>
  <text x="750" y="141" text-anchor="end" font-size="18" font-weight="700" fill="#155c38">&#8594;&#160; mechanical check</text>

  <!-- semantic -> judgment (blue) -->
  <rect x="145" y="170" width="610" height="46" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="170" y="199" font-size="18" font-weight="700" fill="#2f5169">semantic claims</text>
  <text x="750" y="199" text-anchor="end" font-size="18" font-weight="700" fill="#2f5169">&#8594;&#160; judgment</text>

  <!-- refine loop arrow drawn UNDER the unmodeled surface: its tail runs into that surface (the opaque fill
       caps it) and its head seats on the modeled surface's lower rim -->
  <!-- edge: unmodeled .. modeled -->
  <path d="M450,266 L450,238" fill="none" stroke="#9a3f12" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#cv-r)"/>

  <!-- ===== UNMODELED SURFACE ===== -->
  <rect id="unmodeled" x="120" y="266" width="660" height="70" rx="12" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.2" stroke-dasharray="8 5"/>
  <text x="150" y="296" font-size="18" font-weight="700" letter-spacing="1" fill="#9a3f12">UNMODELED SURFACE</text>
  <text x="150" y="320" font-size="18" font-style="italic" fill="#57534e">no model-based coverage</text>

  <!-- small optional refine note in the gap between the two surfaces -->
  <text x="430" y="255" text-anchor="middle" font-size="18" font-style="italic" fill="#9a3f12">recurring miss &#8594; refine representation / control</text>

  <!-- footer: protect the point -->
  <text x="450" y="374" text-anchor="middle" font-size="18" font-style="italic" fill="#1c1917">Mechanical checks reach only what the representation makes decidable;</text>
  <text x="450" y="396" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">semantic claims need judgment, and unmodeled properties have no coverage.</text>
</svg>
