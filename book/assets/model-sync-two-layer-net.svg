<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 226" width="440" height="226" role="img" aria-labelledby="msTitle msDesc" font-family="'Source Sans 3', sans-serif">
<title id="msTitle">Dynamic coverage of model correspondence</title>
<desc id="msDesc">The modeled surface contains two regions: decidable claims checked mechanically, exemplified by no two owners for the same job, and semantic claims requiring judgment, exemplified by a meaningful result. Outside the modeled surface, unmodeled properties have no model-based coverage. An arrow from outside to the outer modeled boundary represents a newly consequential property; the opposing arrow removes an unnecessary distinction. Both changes apply to the modeled surface as a whole.</desc>
<defs><marker id="ms-arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/></marker></defs>
<rect x="2" y="2" width="240" height="222" rx="3" fill="#f6f4ef" stroke="#1c1917" stroke-width=".6"/>
<rect x="310" y="2" width="128" height="222" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".6" stroke-dasharray="4 3"/>
<text x="122" y="26" text-anchor="middle" font-size="11" fill="#1c1917" font-weight="700">Modeled surface</text>
<text x="374" y="18" text-anchor="middle" font-size="11" fill="#1c1917" font-weight="700">Outside the</text>
<text x="374" y="31" text-anchor="middle" font-size="11" fill="#1c1917" font-weight="700">modeled surface</text>
<rect x="10" y="46" width="110" height="168" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".6"/>
<text x="65.0" y="65" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">Decidable claims</text>
<text x="65.0" y="82" text-anchor="middle" font-size="10" fill="#1c1917">mechanical</text>
<text x="65.0" y="94" text-anchor="middle" font-size="10" fill="#1c1917">checks</text>
<path d="M18,108 L112,108" fill="none" stroke="#1c1917" stroke-width=".4"/>
<text x="65.0" y="126" text-anchor="middle" font-size="10" fill="#1c1917">Expressed in model</text>
<text x="65.0" y="140" text-anchor="middle" font-size="10" fill="#1c1917">Checked automatically</text>
<text x="65.0" y="164" text-anchor="middle" font-size="10" fill="#1c1917" font-style="italic">Example:</text>
<text x="65.0" y="180" text-anchor="middle" font-size="10" fill="#1c1917">No two owners</text>
<text x="65.0" y="192" text-anchor="middle" font-size="10" fill="#1c1917">for the same job</text>
<rect x="128" y="46" width="106" height="168" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".6"/>
<text x="181.0" y="65" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">Semantic claims</text>
<text x="181.0" y="82" text-anchor="middle" font-size="10" fill="#1c1917">judgment</text>
<text x="181.0" y="94" text-anchor="middle" font-size="10" fill="#1c1917">required</text>
<path d="M136,108 L226,108" fill="none" stroke="#1c1917" stroke-width=".4"/>
<text x="181.0" y="126" text-anchor="middle" font-size="10" fill="#1c1917">Expressed in model</text>
<text x="181.0" y="140" text-anchor="middle" font-size="10" fill="#1c1917">Judgment required</text>
<text x="181.0" y="164" text-anchor="middle" font-size="10" fill="#1c1917" font-style="italic">Example:</text>
<text x="181.0" y="180" text-anchor="middle" font-size="10" fill="#1c1917">A meaningful result</text>
<rect x="318" y="46" width="112" height="168" rx="3" fill="#ffffff" stroke="#1c1917" stroke-width=".6"/>
<text x="374.0" y="65" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">Unmodeled properties</text>
<text x="374.0" y="82" text-anchor="middle" font-size="10" fill="#1c1917">no model-based</text>
<text x="374.0" y="94" text-anchor="middle" font-size="10" fill="#1c1917">coverage</text>
<path d="M326,108 L422,108" fill="none" stroke="#1c1917" stroke-width=".4"/>
<text x="374.0" y="126" text-anchor="middle" font-size="10" fill="#1c1917">Not represented</text>
<text x="374.0" y="164" text-anchor="middle" font-size="10" fill="#1c1917" font-style="italic">Example:</text>
<text x="374.0" y="180" text-anchor="middle" font-size="10" fill="#1c1917">A failure mode</text>
<text x="374.0" y="192" text-anchor="middle" font-size="10" fill="#1c1917">outside the model</text>
<path d="M242,92 L310,92" fill="none" stroke="#1c1917" stroke-width=".8" marker-end="url(#ms-arrow)"/>
<path d="M310,145 L242,145" fill="none" stroke="#1c1917" stroke-width=".8" marker-end="url(#ms-arrow)"/>
<text x="276" y="49" text-anchor="middle" font-size="10" fill="#1c1917" font-style="italic">remove an</text>
<text x="276" y="61" text-anchor="middle" font-size="10" fill="#1c1917" font-style="italic">unnecessary</text>
<text x="276" y="73" text-anchor="middle" font-size="10" fill="#1c1917" font-style="italic">distinction</text>
<text x="276" y="166" text-anchor="middle" font-size="10" fill="#1c1917" font-style="italic">represent a</text>
<text x="276" y="178" text-anchor="middle" font-size="10" fill="#1c1917" font-style="italic">newly</text>
<text x="276" y="190" text-anchor="middle" font-size="10" fill="#1c1917" font-style="italic">consequential</text>
<text x="276" y="202" text-anchor="middle" font-size="10" fill="#1c1917" font-style="italic">property</text>
</svg>
