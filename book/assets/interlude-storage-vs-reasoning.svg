<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: interlude-storage-vs-reasoning). Chunked residency versus skeletonized
     residency. (a) Page chunking bounds how much document state and media a worker holds at once, but each
     chunk still carries its media in the worker. (b) Skeletonization keeps only structure and references
     resident; individual media objects stream from external storage to the consumer on demand. Colour is
     used only to distinguish structural state (green) from media (rust), consistently across both panels.
     viewBox 920 for the figure font band. -->
<!-- semantic-families: modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440"
     role="group" aria-labelledby="srTitle srDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="srTitle">Chunked residency versus skeletonized residency</title>
  <desc id="srDesc">Two panels. (a) Chunked, format-native representation: an OOXML document is split into
    page chunks, and each of several workers holds its chunk's structural state together with the media for
    that chunk, so media remains part of the worker's resident representation. (b) Skeletonized
    representation: the OOXML document becomes a structural skeleton plus media references held by the
    worker, while media stays in an external store and individual media objects stream to the GenAI service
    on demand. Total media size no longer determines persistent worker memory.</desc>

  <defs>
    <marker id="sr-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="sr-ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78716c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="440" fill="#fdfcf9"/>
  <line x1="460" y1="42" x2="460" y2="420" stroke="#e7e2d6" stroke-width="1.5"/>

  <!-- legend -->
  <rect x="30" y="404" width="16" height="16" rx="3" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.4"/>
  <text x="52" y="417" font-size="14" fill="#44403c">structure</text>
  <rect x="150" y="404" width="16" height="16" rx="3" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.4"/>
  <text x="172" y="417" font-size="14" fill="#44403c">media</text>

  <!-- ===== Panel (a): chunked, format-native ===== -->
  <text x="30" y="30" font-size="18.4" font-weight="700" fill="#57534e">(a) Chunked, format-native</text>

  <rect x="150" y="46" width="170" height="42" rx="8" fill="#f6f4ef" stroke="#1c1917" stroke-width="2.2"/>
  <text x="235" y="72" text-anchor="middle" font-size="16" fill="#1c1917">OOXML document</text>
  <line x1="235" y1="88" x2="235" y2="104" stroke="#1c1917" stroke-width="2"/>
  <line x1="105" y1="104" x2="365" y2="104" stroke="#1c1917" stroke-width="1.8"/>

  <!-- three page-chunk workers, each holding structure + media -->
  <g font-size="13.5" fill="#1c1917" text-anchor="middle">
    <rect x="44" y="116" width="122" height="72" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2"/>
    <text x="105" y="134" font-size="12.5" fill="#57534e">worker · pages 1–10</text>
    <rect x="54" y="142" width="46" height="36" rx="5" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.4"/><text x="77" y="164" font-size="12">struct</text>
    <rect x="108" y="142" width="48" height="36" rx="5" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.4"/><text x="132" y="164" font-size="12">media</text>

    <rect x="174" y="116" width="122" height="72" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2"/>
    <text x="235" y="134" font-size="12.5" fill="#57534e">worker · pages 11–20</text>
    <rect x="184" y="142" width="46" height="36" rx="5" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.4"/><text x="207" y="164" font-size="12">struct</text>
    <rect x="238" y="142" width="48" height="36" rx="5" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.4"/><text x="262" y="164" font-size="12">media</text>

    <rect x="304" y="116" width="122" height="72" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2"/>
    <text x="365" y="134" font-size="12.5" fill="#57534e">worker · pages 21–30</text>
    <rect x="314" y="142" width="46" height="36" rx="5" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.4"/><text x="337" y="164" font-size="12">struct</text>
    <rect x="368" y="142" width="48" height="36" rx="5" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.4"/><text x="392" y="164" font-size="12">media</text>
  </g>
  <line x1="105" y1="104" x2="105" y2="116" stroke="#1c1917" stroke-width="1.8" marker-end="url(#sr-ah)"/>
  <line x1="235" y1="104" x2="235" y2="116" stroke="#1c1917" stroke-width="1.8" marker-end="url(#sr-ah)"/>
  <line x1="365" y1="104" x2="365" y2="116" stroke="#1c1917" stroke-width="1.8" marker-end="url(#sr-ah)"/>
  <text x="235" y="214" text-anchor="middle" font-size="14.5" font-style="italic" fill="#9a3f12">each chunk still carries its media in the worker</text>

  <!-- ===== Panel (b): skeletonized ===== -->
  <text x="490" y="30" font-size="18.4" font-weight="700" fill="#57534e">(b) Skeletonized</text>

  <rect x="596" y="46" width="170" height="42" rx="8" fill="#f6f4ef" stroke="#1c1917" stroke-width="2.2"/>
  <text x="681" y="72" text-anchor="middle" font-size="16" fill="#1c1917">OOXML document</text>
  <line x1="681" y1="88" x2="681" y2="116" stroke="#1c1917" stroke-width="2" marker-end="url(#sr-ah)"/>

  <rect x="560" y="116" width="242" height="66" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2"/>
  <text x="681" y="134" font-size="12.5" fill="#57534e" text-anchor="middle">worker</text>
  <rect x="574" y="142" width="110" height="30" rx="5" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.4"/><text x="629" y="162" font-size="12.5" fill="#1c1917" text-anchor="middle">structural skeleton</text>
  <rect x="692" y="142" width="96" height="30" rx="5" fill="#f6f4ef" stroke="#57534e" stroke-width="1.4"/><text x="740" y="162" font-size="12.5" fill="#1c1917" text-anchor="middle">media refs</text>

  <!-- external media store -->
  <rect x="820" y="116" width="76" height="66" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="858" y="146" text-anchor="middle" font-size="12.5" fill="#1c1917">external</text>
  <text x="858" y="163" text-anchor="middle" font-size="12.5" fill="#1c1917">media</text>
  <polyline points="788,157 820,157" fill="none" stroke="#78716c" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#sr-ah-muted)"/>

  <!-- stream on demand to GenAI -->
  <line x1="858" y1="182" x2="858" y2="250" stroke="#78716c" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#sr-ah-muted)"/>
  <text x="872" y="214" font-size="13" font-style="italic" fill="#78716c">stream</text>
  <text x="872" y="230" font-size="13" font-style="italic" fill="#78716c">on demand</text>
  <rect x="560" y="250" width="200" height="46" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="660" y="278" text-anchor="middle" font-size="16" fill="#1c1917">GenAI service</text>
  <polyline points="820,273 760,273" fill="none" stroke="#78716c" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#sr-ah-muted)"/>

  <text x="681" y="330" text-anchor="middle" font-size="14.5" font-style="italic" fill="#78716c">media bypasses persistent worker residency</text>
</svg>
