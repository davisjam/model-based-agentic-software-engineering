<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: interlude-storage-vs-reasoning). Chunked residency versus skeletonized
     residency. (a) Page chunking bounds how much document state and media a worker holds at once, but each
     chunk still carries its media in the worker. (b) Skeletonization keeps only structure and references
     resident; individual media objects stream from external storage to the consumer on demand. Colour is
     used only to distinguish structural state (green) from media (rust), consistently across both panels.
     viewBox 920 for the figure font band. -->
<!-- semantic-families: modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" role="group" aria-labelledby="srTitle srDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="srTitle">Chunked residency versus skeletonized residency</title>
  <desc id="srDesc">Two panels. (a) Chunked, format-native representation: an OOXML document is split into
    page chunks, and each of several workers holds its chunk's structural state together with the media for
    that chunk, so media remains part of the worker's resident representation. (b) Skeletonized
    representation: the OOXML document becomes a structural skeleton plus media references held by the
    worker, while media stays in an external store and individual media objects stream to the GenAI service
    on demand. Total media size no longer determines persistent worker memory.</desc>
<!-- Print refinement: retain the source geometry semantics and text; reflow labels at 450 bp publication width. -->
<defs>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/></marker>
<marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/></marker>
</defs>
