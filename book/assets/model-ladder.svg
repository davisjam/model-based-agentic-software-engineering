<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: model-ladder). THE ONE canonical Representation Capability Ladder — 8 rungs,
     drawn as a vertical column with a SINGLE representational gradient (pale green at the bottom -> deeper
     governed green at the top = a richer representation). This is a REPRESENTATION-ONLY ladder: it orders
     representational capabilities and says nothing about authority. There is no "stronger control" axis, no
     "the turn", and no Modeling-vs-Alignment lobe split — those were retired because Modeling and Alignment
     are orthogonal, not two ends of one ladder. Bottom to top: context selection -> externalized knowledge
     -> structured relationships -> system semantics -> explicit properties (invariants) -> model-derived
     analysis -> traceability -> mechanically maintained correspondence. Two upward-widening side
     annotations name what grows as you climb: a larger reasoning reach, and more properties available to
     analysis and governance. Docker sits BESIDE a low rung as the counterexample — strong local authority,
     low on this ladder — which proves authority is a separate axis. Palette: Umber Monograph tokens
     (modeling green #1f7a4d stroke + #155c38 rung numbers + a pale->deep green fill ramp; governance rust
     #9a3f12 + tint #faf1e6 only on the off-ladder Docker counterexample; ink #1c1917 names; muted #57534e
     descriptions + captions; paper #fdfcf9). Fonts in the 12-26 band at the 1000px reference. -->
<!-- semantic-families: modeling, governance, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720"
     role="group" aria-labelledby="mlTitle mlDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mlTitle">The representation capability ladder: eight representational capabilities from context selection to mechanically maintained correspondence</title>
  <desc id="mlDesc">One vertical ladder of eight rungs with a single representational gradient — pale green
    at the bottom deepening to governed green at the top, meaning a richer representation, not a stronger
    control. From the bottom up: rung one, Context selection — choose the task-relevant slice of knowledge
    for this reasoning episode. Rung two, Externalized knowledge — put durable knowledge outside memory:
    catalogs, skills, registries. Rung three, Structured relationships — typed entities and edges,
    dependencies, ownership, lineage, that tools traverse. Rung four, System semantics — add behavioral,
    process, and scenario meaning: the system's intended shape. Rung five, Explicit properties (invariants)
    — state invariants and obligations over the model. Rung six, Model-derived analysis — query, target,
    generate, predict, and verify from the model. Rung seven, Traceability — join model elements
    bidirectionally to the implementation, and back. Rung eight, Mechanically maintained correspondence —
    the environment refuses to let model and territory silently diverge. The ladder is purely
    representational: climbing it does not make an organization more mature, and it carries no authority
    axis. Two upward-widening annotations on the right name what a richer representation buys — a larger
    reasoning reach, and more properties available to analysis and governance. Authority is a separate axis:
    Docker sits beside a low rung as a counterexample, with strong local authority yet low representational
    capability. Higher rungs make more engineering questions tractable; they do not imply every system
    should climb every rung.</desc>

  <defs>
    <!-- single representational gradient: pale (bottom) -> deep governed green (top) -->
    <linearGradient id="mlReach" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#eef7f1"/>
      <stop offset="1" stop-color="#1f7a4d"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#fdfcf9"/>
  <text x="500" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">The representation capability ladder</text>
  <text x="500" y="68" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">Representational capabilities, ordered — not a maturity model.</text>

  <!-- left strip: the single representational gradient, pale (bottom) -> deep (top) -->
  <rect x="120" y="84" width="14" height="570" rx="7" fill="url(#mlReach)" stroke="#e4e0d8" stroke-width="1"/>
  <text x="127" y="76" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a4d">&#9650;</text>

  <!-- ===================== THE EIGHT RUNGS (bottom = rung 1) ===================== -->

  <!-- rung 8 — Mechanically maintained correspondence (top, deepest fill) -->
  <rect x="150" y="84" width="540" height="66" rx="8" fill="#9ccdb0" stroke="#1f7a4d" stroke-width="2.8"/>
  <text x="176" y="122" font-size="20" font-weight="700" fill="#155c38">8</text>
  <text x="206" y="106" font-size="20" font-weight="700" fill="#1c1917">Mechanically maintained correspondence</text>
  <text x="206" y="134" font-size="20" fill="#3f4d44">mechanically detect divergence</text>

  <!-- rung 7 — Traceability -->
  <rect x="150" y="156" width="540" height="66" rx="8" fill="#abd5bb" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="176" y="194" font-size="20" font-weight="700" fill="#155c38">7</text>
  <text x="206" y="178" font-size="20" font-weight="700" fill="#1c1917">Traceability</text>
  <text x="206" y="198" font-size="20" fill="#3f4d44">Join model elements bidirectionally</text>
  <text x="206" y="216" font-size="20" fill="#3f4d44">to the implementation, and back.</text>

  <!-- rung 6 — Model-derived analysis -->
  <rect x="150" y="228" width="540" height="66" rx="8" fill="#b9dcc6" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="176" y="266" font-size="20" font-weight="700" fill="#155c38">6</text>
  <text x="206" y="250" font-size="20" font-weight="700" fill="#1c1917">Model-derived analysis</text>
  <text x="206" y="270" font-size="20" fill="#3f4d44">Query, target, generate, predict,</text>
  <text x="206" y="288" font-size="20" fill="#3f4d44">and verify from the model.</text>

  <!-- rung 5 — Explicit properties (invariants) -->
  <rect x="150" y="300" width="540" height="66" rx="8" fill="#c6e2d0" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="176" y="338" font-size="20" font-weight="700" fill="#155c38">5</text>
  <text x="206" y="322" font-size="20" font-weight="700" fill="#1c1917">Explicit properties (invariants)</text>
  <text x="206" y="342" font-size="20" fill="#57534e">State invariants and obligations</text>
  <text x="206" y="360" font-size="20" fill="#57534e">over the model.</text>

  <!-- rung 4 — System semantics -->
  <rect x="150" y="372" width="540" height="66" rx="8" fill="#d2e8da" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="176" y="410" font-size="20" font-weight="700" fill="#155c38">4</text>
  <text x="206" y="394" font-size="20" font-weight="700" fill="#1c1917">System semantics</text>
  <text x="206" y="414" font-size="20" fill="#57534e">Add behavioral, process, and scenario</text>
  <text x="206" y="432" font-size="20" fill="#57534e">meaning — the system's intended shape.</text>

  <!-- rung 3 — Structured relationships -->
  <rect x="150" y="444" width="540" height="66" rx="8" fill="#ddeee2" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="176" y="482" font-size="20" font-weight="700" fill="#155c38">3</text>
  <text x="206" y="466" font-size="20" font-weight="700" fill="#1c1917">Structured relationships</text>
  <text x="206" y="486" font-size="20" fill="#57534e">Typed entities and edges — deps,</text>
  <text x="206" y="504" font-size="20" fill="#57534e">ownership, lineage — tools traverse it.</text>

  <!-- rung 2 — Externalized knowledge -->
  <rect x="150" y="516" width="540" height="66" rx="8" fill="#e6f2ea" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="176" y="554" font-size="20" font-weight="700" fill="#155c38">2</text>
  <text x="206" y="538" font-size="20" font-weight="700" fill="#1c1917">Externalized knowledge</text>
  <text x="206" y="558" font-size="20" fill="#57534e">Put durable knowledge outside memory —</text>
  <text x="206" y="576" font-size="20" fill="#57534e">catalogs, skills, registries.</text>

  <!-- rung 1 — Context selection (bottom, palest fill) -->
  <rect x="150" y="588" width="540" height="66" rx="8" fill="#eef7f1" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="176" y="626" font-size="20" font-weight="700" fill="#155c38">1</text>
  <text x="206" y="610" font-size="20" font-weight="700" fill="#1c1917">Context selection</text>
  <text x="206" y="630" font-size="20" fill="#57534e">Choose the task-relevant slice of</text>
  <text x="206" y="648" font-size="20" fill="#57534e">knowledge for this reasoning episode.</text>

  <!-- ===================== UPWARD-WIDENING SIDE ANNOTATIONS ===================== -->
  <!-- a wedge that widens toward the top; the two labels name what a richer representation buys -->
  <polygon points="726,530 708,94 744,94" fill="url(#mlReach)" stroke="#1f7a4d" stroke-width="1.4"/>
  <text x="726" y="84" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a4d">&#9650;</text>
  <text x="758" y="118" font-size="18" font-weight="700" fill="#1f7a4d">Larger reasoning reach</text>
  <text x="758" y="146" font-size="18" fill="#1f7a4d">More properties available</text>
  <text x="758" y="166" font-size="18" fill="#1f7a4d">to analysis and governance</text>

  <!-- ===================== DOCKER — the off-ladder counterexample (beside a LOW rung) ===================== -->
  <line x1="700" y1="605" x2="690" y2="615" stroke="#9a3f12" stroke-width="1.4" stroke-dasharray="3 3"/>
  <rect x="700" y="558" width="298" height="78" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="720" y="584" font-size="20" font-weight="700" fill="#9a3f12">Docker</text>
  <text x="802" y="584" font-size="20" font-style="italic" fill="#9a3f12">a counterexample</text>
  <text x="720" y="608" font-size="20" fill="#57534e">strong local authority,</text>
  <text x="720" y="628" font-size="20" fill="#57534e">low on this ladder</text>

  <!-- captions: the gradient's meaning (replaces the removed banners) + the maturity-model guard -->
  <text x="500" y="676" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">The single gradient is representational reach — pale to deep is a richer representation, not a stronger control.</text>
  <text x="500" y="700" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">Higher rungs make more engineering questions tractable — they do not imply every system should climb every rung.</text>
</svg>
