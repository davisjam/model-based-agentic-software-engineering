<?xml version="1.0" encoding="UTF-8"?>
<!-- Compact teaching geometry; print width is declared by stable figure label in book/data/figure-print-layout.json. Text remains at 9–10 pt in the PDF. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-labelledby="figure-title figure-description" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="figure-title">Negative and positive constraints: a negative constraint removes a forbidden action; a positive constraint requires specified evidence-producing behavior</title>
<desc id="figure-description">Two columns. On the left, a negative constraint: ordinary code must not call a raw library, so the edge
    between them is forbidden. On the right, a positive constraint: a mutation verb must call a stamping action that
    produces attribution evidence. Both are checked at source time; both restrict the admissible implementation space,
    from opposite directions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a3f12"/></marker></defs>
<text x="150" y="27" text-anchor="middle" font-size="20" fill="#9a3f12" font-weight="700">NEGATIVE CONSTRAINT</text>
<rect x="45" y="47" width="210" height="43" rx="7" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
<text x="150" y="75" text-anchor="middle" font-size="20" fill="#1c1917" font-weight="700">ordinary code</text>
<line x1="150" y1="90" x2="150" y2="164" stroke="#9a3f12" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="178" y="132" text-anchor="start" font-size="20" fill="#9a3f12">must not call</text>
<line x1="138" y1="116" x2="162" y2="138" stroke="#9a3f12" stroke-width="2.2"/>
<line x1="162" y1="116" x2="138" y2="138" stroke="#9a3f12" stroke-width="2.2"/>
<rect x="45" y="166" width="210" height="60" rx="7" fill="#f6f4ef" stroke="#57534e" stroke-width="2" stroke-dasharray="7 5"/>
<text x="150" y="202" text-anchor="middle" font-size="20" fill="#57534e" font-weight="700">raw library</text>
<text x="450" y="27" text-anchor="middle" font-size="20" fill="#9a3f12" font-weight="700">POSITIVE CONSTRAINT</text>
<rect x="345" y="47" width="210" height="43" rx="7" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
<text x="450" y="75" text-anchor="middle" font-size="20" fill="#1c1917" font-weight="700">mutation verb</text>
<line x1="450" y1="90" x2="450" y2="164" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="478" y="132" text-anchor="start" font-size="20" fill="#9a3f12">must call</text>
<rect x="345" y="166" width="210" height="60" rx="7" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="450" y="191" text-anchor="middle" font-size="20" fill="#9a3f12" font-weight="700">MUST stamp</text>
<text x="450" y="216" text-anchor="middle" font-size="20" fill="#9a3f12">attribution evidence</text>
</svg>
