<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix E composition figure (sg-wave4-260813). GEE-centered: three partner skills act on one
     governed environment from three directions. Hand-authored house SVG (not Mermaid) — a composed
     narrative picture, not a flowchart. Colour LANGUAGE (figure_semantics): governance rust = self-governance
     (#9a3f12), modeling green = the GEE / environment (#1f7a4d), agent blue = self-operate (#2f5169),
     neutral gray = self-communicate + the evidence return (#57534e). All hexes from the SVG palette
     allow-list; geometry follows figure_styles. Fold target: book/assets/figure-composition.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660"
     role="img" aria-labelledby="scTitle scDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="scTitle">Three partner skills acting on one governed engineering environment</title>
  <desc id="scDesc">A central box, the governed engineering environment (GEE), is acted on from three
    directions. Above it, self-governance engineers and improves the environment: an arrow points down into
    the GEE, labelled "improves — mints models and mechanisms." Below it, self-operate runs the
    environment's operational lifecycles: an arrow points up into the GEE, labelled "operates — runs the
    lifecycles." A dashed return arrow curves up the right side from self-operate back to self-governance,
    labelled "evidence — returns deficiencies," so that reality exposing a weakness re-enters the
    engineering loop. To the left, self-communicate supplies the craft for every representation the other
    two produce: a short arrow points into the GEE, labelled "documents." The three skills are orthogonal —
    each owns one reason to change — but not isolated: they meet through explicit interfaces on the one
    environment they share.</desc>

  <defs>
    <marker id="scArrowRust" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8.5" refY="5"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/>
    </marker>
    <marker id="scArrowBlue" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8.5" refY="5"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
    <marker id="scArrowGray" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8.5" refY="5"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
  </defs>

  <!-- ============ self-governance (governance rust) — engineers/improves the environment ============ -->
  <rect id="self-governance" x="350" y="44" width="300" height="90" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="500" y="88" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">Self-Governance</text>
  <text x="500" y="114" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">engineers &amp; improves the environment</text>

  <!-- ============ GEE (modeling green) — the one environment all three act on ============ -->
  <rect id="gee" x="338" y="286" width="324" height="110" rx="16" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="500" y="328" text-anchor="middle" font-size="26" font-weight="700" fill="#1f7a4d">GEE</text>
  <text x="500" y="354" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">the governed engineering environment</text>
  <text x="500" y="376" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">the one thing all three skills act on</text>

  <!-- ============ self-operate (agent blue) — runs the operational lifecycles ============ -->
  <rect id="self-operate" x="350" y="548" width="300" height="90" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="500" y="592" text-anchor="middle" font-size="20" font-weight="700" fill="#2f5169">Self-Operate</text>
  <text x="500" y="618" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">runs the operational lifecycles</text>

  <!-- ============ self-communicate (neutral) — supplies the craft ============ -->
  <rect id="self-communicate" x="44" y="298" width="244" height="88" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="166" y="338" text-anchor="middle" font-size="18" font-weight="700" fill="#57534e">Self-Communicate</text>
  <text x="166" y="362" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">the craft for representations</text>

  <!-- ================= edges ================= -->

  <!-- SG → GEE : improves (down) -->
  <!-- edge: self-governance -> gee -->
  <line x1="500" y1="134" x2="500" y2="282" stroke="#9a3f12" stroke-width="2" marker-end="url(#scArrowRust)"/>
  <text x="516" y="196" text-anchor="start" font-size="15" font-weight="700" fill="#9a3f12">improves</text>
  <text x="516" y="215" text-anchor="start" font-size="12.5" fill="#57534e">mints models &amp; mechanisms</text>

  <!-- SO → GEE : operates (up) -->
  <!-- edge: self-operate -> gee -->
  <line x1="500" y1="548" x2="500" y2="400" stroke="#2f5169" stroke-width="2" marker-end="url(#scArrowBlue)"/>
  <text x="516" y="468" text-anchor="start" font-size="15" font-weight="700" fill="#2f5169">operates</text>
  <text x="516" y="487" text-anchor="start" font-size="12.5" fill="#57534e">runs the lifecycles</text>

  <!-- SO → SG : evidence return (dashed, up the right side) -->
  <!-- edge: self-operate .. self-governance -->
  <path d="M650,592 C840,560 878,470 878,340 C878,210 700,90 652,90"
        fill="none" stroke="#57534e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#scArrowGray)"/>
  <text x="792" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#57534e">evidence</text>
  <text x="792" y="351" text-anchor="middle" font-size="12.5" fill="#57534e">returns deficiencies</text>

  <!-- SC → GEE : documents (right) -->
  <!-- edge: self-communicate -> gee -->
  <line x1="288" y1="342" x2="336" y2="342" stroke="#57534e" stroke-width="2" marker-end="url(#scArrowGray)"/>
  <text x="312" y="332" text-anchor="middle" font-size="12" fill="#57534e">documents</text>
</svg>
