<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix E composition figure. GEE-centered: three COMPLEMENTARY partner skills act AROUND one governed
     engineering environment, with intentionally DIFFERENT relationships to it (not a symmetric three-input
     taxonomy). Read order is designed in TWO passes. FIRST pass — the principal closed loop: Self-Governance
     IMPROVES the GEE (rust, down), the GEE hosts Self-Operate which OPERATES WITHIN it (blue, down), and
     operation returns EVIDENCE that reveals deficiencies back to Self-Governance (thin dashed gray return on
     the right, deliberately secondary — a wire, not a dominating arc). SECOND pass — Self-Communicate on the
     left has TWO edges: it CONTRIBUTES CANONICAL DOCUMENTATION inward to the GEE (some explanatory artifacts
     become durable parts of the environment) AND ARTICULATES THE SYSTEM outward to people. Colour LANGUAGE
     (figure_semantics): governance rust = self-governance (#9a3f12), modeling green = the GEE / environment
     (#1f7a4d), agent blue = self-operate (#2f5169), neutral gray = self-communicate + the evidence return +
     the audience (#57534e). All hexes from the SVG palette allow-list; geometry follows figure_styles.
     Fold target: book/assets/figure-composition.svg. -->
<!-- semantic-families: governance, modeling, agent, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660"
     role="img" aria-labelledby="scTitle scDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="scTitle">Three complementary skills acting around one governed engineering environment</title>
  <desc id="scDesc">A central box, the governed engineering environment (GEE), sits at the centre. The
    principal loop reads first: above it, self-governance improves the environment, an arrow points down into
    the GEE labelled "improves"; the GEE then hosts self-operate below it, an arrow points down into
    self-operate labelled "operates within"; and a thin dashed return arrow runs up the right side from
    self-operate back to self-governance, labelled "evidence — reveals deficiencies," closing the loop so
    that operation exposing a weakness re-enters governance. On the left, self-communicate has two edges: an
    inward arrow into the GEE labelled "contributes canonical documentation," because some explanatory
    artifacts become durable parts of the environment, and an outward arrow down to a people node labelled
    "articulates the system," its broader function of making the system intelligible to others. The three
    skills are complementary and their relationships to the environment differ by design.</desc>

  <defs>
    <marker id="scArrowRust" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8.5" refY="5"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/>
    </marker>
    <marker id="scArrowBlue" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8.5" refY="5"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
    <marker id="scArrowGray" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8.5" refY="5"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#fdfcf9"/>

  <!-- ============ self-governance (governance rust) — engineers/improves the environment ============ -->
  <rect id="self-governance" x="430" y="48" width="340" height="84" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="600" y="86" text-anchor="middle" font-size="22" font-weight="700" fill="#9a3f12">Self-Governance</text>
  <text x="600" y="113" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">engineers &amp; improves the environment</text>

  <!-- ============ GEE (modeling green) — the one central environment ============ -->
  <rect id="gee" x="430" y="270" width="340" height="120" rx="16" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="3.2"/>
  <text x="600" y="316" text-anchor="middle" font-size="22" font-weight="700" fill="#1f7a4d">Governed Engineering</text>
  <text x="600" y="344" text-anchor="middle" font-size="22" font-weight="700" fill="#1f7a4d">Environment</text>
  <text x="600" y="370" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">the GEE</text>

  <!-- ============ self-operate (agent blue) — runs operational lifecycles within the GEE ============ -->
  <rect id="self-operate" x="430" y="532" width="340" height="84" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="600" y="570" text-anchor="middle" font-size="22" font-weight="700" fill="#2f5169">Self-Operate</text>
  <text x="600" y="597" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">runs operational lifecycles</text>

  <!-- ============ self-communicate (neutral) — articulates the system; two edges ============ -->
  <rect id="self-communicate" x="40" y="300" width="224" height="100" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="152" y="334" text-anchor="middle" font-size="20" font-weight="700" fill="#57534e">Self-Communicate</text>
  <text x="152" y="360" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">articulates the system</text>
  <text x="152" y="382" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">to others</text>

  <!-- ============ people / audience (neutral, external — dashed border) ============ -->
  <rect id="people" x="40" y="470" width="224" height="72" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="1.8" stroke-dasharray="4 5"/>
  <text x="152" y="504" text-anchor="middle" font-size="20" font-weight="700" fill="#57534e">People</text>
  <text x="152" y="526" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">engineers &amp; readers</text>

  <!-- ================= PRIMARY LOOP edges (read first) ================= -->

  <!-- SG -> GEE : improves (down, rust, bold) -->
  <!-- edge: self-governance -> gee -->
  <line x1="600" y1="132" x2="600" y2="268" stroke="#9a3f12" stroke-width="2.6" marker-end="url(#scArrowRust)"/>
  <text x="616" y="206" text-anchor="start" font-size="20" font-weight="700" fill="#9a3f12">improves</text>

  <!-- GEE -> SO : operates within (down, blue, bold) -->
  <!-- edge: gee -> self-operate -->
  <line x1="600" y1="390" x2="600" y2="530" stroke="#2f5169" stroke-width="2.6" marker-end="url(#scArrowBlue)"/>
  <text x="616" y="466" text-anchor="start" font-size="18" font-weight="700" fill="#2f5169">operates within</text>

  <!-- SO -> SG : evidence return (thin dashed gray, secondary; closes the loop up the right side) -->
  <!-- edge: self-operate .. self-governance -->
  <path d="M770 574 H826 V90 H772" fill="none" stroke="#57534e" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#scArrowGray)"/>
  <text x="834" y="320" text-anchor="start" font-size="16" font-weight="700" fill="#57534e">evidence</text>
  <text x="834" y="340" text-anchor="start" font-size="16" fill="#57534e">reveals deficiencies</text>

  <!-- ================= SECONDARY: self-communicate's two edges ================= -->

  <!-- SC -> GEE : contributes canonical documentation (inward) -->
  <!-- edge: self-communicate -> gee -->
  <line x1="264" y1="362" x2="428" y2="362" stroke="#57534e" stroke-width="2.4" marker-end="url(#scArrowGray)"/>
  <text x="347" y="308" text-anchor="middle" font-size="16" fill="#57534e">contributes</text>
  <text x="347" y="326" text-anchor="middle" font-size="16" fill="#57534e">canonical</text>
  <text x="347" y="344" text-anchor="middle" font-size="16" fill="#57534e">documentation</text>

  <!-- SC -> People : articulates the system (outward) -->
  <!-- edge: self-communicate -> people -->
  <line x1="152" y1="400" x2="152" y2="470" stroke="#57534e" stroke-width="2.2" marker-end="url(#scArrowGray)"/>
  <text x="172" y="440" text-anchor="start" font-size="16" fill="#57534e">articulates the system</text>
</svg>
