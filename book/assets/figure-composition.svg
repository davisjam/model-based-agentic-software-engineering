<!-- Hand-authored appendix figure: print-readable geometry. Original title/desc, semantic content and native monochrome partner preserved. -->
<!-- Appendix E composition figure. GEE-centered: three COMPLEMENTARY partner skills act AROUND one governed
     engineering environment, with intentionally DIFFERENT relationships to it (not a symmetric three-input
     taxonomy). Read order is designed in TWO passes. FIRST pass — the principal closed loop: Self-Governance
     IMPROVES the GEE (rust, down), the GEE hosts Self-Operate which OPERATES WITHIN it (blue, down), and
     operation returns EVIDENCE that reveals deficiencies back to Self-Governance (thin dashed gray return on
     the right, deliberately secondary — a wire, not a dominating arc). SECOND pass — Self-Communicate on the
     left has TWO edges: it CONTRIBUTES CANONICAL DOCUMENTATION inward to the GEE (some explanatory artifacts
     become durable parts of the environment) AND ARTICULATES THE SYSTEM outward to people. Colour LANGUAGE
     (figure_semantics): governance rust = self-governance (#9a3f12), modeling green = the GEE / environment
     (#1f7a4d), agent blue = self-operate (#2f5169), neutral gray = self-communicate + the evidence return +
     the audience (#57534e). All hexes from the SVG palette allow-list; geometry follows figure_styles.
     Fold target: book/assets/figure-composition.svg. -->
<!-- semantic-families: governance, modeling, agent, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-labelledby="scTitle scDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="scTitle">Three complementary skills acting around one governed engineering environment</title>
<desc id="scDesc">A central box, the governed engineering environment (GEE), sits at the centre. The
    principal loop reads first: above it, self-governance improves the environment, an arrow points down into
    the GEE labelled "improves"; the GEE then hosts self-operate below it, an arrow points down into
    self-operate labelled "operates within"; and a thin dashed return arrow runs up the right side from
    self-operate back to self-governance, labelled "evidence — reveals deficiencies," closing the loop so
    that operation exposing a weakness re-enters governance. On the left, self-communicate has two edges: an
    inward arrow into the GEE labelled "contributes canonical documentation," because some explanatory
    artifacts become durable parts of the environment, and an outward arrow down to a people node labelled
    "articulates the system," its broader function of making the system intelligible to others. The three
    skills are complementary and their relationships to the environment differ by design.</desc>
<defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c1917"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57534e"/></marker><marker id="rust-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a3f12"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f5169"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f7a4d"/></marker></defs>
<rect id="self-governance" x="448" y="18" width="360" height="84" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="628" y="50" text-anchor="middle" font-size="24" fill="#9a3f12" font-weight="700">Self-Governance</text>
<text x="628" y="78" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">engineers &amp; improves the environment</text>
<rect id="gee" x="448" y="218" width="360" height="116" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
<text x="628" y="254" text-anchor="middle" font-size="24" fill="#1f7a4d" font-weight="700">Governed Engineering</text>
<text x="628" y="282" text-anchor="middle" font-size="24" fill="#1f7a4d" font-weight="700">Environment</text>
<text x="628" y="311" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">the GEE</text>
<rect id="self-operate" x="448" y="447" width="360" height="84" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="628" y="480" text-anchor="middle" font-size="24" fill="#2f5169" font-weight="700">Self-Operate</text>
<text x="628" y="510" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">runs operational lifecycles</text>
<rect id="self-communicate" x="18" y="244" width="252" height="106" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
<text x="144" y="276" text-anchor="middle" font-size="23" fill="#57534e" font-weight="700">Self-Communicate</text>
<text x="144" y="305" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">articulates the system</text>
<text x="144" y="330" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">to others</text>
<rect id="people" x="18" y="433" width="252" height="73" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2" stroke-dasharray="7 5"/>
<text x="144" y="463" text-anchor="middle" font-size="23" fill="#57534e" font-weight="700">People</text>
<text x="144" y="491" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">engineers &amp; readers</text>
<path d="M628 102 L628 216" fill="none" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#rust-arrow)"/>
<text x="646" y="163" text-anchor="start" font-size="22" fill="#9a3f12" font-weight="700">improves</text>
<path d="M628 334 L628 445" fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#blue-arrow)"/>
<text x="646" y="396" text-anchor="start" font-size="20" fill="#2f5169" font-weight="700">operates within</text>
<path d="M808 489 H847 V60 H810" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#muted-arrow)" stroke-dasharray="6 4"/>
<text x="862" y="255" text-anchor="start" font-size="20" fill="#57534e" font-weight="700">evidence</text>
<text x="862" y="280" text-anchor="start" font-size="20" fill="#57534e">reveals</text>
<text x="862" y="305" text-anchor="start" font-size="20" fill="#57534e">deficiencies</text>
<path d="M270 311 L446 311" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#muted-arrow)"/>
<text x="358" y="235" text-anchor="middle" font-size="20" fill="#57534e">contributes</text>
<text x="358" y="260" text-anchor="middle" font-size="20" fill="#57534e">canonical</text>
<text x="358" y="285" text-anchor="middle" font-size="20" fill="#57534e">documentation</text>
<path d="M144 350 L144 431" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#muted-arrow)"/>
<text x="163" y="384" text-anchor="start" font-size="20" fill="#57534e">articulates</text>
<text x="163" y="409" text-anchor="start" font-size="20" fill="#57534e">the system</text>
</svg>
