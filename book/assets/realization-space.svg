<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 337.5 247" width="337.5" height="247" role="img" aria-labelledby="rsTitle rsDesc" font-family="&quot;Source Sans 3&quot;, sans-serif"><ns0:title xmlns:ns0="http://www.w3.org/2000/svg" id="rsTitle">Tolerance bounds acceptable implementations while leaving choices open</ns0:title>
  <ns0:desc xmlns:ns0="http://www.w3.org/2000/svg" id="rsDesc">Possible software implementations for sorting lists of up to 1,000 names.
    The left region contains implementations that return names in alphabetical order;
    the right contains implementations that respond within 200 milliseconds.
    The overlap contains implementations satisfying both requirements. Dots represent
    distinct possible implementations, not measured algorithms. The timing bound sets
    a tolerance; choices among acceptable implementations remain degrees of freedom.</ns0:desc>
  <defs><marker id="a2f5169" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#2f5169"/></marker><marker id="a57534e" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#57534e"/></marker><marker id="a086438" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#086438"/></marker><marker id="a1c1917" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#1c1917"/></marker></defs>
