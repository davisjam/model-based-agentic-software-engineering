<?xml version="1.0" encoding="UTF-8"?>
<!-- semantic-families: governance, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700"
     role="img" aria-labelledby="rsTitle rsDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="rsTitle">Tolerance bounds acceptable implementations while leaving choices open</title>
  <desc id="rsDesc">Possible software implementations for sorting lists of up to 1,000 names.
    The left region contains implementations that return names in alphabetical order;
    the right contains implementations that respond within 200 milliseconds.
    The overlap contains implementations satisfying both requirements. Dots represent
    distinct possible implementations, not measured algorithms. The timing bound sets
    a tolerance; choices among acceptable implementations remain degrees of freedom.</desc>
  <rect width="1000" height="700" fill="#fdfcf9"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#57534e">POSSIBLE SOFTWARE IMPLEMENTATIONS</text>
  <text x="500" y="66" text-anchor="middle" font-size="20" fill="#57534e">Lists of up to 1,000 names</text>
  <rect x="40" y="90" width="920" height="510" rx="12" fill="none" stroke="#e4e0d8" stroke-width="1.5"/>
  <ellipse cx="400" cy="355" rx="270" ry="220" fill="#9a3f12" fill-opacity="0.10" stroke="#9a3f12" stroke-width="2.5"/>
  <ellipse cx="600" cy="355" rx="270" ry="220" fill="#9a3f12" fill-opacity="0.10" stroke="#9a3f12" stroke-width="2.5"/>
  <g text-anchor="middle" font-size="22" fill="#9a3f12">
    <text x="220" y="292" font-weight="700">Alphabetical</text>
    <text x="220" y="320" font-weight="700">ordering</text>
    <text x="780" y="292" font-weight="700">Response time</text>
    <text x="780" y="320">≤ 200 ms</text>
    <text x="780" y="350" font-size="20">Tolerance</text>
  </g>
  <g text-anchor="middle" fill="#1c1917">
    <text x="500" y="230" font-size="22" font-weight="700">ACCEPTABLE</text>
    <text x="500" y="258" font-size="22" font-weight="700">IMPLEMENTATIONS</text>
    <text x="500" y="290" font-size="20">Satisfy both</text>
  </g>
  <g fill="#1c1917">
    <circle cx="455" cy="340" r="5"/><circle cx="535" cy="345" r="5"/>
    <circle cx="570" cy="325" r="5"/><circle cx="485" cy="375" r="5"/>
    <circle cx="565" cy="380" r="5"/><circle cx="440" cy="410" r="5"/>
    <circle cx="520" cy="415" r="5"/><circle cx="485" cy="445" r="5"/>
    <circle cx="555" cy="460" r="5"/><circle cx="450" cy="485" r="5"/>
    <circle cx="530" cy="490" r="5"/><circle cx="490" cy="510" r="5"/>
    <circle cx="220" cy="390" r="5"/><circle cx="265" cy="430" r="5"/>
    <circle cx="230" cy="470" r="5"/><circle cx="760" cy="390" r="5"/>
    <circle cx="790" cy="430" r="5"/><circle cx="745" cy="465" r="5"/>
    <circle cx="130" cy="150" r="5"/><circle cx="880" cy="545" r="5"/>
    <circle cx="52" cy="628" r="5"/>
  </g>
  <text x="68" y="635" font-size="20" fill="#57534e">A distinct possible implementation</text>
  <text x="500" y="678" text-anchor="middle" font-size="20" fill="#1c1917">Degrees of freedom: choices among acceptable implementations</text>
</svg>
