<text x="190.79" y="185.33" font-size="11" text-anchor="middle" font-weight="700">Realized performance</text>
<text x="190.79" y="195.62" font-size="9" text-anchor="middle" font-style="italic">durable throughput, defect escape,</text>
<text x="190.79" y="206.12" font-size="9" text-anchor="middle" font-style="italic">human attention</text>
<path d="M190.01,208.1 L190.01,225.26" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
<text x="196.87" y="217.78" font-size="9" text-anchor="start" font-style="italic">provides evidence</text>
<rect x="2.81" y="225.26" width="363.48" height="68.95" rx="6" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.8"/>
<text x="184.39" y="238.06" font-size="11.5" text-anchor="middle" font-weight="700">Experience and adaptation</text>
<rect x="7.48" y="244.92" width="114.82" height="40.56" rx="0.12" fill="white" stroke="#1c1917" stroke-width="0.9"/>
<text x="64.9" y="256.15" font-size="11" text-anchor="middle" font-weight="700">Observed problems</text>
<text x="64.9" y="267.07" font-size="9" text-anchor="middle" font-style="italic">churn, recurring failures,</text>
<text x="64.9" y="277.57" font-size="9" text-anchor="middle" font-style="italic">interventions, control friction</text>
<rect x="134.47" y="244.92" width="102.34" height="40.56" rx="0.12" fill="white" stroke="#1c1917" stroke-width="0.9"/>
<text x="185.64" y="254.9" font-size="11" text-anchor="middle" font-weight="700">Diagnosis</text>
<text x="185.64" y="263.64" font-size="9" text-anchor="middle" font-style="italic">local defect?</text>
<text x="185.64" y="274.14" font-size="9" text-anchor="middle" font-style="italic">structural gap?</text>
<text x="185.64" y="284.64" font-size="9" text-anchor="middle" font-style="italic">inadequate enforcement?</text>
<rect x="245.1" y="244.92" width="123.19" height="40.56" rx="0.12" fill="white" stroke="#1c1917" stroke-width="0.9"/>
<text x="306.7" y="256.15" font-size="11" text-anchor="middle" font-weight="700">Governance adaptation</text>
<text x="306.7" y="267.38" font-size="9" text-anchor="middle" font-style="italic">convert, reconcile,</text>
<text x="306.7" y="277.88" font-size="9" text-anchor="middle" font-style="italic">retire</text>
<path d="M122.30,264.58 L134.47,264.58" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
<path d="M236.81,264.58 L245.1,264.58" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
