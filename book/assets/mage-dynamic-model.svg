<svg xmlns="http://www.w3.org/2000/svg" width="888" height="596" viewBox="0 0 444 298" role="img" aria-labelledby="title desc" font-family="Source Sans 3, sans-serif">
<title id="title">The MAGE Dynamic Model</title>
<desc id="desc">Prior knowledge seeds the governed engineering environment. Work orders, agentic capacity and the environment shape attempted work and its outcomes. Observed problems can lead to diagnosis and adaptation. Corrective feedback revises the inherited environment, which may enable larger tasks and greater concurrency.</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#1c1917"/></marker></defs>
<g fill="#1c1917" font-family="Source Sans 3, sans-serif">
