<text x="194.84" y="15.6" font-size="11" text-anchor="middle" font-weight="700">Prior engineering knowledge</text>
<text x="194.84" y="26.21" font-size="9" text-anchor="middle" font-style="italic">standards, requirements, existing assets, prior lessons</text>
<path d="M190.01,33.38 L190.01,51.48" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
<text x="198.74" y="43.37" font-size="9" text-anchor="start" font-style="italic">seeds</text>
<rect x="68.33" y="51.48" width="247.73" height="32.76" rx="0.12" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.9"/>
<text x="192.19" y="64.9" font-size="11" text-anchor="middle" font-weight="700">Governed engineering environment 𝒢</text>
<text x="192.19" y="76.13" font-size="9" text-anchor="middle" font-style="italic">representation · coverage · coherence · economy</text>
<path d="M190.01,84.24 L190.01,117.94" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
<text x="197.81" y="95.47" font-size="10.5" text-anchor="start" font-weight="700" font-style="italic">Expanding task frontier</text>
<text x="197.81" y="105.77" font-size="9" text-anchor="start" font-style="italic">may enable larger tasks and greater concurrency</text>
<rect x="3.12" y="117.94" width="87.98" height="41.18" rx="0.12" fill="white" stroke="#1c1917" stroke-width="0.9"/>
<text x="47.11" y="129.79" font-size="11" text-anchor="middle" font-weight="700">Work orders</text>
<text x="47.11" y="141.96" font-size="9" text-anchor="middle" font-style="italic">task, intent,</text>
<text x="47.11" y="152.46" font-size="9" text-anchor="middle" font-style="italic">acceptance criteria</text>
<rect x="136.34" y="117.94" width="104.21" height="39.94" rx="0.12" fill="white" stroke="#1c1917" stroke-width="0.9"/>
<text x="188.45" y="130.1" font-size="11" text-anchor="middle" font-weight="700">Attempted work</text>
<text x="188.45" y="142.27" font-size="9" text-anchor="middle" font-style="italic">changes undertaken,</text>
<text x="188.45" y="152.77" font-size="9" text-anchor="middle" font-style="italic">task frontier</text>
<rect x="283.3" y="117.94" width="91.42" height="43.06" rx="0.12" fill="white" stroke="#1c1917" stroke-width="0.9"/>
<text x="329.0" y="128.23" font-size="11" text-anchor="middle" font-weight="700">Agentic capacity</text>
<text x="329.0" y="137.28" font-size="9" text-anchor="middle" font-style="italic">model capability,</text>
<text x="329.0" y="147.78" font-size="9" text-anchor="middle" font-style="italic">concurrency,</text>
<text x="329.0" y="158.28" font-size="9" text-anchor="middle" font-style="italic">implementation speed</text>
<path d="M91.1,140.71 L136.34,140.71" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
<text x="113.57" y="115.13" font-size="9" text-anchor="middle" font-style="italic">specify</text>
<text x="113.57" y="125.63" font-size="9" text-anchor="middle" font-style="italic">intended</text>
<text x="113.57" y="136.13" font-size="9" text-anchor="middle" font-style="italic">work</text>
<path d="M283.3,140.71 L240.55,140.71" fill="none" stroke="#1c1917" stroke-width="1.08" marker-end="url(#arrow)"/>
<text x="261.46" y="124.18" font-size="9" text-anchor="middle" font-style="italic">enables</text>
<text x="261.46" y="134.68" font-size="9" text-anchor="middle" font-style="italic">execution</text>
