<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: mage-dynamic-model). The MAGE Dynamic Model: one shared
     system of eight constructs, with four numbered, colour-coded dynamics overlaid.
     Read the cycle clockwise: agentic capacity exercises the governed environment E and
     drives agentic work; work plus E produce realized performance; the performance gap
     surfaces as governance pressure; pressure is diagnosed as local or structural; a
     structural diagnosis triggers governance adaptation; adaptation reshapes E; a stronger
     E amplifies capacity and reopens the loop. Prior engineering knowledge bootstraps E
     before any failure. The four dynamics: [1] bootstrap (blue, an input), [2] pressure/discovery (red),
     [3] governance-adaptation (green), [4] capability-amplification (purple). Colour is
     redundant: each loop carries a numbered badge, a name, and a legend row, so the figure
     reads in grayscale. Palette: fleet blue #2f5169, churn red #b23b3b, governed green
     #1f7a4d, inset purple #7c6bb0, ink #1c1917, paper #fdfcf9, panel #f6f4ef, rule #e4e0d8,
     muted #57534e — allow-list only. -->
<svg id="mageDM" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1200"
     role="img" aria-labelledby="mageDM-dmTitle mageDM-dmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mageDM-dmTitle">The MAGE Dynamic Model — one system, four dynamics</title>
  <desc id="mageDM-dmDesc">A single system diagram of eight constructs with four numbered dynamics
    overlaid, read as a clockwise cycle. Prior engineering knowledge — standards,
    requirements, brownfield assets, and prior lessons — sits at the top and feeds the
    governed environment E through item 1, the blue bootstrap input. Agentic capacity, on the
    left, exercises the governed environment E, the green hub on the right whose quality is
    representation quality, obligation coverage, coherence, and economy. Agentic capacity
    also drives agentic work; the environment E shapes realized performance; agentic work
    produces realized performance — durable throughput, defect escape, and human attention.
    A mismatch between work and environment, together with the realized-performance gap,
    surfaces as governance pressure: churn, recurring failure, escaped defect, repeated
    intervention, and control friction. Loop 2, the red pressure-or-discovery loop, carries
    governance pressure into structural diagnosis, which asks whether a failure is a local
    defect, a missing representation, weak authority, or a stale mechanism. Loop 3, the green
    governance-adaptation loop, carries a structural diagnosis into governance adaptation —
    represent, constrain, validate, strengthen, reconcile, retire — and its return arrow reshapes the
    environment E as a new, better E for the next round. Loop 4, the purple
    capability-amplification loop, runs from the improved environment back up to agentic
    capacity: a stronger environment enables bigger tasks and more concurrency, which reopens
    the whole cycle and exposes new pressure. The neutral black arrows are the shared system
    plumbing; the four coloured, numbered arrows are the dynamics the chapter walks. A
    legend at the bottom names all four dynamics. Loops 2 and 3 together form a balancing loop,
    marked B: churn drives diagnosis and adaptation, which reduce churn — a goal-seeking,
    self-damping cycle toward fit. Loop 4 is a reinforcing loop, marked R: a better environment
    raises ambition, which reopens the frontier — a self-amplifying cycle. Loop 1 is a bootstrap
    input, not a feedback loop. The model is directional and middle-range, not a fitted law.</desc>

  <style id="mageDM-loopstyle">
  /* master view: all four loops shown at full strength */
  #mageDM .loop { opacity: 1; }
  </style>

  <defs>
    <marker id="mageDM-dm-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="mageDM-dm-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
    <marker id="mageDM-dm-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/>
    </marker>
    <marker id="mageDM-dm-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
    <marker id="mageDM-dm-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c6bb0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="1200" fill="#fdfcf9"/>

  <!-- ============ visible title banner (swapped per crop variant) ============ -->
  <text id="mageDM-activebanner" x="150" y="70" text-anchor="middle" fill="#1c1917">
    <tspan x="150" y="70" font-size="18" font-weight="700">The MAGE</tspan>
    <tspan x="150" y="94" font-size="18" font-weight="700">Dynamic Model</tspan>
    <tspan x="150" y="120" font-size="14.08" font-style="italic" fill="#57534e">one system,</tspan>
    <tspan x="150" y="138" font-size="14.08" font-style="italic" fill="#57534e">four dynamics</tspan>
  </text>

  <!-- ============ [4] PURPLE capability-amplification loop (drawn first, behind boxes) ==== -->
  <g class="loop loop4">
    <!-- edge: governed-environment -> agentic-capacity -->
    <path d="M600,236 C500,182 200,218 200,248" fill="none" stroke="#7c6bb0" stroke-width="3"
          stroke-linecap="round" marker-end="url(#mageDM-dm-purple)"/>
    <circle cx="400" cy="176" r="16" fill="#fdfcf9" stroke="#7c6bb0" stroke-width="2.5"/>
    <text x="400" y="182" text-anchor="middle" font-size="18" font-weight="700" fill="#7c6bb0">4</text>
    <text x="400" y="208" text-anchor="middle" font-size="14.08" font-style="italic" font-weight="600" fill="#7c6bb0">Capability amplification</text>
    <text x="400" y="226" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">bigger tasks &#183; more concurrency</text>
  </g>

  <!-- ============ [3] GREEN governance-adaptation return (behind boxes) ============ -->
  <g class="loop loop3">
    <!-- edge: governance-adaptation -> governed-environment -->
    <path d="M670,972 L846,972 L846,338 L811,338" fill="none" stroke="#1f7a4d" stroke-width="2.6"
          stroke-linejoin="round" marker-end="url(#mageDM-dm-green)"/>
    <text x="862" y="655" text-anchor="middle" font-size="14.08" font-style="italic" fill="#1f7a4d"
          transform="rotate(-90 862 655)">adapts &#8594; a better E</text>
  </g>

  <!-- ============ NEUTRAL SPINE (shared system plumbing) ============ -->
  <g stroke="#1c1917" stroke-width="2" fill="none">
    <!-- edge: agentic-capacity -> governed-environment -->
    <path d="M305,298 L559,290" marker-end="url(#mageDM-dm-ink)"/>   <!-- capacity -> E -->
    <!-- edge: agentic-capacity -> agentic-work -->
    <path d="M180,365 L180,469" marker-end="url(#mageDM-dm-ink)"/>   <!-- capacity -> work -->
    <!-- edge: agentic-work -> realized-performance -->
    <path d="M305,525 L559,525" marker-end="url(#mageDM-dm-ink)"/>   <!-- work -> performance -->
    <!-- edge: governed-environment -> realized-performance -->
    <path d="M685,415 L685,469" marker-end="url(#mageDM-dm-ink)"/>   <!-- E -> performance -->
    <!-- edge: realized-performance -> governance-pressure -->
    <path d="M628,595 C587.8,619.1 513,634 513,664" marker-end="url(#mageDM-dm-ink)"/>   <!-- performance -> pressure -->
    <!-- edge: agentic-work -> governance-pressure -->
    <path d="M205,580 C245.6,609.4 321,634 321,664" marker-end="url(#mageDM-dm-ink)"/>   <!-- work -> pressure (mismatch) -->
  </g>
  <text x="430" y="283" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">exercises</text>
  <text x="702" y="448" text-anchor="start" font-size="14.08" font-style="italic" fill="#57534e">shapes</text>
  <text x="238" y="632" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">mismatch</text>

  <!-- ============ [1] BLUE bootstrap input (not a feedback loop) ============ -->
  <g class="loop loop1">
    <!-- edge: prior-knowledge -> governed-environment -->
    <path d="M518,135 C556,172 634,204 634,234" fill="none" stroke="#2f5169" stroke-width="3"
          stroke-linecap="round" marker-end="url(#mageDM-dm-blue)"/>
    <circle cx="585" cy="182" r="16" fill="#fdfcf9" stroke="#2f5169" stroke-width="2.5"/>
    <text x="585" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">1</text>
    <text x="560" y="214" text-anchor="middle" font-size="14.08" font-style="italic" font-weight="600" fill="#2f5169">Bootstrap (input)</text>
  </g>

  <!-- ============ [2] RED churn / discovery loop ============ -->
  <g class="loop loop2">
    <!-- edge: governance-pressure -> structural-diagnosis -->
    <path d="M410,765 L410,804" fill="none" stroke="#b23b3b" stroke-width="3" marker-end="url(#mageDM-dm-red)"/>
    <circle cx="452" cy="784" r="15" fill="#fdfcf9" stroke="#b23b3b" stroke-width="2.5"/>
    <text x="452" y="790" text-anchor="middle" font-size="17" font-weight="700" fill="#b23b3b">2</text>
    <text x="486" y="789" text-anchor="start" font-size="14.08" font-style="italic" font-weight="600" fill="#b23b3b">Pressure / discovery</text>
  </g>

  <!-- ============ [3] GREEN governance-adaptation edge ============ -->
  <g class="loop loop3">
    <!-- edge: structural-diagnosis -> governance-adaptation -->
    <path d="M410,885 L410,924" fill="none" stroke="#1f7a4d" stroke-width="3" marker-end="url(#mageDM-dm-green)"/>
    <circle cx="452" cy="904" r="15" fill="#fdfcf9" stroke="#1f7a4d" stroke-width="2.5"/>
    <text x="452" y="910" text-anchor="middle" font-size="17" font-weight="700" fill="#1f7a4d">3</text>
    <text x="486" y="909" text-anchor="start" font-size="14.08" font-style="italic" font-weight="600" fill="#1f7a4d">Governance adaptation</text>
  </g>

  <!-- ============ BOXES (shared system) ============ -->
  <!-- Prior engineering knowledge (bootstrap input) -->
  <rect id="prior-knowledge" x="270" y="40" width="320" height="95" rx="9" fill="#f6f4ef" stroke="#2f5169" stroke-width="2.2"/>
  <text x="430" y="76" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Prior engineering knowledge</text>
  <text x="430" y="102" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">standards &#183; requirements</text>
  <text x="430" y="121" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">brownfield assets &#183; prior lessons</text>

  <!-- Agentic capacity -->
  <rect id="agentic-capacity" x="55" y="250" width="250" height="115" rx="9" fill="#fdfcf9" stroke="#2f5169" stroke-width="2.2"/>
  <text x="180" y="292" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Agentic capacity</text>
  <text x="180" y="318" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">model capability</text>
  <text x="180" y="337" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">concurrency &#183; raw velocity</text>

  <!-- Governed environment E (the hub) -->
  <rect id="governed-environment" x="560" y="235" width="250" height="180" rx="9" fill="#f6f4ef" stroke="#1f7a4d" stroke-width="3.2"/>
  <text x="685" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Governed</text>
  <text x="685" y="304" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">environment</text>
  <text x="685" y="330" text-anchor="middle" font-size="21" font-weight="700" fill="#1f7a4d">E</text>
  <text x="685" y="356" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">representation quality</text>
  <text x="685" y="374" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">obligation coverage</text>
  <text x="685" y="392" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">coherence &#183; economy</text>

  <!-- Agentic work -->
  <rect id="agentic-work" x="55" y="470" width="250" height="110" rx="9" fill="#fdfcf9" stroke="#2f5169" stroke-width="2.2"/>
  <text x="180" y="512" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Agentic work</text>
  <text x="180" y="538" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">attempted change</text>
  <text x="180" y="557" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">task frontier</text>

  <!-- Realized performance -->
  <rect id="realized-performance" x="560" y="470" width="250" height="125" rx="9" fill="#fdfcf9" stroke="#57534e" stroke-width="2.2"/>
  <text x="685" y="508" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Realized performance</text>
  <text x="685" y="534" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">durable throughput</text>
  <text x="685" y="553" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">defect escape</text>
  <text x="685" y="572" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">human attention</text>

  <!-- Governance pressure -->
  <rect id="governance-pressure" x="150" y="665" width="520" height="100" rx="9" fill="#fdfcf9" stroke="#b23b3b" stroke-width="2.4"/>
  <text x="410" y="700" text-anchor="middle" font-size="20" font-weight="700" fill="#b23b3b">Governance pressure</text>
  <text x="410" y="726" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">churn &#183; recurring failure &#183; escaped defect</text>
  <text x="410" y="745" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">repeated intervention &#183; control friction</text>

  <!-- Structural diagnosis -->
  <rect id="structural-diagnosis" x="150" y="805" width="520" height="80" rx="9" fill="#fdfcf9" stroke="#57534e" stroke-width="2.2"/>
  <text x="410" y="840" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Structural diagnosis</text>
  <text x="410" y="866" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">local defect &#183; missing representation &#183; weak authority &#183; stale mechanism?</text>

  <!-- Governance adaptation -->
  <rect id="governance-adaptation" x="150" y="925" width="520" height="95" rx="9" fill="#fdfcf9" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="410" y="962" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a4d">Governance adaptation</text>
  <text x="410" y="990" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">represent &#183; constrain &#183; validate &#183; strengthen &#183; reconcile &#183; retire</text>
  <text x="410" y="1010" text-anchor="middle" font-size="14.08" font-style="italic" fill="#57534e">changes the shape of future work</text>

  <!-- ============ R / B loop-typing badges (system-dynamics convention; full-strength in every crop) ==== -->
  <!-- R — loop [4] is REINFORCING (better E -> more ambition -> new frontier) -->
  <rect x="421" y="167" width="19" height="19" rx="3.5" fill="#fdfcf9" stroke="#7c6bb0" stroke-width="2.2"/>
  <text x="430.5" y="181" text-anchor="middle" font-size="14.08" font-weight="700" fill="#7c6bb0">R</text>
  <!-- B — loops [2]+[3] together are a BALANCING loop (churn -> diagnosis -> adaptation -> less churn) -->
  <rect x="837" y="470" width="19" height="19" rx="3.5" fill="#fdfcf9" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="846.5" y="484" text-anchor="middle" font-size="14.08" font-weight="700" fill="#1f7a4d">B</text>

  <!-- ============ LEGEND: the four dynamics (grayscale key — numbers carry meaning) ============ -->
  <rect x="40" y="1048" width="800" height="140" rx="8" fill="#f6f4ef" stroke="#e4e0d8" stroke-width="1.5"/>

  <circle cx="70" cy="1078" r="14" fill="#fdfcf9" stroke="#2f5169" stroke-width="2.4"/>
  <text x="70" y="1084" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">1</text>
  <text x="92" y="1076" text-anchor="start" font-size="14.08" font-weight="700" fill="#1c1917">Bootstrap (input)</text>
  <text x="92" y="1096" text-anchor="start" font-size="14.08" fill="#57534e">prior knowledge</text>
  <text x="92" y="1113" text-anchor="start" font-size="14.08" fill="#57534e">seeds the environment</text>

  <circle cx="270" cy="1078" r="14" fill="#fdfcf9" stroke="#b23b3b" stroke-width="2.4"/>
  <text x="270" y="1084" text-anchor="middle" font-size="16" font-weight="700" fill="#b23b3b">2</text>
  <text x="292" y="1076" text-anchor="start" font-size="14.08" font-weight="700" fill="#1c1917">Pressure / discovery loop</text>
  <text x="292" y="1096" text-anchor="start" font-size="14.08" fill="#57534e">pressure reveals</text>
  <text x="292" y="1113" text-anchor="start" font-size="14.08" fill="#57534e">missing structure</text>

  <circle cx="470" cy="1078" r="14" fill="#fdfcf9" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="470" y="1084" text-anchor="middle" font-size="16" font-weight="700" fill="#1f7a4d">3</text>
  <text x="492" y="1076" text-anchor="start" font-size="14.08" font-weight="700" fill="#1c1917">Governance-adaptation</text>
  <text x="492" y="1096" text-anchor="start" font-size="14.08" fill="#57534e">diagnosis reshapes</text>
  <text x="492" y="1113" text-anchor="start" font-size="14.08" fill="#57534e">the environment</text>

  <circle cx="670" cy="1078" r="14" fill="#fdfcf9" stroke="#7c6bb0" stroke-width="2.4"/>
  <text x="670" y="1084" text-anchor="middle" font-size="16" font-weight="700" fill="#7c6bb0">4</text>
  <text x="692" y="1076" text-anchor="start" font-size="14.08" font-weight="700" fill="#1c1917">Capability-amplification</text>
  <text x="692" y="1096" text-anchor="start" font-size="14.08" fill="#57534e">a stronger environment</text>
  <text x="692" y="1113" text-anchor="start" font-size="14.08" fill="#57534e">enlarges ambition</text>

  <!-- R / B loop-typing note (system-dynamics convention) -->
  <line x1="56" y1="1132" x2="824" y2="1132" stroke="#e4e0d8" stroke-width="1"/>
  <rect x="56" y="1146" width="17" height="17" rx="3" fill="#fdfcf9" stroke="#1f7a4d" stroke-width="2"/>
  <text x="64.5" y="1159" text-anchor="middle" font-size="14.08" font-weight="700" fill="#1f7a4d">B</text>
  <text x="80" y="1159" text-anchor="start" font-size="14.08" fill="#1c1917"><tspan font-weight="700">balancing</tspan> — loops [2]+[3] seek fit, damping churn (goal-seeking).</text>
  <rect x="480" y="1146" width="17" height="17" rx="3" fill="#fdfcf9" stroke="#7c6bb0" stroke-width="2"/>
  <text x="488.5" y="1159" text-anchor="middle" font-size="14.08" font-weight="700" fill="#7c6bb0">R</text>
  <text x="504" y="1159" text-anchor="start" font-size="14.08" fill="#1c1917"><tspan font-weight="700">reinforcing</tspan> — loop [4] reopens the frontier.</text>
  <text x="56" y="1179" text-anchor="start" font-size="14.08" font-style="italic" fill="#57534e">Loop [1] bootstrap is an input, not a feedback loop.</text>
</svg>
