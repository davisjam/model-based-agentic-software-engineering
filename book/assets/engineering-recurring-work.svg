<?xml version="1.0" encoding="UTF-8"?>
<!-- Part IV figure 4.1-2 — engineering-recurring-work.svg. Recurring work is engineered by an
     environment that BOTH supports probabilistic reasoning (green) AND gives selected obligations
     authority (rust). The same models/knowledge/skills/tools/evidence can feed either side. The DASHED
     arrow (support -> authority) is the recurring MAGE move "give authority where feasible". The return
     edge runs from REALIZED WORK back to RECURRING ENGINEERING WORK: its lower portion observes outcomes
     and failures; its upper portion improves the environment — the governance conversion of Section 3.4,
     where recurring judgment can be encoded economically. (An earlier draft carried a separate PRESERVE
     WHAT PAYS node; the durable structure is the RESULT of improving the environment, so that node is
     dropped and the return edge names the process instead, cross-referencing Figure 3.4-1's taxonomy.)
     Palette: green #1f7a4d / #e3f0e7 (support), rust #9a3f12 / #faf1e6 (authority), blue #2f5169 / #e7edf3
     (governed environment), muted #57534e, ink #1c1917. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 575" width="1040" height="575"
     role="img" aria-labelledby="erwTitle erwDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="erwTitle">Engineering recurring work: a governed environment both supports reasoning and gives selected obligations authority, and the cycle iterates</title>
  <desc id="erwDesc">Recurring engineering work exposes a judgment and is handled by engineering the environment. The
    environment supports the reasoner — models, knowledge, examples, procedures, context, skills, tools, evidence — and
    gives selected obligations authority — constraints, validators, permissions, gates, checks. A dashed arrow from
    support to authority marks the recurring move of giving authority where feasible. The governed engineering
    environment then hosts realization, authoritative mechanisms act on selected obligations, and work is realized. A
    return edge runs from realized work back to recurring engineering work: its lower portion observes outcomes and
    failures, and its upper portion improves the environment — the governance conversion of Section 3.4, where recurring
    judgment can be encoded economically.</desc>

  <defs>
    <marker id="erw-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
    <marker id="erw-ah-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- 1. recurring engineering work -->
  <rect x="298" y="18" width="344" height="46" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="470" y="47" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">RECURRING ENGINEERING WORK</text>

  <line x1="470" y1="64" x2="470" y2="98" stroke="#57534e" stroke-width="2.2" marker-end="url(#erw-ah)"/>
  <text x="484" y="86" font-size="15" font-style="italic" fill="#57534e">expose the judgment</text>

  <!-- 3. engineer the environment (hub) -->
  <rect x="298" y="100" width="344" height="46" rx="9" fill="#f6f4ef" stroke="#1c1917" stroke-width="2.4"/>
  <text x="470" y="129" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">ENGINEER THE ENVIRONMENT</text>

  <!-- fork -->
  <g stroke="#57534e" stroke-width="2" fill="none">
    <line x1="470" y1="146" x2="470" y2="168"/>
    <line x1="220" y1="168" x2="720" y2="168"/>
    <line x1="220" y1="168" x2="220" y2="192"/>
    <line x1="720" y1="168" x2="720" y2="192"/>
  </g>

  <!-- 4a. support the reasoner (green) -->
  <rect x="56" y="194" width="328" height="132" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="220" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#1f7a4d">SUPPORT THE REASONER</text>
  <g font-size="15.5" fill="#1c1917" text-anchor="middle">
    <text x="220" y="252">models · knowledge · examples</text>
    <text x="220" y="278">procedures · context · skills</text>
    <text x="220" y="304">tools · evidence</text>
  </g>

  <!-- 4b. give obligations authority (rust) -->
  <rect x="556" y="194" width="328" height="132" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="720" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f12">GIVE OBLIGATIONS AUTHORITY</text>
  <g font-size="15.5" fill="#1c1917" text-anchor="middle">
    <text x="720" y="252">constraints · validators</text>
    <text x="720" y="278">permissions · gates</text>
    <text x="720" y="304">checks</text>
  </g>

  <!-- dashed cross move: give authority where feasible -->
  <text x="470" y="248" text-anchor="middle" font-size="14" font-style="italic" fill="#9a3f12">give authority</text>
  <text x="470" y="266" text-anchor="middle" font-size="14" font-style="italic" fill="#9a3f12">where feasible</text>
  <line x1="386" y1="284" x2="554" y2="284" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#erw-ah-rust)"/>

  <!-- converge -->
  <g stroke="#57534e" stroke-width="2" fill="none">
    <line x1="220" y1="326" x2="220" y2="350"/>
    <line x1="720" y1="326" x2="720" y2="350"/>
    <line x1="220" y1="350" x2="720" y2="350"/>
    <line x1="470" y1="350" x2="470" y2="374" marker-end="url(#erw-ah)"/>
  </g>

  <!-- 6. governed engineering environment (composed) -->
  <rect x="210" y="376" width="520" height="96" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="470" y="404" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">GOVERNED ENGINEERING ENVIRONMENT</text>
  <text x="470" y="430" text-anchor="middle" font-size="15" fill="#1c1917">reasoner attempts realization</text>
  <text x="470" y="454" text-anchor="middle" font-size="15" fill="#1c1917">authoritative mechanisms act on selected obligations</text>

  <line x1="470" y1="472" x2="470" y2="500" stroke="#57534e" stroke-width="2.2" marker-end="url(#erw-ah)"/>

  <!-- 7. realized work -->
  <rect x="360" y="502" width="220" height="46" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="470" y="531" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">REALIZED WORK</text>

  <!-- return edge: realized work -> (observe) -> up -> (improve / governance conversion) -> recurring work -->
  <path d="M580 525 H1010 V41 H642" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#erw-ah)"/>
  <text x="795" y="516" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">observe outcomes and failures</text>
  <text x="1000" y="414" text-anchor="end" font-size="15" font-style="italic" fill="#57534e">improve the environment;</text>
  <text x="1000" y="436" text-anchor="end" font-size="15" font-style="italic" fill="#57534e">governance conversion where warranted</text>
</svg>
