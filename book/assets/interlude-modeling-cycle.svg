<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: interlude-modeling-cycle). (a) The process is not the linear design → implement
     → document-with-models. (b) It can instead be a loop: a problem drives a model, whose analysis yields
     predictions and a design, which drive implementation and measurement, which refine the model. viewBox 920
     for the figure font band. -->
<!-- semantic-families: modeling, governance, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 392" width="920" height="392" role="group" aria-labelledby="mcTitle mcDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="mcTitle">Modeling as a loop, not a linear documentation step</title>
  <desc id="mcDesc">Two panels. (a) The process is not linear — design, then implement, then document with
    models. (b) It can be a loop: a problem drives a model; analyzing the model yields a prediction and a
    design; those drive implementation and then measurement; measurement refines the model, and the loop
    continues while the questions justify the cost.</desc>
<!-- Print refinement: retain the source geometry semantics and text; reflow labels at 450 bp publication width. -->
<defs>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/></marker>
<marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/></marker>
</defs>
<rect x="0" y="0" width="920" height="392" rx="0" fill="#fdfcf9" stroke="#fdfcf9" stroke-width="0"/>
<line x1="330" y1="44" x2="330" y2="372" stroke="#e7e2d6" stroke-width="1.5"/>
<text x="24" y="28" font-size="22" text-anchor="start" fill="#57534e" font-weight="700">(a) Models after</text>
<text x="24" y="52" font-size="22" text-anchor="start" fill="#57534e" font-weight="700">implementation</text>
<text x="360" y="30" font-size="23" text-anchor="start" fill="#57534e" font-weight="700">(b) A modeling loop</text>
<rect x="82" y="64" width="166" height="50" rx="7" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
<text x="165.0" y="95.93" font-size="21" text-anchor="middle" fill="#1c1917">design</text>
<rect x="82" y="154" width="166" height="50" rx="7" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
<text x="165.0" y="185.93" font-size="21" text-anchor="middle" fill="#1c1917">implement</text>
