<text x="165.0" y="273.93" font-size="21" text-anchor="middle" fill="#1c1917">document</text>
<text x="165.0" y="297.93" font-size="21" text-anchor="middle" fill="#1c1917">with models</text>
<line x1="165" y1="114" x2="165" y2="154" stroke="#57534e" stroke-width="2" marker-end="url(#arrow-muted)"/>
<line x1="165" y1="204" x2="165" y2="244" stroke="#57534e" stroke-width="2" marker-end="url(#arrow-muted)"/>
<rect x="400" y="56" width="150" height="50" rx="7" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
<text x="475.0" y="87.93" font-size="21" text-anchor="middle" fill="#1c1917">problem</text>
<rect x="400" y="146" width="150" height="50" rx="7" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
<text x="475.0" y="177.93" font-size="21" text-anchor="middle" fill="#1c1917">model</text>
<rect x="400" y="236" width="150" height="50" rx="7" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
<text x="475.0" y="267.93" font-size="21" text-anchor="middle" fill="#1c1917">analyze</text>
<rect x="650" y="146" width="230" height="50" rx="7" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
<text x="765.0" y="177.93" font-size="21" text-anchor="middle" fill="#1c1917">prediction / design</text>
