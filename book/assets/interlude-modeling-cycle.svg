<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: interlude-modeling-cycle). Modeling inside the implementation loop: a problem
     drives a model, whose analysis yields predictions and a design, which drive implementation and
     measurement, which refine the model. viewBox 920 for the figure font band. -->
<!-- semantic-families: modeling, governance, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" role="group" aria-labelledby="mcTitle mcDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="mcTitle">Modeling inside the implementation loop</title>
  <desc id="mcDesc">A loop. A problem drives a model; analyzing the model yields a prediction and a design;
    those drive implementation and then measurement; measurement refines the model, and the loop continues
    while the questions justify the cost.</desc>
<!-- Print refinement: retain the source geometry semantics and text; reflow labels at publication width. -->
<defs>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/></marker>
<marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/></marker>
</defs>
<rect x="0" y="0" width="920" height="410" rx="0" fill="#fdfcf9" stroke="#fdfcf9" stroke-width="0"/>
<rect x="72" y="36" width="250" height="56" rx="7" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
<text x="197.0" y="72" font-size="21" text-anchor="middle" fill="#1c1917">problem</text>
<rect x="72" y="132" width="250" height="56" rx="7" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
<text x="197.0" y="168" font-size="21" text-anchor="middle" fill="#1c1917">model</text>
<rect x="72" y="228" width="250" height="56" rx="7" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
<text x="197.0" y="264" font-size="21" text-anchor="middle" fill="#1c1917">analyze</text>
<rect x="570" y="132" width="320" height="56" rx="7" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
<text x="730.0" y="168" font-size="21" text-anchor="middle" fill="#1c1917">prediction / design</text>
<rect x="570" y="228" width="320" height="56" rx="7" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
<text x="730.0" y="264" font-size="21" text-anchor="middle" fill="#1c1917">implementation</text>
<rect x="570" y="324" width="320" height="56" rx="7" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
<text x="730.0" y="360" font-size="21" text-anchor="middle" fill="#1c1917">measurement</text>
<line x1="197" y1="92" x2="197" y2="132" stroke="#57534e" stroke-width="2" marker-end="url(#arrow-muted)"/>
<line x1="197" y1="188" x2="197" y2="228" stroke="#57534e" stroke-width="2" marker-end="url(#arrow-muted)"/>
<polyline points="322,256 446,256 446,160 570,160" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow-muted)"/>
<line x1="730" y1="188" x2="730" y2="228" stroke="#57534e" stroke-width="2" marker-end="url(#arrow-muted)"/>
<line x1="730" y1="284" x2="730" y2="324" stroke="#57534e" stroke-width="2" marker-end="url(#arrow-muted)"/>
<polyline points="570,352 24,352 24,160 72,160" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#arrow-rust)"/>
<text x="200" y="377" font-size="20" text-anchor="start" fill="#57534e" font-style="italic">refine model</text>
</svg>
