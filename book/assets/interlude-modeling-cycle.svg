<text x="765.0" y="267.93" font-size="21" text-anchor="middle" fill="#1c1917">implementation</text>
<rect x="650" y="326" width="230" height="50" rx="7" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
<text x="765.0" y="357.93" font-size="21" text-anchor="middle" fill="#1c1917">measurement</text>
<line x1="475" y1="106" x2="475" y2="146" stroke="#57534e" stroke-width="2" marker-end="url(#arrow-muted)"/>
