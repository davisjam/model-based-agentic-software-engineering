<polyline points="550,261 602,261 602,171 650,171" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow-muted)"/>
<line x1="765" y1="196" x2="765" y2="236" stroke="#57534e" stroke-width="2" marker-end="url(#arrow-muted)"/>
<line x1="765" y1="286" x2="765" y2="326" stroke="#57534e" stroke-width="2" marker-end="url(#arrow-muted)"/>
<polyline points="650,351 360,351 360,171 400,171" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#arrow-rust)"/>
<text x="455" y="376" font-size="20" text-anchor="start" fill="#57534e" font-style="italic">refine model</text>
</svg>
