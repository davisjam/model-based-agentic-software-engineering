<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292.5 273" width="292.5" height="273" role="img" aria-labelledby="canonical-behavioralT canonical-behavioralD" font-family="&quot;Source Sans 3&quot;, sans-serif"><title id="canonical-behavioralT">Canonical behavioral model: reduce an implementation to states and transitions</title>
  <desc id="canonical-behavioralD">A behavioral opener. A neutral implementation slab reduces to a state model: IDLE starts RUNNING, which finishes to DONE or fails to FAILED. A struck-through dashed arc marks the forbidden direct IDLE-to-DONE transition (no skipping RUNNING). Caption: Question, Semantics, Typical analysis. Blue ground marks the behavioral family.</desc>
  <defs><marker id="a2f5169" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#2f5169" /></marker><marker id="a57534e" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#57534e" /></marker><marker id="a086438" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#086438" /></marker><marker id="a1c1917" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#1c1917" /></marker></defs>
<text x="146.25" y="12.0" text-anchor="middle" font-size="9" fill="#1c1917" font-weight="700">Behavioral model — what may happen, in what order?</text>
<rect x="71" y="25" width="150" height="39" rx="4" fill="#f6f4ef" stroke="#57534e" stroke-width="0.8" />
<text x="146" y="39.0" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">IMPLEMENTATION</text>
<text x="146" y="52.0" text-anchor="middle" font-size="9" fill="#1c1917" font-weight="700">handlers · retries</text>
<text x="146" y="62.8" text-anchor="middle" font-size="9" fill="#1c1917" font-weight="700">writes · logging …</text>
<path d="M146,64 L146,103" fill="none" stroke="#57534e" stroke-width=".8" marker-end="url(#a57534e)" />
<text x="152" y="84.0" text-anchor="start" font-size="9" fill="#1c1917" font-style="italic">reduce to</text>
<rect x="9" y="104" width="64" height="26" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="0.8" />
<text x="41.0" y="121.0" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">IDLE</text>
<rect x="108" y="104" width="76" height="26" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="0.8" />
<text x="146.0" y="121.0" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">RUNNING</text>
<rect x="219" y="104" width="64" height="26" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="0.8" />
<text x="251.0" y="121.0" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">DONE</text>
<path d="M73,117 L108,117" fill="none" stroke="#2f5169" stroke-width=".8" marker-end="url(#a2f5169)" />
<text x="90.5" y="110.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">start</text>
<path d="M184,117 L219,117" fill="none" stroke="#2f5169" stroke-width=".8" marker-end="url(#a2f5169)" />
<text x="201.5" y="110.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">finish</text>
<path d="M146,130 L146,155" fill="none" stroke="#2f5169" stroke-width=".8" marker-end="url(#a2f5169)" />
<text x="152" y="145.0" text-anchor="start" font-size="9" fill="#1c1917" font-style="italic">fail</text>
<rect x="114" y="156" width="64" height="26" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="0.8" />
<text x="146" y="173.0" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">FAILED</text>
<path d="M41,130 L41,200 L251,200 L251,130" fill="none" stroke="#57534e" stroke-width=".8" stroke-dasharray="3 2" marker-end="url(#a57534e)" />
<path d="M141 195L151 205M151 195L141 205" stroke="#57534e" stroke-width="1.2" />
<text x="146" y="215.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">no such transition (no skipping)</text>
<text x="4" y="233.0" text-anchor="start" font-size="9" fill="#1c1917">Question: What may happen, and in what order?</text>
<text x="4" y="243.8" text-anchor="start" font-size="9" fill="#1c1917">Semantics: node = a legal state; edge = a permitted transition;</text>
<text x="4" y="254.6" text-anchor="start" font-size="9" fill="#1c1917">a path = an admitted execution.</text>
<text x="4" y="265.4" text-anchor="start" font-size="9" fill="#1c1917">Typical analysis: reachability, safety, liveness.</text>
</svg>