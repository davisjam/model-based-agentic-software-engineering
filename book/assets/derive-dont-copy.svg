<?xml version="1.0" encoding="UTF-8"?>
<!-- RB Part-IV figure — derive-dont-copy.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"
     role="img" aria-labelledby="ddTitle ddDesc"
     font-family="'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="ddTitle">Derive, don't copy — consume a fact from its source of truth instead of snapshotting it.</title>
  <desc id="ddDesc">A green source-of-truth box fans into three derivation operations — query, join, and generate —
    which merge into a neutral consumers box. Below, when neither representation fully determines the other, a
    green model box and a green world box are linked by a dashed rust double-headed parity arrow. The point:
    downstream consumers derive from the source of truth rather than maintaining parallel copies, and where
    neither representation fully determines the other, a correspondence check makes disagreement visible.</desc>

  <defs>
    <marker id="dd-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
    <marker id="dd-ah-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/></marker>
  </defs>

  <rect id="source" x="380" y="40" width="240" height="56" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="500" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">SOURCE OF TRUTH</text>

  <!-- fan: source of truth -> each derivation op (one path per branch) -->
  <!-- edge: source -> query -->
  <path d="M380,68 L200,68 L200,156" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#dd-ah)"/>
  <!-- edge: source -> join -->
  <line x1="500" y1="96" x2="500" y2="156" stroke="#57534e" stroke-width="2" marker-end="url(#dd-ah)"/>
  <!-- edge: source -> generate -->
  <path d="M620,80 L664,80 L664,174 L708,174" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#dd-ah)"/>

  <rect id="query" x="110" y="158" width="180" height="54" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="200" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">QUERY</text>
  <rect id="join" x="410" y="158" width="180" height="54" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="500" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">JOIN</text>
  <rect id="generate" x="710" y="158" width="180" height="54" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="800" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">GENERATE</text>

  <!-- merge: each op -> consumers (one path per branch) -->
  <!-- edge: query -> consumers -->
  <path d="M290,196 L334,196 L334,288 L378,288" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#dd-ah)"/>
  <!-- edge: join -> consumers -->
  <line x1="500" y1="212" x2="500" y2="270" stroke="#57534e" stroke-width="2" marker-end="url(#dd-ah)"/>
  <!-- edge: generate -> consumers -->
  <path d="M800,212 L800,300 L622,300" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#dd-ah)"/>

  <rect id="consumers" x="380" y="272" width="240" height="56" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="1.5"/>
  <text x="500" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">CONSUMERS</text>

  <text x="500" y="366" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">when neither side fully determines the other</text>
  <rect id="model" x="300" y="384" width="160" height="50" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="380" y="415" text-anchor="middle" font-size="15" font-weight="700" fill="#155c38">MODEL</text>
  <rect id="world" x="540" y="384" width="160" height="50" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="620" y="415" text-anchor="middle" font-size="15" font-weight="700" fill="#155c38">WORLD</text>
  <!-- parity check: dashed rust, double-headed = governance correspondence -->
  <!-- edge: model .. world -->
  <line x1="462" y1="409" x2="538" y2="409" stroke="#9a3f12" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#dd-ah-rust)" marker-end="url(#dd-ah-rust)"/>
  <text x="500" y="456" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3f12">parity</text>
</svg>
