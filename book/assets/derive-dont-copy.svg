<?xml version="1.0" encoding="UTF-8"?>
<!-- RB Part-IV figure — derive-dont-copy.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"
     role="img" aria-labelledby="ddTitle ddDesc"
     font-family="'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="ddTitle">Derive, don't copy — consume a fact from its authority instead of snapshotting it.</title>
  <desc id="ddDesc">A green authoritative-fact box fans into three derivation operations — query, join, and generate —
    which merge into a neutral consumers box. Below, when two representations must both stay authoritative, a
    green model box and a green world box are linked by a dashed rust double-headed parity arrow. The point:
    downstream consumers derive from the authority rather than maintaining parallel copies, and where two
    authorities remain, a correspondence check makes disagreement visible.</desc>

  <defs>
    <marker id="dd-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
    <marker id="dd-ah-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/></marker>
  </defs>

  <rect x="380" y="40" width="240" height="56" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="500" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">AUTHORITATIVE FACT</text>

  <path d="M500 96 C 400 126 260 128 200 156" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#dd-ah)"/>
  <line x1="500" y1="96" x2="500" y2="156" stroke="#57534e" stroke-width="2" marker-end="url(#dd-ah)"/>
  <path d="M500 96 C 600 126 740 128 800 156" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#dd-ah)"/>

  <rect x="110" y="158" width="180" height="54" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="200" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">QUERY</text>
  <rect x="410" y="158" width="180" height="54" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="500" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">JOIN</text>
  <rect x="710" y="158" width="180" height="54" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="800" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">GENERATE</text>

  <path d="M200 212 C 200 244 420 246 476 262" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#dd-ah)"/>
  <line x1="500" y1="212" x2="500" y2="270" stroke="#57534e" stroke-width="2" marker-end="url(#dd-ah)"/>
  <path d="M800 212 C 800 244 580 246 524 262" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#dd-ah)"/>

  <rect x="380" y="272" width="240" height="56" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="1.5"/>
  <text x="500" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">CONSUMERS</text>

  <text x="500" y="366" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">when two authorities must both remain</text>
  <rect x="300" y="384" width="160" height="50" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="380" y="415" text-anchor="middle" font-size="15" font-weight="700" fill="#155c38">MODEL</text>
  <rect x="540" y="384" width="160" height="50" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="620" y="415" text-anchor="middle" font-size="15" font-weight="700" fill="#155c38">WORLD</text>
  <!-- parity check: dashed rust, double-headed = governance correspondence -->
  <line x1="463" y1="409" x2="537" y2="409" stroke="#9a3f12" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#dd-ah-rust)" marker-end="url(#dd-ah-rust)"/>
  <text x="500" y="456" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3f12">parity</text>
</svg>
