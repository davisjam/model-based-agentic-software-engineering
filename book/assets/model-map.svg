  <rect x="840" y="104" width="220" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="950" y="119" text-anchor="middle" font-size="21.6" fill="#1c1917">★ PdfModel · ★ Office</text>
  <rect x="840" y="128" width="220" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="950" y="143" text-anchor="middle" font-size="21.6" fill="#1c1917">★ canonical walkers</text>

  <g class="node" data-k="process"><rect x="570" y="169" width="260" height="48" rx="6" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>
    <text x="700" y="188" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1c1917">Process</text>
    <text x="700" y="209" text-anchor="middle" font-size="21.6" fill="#57534e">2 models · 2 shared in</text></g>
  <line x1="830" y1="193" x2="840" y2="193" stroke="#1f7a4d" stroke-width="1.5"/>
  <rect x="840" y="171" width="220" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="950" y="186" text-anchor="middle" font-size="21.6" fill="#1c1917">★ composed state-machines</text>
  <rect x="840" y="195" width="220" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
