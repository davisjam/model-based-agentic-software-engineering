  <g class="node" data-k="dev"><rect x="570" y="250" width="260" height="48" rx="6" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>
    <text x="700" y="269" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1c1917">Development</text>
    <text x="700" y="290" text-anchor="middle" font-size="21.6" fill="#57534e">1 model</text></g>
  <line x1="830" y1="274" x2="840" y2="274" stroke="#1f7a4d" stroke-width="1.5"/>
  <rect x="840" y="264" width="220" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
