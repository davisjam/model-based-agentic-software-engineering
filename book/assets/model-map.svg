<?xml version="1.0" encoding="UTF-8"?>
<!-- F1 — the model map (double trunk). Two organizing spines rise from one method-trunk band:
     the fleet's self-operate LIFECYCLE models (left, navy) and the product's 4+1 VIEWS (right,
     green), with typed sub-model pills plugged into the outer side of each node, perimeter
     mechanism counts carried on the nodes, and dashed arcs for models shared by projection.
     The umber trunk band beneath both holds every model true. Hand-authored (not Mermaid): the
     "two spines over one trunk" reading is the catalogue's whole model-first thesis, which a
     flowchart would not draw. Palette ⊆ design-tokens svg_palette(); font = the body token stack.
     Node <g class="node" data-k="…"> groups are the By-model view's click targets (wired by the
     view's inline JS; decorative + aria-hidden until then, the static hierarchy carries the
     accessible navigation). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" id="modelmap" class="mapfig" aria-hidden="true"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <!-- spine trunk lines -->
  <line x1="330" y1="88" x2="330" y2="524" stroke="#2f5169" stroke-width="3"/>
  <line x1="750" y1="88" x2="750" y2="524" stroke="#1f7a4d" stroke-width="3"/>

  <!-- spine headers -->
  <text x="330" y="52" text-anchor="middle" font-size="19.44" font-weight="700" fill="#2f5169">THE FLEET</text>
  <text x="330" y="70" text-anchor="middle" font-size="19.44" fill="#57534e">the self-operate lifecycle models</text>
  <text x="750" y="52" text-anchor="middle" font-size="19.44" font-weight="700" fill="#1f7a4d">THE PRODUCT</text>
  <text x="750" y="70" text-anchor="middle" font-size="19.44" fill="#57534e">the 4+1 views of the shipped system</text>

  <!-- cross-links (drawn under nodes): models shared by projection -->
  <path d="M 220 120 C 468 100, 612 320, 648 208" fill="none" stroke="#57534e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M 220 300 C 468 300, 612 340, 648 372" fill="none" stroke="#57534e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M 220 360 C 468 360, 612 240, 648 208" fill="none" stroke="#57534e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M 220 120 C 479 150, 612 420, 648 448" fill="none" stroke="#57534e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="540" y="486" text-anchor="middle" font-size="19.44" fill="#57534e" font-style="italic">⇆ shared by projection</text>
  <text x="540" y="506" text-anchor="middle" font-size="19.44" fill="#57534e" font-style="italic">a cross-link, not a duplicate</text>

  <!-- ===================== FLEET lifecycle nodes (left spine); model pills to the LEFT ===================== -->
  <g class="node" data-k="l1"><rect x="230" y="100" width="200" height="40" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
    <text x="330" y="117" text-anchor="middle" font-size="19.44" font-weight="700" fill="#1c1917">manage-agents</text>
    <text x="330" y="132" text-anchor="middle" font-size="15.94" fill="#57534e">2 models · 6 mechanisms</text></g>
  <line x1="220" y1="120" x2="230" y2="120" stroke="#2f5169" stroke-width="1.5"/>
  <rect x="30" y="98" width="190" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="125" y="112" text-anchor="middle" font-size="19.44" fill="#1c1917">★ agent-orchestration</text>
  <rect x="30" y="122" width="190" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="125" y="136" text-anchor="middle" font-size="19.44" fill="#1c1917">★ mediator contracts</text>

  <g class="node" data-k="l2"><rect x="230" y="160" width="200" height="40" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
    <text x="330" y="177" text-anchor="middle" font-size="19.44" font-weight="700" fill="#1c1917">manage-context</text>
    <text x="330" y="192" text-anchor="middle" font-size="19.44" fill="#57534e">4 mechanisms</text></g>

  <g class="node" data-k="l3"><rect x="230" y="220" width="200" height="40" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
    <text x="330" y="237" text-anchor="middle" font-size="19.44" font-weight="700" fill="#1c1917">manage-git-repo</text>
    <text x="330" y="252" text-anchor="middle" font-size="19.44" fill="#57534e">3 mechanisms</text></g>

  <g class="node" data-k="l4"><rect x="230" y="280" width="200" height="40" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
    <text x="330" y="297" text-anchor="middle" font-size="19.44" font-weight="700" fill="#1c1917">manage-deploy</text>
    <text x="330" y="312" text-anchor="middle" font-size="16.56" fill="#57534e">1 model · 2 mechanisms</text></g>
  <line x1="220" y1="300" x2="230" y2="300" stroke="#2f5169" stroke-width="1.5"/>
  <rect x="30" y="290" width="190" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="125" y="304" text-anchor="middle" font-size="19.44" fill="#1c1917">★ deployment topology</text>

  <g class="node" data-k="l5"><rect x="230" y="340" width="200" height="40" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
    <text x="330" y="357" text-anchor="middle" font-size="17.23" font-weight="700" fill="#1c1917">manage-dev-machine</text>
    <text x="330" y="372" text-anchor="middle" font-size="16.56" fill="#57534e">1 model · 4 mechanisms</text></g>
  <line x1="220" y1="360" x2="230" y2="360" stroke="#2f5169" stroke-width="1.5"/>
  <rect x="30" y="350" width="190" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="125" y="364" text-anchor="middle" font-size="19.44" fill="#1c1917">★ synchronization</text>

  <g class="node" data-k="lcron"><rect x="230" y="400" width="200" height="40" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
    <text x="330" y="417" text-anchor="middle" font-size="19.44" font-weight="700" fill="#1c1917">gc-cron plane</text>
    <text x="330" y="432" text-anchor="middle" font-size="19.44" fill="#57534e">1 mechanism</text></g>

  <g class="node" data-k="lorch"><rect x="230" y="460" width="200" height="40" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
    <text x="330" y="477" text-anchor="middle" font-size="19.44" font-weight="700" fill="#1c1917">orchestrator-hooks</text>
    <text x="330" y="492" text-anchor="middle" font-size="16.56" fill="#57534e">1 model · 7 mechanisms</text></g>
  <line x1="220" y1="480" x2="230" y2="480" stroke="#2f5169" stroke-width="1.5"/>
  <rect x="30" y="470" width="190" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="125" y="484" text-anchor="middle" font-size="19.44" fill="#1c1917">★ governance graph</text>

