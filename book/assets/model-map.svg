<?xml version="1.0" encoding="UTF-8"?>
<!-- F1 — the model map (double trunk). Two organizing spines rise from one method-trunk band:
     the fleet's self-operate LIFECYCLE models (left, navy) and the product's 4+1 VIEWS (right,
     green), with typed sub-model pills plugged into the outer side of each node, perimeter
     mechanism counts carried on the nodes, and dashed arcs for models shared by projection.
     The umber trunk band beneath both holds every model true. Hand-authored (not Mermaid): the
     "two spines over one trunk" reading is the catalogue's whole model-first thesis, which a
     flowchart would not draw. Palette ⊆ design-tokens svg_palette(); font = the body token stack.
     Node <g class="node" data-k="…"> groups are the By-model view's click targets (wired by the
     view's inline JS; decorative + aria-hidden until then, the static hierarchy carries the
     accessible navigation). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" id="modelmap" class="mapfig" aria-hidden="true"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <!-- spine trunk lines -->
  <line x1="380" y1="84" x2="380" y2="528" stroke="#2f5169" stroke-width="3"/>
  <line x1="700" y1="84" x2="700" y2="528" stroke="#1f7a4d" stroke-width="3"/>

  <!-- spine headers -->
  <text x="380" y="48" text-anchor="middle" font-size="21.6" font-weight="700" fill="#2f5169">THE FLEET</text>
  <text x="380" y="70" text-anchor="middle" font-size="21.6" fill="#57534e">the self-operate lifecycle models</text>
  <text x="700" y="48" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1f7a4d">THE PRODUCT</text>
  <text x="700" y="70" text-anchor="middle" font-size="21.6" fill="#57534e">the 4+1 views of the shipped system</text>

  <!-- cross-links (drawn under nodes): models shared by projection — docked on the inner node
       borders (x=510 fleet-right → x=570 product-left) and arced through the empty center channel -->
  <path d="M 510 112 C 545 112, 535 193, 570 193" fill="none" stroke="#57534e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M 510 274 C 545 274, 535 355, 570 355" fill="none" stroke="#57534e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M 510 328 C 545 328, 535 193, 570 193" fill="none" stroke="#57534e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M 510 112 C 552 200, 552 360, 570 436" fill="none" stroke="#57534e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="540" y="500" text-anchor="middle" font-size="21.6" fill="#57534e" font-style="italic">⇆ shared by projection</text>
  <text x="540" y="520" text-anchor="middle" font-size="21.6" fill="#57534e" font-style="italic">a cross-link, not a duplicate</text>

  <!-- ===================== FLEET lifecycle nodes (left spine); model pills to the LEFT ===================== -->
  <g class="node" data-k="l1"><rect x="250" y="88" width="260" height="48" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
    <text x="380" y="107" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1c1917">manage-agents</text>
    <text x="380" y="128" text-anchor="middle" font-size="21.6" fill="#57534e">2 models · 6 mechanisms</text></g>
  <line x1="240" y1="112" x2="250" y2="112" stroke="#2f5169" stroke-width="1.5"/>
  <rect x="20" y="90" width="220" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="130" y="105" text-anchor="middle" font-size="21.6" fill="#1c1917">★ agent-orchestration</text>
  <rect x="20" y="114" width="220" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="130" y="129" text-anchor="middle" font-size="21.6" fill="#1c1917">★ mediator contracts</text>

  <g class="node" data-k="l2"><rect x="250" y="142" width="260" height="48" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
