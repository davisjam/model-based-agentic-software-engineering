  <g class="node" data-k="phys"><rect x="570" y="331" width="260" height="48" rx="6" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>
    <text x="700" y="350" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1c1917">Physical</text>
    <text x="700" y="371" text-anchor="middle" font-size="21.6" fill="#57534e">1 model · 1 shared in</text></g>
  <line x1="830" y1="355" x2="840" y2="355" stroke="#1f7a4d" stroke-width="1.5"/>
  <rect x="840" y="345" width="220" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="950" y="360" text-anchor="middle" font-size="21.6" fill="#1c1917">★ control↔substrate</text>

  <g class="node" data-k="scen"><rect x="570" y="412" width="260" height="48" rx="6" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>
    <text x="700" y="431" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1c1917">Scenarios</text>
    <text x="700" y="452" text-anchor="middle" font-size="21.6" fill="#57534e">1 model · 1 shared in</text></g>
  <line x1="830" y1="436" x2="840" y2="436" stroke="#1f7a4d" stroke-width="1.5"/>
  <rect x="840" y="426" width="220" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="950" y="441" text-anchor="middle" font-size="21.6" fill="#1c1917">★ user-journey</text>

  <!-- ===================== the method trunk band (holds both spines) ===================== -->
  <g class="node" data-k="trunk"><rect x="30" y="528" width="1020" height="56" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.5"/>
    <text x="540" y="551" text-anchor="middle" font-size="21.6" font-weight="700" fill="#9a3f12">THE METHOD TRUNK — 14 shared mechanisms</text>
    <text x="540" y="571" text-anchor="middle" font-size="21.6" fill="#57534e">executable source-of-truth · drift &amp; parity gates · verification · coverage→node · codegen · query surface · …</text></g>
  <!-- fleet-spine anchor pill on the trunk -->
  <rect x="260" y="464" width="240" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="380" y="479" text-anchor="middle" font-size="21.6" fill="#1c1917">★ lifecycle model (anchor)</text>
</svg>
