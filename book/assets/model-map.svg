    <text x="380" y="290" text-anchor="middle" font-size="21.6" fill="#57534e">1 model · 2 mechanisms</text></g>
  <line x1="240" y1="274" x2="250" y2="274" stroke="#2f5169" stroke-width="1.5"/>
  <rect x="20" y="264" width="220" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="130" y="279" text-anchor="middle" font-size="21.6" fill="#1c1917">★ deployment topology</text>

  <g class="node" data-k="l5"><rect x="250" y="304" width="260" height="48" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
    <text x="380" y="323" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1c1917">manage-dev-machine</text>
    <text x="380" y="344" text-anchor="middle" font-size="21.6" fill="#57534e">1 model · 4 mechanisms</text></g>
  <line x1="240" y1="328" x2="250" y2="328" stroke="#2f5169" stroke-width="1.5"/>
  <rect x="20" y="318" width="220" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="130" y="333" text-anchor="middle" font-size="21.6" fill="#1c1917">★ synchronization</text>

  <g class="node" data-k="lcron"><rect x="250" y="358" width="260" height="48" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
    <text x="380" y="377" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1c1917">gc-cron plane</text>
    <text x="380" y="398" text-anchor="middle" font-size="21.6" fill="#57534e">1 mechanism</text></g>

  <g class="node" data-k="lorch"><rect x="250" y="412" width="260" height="48" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
    <text x="380" y="431" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1c1917">orchestrator-hooks</text>
    <text x="380" y="452" text-anchor="middle" font-size="21.6" fill="#57534e">1 model · 7 mechanisms</text></g>
  <line x1="240" y1="436" x2="250" y2="436" stroke="#2f5169" stroke-width="1.5"/>
  <rect x="20" y="426" width="220" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="130" y="441" text-anchor="middle" font-size="21.6" fill="#1c1917">★ governance graph</text>

