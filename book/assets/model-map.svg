  <line x1="850" y1="120" x2="860" y2="120" stroke="#1f7a4d" stroke-width="1.5"/>
  <rect x="860" y="90" width="190" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="955" y="104" text-anchor="middle" font-size="19.44" fill="#1c1917">★ service-flow · ★ registries</text>
  <rect x="860" y="114" width="190" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="955" y="128" text-anchor="middle" font-size="19.44" fill="#1c1917">★ PdfModel · ★ Office</text>
  <rect x="860" y="138" width="190" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="955" y="152" text-anchor="middle" font-size="19.44" fill="#1c1917">★ canonical walkers</text>

  <g class="node" data-k="process"><rect x="650" y="188" width="200" height="40" rx="6" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>
    <text x="750" y="205" text-anchor="middle" font-size="19.44" font-weight="700" fill="#1c1917">Process</text>
    <text x="750" y="220" text-anchor="middle" font-size="18.31" fill="#57534e">2 models · 2 shared in</text></g>
  <line x1="850" y1="208" x2="860" y2="208" stroke="#1f7a4d" stroke-width="1.5"/>
  <rect x="860" y="186" width="190" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="955" y="200" text-anchor="middle" font-size="19.44" fill="#1c1917">★ composed state-machines</text>
  <rect x="860" y="210" width="190" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="955" y="224" text-anchor="middle" font-size="19.44" fill="#1c1917">★ process view</text>

  <g class="node" data-k="dev"><rect x="650" y="276" width="200" height="40" rx="6" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>
    <text x="750" y="293" text-anchor="middle" font-size="19.44" font-weight="700" fill="#1c1917">Development</text>
    <text x="750" y="308" text-anchor="middle" font-size="19.44" fill="#57534e">1 model</text></g>
  <line x1="850" y1="296" x2="860" y2="296" stroke="#1f7a4d" stroke-width="1.5"/>
  <rect x="860" y="286" width="190" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="955" y="300" text-anchor="middle" font-size="19.44" fill="#1c1917">★ component &amp; zone</text>

  <g class="node" data-k="phys"><rect x="650" y="352" width="200" height="40" rx="6" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>
    <text x="750" y="369" text-anchor="middle" font-size="19.44" font-weight="700" fill="#1c1917">Physical</text>
    <text x="750" y="384" text-anchor="middle" font-size="19.44" fill="#57534e">1 model · 1 shared in</text></g>
  <line x1="850" y1="372" x2="860" y2="372" stroke="#1f7a4d" stroke-width="1.5"/>
  <rect x="860" y="362" width="190" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="955" y="376" text-anchor="middle" font-size="19.44" fill="#1c1917">★ control↔substrate</text>

  <g class="node" data-k="scen"><rect x="650" y="428" width="200" height="40" rx="6" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>
    <text x="750" y="445" text-anchor="middle" font-size="19.44" font-weight="700" fill="#1c1917">Scenarios</text>
    <text x="750" y="460" text-anchor="middle" font-size="19.44" fill="#57534e">1 model · 1 shared in</text></g>
  <line x1="850" y1="448" x2="860" y2="448" stroke="#1f7a4d" stroke-width="1.5"/>
  <rect x="860" y="438" width="190" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="955" y="452" text-anchor="middle" font-size="19.44" fill="#1c1917">★ user-journey</text>

  <!-- ===================== the method trunk band (holds both spines) ===================== -->
  <g class="node" data-k="trunk"><rect x="50" y="524" width="980" height="56" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.5"/>
    <text x="540" y="547" text-anchor="middle" font-size="19.44" font-weight="700" fill="#9a3f12">THE METHOD TRUNK — 14 shared mechanisms</text>
    <text x="540" y="566" text-anchor="middle" font-size="19.44" fill="#57534e">executable source-of-truth · drift &amp; parity gates · verification · coverage→node · codegen · query surface · …</text></g>
  <!-- fleet-spine anchor pill on the trunk -->
  <rect x="240" y="514" width="180" height="20" rx="10" fill="#fdfcf9" stroke="#1f6fae"/>
  <text x="330" y="528" text-anchor="middle" font-size="19.44" fill="#1c1917">★ lifecycle model (anchor)</text>
</svg>
