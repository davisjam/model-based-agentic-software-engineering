<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: established-traditions-new-composition). Figure 6.5-2. TWO long-running
     traditions converge in MAGE's new composition. LEFT — engineering traditions (MBSE/MDE explicit models;
     PL/compilers types + constrained IRs; formal methods specs + verification; systems/safety boundaries +
     control). RIGHT — AI traditions (knowledge representation; memory + planning state; structured reasoning;
     tools + interfaces). BOTH feed the MAGE boundary (not engineering→Modeling, AI→GEE — both feed the
     composition). Inside MAGE: Modeling (make knowledge explicit) + Alignment (give obligations authority)
     meet in the Governed Engineering Environment. Then governance conversion carries recurring judgment out
     of the boundary into ENGINEERING CAPITAL (astride the lower boundary — a consequence of the method, not
     an input), inherited by subsequent work toward TRUSTWORTHY AUTONOMY (outside the boundary — the intended
     outcome). Novelty is the composition + economics, not either tradition; commodity intelligence changes
     the price list. NOT labelled "older" — AI's representational traditions are themselves decades old.
     Palette: Umber tokens (ink #1c1917, muted #57534e, rule #e4e0d8, page #fdfcf9; engineering green #155c38
     + tint #e9f2ec; AI slate-blue #2f5c8f + tint #eaf1f8; MAGE rust #9a3f12 + tint #faf1e6). -->
<!-- semantic-families: modeling, governance, neutral -->
<!-- Connect-grammar: the vertical spine (Modeling/Alignment -> GEE -> Engineering capital -> Trustworthy
     autonomy, plus governance conversion out of the boundary) is annotated node->node. The two column->MAGE
     convergence connectors have a COLUMN of four traditions as their source; each column carries a
     transparent-rect anchor (eng-traditions / ai-traditions) so the group-region source is a lint-legible
     node and the router routes the convergence out the column's flow border into the MAGE boundary top. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" width="1000" height="980"
     role="group" aria-labelledby="etTitle etDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="etTitle">Established traditions, new composition: engineering and AI traditions converge in MAGE</title>
  <desc id="etDesc">Two columns of established traditions feed a central MAGE boundary. On the left,
    engineering traditions: model-based and model-driven engineering (explicit models); programming languages
    and compilers (types and constrained intermediate representations); formal methods (specifications and
    verification); systems and safety engineering (boundaries and control). On the right, AI traditions:
    knowledge representation; memory and planning state; structured reasoning; tools and interfaces. Both
    columns feed the MAGE boundary, inside which Modeling makes knowledge explicit and Alignment gives
    obligations authority; the two meet in the Governed Engineering Environment. Governance conversion carries
    recurring judgment downward, out of the boundary, into engineering capital — durable structure inherited
    by subsequent work — toward trustworthy autonomy, the intended outcome outside the boundary. New
    economics under commodity intelligence drive the new composition; the provenance of the parts is old.</desc>

  <defs>
    <marker id="etA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
    <marker id="etAr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="980" fill="#fdfcf9"/>
  <text x="500" y="40" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="1.2" fill="#1c1917">ESTABLISHED TRADITIONS, NEW COMPOSITION</text>

  <!-- both columns converge into the MAGE boundary. Each column of four traditions carries a transparent-rect
       anchor (fill/stroke none) spanning its boxes, so the group-region source is a lint-legible node and the
       router can route the convergence out the column's bottom (flow border) into the MAGE boundary top. -->
  <rect id="eng-traditions" x="48" y="94" width="428" height="112" fill="none" stroke="none"/>
  <rect id="ai-traditions" x="524" y="94" width="428" height="112" fill="none" stroke="none"/>
  <!-- edge: eng-traditions -> mage -->
  <line x1="304" y1="206" x2="304" y2="264" stroke="#57534e" stroke-width="1.6" marker-end="url(#etA)"/>
  <!-- edge: ai-traditions -> mage -->
  <line x1="696" y1="206" x2="696" y2="264" stroke="#57534e" stroke-width="1.6" marker-end="url(#etA)"/>

  <!-- ── ENGINEERING TRADITIONS (left) ── -->
  <text x="262" y="80" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1" fill="#155c38">ENGINEERING TRADITIONS</text>
  <g font-size="18" fill="#1c1917">
    <rect x="48"  y="94" width="206" height="52" rx="8" fill="#e9f2ec" stroke="#8fbda3" stroke-width="1.4"/>
    <text x="60" y="116" font-weight="700">MBSE / MDE</text><text x="60" y="135" font-size="18" fill="#57534e">explicit models</text>
    <rect x="270" y="94" width="206" height="52" rx="8" fill="#e9f2ec" stroke="#8fbda3" stroke-width="1.4"/>
    <text x="282" y="116" font-weight="700">PL / compilers</text><text x="282" y="135" font-size="18" fill="#57534e">types · constrained IRs</text>
    <rect x="48"  y="154" width="206" height="52" rx="8" fill="#e9f2ec" stroke="#8fbda3" stroke-width="1.4"/>
    <text x="60" y="176" font-weight="700">Formal methods</text><text x="60" y="195" font-size="18" fill="#57534e">specs · verification</text>
    <rect x="270" y="154" width="206" height="52" rx="8" fill="#e9f2ec" stroke="#8fbda3" stroke-width="1.4"/>
    <text x="282" y="176" font-weight="700">Systems / safety</text><text x="282" y="195" font-size="18" fill="#57534e">boundaries · control</text>
  </g>

  <!-- ── AI TRADITIONS (right) ── -->
  <text x="738" y="80" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1" fill="#2f5c8f">AI TRADITIONS</text>
  <g font-size="18" fill="#1c1917">
    <rect x="524" y="94" width="206" height="52" rx="8" fill="#eaf1f8" stroke="#9db8d4" stroke-width="1.4"/>
    <text font-size="14.62" x="536" y="116" font-weight="700">Knowledge representation</text><text x="536" y="135" font-size="18" fill="#57534e">explicit knowledge</text>
    <rect x="746" y="94" width="206" height="52" rx="8" fill="#eaf1f8" stroke="#9db8d4" stroke-width="1.4"/>
    <text font-size="16.05" x="758" y="116" font-weight="700">Memory · planning state</text><text x="758" y="135" font-size="18" fill="#57534e">external state</text>
    <rect x="524" y="154" width="206" height="52" rx="8" fill="#eaf1f8" stroke="#9db8d4" stroke-width="1.4"/>
    <text x="536" y="176" font-weight="700">Structured reasoning</text><text x="536" y="195" font-size="18" fill="#57534e">intermediate structure</text>
    <rect x="746" y="154" width="206" height="52" rx="8" fill="#eaf1f8" stroke="#9db8d4" stroke-width="1.4"/>
    <text x="758" y="176" font-weight="700">Tools · interfaces</text><text x="758" y="195" font-size="13.17" fill="#57534e">machinery around the reasoner</text>
  </g>

  <!-- ── MAGE boundary (background; interior edges + nodes drawn on top) ── -->
  <rect id="mage" x="132" y="266" width="736" height="366" rx="14" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.8"/>
  <rect x="452" y="256" width="96" height="26" rx="6" fill="#fdfcf9" stroke="#9a3f12" stroke-width="1.6"/>
  <text x="500" y="274" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1.4" fill="#9a3f12">MAGE</text>

  <!-- interior edges: Modeling / Alignment -> Governed Engineering Environment -->
  <!-- edge: modeling -> gee -->
  <path d="M334,370 L334,454" fill="none" stroke="#57534e" stroke-width="1.6" marker-end="url(#etA)"/>
  <!-- edge: alignment -> gee -->
  <path d="M666,370 L666,454" fill="none" stroke="#57534e" stroke-width="1.6" marker-end="url(#etA)"/>

  <rect id="modeling" x="176" y="304" width="292" height="66" rx="9" fill="#fff" stroke="#c4a894" stroke-width="1.6"/>
  <text x="322" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Modeling</text>
  <text x="322" y="353" text-anchor="middle" font-size="18" fill="#57534e">make knowledge explicit</text>
  <rect id="alignment" x="532" y="304" width="292" height="66" rx="9" fill="#fff" stroke="#c4a894" stroke-width="1.6"/>
  <text x="678" y="332" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Alignment</text>
  <text x="678" y="353" text-anchor="middle" font-size="18" fill="#57534e">give obligations authority</text>

  <rect id="gee" x="200" y="456" width="600" height="140" rx="11" fill="#e9f2ec" stroke="#155c38" stroke-width="2.2"/>
  <text x="500" y="492" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">Governed Engineering Environment</text>
  <text x="500" y="522" text-anchor="middle" font-size="18" fill="#44403c">representations · evidence · constraints · authority</text>
  <text x="500" y="560" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">where both traditions meet — a first-class engineered object</text>

  <!-- governance conversion carries recurring judgment OUT of the boundary into engineering capital -->
  <!-- edge: mage -> capital -->
  <path d="M500,632 L500,676" fill="none" stroke="#9a3f12" stroke-width="2.4" marker-end="url(#etAr)"/>

  <!-- ENGINEERING CAPITAL — astride the lower boundary (a consequence, not an input) -->
  <rect id="capital" x="300" y="678" width="400" height="66" rx="10" fill="#eef7f0" stroke="#155c38" stroke-width="2"/>
  <text x="500" y="706" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">Engineering capital</text>
  <text x="500" y="727" text-anchor="middle" font-size="18" fill="#57534e">recurring judgment, made durable</text>

  <!-- edge: capital -> autonomy -->
  <path d="M500,744 L500,786" fill="none" stroke="#57534e" stroke-width="1.6" marker-end="url(#etA)"/>

  <!-- TRUSTWORTHY AUTONOMY — the intended outcome, outside the boundary -->
  <rect id="autonomy" x="340" y="788" width="320" height="58" rx="10" fill="#fdfcf9" stroke="#57534e" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="500" y="814" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Trustworthy autonomy</text>
  <text x="500" y="833" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">the intended outcome</text>

  <!-- edge labels -->
  <text x="516" y="660" font-size="18" font-style="italic" fill="#9a3f12">governance conversion</text>
  <text x="516" y="770" font-size="18" font-style="italic" fill="#57534e">inherited by subsequent work</text>

  <text x="500" y="905" text-anchor="middle" font-size="18" font-weight="700" letter-spacing=".6" fill="#9a3f12">NEW ECONOMICS → NEW COMPOSITION</text>
  <text x="500" y="928" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">commodity intelligence changes the price list, not the provenance of the parts</text>
</svg>
