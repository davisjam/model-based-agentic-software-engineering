<svg xmlns="http://www.w3.org/2000/svg" width="888" height="599" viewBox="0 0 444 299.5" role="img" aria-labelledby="title desc" font-family="Source Sans 3, sans-serif">
<title id="title">Established traditions, new composition</title>
<desc id="desc">Engineering and AI traditions feed MAGE. Modeling makes knowledge explicit and Alignment enforces selected obligations. Both contribute to a governed engineering environment that contains engineering capital. Subsequent work inherits that capital, with trustworthy autonomy as the intended outcome.</desc>
