<text x="257" y="198.0" font-size="10.5" text-anchor="start">Models and context</text>
<circle cx="251" cy="208" r="1"/>
<text x="257" y="211.0" font-size="10.5" text-anchor="start">Constraints and permissions</text>
<circle cx="251" cy="221" r="1"/>
<text x="257" y="224.0" font-size="10.5" text-anchor="start">Evidence and validators</text>
<circle cx="251" cy="234" r="1"/>
<text x="257" y="237.0" font-size="10.5" text-anchor="start">Admission</text>
<circle cx="251" cy="247" r="1"/>
<text x="257" y="250.0" font-size="10.5" text-anchor="start">Operational controls</text>
<polygon points="161,185 224,185 224,176 244,221 224,266 224,257 161,257" fill="#ededed" stroke="none"/>
<polyline points="161,185 224,185 224,176 244,221 224,266 224,257 161,257" fill="none" stroke="#222" stroke-width=".8"/>
<text x="166" y="197.0" font-size="11.5" text-anchor="start" font-weight="700">Governance</text>
<text x="166" y="210.0" font-size="11.5" text-anchor="start" font-weight="700">conversion</text>
<text x="166" y="220.0" font-size="9" text-anchor="start" font-style="italic">Turns recurring</text>
<text x="166" y="230.5" font-size="9" text-anchor="start" font-style="italic">judgment into</text>
<text x="166" y="241.0" font-size="9" text-anchor="start" font-style="italic">durable, reusable</text>
<text x="166" y="251.5" font-size="9" text-anchor="start" font-style="italic">structure.</text>
