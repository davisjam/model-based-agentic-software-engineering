<circle cx="250" cy="130" r="1"/>
<text x="256" y="133.0" font-size="10.5" text-anchor="start">Acceptance</text>
<circle cx="250" cy="143" r="1"/>
<text x="256" y="146.0" font-size="10.5" text-anchor="start">Adaptation</text>
<rect x="342" y="83" width="100" height="71" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<text x="348" y="95.0" font-size="11.5" text-anchor="start" font-weight="700">Commodity</text>
<text x="348" y="108.0" font-size="11.5" text-anchor="start" font-weight="700">intelligence</text>
<circle cx="349" cy="117" r="1"/>
<text x="355" y="120.0" font-size="9" text-anchor="start">Implementation</text>
<circle cx="349" cy="127" r="1"/>
