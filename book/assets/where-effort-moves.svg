<svg xmlns="http://www.w3.org/2000/svg" width="888" height="530" viewBox="0 0 444 265" role="img" aria-labelledby="title desc" font-family="Source Sans 3, sans-serif">
<title id="title">Where engineering effort moves</title>
<desc id="desc">Delegation shifts implementation and routine work to agents, while engineers retain judgment. Governance conversion turns recurring judgment into models, controls and evidence in the governed engineering environment.</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#1c1917"/></marker></defs>
<g fill="#1c1917" font-family="Source Sans 3, sans-serif">
<text x="79" y="15.0" font-size="14" text-anchor="middle" font-weight="700">Pre-GenAI allocation</text>
<text x="348" y="15.0" font-size="14" text-anchor="middle" font-weight="700">Agentic engineering</text>
<text x="79" y="31.0" font-size="11" text-anchor="middle" font-style="italic">Implementation is a major</text>
<text x="79" y="43.5" font-size="11" text-anchor="middle" font-style="italic">claim on human effort.</text>
<text x="348" y="31.0" font-size="11" text-anchor="middle" font-style="italic">More implementation is delegated, and</text>
<text x="348" y="43.5" font-size="11" text-anchor="middle" font-style="italic">more judgment is preserved in structure.</text>
