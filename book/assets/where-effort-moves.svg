<text x="10" y="108.0" font-size="10.5" text-anchor="start">Design and abstractions</text>
<text x="10" y="121.0" font-size="10.5" text-anchor="start">Implementation</text>
<text x="10" y="134.0" font-size="10.5" text-anchor="start">Review and acceptance</text>
<text x="10" y="147.0" font-size="10.5" text-anchor="start">Operation and adaptation</text>
<text x="247" y="77.0" font-size="13" text-anchor="start" font-weight="700">Human engineering judgment</text>
