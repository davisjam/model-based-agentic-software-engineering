<circle cx="5" cy="92" r="1"/>
<text x="11" y="95.0" font-size="10.5" text-anchor="start">Requirements and intent</text>
<circle cx="5" cy="105" r="1"/>
<text x="11" y="108.0" font-size="10.5" text-anchor="start">Design and abstractions</text>
<circle cx="5" cy="118" r="1"/>
<text x="11" y="121.0" font-size="10.5" text-anchor="start">Implementation</text>
<circle cx="5" cy="131" r="1"/>
<text x="11" y="134.0" font-size="10.5" text-anchor="start">Review and acceptance</text>
<circle cx="5" cy="144" r="1"/>
<text x="11" y="147.0" font-size="10.5" text-anchor="start">Operation and adaptation</text>
<text x="234" y="77.0" font-size="13" text-anchor="start" font-weight="700">Human engineering judgment</text>
<circle cx="236" cy="87" r="1"/>
<circle cx="236" cy="100" r="1"/>
<circle cx="236" cy="123" r="1"/>
<circle cx="236" cy="145" r="1"/>
<circle cx="236" cy="156" r="1"/>
<text x="239" y="90.0" font-size="9.25" text-anchor="start">Intent and abstractions</text>
<text x="239" y="103.0" font-size="9.25" text-anchor="start" font-weight="700">Modeling:</text>
<text x="281" y="103.0" font-size="9.25" text-anchor="start">consequential</text>
<text x="239" y="114.0" font-size="9.25" text-anchor="start">knowledge and obligations</text>
<text x="239" y="126.0" font-size="9.25" text-anchor="start" font-weight="700">Alignment:</text>
<text x="286" y="126.0" font-size="9.25" text-anchor="start">evidence,</text>
<text x="239" y="137.0" font-size="9.25" text-anchor="start">constraints, and controls</text>
<text x="239" y="148.0" font-size="9.25" text-anchor="start">Tradeoffs and acceptance</text>
<text x="239" y="159.0" font-size="9.25" text-anchor="start">Adaptation</text>
<rect x="352" y="83" width="90" height="71" rx="5" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<text x="355" y="95.0" font-size="11.5" text-anchor="start" font-weight="700">Commodity</text>
<text x="355" y="108.0" font-size="11.5" text-anchor="start" font-weight="700">intelligence</text>
<circle cx="355" cy="117" r="1"/>
<text x="361" y="120.0" font-size="9" text-anchor="start">Implementation</text>
<circle cx="355" cy="127" r="1"/>
<text x="361" y="130.0" font-size="9" text-anchor="start">Analysis</text>
<circle cx="355" cy="137" r="1"/>
<text x="361" y="140.0" font-size="9" text-anchor="start">Transformation</text>
<circle cx="355" cy="147" r="1"/>
<text x="361" y="150.0" font-size="9" text-anchor="start">Routine remediation</text>
<g transform="translate(10 0)">
<path d="M339 86 Q335 86 335 91 L335 114 Q335 118 331 118 Q335 118 335 122 L335 145 Q335 150 339 150" fill="none" stroke="#222" stroke-width=".85"/>
