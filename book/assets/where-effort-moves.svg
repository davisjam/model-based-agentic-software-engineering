<text x="161" y="103.0" font-size="11.5" text-anchor="start" font-weight="700">Delegation</text>
<text x="161" y="117.0" font-size="9" text-anchor="start" font-style="italic">Shifts more</text>
<text x="161" y="127.5" font-size="9" text-anchor="start" font-style="italic">implementation</text>
<text x="161" y="138.0" font-size="9" text-anchor="start" font-style="italic">and routine work</text>
<text x="161" y="148.5" font-size="9" text-anchor="start" font-style="italic">to agents.</text>
<text x="2" y="182.0" font-size="11.2" text-anchor="start" font-weight="700">Engineering tools and processes</text>
<circle cx="5" cy="195" r="1"/>
<text x="11" y="198.0" font-size="10" text-anchor="start">CI/CD and build automation</text>
<circle cx="5" cy="208" r="1"/>
<text x="11" y="211.0" font-size="10" text-anchor="start">Tests and test infrastructure</text>
<circle cx="5" cy="221" r="1"/>
<text x="11" y="224.0" font-size="10" text-anchor="start">Static analysis and quality checks</text>
<circle cx="5" cy="234" r="1"/>
<text x="11" y="237.0" font-size="10" text-anchor="start">Repositories and code review</text>
<circle cx="5" cy="247" r="1"/>
<text x="11" y="250.0" font-size="10" text-anchor="start">Coding standards and policies</text>
<text x="234" y="182.0" font-size="12.2" text-anchor="start" font-weight="700">Governed engineering environment</text>
<circle cx="251" cy="195" r="1"/>
<text x="257" y="198.0" font-size="10.5" text-anchor="start">Models and context</text>
<circle cx="251" cy="208" r="1"/>
<text x="257" y="211.0" font-size="10.5" text-anchor="start">Constraints and permissions</text>
<circle cx="251" cy="221" r="1"/>
<text x="257" y="224.0" font-size="10.5" text-anchor="start">Evidence and validators</text>
<circle cx="251" cy="234" r="1"/>
<text x="257" y="237.0" font-size="10.5" text-anchor="start">Admission</text>
<circle cx="251" cy="247" r="1"/>
<text x="257" y="250.0" font-size="10.5" text-anchor="start">Operational controls</text>
<polygon points="155,185 217,185 217,176 231,221 217,266 217,257 155,257" fill="#ededed" stroke="none"/>
<polyline points="155,185 217,185 217,176 231,221 217,266 217,257 155,257" fill="none" stroke="#222" stroke-width=".8"/>
<text x="161" y="197.0" font-size="11.5" text-anchor="start" font-weight="700">Governance</text>
<text x="161" y="210.0" font-size="11.5" text-anchor="start" font-weight="700">conversion</text>
<text x="161" y="220.0" font-size="9" text-anchor="start" font-style="italic">Turns recurring</text>
<text x="161" y="230.5" font-size="9" text-anchor="start" font-style="italic">judgment into</text>
<text x="161" y="241.0" font-size="9" text-anchor="start" font-style="italic">durable, reusable</text>
<text x="161" y="251.5" font-size="9" text-anchor="start" font-style="italic">structure.</text>
</g>
</svg>
