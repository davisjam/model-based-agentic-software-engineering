<circle cx="349" cy="137" r="1"/>
<text x="355" y="140.0" font-size="9" text-anchor="start">Transformation</text>
<circle cx="349" cy="147" r="1"/>
<text x="355" y="150.0" font-size="9" text-anchor="start">Routine remediation</text>
