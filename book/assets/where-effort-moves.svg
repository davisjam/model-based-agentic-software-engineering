<text x="162" y="100.0" font-size="12" text-anchor="start" font-weight="700">Delegation</text>
<text x="162" y="113.0" font-size="9" text-anchor="start" font-style="italic">Shifts more</text>
<text x="162" y="123.5" font-size="9" text-anchor="start" font-style="italic">implementation</text>
<text x="162" y="134.0" font-size="9" text-anchor="start" font-style="italic">and routine work</text>
<text x="162" y="144.5" font-size="9" text-anchor="start" font-style="italic">to agents.</text>
<text x="2" y="182.0" font-size="11.2" text-anchor="start" font-weight="700">Engineering tools and processes</text>
<text x="10" y="198.0" font-size="10" text-anchor="start">CI/CD and build automation</text>
<text x="10" y="211.0" font-size="10" text-anchor="start">Tests and test infrastructure</text>
<text x="10" y="224.0" font-size="10" text-anchor="start">Static analysis and quality checks</text>
<text x="10" y="237.0" font-size="10" text-anchor="start">Repositories and code review</text>
<text x="10" y="250.0" font-size="10" text-anchor="start">Coding standards and policies</text>
<text x="247" y="182.0" font-size="12.2" text-anchor="start" font-weight="700">Governed engineering environment</text>
