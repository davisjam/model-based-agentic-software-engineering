<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: book-map). ROUND-2 FULL REBUILD. The previous map forked Part I into
     Parts II and III as SIBLINGS that rejoined at Part IV, and carried the stale PRE-swap ordering
     (Part 2 = Alignment, Part 3 = Modeling) plus a numbered "Part 7" back matter. Both are wrong now:
     Modeling and Alignment are not siblings — Alignment depends on Modeling — so the book is a SINGLE
     LINEAR DESCENT, and the swap has landed: the visible part labels now read the renamed titles
     (Part II Modeling, Part III Alignment, Part IV The MAGE Method, Part V The Evidence), matching
     _PART_TITLES. This rebuild draws that straight descent with the post-swap
     titles, and moves the back matter OFF TO THE SIDE as an aside rather than a seventh stage.
     Palette: Umber Monograph tokens — Part I ink #1c1917 (the frame), Part II green #1f7a4d (Modeling),
     Part III accent #9a3f12 (Alignment), Part IV neutral #57534e (the method that joins them), Part V
     fleet #2f5169 (the DocAble case), Part VI purple #5b4a72 (the profession); back-matter aside muted
     #57534e. Colours match 0.1-1 and the cycle figure: green = Modeling, rust = Alignment. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 850" width="980" height="850"
     role="group" aria-labelledby="bmTitle bmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="bmTitle">A map of the book — a single linear descent through six parts</title>
  <desc id="bmDesc">The book is one straight descent, not a fork. Part I, The Mindset, sets the frame and
    the two theses — why engineering changes. It leads down to Part II, Modeling, which develops the
    Modeling Thesis: make intent explicit. That leads to Part III, Alignment,
    which develops the Alignment Thesis: give intent authority — Alignment depends on Modeling, so it comes
    after, not beside it. That leads to Part IV, The MAGE Method, which joins the two
    theses — model, align, convert, repeat — and turns them into practical engineering work: the
    workflow, migration, validation of change, and reusable skills, with brief industrial examples as
    illustration. That leads to Part V, The Evidence: DocAble end to end, where the method came from.
    That leads to Part VI, The Profession: theory, industrial comparison, scope, the profession,
    and open problems. Off to the side sits the reference back matter — appendices, about the author,
    colophon — an aside beside the argument, not a stage in it.</desc>

  <defs>
    <marker id="bm-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="850" fill="#fdfcf9"/>

  <!-- PART I — The Mindset (ink frame) -->
  <rect x="200" y="40" width="520" height="90" rx="8" fill="#f6f4ef" stroke="#1c1917" stroke-width="2.2"/>
  <text x="460" y="80" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part I · The Mindset</text>
  <text x="460" y="108" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">why engineering changes — the frame and the two theses</text>
  <line x1="460" y1="130" x2="460" y2="158" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm-ah)"/>

  <!-- PART II — The Model Zoo · Modeling Thesis (green) -->
  <rect x="200" y="160" width="520" height="96" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="460" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part II · Modeling</text>
  <text x="460" y="228" text-anchor="middle" font-size="16" font-style="italic" fill="#1f7a4d">Modeling Thesis · make intent explicit</text>
  <line x1="460" y1="256" x2="460" y2="284" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm-ah)"/>

  <!-- PART III — The Governed Engineering Environment · Alignment Thesis (rust) -->
  <rect x="200" y="286" width="520" height="96" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="460" y="326" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part III · Alignment</text>
  <text x="460" y="354" text-anchor="middle" font-size="16" font-style="italic" fill="#9a3f12">Alignment Thesis · give intent authority</text>
  <line x1="460" y1="382" x2="460" y2="410" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm-ah)"/>

  <!-- PART IV — Putting It to Work · the MAGE method (neutral: joins the two) -->
  <rect x="200" y="412" width="520" height="114" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="460" y="450" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part IV · The MAGE Method</text>
  <text x="460" y="476" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">the MAGE method · join the theses</text>
  <text x="460" y="498" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1917">model → align → convert → repeat</text>
  <text x="460" y="518" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">workflow · migration · validation · skills</text>
  <line x1="460" y1="526" x2="460" y2="554" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm-ah)"/>

  <!-- PART V — A MAGE Case Study (fleet blue) -->
  <rect x="200" y="556" width="520" height="96" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="460" y="596" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part V · The Evidence</text>
  <text x="460" y="624" text-anchor="middle" font-size="16" font-style="italic" fill="#2f5169">DocAble, end to end · where the method came from</text>
  <line x1="460" y1="652" x2="460" y2="680" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm-ah)"/>

  <!-- PART VI — The Profession (purple) -->
  <rect x="200" y="682" width="520" height="104" rx="8" fill="#efeaf4" stroke="#5b4a72" stroke-width="2.4"/>
  <text x="460" y="720" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part VI · The Profession</text>
  <text x="460" y="746" text-anchor="middle" font-size="16" font-style="italic" fill="#5b4a72">theory · industrial comparison · scope</text>
  <text x="460" y="768" text-anchor="middle" font-size="16" font-style="italic" fill="#5b4a72">profession · open problems</text>

  <!-- BACK MATTER — off to the side (an aside, not a numbered stage) -->
  <path d="M720,616 C752,616 758,624 786,624" fill="none" stroke="#57534e" stroke-width="1.8"
        stroke-dasharray="5 4"/>
  <rect x="788" y="586" width="176" height="104" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="1.8"
        stroke-dasharray="5 4"/>
  <text x="876" y="616" text-anchor="middle" font-size="17" font-weight="700" fill="#57534e">Back matter</text>
  <text x="876" y="640" text-anchor="middle" font-size="12.5" fill="#57534e">appendices · about the</text>
  <text x="876" y="657" text-anchor="middle" font-size="12.5" fill="#57534e">author · colophon</text>
  <text x="876" y="679" text-anchor="middle" font-size="12" font-style="italic" fill="#57534e">an aside, not a stage</text>
</svg>
