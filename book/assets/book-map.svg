<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: book-map). R41b THEORY REBUILD (preface-3). Two changes from the prior map:
     (1) the dangling BACK-MATTER aside box + its dashed connector are DELETED — a clean six-Part vertical
     descent, nothing off to the side; (2) Part I is retitled "The New Engineering Problem" (was "The
     Mindset"); (3) the Part II -> Part III arrow annotation reads "principled progression: representation ->
     authority" — NOT a dependency. Modeling comes first because MAGE treats explicit abstraction as the
     principled way to scale reasoning and governance; Alignment can exist WITHOUT Modeling, but its reach
     is narrower and human judgment must bridge what the environment cannot represent. The book is a single
     linear descent through six parts.
     Palette: Umber Monograph tokens — Part I ink #1c1917 (the frame), Part II green #1f7a4d (Modeling,
     modeling family), Part III accent #9a3f12 (Alignment, governance family), Part IV neutral #57534e (the
     method that joins them), Part V fleet #2f5169 (the DocAble case, agent family), Part VI purple #5b4a72
     (the profession). Colours match 0.1-1: green = Modeling, rust = Alignment. -->
<!-- semantic-families: agent, governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" width="900" height="850"
     role="group" aria-labelledby="bmTitle bmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="bmTitle">A map of the book — a single linear descent through six parts</title>
  <desc id="bmDesc">The book is one straight descent through six parts. Part I, The New Engineering Problem,
    sets the frame: the changed economics and the engineering problems that remain when implementation
    becomes abundant. It leads to Part II, Modeling, which develops the Modeling Thesis: make knowledge and
    intent explicit. That leads to Part III, Alignment, which develops the Alignment Thesis: give
    obligations authority. Modeling comes first as a principled progression from representation to
    authority, not as a dependency — Alignment can exist without explicit models, but its reach is narrower
    and human judgment must bridge what the environment cannot represent. That leads to Part IV, The MAGE
    Method, which joins the two theses — model, align, convert, repeat — as practical engineering work:
    workflow, migration, validation, and skills. That leads to Part V, The Evidence: DocAble end to end,
    where the method came from. That leads to Part VI, The Profession: theory, industrial comparison, scope,
    the profession, and open problems.</desc>

  <defs>
    <marker id="bm2-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="850" fill="#fdfcf9"/>

  <!-- PART I — The New Engineering Problem (ink frame) -->
  <rect x="190" y="40" width="520" height="90" rx="8" fill="#f6f4ef" stroke="#1c1917" stroke-width="2.2"/>
  <text x="450" y="80" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part I · The New Engineering Problem</text>
  <text x="450" y="108" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">the changed economics — why engineering changes</text>
  <line x1="450" y1="130" x2="450" y2="158" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm2-ah)"/>

  <!-- PART II — Modeling (green) -->
  <rect x="190" y="160" width="520" height="96" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="450" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part II · Modeling</text>
  <text x="450" y="228" text-anchor="middle" font-size="16" font-style="italic" fill="#1f7a4d">Modeling Thesis · make knowledge + intent explicit</text>
  <line x1="450" y1="256" x2="450" y2="298" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm2-ah)"/>
  <text x="472" y="272" text-anchor="start" font-size="13" font-style="italic" fill="#57534e">principled progression:</text>
  <text x="472" y="288" text-anchor="start" font-size="13" font-style="italic" fill="#57534e">representation → authority</text>

  <!-- PART III — Alignment (rust) -->
  <rect x="190" y="300" width="520" height="96" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="450" y="340" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part III · Alignment</text>
  <text x="450" y="368" text-anchor="middle" font-size="16" font-style="italic" fill="#9a3f12">Alignment Thesis · give obligations authority</text>
  <line x1="450" y1="396" x2="450" y2="424" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm2-ah)"/>

  <!-- PART IV — The MAGE Method (neutral: joins the two) -->
  <rect x="190" y="426" width="520" height="114" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="450" y="464" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part IV · The MAGE Method</text>
  <text x="450" y="490" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">join the theses</text>
  <text x="450" y="512" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1917">model → align → convert → repeat</text>
  <text x="450" y="532" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">workflow · migration · validation · skills</text>
  <line x1="450" y1="540" x2="450" y2="568" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm2-ah)"/>

  <!-- PART V — The Evidence (fleet blue) -->
  <rect x="190" y="570" width="520" height="96" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="450" y="610" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part V · The Evidence</text>
  <text x="450" y="638" text-anchor="middle" font-size="16" font-style="italic" fill="#2f5169">DocAble, end to end · where the method came from</text>
  <line x1="450" y1="666" x2="450" y2="694" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm2-ah)"/>

  <!-- PART VI — The Profession (purple) -->
  <rect x="190" y="696" width="520" height="104" rx="8" fill="#efeaf4" stroke="#5b4a72" stroke-width="2.4"/>
  <text x="450" y="734" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part VI · The Profession</text>
  <text x="450" y="760" text-anchor="middle" font-size="16" font-style="italic" fill="#5b4a72">theory · industrial comparison · scope</text>
  <text x="450" y="782" text-anchor="middle" font-size="16" font-style="italic" fill="#5b4a72">profession · open problems</text>
</svg>
