<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: book-map). frontmatter-figures-260820 pass: the "call and response" metaphor
     is retired in favour of a plain "question / argument / answer" framing. A single clean descent through
     the six Parts, from the Preface's opening question to the Conclusion's answer + its converse, with two
     DOTTED branches hanging the appendix Parts off the argument (Part IV to Practice, Part V to Evidence),
     mirroring the two short reading paths. FONT NOTE: the viewBox width is held to 920 so every label
     normalizes into the figure font band (abs x 1000/920 lands in 16-28px) and renders near body size in the
     PDF column; the canvas is kept short (660) so the whole section still fits one page. Palette: Umber
     Monograph tokens per Part; appendix destinations muted #78716c with a dashed border. -->
<!-- semantic-families: agent, governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="920" height="660"
     role="group" aria-labelledby="bmTitle bmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="bmTitle">The book's argument — a question posed in the Preface, answered in the Conclusion, across six Parts, with the two appendix Parts branching off</title>
  <desc id="bmDesc">A single descent through the book's argument. The Preface poses the opening question: how
    do we safely grant autonomy to commodity intelligence? It leads to Part I, The New Engineering Problem —
    changed economics. Then Part II, Modeling — make knowledge and intent explicit. Then Part III, Alignment —
    give obligations authority. Then Part IV, The MAGE Method — model, align, work, convert; a dotted branch
    runs to Appendix Part I, Practice (use and extend). Then Part V, The Evidence — depth and breadth; a
    dotted branch runs to Appendix Part II, Evidence (inspect the empirical record). Then Part VI, The
    Profession — theory, implications, engineer. The descent ends at the Conclusion, which returns to the
    Preface's question and asks its converse: what cannot be delegated? Responsibility. The dotted appendix
    branches are related destinations, not steps in the argument.</desc>

  <defs>
    <marker id="bm-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="bm-ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78716c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="660" fill="#fdfcf9"/>

  <!-- top framing kicker -->
  <text x="244" y="26" text-anchor="middle" font-size="16.56" font-style="italic" fill="#57534e"
        letter-spacing="0.05em">question&#8201;&#8594;&#8201;argument&#8201;&#8594;&#8201;answer</text>

  <!-- PREFACE — the opening question (unnumbered matter) -->
  <rect id="preface" x="24" y="40" width="440" height="74" rx="8" fill="#f4efe6" stroke="#1c1917" stroke-width="2.2"/>
  <text x="244" y="68" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Preface</text>
  <text x="244" y="91" text-anchor="middle" font-size="16.56" font-style="italic" fill="#1c1917">&#8220;How do we safely grant autonomy</text>
  <text x="244" y="109" text-anchor="middle" font-size="16.56" font-style="italic" fill="#1c1917">to commodity intelligence?&#8221;</text>
  <line x1="244" y1="114" x2="244" y2="128" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm-ah)"/>

  <!-- PART I -->
  <rect id="part-1" x="24" y="128" width="440" height="56" rx="8" fill="#f6f4ef" stroke="#1c1917" stroke-width="2.2"/>
  <text x="244" y="153" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">Part I · The New Engineering Problem</text>
  <text x="244" y="173" text-anchor="middle" font-size="16.56" font-style="italic" fill="#57534e">changed economics</text>
  <line x1="244" y1="184" x2="244" y2="198" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm-ah)"/>

  <!-- PART II — Modeling (green) -->
  <rect id="part-2" x="24" y="198" width="440" height="56" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="244" y="223" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Part II · Modeling</text>
  <text x="244" y="243" text-anchor="middle" font-size="16.56" font-style="italic" fill="#1f7a4d">make knowledge + intent explicit</text>
  <line x1="244" y1="254" x2="244" y2="268" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm-ah)"/>

  <!-- PART III — Alignment (rust) -->
  <rect id="part-3" x="24" y="268" width="440" height="56" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="244" y="293" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Part III · Alignment</text>
  <text x="244" y="313" text-anchor="middle" font-size="16.56" font-style="italic" fill="#9a3f12">give obligations authority</text>
  <line x1="244" y1="324" x2="244" y2="338" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm-ah)"/>

  <!-- PART IV — The MAGE Method (neutral: joins the two) -->
  <rect id="part-4" x="24" y="338" width="440" height="56" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="244" y="363" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Part IV · The MAGE Method</text>
  <text x="244" y="383" text-anchor="middle" font-size="16.56" font-weight="600" fill="#1c1917">model · align · work · convert</text>
  <line x1="244" y1="394" x2="244" y2="408" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm-ah)"/>

  <!-- PART IV to Appendix Part I (DOTTED branch — related destination, not a step) -->
  <line x1="464" y1="366" x2="580" y2="366" stroke="#78716c" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#bm-ah-muted)"/>
  <rect id="appendix-1" x="580" y="338" width="320" height="56" rx="8" fill="#faf8f4" stroke="#78716c" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="740" y="363" text-anchor="middle" font-size="17" font-weight="700" fill="#44403c">Appendix Part I · Practice</text>
  <text x="740" y="383" text-anchor="middle" font-size="16.56" font-style="italic" fill="#78716c">use + extend</text>

  <!-- PART V — The Evidence (fleet blue) -->
  <rect id="part-5" x="24" y="408" width="440" height="56" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="244" y="433" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Part V · The Evidence</text>
  <text x="244" y="453" text-anchor="middle" font-size="16.56" font-weight="600" fill="#2f5169">depth + breadth</text>
  <line x1="244" y1="464" x2="244" y2="478" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm-ah)"/>

  <!-- PART V to Appendix Part II (DOTTED branch) -->
  <line x1="464" y1="436" x2="580" y2="436" stroke="#78716c" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#bm-ah-muted)"/>
  <rect id="appendix-2" x="580" y="408" width="320" height="56" rx="8" fill="#faf8f4" stroke="#78716c" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="740" y="433" text-anchor="middle" font-size="17" font-weight="700" fill="#44403c">Appendix Part II · Evidence</text>
  <text x="740" y="453" text-anchor="middle" font-size="16.56" font-style="italic" fill="#78716c">inspect the empirical record</text>

  <!-- PART VI — The Profession (purple) -->
  <rect id="part-6" x="24" y="478" width="440" height="56" rx="8" fill="#efeaf4" stroke="#5b4a72" stroke-width="2.4"/>
  <text x="244" y="503" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Part VI · The Profession</text>
  <text x="244" y="523" text-anchor="middle" font-size="16.56" font-style="italic" fill="#5b4a72">theory · implications · engineer</text>
  <line x1="244" y1="534" x2="244" y2="548" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm-ah)"/>

  <!-- CONCLUSION — the answer + its converse (unnumbered matter); the argument ends here -->
  <rect id="conclusion" x="24" y="548" width="440" height="76" rx="8" fill="#f4efe6" stroke="#1c1917" stroke-width="2.4"/>
  <text x="244" y="576" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Conclusion</text>
  <text x="244" y="598" text-anchor="middle" font-size="16.56" font-style="italic" fill="#9a3f12">returns to the question, and asks its converse:</text>
  <text x="244" y="617" text-anchor="middle" font-size="16.56" fill="#1c1917">&#8220;What cannot be delegated?&#8221; — <tspan font-weight="700" fill="#9a3f12">RESPONSIBILITY</tspan></text>
</svg>
