<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: book-map). R51 BACK-MATTER RESTRUCTURE (Option B). Changes from the prior
     six-Part descent map:
     (1) a PREFACE node is added at the top — the CALL. It poses the book's governing question
     ("How do we safely grant autonomy to commodity intelligence?").
     (2) a top-level CONCLUSION node is added after Part VI — the RESPONSE, parallel to the Preface (unnumbered
     matter, NOT numbered 6.7). It returns to the Preface's question, gives the compact answer, and asks the
     converse ("What cannot be delegated?" — Responsibility).
     (3) a curved side arc on the left ties the Preface (call) to the Conclusion (response) — the book's
     call-and-response frame (per backmatter.md §11).
     (4) Part I is retitled "Introduction — The New Engineering Problem".
     (5) the book's APPARATUS — Appendices, then Colophon, then About the Author — moves to a muted
     post-Conclusion tail, connected by dashed (not ink) links: it is offered AFTER the argument, not as part
     of it. Colophon precedes About-the-Author (Option B tail order).
     The straight-through reading path (Preface -> I -> II -> III -> IV -> V -> VI -> Conclusion) is the bold
     ink spine; the apparatus tail is dashed and muted.
     Palette: Umber Monograph tokens — matter (Preface + Conclusion) ink #1c1917 on warm paper #f4efe6;
     Part I ink #1c1917 (the frame); Part II green #1f7a4d (Modeling); Part III accent #9a3f12 (Alignment);
     Part IV neutral #57534e (the method that joins them); Part V fleet #2f5169 (the DocAble case); Part VI
     purple #5b4a72 (the profession); apparatus muted #78716c / #a8a29e. The call-and-response arc is rust
     #9a3f12 — the Alignment/governance accent, because the answer the Conclusion lands on is Responsibility. -->
<!-- semantic-families: agent, governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300"
     role="group" aria-labelledby="bmTitle bmDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="bmTitle">A map of the book — a question posed in the Preface, answered in the Conclusion, across six Parts</title>
  <desc id="bmDesc">The book is a call and a response wrapped around a single descent through six Parts. The
    Preface poses the governing question: how do we safely grant autonomy to commodity intelligence? It leads
    to Part I, Introduction — The New Engineering Problem, which sets the frame: the changed economics and why
    the question is urgent when implementation becomes abundant. That leads to Part II, Modeling, which
    develops the Modeling Thesis: make knowledge and intent explicit. That leads to Part III, Alignment, which
    develops the Alignment Thesis: give obligations authority. Modeling comes first as a principled progression
    from representation to authority, not as a dependency. That leads to Part IV, The MAGE Method, which joins
    the two theses — model, align, convert, repeat. That leads to Part V, The Evidence: DocAble end to end,
    where the method came from. That leads to Part VI, The Profession: theory, industrial comparison, scope,
    the profession, and open problems. The book then reaches the Conclusion, The Part That Stays Yours — an
    unnumbered section parallel to the Preface — which returns to the Preface's question, gives the compact
    answer, and asks the converse: what cannot be delegated? Responsibility. After the argument is over, the
    book's apparatus follows in a muted tail: the Appendices, then the Colophon (Dogfooding MAGE), then About
    the Author.</desc>

  <defs>
    <marker id="bm2-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="bm2-ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78716c"/>
    </marker>
    <marker id="bm2-ah-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1300" fill="#fdfcf9"/>

  <!-- CALL-AND-RESPONSE ARC — Preface (call) tied to Conclusion (response), down the left margin -->
  <path d="M 190 104 C 58 280, 58 760, 190 926" fill="none" stroke="#9a3f12" stroke-width="1.8"
        stroke-dasharray="1 0" marker-end="url(#bm2-ah-rust)" opacity="0.85"/>
  <text x="60" y="515" transform="rotate(-90 60 515)" text-anchor="middle" font-size="13"
        font-style="italic" fill="#9a3f12">call → response · the question returns, and turns</text>

  <!-- PREFACE — the call (unnumbered matter) -->
  <rect x="190" y="48" width="520" height="88" rx="8" fill="#f4efe6" stroke="#1c1917" stroke-width="2.2"/>
  <text x="450" y="86" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Preface</text>
  <text x="450" y="108" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">poses the question:</text>
  <text x="450" y="127" text-anchor="middle" font-size="14" font-style="italic" fill="#1c1917">&#8220;How do we safely grant autonomy to commodity intelligence?&#8221;</text>
  <line x1="450" y1="136" x2="450" y2="160" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm2-ah)"/>

  <!-- PART I — Introduction: The New Engineering Problem (ink frame) -->
  <rect x="190" y="162" width="520" height="96" rx="8" fill="#f6f4ef" stroke="#1c1917" stroke-width="2.2"/>
  <text x="450" y="196" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Part I · Introduction</text>
  <text x="450" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">The New Engineering Problem</text>
  <text x="450" y="242" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">the changed economics — why the question is urgent</text>
  <line x1="450" y1="258" x2="450" y2="282" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm2-ah)"/>

  <!-- PART II — Modeling (green) -->
  <rect x="190" y="284" width="520" height="86" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="450" y="320" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part II · Modeling</text>
  <text x="450" y="348" text-anchor="middle" font-size="15" font-style="italic" fill="#1f7a4d">Modeling Thesis · make knowledge + intent explicit</text>
  <line x1="450" y1="370" x2="450" y2="400" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm2-ah)"/>
  <text x="472" y="384" text-anchor="start" font-size="13" font-style="italic" fill="#57534e">principled progression:</text>
  <text x="472" y="400" text-anchor="start" font-size="13" font-style="italic" fill="#57534e">representation → authority</text>

  <!-- PART III — Alignment (rust) -->
  <rect x="190" y="402" width="520" height="86" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="450" y="438" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part III · Alignment</text>
  <text x="450" y="466" text-anchor="middle" font-size="15" font-style="italic" fill="#9a3f12">Alignment Thesis · give obligations authority</text>
  <line x1="450" y1="488" x2="450" y2="512" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm2-ah)"/>

  <!-- PART IV — The MAGE Method (neutral: joins the two) -->
  <rect x="190" y="514" width="520" height="104" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="450" y="548" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part IV · The MAGE Method</text>
  <text x="450" y="572" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">join the theses</text>
  <text x="450" y="592" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1917">model → align → convert → repeat</text>
  <text x="450" y="611" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">workflow · migration · validation · skills</text>
  <line x1="450" y1="618" x2="450" y2="642" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm2-ah)"/>

  <!-- PART V — The Evidence (fleet blue) -->
  <rect x="190" y="644" width="520" height="86" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="450" y="680" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part V · The Evidence</text>
  <text x="450" y="708" text-anchor="middle" font-size="15" font-style="italic" fill="#2f5169">DocAble, end to end · where the method came from</text>
  <line x1="450" y1="730" x2="450" y2="754" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm2-ah)"/>

  <!-- PART VI — The Profession (purple) -->
  <rect x="190" y="756" width="520" height="94" rx="8" fill="#efeaf4" stroke="#5b4a72" stroke-width="2.4"/>
  <text x="450" y="790" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Part VI · The Profession</text>
  <text x="450" y="816" text-anchor="middle" font-size="15" font-style="italic" fill="#5b4a72">theory · industrial comparison · scope</text>
  <text x="450" y="836" text-anchor="middle" font-size="15" font-style="italic" fill="#5b4a72">the profession · open problems</text>
  <line x1="450" y1="850" x2="450" y2="874" stroke="#1c1917" stroke-width="2.2" marker-end="url(#bm2-ah)"/>

  <!-- CONCLUSION — the response (unnumbered matter, parallel to the Preface) -->
  <rect x="190" y="876" width="520" height="106" rx="8" fill="#f4efe6" stroke="#1c1917" stroke-width="2.4"/>
  <text x="450" y="910" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">Conclusion</text>
  <text x="450" y="934" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">The Part That Stays Yours</text>
  <text x="450" y="956" text-anchor="middle" font-size="14" font-style="italic" fill="#9a3f12">returns to the question, and asks its converse:</text>
  <text x="450" y="975" text-anchor="middle" font-size="14" font-style="italic" fill="#1c1917">&#8220;What cannot be delegated?&#8221; — Responsibility</text>

  <!-- transition out of the argument into the apparatus (muted, dashed) -->
  <line x1="450" y1="982" x2="450" y2="1032" stroke="#a8a29e" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#bm2-ah-muted)"/>
  <text x="480" y="1001" text-anchor="start" font-size="12.5" font-style="italic" fill="#78716c">the argument is over —</text>
  <text x="480" y="1017" text-anchor="start" font-size="12.5" font-style="italic" fill="#78716c">what follows is the book's apparatus</text>

  <!-- APPENDICES (apparatus tail — muted) -->
  <rect x="190" y="1034" width="520" height="60" rx="8" fill="#f5f3ee" stroke="#a8a29e" stroke-width="1.8"/>
  <text x="450" y="1062" text-anchor="middle" font-size="18" font-weight="700" fill="#57534e">Appendices</text>
  <text x="450" y="1082" text-anchor="middle" font-size="13" font-style="italic" fill="#78716c">reference while you build</text>
  <line x1="450" y1="1094" x2="450" y2="1114" stroke="#a8a29e" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#bm2-ah-muted)"/>

  <!-- COLOPHON (apparatus tail — muted; precedes About the Author) -->
  <rect x="190" y="1116" width="520" height="60" rx="8" fill="#f5f3ee" stroke="#a8a29e" stroke-width="1.8"/>
  <text x="450" y="1144" text-anchor="middle" font-size="16" font-weight="700" fill="#57534e">Colophon — Dogfooding MAGE</text>
  <text x="450" y="1164" text-anchor="middle" font-size="13" font-style="italic" fill="#78716c">the book itself, maintained as a modeled, governed artifact</text>
  <line x1="450" y1="1176" x2="450" y2="1196" stroke="#a8a29e" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#bm2-ah-muted)"/>

  <!-- ABOUT THE AUTHOR (apparatus tail — the terminal book-object page) -->
  <rect x="190" y="1198" width="520" height="56" rx="8" fill="#f5f3ee" stroke="#a8a29e" stroke-width="1.8"/>
  <text x="450" y="1231" text-anchor="middle" font-size="16" font-weight="700" fill="#57534e">About the Author</text>
</svg>
