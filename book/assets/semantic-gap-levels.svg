<rect x="262" y="4" width="184" height="44" rx="3" fill="#f0f0f0" stroke="#1c1917" stroke-width=".65"/>
<text x="153" y="23" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">Model–implementation</text>
<text x="153" y="36" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">correspondence</text>
<text x="354" y="29" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">Rendered-page correctness</text>
<rect x="98" y="60" width="146" height="20" rx="3" fill="#f0f0f0" stroke="#1c1917" stroke-width=".65"/>
<rect x="295" y="60" width="151" height="20" rx="3" fill="#f0f0f0" stroke="#1c1917" stroke-width=".65"/>
