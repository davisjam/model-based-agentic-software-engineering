<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid): a two-rung "semantic grain" figure. An obligation that spans a
     row of low-level events cannot be decided from any one of them; lift the mechanism to the completed
     unit of work, where the obligation is legible. Mermaid has no primitive for "one obligation spans N
     events and is invisible in any single one" (a bracket over a sequence), which is the point.
     Palette matches the book accent (#2f5169); muted #57534e; caution red #b23b3b.
     v7 (part3-v7-260814): stripped explanatory microtext — removed the "spans many events — invisible
     in any one" line, the duplicated event list beneath the boxes, the upper-box sub-caption, and the
     green-check / red-cross glyphs. Geometry now carries the distinction: event grain -> lifted
     work-unit boundary, arrow labeled "move mechanism". -->
<!-- semantic-families: agent, modeling, neutral, failure -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360"
     role="group" aria-labelledby="sgTitle sgDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="sgTitle">The semantic gap: move the mechanism to the boundary where the obligation is legible</title>
  <desc id="sgDesc">A property that spans several events cannot be decided from any event alone. The bottom
    row shows a sequence of small low-level events — commits, calls, a turn — under a line reading the
    obligation is not decidable here. An upward arrow, labeled move mechanism, rises to a single wide box
    at the top reading obligation legible, the completed unit of work. Move the mechanism to the earliest
    boundary where the evidence the obligation needs is assembled.</desc>

  <defs>
    <marker id="sgUp" markerWidth="9" markerHeight="9" refX="9" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f5169"/>
    </marker>
  </defs>

  <!-- ================= TOP RUNG — obligation legible ================= -->
  <rect x="150" y="48" width="660" height="76" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="480" y="84" text-anchor="middle" font-size="23.04" font-weight="700" fill="#2f5169">OBLIGATION LEGIBLE</text>
  <text x="480" y="110" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">the completed unit of work</text>

  <!-- the lift arrow: rises from above the event row up to the whole-unit box -->
  <line x1="480" y1="238" x2="480" y2="128" stroke="#2f5169" stroke-width="2.5" marker-end="url(#sgUp)"/>
  <text x="503" y="188" font-size="20" font-style="italic" fill="#2f5169">move mechanism</text>

  <!-- ================= BOTTOM RUNG — too low ================= -->
  <text x="480" y="256" text-anchor="middle" font-size="20" font-style="italic" fill="#b23b3b">obligation not decidable here</text>
  <path d="M170,278 L170,266 L790,266 L790,278" fill="none" stroke="#b23b3b" stroke-width="2"/>

  <!-- row of low-level event ticks -->
  <g fill="#ffffff" stroke="#1c1917" stroke-width="1.6">
    <rect x="170" y="284" width="86" height="44" rx="4"/>
    <rect x="276" y="284" width="86" height="44" rx="4"/>
    <rect x="382" y="284" width="86" height="44" rx="4"/>
    <rect x="492" y="284" width="86" height="44" rx="4"/>
    <rect x="598" y="284" width="86" height="44" rx="4"/>
    <rect x="704" y="284" width="86" height="44" rx="4"/>
  </g>
  <g font-size="19" fill="#1c1917" text-anchor="middle">
    <text x="213" y="312">commit</text>
    <text x="319" y="312">commit</text>
    <text x="425" y="312">commit</text>
    <text x="535" y="312">call</text>
    <text x="641" y="312">call</text>
    <text x="747" y="312">turn</text>
  </g>
</svg>
