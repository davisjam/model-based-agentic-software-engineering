<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 163" width="450" height="163" role="img" aria-labelledby="title desc" font-family="'Source Sans 3', sans-serif">
<title id="title">The semantic gap: two obligations, two enforcement boundaries</title>
<desc id="desc">Two obligations use different boundaries on a sequence of three commits, build, deploy, and browser execution. Commit 3 connects through task completion to model–implementation correspondence. Browser execution connects through integrated execution to rendered-page correctness. Braces below the sequence allow temporary model disagreement across commits and state that earlier checks cannot establish rendered correctness.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c1917"/></marker></defs>
