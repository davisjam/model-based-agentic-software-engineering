<text x="336.0" y="110" text-anchor="middle" font-size="10" fill="#1c1917">deploy</text>
<rect x="382" y="92" width="64" height="28" rx="3" fill="white" stroke="#1c1917" stroke-width=".65"/>
<text x="414.0" y="103" text-anchor="middle" font-size="10" fill="#1c1917">run</text>
<text x="414.0" y="115" text-anchor="middle" font-size="10" fill="#1c1917">(in browser)</text>
