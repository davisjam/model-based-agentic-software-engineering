<text x="370.5" y="74" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">Integrated execution</text>
<rect x="3" y="92" width="58" height="28" rx="3" fill="white" stroke="#1c1917" stroke-width=".65"/>
<text x="32.0" y="110" text-anchor="middle" font-size="10" fill="#1c1917">commit 1</text>
<rect x="79" y="92" width="58" height="28" rx="3" fill="white" stroke="#1c1917" stroke-width=".65"/>
<text x="108.0" y="110" text-anchor="middle" font-size="10" fill="#1c1917">commit 2</text>
<rect x="155" y="92" width="58" height="28" rx="3" fill="white" stroke="#1c1917" stroke-width=".65"/>
<text x="184.0" y="110" text-anchor="middle" font-size="10" fill="#1c1917">commit 3</text>
<rect x="231" y="92" width="58" height="28" rx="3" fill="white" stroke="#1c1917" stroke-width=".65"/>
<text x="260.0" y="110" text-anchor="middle" font-size="10" fill="#1c1917">build</text>
