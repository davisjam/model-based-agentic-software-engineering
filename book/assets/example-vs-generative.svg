<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (ported from the chapter's mermaid fence, label: example-vs-generative).
     Top panel: an example-based test maps one chosen input to one expected output — a single
     labelled point. Bottom panel: a generative test drives inputs drawn from the space through a
     specification check; a failure is shrunk or RCA'd to its spec-point cause. Palette: Umber
     Monograph tokens (panel #f6f4ef the example, fleet #2f5169 the generative machinery,
     churn #b23b3b the counterexample). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510"
     role="group" aria-labelledby="egTitle egDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="egTitle">An example-based test pins one point; a generative test models the whole input space</title>
  <desc id="egDesc">On top, an example-based test maps one chosen input to one expected
    output — a single labelled point. Below, a generative test drives a generator that
    produces inputs drawn from the space into a check of whether the specification holds; on a
    failure the framework shrinks the input to its minimal or spec-point cause. A dotted
    arrow marks the shift from pinning one point to modelling the whole space.</desc>

  <defs>
    <marker id="eg-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="eg-ah-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <!-- ===== example-based test ===== -->
  <rect x="30" y="40" width="900" height="150" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="50" y="74" font-size="20" font-weight="700" fill="#1c1917">Example-based test</text>

  <rect id="input" x="90" y="95" width="260" height="60" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="220" y="132" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">one chosen input</text>

  <!-- edge: input -> output -->
  <line x1="350" y1="125" x2="608" y2="125" stroke="#1c1917" stroke-width="2" marker-end="url(#eg-ah)"/>

  <rect id="output" x="610" y="95" width="280" height="60" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="750" y="132" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">one expected output ✓</text>

  <!-- the shift: a panel-to-panel transition between the two fill="none" containers, NOT a node-edge
       relation (a container boundary is context, never an endpoint), so it is intentionally unannotated;
       seated by eye between the panels. -->
  <line x1="480" y1="194" x2="480" y2="266" stroke="#57534e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#eg-ah-mut)"/>
  <text x="500" y="236" font-size="17.28" font-style="italic" fill="#57534e">from one pinned point to the whole space</text>

  <!-- ===== generative test ===== -->
  <rect x="30" y="270" width="900" height="210" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="50" y="304" font-size="20" font-weight="700" fill="#1c1917">Generative test</text>

  <rect x="60" y="350" width="190" height="64" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="155" y="390" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">generator</text>

  <!-- generator -> specification-holds? : the target is a <polygon> diamond, not a lint-legible node;
       seated BY EYE — tail on generator's right rim, head touching the diamond's left vertex (360,382). -->
  <line x1="250" y1="382" x2="358" y2="382" stroke="#1c1917" stroke-width="2" marker-end="url(#eg-ah)"/>
  <text x="309" y="336" text-anchor="middle" font-size="17.28" font-style="italic" fill="#57534e">inputs drawn from the space</text>

  <!-- specification check (decision diamond) -->
  <polygon points="500,322 640,382 500,442 360,382" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="500" y="376" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">specification</text>
  <text x="500" y="400" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">holds?</text>

  <!-- specification-holds? -> shrink/RCA cause : source is the <polygon> diamond (not lint-legible);
       seated BY EYE — tail just outside the diamond's right vertex (640,382), head touching cause's left rim. -->
  <line x1="642" y1="382" x2="687" y2="382" stroke="#1c1917" stroke-width="2" marker-end="url(#eg-ah)"/>
  <text x="664" y="364" text-anchor="middle" font-size="17.28" font-style="italic" fill="#57534e">no</text>

  <rect x="690" y="337" width="215" height="110" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="2"/>
  <text x="797" y="370" text-anchor="middle" font-size="17.28" fill="#b23b3b">shrink / RCA to the</text>
  <text x="797" y="394" text-anchor="middle" font-size="17.28" fill="#b23b3b">minimal or spec-point</text>
  <text x="797" y="418" text-anchor="middle" font-size="17.28" fill="#b23b3b">cause</text>
</svg>
