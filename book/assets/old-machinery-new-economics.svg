<?xml version="1.0" encoding="UTF-8"?>
<!-- Fig 6.5-2 old-machinery-new-economics.svg. Fold to book/assets/. -->
<!-- Old machinery, new economics. SPARSE by design (the ASCII spec's word-lists live in prose + caption,
     not here). The figure carries only the BOUNDARY and the COMPOSITION:
     (1) FOUR PREDECESSOR REPERTOIRES, colour-coded by which MAGE activity they feed. The two REPRESENTATION
         traditions (MBSE / MDE, PL / compilers) are green and feed MODELING; the two ENFORCEMENT traditions
         (formal methods, systems / safety) are rust and feed ALIGNMENT. Colour is an accent — the left/right
         grouping and the arrows carry the pairing in greyscale.
     (2) THE TWO MAGE ACTIVITIES converge on the Governed Engineering Environment (agent-blue — the surface a
         fleet works in), which passes through governance conversion to ENGINEERING CAPITAL.
     (3) THE BOTTOM NOTE states what is actually new: not the moves, the price list. Commodity intelligence
         changes the economics and recombines old machinery around autonomous software work.
     Rhymes with the Fig 0.1-1 theory figure (predecessors -> Modeling / Alignment -> capital), one clean spine. -->
<!-- semantic-families: modeling, governance, agent, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640"
     role="img" aria-labelledby="omneTitle omneDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="omneTitle">Old machinery, new economics: four older engineering repertoires recombine into MAGE's
    two activities and compound into engineering capital under a changed price structure</title>
  <desc id="omneDesc">Four predecessor repertoires sit across the top under the heading older engineering
    repertoires. Two representation traditions on the left — model-based and model-driven engineering, and
    programming languages and compilers — flow down into MODELING, whose job is to make consequential
    knowledge explicit. Two enforcement traditions on the right — formal methods, and systems and safety
    engineering — flow down into ALIGNMENT, whose job is to give selected obligations authority. Modeling and
    Alignment converge on the Governed Engineering Environment, the surface an agent fleet works in. That
    passes through governance conversion into Engineering Capital: recurring judgment made durable. A note at
    the bottom states the thesis — new economics, new composition: MAGE does not invent explicit models,
    constrained representations, verification, or external control. Commodity intelligence changes their
    price list and recombines them around autonomous software work.</desc>

  <defs>
    <marker id="omne-ah-neutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="omne-ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
    <marker id="omne-ah-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- ================= SECTION HEADING ================= -->
  <text x="360" y="30" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2.5" fill="#57534e">OLDER ENGINEERING REPERTOIRES</text>

  <!-- ================= FOUR PREDECESSOR BOXES ================= -->
  <!-- LEFT pair: REPRESENTATION traditions -> feed Modeling (green) -->
  <rect x="20" y="48" width="155" height="58" rx="6" fill="#eef7ee" stroke="#1f7a4d" stroke-width="1.8"/>
  <text x="97" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#155c38">MBSE / MDE</text>
  <text x="97" y="93" text-anchor="middle" font-size="12" fill="#57534e">explicit models</text>

  <rect x="185" y="48" width="155" height="58" rx="6" fill="#eef7ee" stroke="#1f7a4d" stroke-width="1.8"/>
  <text x="262" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#155c38">PL / compilers</text>
  <text x="262" y="93" text-anchor="middle" font-size="12" fill="#57534e">types · constrained IRs</text>

  <!-- RIGHT pair: ENFORCEMENT traditions -> feed Alignment (rust) -->
  <rect x="380" y="48" width="155" height="58" rx="6" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.8"/>
  <text x="457" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3f12">Formal methods</text>
  <text x="457" y="93" text-anchor="middle" font-size="12" fill="#57534e">specs · verification</text>

  <rect x="545" y="48" width="155" height="58" rx="6" fill="#faf1e6" stroke="#9a3f12" stroke-width="1.8"/>
  <text x="622" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3f12">Systems / safety</text>
  <text x="622" y="93" text-anchor="middle" font-size="12" fill="#57534e">boundaries · control</text>

  <!-- predecessor -> activity connectors -->
  <path d="M97,106 C97,140 150,158 158,188" fill="none" stroke="#1f7a4d" stroke-width="2" marker-end="url(#omne-ah-green)"/>
  <path d="M262,106 C262,140 210,158 202,188" fill="none" stroke="#1f7a4d" stroke-width="2" marker-end="url(#omne-ah-green)"/>
  <path d="M457,106 C457,140 510,158 518,188" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#omne-ah-rust)"/>
  <path d="M622,106 C622,140 570,158 562,188" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#omne-ah-rust)"/>

  <!-- ================= THE TWO MAGE ACTIVITIES ================= -->
  <rect x="70" y="190" width="210" height="66" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="175" y="219" text-anchor="middle" font-size="18" font-weight="700" fill="#1f7a4d">MODELING</text>
  <text x="175" y="240" text-anchor="middle" font-size="12" fill="#57534e">make knowledge explicit</text>

  <rect x="440" y="190" width="210" height="66" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="545" y="219" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">ALIGNMENT</text>
  <text x="545" y="240" text-anchor="middle" font-size="12" fill="#57534e">give obligations authority</text>

  <!-- activity -> GEE connectors -->
  <path d="M175,256 C175,290 285,296 315,316" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#omne-ah-neutral)"/>
  <path d="M545,256 C545,290 435,296 405,316" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#omne-ah-neutral)"/>

  <!-- ================= GOVERNED ENGINEERING ENVIRONMENT ================= -->
  <rect x="210" y="318" width="300" height="62" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="360" y="345" text-anchor="middle" font-size="15" font-weight="700" fill="#2f5169">Governed Engineering Environment</text>
  <text x="360" y="366" text-anchor="middle" font-size="12" font-style="italic" fill="#57534e">where both activities meet, over autonomous work</text>

  <!-- GEE -> capital (via governance conversion) -->
  <path d="M360,380 L360,418" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#omne-ah-neutral)"/>
  <text x="372" y="403" text-anchor="start" font-size="12" font-weight="600" fill="#9a3f12">governance conversion</text>

  <!-- ================= ENGINEERING CAPITAL ================= -->
  <rect x="230" y="420" width="260" height="68" rx="10" fill="#e3f0e7" stroke="#155c38" stroke-width="3.4"/>
  <text x="360" y="452" text-anchor="middle" font-size="19" font-weight="800" fill="#155c38">ENGINEERING CAPITAL</text>
  <text x="360" y="474" text-anchor="middle" font-size="12" font-style="italic" fill="#155c38">recurring judgment, made durable</text>

  <path d="M360,488 L360,536" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#omne-ah-neutral)"/>

  <!-- ================= THE NEW-ECONOMICS NOTE ================= -->
  <rect x="170" y="538" width="380" height="66" rx="10" fill="#f3efe7" stroke="#57534e" stroke-width="2.2"/>
  <text x="360" y="566" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">New economics → new composition</text>
  <text x="360" y="588" text-anchor="middle" font-size="12" font-style="italic" fill="#57534e">commodity intelligence changes the price list</text>
</svg>
