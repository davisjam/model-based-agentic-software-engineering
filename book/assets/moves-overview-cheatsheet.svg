<?xml version="1.0" encoding="UTF-8"?>
<!-- RB Engineering-Moves figure — moves-overview-cheatsheet.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 716" width="1000" height="716"
     role="img" aria-labelledby="ovTitle ovDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="ovTitle">Figure B.0-1: ten recurring engineering problems, each paired with the move that retires it</title>
  <desc id="ovDesc">A two-column cheat sheet. The left column names a recurring engineering cost; the right
    column names the transferable move that addresses it. Many truths disagree — make one authoritative.
    Copies drift from authority — derive, don't copy. Model and reality diverge — check correspondence.
    Assurance has invisible holes — derive the obligation set. Checks are too early or too late — put authority
    where the property is legible. Actions evade governance — close the action surface. Rules exist but aren't
    present at the decision — deliver knowledge where the decision occurs. Why gets lost after the change — carry
    cause with consequence. Operators reconstruct the same procedure — externalize the judgment. Changes have
    hidden dependents — make dependencies queryable. These are not ten additions to the method; they are recurring
    realizations of one idea — improve the representation, put authority where obligations are decidable, and make
    useful judgment durable.</desc>

  <defs>
    <marker id="ov-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- kicker -->
  <text x="52" y="44" font-size="24" font-weight="700" fill="#9a3f12">Problem &#8594; Move</text>
  <text x="52" y="70" font-size="20" font-style="italic" fill="#57534e">ten recurring problems and the engineering move that addresses each</text>

