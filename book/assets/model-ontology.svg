<?xml version="1.0" encoding="UTF-8"?>
<!-- Figure 0.3-2 REBUILD (part2-content-revision-260814; folds to book/assets/, replaces the five-box
     model-classes.svg). The six-class WORKING ontology: model classes organized by the engineering
     QUESTION each answers, not by notation. Six blue class boxes (Structural/Behavioral/Ownership/
     Decision/Measurement/Provenance), each with its two questions; "These classes may overlap." Arrow
     down to a gray REPRESENTATION FORM row (graph/registry/state machine/contract/table/quantitative) —
     the orthogonal axis: purpose (blue) is distinct from encoding shape (gray). System Knowledge is NOT
     a 7th box; the below-figure line names it as the connected substrate. Grammar: blue #2f5169 = model;
     gray #57534e = representation form/encoding. Hand-authored (a class grid + rep-form row, not a flow). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" width="960" height="415"
     role="img" aria-labelledby="onTitle onDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="onTitle">MAGE's working model ontology: six model classes and their engineering questions</title>
  <desc id="onDesc">Six model classes, each a box carrying the two engineering questions it answers.
    Structural: what exists, how related. Behavioral: what may happen, in what order. Ownership: who
    controls, for how long. Decision: what is allowed, what choice. Measurement: how much, what envelope.
    Provenance: what happened, what evidence. The classes may overlap. Below them, a separate axis: the
    representation form used to encode a model — graph, registry, state machine, contract, table, or
    quantitative relation — distinct from the class. Connected through shared identity and traceability,
    these models form the system's explicit engineering knowledge.</desc>

  <defs>
    <marker id="on-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">MODEL CLASS &#8212; What engineering question does it answer?</text>

  <!-- ===== row 1 ===== -->
  <rect x="40" y="58" width="276" height="82" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="178" y="90" text-anchor="middle" font-size="19.2" font-weight="700" fill="#2f5169">STRUCTURAL</text>
  <text x="178" y="113" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">what exists?</text>
  <text x="178" y="132" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">how are parts related?</text>

  <rect x="342" y="58" width="276" height="82" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="480" y="90" text-anchor="middle" font-size="19.2" font-weight="700" fill="#2f5169">BEHAVIORAL</text>
  <text x="480" y="113" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">what may happen?</text>
  <text x="480" y="132" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">in what order?</text>

  <rect x="644" y="58" width="276" height="82" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="782" y="90" text-anchor="middle" font-size="19.2" font-weight="700" fill="#2f5169">OWNERSHIP</text>
  <text x="782" y="113" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">who controls it?</text>
  <text x="782" y="132" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">for how long?</text>

  <!-- ===== row 2 ===== -->
  <rect x="40" y="152" width="276" height="82" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="178" y="184" text-anchor="middle" font-size="19.2" font-weight="700" fill="#2f5169">DECISION</text>
  <text x="178" y="207" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">what is allowed?</text>
  <text x="178" y="226" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">which choice?</text>

  <rect x="342" y="152" width="276" height="82" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="480" y="184" text-anchor="middle" font-size="19.2" font-weight="700" fill="#2f5169">MEASUREMENT</text>
  <text x="480" y="207" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">how much?</text>
  <text x="480" y="226" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">what envelope?</text>

  <rect x="644" y="152" width="276" height="82" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="782" y="184" text-anchor="middle" font-size="19.2" font-weight="700" fill="#2f5169">PROVENANCE</text>
  <text x="782" y="207" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">what happened?</text>
  <text x="782" y="226" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">what evidence?</text>

  <text x="480" y="256" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">These classes may overlap.</text>

  <!-- transparent anchor over the six-box class grid + the overlap note: the class end of the many-to-many
       relation. fill/stroke none = zero visual change; the lint reads its geometry like any node. -->
  <rect id="classes" x="40" y="58" width="880" height="204" fill="none" stroke="none"/>
  <!-- double-headed arrow to the orthogonal representation-form axis: the relation is MANY-TO-MANY -->
  <!-- edge: classes -> forms -->
  <line x1="480" y1="264" x2="480" y2="288" stroke="#2f5169" stroke-width="2.2"
        marker-start="url(#on-b)" marker-end="url(#on-b)"/>

  <rect id="forms" x="90" y="290" width="780" height="70" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="480" y="314" text-anchor="middle" font-size="19.2" font-weight="700" letter-spacing="1.2" fill="#57534e">EXAMPLE REPRESENTATION FORMS</text>
  <text x="480" y="342" text-anchor="middle" font-size="19.2" fill="#1c1917">graph &#183; registry &#183; state machine &#183; contract &#183; table &#183; quantitative relation</text>

  <text x="480" y="394" text-anchor="middle" font-size="19.2" font-style="italic" fill="#1c1917">Connected through shared identity and traceability, these models form the system&#8217;s explicit engineering knowledge.</text>
</svg>
