<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: governance-conversion-loop). The hardening loop: rising
     velocity surfaces a recurring failure; judgment diagnoses the CLASS, encodes a durable
     mechanism, and the class cannot recur — so the environment is harder to break and
     velocity climbs again. The same loop shape as the printer loop, escalated: this one
     fires when the printer loop keeps hitting one wall. Palette: Umber Monograph tokens
     (fleet #2f5169 the work + diagnosis, churn #b23b3b the failure, governed #1f7a4d the
     mechanism + prevention, muted #57534e the return path). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 430" width="1250" height="430"
     role="group" aria-labelledby="gcTitle gcDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="gcTitle">Governance conversion — the loop that hardens the environment</title>
  <desc id="gcDesc">A five-step loop drawn left to right. Velocity rises as the fleet
    accelerates. A failure recurs — the same wall hit twice. Judgment diagnoses the class,
    naming the class rather than the instance. A mechanism is encoded — a type, a lint, a
    gate, or a sensor. The class then cannot recur; it is prevented by construction. A dashed
    return path runs back from prevention to rising velocity, labeled: the environment is now
    harder to break, and velocity climbs again. This is the same loop shape as the printer
    loop, escalated — it fires when the printer loop keeps hitting one wall.</desc>

  <defs>
    <marker id="gc-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="gc-ah-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <!-- 1. velocity rises (center 135) -->
  <rect id="velocity-rises" x="30" y="70" width="210" height="104" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="135" y="116" text-anchor="middle" font-size="22.5" font-weight="700" fill="#1c1917">Velocity rises</text>
  <text x="135" y="142" text-anchor="middle" font-size="20.86" font-style="italic" fill="#57534e">the fleet accelerates</text>

  <!-- 2. a failure recurs (center 380) -->
  <rect id="failure-recurs" x="275" y="70" width="210" height="104" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="2"/>
  <text x="380" y="116" text-anchor="middle" font-size="22.5" font-weight="700" fill="#b23b3b">A failure recurs</text>
  <text x="380" y="142" text-anchor="middle" font-size="20.7" font-style="italic" fill="#b23b3b">the same wall, twice</text>

  <!-- 3. diagnose the class (center 625) -->
  <rect id="diagnose" x="520" y="70" width="210" height="104" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="625" y="110" text-anchor="middle" font-size="22.5" font-weight="700" fill="#1c1917">Diagnose</text>
  <text x="625" y="134" text-anchor="middle" font-size="22.5" font-style="italic" fill="#57534e">the class, not</text>
  <text x="625" y="154" text-anchor="middle" font-size="22.5" font-style="italic" fill="#57534e">the instance</text>

  <!-- 4. encode a mechanism (center 870) -->
  <rect id="encode-mechanism" x="765" y="70" width="210" height="104" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="870" y="110" text-anchor="middle" font-size="22.5" font-weight="700" fill="#1c1917">Encode a</text>
  <text x="870" y="134" text-anchor="middle" font-size="22.5" font-weight="700" fill="#1c1917">mechanism</text>
  <text x="870" y="158" text-anchor="middle" font-size="18.11" font-style="italic" fill="#57534e">type · lint · gate · sensor</text>

  <!-- 5. the class cannot recur (center 1115) -->
  <rect id="class-cant-recur" x="1010" y="70" width="210" height="104" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="1115" y="110" text-anchor="middle" font-size="22.5" font-weight="700" fill="#1f7a4d">recurrence</text>
  <text x="1115" y="134" text-anchor="middle" font-size="22.5" font-weight="700" fill="#1f7a4d">blocked</text>
  <text x="1115" y="158" text-anchor="middle" font-size="16.43" font-style="italic" fill="#57534e">prevented by construction</text>

  <!-- forward arrows -->
  <g stroke="#1c1917" stroke-width="2" fill="none">
    <!-- edge: velocity-rises -> failure-recurs -->
    <path d="M240,122 L273,122" marker-end="url(#gc-ah)"/>
    <!-- edge: failure-recurs -> diagnose -->
    <path d="M485,122 L518,122" marker-end="url(#gc-ah)"/>
    <!-- edge: diagnose -> encode-mechanism -->
    <path d="M730,122 L763,122" marker-end="url(#gc-ah)"/>
    <!-- edge: encode-mechanism -> class-cant-recur -->
    <path d="M975,122 L1008,122" marker-end="url(#gc-ah)"/>
  </g>

  <!-- dashed return path: prevention -> velocity -->
  <!-- edge: class-cant-recur .. velocity-rises -->
  <path d="M1115,174 C1115,300 640,330 135,300 L135,178"
        fill="none" stroke="#57534e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#gc-ah-mut)"/>
  <text x="625" y="345" text-anchor="middle" font-size="25" font-style="italic" fill="#57534e">stronger environment &#8594; higher safe velocity</text>
</svg>
