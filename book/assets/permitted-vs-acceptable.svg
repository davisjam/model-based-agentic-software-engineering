<?xml version="1.0" encoding="UTF-8"?>
<!-- Compact teaching geometry; print width is declared by stable figure label in book/data/figure-print-layout.json. Text remains at 9–10 pt in the PDF. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-labelledby="figure-title figure-description" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="figure-title">Obligations and permitted realizations — underconstraint and overconstraint as the two mismatches</title>
<desc id="figure-description">A bounding panel holds the software realization space. Inside it, two overlapping
    rectangles: a solid one for the acceptable realizations, those satisfying every obligation, and a
    dashed one for the realizations the controls permit. Their overlap is the preserved freedom —
    acceptable and permitted. The acceptable-only region at left is overconstraint: acceptable
    alternatives excluded. The permitted-only region at right is underconstraint:
    unacceptable, yet permitted — a correctness risk.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a3f12"/></marker></defs>
<text x="190" y="27" text-anchor="middle" font-size="21" fill="#9a3f12" font-weight="700">A: acceptable</text>
<text x="190" y="51" text-anchor="middle" font-size="20" fill="#57534e">satisfies the obligations</text>
<text x="425" y="75" text-anchor="middle" font-size="20" fill="#1c1917" font-weight="700">P: permitted by controls</text>
<rect x="16" y="91" width="568" height="175" rx="7" fill="#fdfcf9" stroke="#e4e0d8" stroke-width="2"/>
<rect x="28" y="98" width="192" height="156" fill="#faf1e6"/>
