<rect id="acceptable-region" x="28" y="98" width="342" height="156" rx="7" fill="none" stroke="#9a3f12" stroke-width="2"/>
<rect id="permitted-region" x="220" y="98" width="352" height="156" rx="7" fill="none" stroke="#1c1917" stroke-width="2" stroke-dasharray="7 5"/>
<text x="124" y="145" text-anchor="middle" font-size="20" fill="#9a3f12" font-weight="700">overconstraint</text>
<text x="124" y="178" text-anchor="middle" font-size="20" fill="#1c1917">acceptable</text>
<text x="124" y="203" text-anchor="middle" font-size="20" fill="#1c1917">but excluded</text>
<text x="295" y="145" text-anchor="middle" font-size="20" fill="#1c1917" font-weight="700">preserved</text>
<text x="295" y="169" text-anchor="middle" font-size="20" fill="#1c1917" font-weight="700">freedom</text>
<text x="295" y="202" text-anchor="middle" font-size="20" fill="#1c1917">acceptable</text>
<text x="295" y="226" text-anchor="middle" font-size="20" fill="#1c1917">and permitted</text>
<text x="471" y="145" text-anchor="middle" font-size="20" fill="#b23b3b" font-weight="700">underconstraint</text>
<text x="471" y="178" text-anchor="middle" font-size="20" fill="#b23b3b">unacceptable</text>
