<?xml version="1.0" encoding="UTF-8"?>

<!-- Figure 3.4-1 "Governance Conversion" (v7 draft; folds to book/assets/governance-conversion.svg).
     v7 THEORY-CARRYING edit (3.4-1): standardize the five diagnostic categories to
     representation/semantics · obligation · evidence · evaluation · consequence, each mapping to a layer
     (model · invariant · sensor · validator · constraint/gate). Category fix, not cosmetic:
       - branch label "knowledge" -> "representation / semantics" (knowledge is too broad; the model
         carries a representation with semantics).
       - branch label "judgment" -> "evaluation" (a validator supplies repeatable EVALUATION, not all
         engineering judgment — judgment is the residual the validator does not cover).
     The encoded-answer row (model, invariant, sensor, validator, constraint/gate) is unchanged. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" width="1000" height="740"
     role="img" aria-labelledby="gcTitle gcDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="gcTitle">Governance conversion: a failure is diagnosed for what was missing, and the missing
    piece is encoded as durable structure that future work benefits from inheriting as engineering capital</title>
  <desc id="gcDesc">A failure or surprise flows down into one question — what was missing — which fans
    into five branches: missing representation/semantics, obligation, evidence, evaluation, or consequence.
    Each branch encodes a durable answer: a model, an invariant, a sensor, a validator, or a constraint or
    gate. The five converge into durable engineering structure, which future work benefits from inheriting,
    accumulating as engineering capital. The figure's point: a recurring failure is not automatically a request for another
    gate — you diagnose what the environment lacked and encode that.</desc>

  <defs>
    <marker id="gc-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <!-- failure -->
  <rect id="gc-failure" x="375" y="24" width="250" height="52" rx="8" fill="#f6ece9" stroke="#b23b3b" stroke-width="2"/>
  <text x="500" y="56" text-anchor="middle" font-size="21" font-weight="700" fill="#8a2f2f">FAILURE / SURPRISE</text>
  <!-- edge: gc-failure -> gc-diagnosis -->
  <line x1="500" y1="76" x2="500" y2="114.8" stroke="#2f5169" stroke-width="2.2" marker-end="url(#gc-ah)"/>

  <!-- diagnosis question -->
  <rect id="gc-diagnosis" x="360" y="116" width="280" height="52" rx="8" fill="#fbf6e9" stroke="#a6801f" stroke-width="2"/>
  <text x="500" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="#7a5c12">What was missing?</text>

  <!-- Invisible ANCHOR NODES for the 5 diagnostic-category labels: a bare text label has no shape to carry
       an id, so a transparent (fill/stroke none) rect over each label gives the fan-out and the connector
       below it a real node to plug into. Zero visual change; the lint reads the rect geometry. -->
  <g fill="none" stroke="none">
    <rect id="gc-cat-representation" x="80"  y="204" width="60" height="40"/>
    <rect id="gc-cat-obligation"     x="275" y="204" width="60" height="40"/>
    <rect id="gc-cat-evidence"       x="470" y="204" width="60" height="40"/>
    <rect id="gc-cat-evaluation"     x="665" y="204" width="60" height="40"/>
    <rect id="gc-cat-consequence"    x="860" y="204" width="60" height="40"/>
  </g>

  <!-- fan lines to 5 branches (diagnosis question → each category anchor) -->
  <g stroke="#2f5169" stroke-width="2" fill="none" marker-end="url(#gc-ah)">
    <!-- edge: gc-diagnosis -> gc-cat-representation -->
    <path d="M500,168 C300,196 130,196 110,203"/>
    <!-- edge: gc-diagnosis -> gc-cat-obligation -->
    <path d="M500,168 C420,196 320,196 305,203"/>
    <!-- edge: gc-diagnosis -> gc-cat-evidence -->
    <line x1="500" y1="168" x2="500" y2="203"/>
    <!-- edge: gc-diagnosis -> gc-cat-evaluation -->
    <path d="M500,168 C580,196 680,196 695,203"/>
    <!-- edge: gc-diagnosis -> gc-cat-consequence -->
    <path d="M500,168 C700,196 870,196 890,203"/>
  </g>

  <!-- 5 branch labels (what was missing) -->
  <g font-weight="700" fill="#2f5169" text-anchor="middle">
    <text x="110" y="230" font-size="16">representation / semantics</text>
    <text x="305" y="230" font-size="16">obligation</text>
    <text x="500" y="230" font-size="16">evidence</text>
    <text x="695" y="230" font-size="16">evaluation</text>
    <text x="890" y="230" font-size="16">consequence</text>
  </g>

  <!-- connectors category anchor → encoded answer -->
  <g stroke="#2f5169" stroke-width="2" marker-end="url(#gc-ah)">
    <!-- edge: gc-cat-representation -> gc-box-model -->
    <line x1="110" y1="240" x2="110" y2="288.8"/>
    <!-- edge: gc-cat-obligation -> gc-box-invariant -->
    <line x1="305" y1="240" x2="305" y2="288.8"/>
    <!-- edge: gc-cat-evidence -> gc-box-sensor -->
    <line x1="500" y1="240" x2="500" y2="288.8"/>
    <!-- edge: gc-cat-evaluation -> gc-box-validator -->
    <line x1="695" y1="240" x2="695" y2="288.8"/>
    <!-- edge: gc-cat-consequence -> gc-box-gate -->
    <line x1="890" y1="240" x2="890" y2="288.8"/>
  </g>

  <!-- encoded answers -->
  <g fill="#e7edf3" stroke="#2f5169" stroke-width="2">
    <rect id="gc-box-model"     x="40"  y="290" width="140" height="46" rx="6"/>
    <rect id="gc-box-invariant" x="235" y="290" width="140" height="46" rx="6"/>
    <rect id="gc-box-sensor"    x="430" y="290" width="140" height="46" rx="6"/>
    <rect id="gc-box-validator" x="625" y="290" width="140" height="46" rx="6"/>
    <rect id="gc-box-gate"      x="812" y="290" width="156" height="46" rx="6"/>
  </g>
  <g font-size="17" fill="#1c1917" text-anchor="middle">
    <text x="110" y="319">model</text>
    <text x="305" y="319">invariant</text>
    <text x="500" y="319">sensor</text>
    <text x="695" y="319">validator</text>
    <text x="890" y="319">constraint / gate</text>
  </g>

  <!-- converge to durable structure (each encoded answer → the durable-structure box) -->
  <g stroke="#2f5169" stroke-width="2" fill="none" marker-end="url(#gc-ah)">
    <!-- edge: gc-box-model -> gc-durable -->
    <path d="M110,336 C110,380 380,392 452,408"/>
    <!-- edge: gc-box-invariant -> gc-durable -->
    <path d="M305,336 C305,380 440,392 476,408"/>
    <!-- edge: gc-box-sensor -> gc-durable -->
    <line x1="500" y1="336" x2="500" y2="408"/>
    <!-- edge: gc-box-validator -> gc-durable -->
    <path d="M695,336 C695,380 560,392 524,408"/>
    <!-- edge: gc-box-gate -> gc-durable -->
    <path d="M890,336 C890,380 620,392 548,408"/>
  </g>

  <rect id="gc-durable" x="270" y="408" width="460" height="54" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="500" y="441" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">DURABLE ENGINEERING STRUCTURE</text>
  <!-- edge: gc-durable -> gc-future -->
  <line x1="500" y1="462" x2="500" y2="504.8" stroke="#2f5169" stroke-width="2.2" marker-end="url(#gc-ah)"/>

  <rect id="gc-future" x="210" y="506" width="580" height="50" rx="8" fill="#eef3ee" stroke="#3d6b4a" stroke-width="2"/>
  <text x="500" y="537" text-anchor="middle" font-size="19" font-weight="700" fill="#2f5137">FUTURE WORK BENEFITS FROM INHERITING IT</text>
  <!-- edge: gc-future -> gc-capital -->
  <line x1="500" y1="556" x2="500" y2="598.8" stroke="#2f5169" stroke-width="2.2" marker-end="url(#gc-ah)"/>

  <rect id="gc-capital" x="330" y="600" width="340" height="56" rx="10" fill="#3d6b4a" stroke="#2f5137" stroke-width="2"/>
  <text x="500" y="635" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">ENGINEERING CAPITAL</text>

  <text x="500" y="702" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">a failure is not a request for another gate — diagnose what was missing, then encode it</text>
</svg>
