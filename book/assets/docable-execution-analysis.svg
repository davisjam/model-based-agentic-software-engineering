<!-- Custom SVG: compact print composition with explicit node/edge geometry and 9pt minimum labels at its reviewed width. Native monochrome partner remains independent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 232" width="324" height="232" role="img" aria-labelledby="executionTitle executionDesc" font-family="'Source Sans 3', Arial, sans-serif">
<title id="executionTitle">One declared DOCX dependency, two uses</title><desc id="executionDesc">For a DOCX job with table-header repair enabled, the registry declares that table-header repair writes table-header information and table-structure checking reads it. The producer precedes the consumer. The execution machinery uses these declarations to order work; a separate Python analytical graph projects the resource dependency. The figure covers one Office resource dependency only. PDF uses parallel typed declarations checked against the executable pipeline and is not drawn here.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#57534e"/></marker></defs>
<rect x="8" y="8" width="308" height="125" rx="3" fill="#faf1e6" stroke="#9a3f12" stroke-width="0.8" />
<text x="162" y="26" font-size="11" fill="#1c1917" text-anchor="middle" font-weight="700"><tspan x="162" dy="0">Registry declarations (DOCX)</tspan></text>
<rect x="40" y="42" width="244" height="34" rx="3" fill="#fff" stroke="#57534e" stroke-width="0.8" />
<text x="162" y="55" font-size="10" fill="#1c1917" text-anchor="middle" font-weight="700"><tspan x="162" dy="0">Table-header repair</tspan></text>
<text x="162" y="68" font-size="9" fill="#57534e" text-anchor="middle"><tspan x="162" dy="0">writes: table headers</tspan></text>
<polyline points="162,76 162,96" fill="none" stroke="#57534e" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="172" y="90" font-size="9" fill="#57534e" text-anchor="start"><tspan x="172" dy="0">producer before consumer</tspan></text>
<rect x="40" y="96" width="244" height="30" rx="3" fill="#fff" stroke="#57534e" stroke-width="0.8" />
<text x="162" y="108" font-size="10" fill="#1c1917" text-anchor="middle" font-weight="700"><tspan x="162" dy="0">Table-structure check</tspan></text>
<text x="162" y="120" font-size="9" fill="#57534e" text-anchor="middle"><tspan x="162" dy="0">reads: table headers</tspan></text>
<polyline points="83,133 83,172" fill="none" stroke="#57534e" stroke-width="0.8" marker-end="url(#arrow)"/>
<polyline points="241,133 241,172" fill="none" stroke="#57534e" stroke-width="0.8" marker-end="url(#arrow)" stroke-dasharray="3 2"/>
<rect x="39" y="138" width="88" height="13" fill="white"/><rect x="199" y="138" width="84" height="24" fill="white"/><text x="83" y="148" font-size="9" fill="#57534e" text-anchor="middle"><tspan x="83" dy="0">uses declarations</tspan></text>
<text x="241" y="148" font-size="9" fill="#57534e" text-anchor="middle"><tspan x="241" dy="0">projects resource</tspan></text>
<text x="241" y="159" font-size="9" fill="#57534e" text-anchor="middle"><tspan x="241" dy="0">edges</tspan></text>
<rect x="8" y="172" width="150" height="51" rx="3" fill="#e7edf3" stroke="#2f5169" stroke-width="0.8" />
<text x="83" y="188" font-size="10" fill="#2f5169" text-anchor="middle" font-weight="700"><tspan x="83" dy="0">Execution machinery</tspan></text>
<text x="83" y="202" font-size="9" fill="#57534e" text-anchor="middle"><tspan x="83" dy="0">orders repair before check</tspan></text>
<rect x="166" y="172" width="150" height="51" rx="3" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="0.8" />
<text x="241" y="188" font-size="10" fill="#1f7a4d" text-anchor="middle" font-weight="700"><tspan x="241" dy="0">Python analytical graph</tspan></text>
<text x="241" y="202" font-size="9" fill="#57534e" text-anchor="middle"><tspan x="241" dy="0">records the dependency</tspan></text>

</svg>