<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 214" width="315" height="214" role="img" aria-labelledby="executionTitle executionDesc" font-family="&quot;Source Sans 3&quot;, sans-serif"><title id="executionTitle">One declared DOCX dependency, two uses</title><desc id="executionDesc">For a DOCX job with table-header repair enabled, the registry declares that table-header repair writes table-header information and table-structure checking reads it. The producer precedes the consumer. The execution machinery uses these declarations to order work; a separate Python analytical graph projects the resource dependency. The figure covers one Office resource dependency only. PDF uses parallel typed declarations checked against the executable pipeline and is not drawn here.</desc>
<defs><marker id="a2f5169" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#2f5169" /></marker><marker id="a57534e" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#57534e" /></marker><marker id="a086438" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#086438" /></marker><marker id="a1c1917" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#1c1917" /></marker></defs>
