<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h4-ticket-bridge-model.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540"
     role="img" aria-labelledby="h4aTitle h4aDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h4aTitle">The ticket as a bridge model</title>
  <desc id="h4aDesc">Product knowledge — needs, decisions, requirements — and system knowledge — architecture,
    behavior, contracts, state — both feed a change model: a ticket carrying intent, rationale, constraints, and
    acceptance. Realization follows from the ticket, and acceptance evidence follows from realization. The ticket
    binds one change episode to the longer-lived representations on either side rather than duplicating them.</desc>

  <defs>
    <marker id="h4a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
  </defs>

  <rect x="0" y="0" width="640" height="540" fill="#fdfcf9"/>

  <rect x="40" y="36" width="240" height="64" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="160" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1917">PRODUCT KNOWLEDGE</text>
  <text x="160" y="82" text-anchor="middle" font-size="13" fill="#57534e">needs · decisions · requirements</text>

  <rect x="360" y="36" width="240" height="64" rx="8" fill="#eef2f5" stroke="#2f5169" stroke-width="2"/>
  <text x="480" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#2f5169">SYSTEM KNOWLEDGE</text>
  <text x="480" y="82" text-anchor="middle" font-size="13" fill="#2f5169">architecture · behavior · contracts</text>

  <path d="M160,100 C160,150 250,160 300,182" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#h4a-ah)"/>
  <path d="M480,100 C480,150 390,160 340,182" fill="none" stroke="#2f5169" stroke-width="2" marker-end="url(#h4a-ah)"/>

  <rect x="200" y="184" width="240" height="98" rx="10" fill="#f7efe8" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="320" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">CHANGE MODEL — ticket</text>
  <text x="320" y="238" text-anchor="middle" font-size="13" fill="#9a3f12">intent · rationale</text>
  <text x="320" y="258" text-anchor="middle" font-size="13" fill="#9a3f12">constraints · acceptance</text>

  <line x1="320" y1="282" x2="320" y2="320" stroke="#57534e" stroke-width="2.2" marker-end="url(#h4a-ah)"/>
  <rect x="220" y="322" width="200" height="46" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="320" y="350" text-anchor="middle" font-size="15" fill="#1c1917">realization</text>

  <line x1="320" y1="368" x2="320" y2="404" stroke="#57534e" stroke-width="2.2" marker-end="url(#h4a-ah)"/>
  <rect x="200" y="406" width="240" height="46" rx="8" fill="#eef2f5" stroke="#2f5169" stroke-width="2"/>
  <text x="320" y="434" text-anchor="middle" font-size="15" fill="#2f5169">acceptance evidence</text>

  <text x="320" y="498" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">the ticket binds one change episode to the longer-lived models on either side</text>
</svg>
