<?xml version="1.0" encoding="UTF-8"?>
<!-- R54-G figure round — appendix-g-3-behavior-ownership.svg, common vocabulary per R54-FIGURE-MANIFEST. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470"
     role="img" aria-labelledby="g3Title g3Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="g3Title">Behavior plus ownership — a lifecycle with an ownership overlay that authorizes the worker</title>
  <desc id="g3Desc">A behavioral state machine runs left to right: FREE, then LEASED along a solid claim arrow, then
    DONE along a solid complete arrow. A solid expiry arrow returns LEASED to FREE. DONE is terminal: a short red
    X marks no re-entry. Below LEASED, an ownership overlay box records lease owner and lease until, joined to the
    state by a solid specializes arrow — the ownership overlay specializes the LEASED state; ownership is its own working class, shown here joined to behavior. From
    the overlay, a heavy bordered authorizes-action arrow, crossed by a gate glyph, reaches the worker: this is
    where a lease or compare-and-swap gate sits. An invariant band beneath reads LEASED implies exactly one valid
    owner, and FREE implies no active owner. Legend as in Figure C-1; weight, dash, and glyph carry the meaning
    without colour.</desc>

  <defs>
    <marker id="g3-solid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/></marker>
    <marker id="g3-auth" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/></marker>
  </defs>

  <rect x="0" y="0" width="720" height="470" fill="#fdfcf9"/>
  <text x="40" y="34" font-size="15" font-weight="600" fill="#57534e">Question: who may act on this work item now — and what holds if workers overlap or fail?</text>

  <text x="245" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#2f5169" letter-spacing="0.5">BEHAVIORAL STATE</text>

  <!-- states (representation) -->
  <rect x="60" y="76" width="140" height="56" rx="8" fill="#f6ece9" stroke="#8a2f2f" stroke-width="2"/>
  <text x="130" y="111" text-anchor="middle" font-size="19" font-weight="700" fill="#8a2f2f">FREE</text>
  <rect x="290" y="76" width="140" height="56" rx="8" fill="#f6ece9" stroke="#8a2f2f" stroke-width="2"/>
  <text x="360" y="111" text-anchor="middle" font-size="19" font-weight="700" fill="#8a2f2f">LEASED</text>
  <rect x="520" y="76" width="140" height="56" rx="8" fill="#f6ece9" stroke="#8a2f2f" stroke-width="2"/>
  <text x="590" y="111" text-anchor="middle" font-size="19" font-weight="700" fill="#8a2f2f">DONE</text>

  <!-- claim / complete (SOLID) -->
  <line x1="200" y1="104" x2="290" y2="104" stroke="#2f5169" stroke-width="2.2" marker-end="url(#g3-solid)"/>
  <text x="245" y="96" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">claim</text>
  <line x1="430" y1="104" x2="520" y2="104" stroke="#2f5169" stroke-width="2.2" marker-end="url(#g3-solid)"/>
  <text x="475" y="96" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">complete</text>

  <!-- expiry / release LEASED -> FREE (SOLID, curved back) -->
  <path d="M320,132 C270,188 180,188 130,134" fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#g3-solid)"/>
  <text x="225" y="184" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">expiry / release</text>

  <!-- DONE terminal: no re-entry (red X) -->
  <line x1="590" y1="132" x2="590" y2="156" stroke="#b23b3b" stroke-width="2" marker-end="url(#g3-auth)"/>
  <g stroke="#b23b3b" stroke-width="3">
    <line x1="580" y1="160" x2="600" y2="178"/>
    <line x1="600" y1="160" x2="580" y2="178"/>
  </g>
  <text x="618" y="174" font-size="13" font-style="italic" fill="#b23b3b">no re-entry</text>

  <!-- specializes: LEASED -> ownership overlay (SOLID, authored) -->
  <line x1="360" y1="132" x2="360" y2="236" stroke="#2f5169" stroke-width="2.2" marker-end="url(#g3-solid)"/>
  <text x="372" y="192" font-size="13" font-style="italic" fill="#57534e">specializes</text>

  <text x="360" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#2f5169" letter-spacing="0.5">OWNERSHIP OVERLAY</text>
  <!-- ownership overlay (representation) -->
  <rect x="268" y="236" width="184" height="66" rx="8" fill="#f6ece9" stroke="#8a2f2f" stroke-width="2"/>
  <text x="360" y="264" text-anchor="middle" font-size="15" font-weight="700" fill="#8a2f2f">lease_owner = W17</text>
  <text x="360" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#8a2f2f">lease_until = t</text>

  <!-- authorizes action -> worker (HEAVY authority + gate glyph) -->
  <line x1="452" y1="269" x2="560" y2="269" stroke="#b23b3b" stroke-width="3.2" marker-end="url(#g3-auth)"/>
  <text x="506" y="258" text-anchor="middle" font-size="12" font-style="italic" fill="#b23b3b">authorizes action</text>
  <g stroke="#b23b3b" stroke-width="3.6">
    <line x1="500" y1="257" x2="500" y2="281"/>
    <line x1="512" y1="257" x2="512" y2="281"/>
  </g>
  <text x="506" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#b23b3b" letter-spacing="0.5">CHECKED · lease/CAS</text>
  <rect x="560" y="242" width="120" height="54" rx="8" fill="#eef2f5" stroke="#2f5169" stroke-width="2"/>
  <text x="620" y="275" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">worker</text>

  <!-- invariant band -->
  <rect x="60" y="342" width="600" height="58" rx="8" fill="#f7f5f0" stroke="#2b2825" stroke-width="1.4"/>
  <text x="360" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1917">INVARIANT</text>
  <text x="360" y="390" text-anchor="middle" font-size="14" fill="#1c1917">LEASED &#8658; exactly one valid owner    ·    FREE &#8658; no active owner</text>

  <text x="40" y="430" font-size="12" font-style="italic" fill="#57534e">Legend: see Figure C-1.  Ownership is a working class in its own right, shown here joined to behavior.</text>
</svg>
