<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (NEW, Part-3 §XII / FIG-3.6-2). Task-closure drawn as the buried shape:
     a boolean `closure` expression tree over observable predicates (AND of two positive leaves
     and a negated one), the two FLOW-ONLY leaves flagged as weak (dashed churn outline + badge),
     and a derivation arrow from the tree to a pure `closure-strength()` function that emits
     exactly one grade — TASK_CLOSED / FLOW_ONLY / DISABLED — with the finding edge: a FLOW_ONLY
     grade on a major journey is a build finding. A tree-with-a-side-derivation is a non-graph
     geometry Mermaid won't lay out, so it earns the hand-SVG escape. No meaning by colour alone:
     the weak leaves carry a dashed border AND a "flow-only" badge; the grades are named. Palette:
     Umber Monograph tokens (fleet #2f5169 observables, churn #b23b3b flow-only + finding,
     governed #1f7a4d TASK_CLOSED, accent #9a3f12 FLOW_ONLY, muted #57534e DISABLED). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700"
     role="group" aria-labelledby="tcTitle tcDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="tcTitle">Task-closure: an expression tree over observable predicates, and its derived grade</title>
  <desc id="tcDesc">On the left, a boolean closure expression is drawn as a tree. Its root is an AND
    that must hold over three leaves: “artifact rendered” and “control inspectable”, both marked
    observable, and a NOT over “error-fallback shown”. Lower left, two flow-only leaves are flagged
    weak with a dashed border and a flow-only badge: “navigated to a URL” and “a route returned 2xx”;
    they prove a flow ran, not that the task closed. A derivation arrow runs from the tree to a pure
    function, closure-strength(), on the right. That function emits exactly one grade: TASK_CLOSED when
    the strong leaves hold, FLOW_ONLY when only flow-only leaves are present, or DISABLED when no leaves
    are declared. A dashed edge from the two flow-only leaves points at the FLOW_ONLY grade. A finding
    edge leaves FLOW_ONLY: a FLOW_ONLY grade on a major journey is a build finding.</desc>

  <defs>
    <marker id="tc-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="tc-join" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="tc-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/>
    </marker>
  </defs>

  <text x="560" y="36" text-anchor="middle" font-size="22.4" font-weight="700" fill="#1c1917">Task-closure — a `closure` expression tree over observable predicates</text>

  <!-- ===== the AND root ===== -->
  <rect id="and" x="300" y="84" width="180" height="66" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="390" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">AND</text>
  <text x="390" y="140" text-anchor="middle" font-size="22.4" font-style="italic" fill="#57534e">all must hold</text>

  <!-- edges: AND -> three children (fork: one path per branch) -->
  <g fill="none" stroke="#1c1917" stroke-width="2">
    <!-- edge: and -> artifact-rendered -->
    <path d="M300,117 L145,117 L145,208" marker-end="url(#tc-ah)"/>
    <!-- edge: and -> control-inspectable -->
    <path d="M390,150 L390,208" marker-end="url(#tc-ah)"/>
    <!-- edge: and -> not -->
    <path d="M480,117 L620,117 L620,190" marker-end="url(#tc-ah)"/>
  </g>

  <!-- leaf 1 -->
  <rect id="artifact-rendered" x="30" y="210" width="230" height="78" rx="8" fill="#eef4fb" stroke="#2f5169" stroke-width="2"/>
  <text x="145" y="248" text-anchor="middle" font-size="22.4" font-weight="700" fill="#1c1917">artifact rendered</text>
  <text x="145" y="272" text-anchor="middle" font-size="22.4" font-style="italic" fill="#57534e">observable</text>

  <!-- leaf 2 -->
  <rect id="control-inspectable" x="285" y="210" width="230" height="78" rx="8" fill="#eef4fb" stroke="#2f5169" stroke-width="2"/>
  <text x="400" y="248" text-anchor="middle" font-size="22.4" font-weight="700" fill="#1c1917">control inspectable</text>
  <text x="400" y="272" text-anchor="middle" font-size="22.4" font-style="italic" fill="#57534e">observable</text>

  <!-- NOT node -->
  <rect id="not" x="560" y="192" width="120" height="52" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="620" y="226" text-anchor="middle" font-size="22.4" font-weight="700" fill="#1c1917">NOT</text>
  <!-- edge: not -> error-fallback -->
  <path fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#tc-ah)" d="M620,244 L620,298"/>

  <!-- error-fallback leaf -->
  <rect id="error-fallback" x="525" y="300" width="230" height="78" rx="8" fill="#eef4fb" stroke="#2f5169" stroke-width="2"/>
  <text x="640" y="336" text-anchor="middle" font-size="22.4" font-weight="700" fill="#1c1917">error-fallback</text>
  <text x="640" y="360" text-anchor="middle" font-size="22.4" font-weight="700" fill="#1c1917">shown</text>

  <!-- ===== the two FLOW-ONLY leaves, flagged weak ===== -->
  <text x="30" y="428" font-size="22.4" font-weight="700" fill="#b23b3b">flow-only leaves — weak</text>
  <rect x="30" y="442" width="250" height="60" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="145" y="470" text-anchor="middle" font-size="22.4" font-weight="700" fill="#1c1917">navigated to a URL</text>
  <text x="145" y="491" text-anchor="middle" font-size="22.4" font-style="italic" fill="#b23b3b">flow-only</text>

  <rect id="leaf-route" x="30" y="516" width="250" height="60" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="145" y="544" text-anchor="middle" font-size="22.4" font-weight="700" fill="#1c1917">a route returned 2xx</text>
  <text x="145" y="565" text-anchor="middle" font-size="22.4" font-style="italic" fill="#b23b3b">flow-only</text>

  <text x="30" y="606" font-size="22.4" font-style="italic" fill="#b23b3b">they prove a flow ran, not that the task closed.</text>

  <!-- ===== closure-strength(): the pure function ===== -->
  <!-- edge: and -> closure-strength -->
  <path d="M480,123 L758,123" fill="none" stroke="#1c1917" stroke-width="3" marker-end="url(#tc-join)"/>
  <text x="612" y="104" text-anchor="middle" font-size="22.4" font-style="italic" fill="#57534e">derives</text>

  <rect id="closure-strength" x="760" y="96" width="270" height="80" rx="8" fill="#f6f4ef" stroke="#1c1917" stroke-width="2"/>
  <text x="895" y="132" text-anchor="middle" font-size="22.4" font-weight="700" fill="#1c1917">closure-strength()</text>
  <text x="895" y="158" text-anchor="middle" font-size="22.4" font-style="italic" fill="#57534e">a pure function</text>

  <!-- emits-grade: transparent anchor makes the bare annotation a graph node -->
  <rect id="emits-grade" x="800" y="208" width="190" height="24" fill="none" stroke="none"/>
  <!-- edge: closure-strength -> emits-grade -->
  <line x1="895" y1="176" x2="895" y2="206" stroke="#1c1917" stroke-width="2" marker-end="url(#tc-ah)"/>
  <text x="895" y="224" text-anchor="middle" font-size="22.4" font-style="italic" fill="#57534e">emits exactly one grade</text>

  <!-- the three grades -->
  <rect id="task-closed" x="760" y="238" width="270" height="64" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="895" y="268" text-anchor="middle" font-size="22.4" font-weight="700" fill="#1c1917">TASK_CLOSED</text>
  <text x="895" y="290" text-anchor="middle" font-size="22.4" font-style="italic" fill="#57534e">strong leaves hold</text>

  <rect id="flow-only" x="760" y="320" width="270" height="64" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="895" y="350" text-anchor="middle" font-size="22.4" font-weight="700" fill="#1c1917">FLOW_ONLY</text>
  <text x="895" y="372" text-anchor="middle" font-size="22.4" font-style="italic" fill="#57534e">only flow-only leaves</text>

  <rect id="disabled" x="760" y="402" width="270" height="64" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2"/>
  <text x="895" y="432" text-anchor="middle" font-size="22.4" font-weight="700" fill="#57534e">DISABLED</text>
  <text x="895" y="454" text-anchor="middle" font-size="22.4" font-style="italic" fill="#57534e">no leaves declared</text>

  <!-- flow-only leaves point at the FLOW_ONLY grade -->
  <!-- edge: leaf-route .. flow-only -->
  <path d="M278,546 C500,586 726,368 756,368" fill="none" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#tc-red)"/>

  <!-- the finding edge -->
  <!-- edge: flow-only -> build-finding -->
  <path d="M770,378 C700,442 796,528 796,558" fill="none" stroke="#b23b3b" stroke-width="2.5" marker-end="url(#tc-red)"/>
  <rect id="build-finding" x="716.94" y="560" width="396.11" height="80" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="2.5"/>
  <text x="915" y="594" text-anchor="middle" font-size="22.4" font-weight="700" fill="#b23b3b">FLOW_ONLY on a MAJOR journey</text>
  <text x="915" y="620" text-anchor="middle" font-size="22.4" font-weight="700" fill="#b23b3b">→ a build finding</text>
</svg>
