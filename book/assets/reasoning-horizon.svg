<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1108 583" width="1108" height="583" role="img" aria-labelledby="title desc">
<title id="title">Two ways to steer an agent</title><desc id="desc">Two ways to steer an agent. Panel (a) compares reconstructing relevant structure from raw code at higher cost with retrieving it from a purposeful representation at lower cost. Panel (b) shows a loop from proposing a change through running tools, observing results, and revising. It repeats until acceptance criteria are met or work stops.</desc>
<rect width="1108" height="583" fill="white"/>
<g stroke-linejoin="round" stroke-linecap="round">
<rect x="12" y="6" width="1084" height="282" rx="14" fill="white" stroke="black" stroke-width="2"/>
<rect x="12" y="310" width="1084" height="267" rx="14" fill="white" stroke="black" stroke-width="2"/>
<text x="40" y="41" font-family="sans-serif" font-size="30"><tspan font-weight="bold">(a) Context engineering:</tspan> make the right information available</text>
<text x="40" y="345" font-family="sans-serif" font-size="30"><tspan font-weight="bold">(b) Feedback loops:</tspan> improve results through iteration</text>
