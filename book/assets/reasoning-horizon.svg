<?xml version="1.0" encoding="UTF-8"?>
<!-- Fig 1.3-x REDRAW (part1-copyedit-260815; folds over book/assets/reasoning-horizon.svg).
     GRAMMAR FIX: the hinge "the representation decides how much must be reconstructed" was floating text
     under a fork arrow; it is now a real BRANCH NODE ("Representation matters") that the two branches
     fork from. Hand-authored SVG (not Mermaid).
       TOP  — a task exceeds the finite active state, so some reasoning state must be reconstructed.
       HINGE (rust branch node) — REPRESENTATION MATTERS: the representation determines the burden.
       LEFT  — raw implementation as working substrate -> large active state -> repeated reconstruction
               -> relevant structure may be lost -> CHURN.
       RIGHT — purposeful abstraction -> smaller relevant state -> lower reconstruction burden
               -> LONGER COHERENT REASONING.
     Causal spine (strip at foot): finite active state -> reconstruction unavoidable -> representation
     determines burden. Palette: ink #1c1917, muted #57534e, cream #f6f4ef, rust #9a3f12/#fbeee6 (hinge),
     churn #b23b3b/#fbeaea, governed green #1f7a4d/#e3f0e7, page #fdfcf9. Grayscale-survivable: every node
     labelled; the fork and the top-to-bottom order carry the meaning; hue reinforces the terminals. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700"
     role="img" aria-labelledby="rhTitle rhDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="rhTitle">The reasoning horizon</title>
  <desc id="rhDesc">At sufficient scale a task requires more reasoning state than a finite reasoner can
    keep active, so some state must be reconstructed. A branch node, representation matters, states that the
    representation the reasoner works through determines how much of that state must be reconstructed. The
    figure forks from that node. On the left, raw implementation as the working substrate carries a large
    active state, forces repeated reconstruction, and easily loses relevant structure, ending in churn. On
    the right, a purposeful abstraction keeps the question-relevant state smaller, lowers the reconstruction
    burden, and sustains longer coherent reasoning. A causal spine at the foot reads: finite active state,
    reconstruction unavoidable, representation determines burden.</desc>

  <defs>
    <marker id="rh-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#fdfcf9"/>

  <!-- ===== shared top: the horizon condition ===== -->
  <rect id="task" x="270" y="24" width="460" height="60" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>
  <text x="500" y="50" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">Task exceeds the finite active state</text>
  <text x="500" y="72" text-anchor="middle" font-size="18" fill="#57534e">some reasoning state must be reconstructed</text>

  <!-- edge: task -> hinge -->
  <line x1="500" y1="84" x2="500" y2="106" stroke="#1c1917" stroke-width="2" marker-end="url(#rh-k)"/>

  <!-- ===== HINGE: the branch node (rust) ===== -->
  <rect id="hinge" x="310" y="108" width="380" height="64" rx="10" fill="#fbeee6" stroke="#9a3f12" stroke-width="3"/>
  <text x="500" y="135" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1" fill="#9a3f12">REPRESENTATION MATTERS</text>
  <text x="500" y="157" text-anchor="middle" font-size="16.39" fill="#57534e">it determines how much must be reconstructed</text>

  <!-- fork arrows from hinge node to the two branch heads (seated toward each head's centre) -->
  <!-- edge: hinge -> raw-impl -->
  <path fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#rh-k)" d="M360,172 L360,206"/>
  <!-- edge: hinge -> abstraction -->
  <path fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#rh-k)" d="M640,172 L640,206"/>

  <!-- ================= LEFT BRANCH: raw implementation -> churn ================= -->
  <rect id="raw-impl" x="90" y="208" width="320" height="56" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>
  <text x="250" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Raw implementation as</text>
  <text x="250" y="253" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">working substrate</text>
  <!-- edge: raw-impl -> large-active -->
  <line x1="250" y1="264" x2="250" y2="292" stroke="#1c1917" stroke-width="2" marker-end="url(#rh-k)"/>

  <rect id="large-active" x="90" y="294" width="320" height="48" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="250" y="324" text-anchor="middle" font-size="18" fill="#1c1917">Large active state</text>
  <!-- edge: large-active -> repeated-recon -->
  <line x1="250" y1="342" x2="250" y2="370" stroke="#1c1917" stroke-width="2" marker-end="url(#rh-k)"/>

  <rect id="repeated-recon" x="90" y="372" width="320" height="48" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="250" y="402" text-anchor="middle" font-size="18" fill="#1c1917">Repeated reconstruction</text>
  <!-- edge: repeated-recon -> structure-lost -->
  <line x1="250" y1="420" x2="250" y2="448" stroke="#1c1917" stroke-width="2" marker-end="url(#rh-k)"/>

  <rect id="structure-lost" x="90" y="450" width="320" height="48" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="250" y="480" text-anchor="middle" font-size="18" fill="#1c1917">Relevant structure may be lost</text>
  <!-- edge: structure-lost -> churn -->
  <line x1="250" y1="498" x2="250" y2="526" stroke="#1c1917" stroke-width="2" marker-end="url(#rh-k)"/>

  <rect id="churn" x="150" y="528" width="200" height="56" rx="10" fill="#fbeaea" stroke="#b23b3b" stroke-width="2.5"/>
  <text x="250" y="563" text-anchor="middle" font-size="21" font-weight="700" fill="#b23b3b">Churn</text>

  <!-- ================= RIGHT BRANCH: purposeful abstraction -> longer coherent reasoning ============ -->
  <rect id="abstraction" x="590" y="208" width="320" height="56" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="750" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">Purposeful abstraction</text>
  <!-- edge: abstraction -> smaller-state -->
  <line x1="750" y1="264" x2="750" y2="292" stroke="#1c1917" stroke-width="2" marker-end="url(#rh-k)"/>

  <rect id="smaller-state" x="590" y="294" width="320" height="48" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="750" y="324" text-anchor="middle" font-size="18" fill="#1c1917">Smaller relevant state</text>
  <!-- edge: smaller-state -> lower-burden -->
  <line x1="750" y1="342" x2="750" y2="370" stroke="#1c1917" stroke-width="2" marker-end="url(#rh-k)"/>

  <rect id="lower-burden" x="590" y="372" width="320" height="48" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="750" y="402" text-anchor="middle" font-size="18" fill="#1c1917">Lower reconstruction burden</text>
  <!-- edge: lower-burden -> longer-reasoning -->
  <line x1="750" y1="420" x2="750" y2="448" stroke="#1c1917" stroke-width="2" marker-end="url(#rh-k)"/>

  <rect id="longer-reasoning" x="620" y="450" width="260" height="56" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="750" y="475" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">Longer coherent</text>
  <text x="750" y="496" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">reasoning</text>

  <!-- ===== causal spine (foot) ===== -->
  <text x="90" y="626" font-size="18" font-weight="700" letter-spacing="1.5" fill="#57534e">THE CAUSAL SPINE</text>
  <g fill="#f6f4ef" stroke="#57534e" stroke-width="1.8">
    <rect id="spine-fas" x="90" y="636" width="230" height="44" rx="9"/>
    <rect id="spine-recon" x="385" y="636" width="230" height="44" rx="9"/>
    <rect id="spine-rep" x="680" y="636" width="230" height="44" rx="9"/>
  </g>
  <text x="205" y="663" text-anchor="middle" font-size="18" fill="#1c1917">finite active state</text>
  <text x="500" y="663" text-anchor="middle" font-size="16.6" fill="#1c1917">reconstruction unavoidable</text>
  <text x="795" y="663" text-anchor="middle" font-size="13.45" fill="#1c1917">representation determines burden</text>
  <g fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#rh-k)">
    <!-- edge: spine-fas -> spine-recon -->
    <line x1="320" y1="658" x2="383" y2="658"/>
    <!-- edge: spine-recon -> spine-rep -->
    <line x1="615" y1="658" x2="678" y2="658"/>
  </g>
</svg>
