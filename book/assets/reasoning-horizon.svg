<?xml version="1.0" encoding="UTF-8"?>
<!-- R42 REVISION (off-main scratch; folds over book/assets/reasoning-horizon.svg).
     SUPERSEDES round39-260812/figures/reasoning-horizon.svg (which was a single mechanism-only chain).
     Hand-authored SVG (not Mermaid). TWO-BRANCH FORK per editor part1-3.md Fig 1.3-1: a shared top
     (a task requires more state than a finite reasoner can keep active) FORKS on the representation.
       LEFT  — raw implementation as working substrate -> large active state -> repeated reconstruction
               -> relevant structure easily lost -> CHURN.
       RIGHT — purposeful abstraction -> smaller question-relevant state -> lower reconstruction burden
               -> LONGER COHERENT REASONING.
     NOT "faithful reconstruction" (a model can be wrong); NOT "models solve this" (the right branch is a
     GENERIC abstraction principle — Part II establishes what abstraction counts as an engineering model).
     The hinge label states the argument: the representation decides how much must be reconstructed.
     Palette: ink #1c1917, muted #57534e, cream #f6f4ef, churn #b23b3b / fill #fbeaea, governed green
     #1f7a4d / fill #e3f0e7, page #fdfcf9. Grayscale-survivable: every node labelled; the fork and the
     top-to-bottom order carry the meaning; hue only reinforces the two labelled terminals. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700"
     role="group" aria-labelledby="rhTitle rhDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="rhTitle">The reasoning horizon</title>
  <desc id="rhDesc">At sufficient scale a task requires more reasoning state than a finite reasoner can
    keep active, so some state must be reconstructed. The figure forks on the representation the reasoner
    works through. On the left, raw implementation as the working substrate carries a large active state,
    forces repeated reconstruction, and easily loses relevant structure, ending in churn. On the right,
    a purposeful abstraction keeps the question-relevant state smaller, lowers the reconstruction burden,
    and sustains longer coherent reasoning. The representation decides how much of the state must be
    reconstructed.</desc>

  <defs>
    <marker id="rhArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#fdfcf9"/>

  <!-- ===== shared top: the horizon condition ===== -->
  <rect x="270" y="26" width="460" height="60" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>
  <text x="500" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">A task exceeds the finite active state</text>
  <text x="500" y="74" text-anchor="middle" font-size="16" fill="#57534e">some reasoning state must be reconstructed</text>

  <!-- hinge label -->
  <text x="500" y="112" text-anchor="middle" font-size="16" font-style="italic" fill="#9a3f12">The representation decides how much must be reconstructed</text>

  <!-- fork arrows from top node to the two branch heads -->
  <line x1="440" y1="88" x2="250" y2="158" stroke="#1c1917" stroke-width="2" marker-end="url(#rhArrow)"/>
  <line x1="560" y1="88" x2="750" y2="158" stroke="#1c1917" stroke-width="2" marker-end="url(#rhArrow)"/>

  <!-- ================= LEFT BRANCH: raw implementation -> churn ================= -->
  <rect x="90" y="160" width="320" height="56" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.4"/>
  <text x="250" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">Raw implementation as</text>
  <text x="250" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">working substrate</text>
  <line x1="250" y1="216" x2="250" y2="246" stroke="#1c1917" stroke-width="2" marker-end="url(#rhArrow)"/>

  <rect x="90" y="248" width="320" height="50" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="250" y="279" text-anchor="middle" font-size="17" fill="#1c1917">Large active state</text>
  <line x1="250" y1="298" x2="250" y2="328" stroke="#1c1917" stroke-width="2" marker-end="url(#rhArrow)"/>

  <rect x="90" y="330" width="320" height="50" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="250" y="361" text-anchor="middle" font-size="17" fill="#1c1917">Repeated reconstruction</text>
  <line x1="250" y1="380" x2="250" y2="410" stroke="#1c1917" stroke-width="2" marker-end="url(#rhArrow)"/>

  <rect x="90" y="412" width="320" height="50" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="250" y="443" text-anchor="middle" font-size="17" fill="#1c1917">Relevant structure easily lost</text>
  <line x1="250" y1="462" x2="250" y2="492" stroke="#1c1917" stroke-width="2" marker-end="url(#rhArrow)"/>

  <rect x="150" y="494" width="200" height="56" rx="10" fill="#fbeaea" stroke="#b23b3b" stroke-width="2.5"/>
  <text x="250" y="529" text-anchor="middle" font-size="21" font-weight="700" fill="#b23b3b">Churn</text>

  <!-- ================= RIGHT BRANCH: purposeful abstraction -> longer coherent reasoning ================= -->
  <rect x="590" y="160" width="320" height="56" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="750" y="194" text-anchor="middle" font-size="17" font-weight="700" fill="#155c38">Purposeful abstraction</text>
  <line x1="750" y1="216" x2="750" y2="246" stroke="#1c1917" stroke-width="2" marker-end="url(#rhArrow)"/>

  <rect x="590" y="248" width="320" height="50" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="750" y="279" text-anchor="middle" font-size="17" fill="#1c1917">Smaller question-relevant state</text>
  <line x1="750" y1="298" x2="750" y2="328" stroke="#1c1917" stroke-width="2" marker-end="url(#rhArrow)"/>

  <rect x="590" y="330" width="320" height="50" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="750" y="361" text-anchor="middle" font-size="17" fill="#1c1917">Lower reconstruction burden</text>
  <line x1="750" y1="380" x2="750" y2="410" stroke="#1c1917" stroke-width="2" marker-end="url(#rhArrow)"/>

  <rect x="620" y="412" width="260" height="56" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="750" y="437" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">Longer coherent</text>
  <text x="750" y="458" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">reasoning</text>

  <!-- caption (rendered by the build from the figure marker; repeated here for standalone viewing) -->
  <text x="500" y="596" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">Figure 1.3-1: The reasoning horizon. At sufficient scale, a task requires more state than a finite</text>
  <text x="500" y="617" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">reasoner can keep active. The representation determines how much of that state must be reconstructed:</text>
  <text x="500" y="638" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">raw implementation carries expensive irrelevant detail, while purposeful abstraction can keep the</text>
  <text x="500" y="659" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">question-relevant state smaller.</text>
</svg>
