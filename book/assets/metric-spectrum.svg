<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: metric-spectrum). R45c REFRAME — from authority-hardness (hard→soft
     "a machine can block on the hard end") to EVIDENCE-DECIDABILITY. The axis now runs
     machine-decidable evidence ←→ judgment-dependent evidence. Authority is NOT on this axis: it
     belongs to the validator or gate that consumes the evidence, not to the number itself. Palette:
     Umber Monograph tokens (fleet #2f5169 machine-decidable, accent #9a3f12 flagship deeper cut,
     muted #57534e judgment-dependent). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420"
     role="group" aria-labelledby="msTitle msDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="msTitle">Evidence and judgment: measurements by how far a machine can decide them</title>
  <desc id="msDesc">Four measurements laid on a left-to-right axis of decidability, not authority. On
    the machine-decidable end sit cold-start latency and the component-distance grade, evidence a
    validator can evaluate the same way every time. In the middle sits the flagship deeper cut,
    model-claim coverage, which names the untested invariant. On the judgment-dependent end sits
    doc-derived-test pinning, which identifies where a person must still interpret meaning. A banner
    states the axis rule: authority belongs to the validator or gate that consumes the evidence, not
    to the number itself.</desc>

  <defs>
    <marker id="ms-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- zone kickers + role-colored underlines -->
  <text x="304" y="52" text-anchor="middle" font-size="21.6" font-style="italic" fill="#2f5169">MACHINE-DECIDABLE EVIDENCE</text>
  <line x1="25" y1="66" x2="584" y2="66" stroke="#2f5169" stroke-width="1.5"/>
  <line x1="600" y1="66" x2="920" y2="66" stroke="#9a3f12" stroke-width="1.5"/>
  <text x="1065" y="52" text-anchor="middle" font-size="21.6" font-style="italic" fill="#57534e">JUDGMENT-DEPENDENT EVIDENCE</text>
  <line x1="935" y1="66" x2="1195" y2="66" stroke="#57534e" stroke-width="1.5"/>

  <!-- machine-decidable card 1: cold-start latency -->
  <rect x="25" y="110" width="272" height="185" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="161" y="150" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">cold-start latency</text>
  <text x="161" y="190" text-anchor="middle" font-size="24" fill="#57534e">ms per service ·</text>
  <text x="161" y="216" text-anchor="middle" font-size="24" fill="#57534e">longest-path Σ</text>
  <text x="161" y="258" text-anchor="middle" font-size="24" font-style="italic" fill="#2f5169">→ evidence for</text>
  <text x="161" y="284" text-anchor="middle" font-size="24" font-style="italic" fill="#2f5169">a perf validator</text>

  <!-- machine-decidable card 2: component-distance grade -->
  <rect x="312" y="110" width="272" height="185" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="448" y="146" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">component-distance</text>
  <text x="448" y="172" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">grade</text>
  <text x="448" y="212" text-anchor="middle" font-size="24" fill="#57534e">block / report /</text>
  <text x="448" y="238" text-anchor="middle" font-size="24" fill="#57534e">suppress</text>
  <text x="448" y="280" text-anchor="middle" font-size="24" font-style="italic" fill="#2f5169">→ evidence a gate acts on</text>

  <!-- flagship card: model-claim coverage -->
  <rect x="600" y="95" width="320" height="200" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="760" y="140" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">model-claim coverage</text>
  <text x="760" y="185" text-anchor="middle" font-size="24" fill="#57534e">is the model claim</text>
  <text x="760" y="211" text-anchor="middle" font-size="24" fill="#57534e">exercised?</text>
  <text x="760" y="255" text-anchor="middle" font-size="24" font-style="italic" fill="#9a3f12">→ names the</text>
  <text x="760" y="281" text-anchor="middle" font-size="24" font-style="italic" fill="#9a3f12">untested invariant</text>

  <!-- judgment-dependent card: doc-derived-test pinning -->
  <rect x="935" y="110" width="260" height="185" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="1065" y="148" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">doc-derived-test</text>
  <text x="1065" y="174" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">pinning</text>
  <text x="1065" y="212" text-anchor="middle" font-size="24" fill="#57534e">is this doc-claim</text>
  <text x="1065" y="238" text-anchor="middle" font-size="24" fill="#57534e">pinned by a test?</text>
  <text x="1065" y="280" text-anchor="middle" font-size="24" font-style="italic" fill="#57534e">→ aims a reader</text>

  <!-- the spine: machine-decidable to judgment-dependent -->
  <line x1="40" y1="320" x2="1160" y2="320" stroke="#1c1917" stroke-width="3" marker-end="url(#ms-ah)"/>
  <text x="40" y="356" font-size="24" font-style="italic" fill="#57534e">a validator evaluates it the same way every time</text>
  <text x="1160" y="356" text-anchor="end" font-size="24" font-style="italic" fill="#57534e">a person must still interpret it</text>

  <!-- the axis rule banner -->
  <text x="600" y="398" text-anchor="middle" font-size="21.6" font-weight="700" fill="#9a3f12">Authority belongs to the validator or gate that consumes the evidence — not to the number.</text>
</svg>
