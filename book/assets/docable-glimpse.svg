<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (NEW, label: docable-glimpse). The Part-1 running glimpse of DocAble (Fork C1): a
     single input->output panel that grounds the abstractions without explaining them. It pictures only the
     OBJECT — what goes in and what comes back — with ZERO internal architecture (the six-part pipeline and
     the case relocate to Part V). An inaccessible source document enters DocAble, a remediated document
     plus an evidence record comes back. DocAble is drawn as a closed box on purpose: what it does, not yet
     how. This must NOT reuse the DocAble pipeline figure.
     Palette: Umber Monograph tokens — churn-red #b23b3b the inaccessible input, fleet #2f5169 DocAble the
     production system, governed green #1f7a4d the accessible output + evidence, ink #1c1917 statements,
     muted #57534e captions, neutral #cfc9c0 the illegible/legible text bars, page #fdfcf9. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 1070 430" width="1070" height="430"
     role="group" aria-labelledby="dgTitle dgDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="dgTitle">A running glimpse of DocAble — one object in, one object back</title>
  <desc id="dgDesc">A single input-to-output panel with no internal structure. On the left, an inaccessible
    document: a page with unlabeled images, no reading order, and no tags, marked not accessible. An arrow
    labelled the upload leads into DocAble, drawn as one closed box — the production system at
    scholaccess.com — with a note that this shows what it does, not yet how. An arrow labelled the file,
    remediated leads out to the right, to an accessible document with described images, reading order, and
    tags, carrying an evidence record in which every fix is explained. The caption reads: here is the kind
    of production system these ideas govern — what it does, not yet how.</desc>

  <defs>
    <marker id="dg-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <rect x="-45" y="0" width="1070" height="430" fill="#fdfcf9"/>

  <!-- edges drawn UNDER nodes: tails run inside source (fill caps), directed heads seat on target perimeter -->
  <!-- edge: input -> docable -->
  <path d="M288,243 L378,243" fill="none" stroke="#1c1917" stroke-width="2.4" marker-end="url(#dg-ah)"/>
  <!-- edge: docable -> output -->
  <path d="M580,243 L718,243" fill="none" stroke="#1c1917" stroke-width="2.4" marker-end="url(#dg-ah)"/>

  <text x="490" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">A running glimpse of DocAble</text>
  <text x="490" y="70" text-anchor="middle" font-size="19.6" font-style="italic" fill="#57534e">One object in, one object back.</text>

  <!-- ================= INPUT: an inaccessible document ================= -->
  <rect id="input" x="82" y="140" width="206" height="170" rx="6" fill="#ffffff" stroke="#b23b3b" stroke-width="2.5"/>
  <path d="M272,140 L288,156 L272,156 Z" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.5"/>
  <!-- illegible text bars -->
  <rect x="126" y="166" width="92" height="7" rx="2" fill="#cfc9c0"/>
  <rect x="126" y="182" width="118" height="7" rx="2" fill="#cfc9c0"/>
  <rect x="126" y="198" width="70" height="7" rx="2" fill="#cfc9c0"/>
  <!-- image placeholder, no alt -->
  <rect x="87.51" y="214" width="194.99" height="46" rx="3" fill="#f6f4ef" stroke="#b23b3b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="185" y="242" text-anchor="middle" font-size="19.6" font-style="italic" fill="#b23b3b">image — no alt text</text>
  <!-- status pill -->
  <rect x="120" y="278" width="130" height="20" rx="10" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.4"/>
  <text x="185" y="292" text-anchor="middle" font-size="19.6" font-weight="700" fill="#b23b3b">not accessible</text>
  <!-- warning badge -->
  <circle cx="272" cy="153" r="13" fill="#b23b3b"/>
  <text x="272" y="158" text-anchor="middle" font-size="19.6" font-weight="700" fill="#ffffff">!</text>
  <!-- label -->
  <text x="185" y="336" text-anchor="middle" font-size="19.6" font-weight="700" fill="#b23b3b">inaccessible document</text>
  <text x="185" y="357" text-anchor="middle" font-size="19.6" font-style="italic" fill="#57534e">unlabeled images · untagged · no reading order</text>

  <!-- ================= DocAble: the closed box ================= -->
  <rect id="docable" x="368.59" y="195" width="222.82" height="96" rx="12" fill="#e7edf3" stroke="#2f5169" stroke-width="3"/>
  <text x="480" y="235" text-anchor="middle" font-size="26" font-weight="700" fill="#2f5169">DocAble</text>
  <text x="480" y="260" text-anchor="middle" font-size="19.6" font-style="italic" fill="#57534e">the production system</text>
  <text x="480" y="279" text-anchor="middle" font-size="19.6" fill="#57534e">scholaccess.com</text>

  <!-- arrow labels (paths themselves drawn under nodes, above) -->
  <text x="319" y="233" text-anchor="middle" font-size="19.6" font-style="italic" fill="#57534e">upload</text>
  <text x="644" y="222" text-anchor="middle" font-size="19.6" font-style="italic" fill="#57534e">remediated</text>
  <text x="644" y="242" text-anchor="middle" font-size="19.6" font-style="italic" fill="#57534e">file</text>

  <!-- ================= OUTPUT: an accessible document + evidence ================= -->
  <rect id="output" x="696.82" y="140" width="196.37" height="170" rx="6" fill="#ffffff" stroke="#1f7a4d" stroke-width="2.5"/>
  <path d="M854,140 L870,156 L854,156 Z" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.5"/>
  <!-- legible text bars -->
  <rect x="736" y="166" width="92" height="7" rx="2" fill="#57534e"/>
  <rect x="736" y="182" width="118" height="7" rx="2" fill="#57534e"/>
  <rect x="736" y="198" width="70" height="7" rx="2" fill="#57534e"/>
  <!-- image placeholder, described -->
  <rect x="698.96" y="214" width="192.08" height="46" rx="3" fill="#eef7ee" stroke="#1f7a4d" stroke-width="1.4"/>
  <text x="795" y="242" text-anchor="middle" font-size="19.6" font-style="italic" fill="#1f7a4d">image — described</text>
  <!-- evidence pill -->
  <rect x="708" y="278" width="174" height="20" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.4"/>
  <text x="795" y="292" text-anchor="middle" font-size="19.6" font-weight="700" fill="#1f7a4d">✓ evidence record</text>
  <!-- check badge -->
  <circle cx="866" cy="153" r="13" fill="#1f7a4d"/>
  <path d="M859,153 l4,4 l7,-8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- label -->
  <text x="795" y="336" text-anchor="middle" font-size="19.6" font-weight="700" fill="#1f7a4d">accessible document + evidence</text>
  <text x="795" y="357" text-anchor="middle" font-size="19.6" font-style="italic" fill="#57534e">tagged · reading order · every fix explained</text>

</svg>
