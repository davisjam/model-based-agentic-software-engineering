<?xml version="1.0" encoding="UTF-8"?>
<!-- RB Engineering-Moves figure — c7-knowledge-at-decision.svg. Fold to book/assets/.
     Colorblind-safe + grayscale-survivable: the knowledge input (stacked-doc shape, dashed edge) and
     the work input (solid box, solid edge) are told apart by SHAPE, DASH, and WEIGHT — the selection
     funnel is a trapezoid — so the figure reads without relying on hue. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520"
     role="img" aria-labelledby="c7Title c7Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="c7Title">C.7 Deliver knowledge where the decision occurs: select the rules relevant to the work and bind them to the decision</title>
  <desc id="c7Desc">A body of rules and a unit of work both feed a selection step. The rules relevant to this
    particular work are filtered through a selection funnel and delivered into the decision, so discovery is a
    property of the environment rather than a test of the actor's memory or search skill. The knowledge input is
    drawn as a stacked-document shape with a dashed edge; the work input as a solid box with a solid edge; the
    funnel is a trapezoid — the roles are legible by shape and weight, not colour.</desc>

  <defs>
    <marker id="c7-ah-dash" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f7a4d"/>
    </marker>
    <marker id="c7-ah-solid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- RULES: stacked-doc shape (knowledge / modeling pole) -->
  <rect x="141.69" y="78" width="216.61" height="64" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2" transform="translate(10 10)"/>
  <rect x="150" y="78" width="200" height="64" rx="8" fill="#e3f0e7" stroke="#155c38" stroke-width="2.4"/>
  <text x="250" y="106" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">RULES</text>
  <text x="250" y="128" text-anchor="middle" font-size="20" font-style="italic" fill="#1f7a4d">the governing corpus</text>

  <!-- WORK: solid box (action / agent pole) -->
  <rect x="631.8" y="78" width="236.4" height="64" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="750" y="106" text-anchor="middle" font-size="20" font-weight="700" fill="#2f5169">WORK</text>
  <text x="750" y="128" text-anchor="middle" font-size="20" font-style="italic" fill="#2f5169">the files being changed</text>

  <!-- RULES edge: DASHED, "relevant to" -->
  <path d="M260,152 C270,210 320,222 396,242" fill="none" stroke="#1f7a4d" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#c7-ah-dash)"/>
  <text x="300" y="200" font-size="20" font-style="italic" fill="#1f7a4d">relevant to</text>

  <!-- WORK edge: SOLID -->
  <path d="M740,152 C730,210 680,222 604,242" fill="none" stroke="#2f5169" stroke-width="2.4" marker-end="url(#c7-ah-solid)"/>
  <text x="640" y="200" font-size="20" font-style="italic" fill="#2f5169">scopes</text>

  <!-- CONTEXT SELECTION funnel (trapezoid, governance) -->
  <polygon points="350,250 650,250 588,320 412,320" fill="#faf1e6" stroke="#9a3f12" stroke-width="3"/>
  <text x="500" y="292" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">CONTEXT SELECTION</text>

  <!-- to DECISION -->
  <line x1="500" y1="320" x2="500" y2="366" stroke="#1c1917" stroke-width="2.6" marker-end="url(#c7-ah-solid)"/>
  <rect x="390" y="370" width="220" height="60" rx="10" fill="#f6f4ef" stroke="#1c1917" stroke-width="2.4"/>
  <text x="500" y="407" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">DECISION</text>

  <!-- footer -->
  <text x="500" y="478" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3f12">Bind the relevant knowledge to the work surface where it matters.</text>
  <text x="500" y="504" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">Make discovery a property of the environment, not a test of memory or search skill.</text>
</svg>
