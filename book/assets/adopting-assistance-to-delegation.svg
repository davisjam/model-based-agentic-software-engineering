<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: adopting-boundary). Appendix figure: the shift from individual ASSISTANCE
     to BOUNDED DELEGATION. Left: the worker sits in the loop and supplies context, judgment, and acceptance
     directly to the agent; the boundary of what the agent may do on its own is narrow. Right: selected
     responsibilities have moved into the engineered environment — models carry context, evidence establishes
     properties, mechanisms constrain and admit — and the worker governs that environment rather than each
     act; the boundary of delegated authority (dashed) has expanded. The point is a shifting boundary, not a
     sequence of maturity levels. Palette: neutral #57534e / #f6f4ef (worker + assistance), green #1f7a4d /
     #e3f0e7 (environment capability), blue #2f5169 / #e7edf3 (governed environment), rust #9a3f12 (the
     expanding delegation boundary), ink #1c1917. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" width="1060" height="580"
     role="img" aria-labelledby="a2dTitle a2dDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="a2dTitle">From assistance to bounded delegation: responsibilities move into the environment and the delegation boundary expands</title>
  <desc id="a2dDesc">Two panels. On the left, under assistance, a worker supplies context, judgment, and
    acceptance directly to an agent, and a narrow dashed boundary marks the little the agent may do on its
    own. A wide arrow points right: selected responsibilities move into the environment. On the right, under
    bounded delegation, a governed environment surrounds the agent — models carry context, evidence
    establishes properties, and mechanisms constrain and admit results — while the worker governs that
    environment rather than each act, and a wider dashed boundary marks the expanded authority the agent may
    exercise on its own. The change is a shifting boundary, not a sequence of maturity levels.</desc>

  <defs>
    <marker id="a2d-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="a2d-big" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <text x="530" y="36" text-anchor="middle" font-size="23" font-weight="700" letter-spacing="0.4" fill="#1c1917">FROM ASSISTANCE TO BOUNDED DELEGATION</text>

  <!-- ===================== LEFT — ASSISTANCE ===================== -->
  <text x="250" y="86" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1" fill="#57534e">ASSISTANCE</text>

  <!-- narrow delegation boundary (dashed rust) around the agent -->
  <rect x="150" y="286" width="200" height="94" rx="12" fill="none" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 5"/>

  <rect x="160" y="112" width="180" height="46" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="250" y="141" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">WORKER</text>

  <g stroke="#57534e" stroke-width="2" fill="none" marker-end="url(#a2d-ah)">
    <line x1="250" y1="158" x2="250" y2="302"/>
  </g>
  <g font-size="14.5" fill="#57534e" text-anchor="start">
    <text x="266" y="196">context</text>
    <text x="266" y="228">judgment</text>
    <text x="266" y="260">acceptance</text>
  </g>

  <rect x="180" y="304" width="140" height="52" rx="9" fill="#eef2f6" stroke="#2f5169" stroke-width="2.4"/>
  <text x="250" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">AGENT</text>

  <text x="250" y="418" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">the worker supplies each judgment directly</text>

  <!-- ===================== MIDDLE — the shift ===================== -->
  <line x1="430" y1="330" x2="600" y2="330" stroke="#9a3f12" stroke-width="3.5" marker-end="url(#a2d-big)"/>
  <text x="515" y="300" text-anchor="middle" font-size="14.5" font-style="italic" fill="#9a3f12">selected responsibilities</text>
  <text x="515" y="318" text-anchor="middle" font-size="14.5" font-style="italic" fill="#9a3f12">move into the environment</text>

  <!-- ===================== RIGHT — BOUNDED DELEGATION ===================== -->
  <text x="820" y="86" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1" fill="#1f7a4d">BOUNDED DELEGATION</text>

  <rect x="620" y="112" width="180" height="46" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="710" y="141" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">WORKER</text>
  <line x1="710" y1="158" x2="710" y2="184" stroke="#57534e" stroke-width="2" fill="none" marker-end="url(#a2d-ah)"/>
  <text x="726" y="178" text-anchor="start" font-size="14.5" font-style="italic" fill="#57534e">governs</text>

  <!-- governed environment -->
  <rect x="616" y="188" width="410" height="212" rx="12" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="821" y="212" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="0.5" fill="#2f5169">GOVERNED ENVIRONMENT</text>

  <g font-size="13.5" fill="#1c1917" text-anchor="middle">
    <rect x="632" y="226" width="122" height="44" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.8"/>
    <text x="693" y="245" font-weight="700">models</text>
    <text x="693" y="262">context</text>
    <rect x="762" y="226" width="118" height="44" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.8"/>
    <text x="821" y="245" font-weight="700">evidence</text>
    <text x="821" y="262">properties</text>
    <rect x="888" y="226" width="122" height="44" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.8"/>
    <text x="949" y="245" font-weight="700">mechanisms</text>
    <text x="949" y="262">constrain · admit</text>
  </g>

  <!-- wide delegation boundary (dashed rust) around the agent inside the environment -->
  <rect x="700" y="298" width="242" height="82" rx="12" fill="none" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="751" y="312" width="140" height="52" rx="9" fill="#eef2f6" stroke="#2f5169" stroke-width="2.4"/>
  <text x="821" y="344" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">AGENT</text>

  <text x="821" y="418" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">context, evidence, and acceptance move into the environment</text>

  <!-- bottom note -->
  <text x="530" y="474" text-anchor="middle" font-size="16" font-style="italic" fill="#9a3f12">The dashed boundary of delegated authority expands — a shifting boundary, not a sequence of maturity levels.</text>
</svg>
