<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored appendix figure: print-readable geometry. Original title/desc, semantic content and native monochrome partner preserved. -->
<!-- Hand-authored SVG (label: adopting-boundary). Appendix figure: the shift from individual ASSISTANCE
     to BOUNDED DELEGATION. Left: the worker sits in the loop and supplies context, judgment, and acceptance
     directly to the agent; the boundary of what the agent may do on its own is narrow. Right: selected
     responsibilities have moved into the engineered environment — models carry context, evidence establishes
     properties, mechanisms constrain and admit — and the worker governs that environment rather than each
     act; the boundary of delegated authority (dashed) has expanded. The point is a shifting boundary, not a
     sequence of maturity levels. Palette: neutral #57534e / #f6f4ef (worker + assistance), green #1f7a4d /
     #e3f0e7 (environment capability), blue #2f5169 / #e7edf3 (governed environment), rust #9a3f12 (the
     expanding delegation boundary), ink #1c1917. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 494" width="1000" height="494" role="img" aria-labelledby="a2dTitle a2dDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="a2dTitle">From assistance to bounded delegation: responsibilities move into the environment and the delegation boundary expands</title>
<desc id="a2dDesc">Two panels. On the left, under assistance, a worker supplies context, judgment, and
    acceptance directly to an agent, and a narrow dashed boundary marks the little the agent may do on its
    own. A wide arrow points right: selected responsibilities move into the environment. On the right, under
    bounded delegation, a governed environment surrounds the agent — models carry context, evidence
    establishes properties, and mechanisms constrain and admit results — while the worker governs that
    environment rather than each act, and a wider dashed boundary marks the expanded authority the agent may
    exercise on its own. The change is a shifting boundary, not a sequence of maturity levels.</desc>
<defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c1917"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57534e"/></marker><marker id="rust-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a3f12"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f5169"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f7a4d"/></marker></defs>
