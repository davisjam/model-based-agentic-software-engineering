<text x="874.0" y="260" text-anchor="middle" font-size="20" fill="#1c1917">constrain · admit</text>
<rect x="600" y="281" width="300" height="69" rx="8" fill="none" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="680" y="288" width="140" height="54" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="750" y="323" text-anchor="middle" font-size="22" fill="#2f5169" font-weight="700">AGENT</text>
<text x="750" y="392" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">selected responsibilities move</text>
<text x="750" y="417" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">into the environment</text>
<text x="500" y="455" text-anchor="middle" font-size="20" fill="#9a3f12" font-style="italic">The dashed boundary of delegated authority expands —</text>
<text x="500" y="480" text-anchor="middle" font-size="20" fill="#9a3f12" font-style="italic">a shifting boundary, not a sequence of maturity levels.</text>
</svg>
