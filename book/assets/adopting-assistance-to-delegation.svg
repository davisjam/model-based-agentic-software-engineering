<rect x="525" y="173" width="450" height="192" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="750" y="202" text-anchor="middle" font-size="21" fill="#2f5169" font-weight="700">GOVERNED ENVIRONMENT</text>
