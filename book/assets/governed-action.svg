<?xml version="1.0" encoding="UTF-8"?>
<!-- RB Part-IV figure — governed-action.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 910" width="1000" height="910"
     role="img" aria-labelledby="gaTitle gaDesc"
     font-family="'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="gaTitle">The governed action — governance surrounds generation.</title>
  <desc id="gaDesc">An agent reasons inside a dashed rust frame labelled the governed engineering
    environment, which supplies relevant models, rules, and context. The environment feeds context down
    into the agent. Observed state enters the agent from the left; the agent emits a proposed action to
    the right. Flow continues down through an action surface, which splits into two governance touch-points:
    structurally prevent and observe or validate. The two rejoin at a last safe boundary, where required
    evidence is re-established before reaching a dark terminal consequence box. A dashed rust feedback path
    carries the resulting event or state back up into the governed environment, closing the loop. The
    governance frame surrounds the whole loop rather than sitting after it as a review stage.</desc>

  <defs>
    <marker id="ga-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
    <marker id="ga-ah-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/></marker>
  </defs>

  <!-- visible figure title -->
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">I &#183; The Governed Action</text>

  <!-- governance frame: governance SURROUNDS generation (dashed rust = governance) -->
  <rect x="60" y="60" width="880" height="772" rx="16" fill="#faf1e6" stroke="#9a3f12" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="500" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">GOVERNED ENGINEERING ENVIRONMENT</text>
  <text x="500" y="128" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">relevant models &#183; rules &#183; context</text>
  <line x1="500" y1="150" x2="500" y2="170" stroke="#57534e" stroke-width="2" marker-end="url(#ga-ah)"/>

  <!-- agent row (blue = the acting party / generation core) -->
  <!-- edge: observed-state -> agent -->
  <line x1="262" y1="211" x2="408" y2="211" stroke="#57534e" stroke-width="2" marker-end="url(#ga-ah)"/>
  <!-- edge: agent -> proposed-action -->
  <line x1="590" y1="211" x2="698" y2="211" stroke="#57534e" stroke-width="2" marker-end="url(#ga-ah)"/>
  <!-- edge: agent -> action-surface -->
  <line x1="500" y1="252" x2="500" y2="298" stroke="#57534e" stroke-width="2" marker-end="url(#ga-ah)"/>
  <rect id="observed-state" x="112" y="182" width="150" height="58" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
  <text x="187" y="216" text-anchor="middle" font-size="14" fill="#1c1917">observed state</text>
  <rect id="agent" x="410" y="170" width="180" height="82" rx="12" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="500" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">AGENT</text>
  <text x="500" y="228" text-anchor="middle" font-size="12" fill="#57534e">reasons &#183; generates</text>
  <rect id="proposed-action" x="700" y="182" width="150" height="58" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="1.5"/>
  <text x="775" y="216" text-anchor="middle" font-size="14" fill="#1c1917">proposed action</text>

  <!-- split to two governance touch-points -->
  <!-- edge: action-surface -> prevent -->
  <path d="M500 356 C 430 385 280 378 280 408" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#ga-ah)"/>
  <!-- edge: action-surface -> observe -->
  <path d="M500 356 C 570 385 720 378 720 408" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#ga-ah)"/>

  <!-- action surface (neutral) -->
  <rect id="action-surface" x="388" y="300" width="224" height="56" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="1.5"/>
  <text x="500" y="333" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">ACTION SURFACE</text>

  <rect id="prevent" x="155" y="410" width="250" height="72" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="280" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">STRUCTURALLY</text>
  <text x="280" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">PREVENT</text>
  <rect id="observe" x="595" y="410" width="250" height="72" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="720" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">OBSERVE /</text>
  <text x="720" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">VALIDATE</text>

  <!-- merge to last safe boundary -->
  <!-- edge: prevent -> boundary -->
  <path d="M280 482 C 300 512 432 500 432 528" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#ga-ah)"/>
  <!-- edge: observe -> boundary -->
  <path d="M720 482 C 700 512 568 500 568 528" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#ga-ah)"/>
  <!-- edge: boundary -> evidence -->
  <line x1="500" y1="592" x2="500" y2="630" stroke="#57534e" stroke-width="2" marker-end="url(#ga-ah)"/>
  <rect id="boundary" x="350" y="530" width="300" height="62" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="500" y="567" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f12">LAST SAFE BOUNDARY</text>

  <!-- edge: evidence -> consequence -->
  <line x1="500" y1="690" x2="500" y2="726" stroke="#57534e" stroke-width="2" marker-end="url(#ga-ah)"/>
  <rect id="evidence" x="368" y="632" width="264" height="58" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="500" y="667" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3f12">RE-ESTABLISH EVIDENCE</text>

  <!-- consequence (dark terminal) -->
  <rect id="consequence" x="400" y="728" width="200" height="62" rx="12" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="500" y="765" text-anchor="middle" font-size="18" font-weight="700" fill="#fdfcf9">CONSEQUENCE</text>

  <!-- lifecycle feedback (dashed rust = governance loop back into the environment) -->
  <path d="M600 759 H 905 V 152" fill="none" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ga-ah-rust)"/>
  <text x="752" y="746" text-anchor="middle" font-size="12" font-style="italic" fill="#9a3f12">event / state &#8594; lifecycle reaction</text>

  <text x="500" y="878" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">Governance surrounds generation — not a review stage appended after it.</text>
</svg>
