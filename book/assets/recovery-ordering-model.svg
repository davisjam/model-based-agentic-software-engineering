<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247.5 223" width="247.5" height="223" role="img" aria-labelledby="roTitle roDesc" font-family="&quot;Source Sans 3&quot;, sans-serif"><ns0:title xmlns:ns0="http://www.w3.org/2000/svg" id="roTitle">Recovery-ordering model: three legal states and one forbidden edge</ns0:title>
  <ns0:desc xmlns:ns0="http://www.w3.org/2000/svg" id="roDesc">Three states in legal order. FALLBACK_STAGED transitions on upload success to
    FALLBACK_UPLOADED, which transitions when durable state is updated to DB_UPDATED. The decisive fact
    is a forbidden edge: FALLBACK_STAGED may not go directly to DB_UPDATED. Durable state may not name an
    artifact recovery has not yet published.</ns0:desc>

  <defs><marker id="a2f5169" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#2f5169"/></marker><marker id="a57534e" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#57534e"/></marker><marker id="a086438" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#086438"/></marker><marker id="a1c1917" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#1c1917"/></marker></defs>
<text x="123.75" y="12.0" text-anchor="middle" font-size="9" fill="#1c1917" font-weight="700">RECOVERY MODEL</text>
<rect x="8" y="26" width="155" height="26" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="1.25"/>
<text x="85.5" y="43.0" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">FALLBACK_STAGED</text>
<rect x="8" y="83" width="155" height="26" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="1.25"/>
<text x="85.5" y="100.0" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">FALLBACK_UPLOADED</text>
<rect x="8" y="140" width="155" height="26" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="1.25"/>
<text x="85.5" y="157.0" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">DB_UPDATED</text>
<path d="M85.5,52 L85.5,82" fill="none" stroke="#2f5169" stroke-width=".8" marker-end="url(#a2f5169)"/>
<text x="91" y="69.0" text-anchor="start" font-size="9" fill="#1c1917" font-style="italic">upload succeeds</text>
<path d="M85.5,109 L85.5,139" fill="none" stroke="#2f5169" stroke-width=".8" marker-end="url(#a2f5169)"/>
<text x="91" y="126.0" text-anchor="start" font-size="9" fill="#1c1917" font-style="italic">durable state updated</text>
<path d="M163,39 L224,39 L224,153 L163,153" fill="none" stroke="#57534e" stroke-width=".8" stroke-dasharray="3 2"/>
<path d="M218 90L230 102M230 90L218 102" stroke="#ad420d" stroke-width="1.3"/>
<text x="123.75" y="182.0" text-anchor="middle" font-size="9" fill="#ad420d" font-style="italic">forbidden / absent transition</text>
<text x="123.75" y="192.8" text-anchor="middle" font-size="9" fill="#ad420d" font-style="italic">not part of the model</text>
<text x="123.75" y="209.0" text-anchor="middle" font-size="9" fill="#ad420d" font-style="italic">The fallback artifact must become durable</text>
<text x="123.75" y="219.8" text-anchor="middle" font-size="9" fill="#ad420d" font-style="italic">before database state may refer to it.</text>
</svg>
