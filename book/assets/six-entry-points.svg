<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: six-entry-points). REPLACES six-company-map.svg for the reordered new §6.3.
     The claim is redesigned: the old figure said "different entry points, common destination" and mapped
     each org onto a MAGE construct, which read retrospectively. This figure LOCATES EMPHASIS only — each
     organization begins with a different problem and invests in a different part of the agentic engineering
     environment. Six rows, one per source (starting problem -> where it invests), badge-coloured by the
     house semantic language: rust for governance/alignment emphasis, green for modeling/knowledge emphasis.
     A final synthesis band reads "MAGE — vocabulary used here to compare", NOT "the whole landscape": the
     bottom row is the measuring vocabulary, not a seventh, superior case. Caption says the figure locates
     emphasis and does NOT rank maturity or claim any source implements the complete method.
     Palette: Umber Monograph tokens (ink #1c1917 names, muted #57534e cells + captions, governed green
     #1f7a4d/#155c38 modeling/knowledge badges + tints #e3f0e7/#eef7f0, accent #9a3f12 governance/alignment
     badges + tint #faf1e6, rule #e4e0d8, page #fdfcf9). Fonts in the 16-28 band at the 1000px reference. -->
<!-- semantic-families: governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720"
     role="group" aria-labelledby="sepTitle sepDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="sepTitle">Six entry points into a shared design space: where each organization begins and where it invests</title>
  <desc id="sepDesc">A table of six industrial systems, each entering the agentic engineering design space
    through a different problem and investing in a different part of the environment. Cloudflare begins from
    institutional policy and invests in machine-readable requirements and review mechanisms — a governance
    emphasis. Spotify begins from fleet-scale change and invests in targeting, verification, and admission —
    a governance emphasis. Shopify begins from organizational knowledge and invests in shared context and
    reusable agent infrastructure — a knowledge emphasis. Docker begins from delegated runtime authority and
    invests in scoped roles, tools, and evaluation — a governance emphasis. Siemens begins from model-first
    engineering and invests in persistent executable engineering representations — a modeling emphasis.
    Zenseact begins from distributed autonomous work and invests in platform boundaries, context, and
    delegation — a knowledge emphasis. A closing band reads: MAGE is the vocabulary used here to compare the
    observed structures, not a seventh case. Badge colour keys emphasis to the house semantic language: rust
    for governance and alignment, green for modeling and knowledge. The figure locates emphasis; it does not
    rank maturity or claim any source implements the complete method.</desc>

  <defs>
    <linearGradient id="sepSynth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3f0e7"/>
      <stop offset="1" stop-color="#faf1e6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#fdfcf9"/>
  <text x="500" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">Six entry points into a shared design space</text>
  <text x="500" y="72" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">Each organization begins with a different problem and invests in a different part of the environment.</text>

  <!-- legend: badge colour keys emphasis to the house semantic language -->
  <g font-size="18" fill="#57534e">
    <rect x="250" y="92" width="18" height="18" rx="3" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
    <text x="276" y="107">Modeling · knowledge emphasis</text>
    <rect x="612" y="92" width="18" height="18" rx="3" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <text x="638" y="107">Governance · alignment emphasis</text>
  </g>

  <!-- header row -->
  <text x="48"  y="152" font-size="18" font-weight="700" letter-spacing="1" fill="#57534e">ORGANIZATION</text>
  <text x="214" y="152" font-size="18" font-weight="700" letter-spacing="1" fill="#57534e">STARTING PROBLEM</text>
  <text x="470" y="152" font-size="18" font-weight="700" letter-spacing="1" fill="#57534e">WHERE IT INVESTS</text>
  <text x="860" y="152" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1" fill="#57534e">EMPHASIS</text>

  <!-- row rules -->
  <g stroke="#e4e0d8" stroke-width="1.5">
    <line x1="40" y1="166" x2="960" y2="166"/>
    <line x1="40" y1="238" x2="960" y2="238"/>
    <line x1="40" y1="310" x2="960" y2="310"/>
    <line x1="40" y1="382" x2="960" y2="382"/>
    <line x1="40" y1="454" x2="960" y2="454"/>
    <line x1="40" y1="526" x2="960" y2="526"/>
  </g>

  <!-- Cloudflare -> governance (rust) -->
  <text x="48"  y="208" font-size="20" font-weight="700" fill="#1c1917">Cloudflare</text>
  <text x="214" y="208" font-size="18" fill="#57534e">Institutional policy</text>
  <text x="470" y="208" font-size="18" font-weight="600" fill="#1c1917">Machine-readable requirements + review</text>
  <rect x="770" y="182" width="180" height="42" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.2"/>
  <text x="860" y="209" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">Governance</text>

  <!-- Spotify -> governance (rust) -->
  <text x="48"  y="280" font-size="20" font-weight="700" fill="#1c1917">Spotify</text>
  <text x="214" y="280" font-size="18" fill="#57534e">Fleet-scale change</text>
  <text x="470" y="280" font-size="18" font-weight="600" fill="#1c1917">Targeting, verification, admission</text>
  <rect x="770" y="254" width="180" height="42" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.2"/>
  <text x="860" y="281" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">Governance</text>

  <!-- Shopify -> knowledge (green) -->
  <text x="48"  y="352" font-size="20" font-weight="700" fill="#1c1917">Shopify</text>
  <text x="214" y="352" font-size="18" fill="#57534e">Organizational knowledge</text>
  <text x="470" y="352" font-size="18" font-weight="600" fill="#1c1917">Shared context + reusable agent infra</text>
  <rect x="770" y="326" width="180" height="42" rx="8" fill="#eef7f0" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="860" y="353" text-anchor="middle" font-size="18" font-weight="700" fill="#1f7a4d">Knowledge</text>

  <!-- Docker -> governance (rust) -->
  <text x="48"  y="424" font-size="20" font-weight="700" fill="#1c1917">Docker</text>
  <text x="214" y="424" font-size="18" fill="#57534e">Delegated runtime authority</text>
  <text x="470" y="424" font-size="18" font-weight="600" fill="#1c1917">Scoped roles, tools, evaluation</text>
  <rect x="770" y="398" width="180" height="42" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.2"/>
  <text x="860" y="425" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">Governance</text>

  <!-- Siemens -> modeling (green, emphasized) -->
  <text x="48"  y="496" font-size="20" font-weight="700" fill="#1c1917">Siemens</text>
  <text x="214" y="496" font-size="18" fill="#57534e">Model-first engineering</text>
  <text x="470" y="496" font-size="18" font-weight="600" fill="#1c1917">Persistent executable representations</text>
  <rect x="770" y="470" width="180" height="42" rx="8" fill="#e3f0e7" stroke="#155c38" stroke-width="2.6"/>
  <text x="860" y="497" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">Modeling</text>

  <!-- Zenseact -> knowledge (green) -->
  <text x="48"  y="568" font-size="20" font-weight="700" fill="#1c1917">Zenseact</text>
  <text x="214" y="568" font-size="18" fill="#57534e">Distributed autonomous work</text>
  <text x="470" y="568" font-size="18" font-weight="600" fill="#1c1917">Platform boundaries, context, delegation</text>
  <rect x="770" y="542" width="180" height="42" rx="8" fill="#eef7f0" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="860" y="569" text-anchor="middle" font-size="18" font-weight="700" fill="#1f7a4d">Knowledge</text>

  <!-- synthesis band: MAGE is the comparing vocabulary, not a seventh case -->
  <line x1="40" y1="598" x2="960" y2="598" stroke="#57534e" stroke-width="2"/>
  <rect x="40" y="602" width="920" height="58" rx="9" fill="url(#sepSynth)" stroke="#e4e0d8" stroke-width="1.2"/>
  <text x="64"  y="638" font-size="20" font-weight="700" fill="#1c1917">MAGE</text>
  <text x="214" y="638" font-size="18" fill="#57534e">the vocabulary used here to compare the observed structures</text>

  <text x="500" y="700" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">The figure locates emphasis; it does not rank maturity or claim any source implements the whole method.</text>
</svg>
