<?xml version="1.0" encoding="UTF-8"?>
<!-- R56-A figure round — governance-conversion-stack.svg, shared vocabulary per R56-FIGURE-MANIFEST. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" width="720" height="660"
     role="img" aria-labelledby="gcTitle gcDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="gcTitle">The Governance-Conversion stack: model the control estate, find its gaps, interpret a
    recurring failure into a durable control, update the estate, iterate</title>
  <desc id="gcDesc">A solid four-move loop. CONTROL ESTATE is the explicit model of rules, gates, models,
    and sensors. Inspecting or querying it exposes GAP or IMPACT — where control is weak or coupled. When a
    failure recurs, INTERPRET converts the failure class into a durable control. UPDATE ESTATE folds that
    control back in, and a curved solid feedback returns to the control estate for the next iteration. This
    is a four-move loop, not six mandatory stages: rule registries, dependency graphs, and indexes are
    possible implementations, not required steps.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <!-- CONTROL ESTATE -->
  <rect id="control-estate" x="180" y="30" width="250" height="80" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="305" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">CONTROL ESTATE</text>
  <text x="305" y="82" text-anchor="middle" font-size="14.4" fill="#57534e">rules &#183; gates &#183;</text>
  <text x="305" y="100" text-anchor="middle" font-size="14.4" fill="#57534e">models &#183; sensors</text>

  <text x="318" y="132" font-size="14.4" font-style="italic" fill="#57534e">inspect / query</text>
  <!-- edge: control-estate -> gap-impact -->
  <line x1="305" y1="110" x2="305" y2="156" stroke="#2f5169" stroke-width="2.4" marker-end="url(#ah)"/>

  <!-- GAP / IMPACT -->
  <rect id="gap-impact" x="180" y="158" width="250" height="80" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="305" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">GAPS / COUPLING</text>
  <text x="305" y="210" text-anchor="middle" font-size="14.4" fill="#57534e">where is control</text>
  <text x="305" y="228" text-anchor="middle" font-size="14.4" fill="#57534e">weak, stale, or entangled?</text>

  <text x="322" y="272" font-size="14.4" font-style="italic" fill="#7a5c12">recurring failure?</text>
  <!-- edge: gap-impact -> interpret -->
  <line x1="305" y1="238" x2="305" y2="296" stroke="#2f5169" stroke-width="2.4" marker-end="url(#ah)"/>

  <!-- INTERPRET (rust) -->
  <rect id="interpret" x="180" y="298" width="250" height="80" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="305" y="328" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">INTERPRET</text>
  <text x="305" y="350" text-anchor="middle" font-size="14.4" fill="#57534e">failure class &#8594;</text>
  <text x="305" y="368" text-anchor="middle" font-size="14.4" fill="#57534e">durable control</text>

  <!-- edge: interpret -> update-estate -->
  <line x1="305" y1="378" x2="305" y2="424" stroke="#2f5169" stroke-width="2.4" marker-end="url(#ah)"/>

  <!-- UPDATE ESTATE -->
  <rect id="update-estate" x="195" y="426" width="220" height="64" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="305" y="464" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">UPDATE ESTATE</text>

  <!-- curved solid feedback UPDATE ESTATE -> CONTROL ESTATE (next iteration) -->
  <!-- edge: update-estate -> control-estate -->
  <path d="M415,458 C560,458 580,200 580,140 C580,90 500,72 432,70"
        stroke="#2f5169" stroke-width="2.4" fill="none" marker-end="url(#ah)"/>
  <text x="592" y="300" font-size="14.4" font-weight="700" fill="#2f5169" transform="rotate(90 592 300)">next iteration</text>

  <!-- legend -->
  <rect x="60" y="522" width="266" height="60" rx="8" fill="#fdfcf9" stroke="#e4e0d8" stroke-width="1.5"/>
  <line x1="78" y1="552" x2="122" y2="552" stroke="#2f5169" stroke-width="2.4" marker-end="url(#ah)"/>
  <text x="132" y="557" font-size="14.4" fill="#57534e">load-bearing loop (all required)</text>

  <!-- caption -->
  <text x="360" y="622" text-anchor="middle" font-size="14.4" font-style="italic" fill="#57534e">Solid loop: the load-bearing composition. Four moves, not six mandatory stages.</text>
</svg>
