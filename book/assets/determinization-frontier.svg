<rect id="repeatable-decision" x="140" y="353" width="320" height="44" rx="7" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="300" y="382" text-anchor="middle" font-size="20" fill="#1c1917" font-weight="700">REPEATABLE DECISION</text>
<text x="300" y="425" text-anchor="middle" font-size="20" fill="#9a3f12" font-weight="700" font-style="italic">← determinization frontier →</text>
</svg>
