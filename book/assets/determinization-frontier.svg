<svg xmlns="http://www.w3.org/2000/svg" width="538.667" height="462.667" viewBox="0 0 404 347" role="img" aria-labelledby="title desc" font-family="'Source Sans 3', sans-serif">
<title id="title">The Determinization Frontier</title>
<desc id="desc">Repeated judgment follows either an already-decidable route or a route through Modeling to change the representation and expose a decidable property. Both join before Alignment, where sensors provide evidence and validators evaluate it before a gate applies the result.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1c1917"/></marker></defs>
<g fill="#1c1917" font-family="'Source Sans 3', sans-serif" font-size="9">
<rect x="65" y="5" width="200" height="25" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="165" y="21" font-size="11" text-anchor="middle" font-weight="700">REPEATED JUDGMENT</text>
<path d="M165,31 L165,67" fill="none" stroke="#1c1917" stroke-width="0.75"/>
<path d="M85,67 L245,67" fill="none" stroke="#1c1917" stroke-width="0.75"/>
<text x="85" y="47" font-size="9" text-anchor="middle" font-style="italic">property requires</text>
<text x="85" y="58" font-size="9" text-anchor="middle" font-style="italic">reconstruction</text>
<text x="245" y="47" font-size="9" text-anchor="middle" font-style="italic">property already</text>
<text x="245" y="58" font-size="9" text-anchor="middle" font-style="italic">decidable</text>
<path d="M85,67 L85,81" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="20" y="83" width="130" height="35" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<text x="85" y="97" font-size="10" text-anchor="middle" font-weight="700">MODELING</text>
<text x="85" y="110" font-size="9" text-anchor="middle" font-style="italic">Change representation</text>
<path d="M85,119 L85,131" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="20" y="133" width="130" height="35" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="85" y="147" font-size="9" text-anchor="middle" font-style="italic">Decidable property</text>
<text x="85" y="158" font-size="9" text-anchor="middle" font-style="italic">(predicate over model)</text>
<path d="M85,169 L85,184" fill="none" stroke="#1c1917" stroke-width="0.75"/>
<path d="M85,184 L245,184" fill="none" stroke="#1c1917" stroke-width="0.75"/>
<path d="M245,67 L245,184" fill="none" stroke="#1c1917" stroke-width="0.75"/>
<path d="M165,184 L165,196" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="55" y="198" width="220" height="35" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<text x="165" y="212" font-size="10" text-anchor="middle" font-weight="700">ALIGNMENT</text>
<text x="165" y="225" font-size="9" text-anchor="middle" font-style="italic">Encode and evaluate the predicate</text>
<path d="M165,234 L165,246" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="83" y="248" width="164" height="22" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="165" y="263" font-size="10" text-anchor="middle" font-weight="700">Sensors and Validators</text>
<path d="M165,271 L165,283" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="83" y="285" width="164" height="22" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="165" y="300" font-size="10" text-anchor="middle" font-weight="700">Gate</text>
<path d="M165,308 L165,320" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="55" y="322" width="220" height="21" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="165" y="337" font-size="11" text-anchor="middle" font-weight="700">REPEATABLE DECISION</text>
<text x="336" y="253" font-size="9" text-anchor="middle" font-style="italic">The determinization frontier:</text>
<text x="336" y="264" font-size="9" text-anchor="middle" font-style="italic">change what is decidable</text>
<text x="336" y="275" font-size="9" text-anchor="middle" font-style="italic">(Modeling), then bind the</text>
<text x="336" y="286" font-size="9" text-anchor="middle" font-style="italic">decision (Alignment).</text>
</g>
</svg>
