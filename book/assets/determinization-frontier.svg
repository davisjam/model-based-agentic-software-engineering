<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: determinization-frontier). NEW simplified figure for Part VI §6.1.5,
     replacing the visually busy old-6.3 figure per the D2->D3 handoff (SS-G Q2: NEW slug
     `determinization-frontier`; retires `determinization-two-paths`, whose two-row layout this figure
     redraws as a single converging tree). Geometry follows the brief's simplified ASCII spec verbatim in
     STRUCTURE: REPEATED JUDGMENT splits on "is the property already decidable over the current artifact?";
     the LEFT route (already decidable) is ALIGNMENT, encoding the predicate directly into a test, validator,
     constraint, or gate; the RIGHT route (requires reconstruction) is MODELING, changing the representation
     into a structured relation first; both routes converge on a shared "predicate over model" step (even
     Alignment's direct encoding IS a predicate evaluated over the artifact taken as its own trivial model)
     before landing on REPEATABLE DECISION. The convergence is drawn SYMMETRICALLY (both branches elbow
     inward to a centered merge point) rather than the ASCII's left-elbow/right-straight offset, which was a
     monospace-grid artifact, not a deliberate asymmetry — a symmetric merge reads cleaner in a real diagram
     and preserves the same structure. Connector color tracks family from the branch split onward (rust =
     governance/Alignment, green = modeling/Modeling) so the reader's eye follows one thesis at a time down
     to the point where both threads visibly merge into one deterministic outcome.
     Palette: Umber Monograph tokens (muted gray #57534e neutral judgment + connectors, governance rust
     #9a3f12 Alignment branch + final crossing, modeling green #1f7a4d Modeling branch, ink #1c1917 box
     names, tints #faf1e6 rust-box fill / #e3f0e7 green-box fill / #f3efe7 neutral-box fill, page #fdfcf9).
     Fonts in the 14-26px band at the 1000px reference width. -->
<!-- semantic-families: governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640"
     role="group" aria-labelledby="dfTitle dfDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="dfTitle">The determinization frontier: two routes by which repeated judgment becomes machinery</title>
  <desc id="dfDesc">A tree diagram. Repeated judgment, at the top, splits into two routes. The left route:
    when a property is already decidable over the current artifact, Alignment encodes the predicate directly
    into a test, validator, constraint, or gate. The right route: when the property requires reconstruction,
    Modeling changes the representation first, producing a structured relation. Both routes converge on a
    shared step, a predicate evaluated over a model — Alignment's test is a predicate over the artifact taken
    as its own trivial model, Modeling's check is a predicate over the externalized structured relation — and
    both land on the same outcome, a repeatable decision. A caption beneath names the boundary between the
    two sides the determinization frontier.</desc>

  <defs>
    <marker id="df-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="df-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
    <marker id="df-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#fdfcf9"/>
  <text x="500" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">The determinization frontier</text>
  <text x="500" y="62" text-anchor="middle" font-size="16.5" font-style="italic" fill="#57534e">Two routes by which repeated judgment becomes machinery</text>

  <!-- root: REPEATED JUDGMENT -->
  <rect x="360" y="84" width="280" height="54" rx="9" fill="#f3efe7" stroke="#57534e" stroke-width="2.2"/>
  <text x="500" y="117" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">REPEATED JUDGMENT</text>

  <!-- T-split: neutral, still undecided -->
  <g fill="none" stroke="#57534e" stroke-width="1.8">
    <path d="M500,138 L500,162"/>
    <path d="M250,162 L750,162"/>
  </g>

  <!-- left branch: rust (Alignment) from the split onward -->
  <path d="M250,162 L250,190" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#df-rust)"/>
  <!-- right branch: green (Modeling) from the split onward -->
  <path d="M750,162 L750,190" fill="none" stroke="#1f7a4d" stroke-width="2" marker-end="url(#df-green)"/>

  <!-- decidability judgment labels -->
  <text x="250" y="207" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">property already</text>
  <text x="250" y="223" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">decidable</text>
  <text x="750" y="207" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">property requires</text>
  <text x="750" y="223" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">reconstruction</text>

  <path d="M250,230 L250,254" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#df-rust)"/>
  <path d="M750,230 L750,254" fill="none" stroke="#1f7a4d" stroke-width="2" marker-end="url(#df-green)"/>

  <!-- ALIGNMENT / MODELING -->
  <rect x="145" y="254" width="210" height="64" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="250" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">ALIGNMENT</text>
  <text x="250" y="302" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">encode predicate</text>

  <rect x="645" y="254" width="210" height="64" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="750" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">MODELING</text>
  <text x="750" y="302" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">change representation</text>

  <path d="M250,318 L250,342" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#df-rust)"/>
  <path d="M750,318 L750,342" fill="none" stroke="#1f7a4d" stroke-width="2" marker-end="url(#df-green)"/>

  <!-- terminal boxes: encoded outcome / structured relation -->
  <rect x="135" y="342" width="230" height="64" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="250" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">test / validator</text>
  <text x="250" y="390" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">constraint / gate</text>

  <rect x="635" y="342" width="230" height="64" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="750" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">structured relation</text>

  <!-- convergence: symmetric elbows into the shared merge point -->
  <path d="M250,406 L250,434 L470,434" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#df-rust)"/>
  <path d="M750,406 L750,434 L530,434" fill="none" stroke="#1f7a4d" stroke-width="2" marker-end="url(#df-green)"/>

  <text x="500" y="454" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">predicate</text>
  <text x="500" y="470" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">over model</text>

  <path d="M500,478 L500,502" fill="none" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#df-rust)"/>

  <!-- outcome: REPEATABLE DECISION -->
  <rect x="340" y="502" width="320" height="66" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="3"/>
  <text x="500" y="542" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">REPEATABLE DECISION</text>

  <text x="500" y="606" text-anchor="middle" font-size="15.5" font-weight="700" font-style="italic" fill="#9a3f12">←— determinization frontier —→</text>
</svg>
