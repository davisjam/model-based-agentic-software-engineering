<path d="M367 52 V68 H450 V79" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#muted-arrow)"/>
<text x="150" y="98" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">property already</text>
