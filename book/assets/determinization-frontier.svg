<path d="M450 127 L450 142" fill="none" stroke="#1f7a4d" stroke-width="2.2" marker-end="url(#green-arrow)"/>
<rect id="alignment" x="27" y="144" width="246" height="58" rx="7" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="150" y="168" text-anchor="middle" font-size="20" fill="#9a3f12" font-weight="700">ALIGNMENT</text>
<text x="150" y="192" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">encode predicate</text>
<rect id="modeling" x="327" y="144" width="246" height="58" rx="7" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
