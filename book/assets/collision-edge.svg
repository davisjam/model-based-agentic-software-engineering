<text x="314" y="158" text-anchor="end" font-size="20" fill="#1c1917">justified by</text>
<path d="M98,288.0 L98,340.0 L160,340.0 L160,370.0" fill="none" stroke="#1c1917" stroke-width="1.4" marker-end="url(#ce-arrow)"/>
<path d="M326,288.0 L326,340.0 L264,340.0 L264,370.0" fill="none" stroke="#1c1917" stroke-width="1.4" marker-end="url(#ce-arrow)"/>
