<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="ceTitle ceDesc" font-family="'Source Sans 3', sans-serif">
<title id="ceTitle">Structure of a governance graph</title>
<desc id="ceDesc">Two governance-graph examples have obligations above controls and a shared resource below. The squash rule is justified by atomic delivery and the diff-size guard by bounded change scope; both read the commit set, with no automatic conflict edge between them. The formatter is justified by formatting consistency and writes source files; the lint check is justified by code quality and reads those files. A dashed arrow declares that the formatter precedes the lint check.</desc>
<defs><marker id="ce-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.0 L10,5.0 L0,10.0 z" fill="#1c1917"/></marker></defs>
<rect x="4.0" y="2.0" width="188" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
<text x="98" y="44.0" text-anchor="middle" font-size="20" fill="#1c1917" font-weight="700">OBLIGATION</text>
<text x="98" y="68.0" text-anchor="middle" font-size="20" fill="#1c1917">Atomic delivery</text>
<rect x="232.0" y="2.0" width="188" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
<text x="326" y="32.0" text-anchor="middle" font-size="20" fill="#1c1917" font-weight="700">OBLIGATION</text>
<text x="326" y="56.0" text-anchor="middle" font-size="20" fill="#1c1917">Bounded change</text>
<text x="326" y="80.0" text-anchor="middle" font-size="20" fill="#1c1917">scope</text>
<rect x="4.0" y="208.0" width="188" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
<text x="98" y="242.0" text-anchor="middle" font-size="20" fill="#1c1917" font-weight="700">CONTROL</text>
<text x="98" y="266.0" text-anchor="middle" font-size="20" fill="#1c1917">Squash rule</text>
<rect x="232.0" y="208.0" width="188" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
<text x="326" y="242.0" text-anchor="middle" font-size="20" fill="#1c1917" font-weight="700">CONTROL</text>
<text x="326" y="266.0" text-anchor="middle" font-size="20" fill="#1c1917">Diff-size guard</text>
<rect x="94.0" y="370.0" width="236" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1.2"/>
<text x="212" y="404.0" text-anchor="middle" font-size="20" fill="#1c1917" font-weight="700">RESOURCE</text>
