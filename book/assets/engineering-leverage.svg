<?xml version="1.0" encoding="UTF-8"?>
<!-- Fig 1.1-1 REDRAW (part1-copyedit-260815; folds over book/assets/new-engineering-problem.svg).
     "Where engineering leverage acts." Two stacked pipelines contrast where the engineer's primary
     engineered object sits. The geometry — not prose arrow labels — carries the shift: the rust-marked
     PRIMARY node moves upstream from Implementation (classical) to Engineering Environment (agentic).
       CLASSICAL — Engineer -> Implementation -> Product; Implementation is the primary engineered object.
       AGENTIC   — Engineer -> Engineering Environment -> Agents -> Implementation -> Product; the
                   Engineering Environment is the primary engineered lever, unpacked in the footer strip.
     Palette: fleet blue #2f5169 (engineer/agents), governed green #155c38/#1f7a4d (environment/product),
     gray #57534e (neutral implementation), rust #9a3f12 (primary-node emphasis), ink #1c1917, page #fdfcf9.
     Grayscale-survivable: every node labelled; the top-to-bottom order and the two-vs-four stages carry
     the meaning; hue and the rust badge only reinforce which node is primary. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"
     role="img" aria-labelledby="levTitle levDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="levTitle">Where engineering leverage acts</title>
  <desc id="levDesc">Two pipelines are stacked for contrast. In the classical pipeline the engineer builds
    the implementation directly, so the implementation is the primary engineered object: Engineer, then
    Implementation, then Product. In the agentic pipeline agents build the implementation inside an
    engineering environment the engineer constructs, so the environment becomes the primary engineered
    lever: Engineer, then Engineering Environment, then Agents, then Implementation, then Product. A rust
    badge marks the primary node in each row; it moves upstream from the implementation to the environment.
    A footer strip unpacks the environment into models, obligations, evidence, controls, and
    infrastructure.</desc>

  <defs>
    <marker id="lev-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#fdfcf9"/>

  <!-- title band -->
  <rect x="0" y="0" width="1000" height="54" fill="#f6f4ef"/>
  <text x="500" y="35" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2" fill="#1c1917">WHERE ENGINEERING LEVERAGE ACTS</text>

  <!-- ===== CLASSICAL row ===== -->
  <text x="30" y="120" font-size="15" font-weight="700" letter-spacing="1.5" fill="#57534e">CLASSICAL</text>
  <text x="30" y="140" font-size="14" font-style="italic" fill="#57534e">engineer writes the implementation</text>

  <!-- Row nudged down so the boxes sit 20px BELOW the italic sub-label (mirrors the AGENTIC row): the
       sub-label at y=140 clears the box tops at y=160, so no box paints over the label (z-order fixed). -->
  <g fill="none" stroke="#57534e" stroke-width="2.4">
    <path d="M300,185 L378,185" marker-end="url(#lev-k)"/>
    <path d="M590,185 L668,185" marker-end="url(#lev-k)"/>
  </g>

  <rect x="150" y="160" width="150" height="50" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="225" y="191" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Engineer</text>

  <!-- primary node: implementation -->
  <rect x="380" y="156" width="210" height="58" rx="9" fill="#f3efe7" stroke="#9a3f12" stroke-width="3.2"/>
  <text x="485" y="189" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Implementation</text>
  <text x="485" y="234" text-anchor="middle" font-size="14.5" font-weight="700" fill="#9a3f12">primary engineered object</text>

  <rect x="670" y="160" width="170" height="50" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="755" y="191" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Product</text>

  <!-- divider between regimes -->
  <line x1="30" y1="252" x2="970" y2="252" stroke="#e4e0d8" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- ===== AGENTIC row ===== -->
  <text x="30" y="298" font-size="15" font-weight="700" letter-spacing="1.5" fill="#155c38">AGENTIC</text>
  <text x="30" y="318" font-size="14" font-style="italic" fill="#57534e">agents write the implementation</text>

  <g fill="none" stroke="#57534e" stroke-width="2.4">
    <path d="M150,363 L173,363" marker-end="url(#lev-k)"/>
    <path d="M370,363 L393,363" marker-end="url(#lev-k)"/>
    <path d="M527,363 L550,363" marker-end="url(#lev-k)"/>
    <path d="M720,363 L743,363" marker-end="url(#lev-k)"/>
  </g>

  <rect x="30" y="338" width="120" height="50" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="90" y="369" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Engineer</text>

  <!-- primary node: engineering environment -->
  <rect x="175" y="332" width="195" height="62" rx="9" fill="#e3f0e7" stroke="#9a3f12" stroke-width="3.4"/>
  <text x="272" y="358" text-anchor="middle" font-size="17" font-weight="700" fill="#155c38">Engineering</text>
  <text x="272" y="379" text-anchor="middle" font-size="17" font-weight="700" fill="#155c38">Environment</text>
  <text x="272" y="416" text-anchor="middle" font-size="14.5" font-weight="700" fill="#9a3f12">primary engineered lever</text>

  <rect x="393" y="338" width="134" height="50" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="460" y="369" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Agents</text>

  <rect x="550" y="338" width="170" height="50" rx="9" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="635" y="369" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">Implementation</text>

  <rect x="743" y="338" width="150" height="50" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="818" y="369" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Product</text>

  <!-- zoom/expansion lines: the wide footer strip is a zoomed-in view of the Engineering Environment node.
       Dotted guides run from the node's two bottom corners out to the footer box's two top corners. -->
  <g fill="none" stroke="#a8a29e" stroke-width="1.2" stroke-dasharray="3 4">
    <line x1="175" y1="394" x2="120" y2="452"/>
    <line x1="370" y1="394" x2="880" y2="452"/>
  </g>

  <!-- footer strip: the environment, unpacked -->
  <rect x="120" y="452" width="760" height="70" rx="12" fill="#eef7f0" stroke="#1f7a4d" stroke-width="2"/>
  <text x="500" y="480" text-anchor="middle" font-size="15" font-weight="700" fill="#155c38">inside the engineering environment</text>
  <text x="500" y="505" text-anchor="middle" font-size="16.5" fill="#57534e">models &#183; obligations &#183; evidence &#183; controls &#183; infrastructure</text>
</svg>
