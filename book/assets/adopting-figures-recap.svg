<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored appendix figure: print-readable geometry. Original title/desc, semantic content and native monochrome partner preserved. -->
<!-- Hand-authored SVG (label: adopting-figures-recap). A recap panel, not a reprint: the four figures this
     appendix operationalizes, each named with its home location and a one-line reminder of what it says, so
     the appendix can refer back rather than re-embed and re-caption them. Value x feasible governability
     (Section 6.3), the governance-conversion loop (Section 3.4), the support-apparatus ratio and the
     redistribution of engineering effort (both Chapter 5). Typographic reference cards — no attempt to redraw
     each figure small. Palette: blue #2f5169, rust #9a3f12, muted #57534e, green #1f7a4d; light tints; ink
     #1c1917; section tags #78716c. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 598" width="1000" height="598" role="img" aria-labelledby="rcTitle rcDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="rcTitle">Four figures this appendix reuses, each with its home location and a one-line reminder</title>
<desc id="rcDesc">A two-by-two panel of reference cards. Value versus feasible governability, from Section 6.3:
    choose where to invest, surface by surface. The governance-conversion loop, from Section 3.4: a failure is
    diagnosed, the missing structure is encoded, and later work inherits it. The support-apparatus ratio, from
    Chapter 5: the environment used to understand and govern realization becomes a substantial engineering product
    in its own right. Where engineering effort moves, from Chapter 5: a redistribution toward deciding what must be
    true and establishing whether it became true, not the disappearance of implementation.</desc>
<defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c1917"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57534e"/></marker><marker id="rust-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a3f12"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f5169"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f7a4d"/></marker></defs>
<text x="500" y="29" text-anchor="middle" font-size="23" fill="#1c1917" font-weight="700">FOUR FIGURES THIS APPENDIX PUTS TO WORK</text>
<text x="500" y="57" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">developed earlier in the book; reused here at organizational scale, not reintroduced</text>
<rect x="22" y="79" width="467" height="244" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="40" y="107" text-anchor="start" font-size="20" fill="#57534e" font-weight="700">SECTION 6.3</text>
<text x="40" y="141" text-anchor="start" font-size="23" fill="#2f5169" font-weight="700">Value × feasible governability</text>
<text x="40" y="173" text-anchor="start" font-size="20" fill="#1c1917">Value asks whether making an obligation</text>
<text x="40" y="198" text-anchor="start" font-size="20" fill="#1c1917">explicit is worth the investment; feasible</text>
<text x="40" y="223" text-anchor="start" font-size="20" fill="#1c1917">governability asks how much of it can be</text>
<text x="40" y="248" text-anchor="start" font-size="20" fill="#1c1917">enforced. Choose where to invest, surface</text>
<text x="40" y="273" text-anchor="start" font-size="20" fill="#1c1917">by surface — not a maturity ladder.</text>
<rect x="511" y="79" width="467" height="244" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="529" y="107" text-anchor="start" font-size="20" fill="#57534e" font-weight="700">SECTION 3.4</text>
<text x="529" y="141" text-anchor="start" font-size="23" fill="#9a3f12" font-weight="700">Governance conversion</text>
<text x="529" y="173" text-anchor="start" font-size="20" fill="#1c1917">The route by which a failure or surprise</text>
<text x="529" y="198" text-anchor="start" font-size="20" fill="#1c1917">becomes durable structure: diagnose what</text>
<text x="529" y="223" text-anchor="start" font-size="20" fill="#1c1917">the environment was missing, encode it as</text>
<text x="529" y="248" text-anchor="start" font-size="20" fill="#1c1917">a model, obligation, evidence, or control,</text>
<text x="529" y="273" text-anchor="start" font-size="20" fill="#1c1917">and later work inherits it.</text>
<rect x="22" y="339" width="467" height="244" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
<text x="40" y="367" text-anchor="start" font-size="20" fill="#57534e" font-weight="700">CHAPTER 5</text>
<text x="40" y="401" text-anchor="start" font-size="23" fill="#57534e" font-weight="700">Support-apparatus ratio</text>
<text x="40" y="433" text-anchor="start" font-size="20" fill="#1c1917">As autonomous realization grows past what</text>
<text x="40" y="458" text-anchor="start" font-size="20" fill="#1c1917">one engineer can inspect, the environment</text>
<text x="40" y="483" text-anchor="start" font-size="20" fill="#1c1917">used to understand, constrain, and evaluate</text>
<text x="40" y="508" text-anchor="start" font-size="20" fill="#1c1917">it becomes a substantial engineering</text>
<text x="40" y="533" text-anchor="start" font-size="20" fill="#1c1917">product — an observation about where</text>
<text x="40" y="558" text-anchor="start" font-size="20" fill="#1c1917">effort accumulates, not a target.</text>
<rect x="511" y="339" width="467" height="244" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
<text x="529" y="367" text-anchor="start" font-size="20" fill="#57534e" font-weight="700">CHAPTER 5</text>
<text x="529" y="401" text-anchor="start" font-size="23" fill="#1f7a4d" font-weight="700">Where engineering effort moves</text>
<text x="529" y="433" text-anchor="start" font-size="20" fill="#1c1917">When realization becomes cheap, effort</text>
<text x="529" y="458" text-anchor="start" font-size="20" fill="#1c1917">shifts upstream to deciding what must be</text>
<text x="529" y="483" text-anchor="start" font-size="20" fill="#1c1917">true and downstream to establishing</text>
<text x="529" y="508" text-anchor="start" font-size="20" fill="#1c1917">whether it became true. A redistribution,</text>
<text x="529" y="533" text-anchor="start" font-size="20" fill="#1c1917">not the disappearance, of implementation.</text>
</svg>
