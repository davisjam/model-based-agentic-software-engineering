<?xml version="1.0" encoding="UTF-8"?>
<!-- Figure 2.6 inset (part2-v8-260814 re-author; folds to book/assets/).
     REVISION per v8 editor guidance (2.6-2): the reference bound is NOT a child of the measured quantity.
     Two peer inputs — a current value and a separately declared reference bound — converge into the
     comparison. The model names what is compared; it does not determine the consequence. Grammar: blue
     #2f5169 = the two modeled inputs and their comparison. A small converging inset (two peers into one
     node, not a top-down split). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300"
     role="img" aria-labelledby="mqTitle mqDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mqTitle">A current value is compared against a separately declared reference bound</title>
  <desc id="mqDesc">Two peer inputs — a current value and a reference bound — converge into a comparison.
    The reference bound is declared separately; it is not derived from the measured quantity. The model says
    what is compared, not what to do about the result.</desc>

  <defs>
    <marker id="mq-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <!-- current value (top-left peer) -->
  <rect id="current-value" x="40" y="46" width="220" height="64" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="150" y="78" text-anchor="middle" font-size="14.56" font-weight="700" fill="#2f5169">CURRENT VALUE</text>
  <text x="150" y="99" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">what is now</text>

  <!-- reference bound (bottom-left peer, declared separately) -->
  <rect id="reference-bound" x="40" y="166" width="220" height="64" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
  <text x="150" y="198" text-anchor="middle" font-size="14.56" font-weight="700" fill="#2f5169">REFERENCE BOUND</text>
  <text x="150" y="219" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">declared separately</text>

  <!-- converge into comparison (two peers into one node; heads seated on the comparison's left border) -->
  <!-- edge: current-value -> comparison -->
  <path d="M260,78 C310,96 336,134 366,134" fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#mq-b)"/>
  <!-- edge: reference-bound -> comparison -->
  <path d="M260,198 C310,180 336,142 366,142" fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#mq-b)"/>

  <!-- comparison -->
  <rect id="comparison" x="368" y="108" width="160" height="60" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="448" y="144" text-anchor="middle" font-size="14.56" font-weight="700" fill="#2f5169">COMPARISON</text>

  <!-- footer: protect the point -->
  <text x="280" y="264" text-anchor="middle" font-size="13.5" font-style="italic" fill="#1c1917">The bound is declared apart from the quantity.</text>
  <text x="280" y="285" text-anchor="middle" font-size="13.5" font-style="italic" fill="#57534e">The model compares; it does not decide the consequence.</text>
</svg>
