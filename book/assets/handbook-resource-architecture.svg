<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="960" viewBox="0 0 440 320" role="img" aria-labelledby="title desc"><title id="title">Resource-aware remediation execution</title><desc id="desc">Streaming extraction separates an input document into a structural skeleton and external media payloads. The central execution path uses a computation graph, configured concurrency limits, active computations, and streamed recombination to produce an output document. Payload references resolve for active consumers and recombination, not for the graph itself. Measurements test the resource and performance models; a side table distinguishes residency, dependency, performance, and measurement roles.</desc><defs><marker id="arrow" markerWidth="4.5" markerHeight="4" refX="4.4" refY="2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L4.5,2 L0,4 Z" fill="black"/></marker></defs><rect width="440" height="320" fill="white"/>
