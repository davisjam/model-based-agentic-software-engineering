<text x="118" y="224.6" text-anchor="start" font-family="Source Sans 3,Arial,sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="black">•  Resolve needed media</text>
<rect x="110" y="239" width="142" height="33" rx="0" fill="white" stroke="black" stroke-width=".75"/>
