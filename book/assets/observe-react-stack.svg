<?xml version="1.0" encoding="UTF-8"?>
<!-- R56-A figure round — observe-react-stack.svg, shared vocabulary per R56-FIGURE-MANIFEST. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620"
     role="img" aria-labelledby="orTitle orDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="orTitle">The Observe-React stack: WATCH to RESPOND is the load-bearing path; heartbeats and
    blocking authority are dashed enhancements</title>
  <desc id="orDesc">An operating model states expected state. The solid load-bearing path runs WATCH — which
    observes the runtime — to RESPOND, which recovers from an observed divergence. Two enhancements attach as
    dashed, open-arrowed strengtheners, not required for the capability. BEAT adds a liveness heartbeat
    alongside the watch-respond path. BLOCK adds authority to prevent unsafe progress. This figure is the
    canonical example of the shared notation: the load-bearing composition is a solid, heavy, filled-arrow
    path; enhancements are light, dashed, open-arrow attachments that read as optional even in grayscale.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0.5,0.5 L9.5,5 L0.5,9.5" fill="none" stroke="#57534e" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- OPERATING MODEL -->
  <rect x="255" y="24" width="250" height="52" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="380" y="55" text-anchor="middle" font-size="17" font-weight="700" fill="#155c38">OPERATING MODEL</text>
  <line x1="380" y1="76" x2="380" y2="118" stroke="#2f5169" stroke-width="2.4" marker-end="url(#ah)"/>

  <!-- WATCH -->
  <rect x="290" y="120" width="180" height="66" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="380" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">WATCH</text>
  <text x="380" y="172" text-anchor="middle" font-size="13" fill="#57534e">observe divergence</text>

  <!-- runtime feed into WATCH (solid observed input) -->
  <text x="640" y="148" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">runtime</text>
  <line x1="600" y1="153" x2="474" y2="153" stroke="#2f5169" stroke-width="2.4" marker-end="url(#ah)"/>

  <!-- WATCH -> RESPOND (SOLID load-bearing) -->
  <line x1="380" y1="186" x2="380" y2="270" stroke="#2f5169" stroke-width="2.6" marker-end="url(#ah)"/>

  <!-- BEAT (dashed enhancement, offset left) -->
  <rect x="70" y="196" width="160" height="60" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="150" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">BEAT</text>
  <text x="150" y="242" text-anchor="middle" font-size="13" fill="#57534e">liveness heartbeat</text>
  <path d="M300,168 C250,180 250,200 232,214" stroke="#57534e" stroke-width="1.6" stroke-dasharray="7 5" fill="none" marker-end="url(#aho)"/>
  <path d="M232,238 C270,256 300,264 300,288" stroke="#57534e" stroke-width="1.6" stroke-dasharray="7 5" fill="none" marker-end="url(#aho)"/>

  <!-- RESPOND (solid) -->
  <rect x="290" y="272" width="180" height="66" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="380" y="302" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">RESPOND</text>
  <text x="380" y="324" text-anchor="middle" font-size="13" fill="#57534e">bounded recovery</text>

  <!-- RESPOND -> BLOCK (dashed enhancement) -->
  <line x1="380" y1="338" x2="380" y2="384" stroke="#57534e" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#aho)"/>

  <!-- BLOCK (dashed) -->
  <rect x="280" y="386" width="200" height="76" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="380" y="416" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">BLOCK</text>
  <text x="380" y="438" text-anchor="middle" font-size="13" fill="#57534e">prevent unsafe progress</text>

  <!-- legend (prominent, boxed) -->
  <rect x="500" y="392" width="230" height="86" rx="8" fill="#fdfcf9" stroke="#e4e0d8" stroke-width="1.5"/>
  <line x1="518" y1="418" x2="562" y2="418" stroke="#2f5169" stroke-width="2.6" marker-end="url(#ah)"/>
  <text x="572" y="423" font-size="13" fill="#57534e">load-bearing (required)</text>
  <line x1="518" y1="452" x2="562" y2="452" stroke="#57534e" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#aho)"/>
  <text x="572" y="457" font-size="13" fill="#57534e">enhancement (not required)</text>

  <!-- caption -->
  <text x="380" y="524" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">WATCH &#8594; RESPOND is the load-bearing path. Heartbeats and blocking authority</text>
  <text x="380" y="546" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">strengthen it where the failure class requires them.</text>
</svg>
