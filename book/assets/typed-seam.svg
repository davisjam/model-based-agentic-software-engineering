<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: typed-seam). Structural teaching figure for §2.5.
     ONE JOB: ordinary remediation code reaches the underlying format library only through one typed
     model per format — the single door. Three boxes on a row: [remediation passes] -> [format model]
     (the only door) -> [format library]. A direct bypass from the passes to the library is routed
     below and struck with an X: direct access forbidden. Shared house grammar (see figures.md):
       solid arrow  = permitted / actual relationship (ink #2b2825)
       dashed arrow = derived / predicted relationship (muted #57534e)   [not used here]
       arrow + X    = prohibited relationship (light rule struck with a red #b23b3b X)
       [bracket]    = a property / obligation annotation (muted #57534e)
     Palette: page #fdfcf9, ink #1c1917/#2b2825, muted #57534e, accent-negative #b23b3b, box fill #f6f4ef. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300"
     role="group" aria-labelledby="tsTitle tsDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="tsTitle">The typed seam — the format library is reachable only through one typed model</title>
  <desc id="tsDesc">Ordinary remediation passes reach a format model, and only the format model reaches
    the underlying format library. The model is the single sanctioned door. A direct path from the
    remediation passes to the format library, drawn below the row, is struck through with an X and marked
    forbidden. These are authoritative mechanisms: routing every access through one typed seam is the only
    permitted way to touch the powerful library.</desc>

  <defs>
    <marker id="ts-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2825"/>
    </marker>
    <marker id="ts-arF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0aaa2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="300" fill="#fdfcf9"/>

  <!-- question marker (consistent across the figure set) -->
  <text x="40" y="38" font-size="16" font-weight="600" fill="#57534e">Question: Where may document mutation occur?</text>

  <!-- entity boxes -->
  <rect x="25" y="120" width="160" height="64" rx="8" fill="#f6f4ef" stroke="#2b2825" stroke-width="2"/>
  <text x="105" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">remediation</text>
  <text x="105" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">passes</text>

  <rect x="235" y="120" width="170" height="64" rx="8" fill="#f6f4ef" stroke="#2b2825" stroke-width="2"/>
  <text x="320" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">format model</text>
  <text x="320" y="206" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">the only door</text>

  <rect x="450" y="120" width="180" height="64" rx="8" fill="#f6f4ef" stroke="#2b2825" stroke-width="2"/>
  <text x="540" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">format library</text>

  <!-- permitted arrows (solid) -->
  <line x1="185" y1="152" x2="235" y2="152" stroke="#2b2825" stroke-width="2" marker-end="url(#ts-ar)"/>
  <line x1="405" y1="152" x2="450" y2="152" stroke="#2b2825" stroke-width="2" marker-end="url(#ts-ar)"/>
  <text x="427" y="138" text-anchor="middle" font-size="16" fill="#57534e">permitted</text>

  <!-- forbidden bypass: routed below the row, struck with an X -->
  <path d="M105,184 L105,250 L540,250 L540,184" fill="none" stroke="#b0aaa2" stroke-width="1.8"
        marker-end="url(#ts-arF)"/>
  <line x1="312" y1="240" x2="332" y2="260" stroke="#b23b3b" stroke-width="2.6"/>
  <line x1="332" y1="240" x2="312" y2="260" stroke="#b23b3b" stroke-width="2.6"/>
  <text x="322" y="284" text-anchor="middle" font-size="16" font-weight="600" fill="#b23b3b">direct access forbidden</text>
</svg>
