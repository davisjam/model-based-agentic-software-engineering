<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: fig-lease-vs-cas). Concurrency teaching figure for §2.6.
     ONE JOB: redelivery and permission-to-act are different things. A delivery may repeat; the LEASE says
     "I currently hold this delivery" (liveness / crash recovery); the compare-and-set says "I am the one
     consumer allowed the side effect" (the at-most-once claim). The winner performs; the loser acknowledges
     without repeating. Exactly-once rests on the claim, not the lease. Shared house grammar: solid arrow =
     actual step; [bracket] = the property each step provides; win/lose label the branch. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470"
     role="group" aria-labelledby="lcTitle lcDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="lcTitle">Lease versus compare-and-set — redelivery and permission-to-act are different things</title>
  <desc id="lcDesc">A delivery, which may repeat, is taken under a lease that provides crash recovery
    only: it says the consumer currently holds this delivery. A separate compare-and-set provides the
    at-most-once claim: it says the consumer is the one allowed the side effect. The claim branches two
    ways — the winner performs the effect, and the loser acknowledges without repeating it. Exactly-once
    rests on the claim, not the lease; these are authoritative mechanisms, the lease for liveness and the
    compare-and-set for correctness.</desc>

  <defs>
    <marker id="lc-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2825"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="470" fill="#fdfcf9"/>

  <text x="40" y="38" font-size="16" font-weight="600" fill="#57534e">Question: What makes the side effect happen at most once?</text>

  <!-- delivery -->
  <rect id="delivery" x="230" y="70" width="180" height="48" rx="8" fill="#f6f4ef" stroke="#2b2825" stroke-width="2"/>
  <text x="320" y="100" text-anchor="middle" font-size="16.64" font-weight="700" fill="#1c1917">delivery</text>
  <text x="420" y="100" font-size="16" fill="#57534e">may repeat</text>

  <!-- LEASE -->
  <rect id="lease" x="230" y="158" width="180" height="48" rx="8" fill="#f6f4ef" stroke="#2b2825" stroke-width="2"/>
  <text x="320" y="188" text-anchor="middle" font-size="16.64" font-weight="700" fill="#1c1917">LEASE</text>
  <text x="420" y="188" font-size="16" fill="#57534e">[crash recovery only]</text>

  <!-- compare-and-set -->
  <rect id="cas" x="205" y="246" width="230" height="48" rx="8" fill="#f6f4ef" stroke="#2b2825" stroke-width="2"/>
  <text x="320" y="276" text-anchor="middle" font-size="16.64" font-weight="700" fill="#1c1917">compare-and-set</text>
  <text x="445" y="276" font-size="16" fill="#57534e">[the at-most-once claim]</text>

  <!-- branch targets -->
  <rect id="perform" x="85" y="360" width="150" height="48" rx="8" fill="#f6f4ef" stroke="#2b2825" stroke-width="2"/>
  <text x="160" y="390" text-anchor="middle" font-size="16.64" font-weight="700" fill="#1c1917">perform</text>
  <text x="160" y="428" text-anchor="middle" font-size="16" fill="#57534e">the effect happens</text>

  <rect id="ack" x="385" y="360" width="180" height="48" rx="8" fill="#f6f4ef" stroke="#2b2825" stroke-width="2"/>
  <text x="475" y="390" text-anchor="middle" font-size="16.64" font-weight="700" fill="#1c1917">ack, no repeat</text>
  <text x="475" y="428" text-anchor="middle" font-size="16" fill="#57534e">no second effect</text>

  <!-- arrows -->
  <!-- keep-angles: the win/lose branch labels ride the two diagonals; a perpendicular re-aim would
       route the curve through the label, so these heads stay straight (seating still enforced). -->
  <!-- edge-grammar: keep-angles -->
  <!-- edge: delivery -> lease -->
  <line x1="320" y1="118" x2="320" y2="158" stroke="#2b2825" stroke-width="2" marker-end="url(#lc-ar)"/>
  <!-- edge: lease -> cas -->
  <line x1="320" y1="206" x2="320" y2="246" stroke="#2b2825" stroke-width="2" marker-end="url(#lc-ar)"/>
  <!-- edge: cas -> perform -->
  <line x1="270" y1="294" x2="180" y2="360" stroke="#2b2825" stroke-width="2" marker-end="url(#lc-ar)"/>
  <!-- edge: cas -> ack -->
  <line x1="370" y1="294" x2="455" y2="360" stroke="#2b2825" stroke-width="2" marker-end="url(#lc-ar)"/>
  <text x="210" y="322" text-anchor="end" font-size="16" font-weight="700" fill="#1c1917">win</text>
  <text x="432" y="322" text-anchor="start" font-size="16" font-weight="700" fill="#1c1917">lose</text>
</svg>
