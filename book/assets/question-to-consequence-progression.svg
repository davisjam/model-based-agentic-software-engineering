<path d="M171.5 81V91" fill="none" stroke="#57534e" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M171.5 139V149" fill="none" stroke="#57534e" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M171.5 170V180" fill="none" stroke="#57534e" stroke-width=".65" marker-end="url(#arrow)"/>
<path d="M35 202H24V57H35" fill="none" stroke="#57534e" stroke-width=".65" marker-end="url(#arrow)"/>
<text x="12" y="129.5" text-anchor="middle" font-family="Source Sans 3" font-size="10" fill="#1c1917" transform="rotate(-90 12 129.5)">Revise model and properties</text>
