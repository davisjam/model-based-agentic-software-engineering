<svg xmlns="http://www.w3.org/2000/svg" width="315pt" height="228pt" viewBox="0 0 315 228" role="img" aria-labelledby="qapTitle qapDesc">
<title id="qapTitle">From engineering question to engineering consequence</title>
<desc id="qapDesc">Five stages: Engineering question; Model and define properties; Analyze the modeled properties; Interpret the evidence; Make engineering decisions. The model stage names state machines and dependency graphs, with legal transitions and permitted dependencies. Analyses include state exploration, model checking, simulation, constraint solving, and static analysis. Decisions refine architecture and design and select obligations for enforcement. A feedback arrow returns from decisions to revise the model and properties.</desc>
<rect width="315" height="228" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="4.5" markerHeight="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#57534e"/></marker></defs>
<rect x="84" y="2" width="175" height="21" rx="2.5" fill="#f6f4ef" stroke="#57534e" stroke-width=".65"/>
<text x="171.5" y="16" text-anchor="middle" font-family="Source Sans 3" font-size="10" fill="#1c1917" font-weight="700">Engineering question</text>
<rect x="35" y="33" width="273" height="48" rx="2.5" fill="#e7edf3" stroke="#2f5169" stroke-width=".65"/>
<text x="171.5" y="47" text-anchor="middle" font-family="Source Sans 3" font-size="10" fill="#1c1917" font-weight="700">Model and define properties</text>
<text x="171.5" y="60" text-anchor="middle" font-family="Source Sans 3" font-size="10" fill="#1c1917">Representations: state machines · dependency graphs</text>
<text x="171.5" y="72" text-anchor="middle" font-family="Source Sans 3" font-size="10" fill="#1c1917">Properties: legal transitions · permitted dependencies</text>
<rect x="35" y="91" width="273" height="48" rx="2.5" fill="#f6f4ef" stroke="#57534e" stroke-width=".65"/>
<text x="171.5" y="105" text-anchor="middle" font-family="Source Sans 3" font-size="10" fill="#1c1917" font-weight="700">Analyze the modeled properties</text>
<text x="171.5" y="118" text-anchor="middle" font-family="Source Sans 3" font-size="10" fill="#1c1917">State exploration · model checking · simulation</text>
<text x="171.5" y="130" text-anchor="middle" font-family="Source Sans 3" font-size="10" fill="#1c1917">Constraint solving · static analysis</text>
<rect x="73" y="149" width="197" height="21" rx="2.5" fill="#f6f4ef" stroke="#57534e" stroke-width=".65"/>
<text x="171.5" y="163" text-anchor="middle" font-family="Source Sans 3" font-size="10" fill="#1c1917" font-weight="700">Interpret the evidence</text>
<rect x="35" y="180" width="273" height="44" rx="2.5" fill="#f6f4ef" stroke="#57534e" stroke-width=".65"/>
<text x="171.5" y="194" text-anchor="middle" font-family="Source Sans 3" font-size="10" fill="#1c1917" font-weight="700">Make engineering decisions</text>
<text x="171.5" y="207" text-anchor="middle" font-family="Source Sans 3" font-size="10" fill="#1c1917">Refine architecture and design</text>
<text x="171.5" y="219" text-anchor="middle" font-family="Source Sans 3" font-size="10" fill="#1c1917">Choose which obligations warrant enforcement</text>
