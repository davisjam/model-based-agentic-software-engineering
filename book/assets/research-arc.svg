<?xml version="1.0" encoding="UTF-8"?>
<!-- Authored for the figure-wiring wave per integration-prose-preface3-conclusion-260807.md Block 3
     (research-arc SPEC). ROUND-2: the title is relabelled to name the figure explicitly as research
     PROVENANCE — "Where the theory came from" — while the TRUE chronological order is preserved (do NOT
     rearrange to chapter order; that would falsify the research story — scholarly-hygiene invariant). The
     disclaimer sentence ("The order in which the evidence produced the theory is not the order in which
     the book teaches the resulting method") lives in the prose caption, not in the SVG.
     The book's METHOD, not its theory: a single vertical inference chain read top to bottom — DocAble
     (one deep case) -> Induced MAGE (the theory proposed from it) -> Industry reports (six independent
     organizations) -> Comparison (each reconstructed in MAGE terms) -> Refinement (the theory tested and
     changed) -> Theory (the refined MAGE theory the closing chapters carry). One thin dashed green
     feedback edge returns Refinement -> Induced MAGE, "the theory changed," so the flat chain does not
     hide that the comparison altered the constructs. Two colour families only: green #1f7a4d/#155c38
     modeling (the theory nodes) and neutral #57534e (the evidence/procedure nodes + the inference spine),
     so the figure reads in grayscale and every node also carries a title. Coordinate-authored (no
     invisible anchors). Palette: Umber Monograph tokens (ink #1c1917, paper #fdfcf9, muted/neutral
     #57534e, green #1f7a4d + emphasis #155c38, modeling tint #e3f0e7, neutral tint #f6f4ef, rule
     #e4e0d8). Fonts in the 13-26 band at the 1000px reference. -->
<!-- semantic-families: modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700"
     role="group" aria-labelledby="raTitle raDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="raTitle">Where the theory came from: the research provenance, one procedure read top to bottom</title>
  <desc id="raDesc">A single vertical chain of six stages, read from top to bottom, each a titled box joined to
    the next by a downward arrow. This is where the theory came from — its research provenance, in the true
    order the evidence produced it, which is not the order in which the book later teaches the method.
    Stage one, DocAble — one production system, studied deeply over months.
    Stage two, Induced MAGE — the theory proposed from that one case: the two theses, governance conversion,
    engineering capital. Stage three, Industry reports — six independent organizations. Stage four,
    Comparison — each system reconstructed in MAGE's vocabulary and put to three questions. Stage five,
    Refinement — the theory corroborated, refined where the outside cases press, and occasionally extended.
    Stage six, Theory — the refined MAGE theory the closing chapters carry. A thin dashed green feedback edge
    returns from Refinement up to Induced MAGE, labelled the theory changed, marking that the comparison
    altered the constructs rather than merely confirming them. The theory stages are green (modeling); the
    evidence and procedure stages and the spine are gray (neutral). One deep case supplies mechanism; the
    independent cases supply variation.</desc>

  <defs>
    <marker id="ra-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="ra-fb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#fdfcf9"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">Where the theory came from</text>
  <text x="500" y="68" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">How the book knows what it claims — one procedure, read top to bottom.</text>

  <!-- spine arrows (neutral) + edge labels naming the inference -->
  <g stroke="#57534e" stroke-width="2.2" fill="none">
    <line x1="500" y1="147" x2="500" y2="178" marker-end="url(#ra-ah)"/>
    <line x1="500" y1="239" x2="500" y2="270" marker-end="url(#ra-ah)"/>
    <line x1="500" y1="331" x2="500" y2="362" marker-end="url(#ra-ah)"/>
    <line x1="500" y1="423" x2="500" y2="454" marker-end="url(#ra-ah)"/>
    <line x1="500" y1="515" x2="500" y2="546" marker-end="url(#ra-ah)"/>
  </g>
  <g font-size="13" font-style="italic" fill="#57534e" text-anchor="start">
    <text x="516" y="167">induces</text>
    <text x="516" y="259">turned outward</text>
    <text x="516" y="351">reconstructed</text>
    <text x="516" y="443">tested against</text>
    <text x="516" y="535">refined into</text>
  </g>

  <!-- N1 DocAble (neutral: the deep case) -->
  <rect x="240" y="88" width="520" height="58" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="500" y="114" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">DocAble</text>
  <text x="500" y="135" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">one production system, studied deeply over months</text>

  <!-- N2 Induced MAGE (modeling: the proposed theory) -->
  <rect x="240" y="180" width="520" height="58" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="500" y="206" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Induced MAGE</text>
  <text x="500" y="227" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">the two theses, governance conversion, engineering capital</text>

  <!-- N3 Industry reports (neutral: external evidence) -->
  <rect x="240" y="272" width="520" height="58" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="500" y="298" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Industry reports</text>
  <text x="500" y="319" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">six independent organizations</text>

  <!-- N4 Comparison (neutral: procedure) -->
  <rect x="240" y="364" width="520" height="58" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="500" y="390" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Comparison</text>
  <text x="500" y="411" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">each reconstructed in MAGE's vocabulary, put to three questions</text>

  <!-- N5 Refinement (neutral: the test) -->
  <rect x="240" y="456" width="520" height="58" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="500" y="482" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Refinement</text>
  <text x="500" y="503" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">corroborated, refined where they press, occasionally extended</text>

  <!-- N6 Theory (modeling, emphasis: the refined theory) -->
  <rect x="240" y="548" width="520" height="64" rx="8" fill="#e3f0e7" stroke="#155c38" stroke-width="3"/>
  <text x="500" y="576" text-anchor="middle" font-size="21" font-weight="700" fill="#155c38">Theory</text>
  <text x="500" y="598" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">the refined MAGE theory the closing chapters carry</text>

  <!-- feedback edge: Refinement -> Induced MAGE, "the theory changed" (dashed, thin, green, offset right) -->
  <path d="M760,485 C824,470 824,225 760,209" fill="none" stroke="#1f7a4d" stroke-width="1.6"
        stroke-dasharray="6 4" marker-end="url(#ra-fb)"/>
  <text transform="rotate(-90 838 347)" x="838" y="347" text-anchor="middle" font-size="13"
        font-style="italic" fill="#1f7a4d" paint-order="stroke" stroke="#ffffff" stroke-width="3">the theory changed</text>

  <text x="500" y="668" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">One deep case supplies mechanism; the independent cases supply variation — together they reach further than either alone.</text>
</svg>
