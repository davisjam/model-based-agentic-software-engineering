<?xml version="1.0" encoding="UTF-8"?>
<!-- Authored for the conclusion-preface-260814 front-matter redraw (post-Part-VI restructure). REDRAW of
     research-arc: the epistemic-verb fix. The prior figure ran DocAble -> Induced MAGE -> Industry reports
     -> Comparison -> Refinement -> Theory with a "tested against" spine edge and a "the theory changed"
     feedback loop. "Tested" overclaims what the public industrial reports can bear, so this redraw:
     (1) collapses the separate Refinement node — Comparison now feeds MAGE theory directly;
     (2) relabels the load-bearing spine edge "refines" (NOT "tested against"); no node or caption says
         "tested";
     (3) drops the feedback loop (the "refines" verb already carries that the comparison altered the
         constructs, and the Refinement node it sprang from is gone);
     (4) adds a DEPTH / BREADTH split under MAGE theory — the originating case supplies mechanism and
         sequence (depth); the industrial reconstructions supply variation and alternatives (breadth) —
         converging on "a stronger basis for theory."
     The TRUE chronological order is preserved (do NOT rearrange to chapter order; that falsifies the
     research story). Two colour families only: green #1f7a4d/#155c38 modeling (the theory nodes) and
     neutral #57534e (the evidence/procedure nodes + the inference spine), so the figure reads in grayscale.
     Palette: Umber Monograph tokens (ink #1c1917, paper #fdfcf9, neutral #57534e, green #1f7a4d + emphasis
     #155c38, modeling tint #e3f0e7, neutral tint #f6f4ef). Coordinate-authored (no invisible anchors). -->
<!-- semantic-families: modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" width="1000" height="740"
     role="group" aria-labelledby="raTitle raDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="raTitle">Where the theory came from: the research provenance, one procedure read top to bottom, closing on depth and breadth</title>
  <desc id="raDesc">A single vertical chain of five stages, read from top to bottom, each a titled box joined to
    the next by a downward arrow, closing on a depth-and-breadth split. This is where the theory came from —
    its research provenance, in the true order the evidence produced it, which is not the order in which the
    book later teaches the method.
    Stage one, DocAble — one production system, observed deeply over months.
    Stage two, Early MAGE — the theory induced from that one case: Modeling, Alignment, governance
    conversion, engineering capital. Stage three, Industry reports — six independent organizations. Stage
    four, Comparison — each system reconstructed in MAGE's vocabulary: recurring moves, variation, limits.
    That comparison refines — not tests — the theory. Stage five, MAGE theory — the account developed in
    Part VI. Beneath it a split: the originating case gives DEPTH (mechanism and sequence); the industrial
    reconstructions give BREADTH (variation and alternatives); together they converge on a stronger basis for
    theory. The theory stages are green (modeling); the evidence and procedure stages and the spine are gray
    (neutral).</desc>

  <defs>
    <marker id="ra-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="740" fill="#fdfcf9"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">Where the theory came from</text>
  <text x="500" y="68" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">How the book knows what it claims — one procedure, read top to bottom.</text>

  <!-- spine arrows (neutral) + edge labels naming the inference -->
  <g stroke="#57534e" stroke-width="2.2" fill="none">
    <line x1="500" y1="150" x2="500" y2="180" marker-end="url(#ra-ah)"/>
    <line x1="500" y1="242" x2="500" y2="272" marker-end="url(#ra-ah)"/>
    <line x1="500" y1="334" x2="500" y2="364" marker-end="url(#ra-ah)"/>
    <line x1="500" y1="426" x2="500" y2="456" marker-end="url(#ra-ah)"/>
  </g>
  <g font-size="13" font-style="italic" fill="#57534e" text-anchor="start">
    <text x="516" y="169">induces</text>
    <text x="516" y="261">turned outward</text>
    <text x="516" y="353">reconstructed</text>
    <text x="516" y="445">refines</text>
  </g>

  <!-- N1 DocAble (neutral: the deep case) -->
  <rect x="240" y="90" width="520" height="58" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="500" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">DocAble</text>
  <text x="500" y="137" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">one production system, observed deeply over months</text>

  <!-- N2 Early MAGE (modeling: the induced theory) -->
  <rect x="240" y="182" width="520" height="58" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.2"/>
  <text x="500" y="208" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Early MAGE</text>
  <text x="500" y="229" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">Modeling · Alignment · conversion · capital</text>

  <!-- N3 Industry reports (neutral: external evidence) -->
  <rect x="240" y="274" width="520" height="58" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="500" y="300" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Industry reports</text>
  <text x="500" y="321" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">six independent organizations</text>

  <!-- N4 Comparison (neutral: procedure) -->
  <rect x="240" y="366" width="520" height="58" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="500" y="392" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Comparison</text>
  <text x="500" y="413" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">recurring moves · variation · limits</text>

  <!-- N5 MAGE theory (modeling, emphasis: the refined theory) -->
  <rect x="240" y="458" width="520" height="64" rx="8" fill="#e3f0e7" stroke="#155c38" stroke-width="3"/>
  <text x="500" y="486" text-anchor="middle" font-size="21" font-weight="700" fill="#155c38">MAGE theory</text>
  <text x="500" y="508" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">the account developed in Part VI</text>

  <!-- DEPTH / BREADTH split: what each evidence source contributes -->
  <!-- theory -> split hub -->
  <g stroke="#57534e" stroke-width="2" fill="none">
    <line x1="500" y1="522" x2="500" y2="540"/>
    <path d="M500,540 L310,540 L310,560" marker-end="url(#ra-ah)"/>
    <path d="M500,540 L690,540 L690,560" marker-end="url(#ra-ah)"/>
  </g>

  <!-- DEPTH cell (from the originating case) -->
  <rect x="150" y="562" width="320" height="56" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="1.8"/>
  <text x="310" y="586" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">DEPTH</text>
  <text x="310" y="606" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">mechanism · sequence</text>

  <!-- BREADTH cell (from the industrial reconstructions) -->
  <rect x="530" y="562" width="320" height="56" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="1.8"/>
  <text x="690" y="586" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">BREADTH</text>
  <text x="690" y="606" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">variation · alternatives</text>

  <!-- converge to the conclusion -->
  <g stroke="#57534e" stroke-width="2" fill="none">
    <path d="M310,618 L310,640 L500,640"/>
    <path d="M690,618 L690,640 L500,640"/>
    <line x1="500" y1="640" x2="500" y2="662" marker-end="url(#ra-ah)"/>
  </g>
  <rect x="330" y="664" width="340" height="48" rx="8" fill="#e3f0e7" stroke="#155c38" stroke-width="2.4"/>
  <text x="500" y="694" text-anchor="middle" font-size="17" font-weight="700" fill="#155c38">a stronger basis for theory</text>
</svg>
