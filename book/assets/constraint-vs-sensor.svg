<?xml version="1.0" encoding="UTF-8"?>
<!-- R44b REDRAW (off-main scratch; folds over book/assets/constraint-vs-sensor.svg).
     THEORY FIX: prevent-vs-OBSERVE, NOT prevent-vs-detect. A constraint narrows what CAN happen; a
     sensor OBSERVES what DID happen and produces evidence. It does NOT judge — DETECTING a violation is
     a further step that takes a validator to interpret the evidence against an obligation (stated in the
     footer strip so the four-role taxonomy is protected on sight). The asymmetric cost is retained (a
     constraint costs no failed loop; acting on a sensor's evidence costs at least one iteration).
     Hand-authored SVG (not Mermaid): the side-by-side "narrow-the-space vs read-the-state" contrast and
     the bespoke wall/dish icons are not a flowchart. Accent #2f5169; ink #1c1917; muted #57534e. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470"
     role="group" aria-labelledby="caTitle caDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="caTitle">Constraint or sensor: prevent the mistake, or observe it</title>
  <desc id="caDesc">An engineering property you want to hold splits into two moves. On the left, a
    constraint: it narrows what can happen by scoping the action space, so the wrong move is unavailable
    within the iteration — a typed enumeration over free-form strings, a permission, a narrow API — and it
    costs no failed loop. On the right, a sensor: it observes what did happen and produces evidence — a
    metric, a trace, a call scan, a log — and acting on that evidence costs at least one iteration. A
    sensor does not judge what it saw. Detecting a violation is a further step: it takes a validator to
    interpret the evidence against an obligation.</desc>

  <defs>
    <marker id="caArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- source: engineering property -->
  <rect x="320" y="26" width="320" height="66" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="480" y="59" text-anchor="middle" font-size="23" font-weight="700" fill="#1c1917">Engineering property</text>
  <text x="480" y="84" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">prevent the mistake, or observe it</text>

  <!-- fork edges -->
  <g fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#caArrow)">
    <path d="M400,92 C360,124 300,128 250,156"/>
    <path d="M560,92 C600,124 660,128 710,156"/>
  </g>

  <!-- ================= LEFT — constraint / narrows what can happen ================= -->
  <rect x="70" y="162" width="360" height="226" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="250" y="198" text-anchor="middle" font-size="23.04" font-weight="700" fill="#2f5169">Constraint — prevents</text>

  <!-- wall icon: brick courses -->
  <g stroke="#2f5169" stroke-width="2" fill="none">
    <rect x="216" y="228" width="68" height="44"/>
    <line x1="216" y1="250" x2="284" y2="250"/>
    <line x1="250" y1="228" x2="250" y2="250"/>
    <line x1="233" y1="250" x2="233" y2="272"/>
    <line x1="267" y1="250" x2="267" y2="272"/>
  </g>

  <text x="250" y="308" text-anchor="middle" font-size="20" fill="#1c1917">Narrows what</text>
  <text x="250" y="333" text-anchor="middle" font-size="20" fill="#1c1917">can happen.</text>
  <text x="250" y="368" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">typed enum · permission · narrow API</text>

  <!-- ================= RIGHT — sensor / observes what did happen ================= -->
  <rect x="530" y="162" width="360" height="226" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="710" y="198" text-anchor="middle" font-size="23.04" font-weight="700" fill="#2f5169">Sensor — observes</text>

  <!-- sensor icon: a dish reading the state (no verdict) -->
  <circle cx="710" cy="250" r="26" fill="none" stroke="#2f5169" stroke-width="2.5"/>
  <circle cx="710" cy="250" r="6" fill="#2f5169"/>
  <path d="M710,224 A26,26 0 0,1 736,250" fill="none" stroke="#2f5169" stroke-width="3"/>

  <text x="710" y="308" text-anchor="middle" font-size="20" fill="#1c1917">Observes what did happen</text>
  <text x="710" y="333" text-anchor="middle" font-size="20" fill="#1c1917">and produces evidence.</text>
  <text x="710" y="368" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">metric · trace · call scan · log</text>

  <!-- ================= footer: protect the taxonomy ================= -->
  <text x="480" y="428" text-anchor="middle" font-size="17" fill="#1c1917">A constraint costs no failed loop; acting on a sensor's evidence costs at least one iteration.</text>
  <text x="480" y="452" text-anchor="middle" font-size="17" font-style="italic" fill="#9a3f12">Detecting a violation is a further step — a validator interprets the evidence against an obligation.</text>
</svg>
