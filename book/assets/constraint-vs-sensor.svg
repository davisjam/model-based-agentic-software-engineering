<?xml version="1.0" encoding="UTF-8"?>
<!-- Part III 3.3 figure — constraint-vs-sensor.svg (draft; folds to book/assets/).
     v7 (part3-v7-260814): reframed as a SELECTION RULE. Top node is the ENGINEERING OBLIGATION (rust —
     the property you must hold). A single decision — "Can the unwanted state be excluded cleanly?" —
     branches: YES -> CONSTRAINT (narrows what may happen); NO -> SENSOR (produces evidence of what
     happened). Both are governance mechanisms (blue #2f5169). Interpretive cost copy ("a constraint
     costs no failed loop…") is removed from inside the figure; it now lives in the caption/body.
     Grammar: rust #9a3f12 = obligation; blue #2f5169 = mechanism; neutral #57534e = the decision. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420"
     role="group" aria-labelledby="caTitle caDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="caTitle">Constraint or sensor: a selection rule for the engineering obligation</title>
  <desc id="caDesc">An engineering obligation you must hold leads to one decision: can the unwanted state be
    excluded cleanly? If yes, use a constraint, which narrows what may happen — a typed enumeration, a
    permission, a narrow API. If no, use a sensor, which produces evidence of what happened — a metric, a
    trace, a call scan, a log — for later evaluation. A constraint prevents the unwanted state; a sensor
    reports it after the fact.</desc>

  <defs>
    <marker id="caArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- edges drawn UNDER nodes; the branch labels YES/NO ride the diagonals, so heads keep their angles -->
  <!-- edge-grammar: keep-angles -->
  <!-- edge: obligation -> decision -->
  <line x1="480" y1="87" x2="480" y2="132" stroke="#1c1917" stroke-width="2" marker-end="url(#caArrow)"/>
  <g fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#caArrow)">
    <!-- edge: decision -> constraint -->
    <path d="M380,192 C320,222 290,232 262,254"/>
    <!-- edge: decision -> sensor -->
    <path d="M580,192 C640,222 670,232 698,254"/>
  </g>

  <!-- top: the engineering obligation -->
  <rect id="obligation" x="320" y="24" width="320" height="66" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="480" y="55" text-anchor="middle" font-size="21" font-weight="700" fill="#9a3f12">ENGINEERING OBLIGATION</text>
  <text x="480" y="79" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">the property you must hold</text>

  <!-- the selection decision -->
  <rect id="decision" x="264" y="136" width="432" height="58" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="480" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Can the unwanted state be excluded cleanly?</text>

  <!-- branch labels (paths drawn under nodes, above) -->
  <text x="300" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">YES</text>
  <text x="662" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">NO</text>

  <!-- ============ LEFT — CONSTRAINT ============ -->
  <rect id="constraint" x="95" y="256" width="330" height="128" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="260" y="296" text-anchor="middle" font-size="22" font-weight="700" fill="#2f5169">CONSTRAINT</text>
  <text x="260" y="326" text-anchor="middle" font-size="19" fill="#1c1917">narrows what may happen</text>
  <text x="260" y="360" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">typed enum · permission · narrow API</text>

  <!-- ============ RIGHT — SENSOR ============ -->
  <rect id="sensor" x="535" y="256" width="330" height="128" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="700" y="296" text-anchor="middle" font-size="22" font-weight="700" fill="#2f5169">SENSOR</text>
  <text x="700" y="326" text-anchor="middle" font-size="18" fill="#1c1917">produces evidence of what happened</text>
  <text x="700" y="360" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">metric · trace · call scan · log</text>
</svg>
