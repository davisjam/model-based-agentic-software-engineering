<?xml version="1.0" encoding="UTF-8"?>
<!-- RB Part-IV figure — deliver-context-two-layer.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"
     role="img" aria-labelledby="dcTitle dcDesc"
     font-family="'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="dcTitle">Deliver the right context in two layers — small standing context plus a retrieved task-relevant slice.</title>
  <desc id="dcDesc">A green engineering-knowledge box holds models, rules, and procedures. It splits into two
    layers: a solid green standing-context box (mission, compact method, compact policy) and a dashed green
    task-relevant-slice box (retrieved when needed). Both feed into a blue agent-context box, which flows down
    into a dark work box. A dashed rust lifecycle-event arrow loops from the work back up to the task-relevant
    slice, re-surfacing what matters now. The point: keep standing context small enough to genuinely remain
    standing, and retrieve richer slices per task rather than loading everything at once.</desc>

  <defs>
    <marker id="dc-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
    <marker id="dc-ah-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/></marker>
  </defs>

  <!-- engineering knowledge (green = modeling/knowledge) -->
  <rect id="eng-knowledge" x="350" y="40" width="300" height="60" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="500" y="70" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">ENGINEERING KNOWLEDGE</text>
  <text x="500" y="90" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">models &#183; rules &#183; procedures</text>

  <!-- split to the two layers -->
  <!-- edge: eng-knowledge -> standing-context -->
  <path d="M390,100 L390,156" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#dc-ah)"/>
  <!-- edge: eng-knowledge -> task-slice -->
  <path d="M610,100 L610,156" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#dc-ah)"/>

  <!-- standing context: SOLID = always resident -->
  <rect id="standing-context" x="110" y="158" width="320" height="82" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="270" y="187" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">STANDING CONTEXT</text>
  <text x="270" y="209" text-anchor="middle" font-size="18" fill="#57534e">mission &#183; compact method</text>
  <text x="270" y="227" text-anchor="middle" font-size="18" fill="#57534e">compact policy</text>

  <!-- task-relevant slice: DASHED = retrieved on demand -->
  <rect id="task-slice" x="570" y="158" width="320" height="82" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="730" y="187" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">TASK-RELEVANT SLICE</text>
  <text x="730" y="209" text-anchor="middle" font-size="18" fill="#57534e">richer models, procedures,</text>
  <text x="730" y="227" text-anchor="middle" font-size="18" fill="#57534e">examples &#8212; retrieved when needed</text>

  <!-- both layers merge into agent context -->
  <!-- edge: standing-context -> agent-context -->
  <path d="M400,240 L400,292" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#dc-ah)"/>
  <!-- edge: task-slice -> agent-context -->
  <path d="M600,240 L600,292" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#dc-ah)"/>

  <!-- agent context (blue = the acting party) -->
  <rect id="agent-context" x="370" y="294" width="260" height="58" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="500" y="329" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">AGENT CONTEXT</text>
  <!-- edge: agent-context -> work -->
  <line x1="500" y1="352" x2="500" y2="392" stroke="#57534e" stroke-width="2" marker-end="url(#dc-ah)"/>

  <!-- work (dark terminal) -->
  <rect id="work" x="410" y="394" width="180" height="56" rx="12" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="500" y="429" text-anchor="middle" font-size="18" font-weight="700" fill="#fdfcf9">WORK</text>

  <!-- lifecycle event re-surfaces the right slice (dashed rust = governance loop) -->
  <!-- explicit L form (same pixels as H905 V199 H894) so the endpoint reads true -->
  <!-- edge: work .. task-slice -->
  <path d="M590 422 L 905 422 L 905 199 L 894 199" fill="none" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#dc-ah-rust)"/>
  <text x="908" y="316" text-anchor="middle" transform="rotate(90 908 316)" font-size="18" font-style="italic" fill="#9a3f12">lifecycle event re-surfaces what matters now</text>

  <text x="500" y="512" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">Keep standing context small enough to stay standing — retrieve the rest per task.</text>
</svg>
