<?xml version="1.0" encoding="UTF-8"?>
<!-- HAND-AUTHORED one-off glossary section-map (geometry-per-concept redraw 260810). Not machine-projected; edit this SVG directly. -->
<!-- TAXONOMY-TREE geometry for the five model classes. Root Model branches to five kinds; NOT a vertical progression. Orientation reference chrome, not a role-coloured figure. -->
<!-- semantic-families: neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Taxonomy tree: the five model classes, sorted by what each represents">
  <defs>
    <marker id="vh-mc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#fdfcf9"/>
  <text x="95" y="40" font-size="17" fill="#57534e">Glossary · concept map</text>
  <text x="905" y="40" text-anchor="end" font-size="18" font-weight="bold" fill="#1c1917">The five model classes</text>

  <!-- root -->
  <rect x="390" y="66" width="220" height="66" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="3"/>
  <text x="500" y="98" text-anchor="middle" font-size="24" font-weight="bold" fill="#1c1917">Model</text>
  <text x="500" y="120" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">What does it represent?</text>

  <!-- trunk down to the distribution bus, then the bus itself -->
  <line x1="500" y1="132" x2="500" y2="162" stroke="#cfcabf" stroke-width="3"/>
  <text x="512" y="152" font-size="16" fill="#78716c">sorts into</text>
  <line x1="130" y1="162" x2="870" y2="162" stroke="#cfcabf" stroke-width="3"/>

  <!-- five branch drops, each carrying its own micro-verb (the answer to "what does it represent?") -->
  <line x1="130" y1="162" x2="130" y2="206" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-mc)"/>
  <line x1="315" y1="162" x2="315" y2="206" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-mc)"/>
  <line x1="500" y1="162" x2="500" y2="206" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-mc)"/>
  <line x1="685" y1="162" x2="685" y2="206" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-mc)"/>
  <line x1="870" y1="162" x2="870" y2="206" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-mc)"/>
  <text x="130" y="190" text-anchor="middle" font-size="16" fill="#78716c">acts</text>
  <text x="315" y="190" text-anchor="middle" font-size="16" fill="#78716c">composes</text>
  <text x="500" y="190" text-anchor="middle" font-size="16" fill="#78716c">decides</text>
  <text x="685" y="190" text-anchor="middle" font-size="16" fill="#78716c">measures</text>
  <text x="870" y="190" text-anchor="middle" font-size="16" fill="#78716c">explains</text>

  <!-- five class cards (leaves) -->
  <!-- Behavioral -->
  <rect x="42" y="210" width="176" height="40" rx="7" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="130" y="236" text-anchor="middle" font-size="19" font-weight="bold" fill="#1c1917">Behavioral</text>
  <text x="130" y="268" text-anchor="middle" font-size="16" fill="#57534e">how it acts over runs —</text>
  <text x="130" y="286" text-anchor="middle" font-size="16" fill="#57534e">states, transitions,</text>
  <text x="130" y="304" text-anchor="middle" font-size="16" fill="#57534e">properties</text>
  <text x="130" y="330" text-anchor="middle" font-size="16" font-style="italic" fill="#78716c">e.g. job-lifecycle</text>
  <text x="130" y="347" text-anchor="middle" font-size="16" font-style="italic" fill="#78716c">state machine</text>

  <!-- Structural -->
  <rect x="227" y="210" width="176" height="40" rx="7" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="315" y="236" text-anchor="middle" font-size="19" font-weight="bold" fill="#1c1917">Structural</text>
  <text x="315" y="268" text-anchor="middle" font-size="16" fill="#57534e">the system's shape —</text>
  <text x="315" y="286" text-anchor="middle" font-size="16" fill="#57534e">parts, zones,</text>
  <text x="315" y="304" text-anchor="middle" font-size="16" fill="#57534e">permitted composition</text>
  <text x="315" y="330" text-anchor="middle" font-size="16" font-style="italic" fill="#78716c">e.g. component-zone</text>
  <text x="315" y="347" text-anchor="middle" font-size="16" font-style="italic" fill="#78716c">model</text>

  <!-- Decision -->
  <rect x="412" y="210" width="176" height="40" rx="7" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="500" y="236" text-anchor="middle" font-size="19" font-weight="bold" fill="#1c1917">Decision</text>
  <text x="500" y="268" text-anchor="middle" font-size="16" fill="#57534e">a choice to honor —</text>
  <text x="500" y="286" text-anchor="middle" font-size="16" fill="#57534e">contract, policy,</text>
  <text x="500" y="304" text-anchor="middle" font-size="16" fill="#57534e">permitted values</text>
  <text x="500" y="330" text-anchor="middle" font-size="16" font-style="italic" fill="#78716c">e.g. service-flow</text>
  <text x="500" y="347" text-anchor="middle" font-size="16" font-style="italic" fill="#78716c">model + access policy</text>

  <!-- Measurement -->
  <rect x="597" y="210" width="176" height="40" rx="7" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="685" y="236" text-anchor="middle" font-size="19" font-weight="bold" fill="#1c1917">Measurement</text>
  <text x="685" y="268" text-anchor="middle" font-size="16" fill="#57534e">a quantity exposed —</text>
  <text x="685" y="286" text-anchor="middle" font-size="16" fill="#57534e">cost, load,</text>
  <text x="685" y="304" text-anchor="middle" font-size="16" fill="#57534e">coverage</text>
  <text x="685" y="330" text-anchor="middle" font-size="16" font-style="italic" fill="#78716c">e.g. performance-</text>
  <text x="685" y="347" text-anchor="middle" font-size="16" font-style="italic" fill="#78716c">and-cost model</text>

  <!-- Documentation -->
  <rect x="782" y="210" width="176" height="40" rx="7" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="870" y="236" text-anchor="middle" font-size="19" font-weight="bold" fill="#1c1917">Documentation</text>
  <text x="870" y="268" text-anchor="middle" font-size="16" fill="#57534e">human-facing</text>
  <text x="870" y="286" text-anchor="middle" font-size="16" fill="#57534e">explanation as a</text>
  <text x="870" y="304" text-anchor="middle" font-size="16" fill="#57534e">governed artifact</text>
  <text x="870" y="330" text-anchor="middle" font-size="16" font-style="italic" fill="#78716c">e.g. a doc surface in</text>
  <text x="870" y="347" text-anchor="middle" font-size="16" font-style="italic" fill="#78716c">the traceability graph</text>

  <!-- footer notes -->
  <line x1="95" y1="548" x2="905" y2="548" stroke="#cfcabf" stroke-width="1.5"/>
  <text x="95" y="576" font-size="16" fill="#57534e">A contract or policy model is a <tspan font-weight="bold">Decision</tspan> model.</text>
  <text x="95" y="600" font-size="16" fill="#57534e">Governance is a <tspan font-style="italic">Move</tspan> — an action on a model — not a sixth class.</text>
</svg>
