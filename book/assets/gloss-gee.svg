<?xml version="1.0" encoding="UTF-8"?>
<!-- HAND-AUTHORED one-off glossary section-map. R41b THEORY REBUILD (preface-3): the old figure led with
     Model / Invariant -> Governance Mechanism, as though every mechanism starts from a model. That is now
     wrong. The input is an ENGINEERING OBLIGATION, and a mechanism has TWO ways to obtain something to act
     on: a directly observable action or artifact (no model needed), OR an explicit model / invariant
     (richer semantics). Both JOIN at the Governance Mechanism, which governs the environment that compounds
     into engineering capital. Explicit models are not a prerequisite — they extend the mechanism to
     properties that would otherwise need human reconstruction. Orientation reference chrome, not a
     role-coloured figure. -->
<!-- semantic-families: neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Two-input control flow: an engineering obligation is acted on either through a directly observable action or artifact, or through an explicit model or invariant with richer semantics; both join at the governance mechanism, which governs an environment that compounds into engineering capital">
  <defs>
    <marker id="vh-gee2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#fdfcf9"/>
  <text x="95" y="40" font-size="17" fill="#57534e">Glossary · concept map</text>
  <text x="905" y="40" text-anchor="end" font-size="18" font-weight="bold" fill="#1c1917">The Governed Engineering Environment</text>

  <!-- ===== the input: an engineering obligation ===== -->
  <rect x="390" y="70" width="220" height="52" rx="8" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="500" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1917">Engineering</text>
  <text x="500" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1917">obligation</text>

  <!-- fork to two ways of obtaining something to act on -->
  <line x1="500" y1="122" x2="500" y2="150" stroke="#cfcabf" stroke-width="3"/>
  <line x1="280" y1="150" x2="720" y2="150" stroke="#cfcabf" stroke-width="3"/>
  <line x1="280" y1="150" x2="280" y2="182" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-gee2)"/>
  <line x1="720" y1="150" x2="720" y2="182" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-gee2)"/>
  <text x="500" y="172" text-anchor="middle" font-size="14" font-style="italic" fill="#78716c">acted on through one of two surfaces</text>

  <!-- LEFT input: a directly observable action or artifact (no model) -->
  <rect x="110" y="184" width="330" height="78" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="2.4"/>
  <text x="275" y="214" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1917">Directly observable</text>
  <text x="275" y="236" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1917">action or artifact</text>
  <text x="275" y="255" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">a test, a diff, a sandbox run — no model</text>

  <!-- RIGHT input: an explicit model / invariant (richer semantics) -->
  <rect x="560" y="184" width="330" height="78" rx="8" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2.4"/>
  <text x="725" y="214" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1917">Explicit model / invariant</text>
  <text x="725" y="236" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1917">richer semantics</text>
  <text x="725" y="255" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">states properties observation cannot reach</text>

  <!-- join: both surfaces meet at the mechanism -->
  <line x1="275" y1="262" x2="275" y2="292" stroke="#cfcabf" stroke-width="3"/>
  <line x1="725" y1="262" x2="725" y2="292" stroke="#cfcabf" stroke-width="3"/>
  <line x1="275" y1="292" x2="725" y2="292" stroke="#cfcabf" stroke-width="3"/>
  <line x1="500" y1="292" x2="500" y2="322" stroke="#57534e" stroke-width="3" marker-end="url(#vh-gee2)"/>
  <text x="512" y="312" font-size="14" fill="#78716c">enforced by</text>

  <!-- ===== the JOIN point: Governance Mechanism ===== -->
  <rect x="330" y="322" width="340" height="62" rx="8" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="500" y="350" text-anchor="middle" font-size="19" font-weight="bold" fill="#1c1917">Governance Mechanism</text>
  <text x="500" y="371" text-anchor="middle" font-size="13.4" font-style="italic" fill="#57534e">Constraint · Sensor · Validator · Gate</text>
  <line x1="500" y1="384" x2="500" y2="422" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-gee2)"/>
  <text x="512" y="408" font-size="14" fill="#78716c">governs</text>

  <!-- Governed Engineering Environment -->
  <rect x="290" y="422" width="420" height="52" rx="8" fill="#f6f4ef" stroke="#cfcabf" stroke-width="2"/>
  <text x="500" y="454" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1917">Governed Engineering Environment</text>
  <line x1="500" y1="474" x2="500" y2="512" stroke="#cfcabf" stroke-width="3" marker-end="url(#vh-gee2)"/>
  <text x="512" y="498" font-size="14" fill="#78716c">compounds into</text>

  <!-- Engineering Capital — terminal (dark) -->
  <rect x="390" y="512" width="220" height="52" rx="8" fill="#1c1917" stroke="#1c1917" stroke-width="2"/>
  <text x="500" y="544" text-anchor="middle" font-size="19" font-weight="bold" fill="#fdfcf9">Engineering Capital</text>

  <!-- footer band: the drift-gate story + the linter/gate example (preserved) -->
  <line x1="60" y1="588" x2="940" y2="588" stroke="#cfcabf" stroke-width="1.5"/>
  <text x="70" y="612" font-size="15" fill="#57534e">A <tspan font-weight="bold">drift gate</tspan> catches <tspan font-style="italic">model drift</tspan> — a model and its code disagreeing. A <tspan font-weight="bold">linter</tspan> senses; a <tspan font-weight="bold">gate</tspan> blocks the commit.</text>

  <!-- R13 zoom cue: FRAME-echo corner-brackets — this figure IS the expansion of 0.3-1's Governance-Mechanism node. -->
  <g fill="none" stroke="#57534e" stroke-width="2.5">
    <path d="M26,12 L12,12 L12,26"/>
    <path d="M974,628 L988,628 L988,614"/>
  </g>
</svg>
