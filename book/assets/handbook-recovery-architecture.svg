<text x="108.53333333333333" y="293" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10.8" font-weight="bold" font-style="normal" fill="black">Terminal job</text>
<text x="108.53333333333333" y="304" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="black">(completed or failed)</text>
