<text x="109.02222222222223" y="90" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="black">(job accounting in Redis)</text>
<text x="18.577777777777776" y="103" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="9.2" font-weight="normal" font-style="normal" fill="black">•</text>
