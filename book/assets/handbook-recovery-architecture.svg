<text x="266.93333333333334" y="49" text-anchor="start" font-family="Source Sans 3,Arial,sans-serif" font-size="10.8" font-weight="bold" font-style="normal" fill="black">Failure and recovery</text>
<text x="270.84444444444443" y="62" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="9.2" font-weight="normal" font-style="normal" fill="black">•</text>
<text x="277.68888888888887" y="62" text-anchor="start" font-family="Source Sans 3,Arial,sans-serif" font-size="9.2" font-weight="normal" font-style="normal" fill="black">Lease stale → conditional reissue</text>
