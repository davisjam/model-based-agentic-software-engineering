<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="936" viewBox="0 0 440 312" role="img" aria-labelledby="title desc"><title id="title">Three commitments in job recovery</title><desc id="desc">A document job enters an in-flight accounting lease in Redis, storing job ID and issue epoch, not worker identity. The inline chunkless path bypasses the protected merge claim; the merge path must win a database compare-and-set. Both paths persist the artifact before updating durable job state and reaching completed or failed status. A separate recovery panel distinguishes stale-lease reissue, guarded stale release, interrupted effects, and interrupted publication. Three assurance rows distinguish the runtime claim constraint, bounded interleaving exploration, and temporal delivery and sweep assumptions.</desc><defs><marker id="arrow" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2 L0,4 Z" fill="black"/></marker></defs><rect width="440" height="312" fill="white"/>
