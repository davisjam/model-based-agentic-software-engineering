<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: provenance-derivation). Documentation teaching figure for §2.12.
     ONE JOB: the human-facing explanation is DERIVED from machine-readable provenance, not authored beside
     it. A mutation writes a stamp; every stamp lands in one provenance registry; the registry fans out to
     two derived views — a validation pass and the customer-facing changelog — and the changelog reaches the
     customer. The two fan-out edges are dashed (derived, not authored); the registry is the only source.
     Shared house grammar: solid arrow = actual write / flow; dashed arrow = derived relationship;
     [bracket] = property. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500"
     role="group" aria-labelledby="pdTitle pdDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="pdTitle">Provenance derivation — the explanation is derived from the record, not authored beside it</title>
  <desc id="pdDesc">A mutation writes a stamp, and every stamp lands in one provenance registry embedded in
    the document. The registry is the only source. From it two views are derived, drawn with dashed arrows:
    a validation pass and the customer-facing changelog. The changelog reaches the customer. Because the
    changelog is derived from the same record the code writes as it acts, it cannot describe a change the
    code never made. Deriving the explanation from an authoritative record, rather than keeping a parallel
    account, is the mechanism that keeps the explanation true to the act.</desc>

  <defs>
    <marker id="pd-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2825"/>
    </marker>
    <marker id="pd-arM" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="500" fill="#fdfcf9"/>

  <text x="40" y="38" font-size="16" font-weight="600" fill="#57534e">Question: Does the explanation match what the code did?</text>

  <!-- the write chain (solid) -->
  <rect x="215" y="70" width="170" height="46" rx="8" fill="#f6f4ef" stroke="#2b2825" stroke-width="2"/>
  <text x="300" y="99" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">mutation</text>

  <rect x="215" y="146" width="170" height="46" rx="8" fill="#f6f4ef" stroke="#2b2825" stroke-width="2"/>
  <text x="300" y="175" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">stamp</text>

  <rect x="175" y="222" width="250" height="52" rx="8" fill="#f6f4ef" stroke="#2b2825" stroke-width="2.4"/>
  <text x="300" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">provenance registry</text>
  <text x="435" y="255" font-size="16" fill="#57534e">[the only source]</text>

  <line x1="300" y1="116" x2="300" y2="146" stroke="#2b2825" stroke-width="2" marker-end="url(#pd-ar)"/>
  <line x1="300" y1="192" x2="300" y2="222" stroke="#2b2825" stroke-width="2" marker-end="url(#pd-ar)"/>

  <!-- the two derived views (dashed = derived, not authored) -->
  <rect x="70" y="340" width="160" height="48" rx="8" fill="#f6f4ef" stroke="#2b2825" stroke-width="2"/>
  <text x="150" y="370" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">validation</text>

  <rect x="390" y="340" width="160" height="48" rx="8" fill="#f6f4ef" stroke="#2b2825" stroke-width="2"/>
  <text x="470" y="370" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">changelog</text>

  <rect x="390" y="430" width="160" height="46" rx="8" fill="#f6f4ef" stroke="#2b2825" stroke-width="2"/>
  <text x="470" y="459" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">customer</text>

  <line x1="250" y1="274" x2="180" y2="340" stroke="#57534e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#pd-arM)"/>
  <line x1="350" y1="274" x2="430" y2="340" stroke="#57534e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#pd-arM)"/>
  <text x="300" y="318" text-anchor="middle" font-size="16" fill="#57534e">derived, not authored</text>

  <line x1="470" y1="388" x2="470" y2="430" stroke="#2b2825" stroke-width="2" marker-end="url(#pd-ar)"/>
  <text x="385" y="410" text-anchor="end" font-size="16" fill="#57534e">one row per entry</text>

  <text x="300" y="490" text-anchor="middle" font-size="16" fill="#57534e">the changelog is derived from the stamps, not kept in parallel</text>
</svg>
