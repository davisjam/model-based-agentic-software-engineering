<?xml version="1.0" encoding="UTF-8"?>
<!-- HAND-AUTHORED one-off (Field Guide card — Docker) — NOT projector output; edit by hand and keep this header. -->
<!-- Field-guide team card: Docker's entry door (authority boundaries & evaluation loops) -> MAGE landing (Alignment). label: field-guide-docker. Reference/nav card art, not a role-coloured figure. -->
<!-- semantic-families: neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Field Guide card: Docker — authority boundaries and evaluation loops to Alignment">
  <rect x="0" y="0" width="1000" height="430" fill="#fdfcf9"/>

  <!-- header -->
  <text x="48" y="44" font-size="16" fill="#57534e">Field Guide · card</text>
  <text x="952" y="44" text-anchor="end" font-size="22" font-weight="bold" fill="#1c1917">Docker</text>
  <text x="952" y="68" text-anchor="end" font-size="16" font-style="italic" fill="#57534e">Developer tooling (containers) · autonomous coding fleet with a role graph</text>
  <line x1="40" y1="86" x2="960" y2="86" stroke="#cfcabf" stroke-width="1.5"/>

  <!-- ===== edges (drawn UNDER the nodes; node fills cap the ends) ===== -->
  <!-- edge: door -> role-4 -->
  <line x1="140" y1="205" x2="300" y2="209" stroke="#cfcabf" stroke-width="3"/>
  <!-- edge: hub -> role-1 -->
  <path fill="none" stroke="#cfcabf" stroke-width="2" d="M360,198 L360,140 L305,140"/>
  <!-- edge: hub -> role-2 -->
  <path fill="none" stroke="#cfcabf" stroke-width="2" d="M360,198 L360,163 L305,163"/>
  <!-- edge: hub -> role-3 -->
  <path fill="none" stroke="#cfcabf" stroke-width="2" d="M360,198 L360,186 L305,186"/>
  <!-- edge: hub -> role-4 -->
  <line x1="360" y1="209" x2="300" y2="209" stroke="#cfcabf" stroke-width="2"/>
  <!-- edge: hub -> role-5 -->
  <path fill="none" stroke="#cfcabf" stroke-width="2" d="M360,220 L360,232 L305,232"/>
  <!-- edge: hub -> role-6 -->
  <path fill="none" stroke="#cfcabf" stroke-width="2" d="M360,220 L360,255 L305,255"/>
  <!-- edge: hub -> role-7 -->
  <path fill="none" stroke="#cfcabf" stroke-width="2" d="M360,220 L360,278 L305,278"/>
  <!-- edge: hub -> gate -->
  <line x1="360" y1="210" x2="561" y2="210" stroke="#cfcabf" stroke-width="3"/>
  <!-- edge: gate -> landing -->
  <line x1="579" y1="210" x2="760" y2="210" stroke="#cfcabf" stroke-width="3"/>

  <!-- ===== nodes (opaque fills cap the edge ends) ===== -->
  <!-- door -->
  <circle id="door" cx="140" cy="205" r="11" fill="#fdfcf9" stroke="#1c1917" stroke-width="3"/>

  <!-- seven permission-backed roles -->
  <circle id="role-1" cx="300" cy="140" r="5" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <circle id="role-2" cx="300" cy="163" r="5" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <circle id="role-3" cx="300" cy="186" r="5" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <circle id="role-4" cx="300" cy="209" r="5" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <circle id="role-5" cx="300" cy="232" r="5" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <circle id="role-6" cx="300" cy="255" r="5" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <circle id="role-7" cx="300" cy="278" r="5" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>

  <!-- delegation hub -->
  <circle id="hub" cx="360" cy="209" r="11" fill="#1c1917"/>

  <!-- the admission gate is deliberately left open, a human standing on it -->
  <line x1="545" y1="172" x2="545" y2="248" stroke="#1c1917" stroke-width="3"/>
  <line x1="595" y1="172" x2="595" y2="248" stroke="#1c1917" stroke-width="3"/>
  <circle id="gate" cx="570" cy="210" r="9" fill="#1c1917"/>

  <!-- landing badge -->
  <rect id="landing" x="760" y="181" width="200" height="48" rx="8" fill="#fdfcf9" stroke="#1c1917" stroke-width="2.4"/>

  <!-- ===== labels ===== -->
  <text x="140" y="150" text-anchor="middle" font-size="16" letter-spacing="1" fill="#78716c">ENTERS THROUGH</text>
  <text x="140" y="252" text-anchor="middle" font-size="16" fill="#57534e">Authority boundaries</text>
  <text x="140" y="272" text-anchor="middle" font-size="16" fill="#57534e">&amp; eval loops</text>
  <text x="330" y="305" text-anchor="middle" font-size="16" fill="#78716c">seven permission-backed roles</text>
  <text x="330" y="325" text-anchor="middle" font-size="16" fill="#78716c">runs the shortest evidence horizon (◐)</text>
  <text x="452" y="196" text-anchor="middle" font-size="16" fill="#78716c">determinize the tests</text>
  <text x="570" y="150" text-anchor="middle" font-size="16" fill="#57534e">semantic admission remains human</text>
  <text x="570" y="272" text-anchor="middle" font-size="16" fill="#57534e">human on every merge</text>
  <text x="860" y="150" text-anchor="middle" font-size="16" letter-spacing="1" fill="#78716c">LANDS ON</text>
  <text x="860" y="211" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c1917">Alignment</text>

  <!-- takeaway -->
  <line x1="40" y1="368" x2="960" y2="368" stroke="#cfcabf" stroke-width="1.5"/>
  <text x="500" y="396" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">Determinize the decidable eagerly; keep a human on the judgment</text>
  <text x="500" y="418" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">you deliberately choose not to close.</text>
</svg>
