<title id="title">The engineering modeling repertoire</title>
<desc id="desc">Nine model families in a full-page three-by-three reference layout. Each gives a directed example, its relation meaning, and the engineering question, properties, and analyses. Dashed crossed relations distinguish stale claims and prohibited calls. The quantitative example compares error rate with a bracketed bound.</desc>
