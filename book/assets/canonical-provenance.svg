<?xml version="1.0" encoding="UTF-8"?>
<!-- Part 2 canonical opener — Provenance (Fig 2.7-1). From observability to provenance: an OBSERVABLE
     EXECUTION band (logs / traces / events / metrics) exposes far more than a question needs; a downward
     "retain consequential history" arrow reduces it to a PROVENANCE MODEL — a source -> operation ->
     artifact chain, the operation also carrying its responsible component and retained evidence. Neutral
     family ground; shared visual grammar. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" role="img" aria-labelledby="canonical-provenanceT canonical-provenanceD" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="canonical-provenanceT">From observability to provenance: retaining the consequential history</title>
  <desc id="canonical-provenanceD">Two stacked panels. An upper panel, Observable execution, holds logs, traces, events, and metrics and exposes far more of a run than an engineering question needs. A downward arrow labeled "retain consequential history" leads to a lower panel, Provenance model, holding a chain from source to operation to artifact, with the operation also linked to its responsible component and the retained evidence. Below the panels: Question, Semantics, and Typical analysis.</desc>
  <defs>
    <marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="640" fill="#fdfcf9"/>
  <text x="520" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">From observability to provenance</text>

  <!-- Observable execution band -->
  <rect x="90" y="88" width="860" height="82" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="112" y="120" font-size="20" font-weight="700" letter-spacing="1.5" fill="#1c1917">OBSERVABLE EXECUTION</text>
  <text x="112" y="150" font-size="21" fill="#57534e">logs · traces · events · metrics</text>
  <text x="928" y="134" text-anchor="end" font-size="18" font-style="italic" fill="#57534e">exposes far more than a question needs</text>

  <!-- reduction arrow -->
  <line x1="520" y1="170" x2="520" y2="246" stroke="#57534e" stroke-width="2.6" marker-end="url(#ah-muted)"/>
  <text x="548" y="214" text-anchor="start" font-size="20" font-style="italic" fill="#57534e">retain consequential history</text>

  <!-- Provenance model panel -->
  <rect x="200" y="250" width="640" height="250" rx="12" fill="#faf8f4" stroke="#57534e" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="520" y="286" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1.5" fill="#1c1917">PROVENANCE MODEL</text>

  <!-- chain: source -> operation -> artifact -->
  <rect x="250" y="308" width="140" height="50" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="320" y="340" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">source</text>
  <rect x="452" y="308" width="156" height="50" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="530" y="340" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">operation</text>
  <rect x="670" y="308" width="140" height="50" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="740" y="340" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">artifact</text>
  <line x1="390" y1="333" x2="450" y2="333" stroke="#57534e" stroke-width="2.4" marker-end="url(#ah-muted)"/>
  <line x1="608" y1="333" x2="668" y2="333" stroke="#57534e" stroke-width="2.4" marker-end="url(#ah-muted)"/>

  <!-- operation carries responsible component + retained evidence -->
  <rect x="300" y="430" width="220" height="48" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="410" y="461" text-anchor="middle" font-size="19" fill="#1c1917">responsible component</text>
  <rect x="560" y="430" width="200" height="48" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="660" y="461" text-anchor="middle" font-size="19" fill="#1c1917">retained evidence</text>
  <path d="M510,358 L510,404 L440,404 L440,428" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#ah-muted)"/>
  <path d="M552,358 L552,404 L640,404 L640,428" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#ah-muted)"/>

  <!-- caption -->
  <text x="30" y="540" font-size="20" fill="#1c1917"><tspan font-weight="700">Question:</tspan> What happened, and what evidence records it?</text>
  <text x="30" y="570" font-size="20" fill="#1c1917"><tspan font-weight="700">Semantics:</tspan> consequential entities and operations connected through recorded history and attribution.</text>
  <text x="30" y="600" font-size="20" fill="#1c1917"><tspan font-weight="700">Typical analysis:</tspan> backward lineage, forward impact, root-cause tracing, audit reconstruction.</text>
</svg>
