<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h5-incident-to-governance.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 940" width="640" height="940"
     role="img" aria-labelledby="h5Title h5Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h5Title">From incident repair to governance conversion</title>
  <desc id="h5Desc">An incident provides an observation about the realized system. Root-cause analysis traces the
    failure back to the models and relationships it realizes. Relationships within those models expose the affected
    instance and other, structurally related instances of the same engineering condition. Repair can then address
    the class rather than only the observed instance, and governance conversion preserves the lesson as an updated
    model or a durable mechanism that future work inherits.</desc>

  <defs>
    <marker id="h5-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
    <marker id="h5-ah-u" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/></marker>
  </defs>

  <rect x="0" y="0" width="640" height="940" fill="#fdfcf9"/>

  <g text-anchor="middle">
    <rect id="realized-system" x="210" y="26" width="220" height="42" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="320" y="53" font-size="14" font-weight="700" fill="#1c1917">REALIZED SYSTEM</text>

    <rect id="incident" x="230" y="112" width="180" height="42" rx="8" fill="#eef2f5" stroke="#2f5169" stroke-width="2"/>
    <text x="320" y="139" font-size="14" font-weight="700" fill="#2f5169">INCIDENT</text>

    <rect id="root-cause" x="190" y="198" width="260" height="44" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="320" y="226" font-size="14" font-weight="700" fill="#1c1917">ROOT-CAUSE ANALYSIS</text>

    <rect id="modeled-cause" x="196" y="300" width="248" height="60" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="320" y="325" font-size="14" font-weight="700" fill="#1c1917">MODELED CAUSE /</text>
    <text x="320" y="345" font-size="14" font-weight="700" fill="#1c1917">RELATIONSHIP</text>
  </g>

  <g stroke="#57534e" stroke-width="2.2" marker-end="url(#h5-ah)">
    <!-- edge: realized-system -> incident -->
    <line x1="320" y1="68"  x2="320" y2="110"/>
    <!-- edge: incident -> root-cause -->
    <line x1="320" y1="154" x2="320" y2="196"/>
    <!-- edge: root-cause -> modeled-cause -->
    <line x1="320" y1="242" x2="320" y2="298"/>
  </g>
  <text x="366" y="92"  font-size="13" font-style="italic" fill="#57534e">observation</text>
  <text x="366" y="272" font-size="13" font-style="italic" fill="#57534e">trace realization to models</text>

  <text x="320" y="386" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">find structural rhymes across the modeled system</text>

  <!-- fork to affected / related instances (bar raised above the caption; one path per branch) -->
  <!-- edge: modeled-cause -> affected-instance -->
  <path d="M221,360 L221,430" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#h5-ah)"/>
  <!-- edge: modeled-cause -> related-instances -->
  <path d="M419,360 L419,430" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#h5-ah)"/>

  <g text-anchor="middle">
    <rect id="affected-instance" x="54"  y="432" width="192" height="44" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="150" y="460" font-size="14" fill="#1c1917">affected instance</text>
    <rect id="related-instances" x="394" y="432" width="192" height="44" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="490" y="460" font-size="14" fill="#1c1917">related instances</text>
  </g>

  <!-- merge to repair the class (one path per branch, sharing the trunk) -->
  <!-- edge: affected-instance -> repair-class -->
  <path d="M223,476 L223,540" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#h5-ah)"/>
  <!-- edge: related-instances -> repair-class -->
  <path d="M417,476 L417,540" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#h5-ah)"/>

  <g text-anchor="middle">
    <rect id="repair-class" x="200" y="542" width="240" height="44" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="320" y="570" font-size="14" font-weight="700" fill="#1c1917">REPAIR THE CLASS</text>
  </g>
  <!-- edge: repair-class -> governance-conversion -->
  <line x1="320" y1="586" x2="320" y2="620" stroke="#57534e" stroke-width="2.2" marker-end="url(#h5-ah)"/>

  <g text-anchor="middle">
    <rect id="governance-conversion" x="176" y="622" width="288" height="44" rx="9" fill="#f7efe8" stroke="#9a3f12" stroke-width="2.5"/>
    <text x="320" y="650" font-size="14" font-weight="700" fill="#9a3f12">GOVERNANCE CONVERSION</text>
  </g>

  <!-- fork to updated model / durable mechanism -->
  <!-- edge: governance-conversion -> updated-model -->
  <path d="M211,666 L211,704" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#h5-ah-u)"/>
  <!-- edge: governance-conversion -> durable-mechanism -->
  <path d="M419,666 L419,704" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#h5-ah-u)"/>

  <g text-anchor="middle">
    <rect id="updated-model" x="54" y="706" width="192" height="44" rx="8" fill="#f7efe8" stroke="#9a3f12" stroke-width="2"/>
    <text x="150" y="734" font-size="14" font-weight="700" fill="#9a3f12">UPDATED MODEL</text>

    <rect id="durable-mechanism" x="374" y="706" width="212" height="100" rx="10" fill="#f7efe8" stroke="#9a3f12" stroke-width="2.5"/>
    <text x="480" y="730" font-size="14" font-weight="700" fill="#9a3f12">DURABLE MECHANISM</text>
    <text x="480" y="752" font-size="13" fill="#9a3f12">invariant · validator</text>
    <text x="480" y="772" font-size="13" fill="#9a3f12">test · constraint</text>
    <text x="480" y="792" font-size="13" fill="#9a3f12">policy · gate</text>
  </g>

  <!-- merge to future work (one path per branch, sharing the trunk) -->
  <!-- edge: updated-model -> future-work -->
  <path d="M226,750 L226,866" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#h5-ah)"/>
  <!-- edge: durable-mechanism -> future-work -->
  <path d="M404,806 L404,866" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#h5-ah)"/>

  <g text-anchor="middle">
    <rect id="future-work" x="206" y="868" width="228" height="56" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
    <text x="320" y="892" font-size="14" font-weight="700" fill="#1c1917">FUTURE WORK</text>
    <text x="320" y="912" font-size="13" fill="#1c1917">inherits the lesson</text>
  </g>
</svg>
