<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: generative-loop). R45c REBUILD — recentered from "The Coin Is the
     Model" to the INDEPENDENT ORACLE. One loop, whatever the oracle's source: a generator makes
     inputs, the system runs them, an independent oracle judges each outcome, a counterexample feeds
     back to shrink or diagnose, and coverage asks whether the search reached the claim before
     refining the generator. The oracle may be a declared property, a robustness contract, a reference
     implementation, or a structured model — the loop does not care which. Palette: Umber Monograph
     tokens (accent #9a3f12 the independent oracle, fleet #2f5169 generator + system, churn #b23b3b
     the counterexample, governed #1f7a4d coverage). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560"
     role="group" aria-labelledby="glTitle glDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="glTitle">Generate, judge, search again — around one independent oracle</title>
  <desc id="glDesc">A left-to-right loop. A generator makes inputs; the system under test runs them;
    an independent oracle judges each outcome. The oracle draws its verdict from one of several
    independent sources — a declared property, a robustness contract, a reference implementation, or
    a structured model — none of which is the system being judged. A failing outcome becomes a
    counterexample, shrunk to its minimal form or diagnosed to the stable obligation it violated. That
    outcome flows into coverage, which asks whether the search ever reached the semantic region the
    claim is about. Two dashed loops close the cycle: one refines the generator, and where a
    traceability graph exists, one joins model-claim coverage back to the claim.</desc>

  <defs>
    <marker id="gl-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="gl-ah-loop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <!-- ===== EDGES (drawn UNDER the nodes; each node fill caps its ends) ===== -->
  <!-- forward spine -->
  <g stroke="#1c1917" stroke-width="2" fill="none">
    <!-- edge: generator -> system -->
    <path d="M250,198 L308,198" marker-end="url(#gl-ah)"/>
    <!-- edge: system -> oracle -->
    <path d="M520,198 L578,198" marker-end="url(#gl-ah)"/>
    <!-- edge: oracle -> counterexample -->
    <path d="M840,198 L898,198" marker-end="url(#gl-ah)"/>
  </g>

  <!-- edge: counterexample -> coverage -->
  <path d="M1020,264 L1020,455 L812,455" fill="none" stroke="#1c1917" stroke-width="2" marker-end="url(#gl-ah)"/>

  <!-- the loop closes: coverage -> refine the generator (dotted) -->
  <!-- edge: coverage .. generator -->
  <path d="M450,455 L145,455 L145,248" fill="none" stroke="#57534e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#gl-ah-loop)"/>

  <!-- coverage -> (where traceability exists) joins model-claim coverage back to the claim/oracle (dotted) -->
  <!-- edge: coverage .. oracle -->
  <path d="M695,400 L695,266" fill="none" stroke="#57534e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#gl-ah-loop)"/>

  <!-- ===== NODES (on top; fills cap the edge ends) ===== -->
  <!-- generator -->
  <rect id="generator" x="40" y="150" width="210" height="96" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="145" y="192" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">generator</text>
  <text x="145" y="220" text-anchor="middle" font-size="18.88" font-style="italic" fill="#57534e">makes inputs</text>

  <!-- system -->
  <rect id="system" x="310" y="150" width="210" height="96" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="415" y="192" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">system</text>
  <text x="415" y="220" text-anchor="middle" font-size="18.88" font-style="italic" fill="#57534e">under test</text>

  <!-- independent oracle (accent) -->
  <rect id="oracle" x="580" y="132" width="260" height="132" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="710" y="176" text-anchor="middle" font-size="21" font-weight="700" fill="#1c1917">independent oracle</text>
  <text x="710" y="204" text-anchor="middle" font-size="18.88" font-style="italic" fill="#57534e">judges the outcome</text>
  <text x="710" y="236" text-anchor="middle" font-size="16.5" fill="#57534e">property · contract ·</text>
  <text x="710" y="256" text-anchor="middle" font-size="16.5" fill="#57534e">reference impl · model · human</text>

  <!-- counterexample (churn) -->
  <rect id="counterexample" x="900" y="132" width="240" height="132" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="2"/>
  <text x="1020" y="176" text-anchor="middle" font-size="20" font-weight="700" fill="#b23b3b">counterexample</text>
  <text x="1020" y="206" text-anchor="middle" font-size="17.5" fill="#b23b3b">shrink / diagnose to</text>
  <text x="1020" y="228" text-anchor="middle" font-size="17.5" fill="#b23b3b">the stable obligation</text>

  <!-- coverage (governed) -->
  <rect id="coverage" x="450" y="400" width="360" height="110" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="630" y="440" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">coverage: did we reach the claim?</text>
  <text x="630" y="470" text-anchor="middle" font-size="17.5" fill="#57534e">input-space · line/branch · model-claim</text>

  <!-- ===== edge labels (on top) ===== -->
  <text x="250" y="400" text-anchor="middle" font-size="18.5" font-style="italic" fill="#57534e">refine the generator</text>
  <text x="905" y="392" text-anchor="middle" font-size="16.5" font-style="italic" fill="#57534e">model-claim coverage</text>
  <text x="905" y="414" text-anchor="middle" font-size="16.5" font-style="italic" fill="#57534e">joins back — where a trace exists</text>
</svg>
