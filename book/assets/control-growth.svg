<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: control-growth). The control substrate accumulating across
     four dated windows: project-specific lint files 0 -> 336 -> 595 -> 747 (umber, accent),
     and gate scripts 0 -> 20 -> 76 -> 102 (fleet blue). Both start at literal zero in the
     prototype window and climb monotonically, steepest through mechanization. A two-line
     chart on a shared 0-800 count axis. Palette: Umber Monograph tokens (accent #9a3f12 the
     lint line, diagram-fleet #2f5169 the gate line, muted #57534e ticks, rule #e4e0d8
     gridlines, ink #1c1917 text). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470"
     role="img" aria-labelledby="cgTitle cgDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="cgTitle">The controls accumulate across four windows</title>
  <desc id="cgDesc">A two-line chart counting the project's governance controls at four dated
    windows of the build. Project-specific lint files rise from zero in the prototype, to 336
    at mechanization, to 595 at hardening, to 747 now. Gate scripts rise from zero, to 20, to
    76, to 102 over the same windows. Both curves start at literal zero — the lint and gate
    substrate is entirely post-prototype — and climb monotonically, steepest through the
    mechanization window where the fleet built the machinery. The environment accumulates
    controls one failure class at a time; the curve is that accumulation.</desc>

  <!-- legend -->
  <rect x="130" y="30" width="16" height="4" fill="#9a3f12"/>
  <text x="152" y="38" font-size="18" fill="#1c1917">lint files</text>
  <rect x="250" y="30" width="16" height="4" fill="#2f5169"/>
  <text x="272" y="38" font-size="18" fill="#1c1917">gate scripts</text>

  <!-- y gridlines + tick labels (count 200..600); baseline at 0. No 800 line — the 747 peak
       floats above the top gridline, as the support-ratio chart lets its peak float. -->
  <line x1="130" y1="313.25" x2="920" y2="313.25" stroke="#e4e0d8" stroke-width="1"/>
  <line x1="130" y1="246.5"  x2="920" y2="246.5"  stroke="#e4e0d8" stroke-width="1"/>
  <line x1="130" y1="179.75" x2="920" y2="179.75" stroke="#e4e0d8" stroke-width="1"/>
  <text x="118" y="317.25" text-anchor="end" font-size="18" fill="#57534e">200</text>
  <text x="118" y="250.5"  text-anchor="end" font-size="18" fill="#57534e">400</text>
  <text x="118" y="183.75" text-anchor="end" font-size="18" fill="#57534e">600</text>

  <!-- x axis baseline (count 0) -->
  <line x1="130" y1="380" x2="920" y2="380" stroke="#1c1917" stroke-width="1.5"/>

  <!-- the lint-file line: 0 -> 336 -> 595 -> 747 -->
  <polyline points="160,380 400,267.86 640,181.42 880,130.69"
            fill="none" stroke="#9a3f12" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="160" cy="380"    r="5" fill="#9a3f12"/>
  <circle cx="400" cy="267.86" r="5" fill="#9a3f12"/>
  <circle cx="640" cy="181.42" r="5" fill="#9a3f12"/>
  <circle cx="880" cy="130.69" r="5" fill="#9a3f12"/>
  <text x="400" y="287" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">336</text>
  <text x="640" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">595</text>
  <text x="880" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">747</text>

  <!-- the gate-script line: 0 -> 20 -> 76 -> 102 -->
  <polyline points="160,380 400,373.33 640,354.63 880,345.96"
            fill="none" stroke="#2f5169" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="160" cy="380"    r="5" fill="#2f5169"/>
  <circle cx="400" cy="373.33" r="5" fill="#2f5169"/>
  <circle cx="640" cy="354.63" r="5" fill="#2f5169"/>
  <circle cx="880" cy="345.96" r="5" fill="#2f5169"/>
  <text x="400" y="368" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">20</text>
  <text x="640" y="349" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">76</text>
  <text x="880" y="341" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">102</text>

  <!-- the shared zero at the prototype window -->
  <text x="160" y="368" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">0</text>

  <!-- x window labels + dates -->
  <text x="160" y="406" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1917">prototype</text>
  <text x="160" y="426" text-anchor="middle" font-size="18" fill="#57534e">Apr 9</text>
  <text x="400" y="406" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1917">mechanization</text>
  <text x="400" y="426" text-anchor="middle" font-size="18" fill="#57534e">May 31</text>
  <text x="640" y="406" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1917">hardening</text>
  <text x="640" y="426" text-anchor="middle" font-size="18" fill="#57534e">Jun 30</text>
  <text x="880" y="406" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1917">now</text>
  <text x="880" y="426" text-anchor="middle" font-size="18" fill="#57534e">Aug 3</text>

  <!-- axis caption -->
  <text x="130" y="452" text-anchor="start" font-size="18" font-style="italic" fill="#57534e">count of governance controls in the tree · lint files and gate scripts · 993 registered lint specs at the final window</text>
</svg>
