<?xml version="1.0" encoding="UTF-8"?>
<!-- RB Engineering-Moves figure — c4-derive-obligation-set.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"
     role="img" aria-labelledby="c4Title c4Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="c4Title">C.4 Derive what must be assured: generate the obligation set from the model, then subtract existing evidence</title>
  <desc id="c4Desc">A vertical flow. A model derives the set of things that must be assured — what must be tested.
    That required set is compared against the evidence that actually exists. The comparison splits into two:
    obligations that are covered, and obligations with no matching evidence. The gap is not measured from tests
    written; it is the required set minus the present evidence, and each uncovered obligation becomes a finding.</desc>

  <defs>
    <marker id="c4-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
    <marker id="c4-ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b23b3b"/>
    </marker>
  </defs>

  <!-- Edges drawn before the node they enter so the node fill caps the end. -->

  <!-- edge: model -> assured -->
  <line x1="500" y1="88" x2="500" y2="126" stroke="#57534e" stroke-width="2" marker-end="url(#c4-ah)"/>
  <text x="512" y="112" font-size="14" font-style="italic" fill="#1f7a4d">derive</text>

  <!-- edge: assured -> evidence -->
  <line x1="500" y1="188" x2="500" y2="226" stroke="#57534e" stroke-width="2" marker-end="url(#c4-ah)"/>
  <text x="512" y="212" font-size="14" font-style="italic" fill="#57534e">compare</text>

  <!-- split to COVERED / GAP (one path per branch) -->
  <!-- edge: evidence -> covered -->
  <path d="M395,288 L395,364" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#c4-ah)"/>
  <!-- edge: evidence -> gap -->
  <path d="M605,288 L605,364" fill="none" stroke="#b23b3b" stroke-width="2" marker-end="url(#c4-ah-r)"/>

  <!-- edge: gap -> finding -->
  <line x1="680" y1="420" x2="680" y2="458" stroke="#b23b3b" stroke-width="2" marker-end="url(#c4-ah-r)"/>

  <!-- MODEL -->
  <rect id="model" x="370" y="30" width="260" height="58" rx="10" fill="#e3f0e7" stroke="#155c38" stroke-width="2.5"/>
  <text x="500" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="#155c38">MODEL</text>

  <!-- WHAT MUST BE TESTED (obligation, modeling pole) -->
  <rect id="assured" x="330" y="128" width="340" height="60" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="500" y="156" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">WHAT MUST BE ASSURED</text>
  <text x="500" y="178" text-anchor="middle" font-size="14" font-style="italic" fill="#1f7a4d">seams &#183; failure edges &#183; invariants</text>

  <!-- EXISTING EVIDENCE (neutral) -->
  <rect id="evidence" x="350" y="228" width="300" height="60" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="1.8"/>
  <text x="500" y="256" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">EXISTING EVIDENCE</text>
  <text x="500" y="278" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">tests &#183; checks that actually exist</text>

  <!-- COVERED -->
  <rect id="covered" x="200" y="366" width="240" height="54" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="320" y="399" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">COVERED</text>

  <!-- GAP -->
  <rect id="gap" x="560" y="366" width="240" height="54" rx="10" fill="#fbeaea" stroke="#b23b3b" stroke-width="2"/>
  <text x="680" y="399" text-anchor="middle" font-size="18" font-weight="700" fill="#b23b3b">GAP</text>

  <!-- FINDING -->
  <rect id="finding" x="560" y="460" width="240" height="52" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="680" y="492" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">FINDING</text>

  <!-- footer -->
  <text x="500" y="546" text-anchor="middle" font-size="16" font-style="italic" fill="#9a3f12">Measure the required set minus the present evidence &#8212; not the evidence you happen to have written.</text>
</svg>
