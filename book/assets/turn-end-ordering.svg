<!-- Compact color geometry for Chapter 3. Original caption, title, and description retained; monochrome review partner remains unchanged. Print width is declared by stable figure label in book/data/figure-print-layout.json. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 190" width="550" height="190" role="img" aria-labelledby="figure-title figure-description" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="figure-title">Ordering interacting hooks</title>
<desc id="figure-description">At turn end, recurring-failure reflection precedes stranded-work inspection. Reflection identifies recent failures for governance conversion; work inspection compares delivered work with its brief and may exhaust the context needed for reflection. The arrow denotes the required order.</desc>
<defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c1917"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57534e"/></marker><marker id="rust-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a3f12"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f5169"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f7a4d"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b23b3b"/></marker></defs>
<text x="275" y="23" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">Required order at turn end</text>
<rect id="reflection" x="5" y="43" width="230" height="104" rx="7" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="120" y="67" text-anchor="middle" font-size="20" fill="#1c1917" font-weight="700">Recurring failure</text>
<text x="120" y="92" text-anchor="middle" font-size="20" fill="#1c1917">Reflect on recent</text>
<text x="120" y="115" text-anchor="middle" font-size="20" fill="#1c1917">failures for governance</text>
<text x="120" y="138" text-anchor="middle" font-size="20" fill="#1c1917">conversion.</text>
<rect id="stranded" x="315" y="43" width="230" height="104" rx="7" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="430" y="67" text-anchor="middle" font-size="20" fill="#1c1917" font-weight="700">Stranded work</text>
<text x="430" y="92" text-anchor="middle" font-size="20" fill="#1c1917">Compare delivered</text>
<text x="430" y="115" text-anchor="middle" font-size="20" fill="#1c1917">work with the</text>
<text x="430" y="138" text-anchor="middle" font-size="20" fill="#1c1917">original brief.</text>
<path d="M235 99 L313 99" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#rust-arrow)"/>
<text x="275" y="86" text-anchor="middle" font-size="20" fill="#9a3f12" font-style="italic">before</text>
<text x="275" y="176" text-anchor="middle" font-size="20" fill="#57534e">Inspection may exhaust context needed for reflection.</text>
</svg>
