<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: active-passive-alignment). Active and passive alignment as one sequence.
     Top panel: active alignment (convergence) — models M drive a compare -> modify -> evaluate loop over
     the realization until it satisfies the modeled obligations, yielding the aligned system S'. Handoff:
     once active alignment succeeds, the same models and mechanisms remain in place. Bottom panel: passive
     alignment (preservation) — each proposed change dS is evaluated against the retained models and is
     admitted or rejected, so correspondence is preserved. Colour by role: green = models, blue = agents
     acting, rust = evaluation gates, gray = the change under review. viewBox 920 for the figure font band. -->
<!-- semantic-families: modeling, governance, agent, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 716" width="920" height="716"
     role="group" aria-labelledby="apaTitle apaDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="apaTitle">Active alignment converges the system; passive alignment preserves the correspondence</title>
  <desc id="apaDesc">Two stacked panels. Top, active alignment (convergence): models M feed a pipeline of
    compare (detect gaps), modify (with agents), and evaluate (check alignment), producing the aligned
    system S-prime; a loop-back arrow labelled repeat until correspondence returns from evaluate to
    compare. A handoff arrow labelled once active alignment succeeds leads to the bottom panel, passive
    alignment (preservation): a proposed change delta-S enters evaluate (check against models), with the
    retained models M feeding in from above; the outcome is admit or reject, yielding the updated system
    S-prime, with a loop labelled continue protecting correspondence returning to the next proposed
    change. A closing note: the models, mechanisms, and governance remain in the governed engineering
    environment as engineering capital.</desc>

  <defs>
    <marker id="apa-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="apa-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="716" fill="#fdfcf9"/>

  <!-- ===== Panel: active alignment (convergence) ===== -->
  <rect x="24" y="16" width="872" height="236" rx="10" fill="#faf1e6" opacity="0.45"/>
  <text x="40" y="46" font-size="21.5" font-weight="700" fill="#1c1917">Active alignment (convergence)</text>
  <text x="40" y="72" font-size="18.4" font-style="italic" fill="#57534e">use the models to change the system until it satisfies them</text>

  <!-- models M (stacked-card motif) -->
  <rect x="50" y="94" width="108" height="58" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.4"/>
  <rect x="40" y="102" width="118" height="62" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="99" y="128" text-anchor="middle" font-size="19" font-style="italic" fill="#1c1917">M</text>
  <text x="99" y="150" text-anchor="middle" font-size="18.4" fill="#1c1917">models</text>

  <rect x="204" y="102" width="158" height="62" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="283" y="128" text-anchor="middle" font-size="19" fill="#1c1917">compare</text>
  <text x="283" y="150" text-anchor="middle" font-size="18.4" fill="#1c1917">detect gaps</text>

  <rect x="414" y="102" width="158" height="62" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="493" y="128" text-anchor="middle" font-size="19" fill="#1c1917">modify</text>
  <text x="493" y="150" text-anchor="middle" font-size="18.4" fill="#1c1917">with agents</text>

  <rect x="624" y="102" width="176" height="62" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="712" y="128" text-anchor="middle" font-size="19" fill="#1c1917">evaluate</text>
  <text x="712" y="150" text-anchor="middle" font-size="18.4" fill="#1c1917">check alignment</text>

  <text x="863" y="76" text-anchor="middle" font-size="18.4" fill="#1c1917">aligned</text>
  <text x="863" y="96" text-anchor="middle" font-size="18.4" fill="#1c1917">system</text>
  <rect x="838" y="102" width="50" height="62" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="863" y="140" text-anchor="middle" font-size="20" font-style="italic" fill="#1c1917">S&#8242;</text>

  <line x1="158" y1="133" x2="204" y2="133" stroke="#1c1917" stroke-width="2" marker-end="url(#apa-ah)"/>
  <line x1="362" y1="133" x2="414" y2="133" stroke="#1c1917" stroke-width="2" marker-end="url(#apa-ah)"/>
  <line x1="572" y1="133" x2="624" y2="133" stroke="#1c1917" stroke-width="2" marker-end="url(#apa-ah)"/>
  <line x1="800" y1="133" x2="838" y2="133" stroke="#1c1917" stroke-width="2" marker-end="url(#apa-ah)"/>

  <!-- convergence loop: evaluate back to compare -->
  <polyline points="712,164 712,206 283,206 283,164" fill="none" stroke="#57534e" stroke-width="1.8" marker-end="url(#apa-mut)"/>
  <text x="497" y="232" text-anchor="middle" font-size="18.4" font-style="italic" fill="#57534e">repeat until correspondence</text>

  <!-- ===== handoff ===== -->
  <line x1="460" y1="252" x2="460" y2="310" stroke="#1c1917" stroke-width="2.2" marker-end="url(#apa-ah)"/>
  <text x="478" y="286" font-size="18.4" font-style="italic" fill="#57534e">once active alignment succeeds &#8230;</text>

  <!-- ===== Panel: passive alignment (preservation) ===== -->
  <rect x="24" y="310" width="872" height="298" rx="10" fill="#e3f0e7" opacity="0.35"/>
  <text x="40" y="340" font-size="21.5" font-weight="700" fill="#1c1917">Passive alignment (preservation)</text>
  <text x="40" y="366" font-size="18.4" font-style="italic" fill="#57534e">the same models and mechanisms keep it aligned</text>

  <!-- retained models M (stacked-card motif) feeding evaluate -->
  <rect x="420" y="380" width="112" height="56" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.4"/>
  <rect x="412" y="388" width="112" height="56" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.4"/>
  <rect x="404" y="396" width="112" height="56" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="460" y="420" text-anchor="middle" font-size="19" font-style="italic" fill="#1c1917">M</text>
  <text x="460" y="442" text-anchor="middle" font-size="18.4" fill="#1c1917">models</text>
  <line x1="460" y1="452" x2="460" y2="482" stroke="#1c1917" stroke-width="2" marker-end="url(#apa-ah)"/>

  <rect x="64" y="482" width="176" height="62" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="152" y="508" text-anchor="middle" font-size="19" fill="#1c1917">&#916;S</text>
  <text x="152" y="530" text-anchor="middle" font-size="18.4" fill="#1c1917">proposed change</text>

  <rect x="352" y="482" width="216" height="62" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="460" y="508" text-anchor="middle" font-size="19" fill="#1c1917">evaluate</text>
  <text x="460" y="530" text-anchor="middle" font-size="18.4" fill="#1c1917">check against models</text>

  <text x="831" y="456" text-anchor="middle" font-size="18.4" fill="#1c1917">updated</text>
  <text x="831" y="476" text-anchor="middle" font-size="18.4" fill="#1c1917">system</text>
  <rect x="806" y="482" width="50" height="62" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="831" y="520" text-anchor="middle" font-size="20" font-style="italic" fill="#1c1917">S&#8242;</text>

  <line x1="240" y1="513" x2="352" y2="513" stroke="#1c1917" stroke-width="2" marker-end="url(#apa-ah)"/>
  <line x1="568" y1="513" x2="806" y2="513" stroke="#1c1917" stroke-width="2" marker-end="url(#apa-ah)"/>
  <text x="687" y="503" text-anchor="middle" font-size="18.4" font-style="italic" fill="#57534e">admit or reject</text>

  <!-- preservation loop: back to the next proposed change -->
  <polyline points="831,544 831,586 152,586 152,544" fill="none" stroke="#57534e" stroke-width="1.8" marker-end="url(#apa-mut)"/>
  <text x="491" y="578" text-anchor="middle" font-size="18.4" font-style="italic" fill="#57534e">continue protecting correspondence</text>

  <!-- engineering-capital note -->
  <rect x="190" y="628" width="540" height="66" rx="8" fill="#f6f4ef" stroke="#a8a29e" stroke-width="1.4"/>
  <text x="460" y="654" text-anchor="middle" font-size="18.4" fill="#1c1917">models, mechanisms, and governance remain in the GEE</text>
  <text x="460" y="678" text-anchor="middle" font-size="18.4" font-style="italic" fill="#57534e">as engineering capital for every later change</text>
</svg>
