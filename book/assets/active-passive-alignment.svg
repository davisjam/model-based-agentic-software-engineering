<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: active-passive-alignment). Active and passive alignment as ONE SEQUENCE,
     not two unrelated varieties. (a) Active alignment: a model and its alignment mechanisms drive a loop —
     evaluate the realization, expose the disagreement, agents modify — until the modeled obligations are
     satisfied. A center arrow marks the handoff: correspondence established, the pair remains in the GEE.
     (b) Passive alignment: the same model + mechanisms, now resident in the governed engineering
     environment, evaluate each subsequent change against the established obligations. Colour: green =
     model (modeling family), rust = alignment mechanisms (governance family), neutral = the realization
     and changes. viewBox 920 for the figure font band. -->
<!-- semantic-families: modeling, governance, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="920" height="370"
     role="group" aria-labelledby="apaTitle apaDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="apaTitle">Active and passive alignment as one sequence</title>
  <desc id="apaDesc">Two panels joined by a rightward arrow. (a) Active alignment: a model and its
    alignment mechanisms sit above a realization; an evaluate arrow runs down from the mechanisms to the
    realization and a return path runs back up to the model as agents modify the implementation, looping
    until the modeled obligations are satisfied. The purpose is convergence. The center arrow reads:
    correspondence established — the pair remains in the GEE. (b) Passive alignment: the same model and
    mechanisms now sit inside the governed engineering environment; a subsequent change is evaluated
    against the established obligations. The purpose is preservation.</desc>

  <defs>
    <marker id="apa-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="apa-ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="370" fill="#fdfcf9"/>

  <!-- ===== Panel (a): active alignment ===== -->
  <text x="30" y="30" font-size="17.5" font-weight="700" fill="#57534e">(a) Active alignment</text>

  <g text-anchor="middle" font-size="14.5" fill="#1c1917">
    <rect x="100" y="64" width="120" height="40" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/><text x="160" y="89">model</text>
    <rect x="240" y="64" width="180" height="40" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/><text x="330" y="89" font-size="13.5">alignment mechanisms</text>
    <rect x="165" y="228" width="180" height="44" rx="8" fill="#fff" stroke="#1c1917" stroke-width="1.8"/><text x="255" y="255">realization</text>
  </g>

  <!-- evaluate: mechanisms down onto the realization -->
  <line x1="300" y1="104" x2="300" y2="228" stroke="#57534e" stroke-width="1.8" marker-end="url(#apa-ah)"/>
  <text x="310" y="170" font-size="12.5" font-style="italic" fill="#57534e">evaluate</text>
  <!-- agents modify the realization; the result flows back up to the pair for re-evaluation -->
  <polyline points="165,250 75,250 75,84 100,84" fill="none" stroke="#57534e" stroke-width="1.8" marker-end="url(#apa-ah)"/>
  <text x="66" y="286" font-size="12.5" font-style="italic" fill="#57534e">agents modify · re-evaluate</text>
  <text x="255" y="312" text-anchor="middle" font-size="13" font-style="italic" fill="#9a3f12">loop until the modeled obligations are satisfied</text>
  <text x="250" y="350" text-anchor="middle" font-size="13.5" font-style="italic" fill="#78716c">purpose: convergence</text>

  <!-- ===== the handoff: active then passive ===== -->
  <line x1="435" y1="150" x2="545" y2="150" stroke="#1c1917" stroke-width="2.2" marker-end="url(#apa-ah-ink)"/>
  <text x="470" y="115" text-anchor="middle" font-size="12.5" font-style="italic" fill="#44403c">correspondence established:</text>
  <text x="470" y="133" text-anchor="middle" font-size="12.5" font-style="italic" fill="#44403c">the pair remains in the GEE</text>

  <!-- ===== Panel (b): passive alignment ===== -->
  <text x="565" y="30" font-size="17.5" font-weight="700" fill="#57534e">(b) Passive alignment</text>

  <rect x="565" y="64" width="325" height="130" rx="10" fill="#fdfcf9" stroke="#1f7a4d" stroke-width="2"/>
  <text x="727" y="88" text-anchor="middle" font-size="12.5" fill="#1f7a4d">governed engineering environment</text>
  <g text-anchor="middle" font-size="14.5" fill="#1c1917">
    <rect x="585" y="104" width="110" height="40" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/><text x="640" y="129">model</text>
    <rect x="715" y="104" width="160" height="40" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/><text x="795" y="129" font-size="13.5">alignment mechanisms</text>
    <rect x="610" y="290" width="190" height="44" rx="8" fill="#fff" stroke="#1c1917" stroke-width="1.8"/><text x="705" y="317">subsequent change</text>
  </g>
  <line x1="705" y1="290" x2="705" y2="194" stroke="#57534e" stroke-width="1.8" marker-end="url(#apa-ah)"/>
  <text x="715" y="235" font-size="12.5" font-style="italic" fill="#57534e">evaluated against the</text>
  <text x="715" y="252" font-size="12.5" font-style="italic" fill="#57534e">established obligations</text>
  <text x="727" y="350" text-anchor="middle" font-size="13.5" font-style="italic" fill="#78716c">purpose: preservation</text>
</svg>
