<?xml version="1.0" encoding="UTF-8"?>
<!-- 2.4 Ownership overlap (part2-v8-260814 REDRAW; folds to book/assets/).
     Geometry INVERTED per v8 guidance: the ONE shared represented state sits at TOP and fans DOWN to three
     purpose-views. Previously the three classes appeared to PRODUCE the fact; now one represented fact
     projects INTO three engineering questions. SHARED LEASE STATE (gray, owner/epoch/lifetime) -> OWNERSHIP
     (who owns?) / BEHAVIOR (when stale?) / MEASUREMENT (how many active?). Grammar: gray #57534e = the
     single represented state; blue #2f5169 = the model-class views. Hand-authored (a one-to-many fan). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350"
     role="img" aria-labelledby="ilTitle ilDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="ilTitle">One shared lease state answers ownership, behavioral, and measurement questions</title>
  <desc id="ilDesc">A single shared lease state, carrying owner, epoch, and lifetime, sits at the top and
    fans down to three purpose-views: ownership, who owns it; behavioral, when is it stale; and measurement,
    how many are active. One represented state, several engineering questions. Model classes distinguish
    purpose, not storage objects.</desc>

  <defs>
    <marker id="il-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <!-- fan DOWN to the three class views. CONNECT GRAMMAR: edges drawn FIRST (under every node) so the
       opaque node fills cap the ends. Each undirected source end runs to the SHARED LEASE STATE center
       (360,71); each directed head seats on its target's top border (head outside, tip touching). -->
  <g fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#il-b)">
    <!-- edge: shared-lease -> ownership -->
    <path d="M360,71 C300,120 145,156 145,186"/>
    <!-- edge: shared-lease -> behavior -->
    <path d="M360,71 L360,186"/>
    <!-- edge: shared-lease -> measurement -->
    <path d="M360,71 C420,120 575,156 575,186"/>
  </g>

  <!-- SHARED LEASE STATE (gray, the one represented fact) at TOP -->
  <rect id="shared-lease" x="250" y="38" width="220" height="66" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.6"/>
  <text x="360" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">SHARED LEASE STATE</text>
  <text x="360" y="90" text-anchor="middle" font-size="13.5" font-style="italic" fill="#57534e">owner &#183; epoch &#183; lifetime</text>

  <!-- OWNERSHIP -->
  <rect id="ownership" x="45" y="188" width="200" height="94" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="145" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">OWNERSHIP</text>
  <text x="145" y="252" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">who owns?</text>

  <!-- BEHAVIOR -->
  <rect id="behavior" x="260" y="188" width="200" height="94" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="360" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">BEHAVIOR</text>
  <text x="360" y="252" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">when stale?</text>

  <!-- MEASUREMENT -->
  <rect id="measurement" x="475" y="188" width="200" height="94" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="575" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5169">MEASUREMENT</text>
  <text x="575" y="252" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">how many active?</text>

  <!-- footer: protect the overlap point -->
  <text x="360" y="322" text-anchor="middle" font-size="15.5" font-style="italic" fill="#1c1917">One represented state, several engineering questions.</text>
</svg>
