<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: mage-overview). ROUND-2 CONVERSION: this figure used to be a third
     whole-MAGE system diagram (redundant with the 0.1-1 causal descent and the 0.1-2 theory card). It is
     now the genuinely-different missing figure — THE MAGE CYCLE / METHOD: the practitioner's operating
     loop, which tells you how to PRACTISE MAGE rather than why it holds. Four stations run down a column
     and a return arm closes the loop:
        MODEL (make intent explicit) -> ALIGN (give intent authority) -> WORK (grant autonomy) ->
        [failure / evidence] -> CONVERT (representation or control) -> repeat (back up to MODEL).
     WORK is the governed work between ALIGN and CONVERT; the three prose beats of the pinned method map to
     MODEL / ALIGN / CONVERT. Subtitle underneath: "Each pass leaves the environment more capable than the
     one before." Station names agree with the Part IV opener box (MODEL / ALIGN / WORK / CONVERT).
     Palette: Umber Monograph tokens (green #1f7a4d/#155c38 MODEL + modeling, accent #9a3f12 ALIGN +
     CONVERT + governance, fleet #2f5169 WORK + the fleet's governed work, churn-red #b23b3b the failure
     the pass surfaces, muted #57534e connectors, page #fdfcf9). -->
<!-- semantic-families: agent, failure, governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640"
     role="group" aria-labelledby="mc-title mc-desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mc-title">The MAGE cycle — how to practise the method, one pass then repeat</title>
  <desc id="mc-desc">The MAGE method as one repeating cycle. Four stations run down a column, and a return
    arm on the right closes the loop back to the top. MODEL: make intent explicit. An arrow down to ALIGN:
    give intent authority. An arrow down to WORK: grant autonomy. The next arrow is labelled failure and
    evidence — where autonomy still fails, and what the pass surfaces. It leads to CONVERT: turn that
    failure into representation or control. From CONVERT a long return arrow sweeps up the right side back
    to MODEL, labelled repeat. The condensed method reads: model the intent, give it authority, convert
    failures into capital, repeat. Each pass leaves the environment more capable than the one before.</desc>

  <defs>
    <marker id="mc-ah-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="mc-ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/>
    </marker>
    <marker id="mc-ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#155c38"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="#fdfcf9"/>

  <text x="420" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">The MAGE cycle</text>
  <text x="420" y="74" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">Model the intent · give it authority · convert failures into capital · repeat.</text>

  <!-- Station 1: MODEL (green) -->
  <rect x="290" y="100" width="260" height="76" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="420" y="134" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="1" fill="#1f7a4d">MODEL</text>
  <text x="420" y="159" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">make intent explicit</text>
  <path d="M420,176 L420,206" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#mc-ah-mut)"/>

  <!-- Station 2: ALIGN (rust) -->
  <rect x="290" y="208" width="260" height="76" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="420" y="242" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="1" fill="#9a3f12">ALIGN</text>
  <text x="420" y="267" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">give intent authority</text>
  <path d="M420,284 L420,314" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#mc-ah-mut)"/>

  <!-- Station 3: WORK (fleet blue) -->
  <rect x="290" y="316" width="260" height="76" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="420" y="350" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="1" fill="#2f5169">WORK</text>
  <text x="420" y="375" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">grant autonomy</text>

  <!-- the pass surfaces a failure -->
  <path d="M420,392 L420,444" fill="none" stroke="#b23b3b" stroke-width="2.2" marker-end="url(#mc-ah-red)"/>
  <text x="436" y="416" text-anchor="start" font-size="14" font-weight="700" fill="#b23b3b">failure / evidence</text>
  <text x="436" y="433" text-anchor="start" font-size="12" font-style="italic" fill="#57534e">where autonomy still fails</text>

  <!-- Station 4: CONVERT (rust / governance) -->
  <rect x="290" y="446" width="260" height="84" rx="10" fill="#f6f4ef" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="420" y="482" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="1" fill="#9a3f12">CONVERT</text>
  <text x="420" y="507" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">representation or control</text>

  <!-- the return arm: CONVERT climbs back up to MODEL — this closes the cycle -->
  <path d="M550,488 C712,470 712,148 552,138" fill="none" stroke="#155c38" stroke-width="2.6"
        marker-end="url(#mc-ah-green)"/>
  <text transform="rotate(-90 726 316)" x="726" y="316" text-anchor="middle" font-size="17"
        font-weight="700" fill="#155c38">repeat</text>
  <text transform="rotate(-90 752 316)" x="752" y="316" text-anchor="middle" font-size="12.5"
        font-style="italic" fill="#57534e">each pass compounds</text>

  <!-- takeaway caption -->
  <text x="420" y="588" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">Each pass leaves the environment more capable than the one before.</text>
</svg>
