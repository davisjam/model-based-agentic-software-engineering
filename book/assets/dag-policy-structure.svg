<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (ported from the chapter's mermaid fence, label: dag-policy-structure).
     REVISION (Part-3 §XII / FIG-3.5-2): LEGIBILITY — the earlier draft's labels were too small at
     book width. Narrowed the canvas (1180 -> 1000 wide) and enlarged every label so the same book
     width renders them larger, and SIMPLIFIED the distinction to two zones: what stays IN the deploy
     graph (correctness + cost-gate edges, host-identical) versus what moves OFF it (the load intent,
     banned from the graph, handled by the Scheduler reading a per-host profile). The registered
     slogan "profile edit, not graph edit" is kept verbatim on the caption spine. Palette: Umber
     Monograph tokens (fleet #2f5169 graph, churn #b23b3b banned, accent #9a3f12 profile,
     governed #1f7a4d plan). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"
     role="group" aria-labelledby="dpTitle dpDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="dpTitle">Load leaves the deploy graph for the Scheduler — a profile edit, not a graph edit</title>
  <desc id="dpDesc">Two zones. In the deploy graph, correctness and cost-gate edges stay, host-identical.
    The load intent is banned from the graph and migrates to the second zone, off the graph, where the
    Scheduler reads a per-host profile and emits an execution plan — the concurrency and cost-gate
    decisions for that host. Moving the stress burden between hosts edits the profile, never the graph.</desc>

  <defs>
    <marker id="dp-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="dp-thick" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- ===== Zone 1 — in the deploy graph ===== -->
  <rect x="30" y="70" width="440" height="400" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="50" y="106" font-size="20" font-weight="700" fill="#1c1917">In the deploy graph</text>

  <rect x="55" y="150" width="390" height="76" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="250" y="190" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">CORRECTNESS</text>
  <text x="250" y="214" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">host-identical — stays in the graph</text>

  <rect x="55" y="246" width="390" height="76" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="250" y="286" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">COST_GATE</text>
  <text x="250" y="310" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">host-identical — stays in the graph</text>

  <rect id="load" x="55" y="342" width="390" height="76" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="2.5"/>
  <text x="250" y="382" text-anchor="middle" font-size="24" font-weight="700" fill="#b23b3b">LOAD</text>
  <text x="250" y="406" text-anchor="middle" font-size="19" font-style="italic" fill="#b23b3b">banned from the graph</text>

  <!-- ===== the load intent migrates off the graph ===== -->
  <!-- The migrates head enters Scheduler's lower-left on a diagonal; a perpendicular auto-repair re-aim
       would sweep the curve through the on-curve "migrates" label, so this figure keeps its head angles. -->
  <!-- edge-grammar: keep-angles -->
  <!-- edge: load -> scheduler -->
  <path d="M444,380 C530,372 558,268 608,204" fill="none" stroke="#1c1917" stroke-width="4" marker-end="url(#dp-thick)"/>
  <text x="516" y="304" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">migrates</text>

  <!-- ===== Zone 2 — off the graph, the Scheduler ===== -->
  <rect x="530" y="70" width="440" height="400" rx="10" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="550" y="106" font-size="20" font-weight="700" fill="#1c1917">Off the graph — the Scheduler</text>

  <rect id="scheduler" x="610" y="150" width="300" height="80" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="760" y="190" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">Scheduler</text>
  <text x="760" y="216" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">reads a per-host profile</text>

  <line x1="760" y1="230" x2="760" y2="256" stroke="#1c1917" stroke-width="2" marker-end="url(#dp-ah)"/>

  <!-- the per-host profile (cylinder) — the thing you edit -->
  <g>
    <path d="M 640,272 v 58 a 120,14 0 0 0 240,0 v -58" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
    <ellipse cx="760" cy="272" rx="120" ry="14" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.5"/>
    <text x="760" y="312" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Per-host profile</text>
    <text x="760" y="336" text-anchor="middle" font-size="19" font-style="italic" fill="#57534e">ceiling · budget</text>
  </g>

  <line x1="760" y1="346" x2="760" y2="390" stroke="#1c1917" stroke-width="2" marker-end="url(#dp-ah)"/>

  <rect x="615" y="392" width="290" height="66" rx="33" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="760" y="433" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">Execution plan</text>

  <!-- ===== the registered slogan (verbatim) ===== -->
  <text x="500" y="520" text-anchor="middle" font-size="22" font-style="italic" font-weight="700" fill="#1c1917">Move stress between hosts — a profile edit, not a graph edit.</text>
</svg>
