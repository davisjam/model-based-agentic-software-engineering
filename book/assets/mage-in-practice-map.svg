<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230" role="img" aria-labelledby="title desc">
<title id="title">MAGE in practice: Chapter 4</title>
<desc id="desc">Four section panels surround a compact triangle of Model, Realize, and Evaluate connected in both directions. No starting point or fixed order is prescribed.</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="black"/></marker></defs>
