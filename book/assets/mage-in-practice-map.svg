<text x="11" y="158.3" text-anchor="start" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="9.5" font-weight="700" font-style="normal">§4.3 Brownfield Engineering</text>
<text x="11" y="175.3" text-anchor="start" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="9.5" font-weight="400" font-style="normal">Recovering latent models</text>
<text x="11" y="195.3" text-anchor="start" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="9.5" font-weight="400" font-style="normal">Reconciling models and implementation</text>
<text x="11" y="215.3" text-anchor="start" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="9.5" font-weight="400" font-style="normal">Introducing enforcement</text>
