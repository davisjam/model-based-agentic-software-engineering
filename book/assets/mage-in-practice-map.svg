<text x="237" y="20.3" text-anchor="start" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="9.5" font-weight="700" font-style="normal">§4.2 One Problem, Many Models</text>
<text x="237" y="43.3" text-anchor="start" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="9.5" font-weight="400" font-style="normal">Discovering new engineering questions</text>
<text x="237" y="63.3" text-anchor="start" font-family="&quot;Source Sans 3&quot;, sans-serif" font-size="9.5" font-weight="400" font-style="normal">Developing related models</text>
