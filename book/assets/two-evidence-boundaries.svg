<text x="132" y="109" text-anchor="middle" font-size="9">(work and dependencies)</text>
<rect x="201" y="82" width="112" height="35" rx="4" fill="#f2f2f2" stroke="#111" stroke-width=".7"/>
<text x="257" y="96" text-anchor="middle" font-size="9.5" font-weight="700">Memory model</text>
<text x="257" y="109" text-anchor="middle" font-size="9">(resource bounds)</text>
<rect x="326" y="82" width="112" height="35" rx="4" fill="#f2f2f2" stroke="#111" stroke-width=".7"/>
<text x="382" y="96" text-anchor="middle" font-size="9.5" font-weight="700">Latency model</text>
<text x="382" y="109" text-anchor="middle" font-size="9">(response time)</text>
