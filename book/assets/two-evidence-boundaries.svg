<text x="257" y="15" text-anchor="middle" font-size="10" font-weight="700">Proposed change</text>
<text x="257" y="28" text-anchor="middle" font-size="9">Increase worker concurrency</text>
<rect x="70" y="62" width="374" height="87" rx="4" fill="white" stroke="#111" stroke-width=".7"/>
