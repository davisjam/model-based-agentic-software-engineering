<path d="M313 99 L326 99" fill="none" stroke="#111" stroke-width="0.7"/>
<text x="257" y="131" text-anchor="middle" font-size="9" font-style="italic">Related models: concurrency constrained by memory;</text>
<text x="257" y="143" text-anchor="middle" font-size="9" font-style="italic">latency depends on work and memory.</text>
<text x="4" y="96" text-anchor="start" font-size="9" font-weight="700">Affected</text>
<text x="4" y="108" text-anchor="start" font-size="9" font-weight="700">models</text>
<text x="4" y="190" text-anchor="start" font-size="9" font-weight="700">Potentially</text>
<text x="4" y="202" text-anchor="start" font-size="9" font-weight="700">affected</text>
<text x="4" y="214" text-anchor="start" font-size="9" font-weight="700">obligations</text>
