<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 446 377" width="446" height="377" role="img" aria-labelledby="title desc" font-family="'Source Sans 3', sans-serif">
<title id="title">Model-aware change impact</title>
<desc id="desc">A proposed increase in worker concurrency leads through execution, memory, and latency models to legal ordering, peak-memory, and latency obligations. Correctness tests, memory analysis or measurement, and performance tests supply evidence for admission. The model and obligation boxes are shaded; all split and join rails share a central vertical spine.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z"/></marker></defs>
