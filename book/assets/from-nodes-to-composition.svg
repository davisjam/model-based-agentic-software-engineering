<?xml version="1.0" encoding="UTF-8"?>
<!-- graph-example figure — from-nodes-to-composition.svg. Fold to book/assets/. Regenerated
     260823: before/after of the DocAble pass-graph — computations WITHOUT composition (113 registered,
     only 2 authored relations) -> derive + type -> COMPOSITION made explicit (33 typed relations, a
     payload-bearing partition of 11 = 10 DATA_FLOW + 1 CROSS_SERVICE, vs 22 CONTROL_GATE). The
     representation exposed a distinction the implementation already contained; the mutation-kind
     dimension is deliberately NOT drawn (the prose discovers it next). -->
<!-- semantic-families: modeling, governance, agent, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 606" width="1000" height="606"
     role="img" aria-labelledby="fncTitle fncDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="fncTitle">From computations to composition</title>
  <desc id="fncDesc">Two panels. Left, computations without composition: a field of faint computation nodes crossed by only two conspicuous hand-authored relations — 113 computations were registered but only two relations were authored. Center: derive and type the relations. Right, composition made explicit: the derived relations split into two semantics — a payload-bearing group of eleven (ten DATA_FLOW and one CROSS_SERVICE) bracketed together, and twenty-two CONTROL_GATE relations. The transformation is two authored edges to thirty-three derived, typed relations to eleven payload plus twenty-two control.</desc>
