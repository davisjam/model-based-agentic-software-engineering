<!-- semantic-families: modeling, governance, agent, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570"
     role="img" aria-labelledby="fncTitle fncDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="fncTitle">From nodes to composition</title>
  <desc id="fncDesc">Two panels. Left: a structural model as first built — a dense cloud of 113 computation nodes crossed by only two hand-authored edges, so the parts are modeled but their composition is not. Right: the derived typed graph — named passes joined by three visibly distinct relations, ten data-flow edges, twenty-two control gates, and one cross-service payload edge, over the Produces / Consumes / ConsumesForControl vocabulary.</desc>
