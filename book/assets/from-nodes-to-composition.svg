<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 350" width="450" height="350" role="img" aria-labelledby="fncTitle fncDesc" font-family="'Source Sans 3', Arial, sans-serif">
<title id="fncTitle">From computations to composition</title>
  <desc id="fncDesc">Two panels. Left, computations without composition: a field of faint computation nodes crossed by only two conspicuous hand-authored relations — 125 computations are registered but only two relations were authored as seeds. Center: derive and type the relations. Right, composition made explicit: the projected relations split into two semantics — a payload-bearing group of thirty-three (thirty-two DATA_FLOW and one CROSS_SERVICE) bracketed together, and twenty-four CONTROL_GATE relations. The transformation is two authored seeds to fifty-five projected, typed relations to thirty-three payload plus twenty-four control.</desc>
