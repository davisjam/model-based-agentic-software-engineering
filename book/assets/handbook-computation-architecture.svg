<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="939" viewBox="0 0 440 313" role="img" aria-labelledby="handbook-computation-architecture-title handbook-computation-architecture-desc"><title id="handbook-computation-architecture-title">Computation declarations and their consumers</title><desc id="handbook-computation-architecture-desc">Office registry declarations feed scheduling and an edge emitter; only the emitter supplies the Office analytical graph. PDF typed declarations project the PDF analytical graph. Dashed checks compare the executable population with declarations and the analytical graph. Both graphs support dependency queries, critical-path analysis, mutation classification, and measurement or coverage. ShouldRun is an execution-applicability condition.</desc><defs><marker id="handbook-computation-architecture-arrow" markerWidth="5" markerHeight="5" refX="4.7" refY="2.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="black"/></marker></defs><rect width="440" height="313" fill="white"/>
