<?xml version="1.0" encoding="UTF-8"?>
<!-- Fig 3.3-X (formal-methods-mining-260815; folds to book/assets/match-mechanism-to-property.svg).
     "Match the mechanism to the property." An engineering obligation (rust) forks on WHAT KIND of
     property it is; each answer selects a different Alignment mechanism (gray = neutral machinery); a
     separate gate (green) attaches consequence. The three branches sit at the SAME level on purpose —
     alternatives selected by the property, NOT stages on a maturity ladder.
       CAN EXCLUDE IT?        -> CONSTRAINT  (structural prevention; DB compare-and-set / closed transition)
       BAD STATE / TRACE?     -> VALIDATOR   (state-space search; bounded explicit-state exploration)
       EVENTUALITY / FAIRNESS?-> VALIDATOR   (temporal model checking; TLA+ / TLC where warranted)
       all -> GATE, IF THE VERDICT SHOULD CONTROL ADMISSION
     Grayscale-survivable: every node labelled; the parallel three-way fork carries the calculus; hue only
     reinforces obligation (rust) vs machinery (gray) vs gate (green). Boxes first, labels last. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610"
     role="img" aria-labelledby="mmpTitle mmpDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mmpTitle">Match the mechanism to the property</title>
  <desc id="mmpDesc">An engineering obligation forks on what kind of property it is. If the invalid state can
    be excluded, a constraint gives structural prevention, such as a database compare-and-set or a closed
    transition. If the risk is a reachable bad state or trace, a validator explores the state space through
    bounded explicit-state exploration. If the obligation is an eventuality or fairness property, a validator
    does temporal model checking with TLA-plus and TLC where warranted. These are alternatives selected by the
    property, not stages on a maturity ladder. Whichever mechanism supplies the verdict, a separate gate gives
    it consequence if the verdict should control admission.</desc>

  <defs>
    <marker id="mmp-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <!-- ===== boxes (drawn first) ===== -->
  <rect x="0" y="0" width="1000" height="610" fill="#fdfcf9"/>

  <!-- top: engineering obligation (rust) -->
  <rect x="320" y="26" width="360" height="58" rx="12" fill="#fbeee6" stroke="#9a3f12" stroke-width="3"/>

  <!-- property-question boxes (gray) -->
  <rect x="45" y="140" width="280" height="54" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <rect x="360" y="140" width="280" height="54" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <rect x="675" y="140" width="280" height="54" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>

  <!-- mechanism boxes (gray, the Move) -->
  <rect x="45" y="252" width="280" height="50" rx="9" fill="#f3f1ee" stroke="#57534e" stroke-width="2.4"/>
  <rect x="360" y="252" width="280" height="50" rx="9" fill="#f3f1ee" stroke="#57534e" stroke-width="2.4"/>
  <rect x="675" y="252" width="280" height="50" rx="9" fill="#f3f1ee" stroke="#57534e" stroke-width="2.4"/>

  <!-- method sub-boxes (gray) -->
  <rect x="45" y="330" width="280" height="66" rx="9" fill="#faf9f6" stroke="#57534e" stroke-width="1.6"/>
  <rect x="360" y="330" width="280" height="66" rx="9" fill="#faf9f6" stroke="#57534e" stroke-width="1.6"/>
  <rect x="675" y="330" width="280" height="66" rx="9" fill="#faf9f6" stroke="#57534e" stroke-width="1.6"/>

  <!-- gate (green) -->
  <rect x="280" y="470" width="440" height="72" rx="12" fill="#e3f0e7" stroke="#155c38" stroke-width="3"/>

  <!-- ===== arrows ===== -->
  <line x1="500" y1="84" x2="500" y2="106" stroke="#1c1917" stroke-width="2"/>
  <line x1="185" y1="106" x2="815" y2="106" stroke="#1c1917" stroke-width="2"/>
  <line x1="185" y1="106" x2="185" y2="138" stroke="#1c1917" stroke-width="2" marker-end="url(#mmp-k)"/>
  <line x1="500" y1="106" x2="500" y2="138" stroke="#1c1917" stroke-width="2" marker-end="url(#mmp-k)"/>
  <line x1="815" y1="106" x2="815" y2="138" stroke="#1c1917" stroke-width="2" marker-end="url(#mmp-k)"/>

  <line x1="185" y1="194" x2="185" y2="250" stroke="#1c1917" stroke-width="2" marker-end="url(#mmp-k)"/>
  <line x1="500" y1="194" x2="500" y2="250" stroke="#1c1917" stroke-width="2" marker-end="url(#mmp-k)"/>
  <line x1="815" y1="194" x2="815" y2="250" stroke="#1c1917" stroke-width="2" marker-end="url(#mmp-k)"/>

  <line x1="185" y1="302" x2="185" y2="328" stroke="#1c1917" stroke-width="2" marker-end="url(#mmp-k)"/>
  <line x1="500" y1="302" x2="500" y2="328" stroke="#1c1917" stroke-width="2" marker-end="url(#mmp-k)"/>
  <line x1="815" y1="302" x2="815" y2="328" stroke="#1c1917" stroke-width="2" marker-end="url(#mmp-k)"/>

  <line x1="185" y1="396" x2="185" y2="450" stroke="#1c1917" stroke-width="2"/>
  <line x1="815" y1="396" x2="815" y2="450" stroke="#1c1917" stroke-width="2"/>
  <line x1="185" y1="450" x2="500" y2="450" stroke="#1c1917" stroke-width="2"/>
  <line x1="815" y1="450" x2="500" y2="450" stroke="#1c1917" stroke-width="2"/>
  <line x1="500" y1="396" x2="500" y2="468" stroke="#1c1917" stroke-width="2" marker-end="url(#mmp-k)"/>

  <!-- ===== labels (drawn last, on top) ===== -->
  <text x="500" y="61" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="0.5" fill="#9a3f12">ENGINEERING OBLIGATION</text>

  <text x="500" y="126" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">What kind of property is it?</text>

  <text x="185" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">CAN EXCLUDE IT?</text>
  <text x="500" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">BAD STATE / TRACE?</text>
  <text x="815" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">EVENTUALITY / FAIRNESS?</text>
  <text x="185" y="185" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">yes</text>
  <text x="500" y="185" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">yes</text>
  <text x="815" y="185" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">yes</text>

  <text x="185" y="283" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">CONSTRAINT</text>
  <text x="500" y="283" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">VALIDATOR</text>
  <text x="815" y="283" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">VALIDATOR</text>

  <text x="185" y="358" text-anchor="middle" font-size="14" fill="#1c1917">structural prevention</text>
  <text x="185" y="380" text-anchor="middle" font-size="14" fill="#57534e">DB compare-and-set / closed transition</text>
  <text x="500" y="352" text-anchor="middle" font-size="14" fill="#1c1917">state-space search</text>
  <text x="500" y="370" text-anchor="middle" font-size="14" fill="#57534e">purpose-built model checker</text>
  <text x="500" y="386" text-anchor="middle" font-size="14" fill="#57534e">(bounded explicit-state)</text>
  <text x="815" y="358" text-anchor="middle" font-size="14" fill="#1c1917">temporal model checking</text>
  <text x="815" y="380" text-anchor="middle" font-size="14" fill="#57534e">TLA+ / TLC where warranted</text>

  <text x="500" y="502" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">GATE, IF THE VERDICT</text>
  <text x="500" y="525" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">SHOULD CONTROL ADMISSION</text>

  <text x="500" y="576" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">Alternatives selected by the property &#8212; not stages on a maturity ladder.</text>
</svg>
