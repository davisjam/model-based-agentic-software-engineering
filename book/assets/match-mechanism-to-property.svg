<circle cx="26.5" cy="118.5" r="0.65" fill="#111111" stroke="#111111" stroke-width=".9" />
<rect x="39" y="122" width="16" height="15" rx="2" fill="#ffffff" stroke="#111111" stroke-width=".8" />
<path d="M42 122 V117 C42 110 52 110 52 117 V122" fill="none" stroke="#111111" stroke-width="1" />
<circle cx="47" cy="128" r="1.1" fill="#111111" stroke="#111111" stroke-width=".9" />
<path d="M47 128 L47 132" fill="none" stroke="#111111" stroke-width="1" />
