<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 197" width="450" height="197" role="img" aria-labelledby="title desc" font-family="'Source Sans 3', sans-serif">
<title id="title">Two protections in DocAble’s job-recovery protocol</title>
<desc id="desc">DocAble job-recovery protocol with two obligations and two protections. At left, only one worker may acquire an effect claim; atomic compare-and-set restricts acquisition to the required stored state. At right, a stale release must not clear a newer claim; an explicit-state checker explores bounded interleavings. The lower boxes distinguish runtime constraint from model analysis.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" /></marker></defs>
<rect x="91" y="1.778" width="268" height="30.222" rx="3" fill="#ffffff" stroke="#111111" stroke-width=".8" />
<text x="225" y="14.222" text-anchor="middle" font-size="10.5" font-weight="700">DocAble: Job-Recovery Protocol</text>
<text x="225" y="25.778" text-anchor="middle" font-size="10" font-style="italic">Two obligations and how DocAble addresses them</text>
<path d="M225 32 L225 37.778 L110.5 37.778" fill="none" stroke="#111111" stroke-width="0.8" />
<path d="M110.5 37.778 L110.5 44" fill="none" stroke="#111111" stroke-width="0.8" marker-end="url(#arrow)" />
<path d="M225 37.778 L338.5 37.778 L338.5 44" fill="none" stroke="#111111" stroke-width="0.8" marker-end="url(#arrow)" />
<rect x="3" y="44" width="215" height="32" rx="3" fill="#ffffff" stroke="#111111" stroke-width=".8" />
<rect x="231" y="44" width="215" height="32" rx="3" fill="#ffffff" stroke="#111111" stroke-width=".8" />
<text x="110.5" y="57.333" text-anchor="middle" font-size="10.5" font-weight="700">Prevent duplicate claims</text>
<text x="110.5" y="69.778" text-anchor="middle" font-size="9.5" font-style="italic">Only one worker may acquire an effect claim.</text>
<text x="338.5" y="57.333" text-anchor="middle" font-size="10.5" font-weight="700">Preserve correct recovery</text>
<text x="338.5" y="69.778" text-anchor="middle" font-size="9.5" font-style="italic">A stale release must not clear a newer claim.</text>
<path d="M110.5 76 L110.5 84" fill="none" stroke="#111111" stroke-width="0.8" marker-end="url(#arrow)" />
<path d="M338.5 76 L338.5 84" fill="none" stroke="#111111" stroke-width="0.8" marker-end="url(#arrow)" />
<rect x="3" y="84" width="215" height="69" rx="3" fill="#ffffff" stroke="#111111" stroke-width=".8" />
<rect x="231" y="84" width="215" height="69" rx="3" fill="#ffffff" stroke="#111111" stroke-width=".8" />
<path d="M68 90 L68 147" fill="none" stroke="#111111" stroke-width="0.8" />
<path d="M296 90 L296 147" fill="none" stroke="#111111" stroke-width="0.8" />
<text x="76" y="102" text-anchor="start" font-size="10.2" font-weight="700">ATOMIC COMPARE-AND-SET</text>
<text x="76" y="117" text-anchor="start" font-size="9.5">Acquire the claim only if the stored</text>
<text x="76" y="129" text-anchor="start" font-size="9.5">state matches the expected state.</text>
<text x="304" y="98" text-anchor="start" font-size="10.2" font-weight="700">EXPLICIT-STATE CHECKER</text>
<text x="304" y="112" text-anchor="start" font-size="9.5">Explore bounded interleavings</text>
<text x="304" y="123" text-anchor="start" font-size="9.5">of claims and releases to verify</text>
<text x="304" y="134" text-anchor="start" font-size="9.5">that a stale release cannot</text>
<text x="304" y="145" text-anchor="start" font-size="9.5">invalidate ownership.</text>
<rect x="18" y="101" width="30" height="11" rx="2" fill="#ffffff" stroke="#111111" stroke-width=".8" />
<rect x="18" y="113" width="30" height="11" rx="2" fill="#ffffff" stroke="#111111" stroke-width=".8" />
