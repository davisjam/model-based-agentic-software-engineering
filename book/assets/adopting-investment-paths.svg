<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: adopting-investment-paths). Appendix G figure G.2-1. Two columns, not a
     ladder: the two recurring engineering costs (reconstruction on the left, repeated adjudication on the
     right) each admit a cheap first response and a stronger investment beyond it. Left (representation):
     reconstruction -> better context -> stronger representation -> analyzable model. Right (control):
     adjudication -> better guidance -> independent evidence -> validator/constraint/gate. Both paths reduce
     repeated judgment and converge on engineering capital that later work inherits. The paths are investment
     choices made surface by surface where the expected return justifies them, not maturity levels. Palette:
     rust #9a3f12 (the recurring cost to reduce), green #1f7a4d / #e3f0e7 (representation path), blue #2f5169 /
     #e7edf3 (control path), cream #f6f4ef (less repeated judgment), ink #1c1917. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580"
     role="img" aria-labelledby="ipTitle ipDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="ipTitle">Where organizational investment can go: two paths from recurring cost to engineering capital</title>
  <desc id="ipDesc">Two columns descend from the repeated engineering costs. On the left, reconstruction is
    answered by better context, then stronger representation, then an analyzable model. On the right,
    repeated adjudication is answered by better guidance, then independent evidence, then a validator,
    constraint, or gate. Both columns converge on less repeated judgment and then on engineering capital that
    later work inherits. The paths are investment choices, made surface by surface where the expected return
    justifies construction and upkeep, not maturity levels.</desc>

  <defs>
    <marker id="ip-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="0.4" fill="#1c1917">WHERE ORGANIZATIONAL INVESTMENT CAN GO</text>
  <text x="490" y="66" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="0.8" fill="#9a3f12">REPEATED ENGINEERING COST</text>

  <text x="250" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3f12">reconstruction</text>
  <text x="730" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3f12">repeated adjudication</text>

  <g stroke="#57534e" stroke-width="2" fill="none" marker-end="url(#ip-ah)">
    <line x1="250" y1="102" x2="250" y2="126"/>
    <line x1="730" y1="102" x2="730" y2="126"/>
    <line x1="250" y1="180" x2="250" y2="204"/>
    <line x1="730" y1="180" x2="730" y2="204"/>
    <line x1="250" y1="258" x2="250" y2="282"/>
    <line x1="730" y1="258" x2="730" y2="282"/>
  </g>

  <!-- LEFT column — representation path (green) -->
  <g font-size="16" fill="#1c1917" text-anchor="middle">
    <rect x="125" y="128" width="250" height="50" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
    <text x="250" y="159">better context</text>
    <rect x="125" y="206" width="250" height="50" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
    <text x="250" y="237">stronger representation</text>
    <rect x="125" y="284" width="250" height="50" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.4"/>
    <text x="250" y="315">analyzable model</text>
  </g>

  <!-- RIGHT column — control path (blue) -->
  <g font-size="16" fill="#1c1917" text-anchor="middle">
    <rect x="605" y="128" width="250" height="50" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="730" y="159">better guidance</text>
    <rect x="605" y="206" width="250" height="50" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="730" y="237">independent evidence</text>
    <rect x="605" y="284" width="250" height="50" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.4"/>
    <text x="730" y="315">validator · constraint · gate</text>
  </g>

  <!-- converge -->
  <g stroke="#57534e" stroke-width="2" fill="none">
    <path d="M250,334 L250,368 L490,368"/>
    <path d="M730,334 L730,368 L490,368"/>
    <line x1="490" y1="368" x2="490" y2="392" marker-end="url(#ip-ah)"/>
  </g>

  <rect x="330" y="394" width="320" height="50" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="490" y="425" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">LESS REPEATED JUDGMENT</text>

  <line x1="490" y1="444" x2="490" y2="468" stroke="#57534e" stroke-width="2" fill="none" marker-end="url(#ip-ah)"/>

  <rect x="310" y="470" width="360" height="66" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="490" y="498" text-anchor="middle" font-size="18" font-weight="700" fill="#155c38">ENGINEERING CAPITAL</text>
  <text x="490" y="521" text-anchor="middle" font-size="14.5" fill="#57534e">later work inherits the result</text>

  <text x="490" y="562" text-anchor="middle" font-size="14.5" font-style="italic" fill="#57534e">Strengthen only where the expected return justifies construction and upkeep — surface by surface, not a maturity ladder.</text>
</svg>
