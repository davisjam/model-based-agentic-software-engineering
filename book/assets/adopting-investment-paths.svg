<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored appendix figure: print-readable geometry. Original title/desc, semantic content and native monochrome partner preserved. -->
<!-- Hand-authored SVG (label: adopting-investment-paths). Appendix G figure G.2-1. Two columns, not a
     ladder: the two recurring engineering costs (reconstruction on the left, repeated adjudication on the
     right) each admit a cheap first response and a stronger investment beyond it. Left (representation):
     reconstruction -> better context -> stronger representation -> analyzable model. Right (control):
     adjudication -> better guidance -> independent evidence -> validator/constraint/gate. Both paths reduce
     repeated judgment and converge on engineering capital that later work inherits. The paths are investment
     choices made surface by surface where the expected return justifies them, not maturity levels. Palette:
     rust #9a3f12 (the recurring cost to reduce), green #1f7a4d / #e3f0e7 (representation path), blue #2f5169 /
     #e7edf3 (control path), cream #f6f4ef (less repeated judgment), ink #1c1917. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" role="img" aria-labelledby="ipTitle ipDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="ipTitle">Where organizational investment can go: two paths from recurring cost to engineering capital</title>
<desc id="ipDesc">Two columns descend from the repeated engineering costs. On the left, reconstruction is
    answered by better context, then stronger representation, then an analyzable model. On the right,
    repeated adjudication is answered by better guidance, then independent evidence, then a validator,
    constraint, or gate. Both columns converge on less repeated judgment and then on engineering capital that
    later work inherits. The paths are investment choices, made surface by surface where the expected return
    justifies construction and upkeep, not maturity levels.</desc>
<defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c1917"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57534e"/></marker><marker id="rust-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a3f12"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f5169"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f7a4d"/></marker></defs>
<text x="450" y="29" text-anchor="middle" font-size="22" fill="#1c1917" font-weight="700">WHERE ORGANIZATIONAL INVESTMENT CAN GO</text>
<text x="450" y="62" text-anchor="middle" font-size="20" fill="#9a3f12" font-weight="700">REPEATED ENGINEERING COST</text>
<text x="235" y="94" text-anchor="middle" font-size="20" fill="#9a3f12" font-weight="700">reconstruction</text>
<path d="M235 103 L235 122" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#muted-arrow)"/>
<rect x="72" y="124" width="326" height="48" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
<text x="235" y="155" text-anchor="middle" font-size="20" fill="#1c1917">better context</text>
<path d="M235 172 L235 194" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#muted-arrow)"/>
<rect x="72" y="196" width="326" height="48" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
<text x="235" y="227" text-anchor="middle" font-size="20" fill="#1c1917">stronger representation</text>
<path d="M235 244 L235 266" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#muted-arrow)"/>
<rect x="72" y="268" width="326" height="48" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
<text x="235" y="299" text-anchor="middle" font-size="20" fill="#1c1917">analyzable model</text>
<path d="M235 316 V340 H450" fill="none" stroke="#57534e" stroke-width="2.2"/>
<text x="665" y="94" text-anchor="middle" font-size="20" fill="#9a3f12" font-weight="700">repeated adjudication</text>
<path d="M665 103 L665 122" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#muted-arrow)"/>
<rect x="502" y="124" width="326" height="48" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="665" y="155" text-anchor="middle" font-size="20" fill="#1c1917">better guidance</text>
<path d="M665 172 L665 194" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#muted-arrow)"/>
<rect x="502" y="196" width="326" height="48" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="665" y="227" text-anchor="middle" font-size="20" fill="#1c1917">independent evidence</text>
<path d="M665 244 L665 266" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#muted-arrow)"/>
<rect x="502" y="268" width="326" height="48" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
<text x="665" y="299" text-anchor="middle" font-size="20" fill="#1c1917">validator · constraint · gate</text>
<path d="M665 316 V340 H450" fill="none" stroke="#57534e" stroke-width="2.2"/>
<path d="M450 340 L450 357" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#muted-arrow)"/>
<rect x="270" y="359" width="360" height="48" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
<text x="450" y="390" text-anchor="middle" font-size="20" fill="#1c1917" font-weight="700">LESS REPEATED JUDGMENT</text>
<path d="M450 407 L450 428" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#muted-arrow)"/>
<rect x="250" y="430" width="400" height="66" rx="8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
<text x="450" y="458" text-anchor="middle" font-size="22" fill="#1f7a4d" font-weight="700">ENGINEERING CAPITAL</text>
<text x="450" y="484" text-anchor="middle" font-size="20" fill="#57534e">later work inherits the result</text>
<text x="450" y="528" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">Strengthen only where the expected return justifies construction and upkeep —</text>
<text x="450" y="553" text-anchor="middle" font-size="20" fill="#57534e" font-style="italic">surface by surface, not a maturity ladder.</text>
</svg>
