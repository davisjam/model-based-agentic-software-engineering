<?xml version="1.0" encoding="UTF-8"?>
<!-- R54-G figure round — appendix-g-4-host-execution-policy.svg, common vocabulary per R54-FIGURE-MANIFEST. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440"
     role="img" aria-labelledby="g4Title g4Desc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="g4Title">Stable topology, variable Host Execution Policy — the deploy graph holds; the policy varies</title>
  <desc id="g4Desc">A stable engineering view runs left to right along solid arrows: web, queue, worker, storage.
    From the worker a dashed scheduled-under arrow drops to a Host Execution Policy table, the variable overlay.
    The table maps host profile to scheduling: elastic fans out, metered gives a bounded fan, scarce serializes.
    No heavy boundary appears here — the figure is descriptive, and the representative rule is that load rationing
    lives in the scheduler, not by mutating the deploy graph per host: no deploy edge carries the LOAD intent.
    Legend as in Figure C-1; this figure shows a representation that stays advisory, with authority left to Part
    III. Weight and dash carry the meaning without colour.</desc>

  <defs>
    <marker id="g4-solid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/></marker>
  </defs>

  <rect x="0" y="0" width="720" height="440" fill="#fdfcf9"/>
  <text x="40" y="34" font-size="15" font-weight="600" fill="#57534e">Question: where does work run, and which decisions vary by environment?</text>

  <text x="360" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#2f5169" letter-spacing="0.5">STABLE ENGINEERING VIEW</text>

  <!-- topology row (representation) -->
  <rect id="web" x="40"  y="78" width="120" height="54" rx="8" fill="#f6ece9" stroke="#8a2f2f" stroke-width="2"/>
  <text x="100" y="111" text-anchor="middle" font-size="18" font-weight="700" fill="#8a2f2f">web</text>
  <rect id="queue" x="210" y="78" width="120" height="54" rx="8" fill="#f6ece9" stroke="#8a2f2f" stroke-width="2"/>
  <text x="270" y="111" text-anchor="middle" font-size="18" font-weight="700" fill="#8a2f2f">queue</text>
  <rect id="worker" x="380" y="78" width="120" height="54" rx="8" fill="#f6ece9" stroke="#8a2f2f" stroke-width="2"/>
  <text x="440" y="111" text-anchor="middle" font-size="18" font-weight="700" fill="#8a2f2f">worker</text>
  <rect id="storage" x="550" y="78" width="120" height="54" rx="8" fill="#f6ece9" stroke="#8a2f2f" stroke-width="2"/>
  <text x="610" y="111" text-anchor="middle" font-size="18" font-weight="700" fill="#8a2f2f">storage</text>

  <!-- topology edges (SOLID declared) -->
  <!-- edge: web -> queue -->
  <line x1="160" y1="105" x2="210" y2="105" stroke="#2f5169" stroke-width="2.2" marker-end="url(#g4-solid)"/>
  <!-- edge: queue -> worker -->
  <line x1="330" y1="105" x2="380" y2="105" stroke="#2f5169" stroke-width="2.2" marker-end="url(#g4-solid)"/>
  <!-- edge: worker -> storage -->
  <line x1="500" y1="105" x2="550" y2="105" stroke="#2f5169" stroke-width="2.2" marker-end="url(#g4-solid)"/>

  <!-- scheduled under (DASHED) worker -> policy -->
  <!-- edge: worker .. policy -->
  <line x1="440" y1="132" x2="440" y2="199" stroke="#2f5169" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g4-solid)"/>
  <text x="452" y="170" font-size="14" font-style="italic" fill="#57534e">scheduled under</text>
  <text x="452" y="186" font-size="14" font-weight="700" fill="#2f5169" letter-spacing="0.5">DERIVED</text>

  <!-- HOST EXECUTION POLICY table (representation, variable overlay) -->
  <rect id="policy" x="220" y="200" width="300" height="140" rx="8" fill="#f6ece9" stroke="#8a2f2f" stroke-width="2"/>
  <text x="370" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#8a2f2f">HOST EXECUTION POLICY</text>
  <line x1="220" y1="238" x2="520" y2="238" stroke="#8a2f2f" stroke-width="1.2"/>
  <line x1="360" y1="238" x2="360" y2="340" stroke="#8a2f2f" stroke-width="1.2"/>
  <text x="290" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#57534e">host profile</text>
  <text x="440" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#57534e">scheduling</text>
  <line x1="220" y1="264" x2="520" y2="264" stroke="#e3d3cd" stroke-width="1"/>
  <text x="290" y="286" text-anchor="middle" font-size="15" fill="#1c1917">elastic</text>
  <text x="440" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">fan out</text>
  <line x1="220" y1="298" x2="520" y2="298" stroke="#e3d3cd" stroke-width="1"/>
  <text x="290" y="318" text-anchor="middle" font-size="15" fill="#1c1917">metered</text>
  <text x="440" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">bounded fan</text>
  <line x1="220" y1="330" x2="520" y2="330" stroke="#e3d3cd" stroke-width="1"/>
  <text x="290" y="336" text-anchor="middle" font-size="15" fill="#1c1917">scarce</text>
  <text x="440" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">serialize</text>

  <text x="360" y="372" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">Load rationing lives in the scheduler — no deploy edge carries the LOAD intent.</text>
  <text x="40" y="418" font-size="14" font-style="italic" fill="#57534e">Legend: see Figure C-1.  No gate here: the policy is a representation; Part III decides any authority.</text>
</svg>
