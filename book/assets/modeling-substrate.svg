<?xml version="1.0" encoding="UTF-8"?>
<!-- 2.8 System-Knowledge primary model (part2-v8-260814 re-author; folds to book/assets/).
     REVISION per v8 editor guidance (2.8-1): REDRAW radial/peer to kill the false top/bottom tiers. The
     center is SHARED IDENTITIES; the six purpose models (structural, behavioral, ownership, decision,
     measurement, provenance) are PEERS arranged around it, each joined to the center. Traceability,
     derivation, and query surfaces live in the surrounding footer band, NOT inside the identity box.
     Grammar: gray #57534e = the shared-identity center that joins without collapsing; blue #2f5169 = the
     six heterogeneous peer models. Hand-authored (a radial peer arrangement, not a layered stack). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580"
     role="img" aria-labelledby="mbTitle mbDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="mbTitle">Heterogeneous models arranged as peers around shared identities</title>
  <desc id="mbDesc">A radial arrangement. At the center sit shared identities. Six purpose models —
    structural, behavioral, ownership, decision, measurement, and provenance — are peers around the center,
    each joined to it. No model sits above another. Traceability, derivation, and query surfaces surround
    them in a footer band, not inside the identity center. The unity is semantic, not a hierarchy.</desc>

  <text x="380" y="30" text-anchor="middle" font-size="15.2" font-weight="700" letter-spacing="1.2" fill="#2f5169">DOCABLE MODELING SUBSTRATE &#183; SIX PEER MODELS</text>

  <!-- spokes: center to each peer (drawn first, under the boxes); each runs hub-center to peer-center so the
       opaque ellipse + box fills cap the ends. The hub is an ellipse (not lint-legible), so a transparent
       rect over it carries the id "shared-identities". -->
  <g stroke="#57534e" stroke-width="2" opacity="0.75">
    <!-- edge: structural -> shared-identities -->
    <line x1="380" y1="238" x2="380" y2="138"/>
    <!-- edge: behavioral -> shared-identities -->
    <line x1="380" y1="290" x2="549" y2="200"/>
    <!-- edge: ownership -> shared-identities -->
    <line x1="380" y1="290" x2="549" y2="380"/>
    <!-- edge: decision -> shared-identities -->
    <line x1="380" y1="342" x2="380" y2="442"/>
    <!-- edge: measurement -> shared-identities -->
    <line x1="380" y1="290" x2="211" y2="380"/>
    <!-- edge: provenance -> shared-identities -->
    <line x1="380" y1="290" x2="211" y2="200"/>
  </g>

  <!-- center: SHARED IDENTITIES (gray) -->
  <rect id="shared-identities" x="276" y="238" width="208" height="104" fill="none" stroke="none"/>
  <ellipse cx="380" cy="290" rx="104" ry="52" fill="#f6f4ef" stroke="#57534e" stroke-width="2.8"/>
  <text x="380" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">SHARED</text>
  <text x="380" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">IDENTITIES</text>

  <!-- six peer models (blue) -->
  <g font-size="15.5" font-weight="700" fill="#2f5169" text-anchor="middle">
    <!-- top -->
    <rect id="structural" x="305" y="86" width="150" height="52" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
    <text x="380" y="118">structural</text>
    <!-- upper-right -->
    <rect id="behavioral" x="474" y="174" width="150" height="52" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
    <text x="549" y="206">behavioral</text>
    <!-- lower-right -->
    <rect id="ownership" x="474" y="354" width="150" height="52" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
    <text x="549" y="386">ownership</text>
    <!-- bottom -->
    <rect id="decision" x="305" y="442" width="150" height="52" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
    <text x="380" y="474">decision</text>
    <!-- lower-left -->
    <rect id="measurement" x="136" y="354" width="150" height="52" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
    <text x="211" y="386">measurement</text>
    <!-- upper-left -->
    <rect id="provenance" x="136" y="174" width="150" height="52" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.2"/>
    <text x="211" y="206">provenance</text>
  </g>

  <!-- surrounding band: traceability / derivation / query surfaces (NOT in the identity box) -->
  <rect x="90" y="516" width="580" height="34" rx="12" fill="none" stroke="#57534e" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="380" y="538" text-anchor="middle" font-size="15.2" font-weight="700" fill="#57534e">traceability &#183; derivation &#183; query surfaces</text>

  <!-- footer: protect the point -->
  <text x="380" y="570" text-anchor="middle" font-size="15.2" font-style="italic" fill="#1c1917">Multiple views of one system &#8212; no tiers, no single universal architecture model.</text>
</svg>
