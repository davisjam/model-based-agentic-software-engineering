<svg xmlns="http://www.w3.org/2000/svg" width="896" height="620" viewBox="0 0 448 310" role="img" aria-labelledby="title desc">
<title id="title">Heterogeneous models over shared identities</title>
<desc id="desc">A service performance question follows the service registry into the shared-identity hub, out to deployment topology, back through the hub, then out to measurements. Four other representations have thin connections to the same hub.</desc>
