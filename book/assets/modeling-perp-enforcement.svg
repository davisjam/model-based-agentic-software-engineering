<rect x="164" y="113" width="40" height="25" rx="4" fill="#f6f4ef" stroke="#57534e" stroke-width="0.8"/>
<text x="184" y="129.0" text-anchor="middle" font-size="9" fill="#57534e" font-weight="700">observe</text>
<path d="M248.5,80 L248.5,97 L227,97 L227,112" fill="none" stroke="#57534e" stroke-width=".8" marker-end="url(#a57534e)"/>
<rect x="207" y="113" width="40" height="25" rx="4" fill="#f6f4ef" stroke="#57534e" stroke-width="0.8"/>
<text x="227" y="129.0" text-anchor="middle" font-size="9" fill="#57534e" font-weight="700">adapt</text>
<path d="M248.5,80 L248.5,97 L270,97 L270,112" fill="none" stroke="#57534e" stroke-width=".8" marker-end="url(#a57534e)"/>
<rect x="250" y="113" width="40" height="25" rx="4" fill="#f6f4ef" stroke="#57534e" stroke-width="0.8"/>
<text x="270" y="129.0" text-anchor="middle" font-size="9" fill="#ad420d" font-weight="700">degrade</text>
<path d="M248.5,80 L248.5,97 L313,97 L313,112" fill="none" stroke="#57534e" stroke-width=".8" marker-end="url(#a57534e)"/>
<rect x="293" y="113" width="40" height="25" rx="4" fill="#f6f4ef" stroke="#57534e" stroke-width="0.8"/>
<text x="313" y="129.0" text-anchor="middle" font-size="9" fill="#ad420d" font-weight="700">gate</text>
<text x="78.5" y="155.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">“What quantity and bound matter?”</text>
<text x="248.5" y="155.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">“What enforcement is justified?”</text>
<text x="168.75" y="187.0" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">The model defines the quantity and bound;</text>
<text x="168.75" y="197.8" text-anchor="middle" font-size="9" fill="#1c1917" font-style="italic">Alignment decides whether to observe, adapt, degrade, or gate.</text>
</svg>
