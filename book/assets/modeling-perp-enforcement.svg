<text x="32.5" y="67.0" text-anchor="middle" font-size="10" fill="#2f5169" font-weight="700">quantity</text>
<rect x="4" y="106" width="57" height="25" rx="4" fill="#e7edf3" stroke="#2f5169" stroke-width="0.8"/>
<text x="32.5" y="122.0" text-anchor="middle" font-size="10" fill="#2f5169" font-weight="700">bound</text>
