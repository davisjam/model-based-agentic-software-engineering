<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 337.5 204" width="337.5" height="204" role="img" aria-labelledby="paTitle paDesc" font-family="&quot;Source Sans 3&quot;, sans-serif"><title xmlns="http://www.w3.org/2000/svg" id="paTitle">One measurement, different enforcement decisions</title>
  <desc xmlns="http://www.w3.org/2000/svg" id="paDesc">Chapter 2, the model, names a quantity and a reference bound and compares them, answering
    what quantity and bound matter. Chapter 3, the enforcement decision, takes the same model and chooses its
    force: observe, adapt, degrade, or gate. Observe and adapt are shown in gray; degrade and gate, the
    consequential decisions, in rust. Modeling and enforcement are separate moves over one shared model.</desc>

  <defs><marker id="a2f5169" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#2f5169"/></marker><marker id="a57534e" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#57534e"/></marker><marker id="a086438" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#086438"/></marker><marker id="a1c1917" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="#1c1917"/></marker></defs>
<text x="168.75" y="12.0" text-anchor="middle" font-size="10" fill="#1c1917" font-weight="700">One Measurement, Different Enforcement Decisions</text>
<text x="78" y="36.0" text-anchor="middle" font-size="9" fill="#2f5169" font-weight="700">CHAPTER 2 · MODEL</text>
<text x="248.75" y="31.0" text-anchor="middle" font-size="9" fill="#1c1917" font-weight="700">CHAPTER 3 ·</text>
<text x="248.75" y="41.8" text-anchor="middle" font-size="9" fill="#1c1917" font-weight="700">ENFORCEMENT DECISION</text>
