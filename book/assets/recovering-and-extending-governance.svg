<text x="222" y="89" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="bold" fill="black">Active alignment</text>
<text x="222" y="105" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Modify and evaluate</text>
<text x="222" y="117" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">until obligations hold</text>
<rect x="164" y="172" width="116" height="48" rx="3" fill="white" stroke="black" stroke-width="0.8"/>
<text x="222" y="185" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="bold" fill="black">Passive alignment</text>
<text x="222" y="201" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Check later changes</text>
<text x="222" y="213" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">admit or reject</text>
