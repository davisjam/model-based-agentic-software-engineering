<svg xmlns="http://www.w3.org/2000/svg" width="1332" height="552" viewBox="0 0 444 184" role="img" aria-labelledby="title desc"><title id="title">Recovering and extending governance in an existing system</title><desc id="desc">Three complementary practices for an existing system. Recover models by distinguishing legitimate implementation patterns, latent concepts worth representing, and mechanical cleanup. Active alignment changes implementation until obligations hold; passive alignment checks subsequent changes against the retained models. Expand the alignment kernel incrementally while protecting established obligations.</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.7" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="black"/></marker></defs><rect width="444" height="184" fill="white"/>
<text x="73" y="13" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="bold" fill="black">(a) Recover models</text>
<text x="222" y="13" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="bold" fill="black">(b) Establish alignment</text>
<text x="373" y="13" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="bold" fill="black">(c) Expand governance</text>
