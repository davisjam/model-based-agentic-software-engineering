<text x="74.0" y="40.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Implementation patterns</text>
<text x="74.0" y="52.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">+ engineering knowledge</text>
