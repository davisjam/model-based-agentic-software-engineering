<text x="80.0" y="98.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Legitimate patterns</text>
<text x="80.0" y="110.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">retain / exempt</text>
<rect x="24" y="121" width="112" height="26" rx="0" fill="#eaeaea" stroke="black" stroke-width="0.8"/>
<text x="80.0" y="131.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Latent concepts</text>
<text x="80.0" y="143.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">represent explicitly</text>
