<text x="222" y="87" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Modify and evaluate</text>
<text x="222" y="99" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">until obligations hold</text>
<rect x="164" y="136" width="116" height="44" rx="3" fill="white" stroke="black" stroke-width="0.8"/>
<text x="222" y="149" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="bold" fill="black">Passive alignment</text>
