<text x="80.0" y="118.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Legitimate patterns</text>
<text x="80.0" y="130.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">retain / exempt</text>
<rect x="24" y="148" width="112" height="30" rx="0" fill="#eaeaea" stroke="black" stroke-width="0.8"/>
<text x="80.0" y="160.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Latent concepts</text>
<text x="80.0" y="172.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">represent explicitly</text>
<rect x="24" y="190" width="112" height="30" rx="0" fill="white" stroke="black" stroke-width="0.8"/>
<text x="80.0" y="202.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">Mechanical cleanup</text>
<text x="80.0" y="214.4" text-anchor="middle" font-family="Source Sans 3,Arial,sans-serif" font-size="10" font-weight="normal" fill="black">local fix / codemod</text>
