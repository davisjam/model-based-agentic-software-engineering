<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (not Mermaid, label: theory-of-mage-dynamics). Renders in Chapter 6.1
     (Toward a Theory of MAGE) and on the site's Theory page: the theory drawn as DYNAMICS, two
     intersecting loops rather than a stack of boxes. The two loops share two nodes on the vertical axis — More autonomy (top) and the
     Governed Engineering Environment (bottom). The GOVERNANCE loop (right, rust, the Alignment Thesis)
     runs down: autonomy -> failure -> human judgment -> governance conversion -> engineering capital ->
     stronger environment. The KNOWLEDGE loop (left, green, the Modeling Thesis) runs up: environment ->
     structured models -> reasoning horizon -> less churn -> more autonomy. Mermaid draws boxes and
     arrows but cannot seat two positioned lobes that share an axis and read as continuous circulation;
     the elliptical, hand-placed layout IS the theory. The two faint lobe regions are drawn so each of
     the six industrial reconstructions can later be annotated onto the region its mechanisms occupy.
     Palette: Umber Monograph tokens (fleet #2f5169 autonomy hub, governed green #1f7a4d/#155c38 the
     environment + knowledge lobe, accent #9a3f12 the governance lobe, churn #b23b3b failure, muted
     #57534e human judgment + captions, tints #eef7f0/#faf1e6, rule #e4e0d8, page #fdfcf9). Fonts >= 16u. -->
<!-- semantic-families: agent, failure, governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860"
     role="group" aria-labelledby="dynTitle dynDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="dynTitle">The Theory of MAGE — two intersecting loops, knowledge and governance</title>
  <desc id="dynDesc">Two loops circulate around a vertical axis and share the two nodes on it: More
    autonomy at the top and the Governed Engineering Environment at the bottom. The governance loop
    runs down the right side in rust: from More autonomy to Failure encountered, to Human judgment, to
    Governance conversion, to Engineering capital, and into the Governed Engineering Environment. This
    is the Alignment Thesis — bind policy into authoritative mechanisms. The knowledge loop runs up the
    left side in green: from the Governed Engineering Environment to Structured models, to a widening
    Reasoning horizon, to Less churn, and back to More autonomy. This is the Modeling Thesis — bind
    intent into structured models. The environment is where the two loops meet: governance strengthens
    it by converting failure into capital, and it in turn holds the models that let agents reason further
    and churn less, which grants more autonomy. Each of the six industrial reconstructions lands on a
    region of this loop.</desc>

  <defs>
    <marker id="dyn-gov" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
    <marker id="dyn-know" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="860" fill="#fdfcf9"/>

  <!-- ===== the two lobe regions (drawn first, behind everything) ===== -->
  <!-- right lobe: governance (rust tint) -->
  <path d="M500,160 A360,290 0 0 1 500,740 L500,160 Z" fill="#faf1e6"/>
  <!-- left lobe: knowledge (green tint) -->
  <path d="M500,160 A360,290 0 0 0 500,740 L500,160 Z" fill="#eef7f0"/>

  <!-- ===== title + loop labels ===== -->
  <text x="500" y="40" text-anchor="middle" font-size="28" font-weight="700" fill="#1c1917">The Theory of MAGE</text>
  <text x="72" y="70" font-size="18" font-weight="700" letter-spacing="1.5" fill="#1f7a4d">KNOWLEDGE LOOP</text>
  <text x="72" y="92" font-size="16" font-style="italic" fill="#57534e">Modeling Thesis · bind intent into models</text>
  <text x="928" y="70" text-anchor="end" font-size="18" font-weight="700" letter-spacing="1.5" fill="#9a3f12">GOVERNANCE LOOP</text>
  <text x="928" y="92" text-anchor="end" font-size="16" font-style="italic" fill="#57534e">Alignment Thesis · bind policy into mechanisms</text>

  <!-- ===== shared axis: the loops intersect at the two hub nodes ===== -->
  <line x1="500" y1="203" x2="500" y2="685" stroke="#e4e0d8" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text x="500" y="440" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">the two loops</text>
  <text x="500" y="462" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">meet on this axis</text>

  <!-- ===== circulation arrows (clockwise): rust down the right, green up the left ===== -->
  <g fill="none" stroke-width="2.4">
    <!-- governance (rust) -->
    <path d="M626,196 C682,182 716,196 704,214" stroke="#9a3f12" marker-end="url(#dyn-gov)"/>
    <path d="M832,270 C858,292 860,310 846,326" stroke="#9a3f12" marker-end="url(#dyn-gov)"/>
    <path d="M846,410 L846,484" stroke="#9a3f12" marker-end="url(#dyn-gov)"/>
    <path d="M828,572 C818,592 808,600 800,608" stroke="#9a3f12" marker-end="url(#dyn-gov)"/>
    <path d="M688,678 C662,694 648,696 636,700" stroke="#9a3f12" marker-end="url(#dyn-gov)"/>
    <!-- knowledge (green) -->
    <path d="M356,700 C332,690 316,686 300,678" stroke="#1f7a4d" marker-end="url(#dyn-know)"/>
    <path d="M198,606 C168,566 158,528 150,494" stroke="#1f7a4d" marker-end="url(#dyn-know)"/>
    <path d="M156,408 C146,364 168,318 208,278" stroke="#1f7a4d" marker-end="url(#dyn-know)"/>
    <path d="M300,206 C330,190 348,188 372,182" stroke="#1f7a4d" marker-end="url(#dyn-know)"/>
  </g>

  <!-- ===== SHARED HUB — More autonomy (top, blue) ===== -->
  <rect x="360" y="105" width="280" height="98" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.8"/>
  <text x="500" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">More autonomy</text>
  <text x="500" y="178" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">granted to commodity intelligence</text>

  <!-- ===== SHARED HUB — Governed Engineering Environment (bottom, green, emphasized) ===== -->
  <rect x="330" y="685" width="340" height="110" rx="10" fill="#e3f0e7" stroke="#155c38" stroke-width="3.2"/>
  <text x="500" y="722" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">Governed Engineering</text>
  <text x="500" y="748" text-anchor="middle" font-size="22" font-weight="700" fill="#155c38">Environment</text>
  <text x="500" y="772" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">the object of engineering</text>

  <!-- ===== GOVERNANCE lobe nodes (right) ===== -->
  <rect x="641" y="194" width="200" height="80" rx="9" fill="#fbeaea" stroke="#b23b3b" stroke-width="2.4"/>
  <text x="741" y="228" text-anchor="middle" font-size="20" font-weight="700" fill="#b23b3b">Failure</text>
  <text x="741" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#b23b3b">encountered</text>

  <rect x="746" y="330" width="200" height="80" rx="9" fill="#f3efe7" stroke="#57534e" stroke-width="2.4"/>
  <text x="846" y="364" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Human</text>
  <text x="846" y="388" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">judgment</text>

  <rect x="741" y="488" width="210" height="84" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="846" y="524" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Governance</text>
  <text x="846" y="548" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">conversion</text>

  <rect x="667" y="604" width="200" height="80" rx="9" fill="#f6f4ef" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="767" y="638" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Engineering</text>
  <text x="767" y="662" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">capital</text>

  <!-- ===== KNOWLEDGE lobe nodes (left) ===== -->
  <rect x="133" y="604" width="200" height="80" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="233" y="638" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Structured</text>
  <text x="233" y="662" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">models</text>

  <rect x="35" y="409" width="210" height="82" rx="9" fill="#eef7f0" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="140" y="444" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Reasoning</text>
  <text x="140" y="468" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">horizon</text>

  <rect x="159" y="194" width="200" height="80" rx="9" fill="#eef7ee" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="259" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Less churn</text>
  <text x="259" y="254" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">map ≡ territory</text>

  <!-- ===== footer caption ===== -->
  <text x="500" y="826" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">Governance turns failure into capital that strengthens the environment; the environment holds the models that let agents</text>
  <text x="500" y="848" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">reason further and churn less. Each turn of the two loops grants more autonomy — the theory is the circulation, not the boxes.</text>
</svg>
