<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: intervention-boundaries). NEW Fig 3.1-1. Replaces BOTH the old
     agent-stack-layers figure AND the authority-spectrum figure. The reframe: engineering intent can be
     intervened on at four boundaries — reasoning input, action, work unit, artifact / runtime — and these
     are increasing SEMANTIC GRAINS (one attempted side effect, then a whole unit of work, then the
     resulting system / state), NOT increasing STRENGTHS of authority. So there is deliberately NO
     blue->rust hardness ramp (the retired authority-spectrum's asRamp gradient implied a soft->hard scale
     that does not exist). The reasoning-input boundary sits under a "guidance" label; the other three sit
     under "authority can act at any of these" — authority is not pinned to the strongest-looking boundary,
     it can act at any grain where the obligation is legible. The flow arrows carry plain grain-order, not
     increasing strength. Palette: Umber Monograph tokens — agent #2f5169 + tint #e7edf3 (reasoning input),
     governance #9a3f12 + tint #faf1e6 (action / work unit / artifact-runtime), neutral #57534e (grain axis,
     flow arrows, notes), ink #1c1917 names, paper #fdfcf9. Fonts in the 12-26 band at the 1000px reference. -->
<!-- semantic-families: agent, governance, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360"
     role="group" aria-labelledby="ibTitle ibDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="ibTitle">Four intervention boundaries as increasing semantic grains, not increasing strengths of authority</title>
  <desc id="ibDesc">Four boundaries sit in a row, connected left to right by plain neutral arrows: reasoning
    input, action, work unit, and artifact or runtime. They are ordered by increasing SEMANTIC GRAIN — the
    left end is one attempted side effect, the right end the resulting system or state — and NOT by
    increasing strength of authority; there is no hardness ramp. Reasoning input, drawn agent-blue, sits
    under a label reading guidance: prompts, briefs, models, and examples primarily guide unless coupled to
    an authoritative consumer. The other three, drawn governance-rust, sit under one label reading authority
    can act at any of these: at the action boundary through permissions, hooks, and tools; at the work-unit
    boundary through a task, a pull request, a build, a deployment candidate; at the artifact-or-runtime
    boundary through types, API seams, admission, and runtime policy. The lesson is that the same intent can
    be placed at any of these grains — choose the boundary where the obligation is legible and a mechanism
    can reach the consequence, not the one that looks strongest.</desc>

  <defs>
    <marker id="ib-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
    <marker id="ib-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="360" fill="#fdfcf9"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">Where authority can act</text>
  <text x="500" y="68" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">Four intervention boundaries — semantic grains, not strengths.</text>

  <!-- top band labels: guidance over the first boundary, authority over the other three -->
  <text x="152" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169">guidance</text>
  <text x="616" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3f12">authority can act at any of these</text>
  <line x1="54" y1="112" x2="250" y2="112" stroke="#2f5169" stroke-width="1.2"/>
  <line x1="286" y1="112" x2="946" y2="112" stroke="#9a3f12" stroke-width="1.2"/>

  <!-- boundary pills: reasoning input agent-blue; the other three governance-rust -->
  <rect x="54"  y="120" width="196" height="64" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="152" y="158" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1917">reasoning input</text>

  <rect x="286" y="120" width="196" height="64" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="384" y="158" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1917">action</text>

  <rect x="518" y="120" width="196" height="64" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="616" y="158" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1917">work unit</text>

  <rect x="750" y="120" width="196" height="64" rx="10" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="848" y="158" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1917">artifact / runtime</text>

  <!-- plain grain-order flow arrows (neutral — NOT a strength ramp) -->
  <line x1="252" y1="152" x2="284" y2="152" stroke="#57534e" stroke-width="1.8" marker-end="url(#ib-flow)"/>
  <line x1="484" y1="152" x2="516" y2="152" stroke="#57534e" stroke-width="1.8" marker-end="url(#ib-flow)"/>
  <line x1="716" y1="152" x2="748" y2="152" stroke="#57534e" stroke-width="1.8" marker-end="url(#ib-flow)"/>

  <!-- the mechanisms that act at each boundary -->
  <text x="152" y="206" text-anchor="middle" font-size="14" fill="#2f5169">prompts &#183; briefs</text>
  <text x="152" y="224" text-anchor="middle" font-size="14" fill="#2f5169">models &#183; examples</text>

  <text x="384" y="206" text-anchor="middle" font-size="14" fill="#9a3f12">permissions &#183; hooks &#183; tools</text>

  <text x="616" y="206" text-anchor="middle" font-size="14" fill="#9a3f12">task &#183; PR &#183; build</text>
  <text x="616" y="224" text-anchor="middle" font-size="14" fill="#9a3f12">deployment candidate</text>

  <text x="848" y="206" text-anchor="middle" font-size="14" fill="#9a3f12">types &#183; API seams</text>
  <text x="848" y="224" text-anchor="middle" font-size="14" fill="#9a3f12">admission &#183; runtime policy</text>

  <!-- reasoning input is primarily guidance -->
  <text x="152" y="250" text-anchor="middle" font-size="12" font-style="italic" fill="#57534e">primarily guidance unless coupled</text>
  <text x="152" y="266" text-anchor="middle" font-size="12" font-style="italic" fill="#57534e">to an authoritative consumer</text>

  <!-- the grain axis: neutral, plain — grain increases, strength does not -->
  <text x="500" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#57534e">semantic grain &#8594;</text>
  <line x1="54" y1="308" x2="946" y2="308" stroke="#57534e" stroke-width="1.6" marker-end="url(#ib-axis)"/>
  <text x="54" y="328" font-size="13" font-style="italic" fill="#57534e">one attempted side effect</text>
  <text x="946" y="328" text-anchor="end" font-size="13" font-style="italic" fill="#57534e">the resulting system / state</text>
</svg>
