<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 353" width="315" height="353" role="img" aria-labelledby="docable-workflow-title docable-workflow-desc" font-family="'Source Sans 3', Arial, sans-serif">
<title id="docable-workflow-title">DocAble: from a priority to completed work</title>
<desc id="docable-workflow-desc">An engineer sets priorities and resolves open decisions. A reviewed work order records the design, phases, and dependencies. The orchestrator schedules ready phases across isolated agent worktrees. Their changes converge through integration and checks. An independent completion audit checks the work order and evidence. Deficiencies return to the orchestrator for repair. An optional dotted branch also returns unresolved problems to the engineer. The work order closes only when its criteria are met. Deployment is a separate decision. Worktree isolation separates concurrent edits; it does not establish correctness.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#57534e"/></marker></defs>
<rect width="315" height="353" fill="white"/>

<polyline id="priority-to-plan" points="145,38 145,50" fill="none" stroke="#57534e" stroke-width="0.75" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline id="plan-to-schedule" points="145,86 145,98" fill="none" stroke="#57534e" stroke-width="0.75" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline id="dispatch-trunk" points="145,132 145,136" fill="none" stroke="#57534e" stroke-width="0.75" stroke-linejoin="round"/>
<polyline id="dispatch-a" points="145,136 70,136 70,148" fill="none" stroke="#57534e" stroke-width="0.75" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline id="dispatch-b" points="145,136 220,136 220,148" fill="none" stroke="#57534e" stroke-width="0.75" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline id="result-a" points="70,182 70,186 145,186" fill="none" stroke="#57534e" stroke-width="0.75" stroke-linejoin="round"/>
<polyline id="result-b" points="220,182 220,186 145,186" fill="none" stroke="#57534e" stroke-width="0.75" stroke-linejoin="round"/>
<polyline id="integration-entry" points="145,186 145,198" fill="none" stroke="#57534e" stroke-width="0.75" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline id="audit-entry" points="145,232 145,248" fill="none" stroke="#57534e" stroke-width="0.75" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline id="acceptance" points="145,282 145,307" fill="none" stroke="#57534e" stroke-width="0.75" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline id="repair-loop" points="261,265 303,265 303,115 250,115" fill="none" stroke="#57534e" stroke-width="0.75" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline id="optional-escalation" points="303,115 303,21 250,21" fill="none" stroke="#57534e" stroke-width="0.75" stroke-linecap="round" stroke-dasharray="0.5 2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g id="engineer"><rect x="40" y="4" width="210" height="34" rx="2.5" fill="#f6f4ef" stroke="#57534e" stroke-width="0.65"/>
<text x="145.0" y="18" font-size="10.5" text-anchor="middle" fill="#1c1917" font-weight="700">Engineer</text>
<text x="145.0" y="31" font-size="9.5" text-anchor="middle" fill="#3d3935">Priorities and open decisions</text>
</g>
<g id="workorder"><rect x="40" y="50" width="210" height="36" rx="2.5" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="0.65"/>
<text x="145.0" y="64" font-size="10.5" text-anchor="middle" fill="#1c1917" font-weight="700">Reviewed work order</text>
<text x="145.0" y="77" font-size="9.5" text-anchor="middle" fill="#3d3935">Design, phases, dependencies</text>
</g>
<g id="orchestrator"><rect x="40" y="98" width="210" height="34" rx="2.5" fill="#e7edf3" stroke="#2f5169" stroke-width="0.65"/>
<text x="145.0" y="112" font-size="10.5" text-anchor="middle" fill="#1c1917" font-weight="700">Orchestrator</text>
<text x="145.0" y="125" font-size="9.5" text-anchor="middle" fill="#3d3935">Schedules ready phases</text>
</g>
<g id="agenta"><rect x="12" y="148" width="116" height="34" rx="2.5" fill="#e7edf3" stroke="#2f5169" stroke-width="0.65"/>
<text x="70.0" y="162" font-size="10.5" text-anchor="middle" fill="#1c1917" font-weight="700">Agent A</text>
<text x="70.0" y="175" font-size="9.5" text-anchor="middle" fill="#3d3935">Isolated worktree</text>
</g>
<g id="agentb"><rect x="162" y="148" width="116" height="34" rx="2.5" fill="#e7edf3" stroke="#2f5169" stroke-width="0.65"/>
<text x="220.0" y="162" font-size="10.5" text-anchor="middle" fill="#1c1917" font-weight="700">Agent B</text>
<text x="220.0" y="175" font-size="9.5" text-anchor="middle" fill="#3d3935">Isolated worktree</text>
</g>
<g id="integration"><rect x="40" y="198" width="210" height="34" rx="2.5" fill="#ffffff" stroke="#57534e" stroke-width="0.65"/>
<text x="145.0" y="212" font-size="10.5" text-anchor="middle" fill="#1c1917" font-weight="700">Integration and checks</text>
<text x="145.0" y="225" font-size="9.5" text-anchor="middle" fill="#3d3935">Merge changes; gather evidence</text>
</g>
<g id="audit"><rect x="29" y="248" width="232" height="34" rx="2.5" fill="#faf1e6" stroke="#9a3f12" stroke-width="0.65"/>
<text x="145.0" y="262" font-size="10.5" text-anchor="middle" fill="#1c1917" font-weight="700">Independent completion audit</text>
<text x="145.0" y="275" font-size="9.5" text-anchor="middle" fill="#3d3935">Check work order and evidence</text>
</g>
<g id="accepted"><rect x="40" y="307" width="210" height="24" rx="2.5" fill="#ffffff" stroke="#57534e" stroke-width="0.65"/>
<text x="145.0" y="322.5" font-size="10.5" text-anchor="middle" fill="#1c1917" font-weight="700">Work order closed</text>
</g>
<text id="escalation-label" x="276" y="62" text-anchor="middle" font-size="9.5" fill="#3d3935">Escalate<tspan x="276" dy="11.5">if needed</tspan></text>
<text id="repair-label" x="276" y="141" text-anchor="middle" font-size="9.5" fill="#3d3935">Repair work</text>
<text x="153" y="298" font-size="9.5" text-anchor="start" fill="#3d3935" id="accept-label">Criteria met</text>
<text x="145" y="347" font-size="9" text-anchor="middle" fill="#3d3935">Deployment is a separate decision.</text>
</svg>
