<?xml version="1.0" encoding="UTF-8"?>
<!-- HAND-AUTHORED one-off (Field Guide card — Cloudflare) — NOT projector output; edit by hand and keep this header. -->
<!-- Field-guide team card: Cloudflare's entry door (policy-first governance) -> MAGE landing (Alignment). label: field-guide-cloudflare. Reference/nav card art, not a role-coloured figure. -->
<!-- semantic-families: neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Field Guide card: Cloudflare — policy-first governance to the Alignment">
  <rect x="0" y="0" width="1000" height="430" fill="#fdfcf9"/>

  <!-- header -->
  <text x="48" y="44" font-size="20" fill="#57534e">Field Guide · card</text>
  <text x="952" y="44" text-anchor="end" font-size="22" font-weight="bold" fill="#1c1917">Cloudflare</text>
  <text x="952" y="68" text-anchor="end" font-size="20" font-style="italic" fill="#57534e">Internet infrastructure (CDN · edge · security) · agentic stack across hundreds of teams</text>
  <line x1="40" y1="86" x2="960" y2="86" stroke="#cfcabf" stroke-width="1.5"/>

  <!-- ===== edges (drawn UNDER the nodes; node fills cap the ends) ===== -->
  <!-- edge: door -> policy -->
  <line x1="151" y1="205" x2="317" y2="205" stroke="#cfcabf" stroke-width="3"/>
  <!-- edge: policy -> mech-1 -->
  <path fill="none" stroke="#cfcabf" stroke-width="2.5" d="M330,192 L330,150 L594,150"/>
  <!-- edge: policy -> mech-2 -->
  <path fill="none" stroke="#cfcabf" stroke-width="2.5" d="M330,192 L330,178 L594,178"/>
  <!-- edge: policy -> mech-3 -->
  <line x1="330" y1="206" x2="594" y2="206" stroke="#cfcabf" stroke-width="2.5"/>
  <!-- edge: policy -> mech-4 -->
  <path fill="none" stroke="#cfcabf" stroke-width="2.5" d="M330,218 L330,234 L594,234"/>
  <!-- edge: policy -> mech-5 -->
  <path fill="none" stroke="#cfcabf" stroke-width="2.5" d="M330,218 L330,262 L594,262"/>
  <!-- edge: mech-3 -> landing -->
  <line x1="606" y1="206" x2="760" y2="206" stroke="#cfcabf" stroke-width="3"/>
  <!-- caveat: the recurrence loop does not close (partial governance-conversion) -->
  <!-- edge: mech-5 .. recur -->
  <path d="M594,262 L356,262 L356,278" fill="none" stroke="#78716c" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- ===== nodes (opaque fills cap the edge ends) ===== -->
  <!-- door -->
  <circle id="door" cx="140" cy="205" r="11" fill="#fdfcf9" stroke="#1c1917" stroke-width="3"/>

  <!-- one machine-checkable policy (filled hub) -->
  <circle id="policy" cx="330" cy="205" r="13" fill="#1c1917"/>

  <!-- the mechanisms it governs -->
  <circle id="mech-1" cx="600" cy="150" r="6" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <circle id="mech-2" cx="600" cy="178" r="6" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <circle id="mech-3" cx="600" cy="206" r="6" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <circle id="mech-4" cx="600" cy="234" r="6" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <circle id="mech-5" cx="600" cy="262" r="6" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>

  <!-- recurrence loop's half-closed tail node -->
  <circle id="recur" cx="356" cy="282" r="4" fill="#fdfcf9" stroke="#78716c" stroke-width="2"/>

  <!-- landing badge -->
  <rect id="landing" x="760" y="181" width="200" height="48" rx="8" fill="#fdfcf9" stroke="#1c1917" stroke-width="2.4"/>

  <!-- ===== labels ===== -->
  <text x="140" y="150" text-anchor="middle" font-size="20" letter-spacing="1" fill="#78716c">ENTERS THROUGH</text>
  <text x="140" y="252" text-anchor="middle" font-size="20" fill="#57534e">Policy-first</text>
  <text x="140" y="272" text-anchor="middle" font-size="20" fill="#57534e">governance</text>
  <text x="330" y="252" text-anchor="middle" font-size="20" fill="#78716c">one machine-checkable policy</text>
  <text x="600" y="130" text-anchor="middle" font-size="20" fill="#78716c">governs thousands of changes</text>
  <text x="470" y="344" text-anchor="middle" font-size="20" fill="#78716c">recurrence loop only half-closed (◐)</text>
  <text x="860" y="150" text-anchor="middle" font-size="20" letter-spacing="1" fill="#78716c">LANDS ON</text>
  <text x="860" y="211" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c1917">Alignment</text>

  <!-- takeaway -->
  <line x1="40" y1="368" x2="960" y2="368" stroke="#cfcabf" stroke-width="1.5"/>
  <text x="500" y="404" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">One machine-checkable policy, authored once, governs thousands of later changes.</text>
</svg>
