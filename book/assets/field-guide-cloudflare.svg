<?xml version="1.0" encoding="UTF-8"?>
<!-- HAND-AUTHORED one-off (Field Guide card — Cloudflare) — NOT projector output; edit by hand and keep this header. -->
<!-- Field-guide team card: Cloudflare's entry door (policy-first governance) -> MAGE landing (Alignment). label: field-guide-cloudflare. Reference/nav card art, not a role-coloured figure. -->
<!-- semantic-families: neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Field Guide card: Cloudflare — policy-first governance to the Alignment">
  <rect x="0" y="0" width="1000" height="430" fill="#fdfcf9"/>

  <!-- header -->
  <text x="48" y="44" font-size="16" fill="#57534e">Field Guide · card</text>
  <text x="952" y="44" text-anchor="end" font-size="22" font-weight="bold" fill="#1c1917">Cloudflare</text>
  <text x="952" y="68" text-anchor="end" font-size="16" font-style="italic" fill="#57534e">Internet infrastructure (CDN · edge · security) · agentic stack across hundreds of teams</text>
  <line x1="40" y1="86" x2="960" y2="86" stroke="#cfcabf" stroke-width="1.5"/>

  <!-- door -->
  <text x="140" y="150" text-anchor="middle" font-size="16" letter-spacing="1" fill="#78716c">ENTERS THROUGH</text>
  <circle cx="140" cy="205" r="11" fill="#fdfcf9" stroke="#1c1917" stroke-width="3"/>
  <text x="140" y="252" text-anchor="middle" font-size="16" fill="#57534e">Policy-first</text>
  <text x="140" y="272" text-anchor="middle" font-size="16" fill="#57534e">governance</text>

  <!-- door -> policy -->
  <line x1="151" y1="205" x2="317" y2="205" stroke="#cfcabf" stroke-width="3"/>

  <!-- one policy (filled hub) -->
  <circle cx="330" cy="205" r="13" fill="#1c1917"/>
  <text x="330" y="252" text-anchor="middle" font-size="16" fill="#78716c">one machine-checkable policy</text>

  <!-- fan-out to many mechanisms -->
  <line x1="343" y1="205" x2="600" y2="150" stroke="#cfcabf" stroke-width="2.5"/>
  <line x1="343" y1="205" x2="600" y2="178" stroke="#cfcabf" stroke-width="2.5"/>
  <line x1="343" y1="205" x2="600" y2="206" stroke="#cfcabf" stroke-width="2.5"/>
  <line x1="343" y1="205" x2="600" y2="234" stroke="#cfcabf" stroke-width="2.5"/>
  <line x1="343" y1="205" x2="600" y2="262" stroke="#cfcabf" stroke-width="2.5"/>
  <circle cx="600" cy="150" r="6" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <circle cx="600" cy="178" r="6" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <circle cx="600" cy="206" r="6" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <circle cx="600" cy="234" r="6" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <circle cx="600" cy="262" r="6" fill="#fdfcf9" stroke="#57534e" stroke-width="2.5"/>
  <text x="600" y="130" text-anchor="middle" font-size="16" fill="#78716c">governs thousands of changes</text>

  <!-- caveat: the recurrence loop does not close (partial governance-conversion) -->
  <path d="M600 268 C 500 322, 400 322, 356 282" fill="none" stroke="#78716c" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="356" cy="282" r="4" fill="#fdfcf9" stroke="#78716c" stroke-width="2"/>
  <text x="470" y="344" text-anchor="middle" font-size="16" fill="#78716c">recurrence loop only half-closed (◐)</text>

  <!-- mechanisms -> landing -->
  <line x1="614" y1="206" x2="758" y2="205" stroke="#cfcabf" stroke-width="3"/>

  <!-- landing badge -->
  <text x="860" y="150" text-anchor="middle" font-size="16" letter-spacing="1" fill="#78716c">LANDS ON</text>
  <rect x="760" y="181" width="200" height="48" rx="8" fill="#fdfcf9" stroke="#1c1917" stroke-width="2.4"/>
  <text x="860" y="211" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1917">Alignment</text>

  <!-- takeaway -->
  <line x1="40" y1="368" x2="960" y2="368" stroke="#cfcabf" stroke-width="1.5"/>
  <text x="500" y="404" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">One machine-checkable policy, authored once, governs thousands of later changes.</text>
</svg>
