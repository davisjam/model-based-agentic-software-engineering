<?xml version="1.0" encoding="UTF-8"?>
<!-- REDRAW DRAFT (figures-redraw) of governance-census.svg. Retitled "The Governance Census." The bipartite
     match — Obligations (what must be governed) against Mechanisms (the controls that meet them) — stays in
     the rust governance family. Three quantities fall out of the match, now the LARGE outputs the reader
     walks away with, renamed to their consequences: GOVERNED (was Coverage, green), UNDER-GOVERNANCE (was
     Gap, red), GOVERNANCE DEBT (was Orphan, muted — an unjustified control is debt). Subtitle: governance
     becomes an engineering artifact, not merely measurable. A caption names the shape: governance as a
     bipartite graph, the requirements-traceability analogue. Palette: Umber Monograph tokens (accent #9a3f12
     obligations + mechanisms, governed green #1f7a4d governed, churn #b23b3b under-governance, muted #57534e
     debt + captions, tints #faf1e6/#e3f0e7/#fbeaea/#f3efe7, rule #e4e0d8, page #fdfcf9). Fonts in the 16-28
     band at the 1000px reference. -->
<!-- semantic-families: failure, governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"
     role="group" aria-labelledby="gcTitle gcDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="gcTitle">The governance census: governed, under-governance, and governance debt are counts once obligations and mechanisms are enumerated</title>
  <desc id="gcDesc">Two columns face each other. On the left, Obligations — what must be governed. On the
    right, Mechanisms — the controls that meet them. A line joins each obligation to the mechanism that
    covers it. Three quantities fall out of the match, shown as three large outputs. Governed: an obligation
    met by a mechanism, in green. Under-governance: an obligation with no mechanism, a hole in governance, in
    red. Governance debt: a mechanism with no obligation, an unjustified control, in muted grey. Once
    obligations and mechanisms are enumerated, these three become counts rather than opinions — governance
    becomes an engineering artifact. The figure is a bipartite graph, the requirements-traceability analogue.</desc>

  <defs>
    <marker id="gc-cov" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#fdfcf9"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">The governance census</text>
  <text x="500" y="70" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">Governance becomes an engineering artifact — governed, under-governed, and debt are counts, not opinions.</text>

  <!-- column headers (both in the rust governance family) -->
  <text x="228" y="118" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="1" fill="#9a3f12">OBLIGATIONS</text>
  <text x="228" y="140" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">what must be governed</text>
  <text x="772" y="118" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="1" fill="#9a3f12">MECHANISMS</text>
  <text x="772" y="140" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">the controls that meet them</text>

  <!-- match lines (green = coverage), drawn behind the chips; each source runs to the obligation
       centre (capped by its fill), each directed head seats on the mechanism's left border -->
  <g stroke="#1f7a4d" stroke-width="2.2" fill="none">
    <!-- edge: obligation-1 -> mechanism-1 -->
    <path d="M356,190 L642,190" marker-end="url(#gc-cov)"/>
    <!-- edge: obligation-2 -> mechanism-2 -->
    <path d="M356,246 L642,246" marker-end="url(#gc-cov)"/>
    <!-- edge: obligation-3 -> mechanism-3 -->
    <path d="M356,302 L642,302" marker-end="url(#gc-cov)"/>
  </g>

  <!-- obligation chips (left, rust) -->
  <rect id="obligation-1" x="128" y="166" width="228" height="48" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="242" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Obligation</text>
  <rect id="obligation-2" x="128" y="222" width="228" height="48" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="242" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Obligation</text>
  <rect id="obligation-3" x="128" y="278" width="228" height="48" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="242" y="308" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Obligation</text>
  <!-- the under-governed obligation (no line to any mechanism) -->
  <rect x="128" y="334" width="228" height="48" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="2.6"/>
  <text x="242" y="364" text-anchor="middle" font-size="20" font-weight="700" fill="#b23b3b">Uncovered obligation</text>

  <!-- mechanism chips (right, rust) -->
  <rect id="mechanism-1" x="644" y="166" width="228" height="48" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="758" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Mechanism</text>
  <rect id="mechanism-2" x="644" y="222" width="228" height="48" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="758" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Mechanism</text>
  <rect id="mechanism-3" x="644" y="278" width="228" height="48" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.4"/>
  <text x="758" y="308" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Mechanism</text>
  <!-- the debt mechanism (no line to any obligation) -->
  <rect x="628.4" y="334" width="259.2" height="48" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="2.6"/>
  <text x="758" y="364" text-anchor="middle" font-size="20" font-weight="700" fill="#57534e">Unmatched mechanism</text>

  <!-- the three derived outputs, made large -->
  <text x="500" y="424" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Three counts fall out of the match</text>
  <rect x="22.48"  y="438" width="323.04" height="76" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="3"/>
  <text x="184" y="474" text-anchor="middle" font-size="23" font-weight="700" fill="#1f7a4d">GOVERNED</text>
  <text x="184" y="498" text-anchor="middle" font-size="20" fill="#57534e">obligation met by a mechanism</text>
  <rect x="343.79" y="438" width="312.42" height="76" rx="10" fill="#fbeaea" stroke="#b23b3b" stroke-width="3"/>
  <text x="500" y="474" text-anchor="middle" font-size="23" font-weight="700" fill="#b23b3b">UNDER-GOVERNANCE</text>
  <text x="500" y="498" text-anchor="middle" font-size="20" fill="#57534e">obligation with no mechanism</text>
  <rect x="659.79" y="438" width="312.42" height="76" rx="10" fill="#f3efe7" stroke="#57534e" stroke-width="3"/>
  <text x="816" y="474" text-anchor="middle" font-size="23" font-weight="700" fill="#57534e">GOVERNANCE DEBT</text>
  <text x="816" y="498" text-anchor="middle" font-size="20" fill="#57534e">mechanism with no obligation</text>

  <text x="500" y="544" text-anchor="middle" font-size="20" font-style="italic" fill="#57534e">Governance as a bipartite graph — the requirements-traceability analogue.</text>
</svg>
