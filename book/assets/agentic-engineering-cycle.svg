<svg xmlns="http://www.w3.org/2000/svg" width="426" height="162" viewBox="-3 -3 426 162" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Engineering Through Models</title>
  <desc id="desc">Model, Realize, and Evaluate form a repeating cycle. A brace spans all three activities and is labeled Governance conversion: Make consequential lessons durable. Conversion can occur during any of the activities; it is not a fourth phase.</desc>
  <!-- Hand-authored geometry makes the brace span every activity without entering the cycle. All coordinates match the native TikZ counterpart. -->
  <defs>
    <marker id="cycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker>
  </defs>
  <style>text{font-family:"Source Sans 3",Arial,sans-serif;fill:#000;text-anchor:middle}.activity{fill:#fff;stroke:#000;stroke-width:.65}.edge{fill:none;stroke:#000;stroke-width:.8;marker-end:url(#cycle-arrow);stroke-linejoin:miter}</style>
  <rect x="-3" y="-3" width="426" height="162" fill="#fff"/>
  <text x="210" y="14.8" font-size="11.5" font-weight="700">Agentic Engineering Through Models</text>
  <rect class="activity" x="30" y="54" width="90" height="30" rx="3"/>
  <rect class="activity" x="165" y="54" width="90" height="30" rx="3"/>
  <rect class="activity" x="300" y="54" width="90" height="30" rx="3"/>
  <text x="75" y="72.63" font-size="11">Model</text>
  <text x="210" y="72.63" font-size="11">Realize</text>
  <text x="345" y="72.63" font-size="11">Evaluate</text>
  <path class="edge" d="M120 69 H165"/>
  <path class="edge" d="M255 69 H300"/>
  <path class="edge" d="M345 54 V34 H75 V54"/>
  <path d="M30 96 C30 97.75 31.75 99.5 33.5 99.5 H203 C206.5 99.5 206.5 103 210 103 C213.5 103 213.5 99.5 217 99.5 H386.5 C388.25 99.5 390 97.75 390 96" fill="none" stroke="#000" stroke-width=".65"/>
  <text x="210" y="126.63" font-size="11" font-weight="700">Governance conversion</text>
  <text x="210" y="142.465" font-size="10.5">Make consequential lessons durable</text>
</svg>
