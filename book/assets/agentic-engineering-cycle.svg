<svg xmlns="http://www.w3.org/2000/svg" width="384" height="130" viewBox="-3 -3 384 130" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Engineering Through Models</title>
  <desc id="desc">Model, Realize, and Evaluate form a repeating cycle. A brace spans all three activities and is labeled Governance conversion: Make consequential lessons durable. Conversion can occur during any of the activities; it is not a fourth phase.</desc>
  <!-- Hand-authored geometry makes the brace span every activity without entering the cycle. All coordinates match the native TikZ counterpart. -->
  <defs>
    <marker id="cycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker>
  </defs>
  <style>text{font-family:"Source Sans 3",Arial,sans-serif;fill:#000;text-anchor:middle}.activity{fill:#fff;stroke:#000;stroke-width:.65}.edge{fill:none;stroke:#000;stroke-width:.8;marker-end:url(#cycle-arrow);stroke-linejoin:miter}</style>
  <rect x="-3" y="-3" width="384" height="130" fill="#fff"/>
  <rect class="activity" x="27" y="22" width="81" height="30" rx="2.7"/>
  <rect class="activity" x="148.5" y="22" width="81" height="30" rx="2.7"/>
  <rect class="activity" x="270" y="22" width="81" height="30" rx="2.7"/>
  <text x="67.5" y="40.63" font-size="11">Model</text>
  <text x="189" y="40.63" font-size="11">Realize</text>
  <text x="310.5" y="40.63" font-size="11">Evaluate</text>
  <path class="edge" d="M108 37 H148.5"/>
  <path class="edge" d="M229.5 37 H270"/>
  <path class="edge" d="M310.5 22 V8 H67.5 V22"/>
  <path d="M27 64 C27 65.75 28.575 67.5 30.15 67.5 H182.7 C185.85 67.5 185.85 71 189 71 C192.15 71 192.15 67.5 195.3 67.5 H347.85 C349.425 67.5 351 65.75 351 64" fill="none" stroke="#000" stroke-width=".65"/>
  <text x="189" y="94.63" font-size="11" font-weight="700">Governance conversion</text>
  <text x="189" y="110.465" font-size="10.5">Make consequential lessons durable</text>
</svg>
