<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (label: determinization-two-paths). REPLACES determinization-frontier.svg, whose
     eight-rung Prompt->Skill->Rule->Lint->Model->Contract->Simulation->Proof ladder implied a single
     monotonic soft-to-hard axis. That axis is false: a rule may be mechanically enforced, a structured
     model may be purely descriptive, a simulation is not "more deterministic" than a contract. This figure
     draws TWO PATHS to mechanization, not stairs, separated by a dotted frontier line. Path 1, direct
     mechanization: a property already decidable over the current artifact is encoded in a test, validator,
     constraint, or gate — no richer system model required; Alignment alone moves this frontier. Path 2,
     representation shift: a judgment that is not decidable over raw implementation is made tractable by
     externalizing the relevant state or relations into a structured model, then checking a predicate over
     the model — Modeling moves this frontier. The dotted line labels the frontier as MOVING when either the
     mechanism or the representation improves. NO "second time a soft rule fails, move it one rung" heuristic
     (superseded, removed from Part V).
     Palette: Umber Monograph tokens (muted #57534e the semantic-judgment start + rule, accent #9a3f12 the
     direct-mechanization outcomes + frontier line, governed green #1f7a4d/#155c38 the representation-shift
     model step + tints #e3f0e7/#eef7f0, neutral #f3efe7 judgment boxes, ink #1c1917 names, rule #e4e0d8
     connectors, page #fdfcf9). Fonts 14-26 band at 1000px reference. -->
<!-- semantic-families: governance, modeling, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600"
     role="group" aria-labelledby="dtpTitle dtpDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="dtpTitle">Two paths to mechanization, separated by the determinization frontier</title>
  <desc id="dtpDesc">Two paths cross a dotted determinization frontier, drawn as two rows rather than a
    staircase. The upper path, direct mechanization, starts from a semantic judgment over the current
    artifact; because the property is already decidable over that artifact, it is encoded directly into a
    test, validator, constraint, or gate. No richer system model is required, and Alignment alone moves this
    frontier. The lower path, representation shift, starts from a semantic judgment over the implementation
    that is not decidable over raw code; the relevant state and relations are externalized into a structured
    model, then a predicate over that model yields a repeatable decision. Modeling moves this second
    frontier by changing the object over which Alignment acts. A dotted vertical line marks the frontier
    between judgment that must still be purchased on each instance and judgment the environment can carry
    repeatably; the frontier moves when either the mechanism or the representation improves.</desc>

  <defs>
    <marker id="dtp-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
    <marker id="dtp-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
    <marker id="dtp-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#fdfcf9"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">Two paths to mechanization</text>
  <text x="500" y="70" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">Which judgments can move out of repeated probabilistic interpretation — and how.</text>

  <!-- band labels left/right of the frontier -->
  <text x="70" y="112" font-size="15" font-weight="700" fill="#57534e">JUDGMENT PURCHASED PER INSTANCE</text>
  <text x="930" y="112" text-anchor="end" font-size="15" font-weight="700" fill="#9a3f12">JUDGMENT THE ENVIRONMENT CARRIES REPEATABLY</text>

  <!-- the frontier: a dotted vertical line -->
  <line x1="600" y1="130" x2="600" y2="486" stroke="#9a3f12" stroke-width="2.2" stroke-dasharray="6 5"/>
  <text x="600" y="516" text-anchor="middle" font-size="14.5" font-weight="700" font-style="italic" fill="#9a3f12">determinization frontier — moves when either the mechanism or the representation improves</text>

  <!-- ============ PATH 1: direct mechanization (upper row) ============ -->
  <text x="70" y="168" font-size="17" font-weight="700" fill="#1c1917">Path 1 · Direct mechanization</text>
  <text x="70" y="190" font-size="14.5" font-style="italic" fill="#9a3f12">Alignment alone moves this frontier</text>

  <rect id="sj-artifact" x="70" y="204" width="230" height="66" rx="9" fill="#f3efe7" stroke="#57534e" stroke-width="2.2"/>
  <text x="185" y="232" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">semantic judgment</text>
  <text x="185" y="254" text-anchor="middle" font-size="15" fill="#57534e">over artifact</text>

  <!-- one edge sj-artifact -> test-gate, drawn two-tone across the frontier: muted underlay runs the full
       span (lint-legible, rust head at the target); a rust overlay recolours the crossing (right) portion -->
  <!-- edge: sj-artifact -> test-gate -->
  <path d="M300,237 L660,237" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#dtp-rust)"/>
  <text x="346" y="226" text-anchor="middle" font-size="13.5" font-style="italic" fill="#57534e">property is</text>
  <text x="346" y="243" text-anchor="middle" font-size="13.5" font-style="italic" fill="#57534e">already decidable</text>

  <!-- crosses the frontier into the deterministic side -->
  <rect id="test-gate" x="662" y="204" width="268" height="66" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="796" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">test / validator / constraint / gate</text>
  <path d="M392,237 L658,237" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#dtp-rust)"/>

  <!-- ============ PATH 2: representation shift (lower row) ============ -->
  <text x="70" y="330" font-size="17" font-weight="700" fill="#1c1917">Path 2 · Representation shift</text>
  <text x="70" y="352" font-size="14.5" font-style="italic" fill="#1f7a4d">Modeling moves this frontier</text>

  <rect id="sj-impl" x="70" y="366" width="196" height="66" rx="9" fill="#f3efe7" stroke="#57534e" stroke-width="2.2"/>
  <text x="168" y="394" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">semantic judgment</text>
  <text x="168" y="416" text-anchor="middle" font-size="15" fill="#57534e">over implementation</text>

  <!-- edge: sj-impl -> structured-model -->
  <path d="M266,399 L322,399" fill="none" stroke="#1f7a4d" stroke-width="2" marker-end="url(#dtp-green)"/>
  <text x="294" y="383" text-anchor="middle" font-size="12" font-style="italic" fill="#1f7a4d">externalize</text>
  <text x="294" y="419" text-anchor="middle" font-size="12" font-style="italic" fill="#1f7a4d">state / relations</text>

  <rect id="structured-model" x="324" y="366" width="200" height="66" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.6"/>
  <text x="424" y="404" text-anchor="middle" font-size="16" font-weight="700" fill="#155c38">structured model</text>

  <!-- one edge structured-model -> repeatable-decision, two-tone across the frontier: green underlay runs the
       full span (lint-legible, rust head at the target); a rust overlay recolours the crossing (right) portion -->
  <!-- edge: structured-model -> repeatable-decision -->
  <path d="M524,399 L660,399" fill="none" stroke="#1f7a4d" stroke-width="2" marker-end="url(#dtp-rust)"/>
  <text x="560" y="383" text-anchor="middle" font-size="12" font-style="italic" fill="#1f7a4d">predicate</text>
  <text x="560" y="419" text-anchor="middle" font-size="12" font-style="italic" fill="#1f7a4d">over model</text>

  <!-- crosses the frontier into the deterministic side -->
  <rect id="repeatable-decision" x="662" y="366" width="268" height="66" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="796" y="404" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">repeatable decision</text>
  <path d="M600,399 L658,399" fill="none" stroke="#9a3f12" stroke-width="2" marker-end="url(#dtp-rust)"/>

  <text x="500" y="566" text-anchor="middle" font-size="15" font-style="italic" fill="#57534e">Modeling has moved the frontier by changing the object over which Alignment acts.</text>
</svg>
