<?xml version="1.0" encoding="UTF-8"?>
<!-- Appendix H figure — h5-operational-determinization.svg. Fold to book/assets/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 660" width="620" height="660"
     role="img" aria-labelledby="h5aTitle h5aDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="h5aTitle">Operational knowledge determinizing</title>
  <desc id="h5aDesc">Operational knowledge tends to travel downward toward determinization. A novel, situational
    failure first requires semantic diagnosis. When the judgment recurs it becomes a runbook. When the runbook's
    preconditions, actions, and postconditions become stable and decidable it migrates into a deterministic
    procedure, expressed through monitors, permissions, and actions, with postcondition and rollback gates. A
    left-hand axis marks increasing determinization from situational reasoning down to machinery.</desc>

  <defs>
    <marker id="h5a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
    <marker id="h5a-ah-u" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/></marker>
  </defs>

  <rect x="0" y="0" width="620" height="660" fill="#fdfcf9"/>

  <!-- determinization axis (left) -->
  <line x1="34" y1="60" x2="34" y2="600" stroke="#9a3f12" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#h5a-ah-u)"/>
  <text x="24" y="330" text-anchor="middle" font-size="13" font-style="italic" fill="#9a3f12" transform="rotate(-90 24 330)">increasing determinization</text>

  <rect x="200" y="34" width="240" height="58" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="320" y="57" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">OPERATIONAL KNOWLEDGE</text>
  <text x="320" y="78" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">novel / situational</text>

  <line x1="320" y1="92" x2="320" y2="130" stroke="#57534e" stroke-width="2.2" marker-end="url(#h5a-ah)"/>
  <rect x="210" y="132" width="220" height="44" rx="8" fill="#eef2f5" stroke="#2f5169" stroke-width="2"/>
  <text x="320" y="160" text-anchor="middle" font-size="15" fill="#2f5169">semantic diagnosis</text>

  <line x1="320" y1="176" x2="320" y2="214" stroke="#57534e" stroke-width="2.2" marker-end="url(#h5a-ah)"/>
  <text x="440" y="200" text-anchor="middle" font-size="12.5" font-style="italic" fill="#57534e">recurring judgment</text>
  <rect x="230" y="216" width="180" height="44" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="320" y="244" text-anchor="middle" font-size="15" fill="#1c1917">runbook</text>

  <line x1="320" y1="260" x2="320" y2="298" stroke="#57534e" stroke-width="2.2" marker-end="url(#h5a-ah)"/>
  <text x="445" y="284" text-anchor="middle" font-size="12.5" font-style="italic" fill="#57534e">stable + decidable</text>
  <rect x="200" y="300" width="240" height="46" rx="9" fill="#f7efe8" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="320" y="329" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3f12">deterministic procedure</text>

  <!-- fan to monitor / permission / action -->
  <path d="M320,346 L120,346 L120,388" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#h5a-ah)"/>
  <path d="M320,346 L320,388" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#h5a-ah)"/>
  <path d="M320,346 L500,346 L500,388" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#h5a-ah)"/>

  <g font-size="14" text-anchor="middle" fill="#1c1917">
    <rect x="60"  y="390" width="120" height="42" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/><text x="120" y="416">monitor</text>
    <rect x="258" y="390" width="124" height="42" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/><text x="320" y="416">permission</text>
    <rect x="440" y="390" width="120" height="42" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/><text x="500" y="416">action</text>
  </g>

  <line x1="500" y1="432" x2="500" y2="470" stroke="#57534e" stroke-width="2.2" marker-end="url(#h5a-ah)"/>
  <rect x="410" y="472" width="180" height="42" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2"/>
  <text x="500" y="499" text-anchor="middle" font-size="14" fill="#1c1917">postcondition</text>

  <line x1="500" y1="514" x2="500" y2="550" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#h5a-ah-u)"/>
  <rect x="420" y="552" width="160" height="44" rx="9" fill="#f7efe8" stroke="#9a3f12" stroke-width="2.5"/>
  <text x="500" y="580" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3f12">rollback gate</text>

  <text x="270" y="632" text-anchor="middle" font-size="13" font-style="italic" fill="#57534e">operational governance conversion — the destination is often machinery, not a better prompt</text>
</svg>
