<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -55 1020 595" width="1020" height="595"
     role="img" aria-labelledby="corTitle corDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="corTitle">A run-measure-assess loop wraps a three-step spine that fences one judgment step between deterministic ends</title>
  <desc id="corDesc">A run-then-measure-then-assess loop arcs across the top and returns to run. Inside
    it sits a three-step spine. Step one, determinize the data space: a mechanical, automatable step
    that fixes where the metrics live and what counts as normal. Step two, judgment: the agent reasons
    over that data to decide which configuration to try. Step three, determinize the experiment space:
    applying the chosen configuration is made mechanical, which lets the step capture a logged trace of
    why this configuration was chosen. One arrow carries that trace out to a single note. Fencing the
    one judgment step between two deterministic ends bounds the messy part and leaves an inspectable
    trace a checker can grade.</desc>

  <defs>
    <marker id="cor-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
    </marker>
  </defs>

  <text x="170" y="38" text-anchor="middle" font-size="28" font-weight="700" fill="#2f5169">run</text>
  <text x="510" y="38" text-anchor="middle" font-size="28" font-weight="700" fill="#2f5169">measure</text>
  <text x="850" y="38" text-anchor="middle" font-size="28" font-weight="700" fill="#2f5169">assess</text>

  <path d="M208,14 C340,-10 420,-10 468,14" fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#cor-ah)"/>
  
  <path d="M552,14 C664,-10 764,-10 812,14" fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#cor-ah)"/>
  
  <path d="M878,18 C700,-48 340,-48 162,18" fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#cor-ah)"/>

  <text x="510" y="128" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1917">Fence the judgment step between deterministic ends</text>

  <rect id="determinize-data" x="60" y="200" width="250" height="120" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="185" y="252" text-anchor="middle" font-size="25" font-weight="700" fill="#2f5169">Determinize</text>
  <text x="185" y="284" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">data space</text>
  <text x="185" y="310" text-anchor="middle" font-size="16" fill="#57534e">mechanical · automatable</text>

  <!-- edge: determinize-data -> judgment (extended to seat on the diamond's left tip; was floating 28px short) -->
  <line x1="309" y1="260" x2="386" y2="260" stroke="#2f5169" stroke-width="2.2" marker-end="url(#cor-ah)"/>

  <polygon points="510,192 632,260 510,328 388,260" fill="#2f5169" stroke="#2f5169" stroke-width="1.5"/>
  <!-- transparent lint anchor over the Judgment diamond (a <polygon> can't carry a lint-legible id) -->
  <rect id="judgment" x="388" y="192" width="244" height="136" fill="none" stroke="none"/>
  <text x="510" y="256" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">Judgment</text>
  <text x="510" y="284" text-anchor="middle" font-size="16" fill="#e7edf3">reasoning decides</text>

  <!-- edge: judgment -> determinize-experiment -->
  <line x1="632" y1="260" x2="686" y2="260" stroke="#2f5169" stroke-width="2.2" marker-end="url(#cor-ah)"/>

  <rect id="determinize-experiment" x="688" y="200" width="250" height="120" rx="6" fill="#e7edf3" stroke="#2f5169" stroke-width="2.5"/>
  <text x="813" y="252" text-anchor="middle" font-size="25" font-weight="700" fill="#2f5169">Determinize</text>
  <text x="813" y="284" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">experiment space</text>
  <text x="813" y="310" text-anchor="middle" font-size="16" fill="#57534e">mechanical · automatable</text>

  <!-- edge: determinize-experiment -> logged-trace -->
  <line x1="813" y1="320" x2="813" y2="390" stroke="#2f5169" stroke-width="2.2" marker-end="url(#cor-ah)"/>
  <rect id="logged-trace" x="628" y="392" width="370" height="112" rx="6" fill="#ffffff" stroke="#2f5169" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="813" y="430" text-anchor="middle" font-size="24" font-weight="700" fill="#2f5169">Logged trace</text>
  <text x="813" y="462" text-anchor="middle" font-size="18" fill="#57534e">why this configuration was chosen</text>
  <text x="813" y="490" text-anchor="middle" font-size="16" font-style="italic" fill="#57534e">captured: step 3 is deterministic</text>
</svg>
