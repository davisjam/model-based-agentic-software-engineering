<?xml version="1.0" encoding="UTF-8"?>
<!-- Fig 6.5 economic-synthesis-frontier.svg. Fold to book/assets/. -->
<!-- The economic synthesis frontier. THREE NESTED regions, not the ASCII's stacked boxes:
     (1) OUTER, dashed neutral — TECHNICALLY AMENABLE TO SYNTHESIS / SEARCH. The fixed technical
         envelope: what could in principle be specified, searched, and evaluated. Dashed + gray to
         read as a limit, not a worked region.
     (2) MIDDLE, rust (#9a3f12 governance-accent, the book's "new economics / commodity intelligence
         changes the price list" colour) — MAGE-ERA ECONOMICALLY WORTHWHILE REGION. The larger economic
         region MAGE predicts, carrying the four movers (cheaper representation, stronger learned search,
         cheap candidate realization, scalable evaluation).
     (3) INNER, gray (#57534e neutral, the historical/implementation baseline) — OLD ECONOMICALLY
         WORTHWHILE REGION, nested inside the MAGE-era region: compilers, optimization, synthesis,
         selected MDE. Old ⊂ MAGE-era ⊂ technical.
     A rust arrow at the base shows the economic boundary MOVING OUTWARD (modal — "MAGE-predicted"),
     inside the fixed technical envelope. Below the outer boundary: consequentially underspecified
     engineering questions remain outside. Palette: Umber Monograph tokens only. -->
<!-- semantic-families: governance, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560"
     role="img" aria-labelledby="esfTitle esfDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="esfTitle">The economic synthesis frontier: MAGE moves the economic boundary of worthwhile
    synthesis outward inside a fixed technical boundary</title>
  <desc id="esfDesc">Three nested regions. The outermost, drawn with a dashed gray boundary, is labelled
    technically amenable to synthesis or search — the fixed envelope of what could in principle be
    specified, searched, and evaluated. Nested inside it, a large rust region is the MAGE-era economically
    worthwhile region, carrying four movers: cheaper representation, stronger learned search, cheap
    candidate realization, and scalable evaluation. Nested inside that, a smaller gray region is the old
    economically worthwhile region — compilers, optimization, synthesis, and selected model-driven
    engineering. So the old worthwhile region sits inside the MAGE-era one, which sits inside the technical
    boundary. A rust arrow along the base shows the economic boundary moving outward, a move MAGE predicts,
    while the technical boundary stays fixed. Below the outer boundary, a note reads: consequentially
    underspecified engineering questions remain outside the boundary.</desc>

  <defs>
    <marker id="esf-ah-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="560" fill="#fdfcf9"/>

  <!-- ============ OUTER BOUNDARY NAME (the technical envelope) ============ -->
  <text x="380" y="42" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2.4" fill="#57534e">TECHNICALLY AMENABLE TO SYNTHESIS / SEARCH</text>

  <!-- ============ (1) OUTER — technical boundary (fixed) ============ -->
  <rect x="40" y="58" width="680" height="418" rx="16" fill="#f6f4ef" stroke="#57534e" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="380" y="459" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57534e">the technical boundary — fixed</text>

  <!-- ============ (2) MIDDLE — MAGE-era economically worthwhile region ============ -->
  <rect x="72" y="132" width="616" height="300" rx="12" fill="#faf1e6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="380" y="160" text-anchor="middle" font-size="13.5" font-weight="700" letter-spacing="1.2" fill="#9a3f12">MAGE-ERA ECONOMICALLY WORTHWHILE REGION</text>
  <text x="380" y="181" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57534e">where structuring for machine realization now pays</text>

  <!-- movers (right column, clear of the nested old region) -->
  <text x="344" y="232" font-size="11.5" font-style="italic" fill="#9a3f12">the movers that widen it</text>
  <text x="344" y="262" font-size="13" fill="#1c1917">·  cheaper representation</text>
  <text x="344" y="288" font-size="13" fill="#1c1917">·  stronger learned search</text>
  <text x="344" y="314" font-size="13" fill="#1c1917">·  cheap candidate realization</text>
  <text x="344" y="340" font-size="13" fill="#1c1917">·  scalable evaluation</text>

  <!-- ============ (3) INNER — old economically worthwhile region ============ -->
  <rect x="100" y="210" width="214" height="188" rx="8" fill="#f3efe7" stroke="#57534e" stroke-width="1.8"/>
  <text x="207" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#57534e">OLD ECONOMICALLY</text>
  <text x="207" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#57534e">WORTHWHILE REGION</text>
  <text x="120" y="290" font-size="12.5" fill="#1c1917">compilers</text>
  <text x="120" y="312" font-size="12.5" fill="#1c1917">optimization</text>
  <text x="120" y="334" font-size="12.5" fill="#1c1917">synthesis</text>
  <text x="120" y="356" font-size="12.5" fill="#1c1917">selected MDE</text>

  <!-- ============ the predicted outward move (economic boundary, not technical) ============ -->
  <text x="498" y="400" text-anchor="middle" font-size="11.5" font-style="italic" fill="#9a3f12">MAGE-predicted outward move</text>
  <line x1="324" y1="412" x2="672" y2="412" stroke="#9a3f12" stroke-width="2" marker-end="url(#esf-ah-rust)"/>
  <line x1="324" y1="406" x2="324" y2="418" stroke="#9a3f12" stroke-width="2"/>

  <!-- ============ outside the outer boundary ============ -->
  <text x="380" y="503" text-anchor="middle" font-size="13.5" font-style="italic" fill="#57534e">consequentially underspecified engineering questions</text>
  <text x="380" y="524" text-anchor="middle" font-size="13.5" font-style="italic" fill="#57534e">remain outside the boundary</text>
</svg>
