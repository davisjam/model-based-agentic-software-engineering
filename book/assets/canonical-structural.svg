<path d="M140,77.5 L153,77.5" fill="none" stroke="#57534e" stroke-width=".8" marker-end="url(#a57534e)" />
<text x="146.5" y="49.0" text-anchor="middle" font-size="9" fill="#57534e">reads through</text>
