<svg xmlns="http://www.w3.org/2000/svg" width="592" height="477.333" viewBox="0 0 444 358" role="img" aria-labelledby="title desc" font-family="'Source Sans 3', sans-serif">
<title id="title">Probability in the software factory</title>
<desc id="desc">Engineering intent is encoded as a property and fulfilled through a fabricator to produce a realization. The encoded property also supplies tolerance for possible realizations; independent measurement informs admission or rejection.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1c1917"/></marker></defs>
<g fill="#1c1917" font-family="'Source Sans 3', sans-serif" font-size="9">
<text x="222" y="15" font-size="11" text-anchor="middle" font-weight="700">SOFTWARE FACTORY</text>
<path d="M2,11 L150,11" fill="none" stroke="#1c1917" stroke-width="0.65"/>
<path d="M294,11 L442,11" fill="none" stroke="#1c1917" stroke-width="0.65"/>
<text x="8" y="39" font-size="10" text-anchor="start" font-weight="700">PROCESS DESIGN:</text>
<text x="91" y="39" font-size="10" text-anchor="start">how production proceeds</text>
<rect x="2" y="59" width="440" height="97" rx="4" fill="white" stroke="#1c1917" stroke-width=".65" stroke-dasharray="3 3"/>
<rect x="9" y="51" width="126" height="14" fill="white"/>
<text x="13" y="62" font-size="10" text-anchor="start" font-weight="700">PRODUCTION PROCESS</text>
<rect x="12" y="74" width="84" height="30" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="54" y="87" font-size="10" text-anchor="middle">Engineering</text>
<text x="54" y="98" font-size="10" text-anchor="middle">intent</text>
<rect x="124" y="74" width="84" height="30" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<text x="166" y="87" font-size="10" text-anchor="middle">Encoded</text>
<text x="166" y="98" font-size="10" text-anchor="middle">property</text>
<rect x="236" y="74" width="84" height="30" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="278" y="93" font-size="10" text-anchor="middle">Fabricator</text>
<rect x="348" y="74" width="84" height="30" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="390" y="93" font-size="10" text-anchor="middle">Realization</text>
<path d="M97,89 L122,89" fill="none" stroke="#1c1917" stroke-width="0.85" marker-end="url(#arrow)"/>
<path d="M209,89 L234,89" fill="none" stroke="#1c1917" stroke-width="0.85" marker-end="url(#arrow)"/>
<path d="M321,89 L346,89" fill="none" stroke="#1c1917" stroke-width="0.85" marker-end="url(#arrow)"/>
<path d="M54,105 L54,113" fill="none" stroke="#1c1917" stroke-width="0.6"/>
<path d="M166,105 L166,113" fill="none" stroke="#1c1917" stroke-width="0.6"/>
<path d="M390,105 L390,113" fill="none" stroke="#1c1917" stroke-width="0.6"/>
<path d="M54,113 L163,113" fill="none" stroke="#1c1917" stroke-width="0.6"/>
<path d="M169,113 L390,113" fill="none" stroke="#1c1917" stroke-width="0.6"/>
<text x="109" y="129" text-anchor="middle" font-size="12" font-style="italic" font-family="'serif', 'Source Sans 3'">P(E)</text>
<text x="109" y="144" font-size="9" text-anchor="middle">correct encoding</text>
<text x="278" y="129" text-anchor="middle" font-size="12" font-style="italic" font-family="'serif', 'Source Sans 3'">P(F | E)</text>
<text x="278" y="144" font-size="9" text-anchor="middle">fulfill encoded obligations</text>
<text x="88" y="172" font-size="9" text-anchor="middle" font-weight="700">Engineers authorize intent.</text>
<text x="283" y="172" font-size="9" text-anchor="middle">Agents interpret, implement,</text>
<text x="283" y="183" font-size="9" text-anchor="middle">and correct.</text>
<path d="M166,105 L166,232" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="178" y="204" font-size="9" text-anchor="start">Supplies</text>
<text x="178" y="215" font-size="9" text-anchor="start">the tolerance</text>
<path d="M390,105 L390,232" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="314" y="196" font-size="9" text-anchor="middle" font-weight="700">Measurement:</text>
<text x="314" y="208" font-size="9" text-anchor="middle">tests, PBT, analysis,</text>
<text x="314" y="219" font-size="9" text-anchor="middle">simulation, human judgment</text>
<rect x="127" y="234" width="303" height="67" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="278.5" y="248" font-size="10" text-anchor="middle" font-weight="700">POSSIBLE REALIZATIONS</text>
<rect x="151" y="258" width="180" height="34" rx="4" fill="#f6f4ef" stroke="#1c1917" stroke-width="0.7"/>
<text x="241" y="270" font-size="10" text-anchor="middle" font-weight="700">Acceptable region</text>
<circle cx="185" cy="282" r="1.8" fill="#1c1917"/>
<circle cx="226" cy="285" r="1.8" fill="#1c1917"/>
<circle cx="267" cy="281" r="1.8" fill="#1c1917"/>
<circle cx="309" cy="284" r="1.8" fill="#1c1917"/>
<circle cx="377" cy="278" r="1.8" fill="#1c1917"/>
<text x="10" y="255" font-size="10" text-anchor="start" font-weight="700">TOLERANCE</text>
<path d="M10,262 L106,262" fill="none" stroke="#1c1917" stroke-width="0.65"/>
<text x="10" y="277" font-size="9" text-anchor="start">acceptable product</text>
<text x="10" y="288" font-size="9" text-anchor="start">variation</text>
<path d="M185,293 L185,307" fill="none" stroke="#1c1917" stroke-width="0.8"/>
<text x="185" y="320" font-size="9" text-anchor="middle">within tolerance</text>
<path d="M185,324 L185,332" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<path d="M377,283 L377,307" fill="none" stroke="#1c1917" stroke-width="0.8"/>
<text x="377" y="320" font-size="9" text-anchor="middle">outside tolerance</text>
<path d="M377,324 L377,332" fill="none" stroke="#1c1917" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="128" y="334" width="114" height="23" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="185" y="349" font-size="10" text-anchor="middle">Admitted change</text>
<rect x="320" y="334" width="114" height="23" rx="4" fill="white" stroke="#1c1917" stroke-width="0.7"/>
<text x="377" y="349" font-size="10" text-anchor="middle">Revise / reject</text>
</g>
</svg>
