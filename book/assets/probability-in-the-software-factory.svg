<?xml version="1.0" encoding="UTF-8"?>
<!-- §6.1 — probability-in-the-software-factory.svg. Hand-SVG: an annotated reprise of Figure 5.1-1
     (process-design-and-tolerance.svg) — same frame, band, node geometry, palette and type scale, with the
     production path's probability terms added and the encoded property forked into the tolerance. Kept in
     hand-SVG for the same reason as its parent: a flow band and a bounded acceptable region in one frame is
     a bespoke composition, not a graph d2 can lay out. -->
<!-- semantic-families: agent, governance, neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 772" width="1000" height="772"
     role="img" aria-labelledby="pfTitle pfDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="pfTitle">Probability on the production path, and the encoded property forking into the
    tolerance the realization is evaluated against</title>
  <desc id="pfDesc">The same SOFTWARE FACTORY frame as the earlier figure. Across the top, inside the
    dashed PROCESS DESIGN band, a left-to-right path runs from engineering intent, through a box drawn in
    the governance colour and labelled encoded property, into the heavy central FABRICATOR box, and out to
    a realization. Each of the three arrows carries the probability that its step succeeds: p sub encode
    from intent to the encoded property, p sub interpret given encode from the encoded property to the
    fabricator, and p sub realize given interpret and encode from the fabricator to the realization. A note
    under the first term reads: not raised by a better fabricator. A note under the other two reads: process
    design and better agents raise these. Below the path the encoded property forks. A second arrow leaves
    the same box and drops straight down, annotated supplies the tolerance, into the bounded ACCEPTABLE
    REGION drawn in the governance colour and carried by a left-hand definition, TOLERANCE — what variation
    in the product is acceptable. Dots inside the region mark distinct acceptable realizations the
    fabricator may choose among. Separately, a measurement arrow drops from the realization into the same
    region, annotated measurement, tests, property-based testing, analysis and human judgment. From the
    region two arrows of equal weight lead out, one labelled within tolerance to admitted change and one
    labelled outside to revise or reject. One use of the encoded property reaches the fabricator; the other
    outlives realization and takes part in judging its result.</desc>

  <defs>
    <marker id="pfArrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10"
            refX="12" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#57534e"/>
    </marker>
    <marker id="pfArrowRust" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10"
            refX="12" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- page ground + the factory frame: the same frame the reader met in the previous chapter -->
  <rect x="0" y="0" width="1000" height="772" fill="#fdfcf9"/>
  <rect x="26" y="62" width="948" height="682" rx="12" fill="#fdfcf9" stroke="#e4e0d8" stroke-width="1.5"/>

  <!-- the process-design band, deepened to carry the probability terms under the path -->
  <rect x="48" y="142" width="904" height="232" rx="10" fill="none" stroke="#cfc9bf" stroke-width="1.5"
        stroke-dasharray="7 5"/>

  <!-- the acceptable region: the bound the realization is measured against, not a stage -->
  <rect id="n-region" x="372" y="452" width="580" height="170" rx="14" fill="#9a3f12" fill-opacity="0.08"
        stroke="#9a3f12" stroke-width="2.5"/>

  <!-- edges are drawn first so each node's opaque fill caps its tail; heads seat inside the target -->
  <!-- edge: n-intent -> n-encoded -->
  <line x1="244" y1="220" x2="287" y2="220" stroke="#57534e" stroke-width="2" marker-end="url(#pfArrow)"/>
  <!-- edge: n-encoded -> n-fabricator -->
  <line x1="454" y1="220" x2="497" y2="220" stroke="#57534e" stroke-width="2" marker-end="url(#pfArrow)"/>
  <!-- edge: n-fabricator -> n-realization -->
  <line x1="708" y1="220" x2="751" y2="220" stroke="#57534e" stroke-width="2" marker-end="url(#pfArrow)"/>
  <!-- edge: n-encoded -> n-region -->
  <line x1="410" y1="240" x2="410" y2="455" stroke="#9a3f12" stroke-width="2.5"
        marker-end="url(#pfArrowRust)"/>
  <!-- edge: n-realization -> n-region -->
  <line x1="880" y1="247" x2="880" y2="455" stroke="#9a3f12" stroke-width="2.5"
        marker-end="url(#pfArrowRust)"/>
  <!-- edge: n-region -> n-admitted -->
  <line x1="805" y1="617" x2="805" y2="670" stroke="#57534e" stroke-width="2" marker-end="url(#pfArrow)"/>
  <!-- edge: n-region -> n-revise -->
  <line x1="515" y1="617" x2="515" y2="670" stroke="#57534e" stroke-width="2" marker-end="url(#pfArrow)"/>

  <!-- the production path; the encoded property carries the governance colour because it is the
       engineering representation that forks -->
  <rect id="n-intent" x="77" y="188" width="172" height="64" rx="8" fill="#fdfcf9" stroke="#cfc9bf"
        stroke-width="1.5"/>
  <rect id="n-encoded" x="287" y="188" width="172" height="64" rx="8" fill="#fdfcf9" stroke="#9a3f12"
        stroke-width="2.5"/>
  <rect id="n-fabricator" x="497" y="168" width="216" height="104" rx="10" fill="#e7edf3" stroke="#2f5169"
        stroke-width="4"/>
  <rect id="n-realization" x="751" y="188" width="172" height="64" rx="8" fill="#fdfcf9" stroke="#cfc9bf"
        stroke-width="1.5"/>

  <!-- both outcomes carry equal weight: rejection is a result the factory produces, not a failure of it -->
  <rect id="n-admitted" x="700" y="668" width="210" height="56" rx="8" fill="#fdfcf9" stroke="#57534e"
        stroke-width="2"/>
  <rect id="n-revise" x="420" y="668" width="190" height="56" rx="8" fill="#fdfcf9" stroke="#57534e"
        stroke-width="2"/>

  <!-- realizations the factory would accept: the fabricator's remaining freedom -->
  <g fill="#1c1917">
    <circle cx="482" cy="538" r="6"/>
    <circle cx="562" cy="526" r="6"/>
    <circle cx="642" cy="544" r="6"/>
    <circle cx="722" cy="528" r="6"/>
    <circle cx="802" cy="540" r="6"/>
  </g>

  <!-- text last: every label is painted over the fills it sits on -->
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#57534e"
        letter-spacing="1.5">SOFTWARE FACTORY</text>

  <text x="52" y="106" font-size="24" font-weight="700" fill="#57534e" letter-spacing="1">PROCESS DESIGN</text>
  <text x="52" y="134" font-size="20" fill="#57534e">how production proceeds</text>
  <text x="77" y="172" font-size="20" fill="#57534e">context · tools · routing · authority · sequencing</text>

  <text x="163" y="212" text-anchor="middle" font-size="21" fill="#1c1917">Engineering</text>
  <text x="163" y="238" text-anchor="middle" font-size="21" fill="#1c1917">intent</text>
  <text x="373" y="212" text-anchor="middle" font-size="21" fill="#1c1917">Encoded</text>
  <text x="373" y="238" text-anchor="middle" font-size="21" fill="#1c1917">property</text>
  <text x="605" y="229" text-anchor="middle" font-size="27" font-weight="700" fill="#1c1917"
        letter-spacing="1.5">FABRICATOR</text>
  <text x="837" y="228" text-anchor="middle" font-size="21" fill="#1c1917">Realization</text>

  <!-- the probability of each step, sitting under the arrow it belongs to -->
  <text x="268" y="306" text-anchor="middle" font-size="21" fill="#1c1917"><tspan
        font-style="italic">p</tspan><tspan font-size="15" dy="6">encode</tspan></text>
  <text x="500" y="306" text-anchor="middle" font-size="21" fill="#1c1917"><tspan
        font-style="italic">p</tspan><tspan font-size="15" dy="6">interpret | encode</tspan></text>
  <text x="745" y="306" text-anchor="middle" font-size="21" fill="#1c1917"><tspan
        font-style="italic">p</tspan><tspan font-size="15" dy="6">realize | interpret, encode</tspan></text>

  <text x="380" y="344" text-anchor="end" font-size="20" fill="#9a3f12">not raised by a better fabricator</text>
  <text x="442" y="344" font-size="20" fill="#57534e">process design and better agents raise these</text>

  <text x="388" y="406" text-anchor="end" font-size="20" fill="#9a3f12">supplies the tolerance</text>

  <text x="862" y="406" text-anchor="end" font-size="21" fill="#9a3f12">measurement</text>
  <text x="862" y="432" text-anchor="end" font-size="20" fill="#9a3f12">tests · PBT · analysis · human judgment</text>

  <text x="52" y="472" font-size="24" font-weight="700" fill="#9a3f12" letter-spacing="1">TOLERANCE</text>
  <text x="52" y="500" font-size="20" fill="#57534e">what variation in the product</text>
  <text x="52" y="524" font-size="20" fill="#57534e">is acceptable</text>

  <text x="662" y="484" text-anchor="middle" font-size="24" font-weight="700" fill="#9a3f12"
        letter-spacing="1">ACCEPTABLE REGION</text>
  <text x="662" y="596" text-anchor="middle" font-size="20" fill="#57534e">the fabricator may choose among these</text>

  <text x="818" y="650" font-size="20" fill="#57534e">within tolerance</text>
  <text x="502" y="650" text-anchor="end" font-size="20" fill="#57534e">outside</text>
  <text x="805" y="703" text-anchor="middle" font-size="21" fill="#1c1917">Admitted change</text>
  <text x="515" y="703" text-anchor="middle" font-size="21" fill="#1c1917">Revise / reject</text>
</svg>
