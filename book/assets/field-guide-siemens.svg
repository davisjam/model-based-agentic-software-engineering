<?xml version="1.0" encoding="UTF-8"?>
<!-- HAND-AUTHORED one-off (Field Guide card — Siemens) — NOT projector output; edit by hand and keep this header. -->
<!-- Field-guide team card: Siemens's entry door (model-first engineering) climbs the modeling ladder and lands on MAGE Modeling. label: field-guide-siemens. Reference/nav card art, not a role-coloured figure. -->
<!-- Connect grammar: the middle element is a climbing LADDER (rails + rungs), a compound glyph the node-reader cannot resolve to one id. The two id-legible nodes (door, landing) and the top reached-rung circle carry ids; the rung -> landing edge is annotated and runs (curving under the rung labels) to the landing centre. The door -> ladder-base connector targets the rail base, not a single node, so it stays unannotated and seated by eye. Edges drawn UNDER the shapes. -->
<!-- semantic-families: neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Field Guide card: Siemens — model-first engineering to the Modeling, one rung short of the drift gate">
  <rect x="0" y="0" width="1000" height="430" fill="#fdfcf9"/>

  <!-- header -->
  <text x="48" y="44" font-size="18" fill="#57534e">Field Guide · card</text>
  <text x="952" y="44" text-anchor="end" font-size="22" font-weight="bold" fill="#1c1917">Siemens</text>
  <text x="952" y="68" text-anchor="end" font-size="18" font-style="italic" fill="#57534e">Industrial / model-based engineering · decades of model-first practice</text>
  <line x1="40" y1="86" x2="960" y2="86" stroke="#cfcabf" stroke-width="1.5"/>

  <!-- ===== edges (under the shapes) ===== -->
  <!-- door -> ladder base: the ladder base is a rail junction, not a single lint-legible node; seated by eye (unannotated). -->
  <line x1="140" y1="205" x2="455" y2="290" stroke="#cfcabf" stroke-width="3"/>
  <!-- edge: top-rung -> landing -->
  <!-- highest reached rung to the landing; curves down to clear the two nearest rung labels. -->
  <path fill="none" d="M520,178 C560,200 700,205 860,205" stroke="#cfcabf" stroke-width="3"/>

  <!-- ===== the modeling ladder + door + landing ===== -->
  <circle id="door" cx="140" cy="205" r="11" fill="#fdfcf9" stroke="#1c1917" stroke-width="3"/>

  <!-- ladder rails -->
  <line x1="455" y1="150" x2="455" y2="300" stroke="#57534e" stroke-width="3"/>
  <line x1="520" y1="150" x2="520" y2="300" stroke="#57534e" stroke-width="3"/>

  <!-- five solid (reached) rungs = the executable-model tier -->
  <line x1="455" y1="290" x2="520" y2="290" stroke="#1c1917" stroke-width="3"/>
  <line x1="455" y1="262" x2="520" y2="262" stroke="#1c1917" stroke-width="3"/>
  <line x1="455" y1="234" x2="520" y2="234" stroke="#1c1917" stroke-width="3"/>
  <line x1="455" y1="206" x2="520" y2="206" stroke="#1c1917" stroke-width="3"/>
  <line x1="455" y1="178" x2="520" y2="178" stroke="#1c1917" stroke-width="3"/>
  <circle cx="520" cy="290" r="4" fill="#1c1917"/>
  <circle cx="520" cy="262" r="4" fill="#1c1917"/>
  <circle cx="520" cy="234" r="4" fill="#1c1917"/>
  <circle cx="520" cy="206" r="4" fill="#1c1917"/>
  <circle id="top-rung" cx="520" cy="178" r="4" fill="#1c1917"/>

  <!-- sixth rung absent: the drift gate, one rung short -->
  <line x1="455" y1="150" x2="520" y2="150" stroke="#1c1917" stroke-width="2.5" stroke-dasharray="5 5"/>
  <circle cx="520" cy="150" r="4" fill="#fdfcf9" stroke="#1c1917" stroke-width="2"/>

  <!-- landing badge -->
  <rect id="landing" x="760" y="181" width="200" height="48" rx="8" fill="#fdfcf9" stroke="#1c1917" stroke-width="2.4"/>

  <!-- ===== labels ===== -->
  <text x="140" y="150" text-anchor="middle" font-size="18" letter-spacing="1" fill="#78716c">ENTERS THROUGH</text>
  <text x="140" y="252" text-anchor="middle" font-size="18" fill="#57534e">Model-first</text>
  <text x="140" y="272" text-anchor="middle" font-size="18" fill="#57534e">engineering</text>

  <text x="532" y="294" text-anchor="start" font-size="18" fill="#57534e">behavioral</text>
  <text x="532" y="266" text-anchor="start" font-size="18" fill="#57534e">process</text>
  <text x="532" y="238" text-anchor="start" font-size="18" fill="#57534e">scenario</text>
  <text x="532" y="210" text-anchor="start" font-size="18" fill="#57534e">invariant</text>
  <text x="532" y="182" text-anchor="start" font-size="18" fill="#57534e">bidirectional traceability</text>
  <text x="455" y="320" text-anchor="start" font-size="18" fill="#78716c">the five rungs (executable tier)</text>
  <text x="532" y="154" text-anchor="start" font-size="18" fill="#78716c">drift gate — one rung short (◐)</text>

  <text x="860" y="150" text-anchor="middle" font-size="18" letter-spacing="1" fill="#78716c">LANDS ON</text>
  <text x="860" y="211" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c1917">Modeling</text>

  <!-- takeaway -->
  <line x1="40" y1="368" x2="960" y2="368" stroke="#cfcabf" stroke-width="1.5"/>
  <text x="500" y="396" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">The strong end of the modeling ladder is already normal in model-based engineering;</text>
  <text x="500" y="418" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">the public evidence examined here does not establish a generalized model↔code admission gate.</text>
</svg>
