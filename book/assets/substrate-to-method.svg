<?xml version="1.0" encoding="UTF-8"?>
<!-- Fig 1.4-1 NEW (part1-copyedit-260815; folds to book/assets/substrate-to-method.svg).
     "From substrate to method." Part I's closing figure: two substrate traits each raise a problem, and
     each problem is answered by a method. Rhymes with the front-matter MAGE overview (Modeling / Alignment)
     without reproducing the full four-part method.
       ROW A — finite working state -> REPRESENTATION PROBLEM (rust) -> MODELING (blue).
       ROW B — probabilistic productive work + observable, interposable seams -> AUTHORITY PROBLEM (rust)
               -> ALIGNMENT (green).
     Palette: gray #57534e/#f6f4ef (substrate traits), rust #9a3f12/#fbeee6 (the problems), blue
     #2f5169/#e7edf3 (modeling), governed green #155c38/#e3f0e7 (alignment), ink #1c1917, page #fdfcf9.
     Grayscale-survivable: three labelled columns (trait / problem / method), two rows; left-to-right
     order carries the derivation, hue only reinforces which method answers which problem. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"
     role="img" aria-labelledby="smTitle smDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="smTitle">From substrate to method</title>
  <desc id="smDesc">Two derivations run left to right. In the first, a finite working state raises the
    representation problem, which the method of modeling answers. In the second, probabilistic productive
    work over observable, interposable seams raises the authority problem, which the method of alignment
    answers. These are the two core activities Part I derives; Part IV composes them into the MAGE method.</desc>

  <defs>
    <marker id="sm-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#fdfcf9"/>
  <text x="450" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#1c1917">From substrate to method</text>

  <!-- column headers -->
  <text x="180" y="86" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1.5" fill="#57534e">SUBSTRATE TRAIT</text>
  <text x="470" y="86" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1.5" fill="#9a3f12">PROBLEM</text>
  <text x="730" y="86" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1.5" fill="#155c38">METHOD</text>

  <!-- ===== EDGES (drawn under nodes; source runs to node centre, directed head seats on target rim) ===== -->
  <!-- edge: trait-a -> representation-problem -->
  <line x1="320" y1="138" x2="358" y2="138" stroke="#57534e" stroke-width="2.4" marker-end="url(#sm-k)"/>
  <!-- edge: representation-problem -> modeling -->
  <line x1="580" y1="138" x2="618" y2="138" stroke="#57534e" stroke-width="2.4" marker-end="url(#sm-k)"/>
  <!-- edge: trait-b -> authority-problem -->
  <line x1="320" y1="288" x2="358" y2="288" stroke="#57534e" stroke-width="2.4" marker-end="url(#sm-k)"/>
  <!-- edge: authority-problem -> alignment -->
  <line x1="580" y1="288" x2="618" y2="288" stroke="#57534e" stroke-width="2.4" marker-end="url(#sm-k)"/>

  <!-- ===== ROW A: representation problem -> modeling ===== -->
  <rect id="trait-a" x="40" y="110" width="280" height="56" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="180" y="143" text-anchor="middle" font-size="18" fill="#1c1917">finite working state</text>

  <rect id="representation-problem" x="349.25" y="110" width="241.5" height="56" rx="10" fill="#fbeee6" stroke="#9a3f12" stroke-width="2.8"/>
  <text x="470" y="143" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">Representation problem</text>

  <rect id="modeling" x="620" y="104" width="264" height="68" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="3"/>
  <text x="752" y="130" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">Modeling</text>
  <text x="752" y="150" text-anchor="middle" font-size="18" fill="#57534e">represent consequential</text>
  <text x="752" y="167" text-anchor="middle" font-size="18" fill="#57534e">properties compactly</text>

  <!-- ===== ROW B: authority problem -> alignment ===== -->
  <rect id="trait-b" x="40" y="252" width="280" height="72" rx="10" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="180" y="282" text-anchor="middle" font-size="18" fill="#1c1917">probabilistic productive work</text>
  <text x="180" y="304" text-anchor="middle" font-size="18" fill="#1c1917">observable, interposable seams</text>

  <rect id="authority-problem" x="360" y="260" width="220" height="56" rx="10" fill="#fbeee6" stroke="#9a3f12" stroke-width="2.8"/>
  <text x="470" y="293" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3f12">Authority problem</text>

  <rect id="alignment" x="620" y="258" width="264" height="60" rx="10" fill="#e3f0e7" stroke="#155c38" stroke-width="3"/>
  <text x="752" y="284" text-anchor="middle" font-size="19" font-weight="700" fill="#155c38">Alignment</text>
  <text x="752" y="305" text-anchor="middle" font-size="18" fill="#57534e">give obligations authority</text>

  <!-- rhyme with the MAGE overview, without reproducing it -->
  <text x="450" y="384" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">Part I derives the two core activities; Part IV composes them into the MAGE method.</text>
</svg>
