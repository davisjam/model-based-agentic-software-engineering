<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (ported from the chapter's mermaid fence, label: sync-model-structure).
     An ER schema: one SyncLock record relates to many LockAcquirer sites ("acquired at") and
     many LockOrdering constraints ("constrains"), drawn with crow's-foot cardinality.
     Palette: Umber Monograph tokens (accent #9a3f12 model records). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470"
     role="group" aria-labelledby="syTitle syDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="syTitle">The sync model: one lock, many acquirers, many ordering constraints</title>
  <desc id="syDesc">A lock record relates to many acquisition sites and many ordering
    constraints. The SyncLock record carries a path (its primary key) and a cap. Each
    LockAcquirer carries a site (primary key) and the lock's path as a foreign key. Each
    LockOrdering carries a before and an after lock path, both foreign keys. The crow's-foot
    ends mark the many side: one lock is acquired at many sites and constrained by many
    ordering edges.</desc>

  <!-- ===== SyncLock (the one side) ===== -->
  <g>
    <rect x="60" y="180" width="280" height="40" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <text x="200" y="207" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">SyncLock</text>
    <rect x="60" y="220" width="280" height="36" fill="#fdfcf9" stroke="#9a3f12" stroke-width="2"/>
    <text x="76" y="244" font-size="20" fill="#1c1917">path</text>
    <text x="324" y="244" text-anchor="end" font-size="19.2" fill="#57534e">string · PK</text>
    <rect x="60" y="256" width="280" height="36" fill="#fdfcf9" stroke="#9a3f12" stroke-width="2"/>
    <text x="76" y="280" font-size="20" fill="#1c1917">cap</text>
    <text x="324" y="280" text-anchor="end" font-size="19.2" fill="#57534e">int</text>
  </g>

  <!-- ===== LockAcquirer (many) ===== -->
  <g>
    <rect x="620" y="50" width="280" height="40" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <text x="760" y="77" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">LockAcquirer</text>
    <rect x="620" y="90" width="280" height="36" fill="#fdfcf9" stroke="#9a3f12" stroke-width="2"/>
    <text x="636" y="114" font-size="20" fill="#1c1917">site</text>
    <text x="884" y="114" text-anchor="end" font-size="19.2" fill="#57534e">string · PK</text>
    <rect x="620" y="126" width="280" height="36" fill="#fdfcf9" stroke="#9a3f12" stroke-width="2"/>
    <text x="636" y="150" font-size="20" fill="#1c1917">path</text>
    <text x="884" y="150" text-anchor="end" font-size="19.2" fill="#57534e">string · FK</text>
  </g>

  <!-- ===== LockOrdering (many) ===== -->
  <g>
    <rect x="620" y="300" width="280" height="40" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <text x="760" y="327" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1917">LockOrdering</text>
    <rect x="620" y="340" width="280" height="36" fill="#fdfcf9" stroke="#9a3f12" stroke-width="2"/>
    <text x="636" y="364" font-size="20" fill="#1c1917">before</text>
    <text x="884" y="364" text-anchor="end" font-size="19.2" fill="#57534e">string · FK</text>
    <rect x="620" y="376" width="280" height="36" fill="#fdfcf9" stroke="#9a3f12" stroke-width="2"/>
    <text x="636" y="400" font-size="20" fill="#1c1917">after</text>
    <text x="884" y="400" text-anchor="end" font-size="19.2" fill="#57534e">string · FK</text>
  </g>

  <!-- ===== relationship: SyncLock one-to-many LockAcquirer, "acquired at" ===== -->
  <path d="M340,214 H470 V108 H576" fill="none" stroke="#1c1917" stroke-width="2"/>
  <!-- exactly-one ticks at the lock end -->
  <line x1="356" y1="204" x2="356" y2="224" stroke="#1c1917" stroke-width="2"/>
  <line x1="366" y1="204" x2="366" y2="224" stroke="#1c1917" stroke-width="2"/>
  <!-- zero-or-many at the acquirer end: circle + crow's foot -->
  <circle cx="582" cy="108" r="6" fill="#fdfcf9" stroke="#1c1917" stroke-width="2"/>
  <g stroke="#1c1917" stroke-width="2" fill="none">
    <line x1="590" y1="108" x2="616" y2="96"/>
    <line x1="590" y1="108" x2="616" y2="108"/>
    <line x1="590" y1="108" x2="616" y2="120"/>
  </g>
  <text x="522" y="94" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">acquired at</text>

  <!-- ===== relationship: SyncLock one-to-many LockOrdering, "constrains" ===== -->
  <path d="M340,262 H470 V358 H576" fill="none" stroke="#1c1917" stroke-width="2"/>
  <line x1="356" y1="252" x2="356" y2="272" stroke="#1c1917" stroke-width="2"/>
  <line x1="366" y1="252" x2="366" y2="272" stroke="#1c1917" stroke-width="2"/>
  <circle cx="582" cy="358" r="6" fill="#fdfcf9" stroke="#1c1917" stroke-width="2"/>
  <g stroke="#1c1917" stroke-width="2" fill="none">
    <line x1="590" y1="358" x2="616" y2="346"/>
    <line x1="590" y1="358" x2="616" y2="358"/>
    <line x1="590" y1="358" x2="616" y2="370"/>
  </g>
  <text x="522" y="344" text-anchor="middle" font-size="19.2" font-style="italic" fill="#57534e">constrains</text>
</svg>
