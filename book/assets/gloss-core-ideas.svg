<?xml version="1.0" encoding="UTF-8"?>
<!-- HAND-AUTHORED one-off glossary section-map (round-7 §G-6; geometry-per-concept verb-audit 260810; R13 edge-type differentiation 260811). Not machine-projected; edit this SVG directly. -->
<!-- HUB geometry for the core ideas — governance is genuinely the centre everything reorganizes around. Kept from round-7. Every edge now carries a verb AND a relation-type: dash pattern is the primary greyscale/colourblind-safe key (solid=constitutive, long-dash=causal/contextual, fine-dotted+open-head=metaphorical, dash-dot=dynamic); arrowheads add direction. Orientation reference chrome, not a role-coloured figure. -->
<!-- semantic-families: neutral -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Concept map: the core ideas, edges typed by relation kind">
  <defs>
    <marker id="vh-ci" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
    <marker id="vh-ci-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#78716c" stroke-width="1.5"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#fdfcf9"/>
  <text x="95" y="40" font-size="17" fill="#57534e">Glossary · concept map</text>
  <text x="905" y="40" text-anchor="end" font-size="18" font-weight="bold" fill="#1c1917">The core ideas</text>

  <!-- edges (drawn first, nodes sit on top); each typed by relation kind, arrow-end trimmed clear of its target node -->
  <!-- Commodity intelligence -> Governance : causal/contextual (long-dash) -->
  <line x1="500" y1="90" x2="500" y2="192" stroke="#57534e" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#vh-ci)"/>
  <!-- Modeling Thesis -> Model : constitutive (solid) -->
  <line x1="155" y1="165" x2="317" y2="234" stroke="#57534e" stroke-width="3" marker-end="url(#vh-ci)"/>
  <!-- Model -> Governance : causal/contextual (long-dash) -->
  <line x1="330" y1="240" x2="478" y2="236" stroke="#57534e" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#vh-ci)"/>
  <!-- Alignment Thesis -> Governance : constitutive (solid) -->
  <line x1="845" y1="150" x2="521" y2="230" stroke="#57534e" stroke-width="3" marker-end="url(#vh-ci)"/>
  <!-- The Printer -> Governance : metaphorical/spec (fine-dotted, open head, lightest) -->
  <line x1="200" y1="375" x2="480" y2="244" stroke="#78716c" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" marker-end="url(#vh-ci-open)"/>
  <!-- Governance Conversion -> Governance : dynamic (dash-dot) -->
  <line x1="640" y1="360" x2="516" y2="250" stroke="#57534e" stroke-width="2.5" stroke-dasharray="10 4 2 4" marker-end="url(#vh-ci)"/>
  <!-- Governance Conversion -> Engineering capital : dynamic (dash-dot) -->
  <line x1="640" y1="360" x2="866" y2="360" stroke="#57534e" stroke-width="2.5" stroke-dasharray="10 4 2 4" marker-end="url(#vh-ci)"/>

  <!-- edge labels (every edge carries a verb) -->
  <text x="512" y="168" font-size="16" fill="#78716c">reorganizes around</text>
  <text x="228" y="196" text-anchor="middle" font-size="16" fill="#78716c">externalize into</text>
  <text x="415" y="228" text-anchor="middle" font-size="16" fill="#78716c">reason through</text>
  <text x="686" y="186" text-anchor="middle" font-size="16" fill="#78716c">encode as mechanisms</text>
  <text x="352" y="300" text-anchor="middle" font-size="16" fill="#78716c">specify precisely</text>
  <text x="586" y="292" text-anchor="middle" font-size="16" fill="#78716c">converts failures</text>
  <text x="760" y="350" text-anchor="middle" font-size="16" fill="#78716c">compounds into</text>

  <!-- hub: Governance -->
  <circle cx="500" cy="235" r="15" fill="#1c1917"/>
  <text x="500" y="212" text-anchor="middle" font-size="21" font-weight="bold" fill="#1c1917">Governance</text>

  <!-- spokes -->
  <circle cx="500" cy="90" r="9" fill="#fdfcf9" stroke="#57534e" stroke-width="3"/>
  <text x="500" y="72" text-anchor="middle" font-size="18" fill="#57534e">Commodity intelligence</text>

  <circle cx="155" cy="165" r="9" fill="#fdfcf9" stroke="#57534e" stroke-width="3"/>
  <text x="155" y="147" text-anchor="middle" font-size="18" fill="#57534e">Modeling Thesis</text>

  <circle cx="330" cy="240" r="9" fill="#fdfcf9" stroke="#57534e" stroke-width="3"/>
  <text x="330" y="272" text-anchor="middle" font-size="18" fill="#57534e">Model</text>

  <circle cx="845" cy="150" r="9" fill="#fdfcf9" stroke="#57534e" stroke-width="3"/>
  <text x="845" y="132" text-anchor="middle" font-size="18" fill="#57534e">Alignment Thesis</text>

  <circle cx="200" cy="375" r="9" fill="#fdfcf9" stroke="#57534e" stroke-width="3"/>
  <text x="200" y="407" text-anchor="middle" font-size="18" fill="#57534e">The Printer</text>

  <circle cx="640" cy="360" r="9" fill="#fdfcf9" stroke="#57534e" stroke-width="3"/>
  <text x="640" y="392" text-anchor="middle" font-size="18" fill="#57534e">Governance Conversion</text>

  <circle cx="880" cy="360" r="9" fill="#fdfcf9" stroke="#57534e" stroke-width="3"/>
  <text x="880" y="392" text-anchor="middle" font-size="18" fill="#57534e">Engineering capital</text>

  <!-- edge-type legend: dash pattern is the primary (print/greyscale/colourblind-safe) key -->
  <line x1="95" y1="478" x2="905" y2="478" stroke="#cfcabf" stroke-width="1.5"/>
  <line x1="95" y1="500" x2="135" y2="500" stroke="#57534e" stroke-width="3" marker-end="url(#vh-ci)"/>
  <text x="143" y="505" font-size="15" fill="#57534e">Constitutive</text>
  <line x1="300" y1="500" x2="340" y2="500" stroke="#57534e" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#vh-ci)"/>
  <text x="348" y="505" font-size="15" fill="#57534e">Causal / contextual</text>
  <line x1="520" y1="500" x2="560" y2="500" stroke="#78716c" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" marker-end="url(#vh-ci-open)"/>
  <text x="568" y="505" font-size="15" fill="#57534e">Metaphorical</text>
  <line x1="720" y1="500" x2="760" y2="500" stroke="#57534e" stroke-width="2.5" stroke-dasharray="10 4 2 4" marker-end="url(#vh-ci)"/>
  <text x="768" y="505" font-size="15" fill="#57534e">Dynamic</text>
</svg>
