<svg xmlns="http://www.w3.org/2000/svg" width="446" height="154" viewBox="0 0 446 154" role="img" aria-labelledby="title desc" font-family="&quot;Source Sans 3&quot;, sans-serif">
<title id="title">Model-guided delegation and two different checks</title>
<desc id="desc">A structured work order and maintained engineering models select a brief containing relevant knowledge and obligations. Brief validation precedes agent dispatch. The agent implements and commits. Completion review uses landed changes and independent checks to update work-order status; a completion message alone does not establish acceptance.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="#1c1917"/></marker><marker id="arrowstart" markerWidth="6" markerHeight="6" refX="0.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M6,0 L0,3 L6,6 Z" fill="#1c1917"/></marker></defs>
<rect x="30" y="4" width="180" height="46" rx="3" fill="white" stroke="#1c1917" stroke-width="0.65"/>
<text x="120" y="20" text-anchor="middle" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">WORK ORDER</text>
<text x="120" y="34" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Role · target paths</text>
<text x="120" y="46" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Verification · acceptance</text>
<rect x="236" y="4" width="180" height="46" rx="3" fill="#f1f4f6" stroke="#2f5169" stroke-width="0.65"/>
<text x="326" y="20" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">ENGINEERING MODELS</text>
<text x="326" y="34" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Components · constraints</text>
<text x="326" y="46" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Procedures</text>
<path d="M120,50 L120,62 L90,62 L90,80" fill="none" stroke="#1c1917" stroke-width="0.65"/>
<path d="M326,50 L326,62 L90,62 L90,80" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<text x="213" y="75" text-anchor="middle" font-size="10" font-weight="400" font-style="italic" fill="#57534e">select</text>
<rect x="30" y="80" width="120" height="50" rx="3" fill="white" stroke="#1c1917" stroke-width="0.65"/>
<text x="90" y="95" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">ASSEMBLED BRIEF</text>
<text x="90" y="111" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Selected knowledge</text>
<text x="90" y="124" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">and obligations</text>
<rect x="200" y="80" width="75" height="50" rx="3" fill="white" stroke="#1c1917" stroke-width="0.65"/>
<text x="237.5" y="95" text-anchor="middle" font-size="11" font-weight="700" font-style="normal" fill="#1c1917">AGENT</text>
<text x="237.5" y="111" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Implement</text>
<text x="237.5" y="124" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Commit</text>
<path d="M150,106 L200,106" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<text x="175" y="98" text-anchor="middle" font-size="10" font-weight="400" font-style="italic" fill="#57534e">validate</text>
<rect x="310" y="80" width="132" height="50" rx="3" fill="white" stroke="#086438" stroke-width="0.65"/>
<text x="376" y="95" text-anchor="middle" font-size="10.5" font-weight="700" font-style="normal" fill="#1c1917">COMPLETION EVIDENCE</text>
<text x="376" y="111" text-anchor="middle" font-size="10.5" font-weight="400" font-style="normal" fill="#1c1917">Landed changes</text>
<text x="376" y="124" text-anchor="middle" font-size="10" font-weight="400" font-style="normal" fill="#1c1917">Independent checks</text>
<path d="M275,106 L310,106" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<path d="M376,130 L376,148 L8,148 L8,27 L30,27" fill="none" stroke="#1c1917" stroke-width="0.65" marker-end="url(#arrow)"/>
<text x="218" y="143" text-anchor="middle" font-size="10" font-weight="400" font-style="italic" fill="#57534e">Review and update status</text>
</svg>
