<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1062" viewBox="0 0 440 354" role="img" aria-labelledby="title desc"><title id="title">Governed delegation with parallel dispatch and completion decisions</title><desc id="desc">The work order and component/constraint models feed bounded context selection. Lifecycle policy and reconciled phase state feed the dispatch decision: is the assignment authorized? A refused assignment does not execute without repair or a valid override. An authorized agent preserves durable work, which is both inspected at completion and evaluated by independent checks. Checks produce review evidence; the completion decision asks whether obligations are satisfied. Interrupted or unresolved work is inspected and reconciled before redispatch. Absence of state is not evidence of DONE.</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.7" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L5,2.5 L0,5 Z" fill="black"/></marker></defs><rect width="440" height="354" fill="white"/>
