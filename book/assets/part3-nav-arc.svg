<!-- Compact teaching geometry; print width is declared by stable figure label in book/data/figure-print-layout.json. Text remains at 9–10 pt in the PDF. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 335" width="600" height="335" role="img" aria-labelledby="figure-title figure-description" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
<title id="figure-title">Alignment: how engineering intent becomes enforced, across the five chapters of Chapter 3</title>
<desc id="figure-description">Five engineering moves form a vertical sequence: locate the boundary, justify the obligation, mechanize enforcement, learn from experience, and govern the resulting controls. The section numbers identify where each move is developed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a3f12"/></marker></defs>
<line x1="31" y1="52" x2="31" y2="83" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="31" cy="35" r="19" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="31" y="42" text-anchor="middle" font-size="20" fill="#9a3f12" font-weight="700">3.1</text>
<text x="65" y="30" text-anchor="start" font-size="22" fill="#9a3f12" font-weight="700">LOCATE</text>
<text x="65" y="57" text-anchor="start" font-size="20" fill="#1c1917">Where can enforcement occur?</text>
<line x1="31" y1="117" x2="31" y2="148" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="31" cy="100" r="19" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="31" y="107" text-anchor="middle" font-size="20" fill="#9a3f12" font-weight="700">3.2</text>
<text x="65" y="95" text-anchor="start" font-size="22" fill="#9a3f12" font-weight="700">JUSTIFY</text>
<text x="65" y="122" text-anchor="start" font-size="20" fill="#1c1917">What may it legitimately enforce?</text>
<line x1="31" y1="182" x2="31" y2="213" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="31" cy="165" r="19" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="31" y="172" text-anchor="middle" font-size="20" fill="#9a3f12" font-weight="700">3.3</text>
<text x="65" y="160" text-anchor="start" font-size="22" fill="#9a3f12" font-weight="700">MECHANIZE</text>
<text x="65" y="187" text-anchor="start" font-size="20" fill="#1c1917">How can a mechanism enforce the obligation?</text>
<line x1="31" y1="247" x2="31" y2="278" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="31" cy="230" r="19" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="31" y="237" text-anchor="middle" font-size="20" fill="#9a3f12" font-weight="700">3.4</text>
<text x="65" y="225" text-anchor="start" font-size="22" fill="#9a3f12" font-weight="700">LEARN</text>
<text x="65" y="252" text-anchor="start" font-size="20" fill="#1c1917">What does experience teach the environment?</text>
<circle cx="31" cy="295" r="19" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
<text x="31" y="302" text-anchor="middle" font-size="20" fill="#9a3f12" font-weight="700">3.5</text>
<text x="65" y="290" text-anchor="start" font-size="22" fill="#9a3f12" font-weight="700">GOVERN</text>
<text x="65" y="317" text-anchor="start" font-size="20" fill="#1c1917">How do accumulated controls work together?</text>
</svg>
