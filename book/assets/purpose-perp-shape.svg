<?xml version="1.0" encoding="UTF-8"?>
<!-- Figure 2.8-3 concept (part2-v8-260814 re-author; folds to book/assets/).
     REVISION per v8 editor guidance (2.8-3): replace the many-to-many spaghetti with a MATRIX. Rows are
     the six model PURPOSES (examples); columns are EXAMPLE REPRESENTATION FORMS. A filled dot marks a
     sample pairing. Both axes are labelled as examples. The matrix makes the point legible: one purpose
     can use several forms, one form can serve several purposes. Sample cells taken from the v8 source
     matrix. Grammar: blue #2f5169 = the PURPOSE axis and the sample-pairing dots; gray #57534e = the
     REPRESENTATION-FORM axis. Hand-authored (a labelled purpose x form matrix). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480"
     role="img" aria-labelledby="ppTitle ppDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="ppTitle">Model purpose and representation form are independent: a sample pairing matrix</title>
  <desc id="ppDesc">A matrix. Rows are six example model purposes: structural, behavioral, ownership,
    decision, measurement, provenance. Columns are example representation forms: registry, state machine,
    contract, table, quantitative. A filled blue dot marks a sample pairing. Structural pairs with
    registry; behavioral with state machine; ownership with registry, state machine, and contract; decision
    with registry and table; measurement with registry and quantitative; provenance with registry and
    contract. One purpose can use several forms; one form can serve several purposes.</desc>

  <text x="450" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">Purpose and representation form are independent</text>

  <!-- axis titles -->
  <text x="540" y="70" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#57534e">EXAMPLE REPRESENTATION FORMS</text>
  <text x="34" y="290" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#2f5169" transform="rotate(-90 34 290)">MODEL PURPOSES (examples)</text>

  <!-- column headers -->
  <g font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">
    <text x="276" y="112">registry</text>
    <text x="408" y="105">state</text>
    <text x="408" y="122">machine</text>
    <text x="540" y="112">contract</text>
    <text x="672" y="112">table</text>
    <text x="804" y="112">quantitative</text>
  </g>

  <!-- grid -->
  <g stroke="#d9d3c8" stroke-width="1.4">
    <!-- verticals at column boundaries -->
    <line x1="210" y1="140" x2="210" y2="440"/>
    <line x1="342" y1="140" x2="342" y2="440"/>
    <line x1="474" y1="140" x2="474" y2="440"/>
    <line x1="606" y1="140" x2="606" y2="440"/>
    <line x1="738" y1="140" x2="738" y2="440"/>
    <line x1="870" y1="140" x2="870" y2="440"/>
    <!-- horizontals at row boundaries -->
    <line x1="60" y1="140" x2="870" y2="140"/>
    <line x1="60" y1="190" x2="870" y2="190"/>
    <line x1="60" y1="240" x2="870" y2="240"/>
    <line x1="60" y1="290" x2="870" y2="290"/>
    <line x1="60" y1="340" x2="870" y2="340"/>
    <line x1="60" y1="390" x2="870" y2="390"/>
    <line x1="60" y1="440" x2="870" y2="440"/>
    <!-- left edge of purpose-label column -->
    <line x1="60" y1="140" x2="60" y2="440"/>
  </g>

  <!-- row (purpose) labels -->
  <g font-size="15" font-weight="700" fill="#2f5169" text-anchor="end">
    <text x="200" y="170">structural</text>
    <text x="200" y="220">behavioral</text>
    <text x="200" y="270">ownership</text>
    <text x="200" y="320">decision</text>
    <text x="200" y="370">measurement</text>
    <text x="200" y="420">provenance</text>
  </g>

  <!-- sample-pairing dots (row centers: 165,215,265,315,365,415; col centers: 276,408,540,672,804) -->
  <g fill="#2f5169">
    <!-- structural: registry -->
    <circle cx="276" cy="165" r="8"/>
    <!-- behavioral: state machine -->
    <circle cx="408" cy="215" r="8"/>
    <!-- ownership: registry, state machine, contract -->
    <circle cx="276" cy="265" r="8"/>
    <circle cx="408" cy="265" r="8"/>
    <circle cx="540" cy="265" r="8"/>
    <!-- decision: registry, table -->
    <circle cx="276" cy="315" r="8"/>
    <circle cx="672" cy="315" r="8"/>
    <!-- measurement: registry, quantitative -->
    <circle cx="276" cy="365" r="8"/>
    <circle cx="804" cy="365" r="8"/>
    <!-- provenance: registry, contract -->
    <circle cx="276" cy="415" r="8"/>
    <circle cx="540" cy="415" r="8"/>
  </g>

  <!-- footer: protect the point -->
  <text x="450" y="470" text-anchor="middle" font-size="14.5" font-style="italic" fill="#1c1917">Both axes are examples. &#9679; marks a sample pairing &#8212; one purpose, several forms; one form, several purposes.</text>
</svg>
