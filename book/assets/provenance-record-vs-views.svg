<?xml version="1.0" encoding="UTF-8"?>
<!-- Figure 2.7 concept (part2-content-revision-260814; folds to book/assets/).
     A provenance model records the ACTION once, then derives every explanation from that one shared history.
     The blue path is right: ACTION -> PROVENANCE MODEL -> audit, debugging, and changelog, each a VIEW
     derived from the same record. The rust path is the anti-pattern the model forbids: writing each story
     straight from the action as its own separately-maintained account (action -> audit story, action ->
     changelog story), which drift apart. Grammar: blue #2f5169 = the recorded model and its derived views;
     rust #9a3f12 = the forbidden action-to-story shortcut. Hand-authored (a record-once fan plus a crossed-out
     shortcut, not a flow). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"
     role="img" aria-labelledby="pvTitle pvDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="pvTitle">A provenance model separates the recorded action from the views derived from it</title>
  <desc id="pvDesc">On the left, the model path in blue: an action flows into a provenance model, from which
    audit, debugging, and changelog views are derived. On the right, the forbidden path in rust: writing an
    audit story and a changelog story straight from the action as separate accounts, marked not-legal. One
    record, many derived views, versus several separately-maintained stories that drift.</desc>

  <defs>
    <marker id="pv-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8.5" markerHeight="8.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
    <marker id="pv-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/>
    </marker>
  </defs>

  <!-- divider -->
  <line x1="470" y1="56" x2="470" y2="336" stroke="#d9d3c8" stroke-width="1.6"/>

  <!-- ===== LEFT: record-once model ===== -->
  <text x="230" y="40" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1.2" fill="#2f5169">RECORD ONCE, DERIVE VIEWS</text>
  <rect id="l-action" x="150" y="60" width="160" height="46" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="230" y="89" text-anchor="middle" font-size="18" font-weight="700" fill="#57534e">ACTION</text>
  <!-- edge: l-action -> prov-model -->
  <line x1="230" y1="106" x2="230" y2="132" stroke="#2f5169" stroke-width="2.2" marker-end="url(#pv-b)"/>
  <rect id="prov-model" x="120" y="134" width="220" height="52" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="230" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5169">PROVENANCE MODEL</text>
  <!-- fan to three views (one path per branch) -->
  <g fill="none" stroke="#2f5169" stroke-width="2.2" marker-end="url(#pv-b)">
    <!-- edge: prov-model -> v-audit -->
    <path d="M140,186 L140,244"/>
    <!-- edge: prov-model -> v-debug -->
    <path d="M230,186 L230,244"/>
    <!-- edge: prov-model -> v-changelog -->
    <path d="M320,186 L320,244"/>
  </g>
  <g font-size="18" font-weight="700" text-anchor="middle" fill="#2f5169">
    <rect id="v-audit" x="40" y="246" width="120" height="44" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="100" y="273">audit</text>
    <rect id="v-debug" x="170" y="246" width="120" height="44" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="230" y="273">debugging</text>
    <rect id="v-changelog" x="300" y="246" width="120" height="44" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
    <text x="360" y="273">changelog</text>
  </g>
  <text x="230" y="316" text-anchor="middle" font-size="18" font-style="italic" fill="#57534e">derived views of one shared history</text>

  <!-- ===== RIGHT: the forbidden shortcut ===== -->
  <text x="685" y="40" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1.2" fill="#9a3f12">NOT: ACTION &#8594; STORY</text>
  <rect id="r-action" x="605" y="60" width="160" height="46" rx="9" fill="#f6f4ef" stroke="#57534e" stroke-width="2.2"/>
  <text x="685" y="89" text-anchor="middle" font-size="18" font-weight="700" fill="#57534e">ACTION</text>
  <!-- direct rust arrows to separate stories (forbidden shortcut; struck-but-spanning, plug both ends) -->
  <!-- edge: r-action .. s-audit -->
  <path d="M612.5,106 L612.5,244" fill="none" stroke="#9a3f12" stroke-width="2.4" stroke-dasharray="9 6" marker-end="url(#pv-r)"/>
  <!-- edge: r-action .. s-changelog -->
  <path d="M730,106 C800,150 820,200 820,244" fill="none" stroke="#9a3f12" stroke-width="2.4" stroke-dasharray="9 6" marker-end="url(#pv-r)"/>
  <!-- X on the shortcut -->
  <g stroke="#9a3f12" stroke-width="3.4" stroke-linecap="round">
    <line x1="674" y1="150" x2="696" y2="172"/>
    <line x1="696" y1="150" x2="674" y2="172"/>
  </g>
  <g font-size="18" font-weight="700" text-anchor="middle" fill="#9a3f12">
    <rect id="s-audit" x="500" y="246" width="120" height="44" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <text x="560" y="266">audit</text>
    <text x="560" y="283">story</text>
    <rect id="s-changelog" x="760" y="246" width="120" height="44" rx="9" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
    <text x="820" y="266">changelog</text>
    <text x="820" y="283">story</text>
  </g>
  <text x="685" y="316" text-anchor="middle" font-size="18" font-style="italic" fill="#9a3f12">separately-maintained accounts drift apart</text>

  <!-- footer: protect the point -->
  <text x="450" y="378" text-anchor="middle" font-size="18" font-style="italic" fill="#1c1917">One structured history, many explanations derived from it &#8212; not several stories of the same action.</text>
</svg>
