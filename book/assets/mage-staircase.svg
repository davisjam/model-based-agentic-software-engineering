<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (R46b redraw of label: mage-staircase). Fold-target: book/assets/mage-staircase.svg.
     The delegation staircase, five rungs climbing bottom (Co-coder) to top (Architect). Each rung
     carries THREE fields: delegated work · what the environment now carries · what remains human.
     A residual-human band (churn red) runs up the right column and NARROWS as the climb proceeds —
     human tactical burden shrinks, it does not vanish. The environment absorbs two kinds of work:
     representation (Modeling) and authority (Alignment). A miss in either can push work back down.
     Palette: Umber Monograph tokens — fleet #2f5169 (delegated), governed #1f7a4d (environment
     carries), churn #b23b3b (residual human burden), accent #9a3f12 (supports/labels),
     ink #1c1917, muted #57534e. Font Source Sans 3. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940"
     role="group" aria-labelledby="dsTitle dsDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="dsTitle">The delegation staircase — five rungs from Co-coder to Architect, with a residual human-judgment band that narrows but never vanishes</title>
  <desc id="dsDesc">A five-rung staircase climbing from bottom to top. Each rung shows three fields:
    the work delegated, what the engineering environment now carries, and what remains human. Rung
    one, Co-coder: delegated is code generation; the environment carries nothing durable beyond an
    ordinary repository; remaining human is reading every diff, holding the map, and admitting the
    change. Rung two, QA: delegated is generation plus a second agent's audit; the environment
    carries a probabilistic reviewer that is episodic and advisory; remaining human is adjudicating
    findings and admitting the change. Rung three, Review lead: delegated is specialized review per
    region; the environment carries deterministic checks for the decidable findings; remaining human
    is the semantic review a check cannot settle. Rung four, Tech lead: delegated is bounded work
    inside one zone; the environment carries named zones and boundary rules; remaining human is the
    system-level map and strategy. Rung five, Architect: delegated is model-guided work across the
    system; the environment carries explicit models, traceability, and controls; remaining human is
    residual semantics and strategy. Along the right, a red residual-human band narrows from wide at
    the bottom rung to a sliver at the top — the human tactical burden shrinks but never reaches
    zero. The environment absorbs two kinds of work: representation through Modeling and authority
    through Alignment. A failure in either can push work back down the staircase.</desc>

  <defs>
    <marker id="ds-up" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,10 L5,0 L10,10 z" fill="#2f5169"/>
    </marker>
    <marker id="ds-down" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L5,10 L10,0 z" fill="#b23b3b"/>
    </marker>
  </defs>

  <!-- column header strip -->
  <text x="316" y="30" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2f5169" letter-spacing="0.4">DELEGATED WORK</text>
  <text x="628" y="30" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1f7a4d" letter-spacing="0.4">WHAT THE ENVIRONMENT NOW CARRIES</text>
  <text x="948" y="30" text-anchor="middle" font-size="16.5" font-weight="700" fill="#b23b3b" letter-spacing="0.4">WHAT REMAINS HUMAN</text>
  <line x1="30" y1="40" x2="1064" y2="40" stroke="#d6cfc6" stroke-width="1.5"/>

  <!-- ascending arrow: delegation climbs (left margin) -->
  <line x1="1108" y1="880" x2="1108" y2="70" stroke="#2f5169" stroke-width="2.5" marker-end="url(#ds-up)"/>
  <text x="1128" y="480" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5169" transform="rotate(90 1128 480)" letter-spacing="0.5">delegation climbs</text>
  <!-- descending caution: a miss sends it backward -->
  <line x1="1150" y1="120" x2="1150" y2="840" stroke="#b23b3b" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ds-down)"/>
  <text x="1170" y="480" text-anchor="middle" font-size="13.5" font-style="italic" fill="#b23b3b" transform="rotate(90 1170 480)">a miss sends it backward</text>

  <!-- ================= RUNG 5 · Architect (summit, top) ================= -->
  <rect x="30" y="52" width="1034" height="150" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="46" y="80" font-size="19" font-weight="700" fill="#1c1917">5 · Architect</text>
  <text x="46" y="102" font-size="14.5" font-style="italic" fill="#9a3f12">explicit models carry system-level knowledge</text>
  <line x1="160" y1="112" x2="1050" y2="112" stroke="#bcd6c6" stroke-width="1.2"/>
  <!-- fields -->
  <text x="316" y="140" text-anchor="middle" font-size="16.5" fill="#2f5169" font-weight="600">model-guided work</text>
  <text x="316" y="162" text-anchor="middle" font-size="16.5" fill="#2f5169" font-weight="600">across the system</text>
  <text x="628" y="140" text-anchor="middle" font-size="16.5" fill="#1f7a4d" font-weight="600">explicit models · traceability</text>
  <text x="628" y="162" text-anchor="middle" font-size="16.5" fill="#1f7a4d" font-weight="600">· controls</text>
  <text x="948" y="151" text-anchor="middle" font-size="16.5" fill="#57534e">residual semantics + strategy</text>
  <!-- residual-human band: narrowest -->
  <rect x="1046" y="120" width="14" height="64" rx="3" fill="#b23b3b" opacity="0.9"/>

  <!-- ================= RUNG 4 · Tech lead ================= -->
  <rect x="30" y="216" width="1034" height="140" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="46" y="244" font-size="19" font-weight="700" fill="#1c1917">4 · Tech lead</text>
  <text x="46" y="266" font-size="14.5" font-style="italic" fill="#9a3f12">representation makes reasoning local</text>
  <line x1="160" y1="276" x2="1050" y2="276" stroke="#c8d3de" stroke-width="1.2"/>
  <text x="316" y="304" text-anchor="middle" font-size="16.5" fill="#2f5169" font-weight="600">bounded work</text>
  <text x="316" y="326" text-anchor="middle" font-size="16.5" fill="#2f5169" font-weight="600">inside one zone</text>
  <text x="628" y="315" text-anchor="middle" font-size="16.5" fill="#1f7a4d" font-weight="600">named zones + boundary rules</text>
  <text x="948" y="315" text-anchor="middle" font-size="16.5" fill="#57534e">system-level map + strategy</text>
  <rect x="1040" y="288" width="20" height="76" rx="3" fill="#b23b3b" opacity="0.9"/>

  <!-- ================= RUNG 3 · Review lead ================= -->
  <rect x="30" y="370" width="1034" height="140" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="46" y="398" font-size="19" font-weight="700" fill="#1c1917">3 · Review lead</text>
  <text x="46" y="420" font-size="14.5" font-style="italic" fill="#9a3f12">specialized, with the decidable residue determinized</text>
  <line x1="160" y1="430" x2="1050" y2="430" stroke="#c8d3de" stroke-width="1.2"/>
  <text x="316" y="458" text-anchor="middle" font-size="16.5" fill="#2f5169" font-weight="600">specialized review,</text>
  <text x="316" y="480" text-anchor="middle" font-size="16.5" fill="#2f5169" font-weight="600">per region</text>
  <text x="628" y="458" text-anchor="middle" font-size="16.5" fill="#1f7a4d" font-weight="600">deterministic checks for</text>
  <text x="628" y="480" text-anchor="middle" font-size="16.5" fill="#1f7a4d" font-weight="600">the decidable findings</text>
  <text x="948" y="469" text-anchor="middle" font-size="16.5" fill="#57534e">the semantic review a</text>
  <text x="948" y="491" text-anchor="middle" font-size="16.5" fill="#57534e">check can't settle</text>
  <rect x="1032" y="442" width="28" height="88" rx="3" fill="#b23b3b" opacity="0.9"/>

  <!-- ================= RUNG 2 · QA ================= -->
  <rect x="30" y="524" width="1034" height="140" rx="10" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="46" y="552" font-size="19" font-weight="700" fill="#1c1917">2 · QA</text>
  <text x="46" y="574" font-size="14.5" font-style="italic" fill="#9a3f12">evaluation delegated before authority</text>
  <line x1="160" y1="584" x2="1050" y2="584" stroke="#c8d3de" stroke-width="1.2"/>
  <text x="316" y="612" text-anchor="middle" font-size="16.5" fill="#2f5169" font-weight="600">generation + a second</text>
  <text x="316" y="634" text-anchor="middle" font-size="16.5" fill="#2f5169" font-weight="600">agent's audit</text>
  <text x="628" y="612" text-anchor="middle" font-size="16.5" fill="#1f7a4d" font-weight="600">a probabilistic reviewer</text>
  <text x="628" y="634" text-anchor="middle" font-size="16.5" fill="#1f7a4d" font-weight="600">(episodic, advisory)</text>
  <text x="948" y="612" text-anchor="middle" font-size="16.5" fill="#57534e">adjudicate findings ·</text>
  <text x="948" y="634" text-anchor="middle" font-size="16.5" fill="#57534e">admit the change</text>
  <rect x="1022" y="596" width="38" height="96" rx="3" fill="#b23b3b" opacity="0.9"/>

  <!-- ================= RUNG 1 · Co-coder (base, bottom) ================= -->
  <rect x="30" y="678" width="1034" height="150" rx="10" fill="#eef1f4" stroke="#2f5169" stroke-width="2"/>
  <text x="46" y="706" font-size="19" font-weight="700" fill="#1c1917">1 · Co-coder</text>
  <text x="46" y="728" font-size="14.5" font-style="italic" fill="#9a3f12">direct human inspection carries everything</text>
  <line x1="160" y1="738" x2="1050" y2="738" stroke="#c8d3de" stroke-width="1.2"/>
  <text x="316" y="774" text-anchor="middle" font-size="16.5" fill="#2f5169" font-weight="600">code generation</text>
  <text x="628" y="763" text-anchor="middle" font-size="16.5" fill="#1f7a4d" font-weight="600">nothing durable beyond</text>
  <text x="628" y="785" text-anchor="middle" font-size="16.5" fill="#1f7a4d" font-weight="600">an ordinary repository</text>
  <text x="948" y="763" text-anchor="middle" font-size="16.5" fill="#57534e">read every diff · hold the</text>
  <text x="948" y="785" text-anchor="middle" font-size="16.5" fill="#57534e">map · admit the change</text>
  <rect x="1010" y="690" width="50" height="126" rx="3" fill="#b23b3b" opacity="0.9"/>

  <!-- footer legend: two supports + residual band -->
  <line x1="30" y1="856" x2="1064" y2="856" stroke="#d6cfc6" stroke-width="1.5"/>
  <rect x="30" y="874" width="20" height="20" rx="3" fill="#1f7a4d"/>
  <text x="58" y="889" font-size="14.5" fill="#1c1917">The environment absorbs two kinds of work — <tspan font-weight="700" fill="#1f7a4d">representation</tspan> (Modeling) and <tspan font-weight="700" fill="#9a3f12">authority</tspan> (Alignment).</text>
  <rect x="30" y="906" width="20" height="20" rx="3" fill="#b23b3b" opacity="0.9"/>
  <text x="58" y="921" font-size="14.5" fill="#1c1917"><tspan font-weight="700" fill="#b23b3b">Residual human judgment</tspan> narrows up the climb — the tactical burden shrinks; it does not vanish.</text>
</svg>
