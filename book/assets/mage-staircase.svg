<svg xmlns="http://www.w3.org/2000/svg" width="440pt" height="357pt" viewBox="0 0 440 357" role="img" aria-labelledby="title desc" font-family="Source Sans 3, sans-serif">
<title id="title">DocAble’s delegation staircase</title>
<desc id="desc">Five observed stages rise from Co-coder through QA, Review lead, and Tech lead to Architect. The environment accumulates advisory review, deterministic checks, named zones, and system models. Human responsibility shifts from inspecting changes toward unresolved judgments and strategy. The steps are qualitative, not measurements or a prescribed maturity model.</desc>
<rect width="440" height="357" fill="white"/>
<polygon points="8,38 88,38 88,102 70,102 70,166 52,166 52,230 34,230 34,294 16,294 16,350 8,350" fill="#e3f0e7"/>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="8" y="13" font-size="11" fill="#1c1917" font-weight="700">ENVIRONMENT ACCUMULATES</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="8" y="29" font-size="10.5" fill="#1c1917">Representation + enforcement</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="298" y="13" font-size="11" fill="#1c1917" font-weight="700">HUMAN RESPONSIBILITY</text>
<line x1="290" y1="38" x2="290" y2="350" stroke="#bcb8b2" stroke-width="0.5"/>
<path d="M88 94V38H280" fill="none" stroke="#1f7a4d" stroke-width="0.8"/>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="96" y="55" font-size="10.5" fill="#1c1917" font-weight="700">5. ARCHITECT</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="96" y="72.0" font-size="10.5" fill="#1c1917">System models, traceability,</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="96" y="84.5" font-size="10.5" fill="#1c1917">and controls</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="298" y="63.0" font-size="10.5" fill="#1c1917">Residual judgments</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="298" y="75.5" font-size="10.5" fill="#1c1917">and strategy</text>
<path d="M70 158V102H280" fill="none" stroke="#1f7a4d" stroke-width="0.8"/>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="78" y="119" font-size="10.5" fill="#1c1917" font-weight="700">4. TECH LEAD</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="78" y="136.0" font-size="10.5" fill="#1c1917">Named zones and</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="78" y="148.5" font-size="10.5" fill="#1c1917">boundary rules</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="298" y="127.0" font-size="10.5" fill="#1c1917">System map</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="298" y="139.5" font-size="10.5" fill="#1c1917">and strategy</text>
<path d="M52 222V166H280" fill="none" stroke="#1f7a4d" stroke-width="0.8"/>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="60" y="183" font-size="10.5" fill="#1c1917" font-weight="700">3. REVIEW LEAD</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="60" y="200.0" font-size="10.5" fill="#1c1917">Deterministic checks;</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="60" y="212.5" font-size="10.5" fill="#1c1917">specialized review</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="298" y="191.0" font-size="10.5" fill="#1c1917">Unresolved</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="298" y="203.5" font-size="10.5" fill="#1c1917">semantic review</text>
<path d="M34 286V230H280" fill="none" stroke="#1f7a4d" stroke-width="0.8"/>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="42" y="247" font-size="10.5" fill="#1c1917" font-weight="700">2. QA</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="42" y="264.0" font-size="10.5" fill="#1c1917">Advisory agent review</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="298" y="255.0" font-size="10.5" fill="#1c1917">Adjudicate findings</text>
<path d="M16 350V294H280" fill="none" stroke="#1f7a4d" stroke-width="0.8"/>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="24" y="311" font-size="10.5" fill="#1c1917" font-weight="700">1. CO-CODER</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="24" y="328.0" font-size="10.5" fill="#1c1917">Ordinary repository</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="298" y="319.0" font-size="10.5" fill="#1c1917">Read, judge, and</text>
<text style="font-family: Source Sans 3, sans-serif" font-family="Source Sans 3" x="298" y="331.5" font-size="10.5" fill="#1c1917">admit changes</text>
</svg>
