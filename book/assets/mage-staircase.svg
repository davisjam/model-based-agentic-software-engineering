<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1142" width="1340" height="1142" role="group" aria-labelledby="dsTitle dsDesc" font-family="'Source Sans 3', Arial, sans-serif">
<title id="dsTitle">The delegation staircase — five ascending steps from Co-coder to Architect; delegated work climbs, the engineered environment accumulates, and residual human burden narrows but never vanishes</title>
  <desc id="dsDesc">A true staircase of five steps ascending from bottom-left to top-right. Step one at the
    bottom is Co-coder; step five at the summit is Architect. Each step card names a stage and shows, in
    blue, what is now delegated, and in green, what the engineered environment now carries. Along the
    left edge a green gauge thickens as the climb proceeds — representation and enforcement accumulate.
    Along the right edge a red trajectory narrows from wide at the base to a sliver at the summit: the
    residual human focus moves from reading every diff at the bottom to system-level strategy and residual
    semantic judgment at the top — the tactical burden shrinks but never reaches zero. Step one Co-coder:
    delegated is code generation; the environment carries nothing durable beyond an ordinary repository;
    the human reads every diff, holds the map, and admits the change. Step two QA: delegated is generation
    plus a second agent's audit; the environment carries a probabilistic, episodic, advisory reviewer; the
    human adjudicates findings. Step three Review lead: delegated is specialized review per region; the
    environment carries deterministic checks for the decidable findings; the human does the semantic review
    a check cannot settle. Step four Tech lead: delegated is bounded work inside one modeled zone; the
    environment carries named zones and boundary rules; the human holds the system map and strategy. Step
    five Architect: delegated is model-guided work across the whole system; the environment carries explicit
    models, traceability, and controls; the human is left with residual semantics and strategy. A failure in
    representation or enforcement can push work back down the staircase.</desc>
