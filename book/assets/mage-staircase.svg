<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored SVG (CE5 redraw of label: mage-staircase). Fold-target: book/assets/mage-staircase.svg.
     REDESIGN of the delegation staircase. The prior figure asked the reader to solve three competing
     encodings at once (five full-width cards x three text columns x variable red mini-bars x two arrows).
     This redraw carries ONE primary claim with a true ascending staircase and three colour channels only:
       BLUE (#2f5169)  = delegated work        — the climbing step cards
       GREEN (#1f7a4d) = accumulated environment — the growing left-edge gauge + the "environment" line
       RED  (#b23b3b)  = residual human burden  — a single narrowing right-edge trajectory (no per-row bars)
     The staircase geometry itself carries "delegation climbs" (no separate blue arrow). The green left-edge
     bars thicken as the climb proceeds (representation + authority accumulate); the red right-edge wedge
     narrows to a sliver (human tactical burden shrinks but never vanishes). A miss in representation or
     authority can push work back down.
     Palette: Umber Monograph tokens, all on design_tokens.svg_palette() allow-list — fleet/agent #2f5169
     (delegated), governed/modeling #1f7a4d (environment), churn/failure #b23b3b + fill #fbeaea (human
     remainder), governed-fill #e3f0e7 (environment wash), ink #1c1917, muted #57534e, rule #e4e0d8.
     Font Source Sans 3. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 830" width="1340" height="830"
     role="group" aria-labelledby="dsTitle dsDesc"
     font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="dsTitle">The delegation staircase — five ascending steps from Co-coder to Architect; delegated work climbs, the engineered environment accumulates, and residual human burden narrows but never vanishes</title>
  <desc id="dsDesc">A true staircase of five steps ascending from bottom-left to top-right. Step one at the
    bottom is Co-coder; step five at the summit is Architect. Each step card names a stage and shows, in
    blue, what is now delegated, and in green, what the engineered environment now carries. Along the
    left edge a green gauge thickens as the climb proceeds — representation and authority accumulate.
    Along the right edge a red trajectory narrows from wide at the base to a sliver at the summit: the
    residual human focus moves from reading every diff at the bottom to system-level strategy and residual
    semantic judgment at the top — the tactical burden shrinks but never reaches zero. Step one Co-coder:
    delegated is code generation; the environment carries nothing durable beyond an ordinary repository;
    the human reads every diff, holds the map, and admits the change. Step two QA: delegated is generation
    plus a second agent's audit; the environment carries a probabilistic, episodic, advisory reviewer; the
    human adjudicates findings. Step three Review lead: delegated is specialized review per region; the
    environment carries deterministic checks for the decidable findings; the human does the semantic review
    a check cannot settle. Step four Tech lead: delegated is bounded work inside one modeled zone; the
    environment carries named zones and boundary rules; the human holds the system map and strategy. Step
    five Architect: delegated is model-guided work across the whole system; the environment carries explicit
    models, traceability, and controls; the human is left with residual semantics and strategy. A failure in
    representation or authority can push work back down the staircase.</desc>

  <defs>
    <marker id="ds-up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,10 L5,0 L10,10 z" fill="#57534e"/>
    </marker>
    <marker id="ds-down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L5,10 L10,0 z" fill="#b23b3b"/>
    </marker>
  </defs>

  <!-- ===================== HUMAN FOCUS — the summit the climb points toward ===================== -->
  <text x="1052" y="30" text-anchor="middle" font-size="24" font-weight="700" fill="#57534e" letter-spacing="0.5">HUMAN FOCUS</text>
  <text x="1052" y="49" text-anchor="middle" font-size="24" fill="#57534e">strategy · residual semantics</text>
  <line x1="1052" y1="60" x2="1052" y2="96" stroke="#57534e" stroke-width="1.6" marker-end="url(#ds-up)"/>

  <!-- ===================== GREEN environment-accumulation wash (upper-left staircase region) ===================== -->
  <!-- The area the steps recede from as they indent rightward: the environment mass the climb is built on.
       Wide at the summit (most accumulated), thin at the base. Light backdrop, low visual weight. -->
  <polygon points="40,58 360,58 360,178 280,178 280,316 200,316 200,454 120,454 120,592 40,592"
           fill="#e3f0e7" opacity="0.55"/>
  <text x="52" y="88" font-size="24" font-weight="700" fill="#1f7a4d">environment accumulates</text>
  <text x="52" y="107" font-size="24" fill="#1f7a4d">representation + authority</text>

  <!-- ===================== RED residual-human wedge (right edge) — one narrowing trajectory ===================== -->
  <!-- A single wedge: wide at the base (human carries everything), a sliver at the summit. NOT a per-row bar. -->
  <polygon points="930,730 956,730 947,58 945,58" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.1" opacity="0.95"/>
  <text x="1190" y="762" text-anchor="end" font-size="24" font-style="italic" fill="#b23b3b">residual human judgment narrows — never zero</text>

  <!-- ===================== STEP 5 · ARCHITECT (summit) ===================== -->
  <rect x="299.71" y="58" width="690.58" height="120" rx="9" fill="#ffffff" stroke="#2f5169" stroke-width="1.8"/>
  <rect x="356" y="58" width="22" height="120" rx="4" fill="#1f7a4d"/>
  <text x="384" y="88" font-size="24" font-weight="700" fill="#1c1917">5 · ARCHITECT</text>
  <text x="384" y="109" font-size="24" font-style="italic" fill="#57534e">explicit models carry system-level knowledge</text>
  <text x="384" y="134" font-size="24" fill="#2f5169" font-weight="600">delegated — model-guided work across the system</text>
  <text x="384" y="156" font-size="24" fill="#1f7a4d" font-weight="600">environment — explicit models · traceability · controls</text>
  <text x="960" y="124" font-size="24" fill="#b23b3b" font-weight="600">residual semantics + strategy</text>

  <!-- ===================== STEP 4 · TECH LEAD ===================== -->
  <rect x="280" y="196" width="650" height="120" rx="9" fill="#ffffff" stroke="#2f5169" stroke-width="1.8"/>
  <rect x="278" y="196" width="18" height="120" rx="4" fill="#1f7a4d"/>
  <text x="304" y="226" font-size="24" font-weight="700" fill="#1c1917">4 · TECH LEAD</text>
  <text x="304" y="247" font-size="24" font-style="italic" fill="#57534e">representation makes reasoning local</text>
  <text x="304" y="272" font-size="24" fill="#2f5169" font-weight="600">delegated — bounded work inside one modeled zone</text>
  <text x="304" y="294" font-size="24" fill="#1f7a4d" font-weight="600">environment — named zones · boundary rules</text>
  <text x="960" y="262" font-size="24" fill="#b23b3b" font-weight="600">system map + strategy</text>

  <!-- ===================== STEP 3 · REVIEW LEAD ===================== -->
  <rect x="167.49" y="334" width="795.02" height="120" rx="9" fill="#ffffff" stroke="#2f5169" stroke-width="1.8"/>
  <rect x="198" y="334" width="14" height="120" rx="4" fill="#1f7a4d"/>
  <text x="224" y="364" font-size="24" font-weight="700" fill="#1c1917">3 · REVIEW LEAD</text>
  <text x="224" y="385" font-size="24" font-style="italic" fill="#57534e">semantic residue after deterministic checks</text>
  <text x="224" y="410" font-size="24" fill="#2f5169" font-weight="600">delegated — specialized review, per region</text>
  <text x="224" y="432" font-size="24" fill="#1f7a4d" font-weight="600">environment — deterministic checks for the decidable findings</text>
  <text x="960" y="400" font-size="24" fill="#b23b3b" font-weight="600">semantic review</text>

  <!-- ===================== STEP 2 · QA ===================== -->
  <rect x="120" y="472" width="810" height="120" rx="9" fill="#ffffff" stroke="#2f5169" stroke-width="1.8"/>
  <rect x="118" y="472" width="10" height="120" rx="4" fill="#1f7a4d"/>
  <text x="144" y="502" font-size="24" font-weight="700" fill="#1c1917">2 · QA</text>
  <text x="144" y="523" font-size="24" font-style="italic" fill="#57534e">evaluation delegated before authority</text>
  <text x="144" y="548" font-size="24" fill="#2f5169" font-weight="600">delegated — generation + a second agent's audit</text>
  <text x="144" y="570" font-size="24" fill="#1f7a4d" font-weight="600">environment — a probabilistic reviewer (episodic, advisory)</text>
  <text x="960" y="538" font-size="24" fill="#b23b3b" font-weight="600">adjudicate findings</text>

  <!-- ===================== STEP 1 · CO-CODER (base) ===================== -->
  <rect x="40" y="610" width="890" height="120" rx="9" fill="#ffffff" stroke="#2f5169" stroke-width="1.8"/>
  <rect x="38" y="610" width="6" height="120" rx="3" fill="#1f7a4d"/>
  <text x="64" y="640" font-size="24" font-weight="700" fill="#1c1917">1 · CO-CODER</text>
  <text x="64" y="661" font-size="24" font-style="italic" fill="#57534e">direct human inspection carries everything</text>
  <text x="64" y="686" font-size="24" fill="#2f5169" font-weight="600">delegated — code generation</text>
  <text x="64" y="708" font-size="24" fill="#1f7a4d" font-weight="600">environment — nothing durable beyond an ordinary repository</text>
  <text x="960" y="670" font-size="24" fill="#b23b3b" font-weight="600">read every diff · hold the</text>
  <text x="960" y="688" font-size="24" fill="#b23b3b" font-weight="600">map · admit the change</text>

  <!-- ===================== BASE AXIS — more work carried by the engineered environment ===================== -->
  <marker id="ds-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2f5169"/>
  </marker>
  <line x1="40" y1="770" x2="928" y2="770" stroke="#2f5169" stroke-width="1.8" marker-end="url(#ds-right)"/>
  <text x="40" y="794" font-size="24" font-weight="600" fill="#57534e">more work carried by the engineered environment</text>
  <text x="928" y="794" text-anchor="end" font-size="24" font-weight="700" fill="#2f5169">delegation climbs</text>
</svg>
