<?xml version="1.0" encoding="UTF-8"?>
<!-- Chapter 2 decision-family figure — entitlement model evolution, told model -> model (gc-ch2-revision
     260922). Job: LOSS of a distinction vs PRESERVATION of a distinction, chronologically: (1) original
     scalar model, adequate while every entitlement is finite; (2) the system evolves — unlimited groups
     arrive; (3) the stale admission model discards the new distinction, an unlimited user reads as 0
     credits and is rejected; (4) the revised decision model preserves finite vs unlimited and states the
     admission decision explicitly. NOT repository architecture. Grammar: blue #2f5169 = model; rust
     #9a3f12 = the discarded distinction / wrong verdict; green = decision family / correct verdict.
     Evidence: R2-response-B item 5 (verbatim old fragment, live old-vs-new decision demo). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" role="img" aria-labelledby="entEvoT entEvoD" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="entEvoT">Entitlement model evolution: the original scalar model, the domain change, the stale reduction that lost the unlimited distinction, and the revised decision model that preserves it</title>
  <desc id="entEvoD">Four panels in chronological order. Panel 1, original model: group credits reduce to a credit sum, compared as credits at least pages, adequate while every entitlement is finite. Panel 2, the system evolves: a group is now finite or unlimited. Panel 3, stale admission model: groups reduce to a sum of finite credits that excludes unlimited groups, an unlimited user becomes zero credits, zero less than thirty-eight rejects the upload; the unlimited distinction has no representation. Panel 4, revised model: group entitlements keep finite and unlimited distinct and feed an admission decision recording admit, authorizing group, and plan; the same user now reads admit by unlimited entitlement.</desc>
  <defs>
    <marker id="entEvo-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#1c1917"/></marker>
    <marker id="entEvo-ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/></marker>
    <marker id="entEvo-ah-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#9a3f12"/></marker>
    <marker id="entEvo-ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#155c38"/></marker>
    <marker id="entEvo-ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#57534e"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="720" fill="#fdfcf9"/>
  <text x="520" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1917">The repair was model &#8594; model — a distinction lost, then preserved</text>

  <!-- panel frames -->
  <rect x="30"  y="70"  width="470" height="280" rx="12" fill="none" stroke="#e4e0d8" stroke-width="2"/>
  <rect x="540" y="70"  width="470" height="280" rx="12" fill="none" stroke="#e4e0d8" stroke-width="2"/>
  <rect x="30"  y="390" width="470" height="310" rx="12" fill="none" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="540" y="390" width="470" height="310" rx="12" fill="none" stroke="#155c38" stroke-width="2.4"/>

  <!-- ============ Panel 1: ORIGINAL MODEL ============ -->
  <circle cx="58" cy="98" r="15" fill="#2f5169"/><text x="58" y="104" text-anchor="middle" font-size="17" font-weight="700" fill="#fdfcf9">1</text>
  <text x="84" y="105" font-size="20" font-weight="700" fill="#1c1917">ORIGINAL MODEL</text>
  <text x="84" y="129" font-size="17" font-style="italic" fill="#57534e">every entitlement is finite</text>
  <rect x="70" y="150" width="200" height="50" rx="9" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
  <text x="170" y="181" text-anchor="middle" font-size="19" fill="#1c1917">Group — credits: int</text>
  <line x1="170" y1="200" x2="170" y2="232" stroke="#2f5169" stroke-width="2" marker-end="url(#entEvo-ah-blue)"/>
  <rect x="80" y="236" width="180" height="46" rx="9" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
  <text x="170" y="265" text-anchor="middle" font-size="19" fill="#1c1917">&#931; credits</text>
  <line x1="260" y1="259" x2="308" y2="259" stroke="#2f5169" stroke-width="2" marker-end="url(#entEvo-ah-blue)"/>
  <rect x="312" y="236" width="168" height="46" rx="9" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
  <text x="396" y="265" text-anchor="middle" font-size="19" fill="#1c1917">credits &#8805; pages?</text>
  <text x="275" y="322" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">an adequate reduction — for this domain</text>

  <!-- ============ Panel 2: THE SYSTEM EVOLVES ============ -->
  <circle cx="568" cy="98" r="15" fill="#1f7a4d"/><text x="568" y="104" text-anchor="middle" font-size="17" font-weight="700" fill="#fdfcf9">2</text>
  <text x="594" y="105" font-size="20" font-weight="700" fill="#1c1917">THE SYSTEM EVOLVES</text>
  <text x="594" y="129" font-size="17" font-style="italic" fill="#57534e">unlimited entitlement is introduced</text>
  <rect x="640" y="150" width="180" height="50" rx="9" fill="#fdfcf9" stroke="#1c1917" stroke-width="2"/>
  <text x="730" y="181" text-anchor="middle" font-size="19" fill="#1c1917">Group</text>
  <line x1="690" y1="200" x2="640" y2="238" stroke="#1c1917" stroke-width="2" marker-end="url(#entEvo-ah)"/>
  <line x1="770" y1="200" x2="820" y2="238" stroke="#1c1917" stroke-width="2" marker-end="url(#entEvo-ah)"/>
  <rect x="558" y="242" width="176" height="46" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="646" y="271" text-anchor="middle" font-size="19" fill="#1c1917">finite(credits)</text>
  <rect x="754" y="242" width="176" height="46" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="842" y="271" text-anchor="middle" font-size="19" font-weight="700" fill="#155c38">unlimited</text>
  <text x="775" y="322" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">the entitlement state space has grown</text>

  <!-- chronology arrows between panels -->
  <line x1="500" y1="210" x2="536" y2="210" stroke="#57534e" stroke-width="2.4" marker-end="url(#entEvo-ah-muted)"/>
  <path d="M 775 350 C 775 372, 265 368, 265 386" fill="none" stroke="#57534e" stroke-width="2.4" marker-end="url(#entEvo-ah-muted)"/>
  <line x1="500" y1="545" x2="536" y2="545" stroke="#57534e" stroke-width="2.4" marker-end="url(#entEvo-ah-muted)"/>

  <!-- ============ Panel 3: STALE ADMISSION MODEL ============ -->
  <circle cx="58" cy="418" r="15" fill="#9a3f12"/><text x="58" y="424" text-anchor="middle" font-size="17" font-weight="700" fill="#fdfcf9">3</text>
  <text x="84" y="425" font-size="20" font-weight="700" fill="#9a3f12">STALE ADMISSION MODEL</text>
  <text x="84" y="449" font-size="17" font-style="italic" fill="#57534e">one representation does not evolve</text>
  <rect x="60" y="470" width="150" height="46" rx="9" fill="#fdfcf9" stroke="#1c1917" stroke-width="2"/>
  <text x="135" y="499" text-anchor="middle" font-size="19" fill="#1c1917">groups</text>
  <line x1="210" y1="493" x2="252" y2="493" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#entEvo-ah-rust)"/>
  <rect x="256" y="470" width="224" height="46" rx="9" fill="#f6e8e0" stroke="#9a3f12" stroke-width="2"/>
  <text x="368" y="499" text-anchor="middle" font-size="19" fill="#1c1917">&#931; finite credits only</text>
  <text x="368" y="545" text-anchor="middle" font-size="17" font-style="italic" fill="#9a3f12">&#8220;unlimited&#8221; has no representation —</text>
  <text x="368" y="567" text-anchor="middle" font-size="17" font-style="italic" fill="#9a3f12">the distinction is discarded here</text>
  <line x1="368" y1="516" x2="368" y2="525" stroke="#9a3f12" stroke-width="2.2"/>
  <rect x="90" y="600" width="120" height="44" rx="9" fill="#f6e8e0" stroke="#9a3f12" stroke-width="2"/>
  <text x="150" y="628" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">0 credits</text>
  <line x1="135" y1="516" x2="135" y2="596" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#entEvo-ah-rust)"/>
  <text x="127" y="562" text-anchor="end" font-size="17" font-style="italic" fill="#57534e">unlimited user</text>
  <line x1="210" y1="622" x2="252" y2="622" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#entEvo-ah-rust)"/>
  <rect x="256" y="600" width="120" height="44" rx="9" fill="#f6e8e0" stroke="#9a3f12" stroke-width="2"/>
  <text x="316" y="628" text-anchor="middle" font-size="19" fill="#1c1917">0 &lt; 38</text>
  <line x1="376" y1="622" x2="414" y2="622" stroke="#9a3f12" stroke-width="2.2" marker-end="url(#entEvo-ah-rust)"/>
  <rect x="418" y="600" width="78" height="44" rx="9" fill="#9a3f12"/>
  <text x="457" y="628" text-anchor="middle" font-size="17" font-weight="700" fill="#fdfcf9">REJECT</text>
  <text x="265" y="682" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">the server&#8217;s correct admission logic is never reached</text>

  <!-- ============ Panel 4: REVISED MODEL ============ -->
  <circle cx="568" cy="418" r="15" fill="#155c38"/><text x="568" y="424" text-anchor="middle" font-size="17" font-weight="700" fill="#fdfcf9">4</text>
  <text x="594" y="425" font-size="20" font-weight="700" fill="#155c38">REVISED MODEL</text>
  <text x="594" y="449" font-size="17" font-style="italic" fill="#57534e">the distinction survives the reduction</text>
  <rect x="560" y="470" width="220" height="66" rx="9" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
  <text x="670" y="496" text-anchor="middle" font-size="19" fill="#1c1917">group entitlements</text>
  <text x="670" y="521" text-anchor="middle" font-size="17" font-style="italic" fill="#155c38">finite | unlimited</text>
  <line x1="780" y1="503" x2="822" y2="503" stroke="#155c38" stroke-width="2.2" marker-end="url(#entEvo-ah-green)"/>
  <rect x="826" y="470" width="164" height="66" rx="9" fill="#e8eef3" stroke="#2f5169" stroke-width="2.2"/>
  <text x="908" y="496" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">admission</text>
  <text x="908" y="521" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1917">decision</text>
  <line x1="908" y1="536" x2="908" y2="568" stroke="#2f5169" stroke-width="2" marker-end="url(#entEvo-ah-blue)"/>
  <rect x="806" y="572" width="204" height="86" rx="9" fill="#fdfcf9" stroke="#2f5169" stroke-width="1.8"/>
  <text x="908" y="596" text-anchor="middle" font-size="17" fill="#1c1917">admit?</text>
  <text x="908" y="619" text-anchor="middle" font-size="17" fill="#1c1917">authorizing group</text>
  <text x="908" y="642" text-anchor="middle" font-size="17" fill="#1c1917">ordered plan</text>
  <line x1="670" y1="536" x2="670" y2="596" stroke="#155c38" stroke-width="2.2" marker-end="url(#entEvo-ah-green)"/>
  <text x="662" y="568" text-anchor="end" font-size="17" font-style="italic" fill="#57534e">same user</text>
  <rect x="576" y="600" width="188" height="44" rx="9" fill="#155c38"/>
  <text x="670" y="628" text-anchor="middle" font-size="17" font-weight="700" fill="#fdfcf9">admit_unlimited</text>
  <text x="775" y="682" text-anchor="middle" font-size="17" font-style="italic" fill="#57534e">the implementation now consumes the model</text>
</svg>
