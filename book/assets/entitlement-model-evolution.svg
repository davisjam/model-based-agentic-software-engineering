<?xml version="1.0" encoding="UTF-8"?>
<!-- Four numbered explanatory panels, not one runtime pipeline. Retained hand-SVG for paired panel geometry and alignment with native TikZ. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="1043" viewBox="0 0 1064 1043" role="img" aria-labelledby="entT entD" font-family="&apos;Source Sans 3&apos;, Arial, sans-serif">
<title id="entT">From a credit balance to an explicit upload-admission decision</title>
<desc id="entD">Four numbered panels explain a legacy balance check, the addition of unlimited entitlement, the actual client upload-check failure, and the later model. There are no arrows between panels. In panel 3, the server excludes the unlimited group from a finite-credit sum; the client compares zero with thirty-eight while ignoring a separate unlimited signal, then rejects before POST. In panel 4, the same uncapped group feeds an admission decision that admits and a separate display projection that returns an unlimited sentinel. The display value is not an admission input.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10z" fill="#1c1917"/></marker></defs>
<rect width="100%" height="100%" fill="#fdfcf9"/>
<rect x="14" y="14" width="504" height="322" rx="12" fill="none" stroke="#d0ccc5" stroke-width="2"/>
<rect x="546" y="14" width="504" height="322" rx="12" fill="none" stroke="#d0ccc5" stroke-width="2"/>
<rect x="14" y="364" width="504" height="665" rx="12" fill="none" stroke="#9a3f12" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="546" y="364" width="504" height="665" rx="12" fill="none" stroke="#155c38" stroke-width="2"/>
<text x="266" y="45.5" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="700" fill="#1c1917">(1) Legacy balance-based check</text>
<text x="266" y="77" text-anchor="middle" dominant-baseline="central" font-size="23" font-style="italic" fill="#1c1917">Only finite credit is represented</text>
<text x="798" y="45.5" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="700" fill="#1c1917">(2) Unlimited groups are added</text>
<text x="798" y="77" text-anchor="middle" dominant-baseline="central" font-size="23" font-style="italic" fill="#1c1917">Entitlement now has two cases</text>
<text x="798" y="255.7" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#1c1917">A finite balance does not</text>
<text x="798" y="283.3" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#1c1917">identify unlimited use.</text>
<text x="266" y="395.5" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="700" fill="#1c1917">(3) Client rejects the upload</text>
<text x="266" y="430.5" text-anchor="middle" dominant-baseline="central" font-size="23" font-style="italic" fill="#1c1917">38-page Office upload</text>
<text x="266" y="980" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#1c1917">Server admission code is never reached.</text>
<text x="798" y="395.5" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="700" fill="#1c1917">(4) Separate admission and display</text>
<text x="798" y="430.5" text-anchor="middle" dominant-baseline="central" font-size="23" font-style="italic" fill="#1c1917">Same group and request; no cap</text>
<text x="798" y="910.2" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#1c1917">Admission uses the decision.</text>
<text x="798" y="937.8" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#1c1917">The display value does not decide permission.</text>
<rect x="63" y="91" width="406" height="49" rx="10" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
<text x="266" y="115.5" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">Finite group balances</text>
<rect x="154" y="175" width="224" height="42" rx="10" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
<text x="266" y="196" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">Sum of balances</text>
<rect x="63" y="248.5" width="406" height="63" rx="10" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
<text x="266" y="265.6" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">Client compares</text>
<text x="266" y="294.4" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">balance with request cost</text>
<rect x="658" y="91" width="280" height="49" rx="10" fill="#fdfcf9" stroke="#1c1917" stroke-width="2"/>
<text x="798" y="115.5" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">Group entitlement</text>
<rect x="577.5" y="168" width="196" height="56" rx="10" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
<text x="675.5" y="196" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">Finite balance</text>
<rect x="822.5" y="168" width="196" height="56" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
<text x="920.5" y="196" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">Unlimited mode</text>
<rect x="63" y="455" width="406" height="77" rx="10" fill="#fdfcf9" stroke="#1c1917" stroke-width="2"/>
<text x="266" y="479.1" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">One unlimited personal group</text>
<text x="266" y="507.9" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">finite balance = 0</text>
<rect x="63" y="563.5" width="406" height="84" rx="10" fill="#f6e8e0" stroke="#9a3f12" stroke-width="2"/>
<text x="266" y="591.1" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">Server sums finite balances</text>
<text x="266" y="619.9" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">and excludes unlimited groups</text>
<rect x="133" y="679" width="266" height="49" rx="10" fill="#f6e8e0" stroke="#9a3f12" stroke-width="2"/>
<text x="266" y="703.5" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">credit_balance = 0</text>
<rect x="63" y="763" width="406" height="84" rx="10" fill="#f6e8e0" stroke="#9a3f12" stroke-width="2"/>
<text x="266" y="790.6" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">Client upload check: 0 &lt; 38</text>
<text x="266" y="819.4" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">ignores separate unlimited signal</text>
<rect x="101.5" y="882" width="329" height="49" rx="10" fill="#9a3f12" stroke="#9a3f12" stroke-width="2"/>
<text x="266" y="906.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="#fdfcf9">REJECT before POST</text>
<rect x="595" y="455" width="406" height="77" rx="10" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2"/>
<text x="798" y="479.1" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">Per-group entitlement</text>
<text x="798" y="507.9" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">unlimited mode; finite balance = 0</text>
<rect x="567" y="588" width="217" height="77" rx="10" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
<text x="675.5" y="612.1" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">Admission rules</text>
<text x="675.5" y="640.9" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">+ upload request</text>
<rect x="812" y="588" width="217" height="77" rx="10" fill="#e8eef3" stroke="#2f5169" stroke-width="2"/>
<text x="920.5" y="612.1" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">Display</text>
<text x="920.5" y="640.9" text-anchor="middle" dominant-baseline="central" font-size="24" fill="#1c1917">projection</text>
<rect x="567" y="705.25" width="217" height="115.5" rx="10" fill="#fdfcf9" stroke="#1c1917" stroke-width="2"/>
<text x="675.5" y="735.4" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#1c1917" font-weight="700">admit = True</text>
<text x="675.5" y="763" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#1c1917">selected group</text>
<text x="675.5" y="790.6" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#1c1917">admit_unlimited</text>
<rect x="812" y="705.25" width="217" height="115.5" rx="10" fill="#fdfcf9" stroke="#1c1917" stroke-width="2"/>
<text x="920.5" y="749.2" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#1c1917">Unlimited sentinel</text>
<text x="920.5" y="776.8" text-anchor="middle" dominant-baseline="central" font-size="23" fill="#1c1917">(display-only)</text>
