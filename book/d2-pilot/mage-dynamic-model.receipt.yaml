prose_claim:            "The theory on one diagram: agentic capacity acts through a governed engineering environment (G) to produce realized performance. A gap between apparent capacity and durable performance registers as governance pressure — churn, recurring failure, escaped defects, repeated intervention, or control friction. Pressure is evidence, not diagnosis; structural diagnosis drives governance adaptation, which reshapes G. A stronger G then supports more ambitious work and exposes a new frontier. Bootstrap supplies known structure before failure occurs. The model is directional, not fitted."
figure_job:             "Shows one system with four named dynamics and marks which are feedback loops (balancing vs reinforcing) versus a one-time input — so the reader sees the goal-seeking damping of churn and the reinforcing frontier-reopening as distinct mechanisms."
visual_proposition:     "Capacity exercises G and drives work; G shapes performance; work/performance mismatch becomes governance pressure -> diagnosis -> adaptation, which loops back to G seeking better fit (balancing); a stronger G amplifies capacity (reinforcing); prior knowledge is a one-time bootstrap seed."
required_vocabulary:    "Agentic capacity · Governed environment G · Agentic work · Realized performance · Governance pressure · Structural diagnosis · Governance adaptation · Prior engineering knowledge · bootstrap · balancing · reinforcing · capability amplification"
topology:               "Directed causal graph with two genuine feedback loops (curved back-edges): [B] balancing (adaptation -> G, up the right) and [R] reinforcing (G -> capacity, across the top). Forward causation elsewhere; bootstrap is an input edge, not a loop."
forbidden_implications: "[B] and [R] are FEEDBACK, not forward stages; the numbered edges (1-4) are dynamics, not a strict linear sequence; Prior knowledge is a one-time seed, not part of any loop; pressure is evidence, not the diagnosis."
redundant_visual_copy:  "None removed — the legend (four numbered dynamics + B/R + the 'bootstrap is an input' footnote) is load-bearing and kept in-figure; the manuscript caption states the directional-not-fitted caveat."
source_figure_defects:  none
intentional_changes:    "Numbered edge markers rendered as '1 …'–'4 …' plus '[B]'/'[R]' text (d2/Source Sans has no reliable circled-digit glyph); the legend keeps the same numbering. Purple is inlined for the reinforcing loop (no house purple class). Title kept as a top text node."
d2_limitations:         "dagre lays the graph tall and narrow with the balancing loop occupying a right-side channel, leaving some right whitespace; acceptable for a dynamics model (vertical extent reads as the causal chain), but d2 offers no knob to pull the loop channel tighter. Circled-number glyphs unavailable, so numbers are plain."
