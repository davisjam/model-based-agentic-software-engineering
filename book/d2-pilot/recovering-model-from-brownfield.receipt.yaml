prose_claim:            Brownfield models need not begin with an engineer inventing the abstraction; existing implementation contains repeated structure that a weak detector can surface, but repetition alone does not determine the model -- contextual comparison and engineering judgment propose and test a representation that preserves the relationships needed for later reasoning, and once made explicit the model becomes a reusable reasoning surface.
figure_job:             Traces the induction path from realized code up to a named model, and marks WHERE weak mechanical discovery ends and engineering judgment (propose · compare · revise) begins.
visual_proposition:     A single ascending chain of stages, partitioned by three side-bracketed zones -- mechanical discovery (weak machinery surfaces evidence), engineering judgment (propose · compare · revise), reusable surface (later work reasons through the model).
required_vocabulary:    realized code; repeated low-level forms; candidate regularities; contextual comparison; candidate representation; compare against instances; explicit model / typed vocabulary (JobId · MutationSpec · PdfModel); mechanical discovery; engineering judgment; reusable surface.
topology:               Linear bottom-up-style chain rendered top-to-bottom (8 stages), partitioned into three zones by containment. The zones GROUP consecutive stages; they are not parallel tracks.
forbidden_implications: The chain must stay a single top-to-bottom SEQUENCE -- the three zones group stages, they must not read as parallel tracks or alternatives. Flow edges deliberately cross the zone borders to preserve the one continuous chain.
redundant_visual_copy:  none -- the zone sub-notes (the agent finds it / the engineer names it / reused, not re-derived) are the bracket annotations, retained; no restating prose was carried into the drawing.
source_figure_defects:  none
intentional_changes:    The original's continuous right-side bracket (spanning levels) is realised as three bordered containers with left-aligned zone titles -- d2 has no side-bracket primitive, so the container border IS the bracket. Zone borders coloured to the zone's semantic (grey discovery / rust judgment / blue reusable); inner boxes keep their own semantic fills.
d2_limitations:         d2 has no side-bracket device; the bracket-spanning-levels rhetoric is carried by a bordered container per zone instead. Zone labels moved to top-left so the centred trunk edge does not strike through them. Layout is taller and more vertically-spaced than the hand-SVG (dagre rank separation across containers), but the sequence stays legible.
