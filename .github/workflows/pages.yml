# Build the catalogue site from its markdown and deploy to GitHub Pages.
# Source = "GitHub Actions" (Settings → Pages). Running `catalog.py build` in CI is the
# "executable, can't-drift" build: the deployed HTML is regenerated from the .md on every push.
#
# ── Job graph (parallel fan-out; one serial job until 261006) ──────────────────────────────────
#
#   workbench ──┬────────────────────────────────┐
#               └─► browser-tiers   (gate only)  │
#   site-gates                      (gate only)  ├─► assemble ─► deploy
#   book-editions ───────────────────────────────┤
#   handbook ────────────────────────────────────┤
#   web-editions ────────────────────────────────┘
#
# PRODUCERS (workbench, book-editions, handbook, web-editions) emit files the published artifact
# needs; `assemble` downloads their outputs, re-renders the catalogue HTML from source, hard-asserts
# the artifact's shape, and uploads it. GATE jobs (browser-tiers, site-gates) hold quality lines —
# the browser/smoke/a11y tiers, the full test suite, the responsive + console gates. A red gate job
# turns the RUN red (visible on the commit, alerting) but does not block `deploy`: on 261006 a red
# FR-A11Y tier held llms.txt + robots.txt unpublished though nothing about them was broken, and the
# ruling is that independent failures must not block unrelated publication. What DOES block deploy
# is artifact integrity — a missing bundle, PDF, thumb, or a leaked internal playbook fails
# `assemble`, and nothing ships. The placement rule for a NEW check lives in CLAUDE.md
# § "Where a new check runs". Coverage is unchanged by the fan-out: every gate that ran serially
# still runs, with the same assertions, on every push.
#
# Security posture (see DEVELOP.md § "Security analysis"):
#   - Triggers are trusted-only (push to main / manual dispatch). NO pull_request_target, so no
#     fork/PR can run this with the repo's token ("pwn request" class is designed out).
#   - No untrusted input is interpolated into any `run:` (no script-injection surface).
#   - Permissions are job-scoped: every job that runs third-party test code (axe-core,
#     html-validate, Puppeteer) holds NO deploy/write capability; only the `deploy` job gets
#     `pages: write` + `id-token: write`.
#   - Third-party test tooling is pinned: `npm ci` installs the exact tree in package-lock.json
#     (integrity-hash verified) — per directory, each against its own committed lockfile; axe +
#     html-validate run via `npx --no-install` so they never fetch at run time.
#   - Every action is pinned to an immutable commit SHA (a tag like `v4` is movable; a SHA is not).
#   - Inter-job artifacts (the workbench bundle, the rendered PDFs, the MkDocs trees) travel via
#     actions/upload-artifact / download-artifact, same-run only; caches hold only derived,
#     content-addressed state (npm tarballs, the Puppeteer Chromium, the mermaid SVG render cache).
#   - The published artifact excludes `.git`, `node_modules`, and `.github` (nothing secret on a
#     public repo, but it keeps the deploy tree minimal and avoids serving node_modules).
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default (inherited) permissions: read-only. Each job narrows/adds from here.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Model Workbench: node-tier gates + the published bundle (PRODUCER) ──────────────────────
  # Until 261005 the workbench's gates ran ONLY in the pre-push hook — i.e. only on the author's
  # laptop, and that hook SKIPS the TypeScript gates outright when the shell's Node is older than
  # 22. A type error or a failing unit test could reach main unseen. They run here unconditionally,
  # and they run BEFORE the bundle build: a type error is a sharper, more localized signal than a
  # bundler error, so fail on it first.
  #
  # Node comes from .nvmrc — the single source of truth the developer's `nvm use` reads too. No
  # second version is named here; a second copy is a drift source.
  #
  # The bundle is build-derived and gitignored, so a fresh checkout has no workbench/dist/. It is
  # built here and uploaded as the `workbench-dist` artifact: `assemble` rsyncs it into _site/ and
  # the browser tiers serve it to a real Chromium. It is asserted non-trivial rather than merely
  # present, because the failure mode is silent: the shell returns 200 with an empty body and a 404
  # in the console. esbuild bundles the whole engine, so the real artifact is ~400 KB; 50 KB is a
  # floor that an empty or truncated emit cannot clear while leaving room for the bundle to shrink
  # legitimately.
  workbench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Single source of truth for the Node version: .nvmrc, which `nvm use` also reads, so CI
          # and a developer's shell cannot drift. package.json `engines` carries the FLOOR (>=22)
          # separately.
          #
          # Why the floor is 22: html-validate 11.x calls fs.globSync, added in Node 22. On Node 20
          # it throws at startup, the T2 validity check catches the throw and SKIPs, and the
          # HTML-validity gate silently does not run while the summary still reads "0 failed". A pin
          # is the only thing standing between that check and a false green.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            book/package-lock.json
            workbench/package-lock.json
      - name: Model Workbench gates + bundle (tsc, unit suite, esbuild -> workbench/dist/)
        working-directory: workbench
        # `validate.py` is the INDEPENDENT second implementation of the rule set, and
        # `test/parity.test.ts` holds the two together by shelling out to it — so the unit suite below
        # has a Python dependency even though it is a Node suite. `pyRun` uses `execFileSync`, which
        # THROWS on a non-zero exit, and validate.py exits 2 with "missing dependency" when PyYAML is
        # absent; there is no skip path, by design. A parity suite that silently skipped when its
        # second implementation could not start would report green while checking nothing, which is
        # worse than a red build.
        #
        # The pip install happens HERE, in the same block, BEFORE the suite that shells out to it:
        # an install in a later step is what broke the 261002 push (`tests/ci.py` holds the ordering).
        run: |
          python3 -m pip install "pyyaml>=6,<7" jsonschema
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
          test -f dist/workbench.js || { echo "ERROR: workbench bundle missing after build"; exit 1; }
          test -f dist/analysis.worker.js || { echo "ERROR: workbench analysis worker bundle missing after build"; exit 1; }
          SIZE=$(wc -c < dist/workbench.js)
          test "$SIZE" -ge 51200 || { echo "ERROR: workbench bundle is $SIZE bytes, under the 51200-byte floor — an empty or truncated emit"; exit 1; }
          echo "workbench bundle: $SIZE bytes"
      # ── UX-I1 as a hard CI failure (requirements-human-ux section 22) ─────────────────────────
      # "CI SHALL fail when a public semantic capability lacks either a human or machine affordance."
      # A separate step from the gates above on purpose. `npm test` already asserts this, but it
      # asserts it among seven hundred other things; a failure HERE names the invariant in the step
      # title and prints the one-sided capabilities, which is what the person reading a red build
      # needs. The threshold is `PARITY_VIOLATION_CEILING` in `workbench/src/app/capabilities.ts`,
      # the verdict is `affordanceParityGate()`, and both this step and the unit suite read it from
      # there. `tests/ci.py` holds the structural half — no step in this workflow may embed a
      # program instead of invoking a named script.
      - name: Model Workbench UX-I1 affordance parity (CI fails on a one-sided capability)
        working-directory: workbench
        run: npm run check:parity
      - name: Upload workbench bundle (consumed by browser-tiers + assemble)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workbench-dist
          path: workbench/dist
          if-no-files-found: error
          retention-days: 3

  # ── Model Workbench browser-facing tiers (GATE — reds the run, does not hold the artifact) ──
  # Every other workbench test is node-tier: the IR, the engine, the validator, the view model,
  # the services facade — all driven directly, none of them loading index.html. These tiers serve
  # workbench/ and drive the real page in headless Chromium: the browser tier (FR-AGENT-1/-2 CDP
  # surface), the smoke tier (both served pages boot, no fallback strings — the only gate that
  # loads learn.html as a page rather than as a module), and the FR-A11Y tier (axe over four page
  # states + section 19's thirteen operations by keyboard + every declared navigation path).
  #
  # Puppeteer + its bundled Chromium are RESOLVED from book/node_modules, never added to
  # workbench/package.json — workbench/node_modules is a symlink shared across parallel agent
  # worktrees, so an install there mutates trees this job does not own. axe-core is RESOLVED from
  # the ROOT node_modules, where it is already pinned for the catalogue's own a11y tier.
  #
  # The tiers serve workbench/, NOT workbench/dist/. dist/ holds bundles only; index.html loads
  # `./dist/workbench.js`, so a page served from inside dist/ resolves that to
  # dist/dist/workbench.js and cannot work. Serving dist/ would gate a page nobody ships.
  #
  # Receipts are hard-asserted because `node --test` over a glob that matches NOTHING exits 0 and
  # prints "pass 0" — a renamed directory would turn a tier into a green gate that launched no
  # browser. Each suite writes its receipt only after a browser booted and the page loaded, and the
  # receipt carries what the run measured, so the log publishes the numbers rather than asserting
  # them blind.
  #
  # One a11y probe (wcag-f6) reproduces its CI failure locally only under WB_F6_SIMULATE_CI_FONTS=1
  # — the runner's font stack differs from a developer's, and this tier's verdict under the
  # RUNNER's fonts is the authoritative one. That environment sensitivity is why these tiers live
  # in CI and not in the pre-push hook's unconditional set (CLAUDE.md § "Where a new check runs").
  browser-tiers:
    needs: workbench
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            book/package-lock.json
            workbench/package-lock.json
      - name: Restore Puppeteer Chromium (book/ lockfile keys the browser build)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('book/package-lock.json') }}
      - name: Install pinned test tooling (root axe-core + book Puppeteer + workbench dev deps)
        run: |
          npm ci
          npm ci --prefix book
          npm ci --prefix workbench
      - name: Download workbench bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workbench-dist
          path: workbench/dist
      - name: Model Workbench browser tier (headless Chromium over the served page) + receipt assertions
        # Bounded: a wedged tier used to hold this job to the 6-hour default, publishing nothing
        # and reporting nothing (261006, run 37504307305). The tier bounds itself first — the
        # harness leak watchdog and --test-timeout fail fast WITH a diagnosis — this is the outer
        # belt for wedge classes those cannot see. Normal duration is well under a minute.
        timeout-minutes: 15
        working-directory: workbench
        env:
          WB_BROWSER_RECEIPT: ${{ runner.temp }}/wb-browser-receipt.json
          WB_ATTACH_RECEIPT: ${{ runner.temp }}/wb-attach-receipt.json
          WB_AGENT_COVERAGE_RECEIPT: ${{ runner.temp }}/wb-agent-coverage-receipt.json
        run: |
          test -f dist/workbench.js || { echo "ERROR: workbench bundle missing — the browser tier would serve a page with no app"; exit 1; }
          rm -f "$WB_BROWSER_RECEIPT" "$WB_ATTACH_RECEIPT" "$WB_AGENT_COVERAGE_RECEIPT"
          npm run test:browser
          test -s "$WB_BROWSER_RECEIPT" || { echo "ERROR: browser tier wrote no receipt — no browser was launched (a glob that matches no test file exits 0)"; exit 1; }
          test -s "$WB_ATTACH_RECEIPT" || { echo "ERROR: the CDP attach tier wrote no receipt — no client attached to a browser it did not create"; exit 1; }
          test -s "$WB_AGENT_COVERAGE_RECEIPT" || { echo "ERROR: the agent-coverage gate wrote no receipt — no browser drove a capability (a glob that matches no test file exits 0)"; exit 1; }
          cat "$WB_BROWSER_RECEIPT"
          cat "$WB_ATTACH_RECEIPT"
          cat "$WB_AGENT_COVERAGE_RECEIPT"
          node -e '
            const { readFileSync } = require("node:fs");
            let bad = 0;
            const fail = (m) => { console.error("ERROR: " + m); bad += 1; };
            const cov = JSON.parse(readFileSync(process.env.WB_AGENT_COVERAGE_RECEIPT, "utf8"));
            for (const axis of ["operations", "callables"]) {
              const a = cov[axis];
              if (a === undefined) { fail(`the coverage receipt carries no ${axis} block — the test that measures that axis never reached its readout`); continue; }
              const nums = [a.described, a.covered, a.exempt];
              if (!nums.every(Number.isInteger)) { fail(`${axis}: described/driven/exempt are not all numbers (${JSON.stringify(nums)}) — the receipt shape changed and this gate is reading fields that no longer exist`); continue; }
              if (a.described === 0) fail(`${axis}: described 0 — a denominator of zero makes the coverage claim vacuous`);
              if (a.covered + a.exempt < a.described) fail(`${axis}: described ${a.described}, driven ${a.covered}, exempt ${a.exempt} — ${a.described - a.covered - a.exempt} neither driven nor exempted`);
              console.log(`FR-AGENT coverage — ${axis} described ${a.described}, driven ${a.covered}, exempt ${a.exempt}`);
            }
            const att = JSON.parse(readFileSync(process.env.WB_ATTACH_RECEIPT, "utf8"));
            if (!Number.isInteger(att.attachedClients) || att.attachedClients < 2) fail(`the attach receipt reports ${att.attachedClients} attached client(s) — two independent clients on a browser neither of them created is what this tier measures`);
            if (!Number.isInteger(att.loadedCounts?.entities) || att.loadedCounts.entities === 0) fail(`the attach receipt reports ${att.loadedCounts?.entities} entities loaded — the attached client read an empty system, so the two-client claim was measured over nothing`);
            else console.log(`CDP attach — ${att.attachedClients} clients, ${att.loadedCounts.entities} entities loaded, agent to human ${att.agentToHuman?.entitiesBefore}/${att.agentToHuman?.entitiesAfter}, human to agent ${att.humanToAgent?.entitiesBefore}/${att.humanToAgent?.entitiesAfter}`);
            process.exit(bad === 0 ? 0 : 1);
          '
      # The smoke tier covers BOTH served pages — index.html and learn.html — as a post-condition:
      # no fallback string appears AND an expected content shape IS present. It is the only gate
      # that looks at learn.html as a page rather than as a module.
      - name: Model Workbench smoke tier (both served pages boot, no fallback strings)
        timeout-minutes: 10
        working-directory: workbench
        run: |
          test -f dist/workbench.js || { echo "ERROR: workbench bundle missing — the smoke tier would load a page with no app"; exit 1; }
          test -f dist/learn.js || { echo "ERROR: learn bundle missing — the smoke tier would load a gallery with no app"; exit 1; }
          npm run test:smoke
      # THREE receipts, and the third is the one whose absence would be least visible. Its suite
      # GENERATES a drive per declared navigation path, so a registry that lost its `path` fields
      # produces a file of zero tests — and `node --test` prints a green tier for that. The receipt
      # carries the walked count; the suite asserts it against the registry's own arithmetic. G1's
      # ruling is the reason it is not optional: a declared path that nothing walks is a sentence an
      # author wrote.
      - name: Model Workbench FR-A11Y tier (axe-core over four states + section 19 by keyboard + every declared path) + receipt assertions
        timeout-minutes: 15
        working-directory: workbench
        env:
          WB_AXE_RECEIPT: ${{ runner.temp }}/wb-axe-receipt.json
          WB_KEYBOARD_RECEIPT: ${{ runner.temp }}/wb-keyboard-receipt.json
          WB_PATHS_RECEIPT: ${{ runner.temp }}/wb-paths-receipt.json
        run: |
          test -f dist/workbench.js || { echo "ERROR: workbench bundle missing — the FR-A11Y tier would audit a page with no app"; exit 1; }
          test -f ../node_modules/axe-core/axe.min.js || { echo "ERROR: axe-core missing from the root node_modules — the root 'npm ci' step must run before this one"; exit 1; }
          rm -f "$WB_AXE_RECEIPT" "$WB_KEYBOARD_RECEIPT" "$WB_PATHS_RECEIPT"
          npm run test:a11y
          test -s "$WB_AXE_RECEIPT" || { echo "ERROR: the axe suite wrote no receipt — no browser audited the page"; exit 1; }
          test -s "$WB_KEYBOARD_RECEIPT" || { echo "ERROR: the keyboard suite wrote no receipt — no browser drove the keyboard"; exit 1; }
          test -s "$WB_PATHS_RECEIPT" || { echo "ERROR: the declared-path suite wrote no receipt — no browser walked a navigation path (a registry with no paths generates zero drives, which node --test reports as green)"; exit 1; }
          cat "$WB_AXE_RECEIPT"
          cat "$WB_KEYBOARD_RECEIPT"
          cat "$WB_PATHS_RECEIPT"

  # ── Catalogue site gates: full suite + responsive + console (GATE) ──────────────────────────
  # The authoritative `catalog_tests.py --full` run (post-push HEAD==origin, so incremental would
  # skip Tier 2), plus the two browser-backed page gates. This job re-renders the site HTML from
  # source first — the suite checks ALREADY-BUILT HTML, so it must check THIS push's render, not
  # the committed HTML a skipped hook may have left stale.
  site-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            book/package-lock.json
      - name: Restore Puppeteer Chromium (book/ lockfile keys the browser build)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('book/package-lock.json') }}
      - name: Restore mermaid SVG render cache (content-addressed; stale entries never hit)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: book/.mermaid-svg-cache
          key: mermaid-svg-${{ github.sha }}
          restore-keys: mermaid-svg-
      - name: Install pinned test tooling (root axe + html-validate; book mermaid-cli + Puppeteer)
        run: |
          npm ci
          npm ci --prefix book
      - name: Install Typst (pinned release; renders citations + the cover thumbs)
        run: |
          TYPST_VERSION=v0.15.1
          # --retry + --retry-all-errors: the release-asset CDN occasionally returns a transient 5xx
          # (e.g. a 504 Gateway Timeout); retry so one flake does not fail the whole run.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          mkdir -p /tmp/typst && tar -xJf /tmp/typst.tar.xz -C /tmp/typst --strip-components=1
          sudo install -m 0755 /tmp/typst/typst /usr/local/bin/typst
          typst --version
      # Render the Chicago citation strings from references.bib (the SSOT) before the build that
      # reads them; derive the landing cover thumbnails (gitignored, build-derived) before the
      # console gate that fetches them as a subresource.
      - name: Render citations + derive cover thumbnails (before their consumers)
        run: |
          python3 -m pip install -r book/requirements-pdf.txt
          python3 -m pip install "pyyaml>=6,<7"
          python3 book/render_citations.py
          python3 tools/cover_assets.py regen
      - name: Validate schema
        run: python3 catalog.py validate
      - name: Render markdown -> HTML (renders ```mermaid fences to inline SVG via book/ mmdc)
        run: python3 catalog.py build
      - name: Test suite (authoritative --full run; post-push HEAD==origin, so incremental would skip Tier 2)
        run: python3 catalog_tests.py --full
      # Assert the landing `.masonry` region renders a structurally different layout at wide vs
      # phone width (>= 3 columns at 2560px, exactly 1 column at 390px) — the author's success
      # metric made mechanical. Needs a browser (headless Chrome), so it can't live in stdlib-only
      # `catalog.py validate`; it reuses the book/ Puppeteer + bundled Chromium installed above.
      - name: Responsive-layout gate (landing wide != phone)
        run: python3 catalog.py check-responsive
      # Load EVERY served HTML page in headless Chrome and fail on any pageerror (uncaught
      # exception / unhandled rejection) or console.error — catches JS-runtime defects
      # (script-ordering races like an iframe onload firing before its handler is defined, failed
      # fetches, missing subresources) that the structural gates (validate / axe / html-validate)
      # cannot see.
      - name: Console-error gate (no pageerror / console.error on any served page)
        run: python3 catalog.py check-console

  # ── Book print + ePub editions (PRODUCER) ───────────────────────────────────────────────────
  # The book PDF is a CI-generated, Pages-published artifact (not committed). `--pdf` projects the
  # typed book IR to a Typst document and runs `typst compile` to book/mage-book.pdf. It runs the
  # content-integrity gate internally — page floor/ceiling, every chapter + part title present,
  # no-raw-mermaid, density, and a tag-tree assertion — and exits non-zero (failing the build) if
  # the render is truncated / collapsed / runaway / ships raw diagram source / drops the a11y tag
  # tree. poppler (pdftotext / pdfinfo) backs those gates. qpdf runs a lossless object-stream
  # repack after `typst compile` (Typst emits ~20K uncompressed indirect objects; the repack cuts
  # the whole-book PDF by ~35% with the tag tree preserved).
  #
  # `--no-split`: the published site ships only the whole-book mage-book.pdf. `--pdf` is
  # default-on-split LOCALLY (per-section review PDFs); `--no-split` states full-only explicitly at
  # the call site so CI never pays the per-section compile cost.
  #
  # The ePub (book_epub.py — the 4th IR projection, EPUB3) reuses build_pages()' rendered bodies
  # (no re-render), packs the EPUB3 container, and renders the TITLED cover from the print
  # edition's own Typst cover page — so it runs after the Typst + requirements-pdf installs
  # (Typst compiles the cover; Pillow recompresses it).
  book-editions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: book/package-lock.json
      - name: Restore Puppeteer Chromium (book/ lockfile keys the browser build)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('book/package-lock.json') }}
      - name: Restore mermaid SVG render cache (content-addressed; stale entries never hit)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: book/.mermaid-svg-cache
          key: mermaid-svg-book-${{ github.sha }}
          restore-keys: mermaid-svg-
      - name: Install book node tooling (mermaid-cli for build-time SVG, from book/ lockfile)
        working-directory: book
        run: npm ci
      - name: Install Typst (pinned release; renders citations + the print-native book PDF)
        run: |
          TYPST_VERSION=v0.15.1
          # Same transient-5xx hardening as every pinned-release download in this workflow.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          mkdir -p /tmp/typst && tar -xJf /tmp/typst.tar.xz -C /tmp/typst --strip-components=1
          sudo install -m 0755 /tmp/typst/typst /usr/local/bin/typst
          typst --version
      - name: Install poppler + qpdf (pdftotext / pdfinfo back the content-integrity + tag-tree gates; qpdf does the lossless object-stream repack)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - name: Render citations (references.bib -> citations.json via Typst, chicago-notes)
        run: python3 book/render_citations.py
      - name: Render book PDF (print-native Typst) + content-integrity gate
        run: |
          # The --pdf gate's inset-wrap sensor rasterizes aside pages (pillow + numpy); poppler is
          # already installed above. catalog.py itself stays stdlib-only — these deps are for the
          # --pdf path only.
          python3 -m pip install -r book/requirements-pdf.txt
          python3 -m pip install "pyyaml>=6,<7"
          python3 book/build_book.py --pdf --no-split
      - name: Render book ePub (EPUB3 from the same page records as the web edition)
        run: python3 book/book_epub.py
      - name: Upload book editions (consumed by assemble)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: book-editions
          path: |
            book/*.pdf
            book/*.epub
          if-no-files-found: error
          retention-days: 3

  # ── Supplementary Software Engineering Handbook: PDF + ePub + web site (PRODUCER) ────────────
  # CI-generated, Pages-published artifacts (not committed). `make book` LINTS the manuscript
  # first and aborts on any error (never degrades silently), then renders
  # handbook/dist/software-engineering-handbook.pdf via the Pandoc→AST→Typst pipeline AND the
  # reflowable .epub from the same chapter source, plus the standalone per-chapter PDFs
  # (handbook/dist/chapters/<stem>.pdf). `build.py web` then renders the self-contained MkDocs
  # site (handbook/dist/site). `assemble` downloads handbook/dist and places everything at its
  # published home. (The published subfolder is `se-handbook`; the source tree keeps its
  # `handbook/` name.)
  handbook:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Install Typst (pinned release; the handbook PDF's layout engine)
        run: |
          TYPST_VERSION=v0.15.1
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          mkdir -p /tmp/typst && tar -xJf /tmp/typst.tar.xz -C /tmp/typst --strip-components=1
          sudo install -m 0755 /tmp/typst/typst /usr/local/bin/typst
          typst --version
      # Pandoc reads + AST-transforms + citeproc's the handbook manuscript, then projects to Typst.
      # The pinned release, clone-and-run-safe — NOT an unpinned `apt-get install pandoc`, whose
      # version floats and can silently change the AST the Lua filters see.
      - name: Install Pandoc (pinned release; backs the handbook render)
        run: |
          PANDOC_VERSION=3.9.0.2
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" -o /tmp/pandoc.tar.gz
          mkdir -p /tmp/pandoc && tar -xzf /tmp/pandoc.tar.gz -C /tmp/pandoc --strip-components=1
          sudo install -m 0755 /tmp/pandoc/bin/pandoc /usr/local/bin/pandoc
          pandoc --version
      - name: Render handbook PDF + ePub + per-chapter PDFs (Pandoc → Typst / ePub3)
        run: |
          # The handbook build/lint scripts parse book.yaml with PyYAML (the only third-party
          # Python dep on the PDF path); Pillow (requirements-pdf) backs the cover derivation.
          python3 -m pip install "pyyaml>=6,<7"
          python3 -m pip install -r book/requirements-pdf.txt
          make -C handbook book
          test -f handbook/dist/software-engineering-handbook.pdf || { echo "ERROR: handbook PDF missing after render"; exit 1; }
          test -f handbook/dist/software-engineering-handbook.epub || { echo "ERROR: handbook ePub missing after render"; exit 1; }
      - name: Build handbook web site (MkDocs -> handbook/dist/site)
        run: |
          python3 -m pip install -r site/requirements.txt
          python3 handbook/scripts/build.py web
          test -f handbook/dist/site/index.html || { echo "ERROR: handbook web index missing after build"; exit 1; }
      - name: Upload handbook dist (consumed by assemble)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: handbook-dist
          path: handbook/dist
          if-no-files-found: error
          retention-days: 3

  # ── Teach-with-MAGE course site + MAGE book web edition (PRODUCER) ──────────────────────────
  # Both are MkDocs Material builds on the same pinned toolchain (site/requirements.txt), so they
  # share a job. The teach site builds into _site/teach (served at /teach/); `strict` fails the
  # build on any broken internal link. The MAGE book web edition (the PUBLISHED book since the C3
  # publish swap): book_mkdocs.py runs build_pages() (every content pass) and emits the MkDocs tree
  # consuming the shared web-theme/ shell; `--check-determinism` emits twice and fails on any byte
  # difference. The --strict Material build then renders book/web/site — flat `<slug>.html` stems
  # identical to the retired hand-rolled pages (`use_directory_urls: false`), so every published
  # URL + #anchor is unchanged.
  web-editions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: book/package-lock.json
      - name: Restore Puppeteer Chromium (book/ lockfile keys the browser build)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('book/package-lock.json') }}
      - name: Restore mermaid SVG render cache (content-addressed; stale entries never hit)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: book/.mermaid-svg-cache
          key: mermaid-svg-web-${{ github.sha }}
          restore-keys: mermaid-svg-
      - name: Install book node tooling (mermaid-cli for build_pages' SVG render, from book/ lockfile)
        working-directory: book
        run: npm ci
      - name: Install Typst (pinned release; renders citations + the cover thumbs)
        run: |
          TYPST_VERSION=v0.15.1
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          mkdir -p /tmp/typst && tar -xJf /tmp/typst.tar.xz -C /tmp/typst --strip-components=1
          sudo install -m 0755 /tmp/typst/typst /usr/local/bin/typst
          typst --version
      - name: Render citations + derive cover thumbnails (build_pages + the asset copy consume them)
        run: |
          python3 -m pip install -r book/requirements-pdf.txt
          python3 -m pip install "pyyaml>=6,<7"
          python3 book/render_citations.py
          python3 tools/cover_assets.py regen
      - name: Build Teach-with-MAGE course site (MkDocs → _site/teach)
        run: |
          python3 -m pip install -r site/requirements.txt
          # -d must be ABSOLUTE: mkdocs resolves a relative --site-dir against the CONFIG dir
          # (site/), so a bare `_site/teach` would land in site/_site/teach — which the assemble
          # job's --exclude='site' then drops. $GITHUB_WORKSPACE is the repo root, so /teach ships
          # at _site/teach.
          python3 -m mkdocs build --strict -f site/mkdocs.yml -d "$GITHUB_WORKSPACE/_site/teach"
      - name: Build MAGE book web edition (emit determinism + mkdocs --strict)
        run: |
          python3 book/book_mkdocs.py --check-determinism
          python3 -m mkdocs build --strict -f book/web/mkdocs.yml
      - name: Upload teach site (consumed by assemble)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teach-site
          path: _site/teach
          if-no-files-found: error
          retention-days: 3
      - name: Upload book web site (consumed by assemble)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: book-web-site
          path: book/web/site
          if-no-files-found: error
          retention-days: 3

  # ── Assemble + hard-gate the published artifact (BLOCKS deploy) ─────────────────────────────
  # The one job deploy waits on. It re-renders the catalogue HTML from source (the "executable,
  # can't-drift" build — committed HTML can lag when a commit route skips the pre-commit hook),
  # downloads every producer's output, and asserts the artifact's SHAPE: every published piece
  # present, no internal playbook leaked. These assertions are artifact INTEGRITY — "what we are
  # about to publish is whole" — which is the deploy-blocking class. Behavior/quality verdicts
  # (the gate jobs above) red the run without holding the artifact (CLAUDE.md § "Where a new
  # check runs").
  assemble:
    needs: [workbench, book-editions, handbook, web-editions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: book/package-lock.json
      - name: Restore Puppeteer Chromium (book/ lockfile keys the browser build)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('book/package-lock.json') }}
      - name: Restore mermaid SVG render cache (content-addressed; stale entries never hit)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: book/.mermaid-svg-cache
          key: mermaid-svg-assemble-${{ github.sha }}
          restore-keys: mermaid-svg-
      - name: Install book node tooling (mermaid-cli for the authoritative HTML render)
        working-directory: book
        run: npm ci
      - name: Install Typst (pinned release; renders citations + the cover thumbs)
        run: |
          TYPST_VERSION=v0.15.1
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          mkdir -p /tmp/typst && tar -xJf /tmp/typst.tar.xz -C /tmp/typst --strip-components=1
          sudo install -m 0755 /tmp/typst/typst /usr/local/bin/typst
          typst --version
      - name: Render citations + derive cover thumbnails (the landing + the thumb hard-gates consume them)
        run: |
          python3 -m pip install -r book/requirements-pdf.txt
          python3 -m pip install "pyyaml>=6,<7"
          python3 book/render_citations.py
          python3 tools/cover_assets.py regen
      - name: Validate schema
        run: python3 catalog.py validate
      - name: Render markdown -> HTML (the authoritative render the artifact ships)
        run: python3 catalog.py build
      - name: Download workbench bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workbench-dist
          path: workbench/dist
      - name: Download book editions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: book-editions
          path: book
      - name: Download handbook dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: handbook-dist
          path: handbook/dist
      - name: Download teach site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: teach-site
          path: _site/teach
      - name: Download book web site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: book-web-site
          path: book/web/site
      - name: Place handbook PDF + ePub at _site/se-handbook
        run: |
          mkdir -p _site/se-handbook
          cp handbook/dist/software-engineering-handbook.pdf _site/se-handbook/software-engineering-handbook.pdf
          cp handbook/dist/software-engineering-handbook.epub _site/se-handbook/software-engineering-handbook.epub
          test -f _site/se-handbook/software-engineering-handbook.pdf || { echo "ERROR: handbook PDF missing from site artifact"; exit 1; }
          test -f _site/se-handbook/software-engineering-handbook.epub || { echo "ERROR: handbook ePub missing from site artifact"; exit 1; }
      - name: Assemble site artifact (exclude .git / node_modules / .github / raw course+site+handbook sources; KEEP book/mage-book.pdf + _site/teach + _site/se-handbook)
        run: |
          mkdir -p _site
          # `handbook` excludes the raw manuscript SOURCE (parity with course+site); the rendered handbook
          # PDF was already copied into _site/se-handbook above — rsync (no --delete) leaves it untouched.
          # `book/dist` holds LOCAL-ONLY review staples (not emitted in CI; excluded here as defense in
          # depth so a stray local artifact can never ride into the published site).
          # `book/web` is the generated MkDocs SOURCE tree of the MAGE book — excluded here because the
          # BUILT site (book/web/site) is copied into _site/book/mage-book/ by the publish step below;
          # the raw docs/ + mkdocs.yml must never ride into the artifact.
          # `/AGENTS.md` + `/book/AGENTS.md` are INTERNAL fleet playbooks (how this repo's own agents
          # run editorial folds) — committed files, so `.nojekyll` would serve them raw (both measured
          # 200 on the live site, 261006). Author's ruling: do not SHIP them; the files stay in the
          # repo because the fleet uses them. Anchored paths, not a bare basename: the skill bundle
          # under `plugin/` ships AGENTS.md files that are CONTENT and must keep publishing.
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='.github' \
                --exclude='__pycache__' --exclude='_site' --exclude='book/_print' \
                --exclude='book/_typst' --exclude='book/dist' --exclude='book/web' \
                --exclude='course' --exclude='site' --exclude='handbook' \
                --exclude='/AGENTS.md' --exclude='/book/AGENTS.md' ./ _site/
          # Hard-gate the exclusion (same discipline as the presence asserts below — an exclusion that
          # silently stops matching is how the playbooks went public in the first place).
          test ! -f _site/AGENTS.md || { echo "ERROR: AGENTS.md rode into the site artifact — it is an internal playbook, excluded by ruling (261006)"; exit 1; }
          test ! -f _site/book/AGENTS.md || { echo "ERROR: book/AGENTS.md rode into the site artifact — it is an internal playbook, excluded by ruling (261006)"; exit 1; }
          # …and gate the agent-facing index IN (generated by `catalog.py build` above; tracked, so it
          # rides in with the rsync — this catches a future exclusion or build regression).
          test -f _site/llms.txt || { echo "ERROR: llms.txt missing from site artifact — the agent-facing index is generated by catalog.py build"; exit 1; }
          test -f _site/robots.txt || { echo "ERROR: robots.txt missing from site artifact — generated by catalog.py build beside llms.txt"; exit 1; }
          PDF="book/$(python3 -c "import json; print(json.load(open('book/book-manifest.json'))['pdf_filename'])")"
          test -f "_site/$PDF" || { echo "ERROR: $PDF missing from site artifact"; exit 1; }
          EPUB="${PDF%.pdf}.epub"
          test -f "_site/$EPUB" || { echo "ERROR: $EPUB missing from site artifact"; exit 1; }
          # The two landing cover thumbnails are build-derived (tools/cover_assets.py) + gitignored —
          # derived above. Hard-gate them into the artifact so the landing can never ship thumbless
          # (a silently-skipped derivation is a red deploy).
          test -f _site/book/assets/cover-thumb.png || { echo "ERROR: book/assets/cover-thumb.png missing from site artifact"; exit 1; }
          test -f _site/book/assets/handbook-cover-thumb.png || { echo "ERROR: book/assets/handbook-cover-thumb.png missing from site artifact"; exit 1; }
          # The Model Workbench app shell + its build-derived bundle. The shell is tracked and rides in
          # with the rsync; the bundle is gitignored and arrived via the workbench-dist artifact above.
          # Hard-gate both: the landing links the shell, and a shell without its bundle is a 200 that
          # renders nothing — the same class of silent failure the PDF assertion above prevents.
          test -f _site/workbench/index.html || { echo "ERROR: workbench/index.html missing from site artifact"; exit 1; }
          test -f _site/workbench/dist/workbench.js || { echo "ERROR: workbench/dist/workbench.js missing from site artifact — the bundle did not ride into _site"; exit 1; }
          test -f _site/workbench/examples/docable.mage.yaml || { echo "ERROR: workbench example model missing from site artifact — the shell's 'Load the example' button fetches it"; exit 1; }
          # The shared MAGE design tokens + the favicon, both tracked under workbench/assets/ and both
          # <link>ed by index.html and learn.html. A missing stylesheet is the quietest failure on this
          # list: the page still returns 200 and still renders, with every custom property undefined —
          # unstyled black-on-white, no accent, no panels, and nothing in the log to say why.
          test -f _site/workbench/assets/mage-tokens.css || { echo "ERROR: workbench/assets/mage-tokens.css missing from site artifact — both pages would render with every design token undefined"; exit 1; }
          test -f _site/workbench/assets/favicon.svg || { echo "ERROR: workbench/assets/favicon.svg missing from site artifact — the pages link it as their icon"; exit 1; }
      # ── Publish the MAGE book at /book/mage-book/ + finish the /book/ layout ──────────────────
      # Copy the MkDocs-built book site (strict-built in web-editions) into its published home —
      # flat `<slug>.html` stems identical to the retired hand-rolled pages, so every pre-swap URL +
      # #anchor resolves unchanged. Then publish_book_layout.py finishes the layout: a static
      # meta-refresh stub at every legacy flat _site/book/<slug>.html URL (GitHub Pages has no
      # server redirects), the whole-book PDF + ePub copied in next to the pages, and the handbook
      # PDF + ePub copied into _site/book/se-handbook/. Stdlib-only; runs AFTER assemble so it
      # operates on the fully-populated _site tree. The chapter-page test pins URL continuity
      # across the C3 swap.
      - name: Publish MAGE book (MkDocs site -> /book/mage-book/) + legacy stubs + PDF/ePub homes
        run: |
          mkdir -p _site/book/mage-book
          cp -r book/web/site/. _site/book/mage-book/
          python3 tools/publish_book_layout.py _site
          test -f _site/book/mage-book/mage-book.pdf || { echo "ERROR: relocated book PDF missing"; exit 1; }
          test -f _site/book/mage-book/mage-book.epub || { echo "ERROR: relocated book ePub missing"; exit 1; }
          test -f _site/book/mage-book/index.html || { echo "ERROR: published book index missing"; exit 1; }
          test -f _site/book/mage-book/1.1-the-printer.html || { echo "ERROR: published chapter page missing (URL continuity broken)"; exit 1; }
          test -f _site/book/1.1-the-printer.html || { echo "ERROR: legacy-URL redirect stub missing"; exit 1; }
          test -f _site/book/se-handbook/software-engineering-handbook.pdf || { echo "ERROR: relocated handbook PDF missing"; exit 1; }
          test -f _site/book/se-handbook/software-engineering-handbook.epub || { echo "ERROR: relocated handbook ePub missing"; exit 1; }
      # ── Handbook WEB edition at /book/se-handbook/ ────────────────────────────────────────────
      # The handbook's MkDocs site (built in the handbook job — index.html + one page per chapter
      # with relative stable-stem cross-links like href="07-design.html") serves unchanged at any
      # base path. Copy it into the relocated /book/se-handbook/ home NEXT TO the handbook PDF
      # (`cp` merges into the existing dir; the trailing assertion guards the PDF against a
      # clobber). Chapters are then individually linkable at /book/se-handbook/<stem>.html. Runs
      # AFTER publish_book_layout.py so the copy targets the final published layout.
      - name: Publish handbook web site at _site/book/se-handbook/ (next to the PDF)
        run: |
          mkdir -p _site/book/se-handbook
          cp -r handbook/dist/site/. _site/book/se-handbook/
          test -f _site/book/se-handbook/index.html || { echo "ERROR: handbook web index missing from site artifact"; exit 1; }
          test -f _site/book/se-handbook/software-engineering-handbook.pdf || { echo "ERROR: handbook PDF missing after web copy"; exit 1; }
          test -f _site/book/se-handbook/software-engineering-handbook.epub || { echo "ERROR: handbook ePub missing after web copy"; exit 1; }
          # Standalone per-chapter PDFs (emitted by the handbook job's `make -C handbook book`)
          # publish NEXT TO the pages that link them (each chapter page's "Download this chapter
          # (PDF)" resolves to chapters/<stem>.pdf). Copied + asserted here — after
          # publish_book_layout.py, before the artifact upload — so nothing later can rewrite the
          # tree under them. The assertion derives the expected stem set from book.yaml (never a
          # hand-counted list), so a new chapter is asserted the moment it enters the book.
          mkdir -p _site/book/se-handbook/chapters
          cp handbook/dist/chapters/*.pdf _site/book/se-handbook/chapters/
          python3 - <<'EOF'
          import pathlib, yaml
          book = yaml.safe_load(open("handbook/book.yaml", encoding="utf-8"))
          stems = ["0-" + pathlib.Path(e["file"]).stem for e in book.get("frontmatter", [])
                   if "handbook" in (e.get("views") or [])]
          stems += [pathlib.Path(c).stem for c in book["chapters"]]
          missing = [s for s in stems
                     if not pathlib.Path(f"_site/book/se-handbook/chapters/{s}.pdf").is_file()]
          if missing:
              raise SystemExit(f"ERROR: handbook chapter PDFs missing from site artifact: {missing}")
          print(f"all {len(stems)} handbook chapter PDFs published at /book/se-handbook/chapters/")
          EOF
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    # Only the deploy job gets the deploy credentials (OIDC id-token + pages:write).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
