# Build the catalogue site from its markdown and deploy to GitHub Pages.
# Source = "GitHub Actions" (Settings → Pages). Running `catalog.py build` in CI is the
# "executable, can't-drift" build: the deployed HTML is regenerated from the .md on every push.
#
# Security posture (see DEVELOP.md § "Security analysis"):
#   - Triggers are trusted-only (push to main / manual dispatch). NO pull_request_target, so no
#     fork/PR can run this with the repo's token ("pwn request" class is designed out).
#   - No untrusted input is interpolated into any `run:` (no script-injection surface).
#   - Permissions are job-scoped: the `build` job (which runs third-party test code — axe-core + html-validate) holds
#     NO deploy/write capability; only the `deploy` job gets `pages: write` + `id-token: write`.
#   - Third-party test tooling is pinned: `npm ci` installs the exact tree in package-lock.json
#     (integrity-hash verified); axe + html-validate run via `npx --no-install` so they never fetch at run time.
#   - Every action is pinned to an immutable commit SHA (a tag like `v4` is movable; a SHA is not).
#   - The published artifact excludes `.git`, `node_modules`, and `.github` (nothing secret on a public
#     repo, but it keeps the deploy tree minimal and avoids serving node_modules).
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default (inherited) permissions: read-only. Each job narrows/adds from here.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The build job runs repo + third-party (axe-core) code. It deliberately has NO write/deploy
    # capability — only what it needs to check out and read Pages config.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # html-validate 11.x calls fs.globSync (added in Node 22). On Node 20 it throws at startup, the
          # T2 validity check catches it and SKIPs — so the HTML-validity gate silently doesn't run. Pin
          # the runner to 22 so html-validate actually executes.
          node-version: "22"
      - name: Install pinned test tooling (axe-core + html-validate, exact tree from lockfile)
        run: npm ci
      # book/ node tooling must be installed BEFORE `catalog.py build`: the build renders every ```mermaid
      # fence to a static inline SVG at build time via mermaid-cli (mmdc), which lives in book/node_modules.
      # `npm ci` in book/ also downloads mermaid-cli's + Puppeteer's bundled Chromium (no
      # PUPPETEER_SKIP_DOWNLOAD), needed for BOTH the SVG pre-render AND the served-page smoke gates
      # (responsive + console-error) below. The book PDF is rendered by Typst (installed separately below),
      # so no browser is in the PDF loop.
      - name: Install book node tooling (mermaid-cli for build-time SVG + Puppeteer for the served-page smoke gates, from book/ lockfile)
        working-directory: book
        run: npm ci
      # Typst backs BOTH the citation render (below) and the PDF print edition (further down), so install it
      # up front — the pinned release, clone-and-run-safe + reproducible (verify it extracts a runnable
      # binary, put it on PATH).
      - name: Install Typst (pinned release; renders citations + the print-native book PDF)
        run: |
          TYPST_VERSION=v0.15.1
          curl -fsSL "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          mkdir -p /tmp/typst && tar -xJf /tmp/typst.tar.xz -C /tmp/typst --strip-components=1
          sudo install -m 0755 /tmp/typst/typst /usr/local/bin/typst
          typst --version
      # Render the Chicago citation strings ONCE from references.bib (the SSOT) → book/data/citations.json,
      # which BOTH the HTML build (catalog.py build) and the PDF consume. Runs BEFORE the build that reads it,
      # the same "regenerate from source in CI" discipline the mermaid SVGs and the committed HTML follow. The
      # committed citations.json is the local cache; CI re-derives it so the published strings can never lag
      # references.bib (the CITE-FRESH gate in the test suite pins the two in sync either way).
      - name: Render citations (references.bib -> citations.json via Typst, chicago-notes)
        run: python3 book/render_citations.py
      - name: Validate schema
        run: python3 catalog.py validate
      - name: Render markdown -> HTML (renders ```mermaid fences to inline SVG via book/ mmdc)
        run: python3 catalog.py build
      - name: Test suite (blocking — authoritative --full run; post-push HEAD==origin, so incremental would skip Tier 2)
        run: python3 catalog_tests.py --full
      # ── PDF print edition (print-native Typst path) ─────────────────────────────────────────────
      # The book PDF is a CI-generated, Pages-published artifact (not committed). `--pdf` projects the
      # typed book IR to a Typst document and runs `typst compile` to book/mage-book.pdf, which the rsync
      # below copies into _site/ so it serves at /book/mage-book.pdf. It runs the content-integrity gate
      # internally — page floor/ceiling, every chapter + part title present, no-raw-mermaid, density, and a
      # tag-tree assertion — and exits non-zero (failing the build) if the render is truncated / collapsed /
      # runaway / ships raw diagram source / drops the a11y tag tree.
      #
      # Typst is already installed (up front, before the citation render). poppler (pdftotext / pdfinfo) backs
      # the content-integrity + tag-tree gates. qpdf runs a lossless object-stream repack after `typst compile`
      # (Typst emits ~20K uncompressed indirect objects, dominated by the a11y struct tree; the repack packs
      # them into compressed object streams, cutting the whole-book PDF by ~35% — ≈ 6.7 MB → 4.3 MB — with the
      # tag tree preserved). Without it the full-bleed rasterized cover pushes the PDF well over its size floor.
      - name: Install poppler + qpdf (pdftotext / pdfinfo back the content-integrity + tag-tree gates; qpdf does the lossless object-stream repack)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      # `--no-split`: the published site ships only the whole-book mage-book.pdf. `--pdf` is default-on-split
      # LOCALLY (per-section review PDFs); CI is already covered by the GITHUB_ACTIONS env gate, and `--no-split`
      # states full-only explicitly at the call site so CI never pays the per-section compile cost.
      - name: Render book PDF (print-native Typst) + content-integrity gate
        run: python3 book/build_book.py --pdf --no-split
      # ── Responsive-layout gate (deploy-blocking) ────────────────────────────────────────────────
      # Assert the landing `.masonry` region renders a structurally different layout at wide vs phone
      # width (>= 3 columns at 2560px, exactly 1 column at 390px) — the author's success metric made
      # mechanical. Needs a browser (headless Chrome), so it can't live in stdlib-only `catalog.py
      # validate`; it reuses the book/ Puppeteer + bundled Chromium already installed above. A
      # regression that flattens the masonry to a single column fails the deploy here.
      - name: Responsive-layout gate (landing wide != phone)
        run: python3 catalog.py check-responsive
      # ── Console-error gate (deploy-blocking) ────────────────────────────────────────────────────
      # Load EVERY served HTML page in headless Chrome and fail the deploy on any pageerror (uncaught
      # exception / unhandled rejection) or console.error — catches JS-runtime defects (script-ordering
      # races like an iframe onload firing before its handler is defined, failed fetches, missing
      # subresources) that the structural gates (validate / axe / html-validate) cannot see. Reuses the
      # book/ Puppeteer + bundled Chromium already installed above.
      - name: Console-error gate (no pageerror / console.error on any served page)
        run: python3 catalog.py check-console
      - name: Assemble site artifact (exclude .git / node_modules / .github; KEEP book/mage-book.pdf)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='.github' \
                --exclude='__pycache__' --exclude='_site' --exclude='book/_print' \
                --exclude='book/_typst' ./ _site/
          PDF="book/$(python3 -c "import json; print(json.load(open('book/book-manifest.json'))['pdf_filename'])")"
          test -f "_site/$PDF" || { echo "ERROR: $PDF missing from site artifact"; exit 1; }
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job gets the deploy credentials (OIDC id-token + pages:write).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
