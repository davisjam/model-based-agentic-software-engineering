<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360.0 220.3" width="360.0" height="220.3" role="group" aria-labelledby="jlTitle jlDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="jlTitle">The remediation job lifecycle — explicit states, and a failure terminal with no re-entry</title>
  <desc id="jlDesc">A remediation job descends a fixed column of states: QUEUED, then CLAIMED, then PLAN
    and DISPATCH, then WAITING, then MERGING, then FINALIZING, then COMPLETED. Every active state also
    routes to a single terminal state, FAILED. FAILED has no edge back into processing:
    a failed job surfaces, it does not quietly re-enter the pipeline. The legal transitions are an
    enforcement mechanism — one guarded operator is the only writer of state, and it refuses any edge the
    table does not list. Failure is a dead end, not a detour.</desc>
  <defs>
    <marker id="jl-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2825"/>
    </marker>
    <marker id="jl-arR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="360.0" height="220.3" fill="#fdfcf9"/>
  <text x="180.0" y="18.0" text-anchor="middle" font-size="15.0" font-weight="700" fill="#57534e">Question: Which transitions exist — and which do not?</text>
  <rect id="queued" x="0.0" y="26.0" width="173.0" height="25.0" rx="6" fill="#f6f4ef" stroke="#2b2825" stroke-width="1.8"/>
  <text x="86.5" y="43.8" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1c1917">QUEUED</text>
  <line x1="86.5" y1="51.0" x2="86.5" y2="57.0" stroke="#2b2825" stroke-width="1.8" marker-end="url(#jl-ar)"/>
  <rect id="claimed" x="0.0" y="57.0" width="173.0" height="25.0" rx="6" fill="#f6f4ef" stroke="#2b2825" stroke-width="1.8"/>
  <text x="86.5" y="74.8" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1c1917">CLAIMED</text>
  <line x1="86.5" y1="82.0" x2="86.5" y2="88.0" stroke="#2b2825" stroke-width="1.8" marker-end="url(#jl-ar)"/>
  <rect id="plan-dispatch" x="0.0" y="88.0" width="173.0" height="25.0" rx="6" fill="#f6f4ef" stroke="#2b2825" stroke-width="1.8"/>
  <text x="86.5" y="105.8" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1c1917">PLAN + DISPATCH</text>
  <line x1="86.5" y1="113.0" x2="86.5" y2="119.0" stroke="#2b2825" stroke-width="1.8" marker-end="url(#jl-ar)"/>
  <rect id="waiting" x="0.0" y="119.0" width="173.0" height="25.0" rx="6" fill="#f6f4ef" stroke="#2b2825" stroke-width="1.8"/>
  <text x="86.5" y="136.8" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1c1917">WAITING</text>
  <path d="M86.5,144.0 L86.5,153.0 L180.0,153.0 L180.0,38.5 L185.0,38.5" fill="none" stroke="#2b2825" stroke-width="1.8" marker-end="url(#jl-ar)"/>
  <rect id="merging" x="187.0" y="26.0" width="173.0" height="25.0" rx="6" fill="#f6f4ef" stroke="#2b2825" stroke-width="1.8"/>
  <text x="273.5" y="43.8" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1c1917">MERGING</text>
  <line x1="273.5" y1="51.0" x2="273.5" y2="57.0" stroke="#2b2825" stroke-width="1.8" marker-end="url(#jl-ar)"/>
  <rect id="finalizing" x="187.0" y="57.0" width="173.0" height="25.0" rx="6" fill="#f6f4ef" stroke="#2b2825" stroke-width="1.8"/>
  <text x="273.5" y="74.8" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1c1917">FINALIZING</text>
  <line x1="273.5" y1="82.0" x2="273.5" y2="88.0" stroke="#2b2825" stroke-width="1.8" marker-end="url(#jl-ar)"/>
  <rect id="completed" x="187.0" y="88.0" width="173.0" height="25.0" rx="6" fill="#f6f4ef" stroke="#155c38" stroke-width="2.4"/>
  <text x="273.5" y="105.8" text-anchor="middle" font-size="15.0" font-weight="700" fill="#1c1917">COMPLETED</text>
  <rect id="failed" x="140.1" y="169.0" width="79.9" height="25.0" rx="6" fill="#fbeaea" stroke="#b23b3b" stroke-width="2.2"/>
  <text x="180.0" y="186.8" text-anchor="middle" font-size="15.0" font-weight="700" fill="#b23b3b">FAILED</text>
  <line x1="8.0" y1="158.0" x2="352.0" y2="158.0" stroke="#d9b3ae" stroke-width="1.6"/>
  <line x1="8.0" y1="144.0" x2="8.0" y2="158.0" stroke="#d9b3ae" stroke-width="1.6"/>
  <line x1="195.0" y1="113.0" x2="195.0" y2="158.0" stroke="#d9b3ae" stroke-width="1.6"/>
  <line x1="180.0" y1="158.0" x2="180.0" y2="168.0" stroke="#b23b3b" stroke-width="1.8" marker-end="url(#jl-arR)"/>
  <text x="0.0" y="186.8" font-size="15.0" fill="#b23b3b">any active state</text>
  <text x="180.0" y="212.0" text-anchor="middle" font-size="15.0" fill="#b23b3b">terminal — no re-entry into processing</text>
</svg>
