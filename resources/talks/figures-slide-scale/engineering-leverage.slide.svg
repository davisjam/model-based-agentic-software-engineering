  <line x1="260.6" y1="180.0" x2="646.2" y2="203.0" stroke="#a8a29e" stroke-width="1.1" stroke-dasharray="3 4"/>
  <rect x="26.2" y="203.0" width="620.0" height="70.5" rx="9" fill="#eef7f0" stroke="#1f7a4d" stroke-width="1.8"/>
  <text x="336.2" y="224.5" text-anchor="middle" font-size="16.0" font-weight="700" fill="#155c38">Governed Engineering Environment</text>
  <text x="336.2" y="244.0" text-anchor="middle" font-size="16.0" font-style="italic" fill="#57534e">the engineered instructions around autonomous realization</text>
  <text x="336.2" y="263.5" text-anchor="middle" font-size="16.0" fill="#57534e">models · obligations · evidence · controls · infrastructure</text>
