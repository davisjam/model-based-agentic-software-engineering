<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672.5 276.5" width="672.5" height="276.5" role="img" aria-labelledby="levTitle levDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="levTitle">Where engineering leverage acts</title>
  <desc id="levDesc">Two pipelines are stacked for contrast. In the classical pipeline the engineer builds
    the implementation directly, so the implementation is the primary engineered object: Engineer, then
    Implementation, then Product. In the agentic pipeline agents build the implementation inside an
    engineered environment the engineer constructs, so the environment becomes the primary engineered
    lever: Engineer, then Engineered Environment, then Agents, then Implementation, then Product. A rust
    badge marks the primary node in each row; it moves upstream from the implementation to the environment.
    A footer strip unpacks the environment into models, obligations, evidence, controls, and
    infrastructure.</desc>
  <defs>
    <marker id="lev-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="672.5" height="276.5" fill="#fdfcf9"/>
  <rect x="0" y="0" width="672.5" height="26.0" fill="#f6f4ef"/>
  <text x="336.2" y="18.2" text-anchor="middle" font-size="18.0" font-weight="700" letter-spacing="1.8" fill="#1c1917">WHERE ENGINEERING LEVERAGE ACTS</text>
  <text x="6" y="48.0" font-size="16.0" font-weight="700" letter-spacing="1.4" fill="#57534e">CLASSICAL</text>
  <text x="106.4" y="48.0" font-size="16.0" font-style="italic" fill="#57534e">engineer writes the implementation</text>
  <path d="M227.1,72.0 L263.1,72.0" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#lev-k)"/>
  <path d="M418.5,72.0 L454.5,72.0" fill="none" stroke="#57534e" stroke-width="2.2" marker-end="url(#lev-k)"/>
