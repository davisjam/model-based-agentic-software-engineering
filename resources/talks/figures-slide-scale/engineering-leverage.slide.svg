  <rect id="c-impl" x="267.1" y="54.0" width="145.4" height="36.0" rx="7" fill="#f3efe7" stroke="#9a3f12" stroke-width="3.0"/>
  <text x="339.8" y="78.0" text-anchor="middle" font-size="17.0" font-weight="700" fill="#1c1917">Implementation</text>
  <rect id="c-product" x="458.5" y="56.0" width="83.8" height="32.0" rx="7" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="500.4" y="78.0" text-anchor="middle" font-size="17.0" font-weight="700" fill="#1c1917">Product</text>
  <text x="339.8" y="104.0" text-anchor="middle" font-size="16.0" font-weight="700" fill="#9a3f12">primary engineered object</text>
