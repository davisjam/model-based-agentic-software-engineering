<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672.5 231.8" width="672.5" height="231.8" role="img" aria-labelledby="srTitle srDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="srTitle">Obligation, scaffolding, and degrees of freedom</title>
  <desc id="srDesc">A stacked diagram. The specified region groups two layers: the engineering
    obligation, holding consequential distinctions that must be preserved, and scaffolding, the
    additional structure this agent needs to interpret and satisfy the obligation reliably. The
    obligation boundary between them is set by the engineering problem and does not move with
    capability. The specification boundary below the scaffolding is set by the obligation and by this
    agent's capability. Below it sit the degrees of freedom: implementation choices left to the agent.
    An upward arrow shows that greater agent capability can reduce required scaffolding.</desc>
  <defs>
    <marker id="sr-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5169"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="672.5" height="231.8" fill="#fdfcf9"/>
  <rect x="112.0" y="4.1" width="377.0" height="164.9" rx="11" fill="#f6f4ef" stroke="#57534e" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="300.5" y="22.9" text-anchor="middle" font-size="15.75" font-weight="700" letter-spacing="1.1" fill="#57534e">SPECIFIED REGION</text>
  <rect id="engineering-obligation" x="122.0" y="26.9" width="357.0" height="50.6" rx="8" fill="#faf1e6" stroke="#9a3f12" stroke-width="2"/>
  <text x="300.5" y="48.4" text-anchor="middle" font-size="17.75" font-weight="700" fill="#9a3f12">ENGINEERING OBLIGATION</text>
  <text x="300.5" y="67.3" text-anchor="middle" font-size="15.75" fill="#57534e">consequential distinctions that must be preserved</text>
  <rect id="scaffolding" x="122.0" y="92.5" width="357.0" height="69.5" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2"/>
  <text x="300.5" y="114.1" text-anchor="middle" font-size="17.75" font-weight="700" fill="#2f5169">SCAFFOLDING</text>
  <text x="300.5" y="133.0" text-anchor="middle" font-size="15.75" fill="#57534e">additional structure this agent needs to interpret</text>
  <text x="300.5" y="151.9" text-anchor="middle" font-size="15.75" fill="#57534e">and satisfy the obligation reliably</text>
  <rect id="degrees-of-freedom" x="122.0" y="177.1" width="357.0" height="50.6" rx="8" fill="#fdfcf9" stroke="#57534e" stroke-width="2"/>
  <text x="300.5" y="198.6" text-anchor="middle" font-size="17.75" font-weight="700" fill="#57534e">DEGREES OF FREEDOM</text>
  <text x="300.5" y="217.5" text-anchor="middle" font-size="15.75" fill="#57534e">implementation choices left to the agent</text>
  <line x1="122.0" y1="85.0" x2="479.0" y2="85.0" stroke="#9a3f12" stroke-width="1.6"/>
  <line x1="112.0" y1="169.6" x2="489.0" y2="169.6" stroke="#1c1917" stroke-width="2.4"/>
  <line x1="479.0" y1="85.0" x2="488.0" y2="85.0" stroke="#9a3f12" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="489.0" y1="169.6" x2="488.0" y2="169.6" stroke="#1c1917" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="493.0" y="61.0" font-size="15.75" font-weight="700" fill="#9a3f12">obligation boundary</text>
  <text x="493.0" y="79.8" font-size="15.75" fill="#57534e">set by the engineering</text>
  <text x="493.0" y="98.8" font-size="15.75" fill="#57534e">problem; does not move</text>
  <text x="493.0" y="117.7" font-size="15.75" fill="#57534e">with capability</text>
  <text x="493.0" y="155.0" font-size="15.75" font-weight="700" fill="#1c1917">specification boundary</text>
  <text x="493.0" y="173.9" font-size="15.75" fill="#57534e">set by the obligation and</text>
  <text x="493.0" y="192.8" font-size="15.75" fill="#57534e">by this agent's capability</text>
  <line x1="116.0" y1="173.1" x2="116.0" y2="100.5" stroke="#2f5169" stroke-width="2" marker-end="url(#sr-a)"/>
  <text x="102.0" y="137.4" text-anchor="end" font-size="15.75" fill="#57534e">greater agent</text>
  <text x="102.0" y="156.3" text-anchor="end" font-size="15.75" fill="#57534e">capability can</text>
  <text x="102.0" y="175.2" text-anchor="end" font-size="15.75" fill="#57534e">reduce</text>
  <text x="102.0" y="194.1" text-anchor="end" font-size="15.75" fill="#57534e">required</text>
  <text x="102.0" y="213.0" text-anchor="end" font-size="15.75" fill="#57534e">scaffolding</text>
</svg>
