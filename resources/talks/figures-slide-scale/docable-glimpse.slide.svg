<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442.8 180.0" width="442.8" height="180.0" role="group" aria-labelledby="dgTitle dgDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="dgTitle">A running glimpse of DocAble — one object in, one object back</title>
  <desc id="dgDesc">A single input-to-output panel with no internal structure. On the left, an inaccessible
    document: a page with unlabeled images, no reading order, and no tags, marked not accessible. An arrow
    labelled the upload leads into DocAble, drawn as one closed box — the production system at
    scholaccess.com — with a note that this shows what it does, not yet how. An arrow labelled the file,
    remediated leads out to the right, to an accessible document with described images, reading order, and
    tags, carrying an evidence record in which every fix is explained. The caption reads: here is the kind
    of production system these ideas govern — what it does, not yet how.</desc>
  <defs>
    <marker id="dg-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="442.8" height="180.0" fill="#fdfcf9"/>
  <text x="221.4" y="16.2" text-anchor="middle" font-size="16.0" font-weight="700" fill="#1c1917">A running glimpse of DocAble</text>
  <text x="221.4" y="32.8" text-anchor="middle" font-size="13.0" font-style="italic" fill="#57534e">One object in, one object back.</text>
  <rect id="dg-input" x="0.0" y="38.8" width="80.1" height="79.4" rx="5" fill="#ffffff" stroke="#b23b3b" stroke-width="2.2"/>
  <rect x="7.0" y="44.8" width="32.0" height="2.6" rx="1.2" fill="#cfc9c0"/>
  <rect x="7.0" y="49.4" width="41.6" height="2.6" rx="1.2" fill="#cfc9c0"/>
  <rect x="7.0" y="54.0" width="24.0" height="2.6" rx="1.2" fill="#cfc9c0"/>
  <rect x="5.0" y="60.1" width="70.1" height="34.2" rx="2.5" fill="#f6f4ef" stroke="#b23b3b" stroke-width="1.1" stroke-dasharray="3.5 2.5"/>
  <text x="40.0" y="72.3" text-anchor="middle" font-size="13.0" font-style="italic" fill="#b23b3b">image — no</text>
  <text x="40.0" y="87.9" text-anchor="middle" font-size="13.0" font-style="italic" fill="#b23b3b">alt text</text>
  <rect x="4.0" y="95.6" width="72.0" height="33.2" rx="8.8" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.1"/>
  <text x="40.0" y="107.5" text-anchor="middle" font-size="13.0" font-weight="700" fill="#b23b3b">not</text>
  <text x="40.0" y="123.1" text-anchor="middle" font-size="13.0" font-weight="700" fill="#b23b3b">accessible</text>
  <rect id="dg-output" x="362.7" y="38.8" width="80.1" height="79.4" rx="5" fill="#ffffff" stroke="#1f7a4d" stroke-width="2.2"/>
  <rect x="369.7" y="44.8" width="32.0" height="2.6" rx="1.2" fill="#57534e"/>
  <rect x="369.7" y="49.4" width="41.6" height="2.6" rx="1.2" fill="#57534e"/>
  <rect x="369.7" y="54.0" width="24.0" height="2.6" rx="1.2" fill="#57534e"/>
  <rect x="367.7" y="60.1" width="70.1" height="34.2" rx="2.5" fill="#eef7ee" stroke="#1f7a4d" stroke-width="1.1"/>
  <text x="402.8" y="72.3" text-anchor="middle" font-size="13.0" font-style="italic" fill="#1f7a4d">image —</text>
  <text x="402.8" y="87.9" text-anchor="middle" font-size="13.0" font-style="italic" fill="#1f7a4d">described</text>
  <rect x="364.7" y="95.6" width="76.1" height="33.2" rx="8.8" fill="#e3f0e7" stroke="#1f7a4d" stroke-width="1.1"/>
  <text x="402.8" y="107.5" text-anchor="middle" font-size="13.0" font-weight="700" fill="#1f7a4d">✓ evidence</text>
  <text x="402.8" y="123.1" text-anchor="middle" font-size="13.0" font-weight="700" fill="#1f7a4d">record</text>
  <rect id="dg-docable" x="151.5" y="51.6" width="139.7" height="63.6" rx="9" fill="#e7edf3" stroke="#2f5169" stroke-width="2.6"/>
  <text x="221.4" y="73.4" text-anchor="middle" font-size="16.0" font-weight="700" fill="#2f5169">DocAble</text>
  <text x="221.4" y="89.0" text-anchor="middle" font-size="13.0" font-style="italic" fill="#57534e">the production system</text>
  <text x="221.4" y="104.6" text-anchor="middle" font-size="13.0" fill="#57534e">scholaccess.com</text>
  <path d="M83.1,83.4 L148.5,83.4" fill="none" stroke="#1c1917" stroke-width="2.2" marker-end="url(#dg-ah)"/>
  <text x="115.8" y="77.4" text-anchor="middle" font-size="13.0" font-style="italic" fill="#57534e">upload</text>
  <path d="M294.3,83.4 L359.7,83.4" fill="none" stroke="#1c1917" stroke-width="2.2" marker-end="url(#dg-ah)"/>
  <text x="327.0" y="61.8" text-anchor="middle" font-size="13.0" font-style="italic" fill="#57534e">remediated</text>
  <text x="327.0" y="77.4" text-anchor="middle" font-size="13.0" font-style="italic" fill="#57534e">file</text>
  <text x="108.2" y="144.7" text-anchor="middle" font-size="13.0" font-weight="700" fill="#b23b3b">inaccessible document</text>
  <text x="108.2" y="160.3" text-anchor="middle" font-size="13.0" font-style="italic" fill="#57534e">unlabeled images · untagged · no</text>
  <text x="108.2" y="175.9" text-anchor="middle" font-size="13.0" font-style="italic" fill="#57534e">reading order</text>
  <text x="334.6" y="144.7" text-anchor="middle" font-size="13.0" font-weight="700" fill="#1f7a4d">accessible document + evidence</text>
  <text x="334.6" y="160.3" text-anchor="middle" font-size="13.0" font-style="italic" fill="#57534e">tagged · reading order · every fix</text>
  <text x="334.6" y="175.9" text-anchor="middle" font-size="13.0" font-style="italic" fill="#57534e">explained</text>
</svg>
