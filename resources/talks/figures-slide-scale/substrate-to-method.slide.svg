<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672.5 272.2" width="672.5" height="272.2" role="img" aria-labelledby="smTitle smDesc" font-family="'Source Sans 3', -apple-system, 'Segoe UI', sans-serif">
  <title id="smTitle">From substrate to method</title>
  <desc id="smDesc">Two derivations run left to right. In the first, a finite working state raises the
    representation problem, which the method of modeling answers. In the second, probabilistic productive
    work over observable, interposable seams raises the enforcement problem, which the method of alignment
    answers. These are the two core activities Chapter 1 derives; Chapter 4 puts them in motion as the MAGE method.</desc>
  <defs>
    <marker id="sm-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="672.5" height="272.2" fill="#fdfcf9"/>
  <text x="336.2" y="25.8" text-anchor="middle" font-size="19.75" font-weight="700" fill="#1c1917">From substrate to method</text>
  <text x="114.6" y="54.5" text-anchor="middle" font-size="16.75" font-weight="700" letter-spacing="1.3" fill="#57534e">SUBSTRATE TRAIT</text>
  <text x="348.3" y="54.5" text-anchor="middle" font-size="16.75" font-weight="700" letter-spacing="1.3" fill="#9a3f12">PROBLEM</text>
  <text x="570.0" y="54.5" text-anchor="middle" font-size="16.75" font-weight="700" letter-spacing="1.3" fill="#155c38">METHOD</text>
  <line x1="232.8" y1="105.8" x2="249.8" y2="105.8" stroke="#57534e" stroke-width="2.2" marker-end="url(#sm-k)"/>
  <line x1="446.9" y1="105.8" x2="463.9" y2="105.8" stroke="#57534e" stroke-width="2.2" marker-end="url(#sm-k)"/>
  <rect id="trait-a" x="0.5" y="87.4" width="228.3" height="36.9" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2.0"/>
  <text x="114.6" y="111.4" text-anchor="middle" font-size="15.75" fill="#1c1917">finite working state</text>
  <rect id="representation-problem" x="253.8" y="87.4" width="189.2" height="36.9" rx="8" fill="#fbeee6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="348.3" y="111.4" text-anchor="middle" font-size="15.75" font-weight="700" fill="#9a3f12">Representation problem</text>
  <rect id="modeling" x="467.9" y="68.5" width="204.1" height="74.7" rx="8" fill="#e7edf3" stroke="#2f5169" stroke-width="2.8"/>
  <text x="570.0" y="92.5" text-anchor="middle" font-size="16.75" font-weight="700" fill="#1c1917">Modeling</text>
  <text x="570.0" y="111.4" text-anchor="middle" font-size="15.75" fill="#57534e">represent relevant</text>
  <text x="570.0" y="130.3" text-anchor="middle" font-size="15.75" fill="#57534e">properties compactly</text>
  <line x1="232.8" y1="191.1" x2="249.8" y2="191.1" stroke="#57534e" stroke-width="2.2" marker-end="url(#sm-k)"/>
  <line x1="446.9" y1="191.1" x2="463.9" y2="191.1" stroke="#57534e" stroke-width="2.2" marker-end="url(#sm-k)"/>
  <rect id="trait-b" x="0.5" y="163.2" width="228.3" height="55.8" rx="8" fill="#f6f4ef" stroke="#57534e" stroke-width="2.0"/>
  <text x="114.6" y="187.2" text-anchor="middle" font-size="15.75" fill="#1c1917">probabilistic productive work</text>
  <text x="114.6" y="206.1" text-anchor="middle" font-size="15.75" fill="#1c1917">observable, interposable seams</text>
  <rect id="authority-problem" x="253.8" y="172.6" width="189.2" height="36.9" rx="8" fill="#fbeee6" stroke="#9a3f12" stroke-width="2.6"/>
  <text x="348.3" y="196.6" text-anchor="middle" font-size="15.75" font-weight="700" fill="#9a3f12">Enforcement problem</text>
  <rect id="alignment" x="467.9" y="163.2" width="204.1" height="55.8" rx="8" fill="#e3f0e7" stroke="#155c38" stroke-width="2.8"/>
  <text x="570.0" y="187.2" text-anchor="middle" font-size="16.75" font-weight="700" fill="#155c38">Alignment</text>
  <text x="570.0" y="206.1" text-anchor="middle" font-size="15.75" fill="#57534e">enforce selected obligations</text>
  <text x="336.2" y="248.8" text-anchor="middle" font-size="15.75" font-style="italic" fill="#57534e">Chapter 1 derives the two core activities; Chapter 4 puts them in motion as the MAGE method.</text>
</svg>
