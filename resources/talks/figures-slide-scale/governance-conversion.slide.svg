  <text x="336.2" y="197.9" text-anchor="middle" font-size="16.25" font-weight="700" fill="#2f5137">FUTURE WORK BENEFITS FROM INHERITING IT</text>
  <line x1="336.2" y1="208.0" x2="336.2" y2="215.0" stroke="#2f5169" stroke-width="2" marker-end="url(#gc-ah)"/>
  <rect id="gc-capital" x="227.1" y="216.0" width="218.3" height="31.5" rx="9" fill="#3d6b4a" stroke="#2f5137" stroke-width="2.0"/>
  <text x="336.2" y="237.8" text-anchor="middle" font-size="17.25" font-weight="700" fill="#ffffff">ENGINEERING CAPITAL</text>
  <text x="336.2" y="268.8" text-anchor="middle" font-size="16.25" font-style="italic" fill="#57534e">a failure is not a request for another gate — diagnose what was missing, then encode it</text>
